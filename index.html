function save(key) {
  const map = {products:'dtn_products',imports:'dtn_imports',sales:'dtn_sales',shipping:'dtn_shipping',settings:'dtn_settings',returns:'dtn_returns',paymentlogs:'dtn_paymentlogs'};
  if (map[key]) {
    const ok = DB.set(map[key], S[key]);
    if (!ok) {
      // Lưu thất bại — cảnh báo nghiêm trọng
      S._saveError = true;
      toast('🚨 KHÔNG THỂ LƯU! Bộ nhớ thiết bị đầy. Hãy xuất backup JSON ngay!', 'error');
      render();
      return;
    }
    S._saveError = false;
  }
  // Push lên Firebase NGAY LẬP TỨC sau khi localStorage đã ghi xong
  if (typeof CLOUD !== 'undefined') CLOUD.push(key, S);

  // Auto-backup + archive chạy sau (không ảnh hưởng sync tốc độ)
  clearTimeout(save._timer);
  save._timer = setTimeout(() => {
    // Kiểm tra ngưỡng và auto-archive nếu nguy hiểm
    const warn = DB.storageWarning();
    if (warn === 'danger') {
      const result = DB.archiveOldData();
      if (result.archivedSales > 0 || result.archivedImports > 0) {
        toast(`🗂️ Đã archive ${result.archivedSales} đơn hàng và ${result.archivedImports} phiếu nhập cũ hơn 12 tháng để giải phóng bộ nhớ.`, 'info');
        S.sales   = DB.get('dtn_sales',   S.sales);
        S.imports = DB.get('dtn_imports',  S.imports);
        S.paymentlogs = DB.get('dtn_paymentlogs', S.paymentlogs);
        render();
      }
    }
    DB.autoBackup();
    // 3-2-1: slot 2 — 30 phút xoay vòng
    CLOUD.runDailyBackup(() => DB.exportCompact());
  }, 3000);
}

// ── Soft-delete: push _deleted record lên cloud, lọc local NGAY
function softDelete(arrayKey, id, extraFn) {
  const now = new Date().toISOString();
  if (!S[arrayKey]) return;
  // Tạo bản _deleted để push lên cloud trước khi filter
  const withDeleted = S[arrayKey].map(r => r.id === id ? { ...r, _deleted: true, _updated: now } : r);
  // Lọc sạch local NGAY LẬP TỨC để UI phản ánh đúng
  S[arrayKey] = withDeleted.filter(r => !r._deleted);
  const dbMap = {products:'dtn_products',imports:'dtn_imports',sales:'dtn_sales',returns:'dtn_returns',paymentlogs:'dtn_paymentlogs'};
  if (dbMap[arrayKey]) DB.set(dbMap[arrayKey], S[arrayKey]);
  if (typeof extraFn === 'function') extraFn();
  // Push lên cloud: dùng withDeleted (có _deleted:true) để thiết bị khác nhận lệnh xóa
  if (typeof CLOUD !== 'undefined' && CLOUD._pushDeletedRecord) {
    CLOUD._pushDeletedRecord(dbMap[arrayKey], withDeleted);
  } else if (typeof CLOUD !== 'undefined') {
    // Fallback: push toàn bộ array hiện tại (không có _deleted, cloud sẽ không xóa trên thiết bị khác ngay)
    CLOUD.push(arrayKey, S);
  }
}

  function hStyle(bgHex) {
    return {

      fill: { fgColor: { rgb: bgHex }, patternType: 'solid' },
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      border: {
        top:    { style: 'thin', color: { rgb: 'CCCCCC' } },
        bottom: { style: 'thin', color: { rgb: 'CCCCCC' } },
        left:   { style: 'thin', color: { rgb: 'CCCCCC' } },
        right:  { style: 'thin', color: { rgb: 'CCCCCC' } }
      }
    };
  }
  function dStyle(align) {
    return {
      font: { name: 'Arial', sz: 10 },
      alignment: { horizontal: align || 'left', vertical: 'center' },
      border: {
        top:    { style: 'hair', color: { rgb: 'EEEEEE' } },
        bottom: { style: 'hair', color: { rgb: 'EEEEEE' } },
        left:   { style: 'hair', color: { rgb: 'EEEEEE' } },
        right:  { style: 'hair', color: { rgb: 'EEEEEE' } }

  function numFmt(n) { return isNaN(n) ? 0 : Math.round(n); }

  // Tạo workbook
  const wb = XLSX.utils.book_new();

  // ─── 1. SHEET: KHO HÀNG ───────────────────────────────────────

    const invHeaders = ['Tên sản phẩm','Loại đá','Xuất xứ','Đơn vị','Giá nhập (đ)','Giá bán (đ)','Tồn kho','Giá trị kho (đ)','Mô tả'];
    const invRows = products.map(p => [
      p.name || '',
      p.type || '',
      p.origin || '',
      p.unit || '',
      numFmt(p.buyPrice),
      numFmt(p.sellPrice),
      parseFloat(p.stock) || 0,
      numFmt((parseFloat(p.stock)||0) * (p.buyPrice||0)),
      p.description || ''
    ]);

    // Thêm dòng tổng
    const totalKhoVal = products.reduce((a,p) => a + (parseFloat(p.stock)||0)*(p.buyPrice||0), 0);
    invRows.push(['TỔNG CỘNG','','','','','',
      products.reduce((a,p) => a + (parseFloat(p.stock)||0), 0),

    ]);

    const ws = XLSX.utils.aoa_to_sheet([]);
    // Tiêu đề file
    XLSX.utils.sheet_add_aoa(ws, [
      [shop + ' — BÁO CÁO KHO HÀNG'],
      ['Ngày xuất: ' + fmtD(dateStr)],
      [],
      invHeaders,

    ]);

    // Style tiêu đề chính
    ws['A1'] = { v: shop + ' — BÁO CÁO KHO HÀNG', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: GOLD } } } };
    ws['A2'] = { v: 'Ngày xuất: ' + fmtD(dateStr), t: 's', s: { font: { italic: true, sz: 10, name: 'Arial', color: { rgb: '888888' } } } };

    // Style header row (row 4 = index 3)
    invHeaders.forEach((_, ci) => {

  // ─── 4. SHEET: CÔNG NỢ ──────────────────────────────────────

        fmtD(i.date), i.supplier||'', i.productName||'',
        numFmt(i.total), numFmt(i.paid),
        numFmt((i.total||0)-(i.paid||0)),

    ws4['A4'] = { v: '🔴 CÔNG NỢ KHÁCH HÀNG — ' + debtSales.length + ' đơn chưa thu — Tổng: ' + fmt(totCustDebt) + 'đ', t: 's',

    custHeaders.forEach((_, ci) => {

    const suppLabelRow = 4 + custRows.length + 2;
    if (ws4['A' + (suppLabelRow + 1)]) {
      ws4['A' + (suppLabelRow + 1)].s = { font: { bold: true, sz: 11, name: 'Arial', color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: 'E07010' }, patternType: 'solid' } };
    }

    ws4['!cols'] = [{wch:12},{wch:22},{wch:13},{wch:25},{wch:16},{wch:14},{wch:16},{wch:10}];
    ws4['!merges'] = [
      { s:{r:0,c:0}, e:{r:0,c:7} },
      { s:{r:1,c:0}, e:{r:1,c:7} },
      { s:{r:3,c:0}, e:{r:3,c:7} },
      { s:{r:suppLabelRow,c:0}, e:{r:suppLabelRow,c:6} }

    ws4['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:suppLabelRow+1+suppRows.length,c:7} });
    XLSX.utils.book_append_sheet(wb, ws4, '💳 Công nợ');
  }

  // ─── 5. SHEET: TRẢ HÀNG ─────────────────────────────────────
  if (sheetChoice === 'all' && returns && returns.length > 0) {
    const rHeaders = ['Ngày trả','Khách hàng','SĐT','Sản phẩm','SL trả','Đơn vị','Đơn giá (đ)','Giá trị hoàn (đ)','Lý do'];
    const rRows = [...returns].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r => [

    rRows.push(['TỔNG CỘNG','','','',returns.reduce((a,r)=>a+(parseFloat(r.returnQty)||0),0),'','',numFmt(totRef),'']);

    const ws5 = XLSX.utils.aoa_to_sheet([]);

    ]);

    rRows.forEach((row, ri) => {
      row.forEach((_, ci) => {
        const ca = XLSX.utils.encode_cell({ r: 4 + ri, c: ci });

        ws5[ca].s = ri === rRows.length-1
          ? { font: { bold: true, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: 'F3E5F5' }, patternType: 'solid' } }

    ws5['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:8} }, { s:{r:1,c:0}, e:{r:1,c:8} }];
    ws5['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:4+rRows.length-1,c:8} });
    XLSX.utils.book_append_sheet(wb, ws5, '🔄 Trả hàng');
  }

  // ─── Tải file xuống ──────────────────────────────────────────
  const sheetNames = { all:'ToanBo', inventory:'KhoHang', sales:'BanHang', imports:'NhapHang', debt:'CongNo' };
  const filename = shop.replace(/\s/g,'') + '_' + sheetNames[sheetChoice] + '_' + dateStr.replace(/-/g,'') + '.xlsx';
  XLSX.writeFile(wb, filename);
  toast('✅ Đã xuất Excel: ' + filename, 'success');
}

// ═══════════════════════════════════════════════════════════════
//  DOM HELPERS
// ═══════════════════════════════════════════════════════════════
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'className') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value' && (tag === 'input' || tag === 'textarea')) el.value = v ?? '';
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'disabled') { if (v) el.disabled = true; }
      else if (k === 'selected') { if (v) el.setAttribute('selected', ''); }
      else el.setAttribute(k, v);
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return el;
}

function inp(type, placeholder, value, onInput, extra = {}) {
  if (type === 'number') extra = { step: 'any', inputmode: 'decimal', ...extra };
  const el = h('input', { type, placeholder, value: value ?? '', className: 'form-input', ...extra });
  el.addEventListener('input', e => onInput(e.target.value));
  return el;
}

// Helpers không re-render — dùng cho modal để tránh mất focus
function mkInput(type, placeholder, value, onInput) {
  const el = document.createElement('input');
  Object.assign(el, { placeholder: placeholder, value: value ?? '', className: 'form-input', type });
  if (type === 'number') { el.step = 'any'; el.setAttribute('inputmode','decimal'); }
  el.addEventListener('input', e => onInput(e.target.value));
  // v7.5.0: validate số âm cho input number — cảnh báo nhưng không chặn (cho phép điều chỉnh)
  if (type === 'number') {
    el.addEventListener('blur', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v < 0) {
        e.target.style.borderColor = 'var(--red)';
        e.target.title = '⚠️ Giá trị âm — vui lòng kiểm tra lại';
      } else {
        e.target.style.borderColor = '';
        e.target.title = '';
      }
    });
    el.addEventListener('focus', e => { e.target.style.borderColor = ''; });
  }
  return el;
}
function mkSelect(options, current, onChange) {
  const el = document.createElement('select');
  el.className = 'form-input';
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value; opt.textContent = o.label;
    if (String(o.value) === String(current)) opt.selected = true;
    el.appendChild(opt);
  });
  el.addEventListener('change', e => onChange(e.target.value));
  return el;
}
function mkTextarea(placeholder, value, onInput) {
  const el = document.createElement('textarea');
  el.className = 'form-input'; el.placeholder = placeholder; el.value = value ?? '';
  el.addEventListener('input', e => onInput(e.target.value));
  return el;
}

function sel(options, current, onChange, extra = {}) {
  return h('select', { className: 'form-input', onChange: e => onChange(e.target.value), ...extra },
    ...options.map(o => h('option', { value: o.value, selected: String(current) === String(o.value) || undefined }, o.label))
  );
}

function fg(label, span, ...els) {
  return h('div', { className: 'form-group' + (span ? ' fg-full' : '') },
    h('label', { className: 'form-label' }, label),
    ...els.filter(Boolean)
  );
}

function th(t, right) { return h('th', right ? { style: { textAlign: 'right' } } : {}, t); }

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function toast(msg, type = 'info') {
  if (S._toastTimer) clearTimeout(S._toastTimer);
  S.toast = { msg, type };
  render();
  S._toastTimer = setTimeout(() => { S.toast = null; render(); }, 3000);
}

function go(page) { S.page = page; S.sidebarOpen = false; render(); }

function render() {
  if (_raf) return;
  _raf = true;
  requestAnimationFrame(() => {
    _raf = false;
    const root = document.getElementById('app');
    if (!root) return;
    const next = buildApp();
    root.innerHTML = '';
    root.appendChild(next);
  });
}

            toast('✅ Đã xuất backup JSON! Lưu vào nơi an toàn.', 'success');
          }
        }, '💾 Xuất backup ngay')
      )
    ));
  }

  if (t) {
    const col = { success: 'var(--green)', error: 'var(--red)', info: 'var(--blue)' }[t.type] || 'var(--blue)';
    els.push(h('div', { className: 'toast', style: { borderLeft: `3px solid ${col}` } },
      h('span', { style: { fontSize: 18 } }, t.type === 'success' ? '✅' : t.type === 'error' ? '❌' : 'ℹ️'),
      t.msg
    ));
  }
  if (modal) els.push(buildModal(modal));
  if (confirm) els.push(buildConfirm(confirm));

  return h('div', { className: 'app' }, ...els);
}

function buildModal({ title, content, footer, large }) {
  return h('div', { className: 'modal-bg', onClick: e => { if (e.target === e.currentTarget) { S.modal = null; render(); } } },
    h('div', { className: 'modal' + (large ? ' modal-lg' : '') },
      h('div', { className: 'modal-header' },
        h('span', { className: 'modal-title' }, title),
        h('button', { className: 'btn btn-ghost btn-sm', onClick: () => { S.modal = null; render(); } }, '✕')
      ),
      content,
      footer && h('div', { className: 'modal-footer' }, ...footer)
    )
  );
}

function buildConfirm({ msg, onYes, isLogout }) {
  const close = () => { S.confirm = null; render(); };
  const confirmLabel = isLogout ? 'Đăng xuất' : 'Xác nhận xoá';
  return h('div', { className: 'modal-bg', onClick: close },
    h('div', { className: 'modal', style: { maxWidth: '360px' }, onClick: e => e.stopPropagation() },
      h('div', { style: { padding: '6px 0 20px', fontSize: 14, lineHeight: 1.7 } }, msg),
      h('div', { style: { display: 'flex', gap: 8, justifyContent: 'flex-end' } },
        h('button', { className: 'btn', onClick: close }, 'Huỷ'),
        h('button', { className: 'btn btn-danger', onClick: () => { if (isLogout) { onYes(); } else { onYes(); close(); } } }, confirmLabel)
      )
    )
  );
}

// ── BIỂU ĐỒ HÀNG BÁN CHẠY ─────────────────────────────────────
function buildSalesChart(sales, products) {
  // period state: 'week' | 'month' | 'year'
  let period = 'month';
  const wrap = h('div', { className: 'card', style: { marginBottom: 20 } });

  function getLabel(dateStr) {
    const d = new Date(dateStr);
    if (period === 'week') {
      // ISO week number
      const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      tmp.setUTCDate(tmp.getUTCDate() + 4 - (tmp.getUTCDay() || 7));
      const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
      const wk = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
      return 'T' + wk + '/' + d.getFullYear();
    }
    if (period === 'month') return (d.getMonth() + 1) + '/' + d.getFullYear();
    return String(d.getFullYear());
  }

  function render2() {
    const now = new Date();
    // Filter sales theo period
    let filtered = sales;
    if (period === 'week') {
      const cutoff = new Date(now); cutoff.setDate(now.getDate() - 84); // 12 tuần
      filtered = sales.filter(s => new Date(s.date) >= cutoff);
    } else if (period === 'month') {
      const cutoff = new Date(now); cutoff.setMonth(now.getMonth() - 11); // 12 tháng
      filtered = sales.filter(s => new Date(s.date) >= cutoff);
    }
    // else year: all

    // Gom theo sản phẩm
    const productMap = {};
    filtered.forEach(s => {
      const key = s.productName || 'Khác';
      if (!productMap[key]) productMap[key] = { name: key, qty: 0, revenue: 0, count: 0 };
      productMap[key].qty += parseFloat(s.qty) || 0;
      productMap[key].revenue += s.total || 0;
      productMap[key].count += 1;
    });
    const sorted = Object.values(productMap).sort((a, b) => b.revenue - a.revenue).slice(0, 8);

    // Gom theo thời gian (revenue by period)
    const timeMap = {};
    filtered.forEach(s => {
      const lbl = getLabel(s.date);
      if (!timeMap[lbl]) timeMap[lbl] = 0;
      timeMap[lbl] += s.total || 0;
    });
    const timeKeys = Object.keys(timeMap).sort();
    const maxRev = sorted.length > 0 ? sorted[0].revenue : 1;
    const maxTime = timeKeys.length > 0 ? Math.max(...timeKeys.map(k => timeMap[k])) : 1;

    wrap.innerHTML = '';

    // Header + period buttons
    wrap.appendChild(h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16, flexWrap: 'wrap', gap: 8 } },
      h('div', { className: 'card-title', style: { marginBottom: 0 } }, '📊 Hàng Bán Chạy & Doanh Thu'),
      h('div', { style: { display: 'flex', gap: 6 } },
        ['week','month','year'].map(p => h('button', {
          style: { padding: '5px 12px', borderRadius: 'var(--r2)', border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600,
            background: period === p ? 'var(--accent)' : 'var(--bg4)',
            color: period === p ? '#0f1117' : 'var(--text2)', fontFamily: 'inherit', transition: 'all .15s' },
          onClick: () => { period = p; render2(); }
        }, p === 'week' ? 'Tuần' : p === 'month' ? 'Tháng' : 'Năm'))
      )
    ));

    if (sorted.length === 0) {
      wrap.appendChild(h('div', { style: { textAlign: 'center', padding: '24px 0', color: 'var(--text3)' } }, 'Chưa có dữ liệu bán hàng'));
      return wrap;
    }

    // Layout 2 cột: bên trái = top sản phẩm, bên phải = biểu đồ doanh thu theo thời gian
    const twoPane = h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 } });

    // ── Left: Top sản phẩm ──
    const leftPane = h('div', {});
    leftPane.appendChild(h('div', { style: { fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1, fontWeight: 700, marginBottom: 10 } },
      '🏆 Top sản phẩm (theo doanh thu)'
    ));
    sorted.forEach((item, idx) => {
      const barPct = maxRev > 0 ? (item.revenue / maxRev * 100) : 0;
      const colors = ['var(--accent)','var(--green)','var(--blue)','var(--amber)','var(--red)','#a78bfa','#38bdf8','#fb7185'];
      const color = colors[idx % colors.length];
      leftPane.appendChild(h('div', { style: { marginBottom: 10 } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 4 } },
          h('span', { style: { fontWeight: 600, color: 'var(--text)', maxWidth: '65%', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } },
            (idx + 1) + '. ' + item.name
          ),
          h('span', { style: { color: 'var(--accent)', fontWeight: 700 } }, fmtS(item.revenue) + 'đ')
        ),
        h('div', { style: { height: 7, background: 'var(--bg4)', borderRadius: 99, overflow: 'hidden' } },
          h('div', { style: { height: '100%', width: barPct + '%', background: color, borderRadius: 99, transition: 'width .5s ease' } })
        ),
        h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 3 } },
          item.count + ' đơn · ' + (item.qty > 0 ? fmtQty(item.qty) + ' đơn vị' : '')
        )
      ));
    });
    twoPane.appendChild(leftPane);

    // ── Right: Doanh thu theo thời gian ──
    const rightPane = h('div', {});
    rightPane.appendChild(h('div', { style: { fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1, fontWeight: 700, marginBottom: 10 } },
      '📈 Doanh thu theo ' + (period === 'week' ? 'tuần' : period === 'month' ? 'tháng' : 'năm')
    ));
    if (timeKeys.length === 0) {
      rightPane.appendChild(h('div', { style: { color: 'var(--text3)', fontSize: 12, padding: '10px 0' } }, 'Không có dữ liệu'));
    } else {
      const chartH = 120;
      const barW = Math.max(20, Math.min(40, Math.floor(280 / timeKeys.length) - 4));
      const chartWrap = h('div', { style: { overflowX: 'auto', paddingBottom: 4 } });
      const barsRow = h('div', { style: { display: 'flex', alignItems: 'flex-end', gap: 4, height: chartH + 'px', paddingBottom: 0 } });
      timeKeys.forEach(k => {
        const v = timeMap[k];
        const bh = maxTime > 0 ? Math.max(3, Math.round(v / maxTime * chartH)) : 3;
        const barCol = h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, flexShrink: 0, width: barW + 'px' } },
          h('div', { style: { fontSize: 9, color: 'var(--text3)', fontWeight: 600 } }, fmtS(v)),
          h('div', { title: k + ': ' + fmt(v) + 'đ',
            style: { width: '100%', height: bh + 'px', background: 'linear-gradient(180deg,var(--accent),rgba(201,168,76,.5))',
              borderRadius: '3px 3px 0 0', cursor: 'default', transition: 'opacity .2s',
              boxShadow: '0 1px 4px rgba(201,168,76,.3)' } }),
          h('div', { style: { fontSize: 8, color: 'var(--text3)', textAlign: 'center', lineHeight: 1.2, wordBreak: 'break-all' } }, k)
        );
        barsRow.appendChild(barCol);
      });
      chartWrap.appendChild(barsRow);
      rightPane.appendChild(chartWrap);
    }
    twoPane.appendChild(rightPane);

    wrap.appendChild(twoPane);
  }
  render2();
  return wrap;
}

// ── DASHBOARD ─────────────────────────────────────────────────
function pgDashboard() {
  const { products, imports, sales, returns } = S;
  const cfg = S.settings || {};
  const now = new Date();

  // ── State bộ lọc thời gian ──────────────────────────────────
  if (!pgDashboard._period) pgDashboard._period = 'month';
  if (!pgDashboard._selDate) pgDashboard._selDate = now.toISOString().slice(0,10);

  const period   = pgDashboard._period;
  const selDate  = new Date(pgDashboard._selDate);

  // ── Lọc đơn hàng theo kỳ đã chọn ──────────────────────────
  function matchPeriod(dateStr) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    if (period === 'day')   return d.toDateString() === selDate.toDateString();
    if (period === 'month') return d.getMonth() === selDate.getMonth() && d.getFullYear() === selDate.getFullYear();
    if (period === 'year')  return d.getFullYear() === selDate.getFullYear();
    return true;
  }

  const thisMo = sales.filter(s => matchPeriod(s.date));

  // ══════════════════════════════════════════════════════════════
  //  DOANH THU
  //  revenue    = tổng tiền khách trả (subTotal + vatAmt)
  //  vatSell    = VAT đầu ra thu hộ nhà nước — KHÔNG tính vào LN
  //  revenueNet = doanh thu thuần (chưa VAT) — dùng để tính LN
  // ══════════════════════════════════════════════════════════════
  const revenue    = thisMo.reduce((a, s) => a + (s.total    || 0), 0);
  const vatSell    = thisMo.reduce((a, s) => a + (s.vatAmt   || 0), 0);
  const revenueNet = thisMo.reduce((a, s) => a + (s.subTotal != null ? s.subTotal : Math.max(0, (s.total||0) - (s.shipFee||0) - (s.vatAmt||0))), 0);
  const collected  = thisMo.reduce((a, s) => a + (s.paid     || 0), 0);

  // ═══════════════════════════════════════════════════════════════
  //  GIÁ VỐN HÀNG BÁN (COGS) — v3.8.0
  //  Quy ước: unitPrice trong phiếu nhập luôn là ĐƠN GIÁ CHƯA VAT
  //  → Giá vốn thuần = unitPrice × qty  (dù nhập có VAT hay không)
  //  → VAT đầu vào   = unitPrice × vatRate% × qty
  //  Khi bán VAT=0: tính toàn bộ giá gốc (cả VAT nhập) vào chi phí
  //  Khi bán VAT>0: chỉ tính giá vốn thuần, VAT nhập đối trừ riêng
  // ═══════════════════════════════════════════════════════════════
  // ── v5.5.4 FIX: cogsPerSale tính đúng cả shipFee đã chia ──────
  // Lấy phiếu nhập phù hợp nhất: ưu tiên cùng variantId nếu có,
  // sau đó lọc theo productId và ngày nhập ≤ ngày bán (FIFO-like)
  const cogsPerSale = (s) => {
    const sQty        = parseFloat(s.qty) || 0;
    const saleVatRate = s.vatRate || 0;

    // Tìm phiếu nhập phù hợp — ưu tiên cùng variantId nếu đơn bán có variantId
    const candidates = [...imports]
      .filter(i => i.productId === s.productId && i.date <= s.date)
      .sort((a, b) => b.date.localeCompare(a.date));

    // Ưu tiên phiếu cùng variantId (quy cách)
    const imp = s.variantId
      ? (candidates.find(i => i.variantId === s.variantId) || candidates[0])
      : candidates[0];

    if (!imp) {
      // Fallback về buyPrice trong danh mục sản phẩm
      const buyPrice = products.find(p => p.id === s.productId)?.buyPrice || 0;
      return buyPrice * sQty;
    }

    const unitPriceNet = imp.unitPrice || 0;
    const impVatRate   = imp.vatRate   || 0;

    // Chi phí hàng hoá / đơn vị
    const costPerUnit = (saleVatRate === 0 && impVatRate > 0)
      ? unitPriceNet * (1 + impVatRate / 100)  // Gộp VAT nhập vào giá vốn khi bán 0%
      : unitPriceNet;                           // Giá thuần khi bán có VAT (VAT đầu vào đối trừ riêng)

    const goodsCost = costPerUnit * sQty;

    // ── Cộng phần phí VC đã chia cho phiếu nhập này ──
    // shipFee lưu trong phiếu đã bao gồm VAT (nếu có)
    // Tách ra phần thuần để tính vào giá vốn
    const impShipFee    = imp.shipFee    || 0;  // tổng VC (gồm VAT) đã chia cho phiếu nhập này
    const impShipVatR   = imp.shipVatRate || 0;
    const impShipFeeNet = impShipVatR > 0
      ? impShipFee / (1 + impShipVatR / 100)   // VC thuần (không VAT)
      : impShipFee;

    const impQty = parseFloat(imp.qty) || 1;    // SL của phiếu nhập (để tính VC/đơn vị)
    // VC nhập / đơn vị = VC thuần phiếu nhập ÷ SL phiếu nhập
    const shipCostPerUnit = impQty > 0 ? impShipFeeNet / impQty : 0;

    return goodsCost + shipCostPerUnit * sQty;
  };
  const cogs = thisMo.reduce((a, s) => a + cogsPerSale(s), 0);

  // VAT đầu vào — nhập hàng (đối trừ với VAT đầu ra kỳ tháng này)
  // Chỉ tính VAT đầu vào cho đơn bán có VAT>0 (đơn VAT=0 tính giá nhập gộp vào chi phí)
  const vatImport = thisMo.reduce((a, s) => {
    if ((s.vatRate || 0) === 0) return a; // Đơn bán VAT=0 → không tách VAT nhập
    const imp = [...imports]
      .filter(i => i.productId === s.productId && i.date <= s.date)
      .sort((a, b) => b.date.localeCompare(a.date))[0];
    if (!imp || !imp.vatRate) return a;
    // VAT đầu vào = giá thuần × vatRate% × số lượng (unitPrice luôn là chưa VAT)
    const vatAmt = (imp.unitPrice || 0) * (imp.vatRate / 100) * (parseFloat(s.qty) || 0);
    return a + vatAmt;
  }, 0);

  // ══════════════════════════════════════════════════════════════
  //  PHÍ VẬN CHUYỂN — tách thuần và VAT
  //
  //  v3.7.0: Phí VC nhập lấy từ imports.shipFee, phí VC bán lấy từ sales.shipFee
  //  (Không còn dùng bảng shipping riêng)
  // ══════════════════════════════════════════════════════════════

  // Phí VC nhập kho — lấy từ phiếu nhập trong tháng này
  let shipInGross = 0, shipInNet = 0, vatShipIn = 0;
  const moImports = imports.filter(i => matchPeriod(i.date));
  moImports.forEach(i => {
    const fee  = i.shipFee || 0;
    const vatR = i.shipVatRate || 0;
    const net  = vatR > 0 ? fee / (1 + vatR / 100) : fee;
    shipInGross += fee;
    shipInNet   += net;
    vatShipIn   += fee - net;
  });

  // Phí VC giao hàng — chỉ tính VC CỬA HÀNG TỰ CHỊU vào chi phí LN
  // Nếu shipForCustomer=true → khách trả VC, không trừ vào LN cửa hàng
  let shipOutGross = 0, shipOutNet = 0, vatShipOut = 0;
  let shipOutForStore = 0; // VC cửa hàng tự chịu (trừ vào LN)
  let shipOutForCust  = 0; // VC tính cho khách (không trừ LN)
  let vatShipOutStore = 0; // VAT VC cửa hàng tự chịu
  thisMo.forEach(s => {
    const fee  = s.shipFee || 0;
    if (!fee) return;
    const vatR = s.shipVatRate || 0;
    const net  = vatR > 0 ? fee / (1 + vatR / 100) : fee;
    const vat  = fee - net;
    shipOutGross += fee;
    if (s.shipForCustomer) {
      // VC do khách trả → KHÔNG trừ vào LN cửa hàng
      shipOutForCust += net;
    } else {
      // VC cửa hàng tự chịu → trừ vào LN
      shipOutNet      += net;
      shipOutForStore += net;
      vatShipOut      += vat;
      vatShipOutStore += vat;
    }
  });

  // v5.5.4 FIX: shipFee đã được tính trong cogsPerSale (VC/đơn vị × SL)
  // Không cộng thêm shipInNet để tránh đếm đúp phí vận chuyển nhập
  const cogsTotal = cogs;

  // ══════════════════════════════════════════════════════════════
  //  HOÀN HÀNG
  // ══════════════════════════════════════════════════════════════
  const moReturns   = (S.returns || []).filter(r => matchPeriod(r.date));
  const returnRefund = moReturns.reduce((a, r) => a + (r.refundValue || 0), 0);

  // ══════════════════════════════════════════════════════════════
  //  LỢI NHUẬN TRƯỚC THUẾ TNDN (v6.3.0)
  //  Công thức chuẩn:
  //  LN = DT thuần (giá bán chưa VAT) − Giá vốn thuần (giá nhập chưa VAT) − VC thuần
  //  ⚠️ KHÔNG trừ returnRefund: khi khách trả hàng, đơn gốc đã được điều chỉnh
  //  giảm SL/doanh thu ngay lúc tạo phiếu trả → revenueNet đã tự giảm tương ứng.
  //  Trừ thêm returnRefund là đếm đúp (double-count) khoản này.
  //  VAT phải nộp = VAT đầu ra − VAT đầu vào hàng − VAT đầu vào VC (nhập + giao)
  // ══════════════════════════════════════════════════════════════
  const profitBeforeTax = revenueNet - cogsTotal - shipOutNet;

  // ══════════════════════════════════════════════════════════════
  //  VAT PHẢI NỘP NHÀ NƯỚC (kỳ tháng này)
  //  = VAT đầu ra (bán hàng)
  //  − VAT đầu vào (nhập hàng + VC vào + VC ra)
  // ══════════════════════════════════════════════════════════════
  const vatTotalInput  = vatImport + vatShipIn + vatShipOutStore; // chỉ VAT VC cửa hàng tự chịu
  const vatPayable     = vatSell - vatTotalInput; // > 0 → nộp; < 0 → được hoàn
  // Lợi nhuận = LN trước thuế TNDN (TNDN tính riêng theo kỳ quyết toán, không tính trong dashboard)
  // Lợi nhuận thực = LN thuần − VAT phải nộp (nếu có HĐ VAT và VAT đầu ra > VAT đầu vào)
  // Công thức: LN = DT thuần (chưa VAT) − COGS thuần − VC thuần − (VAT đầu ra − VAT đầu vào − VAT VC)
  // vatPayable > 0: phải nộp thêm → trừ vào LN; vatPayable ≤ 0: được hoàn → giữ nguyên
  const profitAfterTax = (vatSell > 0 && vatPayable > 0)
    ? profitBeforeTax - vatPayable
    : profitBeforeTax;

  // ── Công nợ ──────────────────────────────────────────────────
  const custDebt  = sales.filter(s => s.status === 'debt').reduce((a, s) => a + (s.total - s.paid), 0);
  const suppDebt  = imports.filter(i => i.status === 'debt').reduce((a, i) => a + (i.total - i.paid), 0);
  const lowStock  = products.filter(p => p.stock <= 10);
  const recent    = [...sales].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);

  // Biên lợi nhuận (trên DT thuần — chuẩn kế toán)
  const marginBeforePct = revenueNet > 0 ? Math.round(profitBeforeTax / revenueNet * 100) : 0;

  // Tạo label kỳ hiện tại
  function periodLabel() {
    if (period === 'day')   return 'Ngày ' + selDate.toLocaleDateString('vi-VN');
    if (period === 'month') return 'Tháng ' + (selDate.getMonth()+1) + '/' + selDate.getFullYear();
    if (period === 'year')  return 'Năm ' + selDate.getFullYear();
    return '';
  }

  // Helper navigate period
  function navPeriod(dir) {
    const d = new Date(pgDashboard._selDate);
    if (period === 'day')   d.setDate(d.getDate() + dir);
    if (period === 'month') d.setMonth(d.getMonth() + dir);
    if (period === 'year')  d.setFullYear(d.getFullYear() + dir);
    pgDashboard._selDate = d.toISOString().slice(0,10);
    render();
  }

  const periodBar = h('div', { style: { display:'flex', alignItems:'center', gap:8, marginBottom:16, flexWrap:'wrap' } },
    h('div', { style: { display:'flex', gap:4 } },
      ...['day','month','year'].map(p => h('button', {
        className: 'btn btn-sm' + (period===p ? ' btn-primary' : ''),
        onClick: () => { pgDashboard._period = p; render(); }
      }, p==='day'?'📅 Ngày':p==='month'?'📆 Tháng':'🗓️ Năm'))
    ),
    h('div', { style: { display:'flex', alignItems:'center', gap:6, background:'var(--bg3)', borderRadius:'var(--r2)', padding:'4px 10px', border:'1px solid var(--border2)' } },
      h('button', { className:'btn btn-ghost btn-sm', style:{padding:'2px 8px'}, onClick: () => navPeriod(-1) }, '◀'),
      h('span', { style:{fontWeight:700, fontSize:13, color:'var(--accent)', minWidth:140, textAlign:'center'} }, periodLabel()),
      h('button', { className:'btn btn-ghost btn-sm', style:{padding:'2px 8px'}, onClick: () => navPeriod(1) }, '▶'),
      h('button', { className:'btn btn-ghost btn-sm', style:{fontSize:11, color:'var(--text3)'}, onClick: () => { pgDashboard._selDate = now.toISOString().slice(0,10); render(); } }, 'Hôm nay')
    )
  );

  return h('div', {},
    h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, 'Tổng Quan'),
        h('div', { className: 'page-sub' }, new Date().toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }))
      ),
      h('div', { className: 'tag-gold' }, '💎 Đá Tự Nhiên')
    ),
    periodBar,
    h('div', { className: 'stats-grid' },
      statCard('Doanh thu ' + periodLabel(), fmt(revenue) + 'đ', `📈 ${thisMo.length} đơn · ${thisMo.filter(s=>s.status==='done').length} hoàn tất`, 'var(--accent)'),
      statCard('Đã thu được', fmt(collected) + 'đ', `${revenue > 0 ? Math.round(collected / revenue * 100) : 0}% tổng DT`, 'var(--green)'),
      statCard('Công nợ KH', fmt(custDebt) + 'đ', `${sales.filter(s => s.status === 'debt').length} khách chưa TT`, custDebt > 0 ? 'var(--red)' : 'var(--green)'),
      statCard('Nợ NCC', fmt(suppDebt) + 'đ', `${imports.filter(i => i.status === 'debt').length} phiếu còn nợ`, suppDebt > 0 ? 'var(--amber)' : 'var(--green)')
    ),
    h('div', { style: { background: 'var(--bg2)', border: '1px solid var(--accent)', borderRadius: 'var(--r)', padding: '16px 20px', marginBottom: 20 } },
      h('div', { style: { fontSize: 11, color: 'var(--accent)', textTransform: 'uppercase', letterSpacing: 1, fontWeight: 700, marginBottom: 14 } }, '📊 Phân tích lợi nhuận ' + periodLabel()),
      (() => {
        const wrap2 = document.createElement('div');

        function profitRow(icon, label, sublabel, sign, amount, color, isBold, isBig) {
          const row = document.createElement('div');
          row.style.cssText = `display:flex;justify-content:space-between;align-items:center;padding:${isBig?'12px 14px':'9px 14px'};border-radius:var(--r2);margin-bottom:6px;background:${isBig?'var(--bg4)':'var(--bg3)'};${isBig?'border:1px solid var(--border2)':''}`;
          const left = document.createElement('div');
          left.style.cssText = 'display:flex;align-items:center;gap:8px';
          const ico = document.createElement('span');
          ico.style.cssText = 'font-size:' + (isBig ? '18px' : '14px');
          ico.textContent = icon;
          const txt = document.createElement('div');
          txt.innerHTML = `<div style="font-size:${isBig?'13px':'12px'};font-weight:${isBold?700:500};color:var(--text)">${label}</div>` +
            (sublabel ? `<div style="font-size:10px;color:var(--text3);margin-top:1px">${sublabel}</div>` : '');
          left.appendChild(ico); left.appendChild(txt);
          const right = document.createElement('div');
          right.style.cssText = `font-size:${isBig?'16px':'13px'};font-weight:${isBold?700:600};color:${color};white-space:nowrap`;
          right.textContent = (sign || '') + fmt(Math.abs(amount)) + 'đ';
          row.appendChild(left); row.appendChild(right);
          return row;
        }
        function divRow(label) {
          const d = document.createElement('div');
          d.style.cssText = 'display:flex;align-items:center;gap:8px;margin:4px 0;';
          d.innerHTML = `<div style="flex:1;height:1px;background:var(--border)"></div><span style="font-size:10px;color:var(--text3);white-space:nowrap">${label}</span><div style="flex:1;height:1px;background:var(--border)"></div>`;
          return d;
        }

        // ── CHẾ ĐỘ TÍNH LN: phát hiện có VAT hay không ──────────
        const hasVat = vatSell > 0;
        const hasVatImport = vatImport > 0;
        const hasVatShip = vatShipOut > 0 || vatShipIn > 0;

        // ── BƯỚC 1: DOANH THU ───────────────────────────────────
        if (hasVat) {
          // Chế độ VAT>0: hiển thị DT gộp → trừ VAT → DT thuần
          wrap2.appendChild(profitRow('💰', 'Doanh thu gộp (có VAT đầu ra)',
            'Tổng tiền khách thanh toán = Tạm tính + VAT bán hàng',
            '', revenue, 'var(--accent)', false, false));
          wrap2.appendChild(profitRow('🏛️',
            'Trừ VAT đầu ra bán hàng (' + (revenue > 0 ? Math.round(vatSell/revenue*100) : 0) + '% DT gộp)',
            'VAT thu hộ nhà nước → không phải thu nhập của bạn',
            '−', vatSell, 'var(--red)', false, false));
          wrap2.appendChild(divRow('= Doanh thu thuần'));
          wrap2.appendChild(profitRow('📋', 'Doanh thu thuần (chưa VAT đầu ra)',
            'Doanh thu THỰC SỰ của doanh nghiệp để tính lợi nhuận',
            '', revenueNet, 'var(--blue)', true, false));
        } else {
          // Chế độ VAT=0: DT bán = DT thuần, hiển thị trực tiếp
          const modeBox = document.createElement('div');
          modeBox.style.cssText = 'background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.25);border-radius:var(--r2);padding:8px 12px;margin-bottom:8px;font-size:11px;color:var(--green)';
          modeBox.innerHTML = '✅ <b>Chế độ VAT = 0%:</b> LN = Doanh thu bán − Doanh thu mua (giá nhập gốc) − Chi phí phát sinh';
          wrap2.appendChild(modeBox);
          wrap2.appendChild(profitRow('💰', 'Doanh thu bán hàng (không VAT)',
            'Tổng tiền khách thanh toán · VAT=0 → DT bán = DT thuần',
            '', revenue, 'var(--accent)', false, false));
        }

        wrap2.appendChild(divRow('Trừ chi phí'));

        // ── BƯỚC 2: GIÁ VỐN HÀNG HOÁ ───────────────────────────
        if (hasVat) {
          // VAT>0: hiển thị giá vốn thuần
          wrap2.appendChild(profitRow('📦', 'Giá vốn hàng bán (gồm cả VC nhập, đã tách VAT)',
            hasVatImport
              ? `Giá nhập thuần × SL bán + VC nhập/đơn vị × SL — VAT đầu vào nhập: ${fmt(vatImport)}đ (theo dõi hoàn thuế)`
              : 'Giá nhập × số lượng bán + VC nhập đã phân bổ (nhập không VAT → giá vốn = giá nhập + VC)',
            '−', cogs, 'var(--red)', false, false));
        } else {
          // VAT=0: giá vốn = giá nhập gốc (bao gồm VAT nhập nếu có, vì không khai thuế)
          wrap2.appendChild(profitRow('📦', 'Doanh thu mua + VC nhập (giá nhập gốc × số lượng + VC)',
            hasVatImport
              ? `Giá nhập gộp × SL bán + VC nhập/đơn vị × SL — VAT=0 nên tính toàn bộ vào chi phí (${fmt(vatImport)}đ VAT nhập không tách)`
              : 'Giá nhập × số lượng bán + VC nhập đã phân bổ (không VAT)',
            '−', cogs, 'var(--red)', false, false));
        }

        // ── BƯỚC 3: PHÍ VC NHẬP — đã tích hợp vào giá vốn (v5.5.4) ──
        // Hiển thị thông tin VC nhập để minh bạch, nhưng không trừ thêm
        // vì đã được tính vào cogsPerSale (VC/đơn vị × SL bán)
        const cntShipIn = moImports.filter(i => (i.shipFee||0) > 0).length;
        if (shipInNet > 0) {
          wrap2.appendChild(profitRow('📥', hasVat ? 'Phí VC nhập hàng (đã tích hợp trong giá vốn ↑)' : 'Phí VC nhập hàng (đã tích hợp trong giá vốn ↑)',
            cntShipIn + ' phiếu nhập có VC · Phân bổ vào giá vốn theo từng đơn vị sản phẩm · Không trừ thêm',
            '', 0, 'var(--text3)', false, false));
        }

        // ── BƯỚC 4: PHÍ VC GIAO HÀNG ───────────────────────────
        const cntShipOut      = thisMo.filter(s => (s.shipFee||0) > 0).length;
        const cntShipStore    = thisMo.filter(s => (s.shipFee||0) > 0 && !s.shipForCustomer).length;
        const cntShipCust     = thisMo.filter(s => (s.shipFee||0) > 0 &&  s.shipForCustomer).length;
        // VC cửa hàng tự chịu → trừ vào LN
        if (shipOutForStore > 0) {
          wrap2.appendChild(profitRow('🏠', hasVat ? 'VC cửa hàng tự chịu (phí thuần)' : 'Chi phí VC — cửa hàng tự chịu',
            cntShipStore + ' đơn · VC này trừ vào LN vì cửa hàng chịu' + (hasVatShip && vatShipOut > 0 ? ' · VAT VC: ' + fmt(vatShipOut) + 'đ' : ''),
            '−', shipOutForStore, 'var(--amber)', false, false));
        }
        // VC tính cho khách → không trừ LN, chỉ hiển thị tham khảo
        if (shipOutForCust > 0) {
          wrap2.appendChild(profitRow('🚚', 'VC tính cho khách (không ảnh hưởng LN)',
            cntShipCust + ' đơn · Khách chịu VC → đã in trên hoá đơn · Không trừ vào LN cửa hàng',
            '', 0, 'var(--blue)', false, false));
        }

        // ── BƯỚC 5: HOÀN HÀNG (thông tin tham khảo) ─────────────
        // Khi khách trả hàng: đơn gốc đã được trừ SL & doanh thu ngay lúc tạo phiếu trả
        // → revenueNet đã tự giảm → KHÔNG trừ thêm vào LN (tránh đếm đúp)
        if (moReturns.length > 0) {
          wrap2.appendChild(profitRow('↩️', `Trả hàng: ${moReturns.length} phiếu (đã khấu trừ vào doanh thu ↑)`,
            `Giá trị hoàn: ${fmt(returnRefund)}đ · Đơn gốc đã được điều chỉnh SL & DT · Hàng đã về kho`,
            '', 0, 'var(--text3)', false, false));
        }

        wrap2.appendChild(divRow('= Lợi nhuận thuần (trước VAT nộp)'));

        // ── BƯỚC 6: LỢI NHUẬN TRƯỚC THUẾ ───────────────────────
        wrap2.appendChild(profitRow(
          profitBeforeTax >= 0 ? '🟡' : '🔴',
          'Lợi nhuận thuần · Biên ' + marginBeforePct + '%',
          profitBeforeTax >= 0
            ? 'DT thuần − Giá vốn thuần (gồm VC nhập phân bổ) − VC giao (trả hàng đã khấu vào DT)'
            : '⚠️ Đang lỗ — kiểm tra giá vốn và chi phí',
          profitBeforeTax < 0 ? '−' : '',
          Math.abs(profitBeforeTax),
          profitBeforeTax >= 0 ? 'var(--amber)' : 'var(--red)',
          true, false
        ));

        if (vatSell > 0 && vatPayable > 0) {
          wrap2.appendChild(profitRow('🏛️', 'Trừ VAT phải nộp nhà nước',
            'VAT đầu ra (' + fmt(vatSell) + 'đ) − VAT đầu vào (' + fmt(vatImport) + 'đ) − VAT VC (' + fmt(vatShipIn + vatShipOut) + 'đ)',
            '−', vatPayable, 'var(--red)', false, false));
        }

        wrap2.appendChild(divRow('= Lợi nhuận thực tế (sau VAT)'));

        // ── KẾT QUẢ CUỐI CÙNG ────────────────────────────────────
        wrap2.appendChild(profitRow(
          profitAfterTax >= 0 ? '🟢' : '🔴',
          'Lợi nhuận thực tế · Biên ' + marginBeforePct + '%',
          profitAfterTax >= 0
            ? (vatSell > 0 && vatPayable > 0
                ? '✅ LN sau trừ VAT phải nộp (chưa trừ thuế TNDN cuối năm)'
                : '✅ Lợi nhuận thực tế của doanh nghiệp (chưa trừ thuế TNDN cuối năm)')
            : '⚠️ Đang lỗ — cần xem lại chi phí',
          profitAfterTax < 0 ? '−' : '',
          Math.abs(profitAfterTax),
          profitAfterTax >= 0 ? 'var(--green)' : 'var(--red)',
          true, true
        ));

        // ── BẢNG VAT TỔNG HỢP ───────────────────────────────────
        if (vatSell > 0 || vatTotalInput > 0) {
          wrap2.appendChild(divRow('Tổng hợp VAT'));
          const vatBox = document.createElement('div');
          vatBox.style.cssText = 'background:var(--bg3);border-radius:var(--r2);padding:12px 14px;margin-bottom:6px;font-size:12px';
          const vatPayColor = vatPayable >= 0 ? 'var(--amber)' : 'var(--green)';
          let vatHTML = `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">`;
          vatHTML += `<div style="text-align:center"><div style="font-size:10px;color:var(--text3);margin-bottom:3px">VAT đầu ra (bán)</div><div style="font-weight:700;color:var(--amber)">${fmt(vatSell)}đ</div></div>`;
          vatHTML += `<div style="text-align:center"><div style="font-size:10px;color:var(--text3);margin-bottom:3px">VAT đầu vào (nhập + VC)</div><div style="font-weight:700;color:var(--blue)">${fmt(vatTotalInput)}đ</div><div style="font-size:9px;color:var(--text3)">Nhập: ${fmt(vatImport)} · VC cửa hàng: ${fmt(vatShipOutStore)} · VC vào: ${fmt(vatShipIn)}</div></div>`;
          vatHTML += `<div style="text-align:center"><div style="font-size:10px;color:var(--text3);margin-bottom:3px">VAT phải nộp/hoàn</div><div style="font-weight:700;color:${vatPayColor}">${vatPayable >= 0 ? '▲ Nộp: ' : '▼ Hoàn: '}${fmt(Math.abs(vatPayable))}đ</div></div>`;
          vatHTML += `</div>`;
          vatHTML += `<div style="font-size:10px;color:var(--text3);border-top:1px solid var(--border);padding-top:8px">
            📌 <b style="color:var(--text2)">Công thức LN (${vatSell > 0 ? 'chế độ VAT>0' : 'chế độ VAT=0'}):</b><br>
            ${vatSell > 0
              ? `DT thuần (${fmt(revenueNet)}đ) − Giá vốn thuần (${fmt(cogs)}đ)${shipInNet > 0 ? ' − VC nhập thuần ('+fmt(shipInNet)+'đ)' : ''}${shipOutForStore > 0 ? ' − VC cửa hàng tự chịu ('+fmt(shipOutForStore)+'đ)' : ''}${shipOutForCust > 0 ? ' [VC khách chịu '+fmt(shipOutForCust)+'đ không tính]' : ''}${moReturns.length > 0 ? ` [Trả hàng ${moReturns.length} phiếu đã khấu vào DT]` : ''}${vatPayable > 0 ? ' − VAT nộp ('+fmt(vatPayable)+'đ)' : ''} = <b style="color:var(--green)">${fmt(profitAfterTax)}đ</b>`
              : `DT bán (${fmt(revenue)}đ) − Giá vốn gốc (${fmt(cogs)}đ)${shipInNet > 0 ? ' − VC nhập ('+fmt(shipInNet)+'đ)' : ''}${shipOutForStore > 0 ? ' − VC cửa hàng tự chịu ('+fmt(shipOutForStore)+'đ)' : ''}${shipOutForCust > 0 ? ' [VC khách chịu '+fmt(shipOutForCust)+'đ không tính]' : ''}${moReturns.length > 0 ? ` [Trả hàng ${moReturns.length} phiếu đã khấu vào DT]` : ''} = <b style="color:var(--green)">${fmt(profitAfterTax)}đ</b>`
            }
          </div>`;
          vatBox.innerHTML = vatHTML;
          wrap2.appendChild(vatBox);
        }

        return wrap2;
      })()
    ),
    buildSalesChart(sales, products),

    // ══════════════════════════════════════════════════════════════
    //  BÁO CÁO VẬN CHUYỂN
    // ══════════════════════════════════════════════════════════════
    (() => {
      if (!pgDashboard._shipTab) pgDashboard._shipTab = 'month';
      if (!pgDashboard._shipType) pgDashboard._shipType = 'both'; // 'in' | 'out' | 'both'
      const shipTab  = pgDashboard._shipTab;
      const shipType = pgDashboard._shipType;

      // Thu thập dữ liệu VC nhập và VC bán — TOÀN BỘ (không lọc theo period của tổng quan)
      const allImports = S.imports;
      const allSales   = S.sales;

      // Build groups từ nhập
      const groupsIn  = {};
      allImports.filter(i => (i.shipFee || 0) > 0).forEach(i => {
        const key = shipTab === 'day' ? i.date : shipTab === 'month' ? i.date.slice(0,7) : i.date.slice(0,4);
        if (!groupsIn[key]) groupsIn[key] = { gross: 0, vat: 0, count: 0 };
        const fee = i.shipFee || 0;
        const vr  = i.shipVatRate || 0;
        const net = vr > 0 ? fee / (1 + vr / 100) : fee;
        groupsIn[key].gross += fee;
        groupsIn[key].vat   += fee - net;
        groupsIn[key].count++;
      });

      // Build groups từ bán
      const groupsOut = {};
      allSales.filter(s => (s.shipFee || 0) > 0).forEach(s => {
        const key = shipTab === 'day' ? s.date : shipTab === 'month' ? s.date.slice(0,7) : s.date.slice(0,4);
        if (!groupsOut[key]) groupsOut[key] = { gross: 0, vat: 0, count: 0 };
        const fee = s.shipFee || 0;
        const vr  = s.shipVatRate || 0;
        const net = vr > 0 ? fee / (1 + vr / 100) : fee;
        groupsOut[key].gross += fee;
        groupsOut[key].vat   += fee - net;
        groupsOut[key].count++;
      });

      // Hợp nhất keys
      const allKeys = [...new Set([...Object.keys(groupsIn), ...Object.keys(groupsOut)])].sort((a,b) => b.localeCompare(a));

      function labelKey(k) {
        if (shipTab === 'day')   { const [y,m,d] = k.split('-'); return d+'/'+m+'/'+y; }
        if (shipTab === 'month') { const [y,m] = k.split('-'); return 'Tháng '+m+'/'+y; }
        return 'Năm '+k;
      }

      const totalIn       = allImports.reduce((a,i) => a + (i.shipFee || 0), 0);
      const totalOut      = allSales.reduce((a,s) => a + (s.shipFee || 0), 0);
      const totalOutStore = allSales.filter(s => !s.shipForCustomer).reduce((a,s) => a + (s.shipFee || 0), 0);
      const totalOutCust  = allSales.filter(s =>  s.shipForCustomer).reduce((a,s) => a + (s.shipFee || 0), 0);
      const totalAll = totalIn + totalOutStore; // chỉ cộng VC cửa hàng tự chịu vào chi phí thực

      // Rows theo filter
      const rows = allKeys.map(key => {
        const gIn  = groupsIn[key]  || { gross: 0, vat: 0, count: 0 };
        const gOut = groupsOut[key] || { gross: 0, vat: 0, count: 0 };
        const showIn  = shipType !== 'out' && gIn.gross  > 0;
        const showOut = shipType !== 'in'  && gOut.gross > 0;
        if (!showIn && !showOut) return null;
        const combinedGross = (showIn ? gIn.gross : 0) + (showOut ? gOut.gross : 0);
        const combinedVat   = (showIn ? gIn.vat   : 0) + (showOut ? gOut.vat   : 0);
        return { key, gIn, gOut, showIn, showOut, combinedGross, combinedVat };
      }).filter(Boolean);

      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.style.marginBottom = '16px';

      // Header
      const headerEl = document.createElement('div');
      headerEl.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px';
      const titleEl = document.createElement('div');
      titleEl.style.cssText = 'font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase';
      titleEl.textContent = '🚚 Báo Cáo Chi Phí Vận Chuyển';
      const ctrlsEl = document.createElement('div');
      ctrlsEl.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';

      // Type tabs
      const typeTabsEl = document.createElement('div');
      typeTabsEl.style.cssText = 'display:flex;gap:4px;background:var(--bg3);border-radius:var(--r2);padding:3px;border:1px solid var(--border)';
      [['both','📦 Tổng'],['in','📥 Nhập'],['out','📤 Giao']].forEach(([v,lbl]) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm' + (shipType === v ? ' btn-primary' : ' btn-ghost');
        btn.style.cssText = 'font-size:11px;padding:4px 10px';
        btn.textContent = lbl;
        btn.onclick = () => { pgDashboard._shipType = v; render(); };
        typeTabsEl.appendChild(btn);
      });

      // Period tabs
      const periodTabsEl = document.createElement('div');
      periodTabsEl.style.cssText = 'display:flex;gap:4px;background:var(--bg3);border-radius:var(--r2);padding:3px;border:1px solid var(--border)';
      [['day','Ngày'],['month','Tháng'],['year','Năm']].forEach(([v,lbl]) => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm' + (shipTab === v ? ' btn-primary' : ' btn-ghost');
        btn.style.cssText = 'font-size:11px;padding:4px 10px';
        btn.textContent = lbl;
        btn.onclick = () => { pgDashboard._shipTab = v; render(); };
        periodTabsEl.appendChild(btn);
      });

      ctrlsEl.appendChild(typeTabsEl);
      ctrlsEl.appendChild(periodTabsEl);
      headerEl.appendChild(titleEl);
      headerEl.appendChild(ctrlsEl);
      cardEl.appendChild(headerEl);

      // Summary bar
      const sumBar = document.createElement('div');
      sumBar.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px';
      function miniShipStat(lbl, val, color, sub) {
        const d = document.createElement('div');
        d.style.cssText = 'background:var(--bg3);border-radius:var(--r2);padding:10px 14px;text-align:center';
        d.innerHTML = `<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;font-weight:700">${lbl}</div>
          <div style="font-size:15px;font-weight:700;color:${color}">${val}</div>
          ${sub ? `<div style="font-size:10px;color:var(--text3);margin-top:3px">${sub}</div>` : ''}`;
        return d;
      }
      sumBar.appendChild(miniShipStat('VC Nhập hàng', fmt(totalIn)+'đ', 'var(--blue)', allImports.filter(i=>(i.shipFee||0)>0).length+' phiếu'));
      sumBar.appendChild(miniShipStat('VC Cửa hàng chịu', fmt(totalOutStore)+'đ', 'var(--amber)', '🏠 Trừ vào LN'));
      sumBar.appendChild(miniShipStat('VC Khách chịu', fmt(totalOutCust)+'đ', 'var(--green)', '🚚 Không trừ LN'));
      cardEl.appendChild(sumBar);

      // Table
      if (rows.length === 0) {
        const emptyEl = document.createElement('div');
        emptyEl.style.cssText = 'text-align:center;padding:32px;color:var(--text3)';
        emptyEl.textContent = 'Chưa có phí vận chuyển nào được ghi nhận';
        cardEl.appendChild(emptyEl);
      } else {
        const tableWrap = document.createElement('div');
        tableWrap.className = 'table-wrap';

        // Build header
        const showBoth = shipType === 'both';
        let headHTML = '<thead><tr>';
        headHTML += `<th>${shipTab==='day'?'Ngày':shipTab==='month'?'Tháng':'Năm'}</th>`;
        if (showBoth || shipType === 'in')  headHTML += '<th>VC Nhập (gồm VAT)</th><th>VAT nhập</th><th>VC thuần nhập</th>';
        if (showBoth || shipType === 'out') headHTML += '<th>VC Giao (gồm VAT)</th><th>VAT giao</th><th>VC thuần giao</th>';
        if (showBoth) headHTML += '<th>Tổng VC</th>';
        headHTML += '</tr></thead>';

        let bodyHTML = '<tbody>';
        rows.forEach(r => {
          bodyHTML += '<tr>';
          bodyHTML += `<td style="font-weight:700;color:var(--accent);white-space:nowrap">${labelKey(r.key)}</td>`;
          if (showBoth || shipType === 'in') {
            if (r.showIn) {
              bodyHTML += `<td style="color:var(--blue);font-weight:600">${fmt(r.gIn.gross)}đ <span style="font-size:10px;color:var(--text3)">(${r.gIn.count} phiếu)</span></td>`;
              bodyHTML += `<td style="color:var(--text2)">${r.gIn.vat > 0 ? fmt(r.gIn.vat)+'đ' : '—'}</td>`;
              bodyHTML += `<td style="color:var(--green)">${fmt(r.gIn.gross - r.gIn.vat)}đ</td>`;
            } else {
              bodyHTML += '<td style="color:var(--text3)">—</td><td style="color:var(--text3)">—</td><td style="color:var(--text3)">—</td>';
            }
          }
          if (showBoth || shipType === 'out') {
            if (r.showOut) {
              bodyHTML += `<td style="color:var(--amber);font-weight:600">${fmt(r.gOut.gross)}đ <span style="font-size:10px;color:var(--text3)">(${r.gOut.count} đơn)</span></td>`;
              bodyHTML += `<td style="color:var(--text2)">${r.gOut.vat > 0 ? fmt(r.gOut.vat)+'đ' : '—'}</td>`;
              bodyHTML += `<td style="color:var(--green)">${fmt(r.gOut.gross - r.gOut.vat)}đ</td>`;
            } else {
              bodyHTML += '<td style="color:var(--text3)">—</td><td style="color:var(--text3)">—</td><td style="color:var(--text3)">—</td>';
            }
          }
          if (showBoth) {
            bodyHTML += `<td style="font-weight:700;color:var(--accent)">${fmt(r.combinedGross)}đ</td>`;
          }
          bodyHTML += '</tr>';
        });
        bodyHTML += '</tbody>';

        const table = document.createElement('table');
        table.innerHTML = headHTML + bodyHTML;
        tableWrap.appendChild(table);
        cardEl.appendChild(tableWrap);
      }

      return cardEl;
    })(),

    h('div', { className: 'two-col' },
      h('div', { className: 'card' },
        h('div', { className: 'card-title' }, '🧾 Đơn hàng gần đây'),
        recent.length === 0 ? h('div', { className: 'empty' }, 'Chưa có đơn hàng') :
        h('div', { className: 'table-wrap' },
          h('table', {},
            h('thead', {}, h('tr', {}, th('Khách hàng'), th('Sản phẩm'), th('Tổng tiền'), th('TT'))),
            h('tbody', {}, ...recent.map(s => h('tr', {},
              h('td', {}, h('div', { style: { fontWeight: 600 } }, s.customer)),
              h('td', { style: { color: 'var(--text2)', fontSize: 12 } }, s.productName),
              h('td', { style: { fontWeight: 600 } }, fmt(s.total) + 'đ'),
              h('td', {}, h('span', { className: 'badge badge-' + (s.status === 'done' ? 'green' : 'red') }, s.status === 'done' ? 'Xong' : 'Nợ'))
            )))
          )
        )
      ),
      h('div', { className: 'card' },
        h('div', { className: 'card-title' }, `⚠️ Kho sắp hết (${lowStock.length})`),
        lowStock.length === 0
          ? h('div', { style: { color: 'var(--green)', fontSize: 13, padding: '12px 0' } }, '✅ Tất cả kho hàng đủ')
          : h('div', { className: 'table-wrap' },
            h('table', {},
              h('thead', {}, h('tr', {}, th('Sản phẩm'), th('Tồn'), th('ĐVT'))),
              h('tbody', {}, ...lowStock.map(p => h('tr', {},
                h('td', {}, p.name),
                h('td', { style: { color: p.stock <= 5 ? 'var(--red)' : 'var(--amber)', fontWeight: 700 } }, p.stock),
                h('td', { style: { color: 'var(--text2)' } }, p.unit)
              )))
            )
          )
      )
    )
  );
}
function miniStat(label, val, color) {
  return h('div', { style: { background: 'var(--bg3)', borderRadius: 'var(--r2)', padding: '10px 14px' } },
    h('div', { style: { fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: .8, marginBottom: 5, fontWeight: 700 } }, label),
    h('div', { style: { fontSize: 16, fontWeight: 700, color } }, val)
  );
}
function statCard(label, val, sub, color) {
  return h('div', { className: 'stat' },
    h('div', { className: 'stat-label' }, label),
    h('div', { className: 'stat-val', style: { color } }, val),
    h('div', { className: 'stat-change' }, sub)
  );
}
function pBox(label, color, sign, val, bold) {
  return h('div', { style: { textAlign: 'center', padding: '10px', background: 'var(--bg3)', borderRadius: 'var(--r2)' } },
    h('div', { style: { fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: .8, marginBottom: 6 } }, label),
    h('div', { style: { fontSize: 15, fontWeight: bold ? 700 : 600, color } }, sign + fmt(Math.abs(val)) + 'đ')
  );
}

// ── INVENTORY ─────────────────────────────────────────────────
function pgInventory() {
  const TYPES = ['Granite','Marble','Onyx','Basalt','Quartzite','Travertine','Slate','Serpentine','Khác'];
  const UNITS  = ['m²','tấm','tấn','viên','m³','kg','cái'];
  const wrap = h('div', {});
  let search = '', ftype = 'all';

  const rebuild = () => {
    const { products } = S;
    const types = [...new Set(products.map(p => p.type))];
    const filtered = products.filter(p => {
      const q = search.toLowerCase();
      return (p.name.toLowerCase().includes(q) || p.type.toLowerCase().includes(q) || (p.origin || '').toLowerCase().includes(q))
        && (ftype === 'all' || p.type === ftype);
    });
    const totalVal = filtered.reduce((a, p) => a + p.buyPrice * p.stock, 0);
    // Tổng giá trị mua vào và bán ra thực tế từ dữ liệu nhập/bán
    const totalBuyValue  = S.imports.reduce((a, i) => a + (i.unitPrice * i.qty || 0), 0);
    const totalSellValue = S.sales.reduce((a, s) => a + (s.subTotal || s.unitPrice * s.qty || 0), 0);

    wrap.innerHTML = '';
    // ── Phát hiện sản phẩm trùng tên ───────────────────────────
    const dupGroups = (() => {
      const byName = {};
      S.products.forEach(p => {
        const key = (p.name || '').trim().toLowerCase();
        if (!key) return;
        if (!byName[key]) byName[key] = [];
        byName[key].push(p);
      });
      return Object.entries(byName).filter(([, arr]) => arr.length > 1).map(([, arr]) => arr);
    })();

    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, 'Kho Hàng'),
          h('div', { className: 'page-sub' }, `${products.length} loại · Giá trị tồn kho (theo giá nhập): ${fmt(totalVal)}đ`)
        ),
        h('div', { style: { display:'flex', gap:8, flexWrap:'wrap' } },
          dupGroups.length > 0 && h('button', {
            className: 'btn', style: { background:'rgba(232,165,58,.15)', color:'var(--amber)', border:'1px solid rgba(232,165,58,.4)', fontWeight:700 },
            onClick: () => {
              // Gộp tất cả nhóm trùng: giữ bản có _updated mới nhất, cộng stock, reroute imports/sales sang id winner
              let mergeLog = [];
              dupGroups.forEach(group => {
                // Sắp xếp: bản mới nhất lên đầu
                group.sort((a, b) => {
                  const ta = a._updated || a.id || '';
                  const tb = b._updated || b.id || '';
                  return tb > ta ? 1 : -1;
                });
                const winner = group[0];
                const losers = group.slice(1);
                // Cộng dồn stock từ các bản bị loại
                let totalStock = parseFloat(winner.stock) || 0;
                losers.forEach(l => { totalStock += parseFloat(l.stock) || 0; });
                // Cập nhật winner stock
                S.products = S.products.map(p =>
                  p.id === winner.id ? { ...p, stock: totalStock } :
                  losers.find(l => l.id === p.id) ? null : p
                ).filter(Boolean);
                // Reroute imports và sales sang winner id
                const loserIds = new Set(losers.map(l => l.id));
                S.imports = S.imports.map(i => loserIds.has(i.productId) ? { ...i, productId: winner.id, productName: winner.name } : i);
                S.sales   = S.sales.map(s => loserIds.has(s.productId) ? { ...s, productId: winner.id, productName: winner.name } : s);
                mergeLog.push(`"${winner.name}" (${group.length} bản → gộp, tồn kho: ${totalStock} ${winner.unit})`);
              });
              save('products'); save('imports'); save('sales');
              // Sync lên cloud
              if (typeof CLOUD !== 'undefined') {
                CLOUD.enqueue('products', S);
                CLOUD.enqueue('imports', S);
                CLOUD.enqueue('sales', S);
              }
              toast('✅ Đã gộp ' + dupGroups.length + ' nhóm trùng: ' + mergeLog.join('; '), 'success');
              rebuild(); render();
            }
          }, `⚠️ Gộp ${dupGroups.length} SP trùng`),
          h('button', { className: 'btn btn-primary', onClick: () => openProduct(null, rebuild) }, '+ Thêm sản phẩm')
        )
      ),
      // ── Cảnh báo kho âm ────────────────────────────────────────
      (() => {
        const alerts = (S.stockAlerts || []).filter(a => {
          const p = S.products.find(x => x.id === a.productId);
          return p && (parseFloat(p.stock)||0) < 0;
        });
        if (alerts.length === 0) return null;
        const box = document.createElement('div');
        box.style.cssText = 'background:rgba(224,92,92,.1);border:1.5px solid rgba(224,92,92,.45);border-radius:var(--r);padding:14px 16px;margin-bottom:14px';
        let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
          <div style="font-size:13px;font-weight:700;color:var(--red)">🚨 CẦN NHẬP HÀNG GẤP — KHO ĐANG ÂM (${alerts.length} sản phẩm)</div>
          <button id="_dismissAlerts" style="background:rgba(224,92,92,.2);color:var(--red);border:1px solid rgba(224,92,92,.4);border-radius:var(--r2);padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700">✕ Đã nhập xong</button>
        </div>`;
        alerts.forEach(a => {
          const p = S.products.find(x => x.id === a.productId);
          const curStock = parseFloat(p?.stock)||0;
          const needed = Math.abs(curStock);
          // Lấy chi tiết variants âm từ sản phẩm hiện tại (real-time)
          const negVts = (p?.variants || []).filter(vt => (vt.stockM2||0) < 0 || (vt.stockPieces||0) < 0);
          let variantDetail = '';
          if (negVts.length > 0) {
            variantDetail = `<div style="margin-top:8px;padding:8px 10px;background:rgba(224,92,92,.08);border-radius:6px;border-left:3px solid rgba(224,92,92,.5)">
              <div style="font-size:11px;font-weight:700;color:var(--red);margin-bottom:5px">📐 Chi tiết từng quy cách bị âm:</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">` +
              negVts.map(vt => {
                const m2 = vt.stockM2||0; const pcs = vt.stockPieces||0;
                return `<div style="background:rgba(224,92,92,.15);border:1px solid rgba(224,92,92,.35);border-radius:6px;padding:5px 9px;font-size:11px">
                  <b style="color:var(--accent)">${vt.tileW}×${vt.tileH}cm</b><br>
                  <span style="color:var(--red);font-weight:700">${m2.toFixed(2)} m²</span>
                  <span style="color:var(--text3);font-size:10px"> / ${pcs} viên</span><br>
                  <span style="color:var(--amber);font-size:10px;font-weight:700">⬆️ Cần: ${Math.abs(m2).toFixed(2)}m² (${Math.abs(pcs)} viên)</span>
                </div>`;
              }).join('') +
              `</div></div>`;
          }
          html += `<div style="padding:10px 12px;background:rgba(224,92,92,.07);border-radius:var(--r2);margin-bottom:8px">
            <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
              <div style="flex:1;min-width:140px">
                <span style="font-weight:700;color:var(--text);font-size:13px">${a.productName}</span>
                <span style="font-size:11px;color:var(--text3);margin-left:8px">Bán cho: ${a.customer||'—'} · SL bán: ${fmtQty(a.soldQty)} ${a.unit}</span>
              </div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                <span style="background:rgba(224,92,92,.18);color:var(--red);border:1px solid rgba(224,92,92,.4);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700">
                  Tồn kho: ${fmtQty(curStock)} ${a.unit}
                </span>
                <span style="background:rgba(232,165,58,.15);color:var(--amber);border:1px solid rgba(232,165,58,.4);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800">
                  ⬆️ Cần nhập tối thiểu: ${fmtQty(needed)} ${a.unit}
                </span>
              </div>
            </div>
            ${variantDetail}
          </div>`;
        });
        html += `<div style="font-size:11px;color:var(--text3);margin-top:6px">💡 Sau khi nhập hàng xong, nhấn <b>"✕ Đã nhập xong"</b> để xoá cảnh báo này.</div>`;
        box.innerHTML = html;
        setTimeout(() => {
          const btn = document.getElementById('_dismissAlerts');
          if (btn) btn.addEventListener('click', () => {
            S.stockAlerts = (S.stockAlerts||[]).filter(a => {
              const p = S.products.find(x => x.id === a.productId);
              return p && (parseFloat(p.stock)||0) < 0;
            });
            try { localStorage.setItem('dtn_stockAlerts', JSON.stringify(S.stockAlerts)); } catch(e) {}
            rebuild();
          });
        }, 50);
        return box;
      })(),

      h('div', { style: { display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14 } },
        h('div', { style: { background:'rgba(76,175,125,.08)',border:'1px solid rgba(76,175,125,.25)',borderRadius:'var(--r2)',padding:'10px 16px' } },
          h('div', { style: { fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:1,marginBottom:4 } }, '📥 TỔNG GIÁ TRỊ MUA VÀO (chưa VAT)'),
          h('div', { style: { fontSize:17,fontWeight:700,color:'var(--green)',fontFamily:'Georgia,serif' } }, fmt(totalBuyValue) + 'đ')
        ),
        h('div', { style: { background:'rgba(201,168,76,.08)',border:'1px solid rgba(201,168,76,.25)',borderRadius:'var(--r2)',padding:'10px 16px' } },
          h('div', { style: { fontSize:10,color:'var(--text3)',textTransform:'uppercase',letterSpacing:1,marginBottom:4 } }, '📤 TỔNG GIÁ TRỊ BÁN RA (chưa VAT)'),
          h('div', { style: { fontSize:17,fontWeight:700,color:'var(--accent)',fontFamily:'Georgia,serif' } }, fmt(totalSellValue) + 'đ')
        )
      ),
      h('div', { style: { background: 'rgba(201,168,76,.07)', border: '1px solid rgba(201,168,76,.25)', borderRadius: 'var(--r2)', padding: '9px 14px', marginBottom: 12, fontSize: 11, color: 'var(--accent)' } },
        '💡 <b>Lưu ý LN%:</b> Cột LN% = chênh lệch giá bán/giá nhập gốc (chưa tính VAT). Lợi nhuận thực tế sau VAT xem tại <b>Tổng Quan</b>. VAT được khai báo tại phiếu Nhập hàng và đơn Bán hàng.'
      ),
      h('div', { style: { display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' } },
        inp('text', '🔍 Tìm tên, loại đá, xuất xứ...', search, v => { search = v; rebuild(); }, { style: { flex: '1 1 180px' } }),
        sel([{ value: 'all', label: 'Tất cả loại' }, ...types.map(t => ({ value: t, label: t }))], ftype, v => { ftype = v; rebuild(); }, { style: { width: '140px' } })
      ),
      h('div', { className: 'table-wrap' },
        h('table', {},
          h('thead', {}, h('tr', {}, th('Sản phẩm'), th('Loại'), th('Xuất xứ'), th('Giá nhập'), th('Giá bán'), th('LN% (chưa VAT)'), th('Quy cách'), th('Tồn kho'), th('Giá trị tồn'), th(''))),
          h('tbody', {},
            ...filtered.map(p => h('tr', {},
              h('td', {},
                h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
                  p.image && h('img', { src: p.image, style: { width: '36px', height: '36px', objectFit: 'cover', borderRadius: '6px', border: '1px solid var(--border)', flexShrink: '0' } }),
                  h('div', {},
                    h('div', { style: { fontWeight: 600 } }, p.name),
                    p.qrCode && h('div', { style: { fontSize: 10, color: 'var(--accent)', marginTop: 2 } }, '📱 ' + p.qrCode),
                    (p.length || p.width || p.thickness) && h('div', { style: { fontSize: 10, color: 'var(--text3)', marginTop: 2 } },
                      [p.length&&('D:'+p.length+'cm'), p.width&&('R:'+p.width+'cm'), p.thickness&&('Dày:'+p.thickness+'cm')].filter(Boolean).join(' · ')
                    ),
                    p.description && h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 2 } }, p.description)
                  )
                )
              ),
              h('td', {}, h('span', { className: 'chip' }, p.type)),
              h('td', { style: { color: 'var(--text2)' } }, p.origin || '—'),
              h('td', {}, fmt(p.buyPrice) + 'đ'),
              h('td', { style: { fontWeight: 600 } }, fmt(p.sellPrice) + 'đ'),
              h('td', {}, h('span', { className: 'profit-pct' }, '+' + pct(p.buyPrice, p.sellPrice) + '%')),
              h('td', {},
                (p.variants && p.variants.length > 0)
                  ? h('div', { style: { display:'flex', flexDirection:'column', gap:3 } },
                      ...p.variants.map(vt => h('div', {
                        style: { display:'flex', alignItems:'center', gap:4, flexWrap:'wrap' }
                      },
                        h('span', { className:'badge badge-gold', style:{ fontSize:10, padding:'2px 7px' } }, '📐 ' + (vt.size || (vt.tileW+'×'+vt.tileH))),
                        vt.sellPrice && h('span', { style:{ fontSize:11, color:'var(--accent)' } }, fmt(vt.sellPrice)+'đ/m²'),
                        (vt.stockM2 > 0 || vt.stockPieces > 0)
                          ? h('span', { style:{ fontSize:10, color:'var(--green)' } }, '(' + (vt.stockPieces||0) + ' viên · ' + (vt.stockM2||0).toFixed(1) + 'm²)')
                          : h('span', { style:{ fontSize:10, color:'var(--text3)' } }, '(chưa có tồn)')
                      ))
                    )
                  : h('span', { style:{ color:'var(--text3)', fontSize:11 } }, '—')
              ),
              (() => {
                const stk = parseFloat(p.stock)||0;
                const isNeg = stk < 0;
                const color = isNeg ? 'var(--red)' : stk <= 5 ? 'var(--red)' : stk <= 10 ? 'var(--amber)' : 'var(--green)';
                const icon = isNeg ? '📉 ' : '';
                const label = isNeg
                  ? `${icon}${fmtQty(stk)} ${p.unit} ⚠️`
                  : `${fmtQty(stk)} ${p.unit}`;
                const hint = isNeg
                  ? h('div', { style: { fontSize:10, color:'var(--red)', marginTop:2, fontWeight:700 } }, '→ Cần nhập: ' + fmtQty(Math.abs(stk)) + ' ' + p.unit)
                  : null;
                return h('td', { style: { fontWeight:700, color } },
                  label,
                  hint
                );
              })(),
              h('td', { style: { fontWeight: 700, color: p.buyPrice > 0 ? 'var(--accent)' : 'var(--text3)' } }, p.buyPrice > 0 ? fmt(Math.round(p.buyPrice * (parseFloat(p.stock)||0))) + 'đ' : '—'),
              h('td', {}, h('div', { style: { display: 'flex', gap: 4 } },
                h('button', { className: 'btn btn-ghost btn-xs', onClick: () => openProduct(p, rebuild) }, '✏️'),
                h('button', { className: 'btn btn-ghost btn-xs', onClick: () => {
                  S.confirm = { msg: 'Xoá sản phẩm "' + p.name + '"?', onYes: () => { softDelete('products', p.id, () => {}); toast('Đã xoá sản phẩm', 'info'); rebuild(); } };
                  render();
                } }, '🗑')
              ))
            )),
            filtered.length === 0 && h('tr', {}, h('td', { colspan: 9, style: { textAlign: 'center', padding: 32, color: 'var(--text3)' } }, 'Không tìm thấy sản phẩm'))
          )
        )
      )
    ));
  };
  rebuild();
  return wrap;
}

function openProduct(prod, rebuild) {
  const TYPES = ['Granite','Marble','Onyx','Basalt','Quartzite','Travertine','Slate','Serpentine','Khác'];
  const UNITS  = ['m²','tấm','tấn','viên','m³','kg','cái'];
  let f = prod ? { ...prod } : { name: '', type: 'Granite', origin: '', unit: 'm²', buyPrice: '', sellPrice: '', stock: '', description: '', image: '', qrCode: '', variants: [], thickness: '', length: '', width: '', multiVariant: false };
  // Đảm bảo luôn có trường variants và multiVariant
  if (!f.variants) f.variants = [];
  if (f.multiVariant === undefined) f.multiVariant = f.variants.length > 0;

  // Tạo tất cả input 1 lần — KHÔNG re-render khi gõ số
  const inpName   = mkInput('text',   'VD: Granite Đen Impala',  f.name,        v => { f.name = v; });
  const selType   = mkSelect(TYPES.map(t=>({value:t,label:t})),  f.type,        v => f.type = v);
  const inpOrigin = mkInput('text',   'VD: Việt Nam, Ý...',      f.origin,      v => f.origin = v);
  const selUnit   = mkSelect(UNITS.map(u=>({value:u,label:u})),  f.unit,        v => { f.unit = v; updatePreview(); rebuildVariants(); });
  const inpStock  = mkInput('number', 'VD: 120.5',               f.stock,       v => f.stock = v);
  const inpBuy    = mkInput('number', 'VD: 1.200.000',           f.buyPrice,    v => { f.buyPrice = v; updatePreview(); });
  const inpSell   = mkInput('number', 'VD: 2.000.000',           f.sellPrice,   v => { f.sellPrice = v; updatePreview(); });
  const taDesc    = mkTextarea('Đặc điểm, màu sắc, ứng dụng...', f.description, v => f.description = v);

  // ── Quy cách kích thước (Variants) ─────────────────────────
  // Mỗi variant: { id, size (vd "10x60"), tileW (cm), tileH (cm), buyPrice, sellPrice, piecesPerM2 (viên/m²), stock_pieces, stock_m2 }
  // Nhập: số viên → tính m²  HOẶC  nhập m² → tính số viên
  // Công thức: 1 m² = 10000 cm² / (tileW × tileH) viên

  const variantsContainer = document.createElement('div');
  variantsContainer.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-top:8px';

  function calcPiecesPerM2(w, h) {
    if (!w || !h || w <= 0 || h <= 0) return 0;
    return 10000 / (w * h); // số viên/m²
  }
  function calcM2FromPieces(pieces, w, h) {
    const ppm2 = calcPiecesPerM2(w, h);
    if (!ppm2) return 0;
    return pieces / ppm2;
  }
  function calcPiecesFromM2(m2, w, h) {
    const ppm2 = calcPiecesPerM2(w, h);
    return Math.round(m2 * ppm2);
  }

  function makeVariantRow(vt) {
    // vt = { id, size, tileW, tileH, buyPrice, sellPrice, stockPieces, stockM2 }
    const rowWrap = document.createElement('div');
    rowWrap.style.cssText = 'background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);padding:14px 16px;position:relative';

    // Header row with size label + delete btn
    const hdr = document.createElement('div');
    hdr.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap';

    const sizeLabel = document.createElement('div');
    sizeLabel.style.cssText = 'font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px';
    sizeLabel.textContent = '📐 Quy Cách';
    hdr.appendChild(sizeLabel);

    // Size input: W x H
    const inpW = document.createElement('input');
    inpW.type = 'number'; inpW.step = '0.1'; inpW.min = '1';
    inpW.placeholder = 'Rộng (cm)';
    inpW.value = vt.tileW || '';
    inpW.className = 'form-input';
    inpW.style.cssText = 'width:100px;text-align:center';

    const xSep = document.createElement('span');
    xSep.textContent = '×'; xSep.style.cssText = 'font-size:16px;color:var(--text2);font-weight:700';

    const inpH = document.createElement('input');
    inpH.type = 'number'; inpH.step = '0.1'; inpH.min = '1';
    inpH.placeholder = 'Dài (cm)';
    inpH.value = vt.tileH || '';
    inpH.className = 'form-input';
    inpH.style.cssText = 'width:100px;text-align:center';

    const cmLabel = document.createElement('span');
    cmLabel.textContent = 'cm'; cmLabel.style.cssText = 'font-size:12px;color:var(--text2)';

    const ppm2Badge = document.createElement('div');
    ppm2Badge.style.cssText = 'font-size:11px;color:var(--blue);background:rgba(91,143,232,.12);border:1px solid rgba(91,143,232,.3);border-radius:99px;padding:2px 10px;margin-left:4px';
    function updatePPM2Badge() {
      const w = parseFloat(inpW.value)||0, h = parseFloat(inpH.value)||0;
      const ppm2 = calcPiecesPerM2(w, h);
      ppm2Badge.style.display = ppm2 > 0 ? '' : 'none';
      if (ppm2 > 0) ppm2Badge.textContent = ppm2.toFixed(2) + ' viên/m²';
      vt.tileW = w; vt.tileH = h;
      vt.size = (w > 0 && h > 0) ? w + 'x' + h : '';
    }

    const delBtn = document.createElement('button');
    delBtn.type = 'button'; delBtn.className = 'btn btn-xs btn-danger';
    delBtn.style.cssText = 'margin-left:auto;flex-shrink:0';
    delBtn.textContent = '🗑 Xoá';
    delBtn.onclick = () => {
      f.variants = f.variants.filter(x => x.id !== vt.id);
      rowWrap.remove();
    };

    hdr.appendChild(inpW); hdr.appendChild(xSep); hdr.appendChild(inpH); hdr.appendChild(cmLabel);
    hdr.appendChild(ppm2Badge); hdr.appendChild(delBtn);
    rowWrap.appendChild(hdr);

    // Price row
    const priceRow = document.createElement('div');
    priceRow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px';

    function makePriceGroup(label, val, setter) {
      const grp = document.createElement('div');
      grp.style.cssText = 'display:flex;flex-direction:column;gap:5px';
      const lbl = document.createElement('label'); lbl.className = 'form-label'; lbl.textContent = label;
      const inp2 = document.createElement('input');
      inp2.type = 'number'; inp2.step = 'any'; inp2.placeholder = 'VD: 170.000';
      inp2.className = 'form-input'; inp2.value = val || '';
      inp2.addEventListener('input', e => { setter(parseFloat(e.target.value)||0); updateQtyPreview(); });
      grp.appendChild(lbl); grp.appendChild(inp2);
      return { el: grp, inp: inp2 };
    }
    const buyG  = makePriceGroup('Giá nhập (đ/m²)', vt.buyPrice,  v => { vt.buyPrice  = v; });
    const sellG = makePriceGroup('Giá bán (đ/m²)',  vt.sellPrice, v => { vt.sellPrice = v; });
    priceRow.appendChild(buyG.el); priceRow.appendChild(sellG.el);
    rowWrap.appendChild(priceRow);

    // Tồn kho: nhập viên hoặc m²
    const stockHdr = document.createElement('div');
    stockHdr.style.cssText = 'font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px';
    stockHdr.textContent = '📦 Tồn kho quy cách này';
    rowWrap.appendChild(stockHdr);

    const stockRow = document.createElement('div');
    stockRow.style.cssText = 'display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center';

    // Input số viên
    const inpPieces = document.createElement('input');
    inpPieces.type = 'number'; inpPieces.step = '1'; inpPieces.min = '0';
    inpPieces.placeholder = 'Số viên';
    inpPieces.className = 'form-input'; inpPieces.value = vt.stockPieces != null ? vt.stockPieces : '';
    inpPieces.style.textAlign = 'center';

    const eqSign = document.createElement('div');
