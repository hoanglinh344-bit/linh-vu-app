      returns.length > 0 && h('div', { className: 'card', style: { marginTop: 16 } },
        h('div', { className: 'card-title' }, '📊 Thống kê trả hàng'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12 } },
          h('div', { className: 'stat' },
            h('div', { className: 'stat-label' }, 'Số phiếu trả'),
            h('div', { className: 'stat-val', style: { color: 'var(--amber)' } }, returns.length)
          ),
          h('div', { className: 'stat' },
            h('div', { className: 'stat-label' }, 'Tổng SL hoàn kho'),
            h('div', { className: 'stat-val', style: { color: 'var(--green)' } }, fmtQty(totalReturnQty))
          ),
          h('div', { className: 'stat' },
            h('div', { className: 'stat-label' }, 'Giá trị hoàn khách'),
            h('div', { className: 'stat-val', style: { color: 'var(--red)' } }, fmtS(totalRefundValue) + 'đ')
          )
        )
      )
    ));
  };
  rebuild();
  return wrap;
}

function openReturnFromSale(sale, onDone) {
  // Shortcut: mở form trả hàng với đơn gốc được điền sẵn
  const { products } = S;
  const inpDate      = mkInput('date', '', today(), v => {});
  const inpReason    = mkInput('text', 'VD: Dư vật liệu, không đúng quy cách...', '', v => {});
  const inpReturnQty = mkInput('number', `Tối đa: ${fmtQty(sale.qty)} ${sale.unit}`, '', v => updateSum());
  const inpUnitPrice = mkInput('number', 'Đơn giá bán', sale.unitPrice, v => updateSum());
  inpUnitPrice.value = sale.unitPrice;

  // VAT checkbox — chỉ hiện khi đơn gốc có VAT
  const saleHasVat = (sale.vatRate || 0) > 0;
  let includeVat = saleHasVat; // mặc định tick nếu đơn gốc có VAT

  const vatCheckWrap = document.createElement('div');
  vatCheckWrap.className = 'fg-full';
  if (saleHasVat) {
    vatCheckWrap.style.cssText = 'background:rgba(91,143,232,.08);border:1px solid rgba(91,143,232,.3);border-radius:var(--r2);padding:10px 14px;font-size:13px';
    const vatChkRow = document.createElement('div');
    vatChkRow.style.cssText = 'display:flex;align-items:center;gap:8px';
    const vatChk = document.createElement('input');
    vatChk.type = 'checkbox';
    vatChk.id = 'vatReturnChk_' + uid();
    vatChk.checked = true;
    vatChk.style.cssText = 'width:17px;height:17px;cursor:pointer;accent-color:var(--accent)';
    const vatChkLbl = document.createElement('label');
    vatChkLbl.htmlFor = vatChk.id;
    vatChkLbl.style.cssText = 'font-size:13px;cursor:pointer;color:var(--text)';
    vatChkLbl.innerHTML = '🏛️ Hoàn lại VAT ' + sale.vatRate + '% cho khách <span style="color:var(--blue);font-size:11px">(đơn gốc có VAT ' + sale.vatRate + '%)</span>';
    vatChkRow.appendChild(vatChk); vatChkRow.appendChild(vatChkLbl);
    vatCheckWrap.appendChild(vatChkRow);
    vatChk.addEventListener('change', () => { includeVat = vatChk.checked; updateSum(); });
  }

  const maxQtyEl = document.createElement('div');
  maxQtyEl.style.cssText = 'font-size:11px;color:var(--amber);margin-top:4px;font-weight:600';
  maxQtyEl.textContent = `⚠️ Đơn gốc: ${fmtQty(sale.qty)} ${sale.unit} · Tối đa được trả: ${fmtQty(sale.qty)} ${sale.unit}`;

  const sumEl = document.createElement('div');
  sumEl.className = 'sum-box fg-full';
  sumEl.style.display = 'none';

  function updateSum() {
    const qty   = parseFloat(inpReturnQty.value) || 0;
    const price = parseFloat(inpUnitPrice.value) || 0;
    const vatRate = (saleHasVat && includeVat) ? (sale.vatRate || 0) : 0;
    const refundBase = qty * price;
    const refundVat  = Math.round(refundBase * vatRate / 100);
    const refund = refundBase + refundVat;
    if (qty > 0 && price > 0) {
      sumEl.style.display = '';
      const newQty      = sale.qty - qty;
      const newSubTotal = Math.max(0, newQty * sale.unitPrice);
      const newVat      = Math.round(newSubTotal * sale.vatRate / 100);
      const newTotal    = newSubTotal + newVat;
      let html = `<div class="sum-row"><span>SL trả:</span><span style="color:var(--amber);font-weight:700">−${fmtQty(qty)} ${sale.unit}</span></div>`;
      html += `<div class="sum-row"><span>Đơn giá:</span><span>${fmt(price)}đ</span></div>`;
      html += `<div class="sum-row"><span>Giá trị hàng trả (chưa VAT):</span><span>${fmt(refundBase)}đ</span></div>`;
      if (vatRate > 0) html += `<div class="sum-row"><span>VAT ${vatRate}% hoàn lại:</span><span style="color:var(--blue)">+${fmt(refundVat)}đ</span></div>`;
      html += `<div class="sum-total"><span>💰 Tổng hoàn lại cho khách:</span><span style="color:var(--green)">${fmt(refund)}đ</span></div>`;
      html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)">`;
      html += `<b style="color:var(--text)">📋 Đơn gốc sau khi trả:</b><br>`;
      html += `SL còn: <b>${fmtQty(Math.max(0,newQty))} ${sale.unit}</b> &nbsp;·&nbsp; Doanh thu mới: <b style="color:var(--accent)">${fmt(Math.max(0,newTotal))}đ</b>`;
      if (qty > sale.qty) html += `<br><span style="color:var(--red)">⚠️ Vượt quá SL đã bán!</span>`;
      html += `</div>`;
      html += `<div style="margin-top:8px;font-size:12px;color:var(--green)">✅ Hàng sẽ hoàn vào kho: +${fmtQty(qty)}</div>`;
      sumEl.innerHTML = html;
    } else { sumEl.style.display = 'none'; }
  }

  const prod = products.find(p => p.id === sale.productId);

  S.modal = {
    title: `↩️ Trả hàng — ${sale.customer}`,
    large: true,
    content: h('div', { className: 'fg fg2' },
      h('div', { className: 'fg-full', style: { background: 'var(--bg3)', borderRadius: 'var(--r2)', padding: '12px 14px', fontSize: 13, marginBottom: 4 } },
        h('div', { style: { fontWeight: 700, color: 'var(--accent)', marginBottom: 4 } }, '📋 Đơn gốc liên kết'),
        h('div', { style: { color: 'var(--text2)' } }, `${fmtD(sale.date)} · ${sale.productName} · ${fmtQty(sale.qty)} ${sale.unit} · ${fmt(sale.total)}đ` + (saleHasVat ? ` · VAT ${sale.vatRate}%` : ''))
      ),
      fg('Ngày trả', null, inpDate),
      fg('Số lượng trả *', null, inpReturnQty, maxQtyEl),
      fg('Đơn giá bán (VNĐ)', null, inpUnitPrice),
      fg('Lý do trả hàng', true, inpReason),
      vatCheckWrap,
      sumEl
    ),
    footer: [
      h('button', { className: 'btn', onClick: () => { S.modal = null; render(); } }, 'Huỷ'),
      h('button', { className: 'btn btn-primary', onClick: () => {
        const returnQty  = parseFloat(inpReturnQty.value) || 0;
        const unitPrice  = parseFloat(inpUnitPrice.value) || 0;
        if (returnQty <= 0) { toast('Số lượng trả phải lớn hơn 0!', 'error'); return; }
        if (returnQty > sale.qty) { toast(`⚠️ SL trả (${fmtQty(returnQty)}) vượt quá SL đã bán (${fmtQty(sale.qty)})!`, 'error'); return; }
        if (unitPrice <= 0) { toast('Vui lòng nhập đơn giá!', 'error'); return; }

        const vatRate = (saleHasVat && includeVat) ? (sale.vatRate || 0) : 0;
        const refundBase  = returnQty * unitPrice;
        const refundVat   = Math.round(refundBase * vatRate / 100);
        const refundValue = refundBase + refundVat;
        const rec = {
          id: 'r' + uid(),
          date: inpDate.value,
          customer: sale.customer,
          phone: sale.phone || '',
          productId: sale.productId,
          productName: sale.productName,
          unit: sale.unit || (prod?.unit || ''),
          returnQty,
          unitPrice,
          vatRate,
          refundVat,
          refundValue,
          reason: inpReason.value.trim(),
          saleId: sale.id,
          createdAt: new Date().toISOString(),
          _updated: new Date().toISOString()
        };

        // Hoàn hàng vào kho
        S.products = S.products.map(p => p.id === sale.productId
          ? { ...p, stock: (parseFloat(p.stock)||0) + returnQty, _updated: new Date().toISOString(), _stockTx: CLOUD.unionStockTx(p._stockTx, [rec.id]) }
          : p);

        // Điều chỉnh đơn gốc
        S.sales = S.sales.map(s => {
          if (s.id !== sale.id) return s;
          const newQty      = Math.max(0, s.qty - returnQty);
          const newSubTotal = newQty * s.unitPrice;
          const newVatAmt   = Math.round(newSubTotal * s.vatRate / 100);
          const newTotal    = newSubTotal + newVatAmt;
          const newStatus   = s.paid >= newTotal && newTotal >= 0 ? 'done' : 'debt';
          return { ...s, qty: newQty, subTotal: newSubTotal, vatAmt: newVatAmt, total: newTotal, status: newStatus, _updated: new Date().toISOString() };
        });

        S.returns = [rec, ...S.returns];
        save('returns'); save('products'); save('sales');

        S.modal = null;
        toast(`✅ Đã trả ${fmtQty(returnQty)} ${sale.unit} · Hoàn tiền: ${fmt(refundValue)}đ` + (vatRate > 0 ? ` (gồm VAT ${vatRate}%)` : ''), 'success');
        render();
      } }, '💾 Xác nhận trả hàng')
    ]
  };
  render();
}

function openReturn(rebuild) {
  const { sales, products } = S;
  // Chỉ lấy các đơn có qty > 0
  const eligibleSales = sales.filter(s => s.qty > 0 && s.productId);

  const inpDate    = mkInput('date', '', today(), v => {});
  const inpReason  = mkInput('text', 'VD: Dư vật liệu, không đúng quy cách...', '', v => {});

  // Dropdown chọn đơn bán
  const selSale = mkSelect(
    [{ value: '', label: '— Chọn đơn bán gốc (để liên kết) —' },
     ...eligibleSales.map(s => ({ value: s.id, label: `${fmtD(s.date)} · ${s.customer} · ${s.productName} · ${fmtQty(s.qty)} ${s.unit} · ${fmt(s.total)}đ` }))],
    '',
    v => {
      const s = sales.find(x => x.id === v);
      if (s) {
        inpCust.value     = s.customer;
        inpPhone.value    = s.phone || '';
        selProd.value     = s.productId;
        inpUnitPrice.value = s.unitPrice;
        maxQtyEl.textContent = `Tối đa: ${fmtQty(s.qty)} ${s.unit}`;
        inpReturnQty.max  = s.qty;
        updateSum();
      }
    }
  );

  const inpCust      = mkInput('text',   'Tên khách hàng *', '', v => {});
  const inpPhone     = mkInput('tel',    '0909...', '', v => {});
  const selProd      = mkSelect(
    [{ value: '', label: '— Chọn sản phẩm —' }, ...products.map(p => ({ value: p.id, label: (p.sku ? '[' + p.sku + '] ' : '') + p.name + ' (' + fmtQty(p.stock) + ' ' + p.unit + ' trong kho)' }))],
    '', v => { updateSum(); }
  );
  const inpReturnQty = mkInput('number', 'Số lượng khách trả', '', v => updateSum());
  const inpUnitPrice = mkInput('number', 'Đơn giá (VNĐ)', '', v => updateSum());

  // VAT checkbox — dùng cho trả hàng thủ công
  let returnVatRate = 0;
  const vatReturnWrap = document.createElement('div');
  vatReturnWrap.className = 'fg-full';
  vatReturnWrap.style.cssText = 'background:rgba(91,143,232,.08);border:1px solid rgba(91,143,232,.3);border-radius:var(--r2);padding:10px 14px';
  const vrChkRow = document.createElement('div');
  vrChkRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px';
  const vrChk = document.createElement('input');
  vrChk.type = 'checkbox'; vrChk.id = 'vatRetChk_' + uid(); vrChk.checked = false;
  vrChk.style.cssText = 'width:17px;height:17px;cursor:pointer;accent-color:var(--accent)';
  const vrChkLbl = document.createElement('label');
  vrChkLbl.htmlFor = vrChk.id;
  vrChkLbl.style.cssText = 'font-size:13px;cursor:pointer;color:var(--text);font-weight:600';
  vrChkLbl.textContent = '🏛️ Đơn hàng bán có VAT — hoàn VAT cho khách';
  vrChkRow.appendChild(vrChk); vrChkRow.appendChild(vrChkLbl);
  const vrVatControls = document.createElement('div');
  vrVatControls.style.display = 'none';
  const vrVatRow = mkVatRow(0, v => { returnVatRate = v; updateSum(); });
  vrVatControls.appendChild(vrVatRow);
  vrChk.addEventListener('change', () => {
    vrVatControls.style.display = vrChk.checked ? '' : 'none';
    if (!vrChk.checked) { returnVatRate = 0; updateSum(); }
  });
  vatReturnWrap.appendChild(vrChkRow);
  vatReturnWrap.appendChild(vrVatControls);

  const maxQtyEl = document.createElement('div');
  maxQtyEl.style.cssText = 'font-size:11px;color:var(--text2);margin-top:4px';
  maxQtyEl.textContent = '';

  // Summary box
  const sumEl = document.createElement('div');
  sumEl.className = 'sum-box fg-full';
  sumEl.style.display = 'none';

  function updateSum() {
    const qty   = parseFloat(inpReturnQty.value) || 0;
    const price = parseFloat(inpUnitPrice.value) || 0;
    const vatRate = returnVatRate || 0;
    const refundBase = qty * price;
    const refundVat  = Math.round(refundBase * vatRate / 100);
    const refund = refundBase + refundVat;
    const saleId = selSale.value;
    const origSale = saleId ? sales.find(s => s.id === saleId) : null;

    if (qty > 0 && price > 0) {
      sumEl.style.display = '';
      let html = `<div class="sum-row"><span>SL trả:</span><span style="color:var(--amber);font-weight:700">−${fmtQty(qty)}</span></div>`;
      html += `<div class="sum-row"><span>Đơn giá:</span><span>${fmt(price)}đ</span></div>`;
      html += `<div class="sum-row"><span>Giá trị hàng (chưa VAT):</span><span>${fmt(refundBase)}đ</span></div>`;
      if (vatRate > 0) html += `<div class="sum-row"><span>VAT ${vatRate}% hoàn lại:</span><span style="color:var(--blue)">+${fmt(refundVat)}đ</span></div>`;
      html += `<div class="sum-total"><span>💰 Tổng hoàn lại cho khách:</span><span style="color:var(--green)">${fmt(refund)}đ</span></div>`;
      if (origSale) {
        const newQty      = origSale.qty - qty;
        const newSubTotal = newQty * origSale.unitPrice;
        const newVat      = Math.round(newSubTotal * origSale.vatRate / 100);
        const newTotal    = newSubTotal + newVat;
        html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)">`;
        html += `<b style="color:var(--text)">📋 Đơn gốc sau khi trả:</b><br>`;
        html += `SL còn lại: <b>${fmtQty(newQty)} ${origSale.unit}</b> &nbsp;·&nbsp; `;
        html += `Doanh thu mới: <b style="color:var(--accent)">${fmt(newTotal)}đ</b>`;
        if (newTotal < 0 || newQty < 0) html += `<br><span style="color:var(--red)">⚠️ SL trả vượt quá SL đã bán!</span>`;
        html += `</div>`;
      }
      html += `<div style="margin-top:8px;font-size:12px;color:var(--green)">✅ Hàng sẽ được hoàn lại kho: +${fmtQty(qty)}</div>`;
      sumEl.innerHTML = html;
    } else { sumEl.style.display = 'none'; }
  }

  S.modal = {
    title: '↩️ Tạo phiếu trả hàng',
    large: true,
    content: h('div', { className: 'fg fg2' },
      fg('Ngày trả', null, inpDate),
      fg('Đơn bán gốc (liên kết)', true, selSale),
      fg('Khách hàng *', null, inpCust),
      fg('Số điện thoại', null, inpPhone),
      fg('Sản phẩm trả *', true, selProd),
      fg('Số lượng trả *', null, inpReturnQty, maxQtyEl),
      fg('Đơn giá bán (VNĐ) *', null, inpUnitPrice),
      fg('Lý do trả hàng', true, inpReason),
      vatReturnWrap,
      sumEl
    ),
    footer: [
      h('button', { className: 'btn', onClick: () => { S.modal = null; render(); } }, 'Huỷ'),
      h('button', { className: 'btn btn-primary', onClick: () => {
        const customer   = inpCust.value.trim();
        const productId  = selProd.value;
        const returnQty  = parseFloat(inpReturnQty.value) || 0;
        const unitPrice  = parseFloat(inpUnitPrice.value) || 0;
        const saleId     = selSale.value;
        const vatRate    = returnVatRate || 0;

        if (!customer)   { toast('Vui lòng nhập tên khách hàng!', 'error'); return; }
        if (!productId)  { toast('Vui lòng chọn sản phẩm!', 'error'); return; }
        if (returnQty <= 0) { toast('Số lượng trả phải lớn hơn 0!', 'error'); return; }
        if (unitPrice <= 0) { toast('Vui lòng nhập đơn giá!', 'error'); return; }

        // Kiểm tra nếu có đơn gốc: SL trả không được vượt SL đã bán
        const origSale = saleId ? sales.find(s => s.id === saleId) : null;
        if (origSale && returnQty > origSale.qty) {
          toast(`⚠️ Số lượng trả (${fmtQty(returnQty)}) vượt quá SL đã bán (${fmtQty(origSale.qty)})!`, 'error');
          return;
        }

        const prod       = products.find(p => p.id === productId);
        const refundBase  = returnQty * unitPrice;
        const refundVat   = Math.round(refundBase * vatRate / 100);
        const refundValue = refundBase + refundVat;

        // Tạo phiếu trả
        const rec = {
          id: 'r' + uid(),
          date: inpDate.value,
          customer,
          phone: inpPhone.value.trim(),
          productId,
          productName: prod?.name || '',
          unit: prod?.unit || '',
          returnQty,
          unitPrice,
          vatRate,
          refundVat,
          refundValue,
          reason: inpReason.value.trim(),
          saleId: saleId || null,
          createdAt: new Date().toISOString(),
          _updated: new Date().toISOString()
        };

        // Cộng hàng trả lại vào kho
        S.products = S.products.map(p => p.id === productId
          ? { ...p, stock: (parseFloat(p.stock)||0) + returnQty, _updated: new Date().toISOString(), _stockTx: CLOUD.unionStockTx(p._stockTx, [rec.id]) }
          : p);

        // Điều chỉnh đơn bán gốc: trừ SL và doanh thu
        if (origSale) {
          S.sales = S.sales.map(s => {
            if (s.id !== saleId) return s;
            const newQty      = Math.max(0, s.qty - returnQty);
            const newSubTotal = newQty * s.unitPrice;
            const newVatAmt   = Math.round(newSubTotal * s.vatRate / 100);
            const newTotal    = newSubTotal + newVatAmt;
            const newStatus   = s.paid >= newTotal && newTotal >= 0 ? 'done' : 'debt';
            return { ...s, qty: newQty, subTotal: newSubTotal, vatAmt: newVatAmt, total: newTotal, status: newStatus, _updated: new Date().toISOString() };
          });
        }

        S.returns = [rec, ...S.returns];
        save('returns'); save('products');
        if (origSale) save('sales');

        S.modal = null;
        toast(`✅ Đã tạo phiếu trả hàng · Hoàn kho: +${fmtQty(returnQty)} · Hoàn tiền: ${fmt(refundValue)}đ` + (vatRate > 0 ? ` (gồm VAT ${vatRate}%)` : ''), 'success');
        rebuild();
        render();
      } }, '💾 Lưu phiếu trả hàng')
    ]
  };
  render();
}

// ═══════════════════════════════════════════════════════════════
//  NHÂN VIÊN — Doanh số, đơn hàng, công nợ theo nhân viên
// ═══════════════════════════════════════════════════════════════
function pgStaffReport() {
  const { sales, paymentlogs } = S;
  const staffAccounts = AUTH.getStaffList ? AUTH.getStaffList() : (() => {
    try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; }
  })();

  // State
  if (!pgStaffReport._period) pgStaffReport._period = 'month';
  if (!pgStaffReport._selDate) pgStaffReport._selDate = today();
  if (!pgStaffReport._selStaff) pgStaffReport._selStaff = '__all__';
  if (!pgStaffReport._tab) pgStaffReport._tab = 'summary';

  let period = pgStaffReport._period;
  let selDate = pgStaffReport._selDate;
  let selStaff = pgStaffReport._selStaff;
  let tab = pgStaffReport._tab;

  const wrap = document.createElement('div');

  function rebuild() {
    period = pgStaffReport._period;
    selDate = pgStaffReport._selDate;
    selStaff = pgStaffReport._selStaff;
    tab = pgStaffReport._tab;
    wrap.innerHTML = '';
    buildContent();
  }

  function matchPeriod(dateStr) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    const ref = new Date(selDate);
    if (period === 'day') return d.toDateString() === ref.toDateString();
    if (period === 'month') return d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear();
    if (period === 'year') return d.getFullYear() === ref.getFullYear();
    return true; // all
  }

  function periodLabel() {
    const d = new Date(selDate);
    if (period === 'day') return fmtD(selDate);
    if (period === 'month') return `Tháng ${d.getMonth()+1}/${d.getFullYear()}`;
    if (period === 'year') return `Năm ${d.getFullYear()}`;
    return 'Tất cả thời gian';
  }

  function shiftPeriod(dir) {
    const d = new Date(selDate);
    if (period === 'day') d.setDate(d.getDate() + dir);
    else if (period === 'month') d.setMonth(d.getMonth() + dir);
    else if (period === 'year') d.setFullYear(d.getFullYear() + dir);
    pgStaffReport._selDate = localDateStr(d);
    rebuild();
  }

  // Gom dữ liệu theo nhân viên
  function getStaffStats(filteredSales) {
    const map = {};
    filteredSales.forEach(s => {
      const sid = s.staffId || '__unknown__';
      const sname = s.staffName || (s.staffId ? s.staffId : '— Không rõ —');
      if (!map[sid]) map[sid] = {
        id: sid, name: sname,
        orders: 0, revenue: 0, revenueNet: 0, vatAmt: 0,
        paid: 0, debt: 0, debtOrders: 0, doneOrders: 0,
        salesList: []
      };
      const st = map[sid];
      st.orders++;
      st.revenue += (s.total || 0);
      st.revenueNet += (s.subTotal != null ? s.subTotal : Math.max(0, (s.total||0) - (s.vatAmt||0) - (s.shipFee||0)));
      st.vatAmt += (s.vatAmt || 0);
      st.paid += (s.paid || 0);
      const debtAmt = Math.max(0, (s.total||0) - (s.paid||0));
      st.debt += debtAmt;
      if (s.status === 'debt') st.debtOrders++;
      else st.doneOrders++;
      st.salesList.push(s);
    });
    return Object.values(map).sort((a,b) => b.revenue - a.revenue);
  }

  function buildContent() {
    // Header
    const hdr = h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '👤 Báo Cáo Nhân Viên'),
        h('div', { className: 'page-sub' }, 'Doanh số · Đơn hàng · Công nợ theo từng nhân viên')
      )
    );
    wrap.appendChild(hdr);

    // Period filter bar
    const filterBar = h('div', { className: 'card', style: { marginBottom: 14, padding: '12px 16px' } });
    const filterRow = h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' } });

    // Period buttons
    ['day','month','year','all'].forEach(p => {
      const lbl = p==='day'?'Ngày':p==='month'?'Tháng':p==='year'?'Năm':'Tất cả';
      const btn = h('button', {
        className: 'btn btn-sm',
        style: { background: period===p?'var(--accent)':'var(--bg3)', color: period===p?'#0f1117':'var(--text2)', borderColor: period===p?'var(--accent)':'var(--border2)', fontWeight: period===p?700:500 },
        onClick: () => { pgStaffReport._period = p; rebuild(); }
      }, lbl);
      filterRow.appendChild(btn);
    });

    // Nav prev/next (ẩn khi chọn "all")
    if (period !== 'all') {
      const navWrap = h('div', { style: { display: 'flex', alignItems: 'center', gap: 6, marginLeft: 8 } },
        h('button', { className: 'btn btn-sm btn-ghost', onClick: () => shiftPeriod(-1) }, '◀'),
        h('span', { style: { fontWeight: 700, color: 'var(--accent)', fontSize: 13, minWidth: 120, textAlign: 'center' } }, periodLabel()),
        h('button', { className: 'btn btn-sm btn-ghost', onClick: () => shiftPeriod(1) }, '▶')
      );
      filterRow.appendChild(navWrap);
    }

    // Nhân viên filter
    const staffOptions = [{ value: '__all__', label: '👥 Tất cả nhân viên' }];
    // Gom danh sách nhân viên có trong đơn hàng
    const staffInSales = {};
    sales.forEach(s => {
      const sid = s.staffId || '__unknown__';
      if (!staffInSales[sid]) staffInSales[sid] = s.staffName || s.staffId || '— Không rõ —';
    });
    Object.entries(staffInSales).forEach(([id, name]) => staffOptions.push({ value: id, label: '👤 ' + name }));

    const staffSel = mkSelect(staffOptions, selStaff, v => { pgStaffReport._selStaff = v; rebuild(); });
    staffSel.style.cssText += ';min-width:180px;max-width:220px';
    filterRow.appendChild(staffSel);

    filterBar.appendChild(filterRow);
    wrap.appendChild(filterBar);

    // Lọc đơn hàng
    const filteredByPeriod = period === 'all' ? [...sales] : sales.filter(s => matchPeriod(s.date));
    const filteredSales = selStaff === '__all__' ? filteredByPeriod :
      filteredByPeriod.filter(s => (s.staffId || '__unknown__') === selStaff);

    const statsAll = getStaffStats(filteredByPeriod);
    const statsFiltered = getStaffStats(filteredSales);

    // ── Tab buttons
    const tabBar = h('div', { style: { display: 'flex', gap: 6, marginBottom: 16, flexWrap: 'wrap' } });
    [['summary','📊 Tổng quan'],['orders','🧾 Đơn hàng'],['debt','💳 Công nợ']].forEach(([tid, tlbl]) => {
      tabBar.appendChild(h('button', {
        className: 'btn btn-sm',
        style: { background: tab===tid?'var(--accent)':'var(--bg3)', color: tab===tid?'#0f1117':'var(--text2)', borderColor: tab===tid?'var(--accent)':'var(--border2)', fontWeight: tab===tid?700:500 },
        onClick: () => { pgStaffReport._tab = tid; rebuild(); }
      }, tlbl));
    });
    wrap.appendChild(tabBar);

    // ══════════════════════════════════════════
    //  TAB: TỔNG QUAN
    // ══════════════════════════════════════════
    if (tab === 'summary') {
      // Stats tổng (theo nhân viên đã lọc)
      const totalRev = filteredSales.reduce((a,s)=>a+(s.total||0),0);
      const totalDebt = filteredSales.reduce((a,s)=>a+Math.max(0,(s.total||0)-(s.paid||0)),0);
      const totalOrders = filteredSales.length;
      const debtOrders = filteredSales.filter(s=>s.status==='debt').length;

      const sg = h('div', { className: 'stats-grid', style: { gridTemplateColumns: 'repeat(4,1fr)' } });
      function mkStat(label, val, sub, color) {
        return h('div', { className: 'stat' },
          h('div', { className: 'stat-label' }, label),
          h('div', { className: 'stat-val', style: { color: color || 'var(--accent)' } }, val),
          h('div', { className: 'stat-change' }, sub)
        );
      }
      sg.appendChild(mkStat('Tổng doanh số', fmt(totalRev)+'đ', totalOrders+' đơn hàng', 'var(--accent)'));
      sg.appendChild(mkStat('Đã thu', fmt(totalRev-totalDebt)+'đ', (totalOrders-debtOrders)+' đơn xong', 'var(--green)'));
      sg.appendChild(mkStat('Còn nợ', fmt(totalDebt)+'đ', debtOrders+' đơn chưa thu', 'var(--red)'));
      sg.appendChild(mkStat('TB/đơn', totalOrders>0?fmt(Math.round(totalRev/totalOrders))+'đ':'—', 'doanh số trung bình', 'var(--blue)'));
      wrap.appendChild(sg);

      // Bảng so sánh nhân viên (chỉ show khi chọn "tất cả")
      if (selStaff === '__all__' && statsAll.length > 0) {
        const card = h('div', { className: 'card' });
        card.appendChild(h('div', { className: 'card-title' }, '🏆 Bảng Xếp Hạng Doanh Số Nhân Viên'));
        const maxRev2 = statsAll[0]?.revenue || 1;
        statsAll.forEach((st, idx) => {
          const pct2 = maxRev2 > 0 ? Math.round(st.revenue/maxRev2*100) : 0;
          const colors2 = ['var(--accent)','var(--green)','var(--blue)','var(--amber)'];
          const color2 = colors2[idx % colors2.length];
          const row = h('div', { style: { marginBottom: 14, cursor: 'pointer' },
            onClick: () => { pgStaffReport._selStaff = st.id; rebuild(); }
          });
          row.appendChild(h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 5 } },
            h('div', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
              h('span', { style: { fontSize: 15, fontWeight: 700, color: idx===0?'var(--accent)':'var(--text3)', minWidth: 24 } }, idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1)),
              h('span', { style: { fontWeight: 700, color: 'var(--text)', fontSize: 14 } }, st.name)
            ),
            h('div', { style: { textAlign: 'right' } },
              h('div', { style: { fontWeight: 700, color: color2, fontSize: 14 } }, fmt(st.revenue)+'đ'),
              h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 2 } }, st.orders+' đơn · Nợ: '+(st.debt>0?fmt(st.debt)+'đ':'0đ'))
            )
          ));
          // progress bar
          row.appendChild(h('div', { style: { height: 7, background: 'var(--bg4)', borderRadius: 99, overflow: 'hidden' } },
            h('div', { style: { height: '100%', width: pct2+'%', background: color2, borderRadius: 99, transition: 'width .5s ease' } })
          ));
          // mini stats
          const miniRow = h('div', { style: { display: 'flex', gap: 12, marginTop: 5, fontSize: 11, color: 'var(--text3)' } });
          miniRow.appendChild(h('span', {}, '✅ Xong: '+fmt(st.revenue-st.debt)+'đ'));
          miniRow.appendChild(h('span', { style: { color: st.debt>0?'var(--red)':'var(--text3)' } }, '⚠️ Nợ: '+fmt(st.debt)+'đ'));
          miniRow.appendChild(h('span', {}, '📦 '+st.doneOrders+' xong / '+st.debtOrders+' nợ'));
          row.appendChild(miniRow);
          card.appendChild(row);
        });
        wrap.appendChild(card);
      } else if (selStaff !== '__all__') {
        // Chi tiết 1 nhân viên
        const st2 = statsFiltered[0];
        if (st2) {
          const card2 = h('div', { className: 'card' });
          card2.appendChild(h('div', { className: 'card-title' }, '👤 Chi tiết: '+st2.name));
          const grid2 = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12 } });
          function miniStat2(icon, label, val, color) {
            return h('div', { style: { background: 'var(--bg3)', borderRadius: 'var(--r2)', padding: '12px', textAlign: 'center', border: '1px solid var(--border)' } },
              h('div', { style: { fontSize: 18 } }, icon),
              h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 4, textTransform: 'uppercase', letterSpacing: .8, fontWeight: 700 } }, label),
              h('div', { style: { fontSize: 16, fontWeight: 700, color: color, marginTop: 4 } }, val)
            );
          }
          grid2.appendChild(miniStat2('🧾', 'Tổng đơn', st2.orders+' đơn', 'var(--accent)'));
          grid2.appendChild(miniStat2('💰', 'Doanh số', fmt(st2.revenue)+'đ', 'var(--accent)'));
          grid2.appendChild(miniStat2('✅', 'Đã thu', fmt(st2.paid)+'đ', 'var(--green)'));
          grid2.appendChild(miniStat2('⚠️', 'Còn nợ', fmt(st2.debt)+'đ', st2.debt>0?'var(--red)':'var(--text3)'));
          grid2.appendChild(miniStat2('📦', 'Đơn xong', st2.doneOrders+' đơn', 'var(--green)'));
          grid2.appendChild(miniStat2('🔴', 'Đơn nợ', st2.debtOrders+' đơn', st2.debtOrders>0?'var(--red)':'var(--text3)'));
          card2.appendChild(grid2);
          wrap.appendChild(card2);

          // Top sản phẩm nhân viên này bán
          const prodMap2 = {};
          st2.salesList.forEach(s => {
            const k = s.productName || 'Khác';
            if (!prodMap2[k]) prodMap2[k] = { name: k, count: 0, revenue: 0 };
            prodMap2[k].count++;
            prodMap2[k].revenue += s.total || 0;
          });
          const topProds = Object.values(prodMap2).sort((a,b)=>b.revenue-a.revenue).slice(0,5);
          if (topProds.length > 0) {
            const card3 = h('div', { className: 'card' });
            card3.appendChild(h('div', { className: 'card-title' }, '🏆 Sản phẩm bán chạy của '+st2.name));
            const maxPR = topProds[0].revenue || 1;
            topProds.forEach((tp, ti) => {
              const bar3 = h('div', { style: { marginBottom: 10 } });
              bar3.appendChild(h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 3 } },
                h('span', { style: { fontWeight: 600 } }, (ti+1)+'. '+tp.name),
                h('span', { style: { color: 'var(--accent)', fontWeight: 700 } }, fmt(tp.revenue)+'đ')
              ));
              bar3.appendChild(h('div', { style: { height: 6, background: 'var(--bg4)', borderRadius: 99 } },
                h('div', { style: { height: '100%', width: Math.round(tp.revenue/maxPR*100)+'%', background: 'var(--accent)', borderRadius: 99 } })
              ));
              bar3.appendChild(h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 2 } }, tp.count+' đơn'));
              card3.appendChild(bar3);
            });
            wrap.appendChild(card3);
          }
        }
      }
    }

    // ══════════════════════════════════════════
    //  TAB: ĐƠN HÀNG
    // ══════════════════════════════════════════
    if (tab === 'orders') {
      if (filteredSales.length === 0) {
        wrap.appendChild(h('div', { className: 'card' },
          h('div', { className: 'empty' },
            h('div', { className: 'empty-icon' }, '🧾'),
            h('div', {}, 'Không có đơn hàng nào trong kỳ này')
          )
        ));
      } else {
        const card = h('div', { className: 'card' });
        card.appendChild(h('div', { className: 'card-title' }, `🧾 Danh sách đơn hàng (${filteredSales.length} đơn)`));
        const sorted = [...filteredSales].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
        const tw = h('div', { className: 'table-wrap' });
        const tbl = h('table', {},
          h('thead', {}, h('tr', {},
            th('Ngày'), th('Nhân viên'), th('Khách hàng'), th('Sản phẩm'),
            th('SL'), th('Doanh số', true), th('Đã thu', true), th('Còn nợ', true), th('TT')
          )),
          h('tbody', {}, ...sorted.map(s => {
            const debt2 = Math.max(0, (s.total||0) - (s.paid||0));
            return h('tr', {},
              h('td', { style: { whiteSpace: 'nowrap', fontSize: 12, color: 'var(--text2)' } }, fmtD(s.date)),
              h('td', {}, h('span', { style: { color: 'var(--accent)', fontWeight: 700, fontSize: 12 } }, s.staffName || s.staffId || '—')),
              h('td', {}, h('div', { style: { fontWeight: 600 } }, s.customer || '—'), s.phone ? h('div', { style: { fontSize: 11, color: 'var(--text3)' } }, s.phone) : null),
              h('td', { style: { maxWidth: 160 } }, h('div', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, s.productName || '—')),
              h('td', {}, fmtQty(s.qty)+' '+(s.unit||'')),
              h('td', { style: { textAlign: 'right', fontWeight: 700, color: 'var(--accent)' } }, fmt(s.total)+'đ'),
              h('td', { style: { textAlign: 'right', color: 'var(--green)' } }, fmt(s.paid)+'đ'),
              h('td', { style: { textAlign: 'right' } }, debt2 > 0 ? h('span', { className: 'amount-neg' }, fmt(debt2)+'đ') : h('span', { style: { color: 'var(--text3)' } }, '—')),
              h('td', {}, h('span', { className: 'badge badge-'+(s.status==='done'?'green':'red') }, s.status==='done'?'Xong':'Nợ'))
            );
          }))
        );
        tw.appendChild(tbl);
        card.appendChild(tw);
        // Tổng cuối bảng
        const totRev3 = filteredSales.reduce((a,s)=>a+(s.total||0),0);
        const totPaid3 = filteredSales.reduce((a,s)=>a+(s.paid||0),0);
        const totDebt3 = filteredSales.reduce((a,s)=>a+Math.max(0,(s.total||0)-(s.paid||0)),0);
        card.appendChild(h('div', { style: { display: 'flex', gap: 16, marginTop: 14, padding: '12px 0', borderTop: '1px solid var(--border)', flexWrap: 'wrap' } },
          h('div', {}, h('span', { style: { fontSize: 12, color: 'var(--text2)' } }, 'Tổng doanh số: '), h('span', { style: { fontWeight: 700, color: 'var(--accent)' } }, fmt(totRev3)+'đ')),
          h('div', {}, h('span', { style: { fontSize: 12, color: 'var(--text2)' } }, 'Đã thu: '), h('span', { style: { fontWeight: 700, color: 'var(--green)' } }, fmt(totPaid3)+'đ')),
          h('div', {}, h('span', { style: { fontSize: 12, color: 'var(--text2)' } }, 'Còn nợ: '), h('span', { style: { fontWeight: 700, color: 'var(--red)' } }, fmt(totDebt3)+'đ'))
        ));
        wrap.appendChild(card);
      }
    }

    // ══════════════════════════════════════════
    //  TAB: CÔNG NỢ
    // ══════════════════════════════════════════
    if (tab === 'debt') {
      // Lọc tất cả đơn nợ (không lọc theo kỳ vì công nợ cần xem tổng cộng dồn)
      const allDebtSales = sales.filter(s => s.status === 'debt');
      const debtFiltered = selStaff === '__all__' ? allDebtSales :
        allDebtSales.filter(s => (s.staffId||'__unknown__') === selStaff);

      const debtByStaff = {};
      debtFiltered.forEach(s => {
        const sid = s.staffId || '__unknown__';
        const sname = s.staffName || s.staffId || '— Không rõ —';
        if (!debtByStaff[sid]) debtByStaff[sid] = { id: sid, name: sname, orders: [], totalDebt: 0 };
        const d3 = Math.max(0, (s.total||0)-(s.paid||0));
        debtByStaff[sid].orders.push({ ...s, debtAmt: d3 });
        debtByStaff[sid].totalDebt += d3;
      });

      const debtStaffList = Object.values(debtByStaff).sort((a,b) => b.totalDebt - a.totalDebt);
      const grandDebt = debtStaffList.reduce((a,st)=>a+st.totalDebt,0);

      if (grandDebt === 0) {
        wrap.appendChild(h('div', { className: 'card' },
          h('div', { className: 'empty' },
            h('div', { className: 'empty-icon' }, '✅'),
            h('div', {}, 'Không có công nợ tồn đọng!')
          )
        ));
        return;
      }

      // Tổng công nợ
      wrap.appendChild(h('div', { className: 'card', style: { background: 'rgba(224,92,92,.08)', borderColor: 'rgba(224,92,92,.3)' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 } },
          h('div', {},
            h('div', { style: { fontSize: 12, color: 'var(--text2)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: .8 } }, '⚠️ Tổng công nợ khách hàng qua nhân viên'),
            h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 3 } }, debtFiltered.length+' đơn chưa thu đầy đủ')
          ),
          h('div', { style: { fontSize: 24, fontWeight: 700, color: 'var(--red)', fontFamily: 'Georgia,serif' } }, fmt(grandDebt)+'đ')
        )
      ));

      debtStaffList.forEach(st => {
        const card = h('div', { className: 'card' });
        card.appendChild(h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 } },
          h('div', {},
            h('div', { style: { fontWeight: 700, fontSize: 15 } }, '👤 '+st.name),
            h('div', { style: { fontSize: 12, color: 'var(--text3)', marginTop: 2 } }, st.orders.length+' đơn còn nợ')
          ),
          h('div', { style: { textAlign: 'right' } },
            h('div', { style: { fontWeight: 700, color: 'var(--red)', fontSize: 18 } }, fmt(st.totalDebt)+'đ'),
            h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 2 } }, 'Tổng nợ cộng dồn')
          )
        ));

        const tw2 = h('div', { className: 'table-wrap' });
        const sortedDebt = [...st.orders].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
        tw2.appendChild(h('table', {},
          h('thead', {}, h('tr', {},
            th('Ngày'), th('Khách hàng'), th('SĐT'), th('Sản phẩm'),
            th('Tổng tiền', true), th('Đã thu', true), th('Còn nợ', true), th('Số ngày nợ')
          )),
          h('tbody', {}, ...sortedDebt.map(s => {
            const daysDiff = Math.floor((new Date() - new Date(s.date)) / 86400000);
            const urgColor = daysDiff > 60 ? 'var(--red)' : daysDiff > 30 ? 'var(--amber)' : 'var(--text2)';
            return h('tr', {},
              h('td', { style: { fontSize: 12, color: 'var(--text2)', whiteSpace: 'nowrap' } }, fmtD(s.date)),
              h('td', {}, h('div', { style: { fontWeight: 600 } }, s.customer||'—')),
              h('td', { style: { fontSize: 12 } }, s.phone||'—'),
              h('td', { style: { maxWidth: 140, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, s.productName||'—'),
              h('td', { style: { textAlign: 'right', fontWeight: 700 } }, fmt(s.total)+'đ'),
              h('td', { style: { textAlign: 'right', color: 'var(--green)' } }, fmt(s.paid)+'đ'),
              h('td', { style: { textAlign: 'right' } }, h('span', { className: 'amount-neg' }, fmt(s.debtAmt)+'đ')),
              h('td', {}, h('span', { style: { color: urgColor, fontWeight: daysDiff>30?700:400, fontSize: 12 } }, daysDiff+' ngày'))
            );
          }))
        ));
        card.appendChild(tw2);

        // Nút thu nợ nhanh — v7.5.0: tạo paymentlog để có audit trail
        const quickPayRow = h('div', { style: { display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap' } });
        st.orders.forEach(s => {
          const debtLeft = Math.max(0, (s.total||0)-(s.paid||0));
          if (debtLeft <= 0) return;
          const btn = h('button', {
            className: 'btn btn-xs',
            style: { background: 'var(--green)', color: '#fff', border: 'none', fontSize: 11 },
            onClick: () => {
              const now = new Date();
              // Cập nhật đơn hàng
              S.sales = S.sales.map(x => x.id === s.id ? { ...x, paid: x.total, status: 'done', _updated: new Date().toISOString() } : x);
              // Tạo paymentlog — audit trail
              const log = {
                id: 'pl' + Date.now() + Math.random().toString(36).slice(2,6),
                refId: s.id, type: 'customer',
                amount: debtLeft, date: localDateStr(now),
                time: now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0'),
                note: 'Thu nợ nhanh từ báo cáo nhân viên',
                staffId: AUTH.currentUser()?.username || null,
                createdAt: now.toISOString(),
                _updated: now.toISOString()
              };
              S.paymentlogs = [...(S.paymentlogs || []), log];
              save('sales'); save('paymentlogs');
              toast('✅ Đã thu nợ: '+s.customer+' — '+fmt(debtLeft)+'đ', 'success');
              rebuild();
            }
          }, '✓ Thu nợ: '+s.customer.slice(0,12)+(s.customer.length>12?'…':''));
          quickPayRow.appendChild(btn);
        });
        if (quickPayRow.children.length > 0) card.appendChild(quickPayRow);

        wrap.appendChild(card);
      });
    }
  }

  buildContent();
  return wrap;
}

// ── VAT REPORT ────────────────────────────────────────────────
function pgVatReport() {
  const wrap = h('div', {});
  if (!pgVatReport._period) pgVatReport._period = 'month';
  if (!pgVatReport._selDate) pgVatReport._selDate = today();
  let period = pgVatReport._period;
  let selDate = pgVatReport._selDate;

  function rebuild() {
    period = pgVatReport._period;
    selDate = pgVatReport._selDate;
    wrap.innerHTML = '';
    const { sales, imports } = S;
    const d = new Date(selDate);

    function matchPeriod(dateStr) {
      if (!dateStr) return false;
      const dd = new Date(dateStr);
      if (period === 'month') return dd.getFullYear() === d.getFullYear() && dd.getMonth() === d.getMonth();
      if (period === 'year')  return dd.getFullYear() === d.getFullYear();
      if (period === 'quarter') {
        const q = Math.floor(d.getMonth() / 3);
        const dq = Math.floor(dd.getMonth() / 3);
        return dd.getFullYear() === d.getFullYear() && dq === q;
      }
      return true;
    }

    function navPeriod(dir) {
      const dd = new Date(pgVatReport._selDate);
      if (period === 'month') dd.setMonth(dd.getMonth() + dir);
      if (period === 'year')  dd.setFullYear(dd.getFullYear() + dir);
      if (period === 'quarter') dd.setMonth(dd.getMonth() + dir * 3);
      pgVatReport._selDate = localDateStr(dd);
      rebuild();
    }

    function periodLabel() {
      if (period === 'month')   return 'Tháng ' + (d.getMonth()+1) + '/' + d.getFullYear();
      if (period === 'year')    return 'Năm ' + d.getFullYear();
      if (period === 'quarter') return 'Q' + (Math.floor(d.getMonth()/3)+1) + '/' + d.getFullYear();
      return '';
    }

    const moSales   = sales.filter(s => matchPeriod(s.date));
    const moImports = imports.filter(i => matchPeriod(i.date));

    // VAT đầu ra
    const vatOut = moSales.reduce((a, s) => a + (s.vatAmt || 0), 0);
    const vatOutBase = moSales.reduce((a, s) => a + (s.subTotal || s.total || 0), 0);

    // VAT đầu vào hàng hoá
    let vatInGoods = 0;
    moImports.forEach(i => {
      const net = (i.unitPrice || 0) * (parseFloat(i.qty) || 0);
      const vat = (i.vatRate || 0) > 0 ? Math.round(net * (i.vatRate / 100)) : 0;
      vatInGoods += vat;
    });

    // VAT đầu vào vận chuyển nhập
    let vatInShip = 0;
    moImports.forEach(i => {
      const fee = i.shipFee || 0;
      const vr  = i.shipVatRate || 0;
      if (vr > 0 && fee > 0) vatInShip += fee - fee / (1 + vr / 100);
    });

    // VAT VC bán hàng (cửa hàng tự chịu)
    let vatOutShip = 0;
    moSales.forEach(s => {
      if (s.shipForCustomer) return;
      const fee = s.shipFee || 0;
      const vr  = s.shipVatRate || 0;
      if (vr > 0 && fee > 0) vatOutShip += fee - fee / (1 + vr / 100);
    });

    const vatInTotal  = vatInGoods + vatInShip + vatOutShip;
    const vatPayable  = vatOut - vatInTotal;

    // Header
    wrap.appendChild(h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '🏛️ Báo Cáo VAT Tổng Hợp'),
        h('div', { className: 'page-sub' }, 'Kê khai VAT đầu ra & đầu vào ' + periodLabel())
      )
    ));

    // Period selector
    const pb = h('div', { style: { display:'flex', alignItems:'center', gap:8, marginBottom:16, flexWrap:'wrap' } },
      h('div', { style:{display:'flex',gap:4} },
        ...['month','quarter','year'].map(p => h('button', {
          className: 'btn btn-sm' + (period===p?' btn-primary':''),
          onClick: () => { pgVatReport._period = p; rebuild(); }
        }, p==='month'?'📆 Tháng':p==='quarter'?'📅 Quý':'🗓️ Năm'))
      ),
      h('div', { style:{display:'flex',alignItems:'center',gap:6,background:'var(--bg3)',borderRadius:'var(--r2)',padding:'4px 10px',border:'1px solid var(--border2)'} },
        h('button',{className:'btn btn-ghost btn-sm',style:{padding:'2px 8px'},onClick:()=>navPeriod(-1)},'◀'),
        h('span',{style:{fontWeight:700,fontSize:13,color:'var(--accent)',minWidth:120,textAlign:'center'}},periodLabel()),
        h('button',{className:'btn btn-ghost btn-sm',style:{padding:'2px 8px'},onClick:()=>navPeriod(1)},'▶')
      )
    );
    wrap.appendChild(pb);

    // Summary cards
    const vatPayColor = vatPayable > 0 ? 'var(--red)' : vatPayable < 0 ? 'var(--green)' : 'var(--text2)';
    const vatPayLabel = vatPayable > 0 ? '⚠️ Phải nộp' : vatPayable < 0 ? '✅ Được hoàn' : '✅ Cân bằng';
    wrap.appendChild(h('div', { className: 'stats-grid' },
      h('div', { className: 'stat' }, h('div',{className:'stat-label'},'💰 VAT đầu ra (bán hàng)'), h('div',{className:'stat-val',style:{color:'var(--amber)'}},fmt(vatOut)+'đ'), h('div',{className:'stat-change'},moSales.filter(s=>s.vatAmt>0).length+' đơn có VAT')),
      h('div', { className: 'stat' }, h('div',{className:'stat-label'},'📥 VAT đầu vào hàng hoá'), h('div',{className:'stat-val',style:{color:'var(--blue)'}},fmt(vatInGoods)+'đ'), h('div',{className:'stat-change'},moImports.filter(i=>i.vatRate>0).length+' phiếu nhập VAT')),
      h('div', { className: 'stat' }, h('div',{className:'stat-label'},'🚚 VAT VC đầu vào'), h('div',{className:'stat-val',style:{color:'var(--blue)'}},fmt(vatInShip+vatOutShip)+'đ'), h('div',{className:'stat-change'},'Nhập: '+fmt(vatInShip)+'đ · Giao: '+fmt(vatOutShip)+'đ')),
      h('div', { className: 'stat' }, h('div',{className:'stat-label'},'🏛️ VAT phải nộp/hoàn'), h('div',{className:'stat-val',style:{color:vatPayColor}},fmt(Math.abs(vatPayable))+'đ'), h('div',{className:'stat-change'},vatPayLabel))
    ));

    // Detail table — VAT đầu ra
    if (moSales.length > 0) {
      const s1 = moSales.filter(s => s.vatAmt > 0);
      wrap.appendChild(h('div', { className: 'card' },
        h('div', { className: 'card-title' }, '💰 Chi Tiết VAT Đầu Ra ('+s1.length+' đơn có VAT)'),
        s1.length === 0
          ? h('div',{style:{color:'var(--text3)',fontSize:13,padding:'8px 0'}},'Không có đơn hàng có VAT trong kỳ này')
          : h('div', { className: 'table-wrap' }, h('table',{},
            h('thead',{},h('tr',{},th('Ngày'),th('Khách hàng'),th('Sản phẩm'),th('DT chưa VAT',true),th('VAT%'),th('Tiền VAT',true))),
            h('tbody',{},...s1.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(s=>
              h('tr',{},
                h('td',{style:{fontSize:12,color:'var(--text2)',whiteSpace:'nowrap'}},fmtD(s.date)),
                h('td',{},s.customer||'—'),
                h('td',{style:{maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},s.productName||'—'),
                h('td',{style:{textAlign:'right'}},fmt(s.subTotal||s.total)+'đ'),
                h('td',{style:{textAlign:'center',color:'var(--amber)'}},( s.vatRate||0)+'%'),
                h('td',{style:{textAlign:'right',fontWeight:700,color:'var(--amber)'}},fmt(s.vatAmt||0)+'đ')
              )
            )),
            h('tfoot',{},h('tr',{},
              h('td',{colspan:3,style:{fontWeight:700,color:'var(--text2)',fontSize:12}},'TỔNG'),
              h('td',{style:{textAlign:'right',fontWeight:700}},fmt(vatOutBase)+'đ'),
              h('td',{}),
              h('td',{style:{textAlign:'right',fontWeight:700,color:'var(--amber)'}},fmt(vatOut)+'đ')
            ))
          ))
      ));
    }

    // Detail table — VAT đầu vào
    const i1 = moImports.filter(i => i.vatRate > 0);
    if (i1.length > 0) {
      wrap.appendChild(h('div', { className: 'card' },
        h('div', { className: 'card-title' }, '📥 Chi Tiết VAT Đầu Vào ('+i1.length+' phiếu nhập VAT)'),
        h('div', { className: 'table-wrap' }, h('table',{},
          h('thead',{},h('tr',{},th('Ngày'),th('Sản phẩm'),th('SL'),th('Giá thuần',true),th('VAT%'),th('Tiền VAT',true))),
          h('tbody',{},...i1.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(i=>{
            const net = (i.unitPrice||0)*(parseFloat(i.qty)||0);
            const vat = Math.round(net*(i.vatRate/100));
            return h('tr',{},
              h('td',{style:{fontSize:12,color:'var(--text2)',whiteSpace:'nowrap'}},fmtD(i.date)),
              h('td',{},i.productName||'—'),
              h('td',{},fmtQty(i.qty)+' '+(i.unit||'')),
              h('td',{style:{textAlign:'right'}},fmt(net)+'đ'),
              h('td',{style:{textAlign:'center',color:'var(--blue)'}},i.vatRate+'%'),
              h('td',{style:{textAlign:'right',fontWeight:700,color:'var(--blue)'}},fmt(vat)+'đ')
            );
          })),
          h('tfoot',{},h('tr',{},
            h('td',{colspan:5,style:{fontWeight:700,color:'var(--text2)',fontSize:12}},'TỔNG VAT ĐẦU VÀO'),
            h('td',{style:{textAlign:'right',fontWeight:700,color:'var(--blue)'}},fmt(vatInGoods)+'đ')
          ))
        ))
      ));
    }

    // Tổng kết
    wrap.appendChild(h('div', { className: 'card', style: { background: vatPayable > 0 ? 'rgba(224,92,92,.06)' : 'rgba(76,175,125,.06)', borderColor: vatPayable > 0 ? 'rgba(224,92,92,.3)' : 'rgba(76,175,125,.3)' } },
      h('div', { className: 'card-title' }, '📋 Tổng Kết Kê Khai VAT — ' + periodLabel()),
      h('div', { style:{background:'var(--bg3)',borderRadius:'var(--r2)',padding:'14px 16px',fontSize:13} },
        h('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)'}},'VAT đầu ra (bán hàng):',h('span',{style:{fontWeight:700,color:'var(--amber)'}},fmt(vatOut)+'đ')),
        h('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)'}},'− VAT đầu vào hàng hoá:',h('span',{style:{fontWeight:700,color:'var(--blue)'}},fmt(vatInGoods)+'đ')),
        h('div',{style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border)'}},'− VAT đầu vào vận chuyển:',h('span',{style:{fontWeight:700,color:'var(--blue)'}},fmt(vatInShip+vatOutShip)+'đ')),
        h('div',{style:{display:'flex',justifyContent:'space-between',padding:'10px 0',marginTop:4,fontSize:16,fontWeight:700,color:vatPayColor}},
          vatPayable > 0 ? '⚠️ VAT phải nộp nhà nước:' : vatPayable < 0 ? '✅ VAT được hoàn:' : '✅ Cân bằng VAT:',
          h('span',{},fmt(Math.abs(vatPayable))+'đ')
        )
      )
    ));
  }
  rebuild();
  return wrap;
}

// ── GLOBAL SEARCH ─────────────────────────────────────────────
function pgSearch() {
  const wrap = h('div', {});
  if (!pgSearch._q) pgSearch._q = '';
  let q = pgSearch._q;

  // Header + ô tìm kiếm tạo 1 lần — không tạo lại khi gõ để không mất focus
  wrap.appendChild(h('div', { className: 'page-header' },
    h('div', {},
      h('div', { className: 'page-title' }, '🔍 Tìm Kiếm Toàn Cục'),
      h('div', { className: 'page-sub' }, 'Tìm theo tên khách hàng, sản phẩm, SĐT, ghi chú')
    )
  ));

  // Search box
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'form-input';
  inp.placeholder = 'Nhập từ khoá tìm kiếm... (tên khách, SĐT, tên sản phẩm)';
  inp.value = q;
  inp.style.cssText = 'font-size:16px;margin-bottom:16px;width:100%';
  inp.setAttribute('autofocus', '');
  inp.addEventListener('input', e => {
    pgSearch._q = e.target.value;
    rebuild();
  });
  wrap.appendChild(inp);
  setTimeout(() => inp.focus(), 50);

  // Chỉ phần kết quả được rebuild khi gõ
  const resWrap = h('div', {});
  wrap.appendChild(resWrap);

  function rebuild() {
    q = pgSearch._q;
    resWrap.innerHTML = '';

    if (!q || q.trim().length < 2) {
      resWrap.appendChild(h('div', { style:{textAlign:'center',padding:'40px 20px',color:'var(--text3)'} },
        h('div',{style:{fontSize:36,marginBottom:12}},'🔍'),
        h('div',{},'Nhập ít nhất 2 ký tự để tìm kiếm')
      ));
      return;
    }

    const keyword = q.trim().toLowerCase();
    const { sales, products, imports } = S;

    // Search sales
    const salRes = sales.filter(s =>
      (s.customer||'').toLowerCase().includes(keyword) ||
      (s.phone||'').includes(keyword) ||
      (s.productName||'').toLowerCase().includes(keyword) ||
      (s.note||'').toLowerCase().includes(keyword) ||
      (s.address||'').toLowerCase().includes(keyword)
    );

    // Search products
    const prodRes = products.filter(p =>
      (p.name||'').toLowerCase().includes(keyword) ||
      (p.sku||'').toLowerCase().includes(keyword) ||
      (p.origin||'').toLowerCase().includes(keyword) ||
      (p.note||'').toLowerCase().includes(keyword)
    );

    // Search imports
    const impRes = imports.filter(i =>
      (i.productName||'').toLowerCase().includes(keyword) ||
      (i.supplier||'').toLowerCase().includes(keyword) ||
      (i.note||'').toLowerCase().includes(keyword)
    );

    const total = salRes.length + prodRes.length + impRes.length;
    resWrap.appendChild(h('div', { style:{fontSize:13,color:'var(--text2)',marginBottom:16,padding:'8px 14px',background:'var(--bg2)',borderRadius:'var(--r2)',border:'1px solid var(--border)'} },
      `🔍 Tìm được ${total} kết quả cho "${q}"`
    ));

    // Sales results
    if (salRes.length > 0) {
      const card = h('div', { className: 'card' });
      card.appendChild(h('div', { className: 'card-title' }, `🧾 Đơn hàng (${salRes.length} kết quả)`));
      const sorted = [...salRes].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,50);
      card.appendChild(h('div', { className: 'table-wrap' }, h('table',{},
        h('thead',{},h('tr',{},th('Ngày'),th('Khách hàng'),th('SĐT'),th('Sản phẩm'),th('Tổng tiền',true),th('TT'))),
        h('tbody',{},...sorted.map(s=>h('tr',{ style:{cursor:'pointer'}, onClick:()=>{S.page='sales';render();}},
          h('td',{style:{fontSize:12,color:'var(--text2)',whiteSpace:'nowrap'}},fmtD(s.date)),
          h('td',{},h('div',{style:{fontWeight:600}},highlight(s.customer||'—',keyword)), s.phone?h('div',{style:{fontSize:11,color:'var(--text3)'}},s.phone):null),
          h('td',{style:{fontSize:12}},highlight(s.phone||'—',keyword)),
          h('td',{style:{maxWidth:150,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},highlight(s.productName||'—',keyword)),
          h('td',{style:{textAlign:'right',fontWeight:700}},fmt(s.total)+'đ'),
          h('td',{},h('span',{className:'badge badge-'+(s.status==='done'?'green':'red')},s.status==='done'?'Xong':'Nợ'))
        )))
      )));
      if (salRes.length > 50) card.appendChild(h('div',{style:{fontSize:12,color:'var(--text3)',marginTop:8,textAlign:'center'}},'Hiển thị 50/'+salRes.length+' kết quả đầu tiên'));
      resWrap.appendChild(card);
    }

    // Product results
    if (prodRes.length > 0) {
      const card = h('div', { className: 'card' });
      card.appendChild(h('div', { className: 'card-title' }, `💎 Sản phẩm (${prodRes.length} kết quả)`));
      card.appendChild(h('div', { className: 'table-wrap' }, h('table',{},
        h('thead',{},h('tr',{},th('Tên sản phẩm'),th('Mã SKU'),th('Xuất xứ'),th('Tồn kho'),th('Giá nhập',true),th('Giá bán',true))),
        h('tbody',{},...prodRes.map(p=>h('tr',{},
          h('td',{},h('div',{style:{fontWeight:600}},highlight(p.name,keyword))),
          h('td',{},p.sku ? h('span',{className:'badge badge-gold',style:{fontFamily:'monospace',fontSize:11}},p.sku) : h('span',{style:{color:'var(--text3)'}}, '—')),
          h('td',{style:{fontSize:12,color:'var(--text2)'}},p.origin||'—'),
          h('td',{},fmtQty(p.stock)+' '+(p.unit||'')),
          h('td',{style:{textAlign:'right'}},fmt(p.buyPrice)+'đ'),
          h('td',{style:{textAlign:'right',fontWeight:700,color:'var(--accent)'}},fmt(p.sellPrice)+'đ')
        )))
      )));
      resWrap.appendChild(card);
    }

    // Import results
    if (impRes.length > 0) {
      const card = h('div', { className: 'card' });
      card.appendChild(h('div', { className: 'card-title' }, `📥 Phiếu nhập (${impRes.length} kết quả)`));
      card.appendChild(h('div', { className: 'table-wrap' }, h('table',{},
        h('thead',{},h('tr',{},th('Ngày'),th('Sản phẩm'),th('NCC'),th('SL'),th('Tổng tiền',true))),
        h('tbody',{},...impRes.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,30).map(i=>h('tr',{},
          h('td',{style:{fontSize:12,color:'var(--text2)',whiteSpace:'nowrap'}},fmtD(i.date)),
          h('td',{},highlight(i.productName||'—',keyword)),
          h('td',{style:{fontSize:12}},highlight(i.supplier||'—',keyword)),
          h('td',{},fmtQty(i.qty)+' '+(i.unit||'')),
          h('td',{style:{textAlign:'right',fontWeight:700}},fmt(i.total)+'đ')
        )))
      )));
      resWrap.appendChild(card);
    }

    if (total === 0) {
      resWrap.appendChild(h('div', { style:{textAlign:'center',padding:'40px 20px',color:'var(--text3)'} },
        h('div',{style:{fontSize:36,marginBottom:12}},'😔'),
        h('div',{},'Không tìm thấy kết quả nào cho "'+q+'"')
      ));
    }
  }

  function highlight(text, kw) {
    if (!kw || !text) return text || '';
    const idx = text.toLowerCase().indexOf(kw.toLowerCase());
    if (idx < 0) return text;
    const span = document.createElement('span');
    span.innerHTML = escHtml(text.slice(0,idx)) +
      '<mark style="background:rgba(201,168,76,.4);color:var(--text);border-radius:2px;padding:0 2px">' +
      escHtml(text.slice(idx, idx+kw.length)) + '</mark>' +
      escHtml(text.slice(idx+kw.length));
    return span;
  }

  rebuild();
  return wrap;
}




// ═══════════════════════════════════════════════════════════════
//  TRANG LỢI NHUẬN — Chỉ xem, không chỉnh sửa
//  Lợi nhuận thực = DT thuần − COGS − VC tự chịu (mỗi đơn)
// ═══════════════════════════════════════════════════════════════
function pgProfit() {
  const wrap = h('div', {});
  if (!pgProfit._period) pgProfit._period = 'month';
  if (!pgProfit._selDate) pgProfit._selDate = localDateStr(new Date());
  if (!pgProfit._group)  pgProfit._group  = 'day';   // 'order'|'day'|'month'|'year'
  if (!pgProfit._expand) pgProfit._expand = new Set();

  const period  = pgProfit._period;
  const selDate = new Date(pgProfit._selDate);

  const { sales, imports, products, cashflows, returns: rets } = S;

  // ── Lọc theo kỳ ──────────────────────────────────────────────
  function matchPeriod(dateStr) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    if (period === 'day')   return dateStr.slice(0,10) === pgProfit._selDate.slice(0,10);
    if (period === 'month') return d.getFullYear() === selDate.getFullYear() && d.getMonth() === selDate.getMonth();
    if (period === 'year')  return d.getFullYear() === selDate.getFullYear();
    return true;
  }

  const filteredSales = (sales || []).filter(s => matchPeriod(s.date));

  // ── Tính lợi nhuận chi tiết cho từng đơn bán (tách rõ VAT đầu ra / đầu vào) ─
  function cogsDetailForSale(s) {
    const sQty = parseFloat(s.qty) || 0;
    const saleVatRate = s.vatRate || 0;
    const candidates = [...(imports || [])].filter(i => i.productId === s.productId && i.date <= s.date).sort((a,b)=>b.date.localeCompare(a.date));
    const imp = s.variantId ? (candidates.find(i=>i.variantId===s.variantId)||candidates[0]) : candidates[0];
    if (!imp) {
      const buyPrice = (products||[]).find(p=>p.id===s.productId)?.buyPrice || 0;
      return {
        hasImport: false, importDate: null,
        unitPriceNet: buyPrice, impVatRate: 0, impVatAmt: 0, grossUpApplied: false,
        goodsCostNet: buyPrice * sQty, goodsCostCharged: buyPrice * sQty,
        shipCostNet: 0, shipVatAmt: 0,
        totalCost: buyPrice * sQty,
      };
    }
    const unitPriceNet = imp.unitPrice || 0;
    const impVatRate   = imp.vatRate   || 0;
    // Bán VAT=0% nhưng nhập có VAT → VAT đầu vào KHÔNG được khấu trừ, phải gộp vào giá vốn
    const grossUpApplied  = (saleVatRate === 0 && impVatRate > 0);
    const costPerUnit      = grossUpApplied ? unitPriceNet*(1+impVatRate/100) : unitPriceNet;
    const goodsCostNet     = unitPriceNet * sQty;                    // giá vốn THUẦN (chưa VAT đầu vào)
    const impVatAmt        = unitPriceNet * (impVatRate/100) * sQty; // VAT đầu vào của hàng, phân bổ theo SL đơn này
    const goodsCostCharged = costPerUnit * sQty;                     // phần thực tính vào giá vốn (gộp VAT nếu bán 0%)
    const impShipFee    = imp.shipFee    || 0;
    const impShipVatR   = imp.shipVatRate || 0;
    const impShipFeeNet = impShipVatR > 0 ? impShipFee/(1+impShipVatR/100) : impShipFee;
    const impShipVatAmt = impShipFee - impShipFeeNet;
    const impQty = parseFloat(imp.qty) || 1;
    const shipCostNet = impQty > 0 ? (impShipFeeNet/impQty) * sQty : 0;
    const shipVatAmt  = impQty > 0 ? (impShipVatAmt/impQty) * sQty : 0;
    return {
      hasImport: true, importDate: imp.date,
      unitPriceNet, impVatRate, impVatAmt, grossUpApplied,
      goodsCostNet, goodsCostCharged,
      shipCostNet, shipVatAmt,
      totalCost: goodsCostCharged + shipCostNet,
    };
  }
  function cogsForSale(s) { return cogsDetailForSale(s).totalCost; }

  const profitData = filteredSales.map(s => {
    const cd       = cogsDetailForSale(s);
    const revenue  = s.subTotal != null ? s.subTotal : Math.max(0,(s.total||0)-(s.shipFee||0)-(s.vatAmt||0));
    const vatOut   = s.vatAmt || 0;
    const total    = s.total != null ? s.total : (revenue + vatOut);
    const shipVatR = s.shipVatRate || 0;
    const vcStore    = (!s.shipForCustomer && s.shipFee) ? (shipVatR>0 ? s.shipFee/(1+shipVatR/100) : s.shipFee) : 0;
    const vcStoreVat = (!s.shipForCustomer && s.shipFee && shipVatR>0) ? (s.shipFee - vcStore) : 0;
    const profit   = revenue - cd.totalCost - vcStore;
    // VAT đầu vào liên quan đơn này (hàng + VC nhập phân bổ + VC giao cửa hàng tự chịu)
    // — CHỈ MANG TÍNH THAM KHẢO cho riêng đơn này, không phải số liệu kê khai chính thức
    //   (thuế khấu trừ theo KỲ kê khai, không tính riêng theo từng đơn lẻ)
    const vatInTotal = cd.impVatAmt + cd.shipVatAmt + vcStoreVat;
    const vatNetEst  = vatOut - vatInTotal;
    return {
      ...s,
      _revenue: revenue, _cogs: cd.totalCost, _vcStore: vcStore, _profit: profit,
      _vatOut: vatOut, _vatRate: s.vatRate || 0, _total: total,
      _vcStoreVat: vcStoreVat, _vatInTotal: vatInTotal, _vatNetEst: vatNetEst,
      _cd: cd,
    };
  });

  const totalRevenue = profitData.reduce((a,s)=>a+s._revenue,0);
  const totalCogs    = profitData.reduce((a,s)=>a+s._cogs,0);
  const totalVc      = profitData.reduce((a,s)=>a+s._vcStore,0);
  const totalProfit  = profitData.reduce((a,s)=>a+s._profit,0);
  const margin       = totalRevenue>0 ? (totalProfit/totalRevenue*100).toFixed(1) : '0.0';

  // ── Period navigation ─────────────────────────────────────────
  function navPeriod(dir) {
    const d = new Date(pgProfit._selDate);
    if (period==='day')   d.setDate(d.getDate()+dir);
    if (period==='month') d.setMonth(d.getMonth()+dir);
    if (period==='year')  d.setFullYear(d.getFullYear()+dir);
    pgProfit._selDate = localDateStr(d);
    render();
  }
  function periodLabel() {
    if (period==='day')   return 'Ngày ' + selDate.toLocaleDateString('vi-VN');
    if (period==='month') return 'Tháng ' + (selDate.getMonth()+1) + '/' + selDate.getFullYear();
    if (period==='year')  return 'Năm ' + selDate.getFullYear();
    return '';
  }

  // ── Header ────────────────────────────────────────────────────
  wrap.appendChild(h('div', {className:'page-header'},
    h('div', {},
      h('div', {className:'page-title'}, '📈 Lợi Nhuận'),
      h('div', {className:'page-sub'}, 'Lợi nhuận thực sau khi trừ hết chi phí · Chỉ xem')
    ),
    h('div', {style:{display:'flex',alignItems:'center',gap:6,background:'rgba(76,175,125,.1)',border:'1px solid rgba(76,175,125,.25)',borderRadius:'var(--r2)',padding:'6px 14px',fontSize:12,color:'var(--green)',fontWeight:700}}, '🔒 Chỉ xem — không chỉnh sửa')
  ));

  // ── Period bar ────────────────────────────────────────────────
  wrap.appendChild(h('div', {style:{display:'flex',alignItems:'center',gap:8,marginBottom:18,flexWrap:'wrap'}},
    h('div', {style:{display:'flex',gap:4}},
      ...['day','month','year'].map(p=>h('button',{
        className:'btn btn-sm'+(period===p?' btn-primary':''),
        onClick:()=>{pgProfit._period=p;render();}
      }, p==='day'?'📅 Ngày':p==='month'?'📆 Tháng':'🗓️ Năm'))
    ),
    h('div', {style:{display:'flex',alignItems:'center',gap:6,background:'var(--bg3)',borderRadius:'var(--r2)',padding:'4px 10px',border:'1px solid var(--border2)'}},
      h('button',{className:'btn btn-ghost btn-sm',style:{padding:'2px 8px'},onClick:()=>navPeriod(-1)},'◀'),
      h('span',{style:{fontWeight:700,fontSize:13,color:'var(--accent)',minWidth:140,textAlign:'center'}},periodLabel()),
      h('button',{className:'btn btn-ghost btn-sm',style:{padding:'2px 8px'},onClick:()=>navPeriod(1)},'▶'),
      h('button',{className:'btn btn-ghost btn-sm',style:{fontSize:11,color:'var(--text3)'},onClick:()=>{pgProfit._selDate=localDateStr(new Date());render();}},'Hôm nay')
    )
  ));

  // ── KPI cards ─────────────────────────────────────────────────
  const kpiDiv = document.createElement('div');
  kpiDiv.className='profit-kpi';
  [
    {label:'Doanh Thu Thuần',val:fmt(totalRevenue)+'đ',sub:filteredSales.length+' đơn hàng',color:'var(--blue)'},
    {label:'Giá Vốn (COGS)',val:fmt(totalCogs)+'đ',sub:'Chi phí hàng bán',color:'var(--amber)'},
    {label:'VC Tự Chịu',val:fmt(totalVc)+'đ',sub:'Phí VC cửa hàng',color:'var(--text2)'},
    {label:'Lợi Nhuận Thực',val:fmt(Math.round(totalProfit))+'đ',sub:'Biên LN: '+margin+'%',color:totalProfit>=0?'var(--green)':'var(--red)'},
  ].forEach(k=>{
    const c=document.createElement('div'); c.className='profit-kpi-card';
    c.innerHTML=`<div class="profit-kpi-label">${k.label}</div><div class="profit-kpi-val" style="color:${k.color}">${k.val}</div><div class="profit-kpi-sub">${k.sub}</div>`;
    kpiDiv.appendChild(c);
  });
  wrap.appendChild(kpiDiv);

  // ── Group selector ────────────────────────────────────────────
  const grp = pgProfit._group;
  wrap.appendChild(h('div', {style:{display:'flex',alignItems:'center',gap:8,marginBottom:14,flexWrap:'wrap'}},
    h('span', {style:{fontSize:12,color:'var(--text2)',fontWeight:600}},'Xem theo:'),
    ...['order','day','month','year'].map(g=>h('button',{
      className:'btn btn-sm'+(grp===g?' btn-primary':''),
      onClick:()=>{pgProfit._group=g;pgProfit._expand=new Set();render();}
    }, g==='order'?'🧾 Từng đơn':g==='day'?'📅 Ngày':g==='month'?'📆 Tháng':'🗓️ Năm'))
  ));

  // ── Table ─────────────────────────────────────────────────────
  const tblWrap = document.createElement('div');
  tblWrap.className='profit-tbl-wrap';
  tblWrap.style.overflowX='auto';
  const tbl = document.createElement('table');
  tbl.className='profit-tbl';

  // Header
  tbl.innerHTML=`<thead><tr>
    <th style="text-align:left">${grp==='order'?'Đơn hàng':'Kỳ'}</th>
    <th>${grp==='order'?'Ngày':''}</th>
    <th>Doanh Thu</th>
    <th>Giá Vốn</th>
    <th>VC Tự Chịu</th>
    <th>Lợi Nhuận</th>
    <th>Biên LN</th>
  </tr></thead>`;
  const tbody=document.createElement('tbody');

  function profitClass(v){return v>0?'profit-pos':v<0?'profit-neg':'profit-zero';}

  // ── Panel chi tiết 1 đơn: tách rõ VAT đầu ra / đầu vào để đối chiếu giấy tờ ──
  function orderDetailHTML(s) {
    const vat = s._vatRate > 0;
    const cd  = s._cd;
    const row = (lbl, val, o={}) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;${o.bold?'font-weight:700;':''}${o.border?'border-top:1px solid var(--border2);margin-top:4px;padding-top:6px;':''}">
        <span style="color:${o.muted?'var(--text3)':'var(--text2)'};font-size:11.5px">${lbl}</span>
        <span style="font-size:11.5px;white-space:nowrap;${o.color?'color:'+o.color+';':''}">${val}</span>
      </div>`;

    let out = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;padding:12px 10px 4px">';

    // Cột Đầu ra (bán hàng)
    out += '<div>';
    out += `<div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px">🧾 ĐẦU RA — BÁN HÀNG ${vat?'(VAT '+s._vatRate+'%)':'(Không VAT)'}</div>`;
    out += row(vat?'Tạm tính (DT thuần)':'Doanh thu bán', fmt(Math.round(s._revenue))+'đ');
    if (vat) {
      out += row('VAT đầu ra ('+s._vatRate+'%)', '+ '+fmt(Math.round(s._vatOut))+'đ', {color:'var(--blue)'});
      out += row('Tổng cộng (khách trả)', fmt(Math.round(s._total))+'đ', {bold:true, border:true});
    }
    out += '</div>';

    // Cột Đầu vào (giá vốn)
    out += '<div>';
    out += '<div style="font-size:11px;font-weight:700;color:var(--amber);margin-bottom:4px">📦 ĐẦU VÀO — GIÁ VỐN</div>';
    if (cd.hasImport) {
      out += row('Đơn giá nhập thuần', fmt(Math.round(cd.unitPriceNet))+'đ'+(cd.importDate?' <span style="color:var(--text3);font-size:10px">(NK '+fmtD(cd.importDate)+')</span>':''));
      out += row('Giá vốn thuần (SL × giá nhập)', fmt(Math.round(cd.goodsCostNet))+'đ');
      if (cd.impVatRate > 0) {
        out += row('VAT đầu vào hàng ('+cd.impVatRate+'%)',
          (cd.grossUpApplied?'+ ':'')+fmt(Math.round(cd.impVatAmt))+'đ '+
          (cd.grossUpApplied
            ? '<span style="color:var(--red);font-size:10px">(gộp vào giá vốn vì bán 0%)</span>'
            : '<span style="color:var(--text3);font-size:10px">(khấu trừ riêng, không vào giá vốn)</span>'),
          {color:'var(--blue)'});
      }
    } else {
      out += row('Giá vốn (mặc định sản phẩm)', fmt(Math.round(cd.unitPriceNet))+'đ <span style="color:var(--text3);font-size:10px">(chưa có phiếu nhập)</span>');
    }
    if (s._vcStore > 0) {
      out += row('VC tự chịu (thuần)', fmt(Math.round(s._vcStore))+'đ');
      if (s._vcStoreVat > 0) out += row('VAT VC tự chịu', '+ '+fmt(Math.round(s._vcStoreVat))+'đ', {color:'var(--blue)'});
    }
    out += row('→ Giá vốn tính vào LN', fmt(Math.round(s._cogs))+'đ', {bold:true, border:true, color:'var(--amber)'});
    out += '</div>';
    out += '</div>'; // end grid

    // Đối chiếu VAT — chỉ hiện khi đơn có VAT
    if (vat) {
      out += `<div style="margin:6px 10px 4px;padding:10px 12px;background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border2)">
        <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px">⚖️ ĐỐI CHIẾU VAT (tham khảo riêng đơn này)</div>
        ${row('VAT đầu ra', '+ '+fmt(Math.round(s._vatOut))+'đ')}
        ${row('VAT đầu vào (hàng + VC)', '− '+fmt(Math.round(s._vatInTotal))+'đ')}
        ${row(s._vatNetEst>=0?'= Phải nộp thêm (ước tính)':'= Được khấu trừ (ước tính)', fmt(Math.round(Math.abs(s._vatNetEst)))+'đ', {bold:true, border:true, color: s._vatNetEst>=0?'var(--red)':'var(--green)'})}
        <div style="font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5">* Số tham khảo riêng đơn này. VAT phải nộp thực tế tính theo KỲ KÊ KHAI (gộp toàn bộ đơn bán + phiếu nhập trong kỳ) — xem số chính xác tại trang Tổng Quan.</div>
      </div>`;
    }

    // Lợi nhuận thuần
    const marginTxt = s._revenue>0 ? (s._profit/s._revenue*100).toFixed(1)+'%' : '—';
    out += `<div style="margin:4px 10px 12px;padding:10px 12px;background:rgba(76,175,125,.08);border-radius:var(--r2);border:1px solid rgba(76,175,125,.25)">
      <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700">
        <span style="color:var(--text2);font-size:12px">💰 Lợi nhuận thuần đơn này</span>
        <span class="${profitClass(s._profit)}" style="font-size:13px">${fmt(Math.round(s._profit))}đ &nbsp;(${marginTxt})</span>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:4px">= DT thuần − Giá vốn${s._vcStore>0?' − VC tự chịu':''} = ${fmt(Math.round(s._revenue))} − ${fmt(Math.round(s._cogs))}${s._vcStore>0?' − '+fmt(Math.round(s._vcStore)):''} = ${fmt(Math.round(s._profit))}đ</div>
    </div>`;

    return out;
  }

  if (grp==='order') {
    const sorted=[...profitData].sort((a,b)=>b.date.localeCompare(a.date));
    if (!sorted.length) {
      const tr=document.createElement('tr');
      tr.innerHTML=`<td colspan="7" style="text-align:center;padding:40px;color:var(--text3)">Không có đơn hàng trong kỳ này</td>`;
      tbody.appendChild(tr);
    }
    sorted.forEach(s=>{
      const margin=s._revenue>0?(s._profit/s._revenue*100).toFixed(1):'—';
      const okey = 'o:' + (s.id || (s.date+'|'+s.customer+'|'+s.productName));
      const expanded = pgProfit._expand.has(okey);
      const tr=document.createElement('tr');
      tr.style.cursor='pointer';
      tr.innerHTML=`
        <td><div style="font-weight:600;font-size:12px">${expanded?'▼':'▶'} ${escHtml(s.customer||'—')}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${escHtml(s.productName||'')} &nbsp;<span style="font-size:9px;padding:1px 6px;border-radius:99px;border:1px solid var(--border2);color:${s._vatRate>0?'var(--blue)':'var(--text3)'}">${s._vatRate>0?'VAT '+s._vatRate+'%':'Không VAT'}</span></div></td>
        <td style="white-space:nowrap;color:var(--text2)">${fmtD(s.date)}</td>
        <td>${fmt(Math.round(s._revenue))}đ</td>
        <td style="color:var(--amber)">${fmt(Math.round(s._cogs))}đ</td>
        <td style="color:var(--text2)">${s._vcStore>0?fmt(Math.round(s._vcStore))+'đ':'—'}</td>
        <td class="${profitClass(s._profit)}">${fmt(Math.round(s._profit))}đ</td>
        <td class="${profitClass(s._profit)}">${margin!=='—'?margin+'%':'—'}</td>`;
      tr.onclick=()=>{
        if (pgProfit._expand.has(okey)) pgProfit._expand.delete(okey); else pgProfit._expand.add(okey);
        render();
      };
      tbody.appendChild(tr);
      if (expanded) {
        const dtr=document.createElement('tr');
        dtr.style.background='rgba(255,255,255,.02)';
        const dtd=document.createElement('td');
        dtd.colSpan=7;
        dtd.innerHTML=orderDetailHTML(s);
        dtr.appendChild(dtd);
        tbody.appendChild(dtr);
      }
    });
  } else {
    // Group by day/month/year
    function groupKey(dateStr){
      if(!dateStr)return'';
      const d=new Date(dateStr);
      if(grp==='day')   return dateStr.slice(0,10);
      if(grp==='month') return dateStr.slice(0,7);
      if(grp==='year')  return String(d.getFullYear());
    }
    function groupLabel(k){
      if(grp==='day'){
        const d=new Date(k);
        return d.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
      }
      if(grp==='month'){const[y,m]=k.split('-');return'Tháng '+parseInt(m)+'/'+y;}
      return'Năm '+k;
    }
    // Build groups
    const groups={};
    profitData.forEach(s=>{
      const k=groupKey(s.date);
      if(!groups[k]) groups[k]={revenue:0,cogs:0,vc:0,profit:0,items:[]};
      groups[k].revenue+=s._revenue;
      groups[k].cogs+=s._cogs;
      groups[k].vc+=s._vcStore;
      groups[k].profit+=s._profit;
      groups[k].items.push(s);
    });
    const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
    if(!keys.length){
      const tr=document.createElement('tr');
      tr.innerHTML=`<td colspan="7" style="text-align:center;padding:40px;color:var(--text3)">Không có dữ liệu trong kỳ này</td>`;
      tbody.appendChild(tr);
    }
    keys.forEach(k=>{
      const g=groups[k];
      const mg=g.revenue>0?(g.profit/g.revenue*100).toFixed(1):'—';
      const expanded=pgProfit._expand.has(k);
      const hdrTr=document.createElement('tr');
      hdrTr.className='profit-group-hdr';
      hdrTr.innerHTML=`
        <td colspan="2" style="font-weight:700;font-size:12px">${expanded?'▼':'▶'} ${groupLabel(k)} <span style="font-size:10px;font-weight:400;color:var(--text3)">(${g.items.length} đơn)</span></td>
        <td>${fmt(Math.round(g.revenue))}đ</td>
        <td style="color:var(--amber)">${fmt(Math.round(g.cogs))}đ</td>
        <td style="color:var(--text2)">${g.vc>0?fmt(Math.round(g.vc))+'đ':'—'}</td>
        <td class="${profitClass(g.profit)}">${fmt(Math.round(g.profit))}đ</td>
        <td class="${profitClass(g.profit)}">${mg!=='—'?mg+'%':'—'}</td>`;
      hdrTr.onclick=()=>{
        if(pgProfit._expand.has(k)) pgProfit._expand.delete(k); else pgProfit._expand.add(k);
        render();
      };
      tbody.appendChild(hdrTr);
      if(expanded){
        [...g.items].sort((a,b)=>b.date.localeCompare(a.date)).forEach(s=>{
          const sm=s._revenue>0?(s._profit/s._revenue*100).toFixed(1):'—';
          const tr=document.createElement('tr');
          tr.style.background='rgba(255,255,255,.012)';
          tr.innerHTML=`
            <td style="padding-left:28px"><div style="font-size:12px;font-weight:600">${escHtml(s.customer||'—')}</div><div style="font-size:10px;color:var(--text3)">${escHtml(s.productName||'')}</div></td>
            <td style="color:var(--text2);font-size:11px;white-space:nowrap">${fmtD(s.date)}</td>
            <td style="font-size:11px">${fmt(Math.round(s._revenue))}đ</td>
            <td style="color:var(--amber);font-size:11px">${fmt(Math.round(s._cogs))}đ</td>
            <td style="color:var(--text2);font-size:11px">${s._vcStore>0?fmt(Math.round(s._vcStore))+'đ':'—'}</td>
            <td class="${profitClass(s._profit)}" style="font-size:11px">${fmt(Math.round(s._profit))}đ</td>
            <td class="${profitClass(s._profit)}" style="font-size:11px">${sm!=='—'?sm+'%':'—'}</td>`;
          tbody.appendChild(tr);
        });
      }
    });
  }

  // Tổng cộng
  if(profitData.length){
    const tftr=document.createElement('tr');
    tftr.style.cssText='background:var(--bg3);font-weight:700;border-top:2px solid var(--accent)';
    tftr.innerHTML=`
      <td colspan="2" style="font-size:12px;color:var(--accent)">📊 TỔNG KỲ</td>
      <td style="font-size:12px">${fmt(Math.round(totalRevenue))}đ</td>
      <td style="color:var(--amber);font-size:12px">${fmt(Math.round(totalCogs))}đ</td>
      <td style="color:var(--text2);font-size:12px">${totalVc>0?fmt(Math.round(totalVc))+'đ':'—'}</td>
      <td class="${totalProfit>=0?'profit-pos':'profit-neg'}" style="font-size:13px">${fmt(Math.round(totalProfit))}đ</td>
      <td class="${totalProfit>=0?'profit-pos':'profit-neg'}" style="font-size:12px">${margin}%</td>`;
    tbody.appendChild(tftr);
  }

  tbl.appendChild(tbody);
  tblWrap.appendChild(tbl);
  wrap.appendChild(tblWrap);

  // Chú thích
