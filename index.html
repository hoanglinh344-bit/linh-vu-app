// ── QUOTATION ─────────────────────────────────────────────────
function pgQuotation() {
  // ── State (closure) ──────────────────────────────────────────
  let items = [newItem()];
  let customerName = '';
  let customerPhone = '';
  let customerNote = '';
  let showResult = false;

  function newItem() {
    return {
      id: uid(),
      name: '',
      unit: 'm²',
      qty: 1,
      // Buy
      buyPrice: 0, buyVat: 0,
      // Sell
      sellPrice: 0, sellVat: 0,
      // Ship — tính theo trọng lượng
      shipWeight: 0,          // trọng lượng (kg hoặc tấn)
      shipWeightUnit: 'kg',   // 'kg' | 'tấn'
      shipRatePerUnit: 0,     // đơn giá vận chuyển / kg hoặc / tấn
      shipFeeExtra: 0,        // phí cố định thêm (nếu có)
      shipVat: 0,
      imageData: ''           // base64 ảnh sản phẩm cho báo giá
    };
  }

  // ── Số format: 1.200.000 ───────────────────────────────────
  function parseNum(str) {
    // Loại tất cả dấu chấm/phẩy phân cách ngàn, giữ lại dấu thập phân cuối
    if (!str && str !== 0) return 0;
    const s = String(str).replace(/\./g, '').replace(/,/g, '.');
    return parseFloat(s) || 0;
  }

  function fmtInput(n) {
    // Format số để hiển thị trong ô input dạng 1.200.000
    if (!n) return '';
    return new Intl.NumberFormat('vi-VN').format(Math.round(n));
  }

  // ── Input tiền tệ tự format ───────────────────────────────
  function moneyInput(rawVal, onChange, placeholder) {
    const el = document.createElement('input');
    el.type = 'text';
    el.inputMode = 'numeric';
    el.placeholder = placeholder || '0';
    el.className = 'form-input';
    el.style.textAlign = 'right';
    el.style.fontWeight = '600';
    el.style.letterSpacing = '.3px';
    el.value = rawVal > 0 ? fmtInput(rawVal) : '';

    el.addEventListener('focus', () => {
      // Khi focus: bỏ dấu chấm để dễ sửa
      if (el.value) el.value = el.value.replace(/\./g, '').replace(/,/g, '.');
    });
    el.addEventListener('input', () => {
      // Chỉ cho phép số
      el.value = el.value.replace(/[^0-9]/g, '');
      onChange(parseFloat(el.value) || 0);
    });
    el.addEventListener('blur', () => {
      const n = parseFloat(el.value) || 0;
      el.value = n > 0 ? fmtInput(n) : '';
      onChange(n);
      rebuild();
    });
    return el;
  }

  // ── Số lượng / trọng lượng input (cho phép thập phân) ────
  function numInput(rawVal, onChange, placeholder) {
    const el = document.createElement('input');
    el.type = 'text';
    el.inputMode = 'decimal';
    el.placeholder = placeholder || '0';
    el.className = 'form-input';
    el.style.textAlign = 'right';
    el.value = rawVal > 0 ? String(rawVal) : '';

    el.addEventListener('input', () => {
      el.value = el.value.replace(/[^0-9.,]/g, '').replace(',', '.');
      onChange(parseFloat(el.value) || 0);
    });
    el.addEventListener('blur', () => {
      const n = parseFloat(el.value) || 0;
      el.value = n > 0 ? String(n) : '';
      onChange(n);
      rebuild();
    });
    return el;
  }

  // ── Tính ship fee từ trọng lượng ─────────────────────────
  function calcShipFee(it) {
    const w = parseFloat(it.shipWeight) || 0;
    const r = parseFloat(it.shipRatePerUnit) || 0;
    const extra = parseFloat(it.shipFeeExtra) || 0;
    // Nếu đơn vị là tấn, chuyển sang kg trước khi tính nếu rate theo tấn
    return w * r + extra;
  }

  function calcItem(it) {
    const qty      = parseFloat(it.qty) || 0;
    const buyBase  = (parseFloat(it.buyPrice) || 0) * qty;
    const buyVatA  = Math.round(buyBase  * (parseFloat(it.buyVat)  || 0) / 100);
    const shipBase = calcShipFee(it);
    const shipVatA = Math.round(shipBase * (parseFloat(it.shipVat) || 0) / 100);
    const sellBase = (parseFloat(it.sellPrice) || 0) * qty;
    const sellVatA = Math.round(sellBase * (parseFloat(it.sellVat) || 0) / 100);
    const revenueTotal = sellBase + sellVatA;
    const costTotal    = buyBase + buyVatA + shipBase + shipVatA;
    // VAT phải nộp nhà nước = đầu ra − đầu vào (nhập + ship)
    const vatPayable   = sellVatA - buyVatA - shipVatA;
    // LN trước thuế: thuần (chưa VAT bên nào)
    const profitBefore = sellBase - buyBase - shipBase;
    // LN sau thuế: trừ thêm phần VAT chênh lệch phải nộp
    const profitAfter  = profitBefore - vatPayable;
    const marginPct    = sellBase > 0 ? Math.round(profitBefore / sellBase * 100) : 0;
    return { qty, buyBase, buyVatA, shipBase, shipVatA, sellBase, sellVatA, revenueTotal, costTotal, vatPayable, profitBefore, profitAfter, marginPct };
  }

  function calcTotal() {
    const calcs = items.map(calcItem);
    return {
      calcs,
      totalCost:     calcs.reduce((a,c) => a + c.costTotal,    0),
      totalRevenue:  calcs.reduce((a,c) => a + c.revenueTotal, 0),
      totalBuyBase:  calcs.reduce((a,c) => a + c.buyBase,  0),
      totalBuyVat:   calcs.reduce((a,c) => a + c.buyVatA,  0),
      totalShipBase: calcs.reduce((a,c) => a + c.shipBase, 0),
      totalShipVat:  calcs.reduce((a,c) => a + c.shipVatA, 0),
      totalSellBase: calcs.reduce((a,c) => a + c.sellBase, 0),
      totalSellVat:  calcs.reduce((a,c) => a + c.sellVatA, 0),
      totalVatPayable: calcs.reduce((a,c) => a + c.vatPayable, 0),
      totalProfitB:  calcs.reduce((a,c) => a + c.profitBefore, 0),
      totalProfitA:  calcs.reduce((a,c) => a + c.profitAfter,  0),
    };
  }

  // ── VAT slider ────────────────────────────────────────────
  function makeVatSlider(itRef, vatKey, color) {
    const slid = document.createElement('input');
    slid.type = 'range'; slid.min = 0; slid.max = 20; slid.step = 1;
    slid.value = itRef[vatKey] || 0;
    slid.className = 'vat-slider';
    const badge = h('span', { className: 'vat-badge', style: { color } }, (itRef[vatKey] || 0) + '%');
    slid.addEventListener('input', e => {
      itRef[vatKey] = parseFloat(e.target.value);
      badge.textContent = e.target.value + '%';
    });
    slid.addEventListener('change', () => rebuild());
    return h('div', { className: 'form-group' },
      h('label', { className: 'form-label' }, 'VAT (0–20%)'),
      h('div', { className: 'vat-row' }, slid, badge)
    );
  }

  // ── Render ────────────────────────────────────────────────
  const wrap = h('div', {});

  function rebuild() {
    const { calcs, totalCost, totalRevenue, totalBuyBase, totalBuyVat, totalShipBase, totalShipVat, totalSellBase, totalSellVat, totalVatPayable, totalProfitB, totalProfitA } = calcTotal();
    wrap.innerHTML = '';

    // Header
    wrap.appendChild(h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '💰 Báo Giá'),
        h('div', { className: 'page-sub' }, 'Tính giá & lợi nhuận — không lưu vào dữ liệu')
      ),
      h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
        h('button', { className: 'btn', onClick: () => { items.push(newItem()); rebuild(); } }, '➕ Thêm sản phẩm'),
        h('button', { className: 'btn btn-primary', onClick: () => {
          showResult = true; rebuild();
          setTimeout(() => { const el = document.getElementById('qResult'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 100);
        } }, '📋 Xem kết quả'),
        // ── Nút Báo Giá Khách ──────────────────────────────────────
        h('button', { className: 'btn', style: { background: 'var(--blue)', color: '#fff', border: 'none' }, onClick: () => {
          // Tạo bảng báo giá gửi cho khách (chỉ hiển thị giá bán, không lộ giá nhập)
          const { calcs: cc, totalRevenue: tR } = calcTotal();
          const quoteItems = items.map((it, i) => {
            const c = cc[i];
            return { name: it.name || `Sản phẩm ${i+1}`, qty: c.qty, unit: it.unit, sellPrice: it.sellPrice, sellVat: it.sellVat, sellBase: c.sellBase, sellVatA: c.sellVatA, revenueTotal: c.revenueTotal, imageData: it.imageData || '' };
          }).filter(it => it.sellBase > 0 || it.sellPrice > 0);
          if (quoteItems.length === 0) { toast('Vui lòng nhập giá bán cho ít nhất một sản phẩm!', 'error'); return; }

          function buildCustomerQuoteHTML(autoprint) {
            // Build detailed rows with clear calculation: qty × price = subTotal, VAT amount, total
            const totalSellBase = quoteItems.reduce((a,it) => a + it.sellBase, 0);
            const totalVatAmt   = quoteItems.reduce((a,it) => a + it.sellVatA, 0);
            const totalRevenue  = quoteItems.reduce((a,it) => a + it.revenueTotal, 0);
            const hasAnyVat     = quoteItems.some(it => it.sellVat > 0);

            const hasAnyImage = quoteItems.some(it => it.imageData);
            const rows = quoteItems.map((it, idx) => {
              const subTotal = it.sellBase;
              const vatLine  = it.sellVat > 0
                ? `<div style="font-size:11px;color:#7a6020;margin-top:3px;">VAT ${it.sellVat}%: +${fmt(it.sellVatA)}đ</div>`
                : (hasAnyVat ? `<div style="font-size:11px;color:#aaa;margin-top:3px;">Không VAT</div>` : '');
              const imgCell  = hasAnyImage
                ? (it.imageData
                    ? `<td style="width:80px;padding:6px 8px;"><img src="${it.imageData}" style="width:70px;height:70px;object-fit:cover;border-radius:6px;border:1px solid #e0d0a0;display:block;" /></td>`
                    : `<td style="width:80px;"></td>`)
                : '';
              return `<tr>
                ${imgCell}
                <td style="font-weight:600;color:#222">${idx+1}. ${it.name}</td>
                <td style="text-align:center;font-weight:700;color:#333">${fmtQty(it.qty)}</td>
                <td style="text-align:center;color:#555">${it.unit}</td>
                <td style="text-align:right;color:#333">${fmt(it.sellPrice)}đ</td>
                <td style="text-align:right;">
                  <div style="font-weight:700;color:#444">${fmt(subTotal)}đ</div>
                  ${vatLine}
                </td>
                <td style="text-align:right;font-weight:800;color:#8b6914;font-size:14px">${fmt(it.revenueTotal)}đ</td>
              </tr>`;
            }).join('');

            // Summary box
            let summaryHTML = `<div style="margin-top:0">`;
            summaryHTML += `<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:#555;border-bottom:1px solid #eee">
              <span>Tổng tiền hàng (chưa VAT):</span>
              <span style="font-weight:600">${fmt(totalSellBase)}đ</span>
            </div>`;
            if (hasAnyVat) {
              // Per-item VAT breakdown
              quoteItems.filter(it => it.sellVat > 0).forEach(it => {
                summaryHTML += `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12px;color:#7a6020;border-bottom:1px solid #f5f0e8">
                  <span>&nbsp;&nbsp;VAT ${it.sellVat}% cho "${it.name}":</span>
                  <span>+${fmt(it.sellVatA)}đ</span>
                </div>`;
              });
              summaryHTML += `<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;color:#7a6020;border-bottom:1px solid #eee">
                <span>Tổng tiền VAT:</span>
                <span style="font-weight:700">+${fmt(totalVatAmt)}đ</span>
              </div>`;
            }
            summaryHTML += `<div style="display:flex;justify-content:space-between;padding:10px 0 4px;font-size:17px;font-weight:800;color:#8b6914">
              <span>TỔNG CỘNG (${hasAnyVat ? 'đã bao gồm VAT' : 'chưa có VAT'}):</span>
              <span>${fmt(totalRevenue)}đ</span>
            </div>`;
            summaryHTML += `</div>`;

            const custLine = customerName ? `<div style="background:#faf7f0;border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:13px;border-left:3px solid #d4b84a;"><b>Kính gửi:</b> ${customerName}${customerPhone ? ' &nbsp;|&nbsp; <b>SĐT:</b> ' + customerPhone : ''}</div>` : '';
            const noteLines = customerNote ? customerNote.split('\n').filter(l => l.trim()) : [];

        )
      ));

      // VAT phải nộp

        ),

          h('div', { style: { fontSize: 26, fontWeight: 700, fontFamily: 'Georgia,serif', color: totalProfitB >= 0 ? 'var(--green)' : 'var(--red)', lineHeight: 1.2 } },
            (totalProfitB >= 0 ? '+' : '') + fmt(totalProfitB) + 'đ'
          ),
          h('div', { style: { fontSize: 11, color: 'var(--text2)', marginTop: 8, lineHeight: 1.6 } }, 'Bán thuần − Nhập thuần − Ship thuần')
        ),
        h('div', { style: { textAlign: 'center', padding: '18px 16px', borderLeft: '1px solid var(--border)' } },
          h('div', { style: { fontSize: 11, color: 'var(--text2)', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '.8px' } }, '💰 Lợi nhuận SAU thuế'),
          h('div', { style: { fontSize: 26, fontWeight: 700, fontFamily: 'Georgia,serif', color: totalProfitColor, lineHeight: 1.2 } },
            (totalProfitA >= 0 ? '+' : '') + fmt(totalProfitA) + 'đ'
          ),
          h('div', { style: { fontSize: 11, color: 'var(--text2)', marginTop: 8, lineHeight: 1.6 } },
            'LN trước thuế − VAT phải nộp (' + (totalVatPayable >= 0 ? '+' : '') + fmt(totalVatPayable) + 'đ)'
          )
        )
      ));

      wrap.appendChild(resultBox);
    }
  }

  rebuild();
  return wrap;
}

// ── BIÊN BẢN GIAO NHẬN ───────────────────────────────────────
function pgBienBan() {
  // ── State ─────────────────────────────────────────────────
  let bb = {
    date:      today(),
    // Bên giao
    giao_ten:    S.settings.shopName  || '',
    giao_dc:     S.settings.address   || '',
    giao_mst:    S.settings.taxId     || '',
    giao_gd:     '',  giao_gd_cv: 'Giám Đốc',
    giao_bh:     '',  giao_bh_cv: 'Bán hàng',
    giao_tk:     '',  giao_tk_cv: 'Thủ kho',
    giao_ql:     '',  giao_ql_cv: 'Quản lý',
    // Bên nhận
    nhan_ten: '', nhan_dc: '', nhan_nd: '',
    // Vận chuyển
    vc_dc: '', vc_lx: '',
    // Nội dung
    hang_mo: 'Giao nhận đá Granite trắng Suối Lau như sau:',
    vat: 8,
    ghichu: 'Hai bên đã thống nhất chất lượng, số lượng hàng hóa. Mọi thất thoát hư hỏng bên vận chuyển hoàn toàn chịu trách nhiệm sau khi rời khỏi nhà máy.',
  };

  let rows = [newBBRow()];
  function newBBRow() {
    return { id: uid(), ten: '', cao: '', dai: '', rong: '', sl: '', dientich: '', dongia: 0 };
  }
  function calcRow(r) {
    const cao = parseFloat(r.cao) || 0;
    const dai = parseFloat(r.dai) || 0;
    const rong = parseFloat(r.rong) || 0;
    const sl  = parseFloat(r.sl)  || 0;
    const dt  = r.dientich !== '' ? (parseFloat(r.dientich) || 0) : (dai * rong * sl);
    const dg  = parseFloat(r.dongia) || 0;
    const tt  = Math.round(dt * dg);
    return { cao, dai, rong, sl, dt, dg, tt };
  }
  function calcTotals() {
    const calcs = rows.map(calcRow);
    const totalSL = calcs.reduce((a,c) => a + c.sl, 0);
    const totalDT = calcs.reduce((a,c) => a + c.dt, 0);
    const totalTT = calcs.reduce((a,c) => a + c.tt, 0);
    const vatAmt  = Math.round(totalTT * (parseFloat(bb.vat) || 0) / 100);
    const tongCong = totalTT + vatAmt;
    return { calcs, totalSL, totalDT, totalTT, vatAmt, tongCong };
  }
  function fmtNum(n) { return n > 0 ? new Intl.NumberFormat('vi-VN').format(Math.round(n)) : ''; }
  function bbInp(type, placeholder, val, onChange, extraStyle) {
    const el = document.createElement('input');
    el.type = type || 'text';
    el.className = 'form-input';
    el.placeholder = placeholder || '';
    el.value = val !== undefined ? String(val) : '';
    if (extraStyle) Object.assign(el.style, extraStyle);
    el.addEventListener('input', e => onChange(e.target.value));
    return el;
  }

  // ── PDF Builder ───────────────────────────────────────────
  function buildBienBanHTML(autoprint) {
    const { calcs, totalSL, totalDT, totalTT, vatAmt, tongCong } = calcTotals();
    const vatPct = parseFloat(bb.vat) || 0;
    const rowsHTML = rows.map((r,i) => {
      const c = calcs[i];
      return `<tr>
        <td style="text-align:center">${i+1}</td>
        <td>${r.ten||''}</td>
        <td style="text-align:center">${c.cao||''}</td>
        <td style="text-align:center">${c.dai||''}</td>
        <td style="text-align:center">${c.rong||''}</td>
        <td style="text-align:center">${c.sl>0?fmtNum(c.sl):''}</td>
        <td style="text-align:center">${c.dt>0?c.dt.toFixed(2):''}</td>
        <td style="text-align:right">${c.dg>0?fmtNum(c.dg):''}</td>
        <td style="text-align:right">${c.tt>0?fmtNum(c.tt):''}</td>
        <td></td>
      </tr>`;
    }).join('');
    const vatRow = vatPct > 0 ? `<tr><td colspan="8" style="text-align:center;font-weight:600">VAT ${vatPct}%</td><td style="text-align:right;font-weight:600">${fmtNum(vatAmt)}</td><td></td></tr>` : '';
    const d = bb.date ? bb.date.split('-') : ['....','..','..'];
    const dayStr = `ngày ${d[2]||'..'} tháng ${d[1]||'..'} năm ${d[0]||'....'}`;

</style></head><body><div class="page">

  ${bb.giao_ql ? `<p>Ông/Bà: ${rep(bb.giao_ql)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: ${rep(bb.giao_ql_cv)}</p>` : ''}

// ── HỢP ĐỒNG MUA BÁN ─────────────────────────────────────────
function pgHopDong() {

  // ── State hợp đồng ────────────────────────────────────────
  let hd = {
    soHD:    '',
    ngay:    today(),
    // Bên A (bên bán) — nhập tay
    a_ten:   S.settings.shopName    || '',
    a_dc:    S.settings.address     || '',
    a_tk:    S.settings.bankAccount || '',
    a_dt:    S.settings.phone       || '',
    a_mst:   S.settings.taxId       || '',
    a_dd:    S.settings.director    || '',
    a_cv:    'Giám đốc công ty',
    // Bên B
    b_ten:   '', b_dc: '', b_dt: '', b_tk: '', b_mst: '', b_dd: '', b_cv: 'Giám đốc công ty',
    // Điều 1 - hàng hóa
    items:   [newHDItem()],
    vat:     10,          // % VAT
    // Điều 2 - giao nhận
    quyCach: '',
    diaDiemGiao: '',
    // Điều 3 - thanh toán
    pctTamUng:  30,       // % tạm ứng (mặc định 30%)
    thoiHanConLai: '30 ngày',
    // Điều 5
    hieulucDen: '',
  };

  function newHDItem() {
    return { id: uid(), noidung: '', dvt: '', sl: '', dongia: 0 };
  }

  // ── Số thành chữ tiếng Việt ──────────────────────────────
  function soThanhChu(n) {
    if (!n || isNaN(n)) return '';
    n = Math.round(parseFloat(n));
    if (n === 0) return 'Không Đồng';
    const donvi  = ['', 'Một', 'Hai', 'Ba', 'Bốn', 'Năm', 'Sáu', 'Bảy', 'Tám', 'Chín'];
    const hang   = ['', 'Nghìn', 'Triệu', 'Tỷ'];

    function docNhom(so) {
      const tram = Math.floor(so / 100);
      const chuc = Math.floor((so % 100) / 10);
      const dv   = so % 10;
      let str = '';
      if (tram > 0) str += donvi[tram] + ' Trăm ';
      if (chuc === 0 && dv > 0 && tram > 0) str += 'Lẻ ';
      else if (chuc === 1) str += 'Mười ';
      else if (chuc > 1) str += donvi[chuc] + ' Mươi ';
      if (dv === 1 && chuc > 1) str += 'Mốt ';
      else if (dv === 5 && chuc > 0) str += 'Lăm ';
      else if (dv > 0) str += donvi[dv] + ' ';
      return str.trim();
    }

    let result = '';
    // Xử lý tỷ
    const ty  = Math.floor(n / 1000000000);
    const trieu = Math.floor((n % 1000000000) / 1000000);
    const nghin = Math.floor((n % 1000000) / 1000);
    const dv    = n % 1000;

    if (ty > 0)    result += docNhom(ty)    + ' Tỷ ';
    if (trieu > 0) result += docNhom(trieu) + ' Triệu ';
    if (nghin > 0) result += docNhom(nghin) + ' Nghìn ';
    if (dv > 0)    result += docNhom(dv);
    return result.trim() + ' Đồng';
  }

  // ── Tính toán ────────────────────────────────────────────
  function calcHD() {
    const calcs = hd.items.map(it => {
      const sl  = parseFloat(it.sl) || 0;
      const dg  = parseFloat(it.dongia) || 0;
      const tt  = Math.round(sl * dg);
      return { sl, dg, tt };
    });
    const tongHang  = calcs.reduce((a, c) => a + c.tt, 0);
    const vatAmt    = Math.round(tongHang * (parseFloat(hd.vat) || 0) / 100);
    const tongTT    = tongHang + vatAmt;
    const tamUng    = Math.round(tongTT * (parseFloat(hd.pctTamUng) || 0) / 100);
    const conLai    = tongTT - tamUng;
    return { calcs, tongHang, vatAmt, tongTT, tamUng, conLai };
  }

  function fmtVND(n) { return n > 0 ? new Intl.NumberFormat('vi-VN').format(Math.round(n)) : '0'; }
  function hdInp(type, ph, val, onChange, extraStyle) {
    const el = document.createElement('input');
    el.type = type || 'text'; el.className = 'form-input';
    el.placeholder = ph || ''; el.value = val !== undefined ? String(val) : '';
    if (extraStyle) Object.assign(el.style, extraStyle);
    el.addEventListener('input', e => onChange(e.target.value));
    return el;
  }

  // ── Build PDF HTML ────────────────────────────────────────
  function buildHopDongHTML(autoprint) {
    const { calcs, tongHang, vatAmt, tongTT, tamUng, conLai } = calcHD();
    const vatPct = parseFloat(hd.vat) || 0;
    const d = hd.ngay ? hd.ngay.split('-') : ['....','..','..'];
    const dayStr = `ngày ${d[2]||'&nbsp;&nbsp;'} tháng ${d[1]||'&nbsp;&nbsp;'} năm ${d[0]||'....'}`;
    const rep = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    const itemRows = hd.items.map((it, i) => {
      const c = calcs[i];
      return `<tr>
        <td style="text-align:center">${i+1}</td>
        <td>${rep(it.noidung)||'…'}</td>
        <td style="text-align:center">${rep(it.dvt)||'…'}</td>
        <td style="text-align:center">${c.sl>0?fmtVND(c.sl):'…'}</td>
        <td style="text-align:right">${c.dg>0?fmtVND(c.dg):'…'}</td>
        <td style="text-align:right">${c.tt>0?fmtVND(c.tt):'…'}</td>
      </tr>`;
    }).join('');

    const hieulucDen = hd.hieulucDen ? hd.hieulucDen.split('-').reverse().join('/') : '……………………';
    const soHD = hd.soHD ? `<b>Số: ${rep(hd.soHD)}</b>` : '';

    return `<!DOCTYPE html><html><head><meta charset="UTF-8">

<h3>Điều 2: Điều khoản giao nhận</h3>

<p>2.1. Ngay sau khi ký kết hợp đồng, hai bên thống nhất kế hoạch giao nhận hàng để bên A chuẩn bị hàng và bên B bố trí mặt bằng tiếp nhận hàng hóa. Hàng hóa bên A giao phải đảm bảo đúng qui cách <b>${hd.quyCach?rep(hd.quyCach):'……………………'}</b> và chất lượng theo tiêu chuẩn của nhà sản xuất.</p>
<p>2.2. Trên cơ sở kế hoạch giao nhận hàng, Bên A sẽ xác nhận và thông báo lịch giao hàng. Trong trường hợp có bất kỳ sự thay đổi nào, Hai bên sẽ thảo luận và thống nhất lịch giao hàng khác.</p>
<p>2.3. Phương thức giao nhận:</p>
<p>- Địa điểm giao hàng tại Công trình: <b>${hd.diaDiemGiao?rep(hd.diaDiemGiao):'………………………………………………'}</b></p>
<p>- Thời gian giao hàng: Thỏa thuận theo từng đơn hàng cụ thể.</p>
<p>- Chi phí vận chuyển: Bên A chịu trách nhiệm vận chuyển hàng đến chân công trình cho bên B và chi phí vận chuyển hàng thuộc về bên A.</p>
<p>- Chi phí bốc xếp hàng từ xe vận chuyển của bên A xuống chân công trình thuộc trách nhiệm của bên B.</p>
<p>2.4. Số lượng hàng giao thực tế sẽ căn cứ theo biên bản giao nhận có xác nhận của hai bên.</p>
</div>

<h3>Điều 3: Điều khoản thanh toán</h3>
<div class="dieu">
<p>3.1. Bên B thanh toán cho Bên A bằng tiền Việt Nam đồng theo hình thức chuyển khoản.</p>
<p>3.2. Bên B tạm ứng cho bên A trước <b>${hd.pctTamUng}%</b> số tiền tổng giá trị hợp đồng${tongTT>0?`: <b>${fmtVND(tamUng)} đồng</b>`:':'} ${tamUng>0?`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Bằng chữ: <i>${soThanhChu(tamUng)}</i>)`:''}</p>
<p>3.3. Số tiền còn lại của hợp đồng${tongTT>0?`: <b>${fmtVND(conLai)} đồng</b> ${conLai>0?`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Bằng chữ: <i>${soThanhChu(conLai)}</i>)`:''}`:':'} sẽ thanh toán trong vòng <b>${rep(hd.thoiHanConLai)||'…………'}</b> (sau khoảng thời gian trên sẽ tính theo lãi suất ngân hàng hiện tại).</p>
</div>

<h3>Điều 4: Điều khoản chung</h3>
<div class="dieu">
<p>4.1. Trong quá trình thực hiện hợp đồng nếu Hai Bên có những thỏa thuận khác thì tiến hành lập phụ lục hợp đồng. Phụ lục hợp đồng là một bộ phận không thể tách rời của hợp đồng chính.</p>
<p>4.3. Khi phát sinh các vấn đề ngoài dự kiến, hai Bên phải thông báo cho nhau tiến độ thực hiện hợp đồng, cùng nhau giải quyết và lập biên bản. Các biên bản được lập giữa hai Bên được coi là một bộ phận không thể tách rời với hợp đồng.</p>
<p>4.4. Trong trường hợp Hai Bên không tự giải quyết được thì vụ việc sẽ do Tòa án có thẩm quyền giải quyết. Phán quyết của Tòa án có giá trị bắt buộc tuân thủ cho cả hai Bên. Mọi chi phí phát sinh trong quá trình giải quyết vụ kiện sẽ do Bên thua kiện chịu.</p>
</div>

<h3>Điều 5: Hiệu lực của hợp đồng</h3>

<p>5.1. Hợp đồng này có hiệu lực kể từ ngày ký đến hết ngày <b>${hieulucDen}</b>. Khi hết hiệu lực của hợp đồng, Hai Bên thanh toán xong không có gì vướng mắc thì hợp đồng xem như đã được thanh lý.</p>
<p>5.2. Hợp đồng này được lập thành 02 (hai) bản, Mỗi Bên giữ 01 (một) bản có giá trị như nhau.</p>

// ── THU / CHI PHÁT SINH ──────────────────────────────────────
function pgCashflow() {
  const wrap = h('div', {});
  let showForm = false;
  let editId = null;

  // Danh mục mặc định
  const INCOME_CATS  = ['Thu khác', 'Thu hồi công nợ', 'Lãi tiền gửi', 'Hoàn thuế', 'Doanh thu khác'];
  const EXPENSE_CATS = ['Tiền nhà / mặt bằng', 'Tiền điện nước', 'Thuế TNDN', 'Thuế GTGT nộp thêm', 'Lương nhân viên', 'Chi phí vận hành', 'Bảo hiểm', 'Marketing / quảng cáo', 'Sửa chữa thiết bị', 'Chi phí khác'];

  let form = { date: today(), type: 'expense', category: EXPENSE_CATS[0], amount: '', note: '' };

  function rebuild() {
    wrap.innerHTML = '';
    const cfs = (S.cashflows || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    const totalIncome  = cfs.filter(c => c.type === 'income').reduce((a, c) => a + (c.amount || 0), 0);
    const totalExpense = cfs.filter(c => c.type === 'expense').reduce((a, c) => a + (c.amount || 0), 0);
    const netCashflow  = totalIncome - totalExpense;

    // Header
    wrap.appendChild(h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '💵 Thu / Chi Phát Sinh'),
        h('div', { className: 'page-sub' }, 'Ghi nhận thu chi ngoài hoạt động mua bán — tiền nhà, điện nước, thuế...')
      ),
      h('button', { className: 'btn btn-primary', onClick: () => {
        showForm = !showForm;
        editId = null;
        form = { date: today(), type: 'expense', category: EXPENSE_CATS[0], amount: '', note: '' };
        rebuild();
      }}, showForm ? '✕ Đóng' : '➕ Thêm phiếu thu/chi')
    ));

    // Stats tổng hợp
    wrap.appendChild(h('div', { className: 'stats-grid', style: { gridTemplateColumns: 'repeat(3,1fr)' } },
      h('div', { className: 'stat' },
        h('div', { className: 'stat-label' }, 'Tổng thu phát sinh'),
        h('div', { className: 'stat-val', style: { color: 'var(--green)' } }, '+' + fmt(totalIncome) + 'đ'),
        h('div', { className: 'stat-change' }, cfs.filter(c => c.type === 'income').length + ' khoản thu')
      ),
      h('div', { className: 'stat' },
        h('div', { className: 'stat-label' }, 'Tổng chi phát sinh'),
        h('div', { className: 'stat-val', style: { color: 'var(--red)' } }, '−' + fmt(totalExpense) + 'đ'),
        h('div', { className: 'stat-change' }, cfs.filter(c => c.type === 'expense').length + ' khoản chi')
      ),
      h('div', { className: 'stat' },
        h('div', { className: 'stat-label' }, 'Ảnh hưởng lợi nhuận'),
        h('div', { className: 'stat-val', style: { color: netCashflow >= 0 ? 'var(--green)' : 'var(--red)' } },
          (netCashflow >= 0 ? '+' : '') + fmt(netCashflow) + 'đ'),
        h('div', { className: 'stat-change' }, netCashflow >= 0 ? '↑ Tăng lợi nhuận' : '↓ Giảm lợi nhuận')
      )
    ));

    // Form thêm / sửa
    if (showForm) {
      const editing = editId ? (S.cashflows || []).find(c => c.id === editId) : null;
      if (editing && !form._loaded) {
        form = { date: editing.date, type: editing.type, category: editing.category || '', amount: editing.amount, note: editing.note || '', _loaded: true };
      }
      const cats = form.type === 'income' ? INCOME_CATS : EXPENSE_CATS;

      const inpDate = h('input', { type: 'date', className: 'form-input', value: form.date, onInput: e => { form.date = e.target.value; } });
      const selType = h('select', { className: 'form-input', onInput: e => {
        form.type = e.target.value;
        form.category = (e.target.value === 'income' ? INCOME_CATS : EXPENSE_CATS)[0];
        rebuild();
      }});
      [['expense','💸 Chi'], ['income','💵 Thu']].forEach(([v, lbl]) => {
        const opt = h('option', { value: v }, lbl);
        if (form.type === v) opt.selected = true;
        selType.appendChild(opt);
      });

      const selCat = h('select', { className: 'form-input', onInput: e => { form.category = e.target.value; } });
      cats.forEach(c => {
        const opt = h('option', { value: c }, c);
        if (form.category === c) opt.selected = true;
        selCat.appendChild(opt);
      });

      const inpAmount = h('input', { type: 'number', className: 'form-input', placeholder: 'Số tiền (đ)', value: form.amount || '', onInput: e => { form.amount = parseFloat(e.target.value) || 0; } });
      const inpNote   = h('input', { type: 'text', className: 'form-input', placeholder: 'Ghi chú (VD: Tiền nhà tháng 6, Điện tháng 5...)', value: form.note || '', onInput: e => { form.note = e.target.value; } });

      wrap.appendChild(h('div', { className: 'card', style: { border: `1px solid ${form.type === 'income' ? 'rgba(76,175,125,.4)' : 'rgba(224,92,92,.4)'}` } },
        h('div', { className: 'card-title' }, editId ? '✏️ Sửa phiếu' : (form.type === 'income' ? '💵 Thêm khoản thu' : '💸 Thêm khoản chi')),
        h('div', { className: 'fg fg2', style: { gap: 12 } },
          h('div', { className: 'form-group' },
            h('label', { className: 'form-label' }, 'Loại'),
            selType
          ),
          h('div', { className: 'form-group' },
            h('label', { className: 'form-label' }, 'Ngày'),
            inpDate
          ),
          h('div', { className: 'form-group' },
            h('label', { className: 'form-label' }, 'Danh mục'),
            selCat
          ),
          h('div', { className: 'form-group' },
            h('label', { className: 'form-label' }, 'Số tiền (đ) *'),
            inpAmount
          ),
          h('div', { className: 'form-group fg-full' },
            h('label', { className: 'form-label' }, 'Ghi chú'),
            inpNote
          )
        ),
        h('div', { className: 'modal-footer', style: { paddingTop: 12, marginTop: 12 } },
          h('button', { className: 'btn', onClick: () => { showForm = false; editId = null; rebuild(); } }, 'Huỷ'),
          h('button', { className: 'btn btn-primary', onClick: () => {
            const amt = parseFloat(inpAmount.value) || form.amount || 0;
            if (!amt || amt <= 0) { toast('❌ Vui lòng nhập số tiền hợp lệ!', 'error'); return; }
            const dt = inpDate.value || form.date || today();
            const cat = selCat.value || form.category;
            const note = inpNote.value || form.note || '';
            const type = selType.value || form.type;
            const now = new Date().toISOString();

            if (!S.cashflows) S.cashflows = [];
            if (editId) {
              const idx = S.cashflows.findIndex(c => c.id === editId);
              if (idx >= 0) S.cashflows[idx] = { ...S.cashflows[idx], date: dt, type, category: cat, amount: amt, note, _updated: now };
            } else {
              S.cashflows.push({ id: uid(), date: dt, type, category: cat, amount: amt, note, _updated: now, createdAt: now });
            }
            save('cashflows');
            showForm = false; editId = null;
            toast(editId ? '✅ Đã cập nhật phiếu!' : (type === 'income' ? '✅ Đã thêm khoản thu!' : '✅ Đã thêm khoản chi!'), 'success');
            rebuild();
          }}, editId ? '💾 Lưu thay đổi' : (form.type === 'income' ? '💵 Thêm thu' : '💸 Thêm chi'))
        )
      ));
    }

    // Table danh sách
    if (cfs.length === 0) {
      wrap.appendChild(h('div', { className: 'empty' },
        h('div', { className: 'empty-icon' }, '💵'),
        h('div', {}, 'Chưa có phiếu thu/chi nào'),
        h('div', { style: { fontSize: 12, color: 'var(--text3)', marginTop: 6 } }, 'Nhấn "Thêm phiếu thu/chi" để bắt đầu ghi nhận')
      ));
      return;
    }

    // Group by month for summary
    const byMonth = {};
    cfs.forEach(c => {
      const mk = (c.date || '').slice(0,7);
      if (!byMonth[mk]) byMonth[mk] = { income: 0, expense: 0 };
      if (c.type === 'income') byMonth[mk].income += c.amount || 0;
      else byMonth[mk].expense += c.amount || 0;
    });

    wrap.appendChild(h('div', { className: 'card' },
      h('div', { className: 'card-title' }, '📋 Danh sách phiếu thu/chi'),
      h('div', { className: 'table-wrap' },
        h('table', {},
          h('thead', {},
            h('tr', {},
              h('th', {}, 'Ngày'),
              h('th', {}, 'Loại'),
              h('th', {}, 'Danh mục'),
              h('th', {}, 'Ghi chú'),
              h('th', { style: { textAlign: 'right' } }, 'Số tiền'),
              h('th', {}, '')
            )
          ),
          h('tbody', {},
            ...cfs.map(c => h('tr', {},
              h('td', {}, fmtD(c.date)),
              h('td', {}, c.type === 'income'
                ? h('span', { className: 'badge badge-green' }, '💵 Thu')
                : h('span', { className: 'badge badge-red' }, '💸 Chi')
              ),
              h('td', {}, h('span', { className: 'chip' }, c.category || '—')),
              h('td', { style: { color: 'var(--text2)', fontSize: 12 } }, c.note || '—'),
              h('td', { style: { textAlign: 'right', fontWeight: 700, color: c.type === 'income' ? 'var(--green)' : 'var(--red)' } },
                (c.type === 'income' ? '+' : '−') + fmt(c.amount) + 'đ'
              ),
              h('td', {},
                h('div', { style: { display: 'flex', gap: 6 } },
                  h('button', { className: 'btn btn-xs btn-ghost', onClick: () => {
                    editId = c.id;
                    form = { date: c.date, type: c.type, category: c.category || '', amount: c.amount, note: c.note || '', _loaded: true };
                    showForm = true;
                    rebuild();
                  }}, '✏️'),
                  h('button', { className: 'btn btn-xs btn-ghost', style: { color: 'var(--red)' }, onClick: () => {
                    S.confirm = {
                      msg: `Xoá phiếu ${c.type === 'income' ? 'thu' : 'chi'} "${c.note || c.category}" — ${fmt(c.amount)}đ?`,
                      onYes: () => {
                        softDelete('cashflows', c.id);
                        toast('🗑️ Đã xoá phiếu!', 'success');
                        render();
                      }
                    };
                    render();
                  }}, '🗑️')
                )
              )
            ))
          )
        )
      )
    ));
  }
  rebuild();
  return wrap;
}

        ),
        h('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap' } },

            const data = DB.exportAll();
            const a = document.createElement('a');
            a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
            a.download = `DaTuNhien_backup_${today()}.json`;

              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = ev => {
                const ok = DB.importAll(ev.target.result);
                if (ok) {
                  reloadStateFromDB();
                  markRestoredAsFresh(); // bump _updated để bản khôi phục thắng dữ liệu cloud
                  // Push lên Firebase — nếu không, listener realtime sẽ ghi đè ngược dữ liệu vừa nhập
                  ['products','imports','sales','shipping','settings','returns','paymentlogs'].forEach(k => save(k));
                  toast('Đã nhập dữ liệu thành công!', 'success'); render();
                } else { toast('File không hợp lệ!', 'error'); }
              };
              reader.readAsText(file);
            };
            inp.click();
          } }, '📥 Nhập dữ liệu (JSON)')
        ),
        h('div', { style: { borderTop: '1px solid var(--border)', paddingTop: 12, marginTop: 4 } },
          h('button', { className: 'btn btn-danger btn-sm', onClick: () => {
            S.confirm = { msg: '⚠️ XOÁ TOÀN BỘ dữ liệu (sản phẩm, nhập, bán, vận chuyển)? Hành động này KHÔNG THỂ HOÀN TÁC!', onYes: () => {
              // Phải đánh dấu _deleted và push lên cloud TRƯỚC khi xóa local —
              // nếu chỉ gán [] thì doc trên Firestore còn nguyên, lần sync sau dữ liệu quay lại
              const _wipeNow = new Date().toISOString();
              const wipeKeys = [['products','dtn_products'],['imports','dtn_imports'],['sales','dtn_sales'],['shipping','dtn_shipping'],['returns','dtn_returns'],['paymentlogs','dtn_paymentlogs']];
              wipeKeys.forEach(([key, colName]) => {
                const withDeleted = (S[key]||[]).map(r => ({ ...r, _deleted: true, _updated: _wipeNow }));
                if (withDeleted.length > 0 && typeof CLOUD !== 'undefined' && CLOUD._pushDeletedRecord) {
                  CLOUD._pushDeletedRecord(colName, withDeleted);
                }
                S[key] = [];
                DB.set(colName, []);
              });
              toast('Đã xoá toàn bộ dữ liệu (local + cloud)', 'info'); render();
            } };
            render();
          } }, '🗑 Xoá toàn bộ dữ liệu')
        )
      )
    )
  );
}


// ── SYNC — Cloud + 3-2-1 Backup  (v7.4.0) ─────────────────────
function pgSync() {
  const wrap = h('div', {});

  const fmtTs = ts => {
    if (!ts) return 'Chưa có';
    try {
      const d = new Date(ts);
      return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch(e) { return ts; }
  };

  const cloudBadge = (status) => {
    if (!status.enabled) return h('span', { style: { fontSize: 12, color: 'var(--text3)' } }, '☁️ Chưa cấu hình');
    if (!status.online)  return h('span', { style: { fontSize: 12, color: 'var(--amber)', fontWeight: 700 } }, '📵 Offline — đang chờ');
    if (status.syncStatus === 'syncing') return h('span', { style: { fontSize: 12, color: 'var(--blue)', fontWeight: 700 } }, '⏳ Đang đồng bộ...');
    if (status.syncStatus === 'error')   return h('span', { style: { fontSize: 12, color: 'var(--red)', fontWeight: 700 } }, '❌ Lỗi kết nối');
    if (status.syncStatus === 'ok')      return h('span', { style: { fontSize: 12, color: 'var(--green)', fontWeight: 700 } }, '✅ Đã đồng bộ ' + fmtTs(status.lastSync));
    return h('span', { style: { fontSize: 12, color: 'var(--text2)' } }, '☁️ Sẵn sàng');
  };

  // ── Cho biết dữ liệu đang hiển thị là "đã xác nhận thật từ Firebase" hay
  // "đang tạm dùng cache local, chưa xác nhận lại" — để người dùng không lầm
  // tưởng cache local = dữ liệu chính thức.
  const dataConfirmBadge = (status) => {
    if (!status.enabled) return h('span', { style: { fontSize: 12, color: 'var(--red)', fontWeight: 700 } }, '📴 LOCAL-ONLY — chưa bật Firebase, dữ liệu chỉ nằm trên máy này');
    if (status.suspiciousPull) return h('span', { style: { fontSize: 12, color: 'var(--red)', fontWeight: 700 } }, '🛑 Bất thường — xem cảnh báo phía trên');
    if (!status.bootDone) return h('span', { style: { fontSize: 12, color: 'var(--text2)' } }, '⏳ Đang tải dữ liệu...');
    if (!status.online) return h('span', { style: { fontSize: 12, color: 'var(--amber)', fontWeight: 700 } }, '⏳ Offline — đang dùng cache, chưa xác nhận lại');
    if (status.syncStatus === 'error') return h('span', { style: { fontSize: 12, color: 'var(--red)', fontWeight: 700 } }, '❌ Lỗi đồng bộ — đang dùng cache cũ');
    if (status.syncStatus === 'syncing') return h('span', { style: { fontSize: 12, color: 'var(--blue)', fontWeight: 700 } }, '⏳ Đang xác nhận với Firebase...');
    return h('span', { style: { fontSize: 12, color: 'var(--green)', fontWeight: 700 } }, '✅ Dữ liệu đã xác nhận từ Firebase');
  };


  const rebuild = () => {
    const lastSaved  = DB.lastSaved();
    const backupTime = DB.getAutoBackupTime();
    const size       = DB.storageSize();
    const isLS       = DB.isLocal();
    const cloudCfg   = CLOUD.getCfg();
    const cloudSt    = CLOUD.getStatus();
    const rotTime    = CLOUD.getRotatingBackupTime();
    const remind     = CLOUD.shouldRemindDownload();

    wrap.innerHTML = '';
    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, '🔥 Đồng Bộ & Sao Lưu'),
          h('div', { className: 'page-sub' }, 'Firebase là nguồn dữ liệu chính · Backup về máy để dự phòng')
        )
      ),

      // ── NHẮC NHỞ DOWNLOAD nếu quá 7 ngày ──
      remind && h('div', { style: { background: 'rgba(232,165,58,.12)', border: '1px solid rgba(232,165,58,.4)', borderRadius: 'var(--r2)', padding: '12px 16px', marginBottom: 16, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' } },
        h('div', {},
          h('div', { style: { fontWeight: 700, color: 'var(--amber)', fontSize: 13 } }, '⚠️ Đã hơn 7 ngày chưa tải file backup về máy!'),
          h('div', { style: { fontSize: 12, color: 'var(--text2)', marginTop: 3 } }, 'Nguyên tắc 3-2-1: cần 1 bản lưu offline ngoài cloud.')
        ),
        h('button', { className: 'btn btn-sm', style: { background: 'var(--amber)', color: '#0f1117', border: 'none', fontWeight: 700 }, onClick: () => {
          const data = DB.exportAll();
          const a = document.createElement('a');
          a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
          a.download = 'DaTuNhien_backup_' + today() + '.json';
          a.click();
          CLOUD.markDownloaded();
          toast('✅ Đã tải backup! Lưu vào Google Drive hoặc USB.', 'success');
          rebuild();
        } }, '💾 Tải ngay')
      ),

      // ── CẢNH BÁO: phát hiện 1 lần đồng bộ bất thường đã bị chặn ──
      cloudSt.suspiciousPull ? h('div', { className: 'card', style: { border: '1px solid var(--red)', background: 'rgba(224,92,92,0.08)', marginBottom: 16 } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10 } },
          h('div', {},
            h('div', { style: { fontWeight: 700, color: 'var(--red)', fontSize: 13 } },
              '🛑 Đã chặn 1 lần ghi đè dữ liệu bất thường — "' + cloudSt.suspiciousPull.name + '"'),
            h('div', { style: { fontSize: 12, color: 'var(--text2)', marginTop: 4, lineHeight: 1.6 } },
              'Lúc ' + fmtTs(cloudSt.suspiciousPull.ts) + ', đồng bộ với Firebase trả về RỖNG dù cache đang có ' +
              cloudSt.suspiciousPull.baselineLen + ' bản ghi. App đã TỪ CHỐI ghi đè để bảo vệ dữ liệu thật của bạn — ' +
              'dữ liệu hiện tại vẫn an toàn. Nguyên nhân thường là mất mạng tạm thời hoặc phiên đăng nhập chưa kịp xác thực xong. ',

      h('div', { className: 'card' },

        (() => {

          let cfgShopId    = cloudCfg.shopId    || 'shop1';

          let testMsg = '';
          let testOk  = null;

          const apiKeyInp   = h('input', { type: 'password', className: 'form-input', placeholder: 'AIzaSy...', value: cfgApiKey,    style: { fontFamily: 'monospace', fontSize: 12 }, onInput: e => { cfgApiKey    = e.target.value.trim(); } });
          const projectInp  = h('input', { type: 'text',     className: 'form-input', placeholder: 'my-project-id', value: cfgProjectId, style: { fontFamily: 'monospace', fontSize: 12 }, onInput: e => { cfgProjectId = e.target.value.trim(); } });
          const bucketInp   = h('input', { type: 'text',     className: 'form-input', placeholder: '(tự xác định nếu để trống) — vd: my-project.firebasestorage.app', value: cfgBucket, style: { fontFamily: 'monospace', fontSize: 12 }, onInput: e => { cfgBucket = e.target.value.trim(); } });
          const shopIdInp   = h('input', { type: 'text',     className: 'form-input', placeholder: 'shop1',          value: cfgShopId,    style: { fontFamily: 'monospace', fontSize: 12 }, onInput: e => { cfgShopId    = e.target.value.trim() || 'shop1'; } });

          const toggleDiv = h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, marginTop: 10 } },

          const btnTest = h('button', { className: 'btn btn-sm', onClick: async () => {
            if (!cfgApiKey || !cfgProjectId) { toast('Vui lòng nhập API Key và Project ID!', 'error'); return; }

          const btnSave = h('button', { className: 'btn btn-primary btn-sm', onClick: () => {

            rebuild();
          } }, '💾 Lưu cấu hình');

          const btnSyncNow = h('button', { className: 'btn btn-sm', style: { background: 'var(--blue)', color: '#fff', border: 'none' }, onClick: async () => {
            if (!cloudCfg.enabled) { toast('Chưa bật Firebase sync!', 'error'); return; }
            btnSyncNow.textContent = '⏳ Đang sync...';
            btnSyncNow.disabled = true;
            const ok = await CLOUD.syncAll(S);
            btnSyncNow.textContent = '⚡ Sync ngay';
            btnSyncNow.disabled = false;
            toast(ok ? '✅ Sync lên Firebase thành công!' : '❌ Sync thất bại, kiểm tra kết nối.', ok ? 'success' : 'error');
            rebuild();
          } }, '⚡ Sync ngay');

          const btnPull = h('button', { className: 'btn btn-sm', onClick: async () => {
            if (!cloudCfg.enabled) { toast('Chưa bật Firebase sync!', 'error'); return; }
            S.confirm = { msg: '⬇️ Kéo & merge dữ liệu từ Firebase về?\n\nDữ liệu sẽ được MERGE (không ghi đè) — đơn hàng/phiếu nhập từ cloud sẽ được bổ sung vào local. Sản phẩm sẽ lấy bản mới nhất.', onYes: async () => {
              // Dùng bootSync → applyCloudData: merge đúng theo _updated + tôn trọng _deleted,
              // KHÔNG ghi đè như trước (code cũ S.products = result.products làm mất dữ liệu
              // local chưa sync và hồi sinh sản phẩm đã xóa)
              // forceFull=true: nút này dùng để CHỮA khi nghi ngờ dữ liệu lệch — phải bỏ qua
              // cursor/cache hiện có (vì chính nó có thể là thứ đang có vấn đề), pull thật 100%.
              const ok = await CLOUD.bootSync(S, true);
              if (!ok) { toast('❌ Không kéo được dữ liệu từ cloud!', 'error'); return; }
              toast('✅ Đã kéo & merge dữ liệu từ Firebase!', 'success');
              render();

            render();

          // Nút tính lại tồn kho từ cloud — dùng khi tồn kho bị lệch giữa 2 thiết bị
          // Cách hoạt động: pull cloud → lấy TẤT CẢ imports/sales/returns từ cloud
          // → tính lại stock từ đầu (base=0, cộng nhập, trừ bán, cộng trả)
          // → ghi đè stock local → push ngược lên cloud để các thiết bị khác nhận
          // Dùng khi: máy tính thể hiện stock khác điện thoại sau khi xoá đơn nhiều lần
          const btnFixStock = h('button', { className: 'btn btn-sm', style: { background: 'rgba(224,92,92,0.18)', color: 'var(--red)', borderColor: 'rgba(224,92,92,0.4)', fontWeight: 700 }, onClick: async () => {
            if (!cloudCfg.enabled) { toast('Chưa bật Firebase sync!', 'error'); return; }
            S.confirm = {
              msg: '🔧 Tính lại tồn kho từ cloud?\n\nThao tác này sẽ:\n• Pull toàn bộ phiếu nhập + đơn bán + trả hàng từ cloud\n• Tính lại stock từ đầu cho tất cả sản phẩm\n• Ghi đè tồn kho local và đẩy lên cloud\n\n⚠️ Dùng khi tồn kho bị lệch giữa máy tính và điện thoại.',
              onYes: async () => {
                toast('⏳ Đang tính lại tồn kho...', 'info');
                try {
                  // 1. Pull toàn bộ data từ cloud
                  const cloudData = await CLOUD.pullAll();
                  if (!cloudData) { toast('❌ Không kéo được dữ liệu từ cloud!', 'error'); return; }

                  // 2. Lấy danh sách imports, sales, returns sạch (không _deleted)
                  const cloudImports = (cloudData.products ? cloudData.products : []);
                  // Re-pull riêng để rõ ràng
                  const allImports  = (cloudData.imports  || []).filter(r => !r._deleted);
                  const allSales    = (cloudData.sales    || []).filter(r => !r._deleted);
                  const allReturns  = (cloudData.returns  || []).filter(r => !r._deleted);
                  const allProducts = (cloudData.products || []).filter(r => !r._deleted);

                  if (allProducts.length === 0) { toast('❌ Không có sản phẩm nào trên cloud!', 'error'); return; }

                  // 3. Với mỗi sản phẩm: tính stock = sum(imports) - sum(sales) + sum(returns)
                  const now = new Date().toISOString();
                  const fixedProducts = allProducts.map(p => {
                    const pImports = allImports.filter(r => r.productId === p.id);
                    const pSales   = allSales.filter(r => r.productId === p.id);
                    const pReturns = allReturns.filter(r => r.productId === p.id);

                    const totalIn  = pImports.reduce((a, r) => a + (parseFloat(r.qty) || 0), 0);
                    const totalOut = pSales.reduce((a, r) => a + (parseFloat(r.qty) || 0), 0);
                    const totalRet = pReturns.reduce((a, r) => a + (parseFloat(r.returnQty) || 0), 0);
                    // FIX: KHÔNG ép về 0 — cả app "cho phép âm kho" để biết hàng
                    // đã bán quá tay (oversold). Math.max(0,...) cũ che mất tình
                    // trạng này, gây sai lệch khi đối chiếu nhập-xuất-tồn.
                    const newStock = totalIn - totalOut + totalRet;

                    // Seed _stockTx đầy đủ để các thiết bị khác không double-apply
                    const allTxIds = [
                      ...pImports.map(r => r.id),
                      ...pSales.map(r => r.id),
                      ...pReturns.map(r => r.id),
                    ].filter(Boolean);

                    // Tính lại variant stock (m²) nếu có variantId
                    const newVariants = (p.variants || []).map(vt => {
                      const vtSales   = pSales.filter(r => r.variantId === vt.id);
                      const vtImports = pImports.filter(r => r.variantId === vt.id);
                      const vtIn  = vtImports.reduce((a, r) => a + (parseFloat(r.qty) || 0), 0);
                      const vtOut = vtSales.reduce((a, r) => a + (parseFloat(r.qty) || 0), 0);
                      const newM2 = vtIn - vtOut; // FIX: không ép về 0 — đồng bộ với chính sách cho phép âm kho
                      const ppm2 = (vt.tileW > 0 && vt.tileH > 0) ? 10000 / (vt.tileW * vt.tileH) : 0;
                      return { ...vt, stockM2: newM2, stockPieces: ppm2 > 0 ? Math.round(newM2 * ppm2) : vt.stockPieces };
                    });

                    return { ...p, stock: newStock, variants: newVariants, _stockTx: allTxIds, _updated: now };
                  });

                  // 4. Merge lại toàn bộ cloud data vào local S (không mất đơn nào)
                  S.products    = fixedProducts;
                  S.imports     = S.imports.concat(allImports.filter(r => !S.imports.find(l => l.id === r.id)));
                  S.sales       = S.sales.concat(allSales.filter(r => !S.sales.find(l => l.id === r.id)));
                  S.returns     = S.returns.concat(allReturns.filter(r => !S.returns.find(l => l.id === r.id)));

                  // 5. Lưu local cho imports/sales/returns (không có gì quan
                  // trọng cần chờ xác nhận — đây chỉ là bổ sung record từ
                  // cloud, không phải số liệu vừa tính lại).
                  ['imports','sales','returns'].forEach(k => save(k));
                  try { if (typeof DB !== 'undefined') DB.set('dtn_products', S.products); } catch(e) {}

                  // 6. Đẩy products đã sửa lên cloud — CHỜ XÁC NHẬN THẬT (không
                  // dùng hàng đợi nền push() như trước) để biết chắc đã ghi
                  // vào Firestore trước khi báo "thành công" cho người dùng.
                  // Đây là điểm sửa chính: trước đây push() chỉ xếp hàng đợi
                  // và trả về ngay, nên nếu lần ghi đó thất bại (mất mạng,
                  // dữ liệu lỗi...) người dùng vẫn thấy toast "thành công",
                  // và khi mở lại app, số liệu cũ trên Firestore (chưa hề
                  // được ghi đè) lại đè ngược về local — y hệt hiện tượng
                  // "dùng công cụ này xong, mở lại app vẫn về số cũ".
                  const pushOk = await CLOUD.pushAwait('dtn_products', fixedProducts);
                  if (!pushOk) {
                    toast('❌ Đã tính lại tồn kho ở máy này, NHƯNG đẩy lên Firebase THẤT BẠI — số liệu CHƯA lên cloud, các máy khác sẽ chưa thấy thay đổi và lần mở app sau có thể quay lại số cũ. Kiểm tra mạng/đăng nhập rồi bấm lại nút này.', 'error');
                    render();
                    return;
                  }
                  // Đánh dấu đã đồng bộ — để save()/listener sau này không hiểu
                  // nhầm các sản phẩm này là "còn thay đổi chưa push".
                  if (typeof _seedLastPushed === 'function') _seedLastPushed('products', fixedProducts);

                  const count = fixedProducts.length;
                  toast(`✅ Đã tính lại tồn kho cho ${count} sản phẩm và XÁC NHẬN đã lưu trên Firebase!`, 'success');
                  render();
                } catch(e) {
                  console.error('[FIX STOCK]', e);
                  toast('❌ Lỗi: ' + (e.message || e), 'error');
                }
              }
            };
            render();
          } }, '🔧 Sửa tồn kho từ cloud');

          // ── Sửa ảnh sản phẩm chưa đồng bộ (ảnh base64 quá khổ bị luồng sync
          // bỏ qua → máy khác không nhận được ảnh). Nén nhỏ lại tại chỗ rồi đẩy
          // lên Firebase. CHỈ làm việc trên dữ liệu LOCAL của máy này → phải
          // chạy trên máy ĐANG hiển thị ảnh đúng. Không xoá/không làm rỗng ảnh.
          const btnFixImages = h('button', { className: 'btn btn-sm', style: { background: 'rgba(91,143,232,0.18)', color: 'var(--blue)', borderColor: 'rgba(91,143,232,0.4)', fontWeight: 700 }, onClick: async () => {
            if (!cloudCfg.enabled) { toast('Chưa bật Firebase sync!', 'error'); return; }
            // Ngưỡng: luồng sync bỏ field image khi base64 > 900.000 ký tự (xem CLOUD.push).
            // Lấy > 850.000 để gom cả ảnh sát giới hạn, tránh sót.
            const THRESHOLD = 850000;
            const targets = (S.products || []).filter(p =>
              p && typeof p.image === 'string' && p.image.indexOf('data:') === 0 && p.image.length > THRESHOLD);
            if (targets.length === 0) {
              toast('✅ Máy này không có ảnh quá khổ nào — không cần sửa. Nếu máy kia vẫn thiếu ảnh, hãy chạy nút này trên máy ĐANG hiển thị ảnh ĐÚNG.', 'info');
              return;
            }
            S.confirm = {
              msg: '🖼️ Sửa ' + targets.length + ' ảnh quá khổ chưa đồng bộ?\n\n• Hãy chạy trên máy ĐANG hiển thị ảnh ĐÚNG (thường là máy tính).\n• Các ảnh nặng sẽ được NÉN NHỎ lại rồi đẩy lên Firebase để máy kia nhận được.\n• KHÔNG xoá sản phẩm, KHÔNG đụng tới ảnh nhỏ/bình thường.\n• Ảnh nào lỗi sẽ được giữ nguyên (không mất dữ liệu).',
              onYes: async () => {
                toast('⏳ Đang nén lại ' + targets.length + ' ảnh...', 'info');
                let fixed = 0, failed = 0;
                const fixedProducts = [];
                for (const p of targets) {
                  const newImg = await new Promise(res => _recompressDataUrl(p.image, res));
                  if (!newImg) { failed++; continue; } // giữ nguyên ảnh gốc
                  const updated = { ...p, image: newImg, _updated: new Date().toISOString() };
                  S.products = S.products.map(x => x.id === p.id ? updated : x);
                  fixedProducts.push(updated);
                  fixed++;
                }
                if (fixedProducts.length === 0) {
                  toast('❌ Không nén lại được ảnh nào (' + failed + ' lỗi). Dữ liệu giữ nguyên, không có gì thay đổi.', 'error');
                  render();
                  return;
                }
                // Lưu cache local trước (đề phòng đẩy cloud lỗi vẫn còn bản nén ở máy này)
                try { if (typeof DB !== 'undefined') DB.set('dtn_products', S.products); } catch(e) {}
                // Đẩy lên Firebase CHỜ XÁC NHẬN THẬT (không fire-and-forget)
                const pushOk = await CLOUD.pushAwait('dtn_products', fixedProducts);
                if (!pushOk) {
                  toast('❌ Đã nén ảnh ở máy này NHƯNG đẩy lên Firebase THẤT BẠI — máy kia chưa nhận được. Kiểm tra mạng/đăng nhập rồi bấm lại nút này.', 'error');
                  render();
                  return;
                }
                // Đánh dấu đã push để save()/listener không hiểu nhầm là "còn thay đổi chưa đẩy"
                if (typeof _seedLastPushed === 'function') _seedLastPushed('products', fixedProducts);
                toast('✅ Đã nén & đồng bộ ' + fixed + ' ảnh' + (failed ? (' (' + failed + ' ảnh lỗi, giữ nguyên)') : '') + '. Mở app trên máy kia để kiểm tra.', 'success');
                render();
              }
            };
            render();
          } }, '🖼️ Sửa ảnh chưa đồng bộ');

          const guideDiv = h('div', { style: { background: 'var(--bg3)', borderRadius: 'var(--r2)', padding: '10px 14px', fontSize: 12, color: 'var(--text2)', lineHeight: 1.7, marginTop: 12, borderLeft: '3px solid var(--blue)' } },
            h('b', { style: { color: 'var(--blue)' } }, '💡 Hướng dẫn lấy thông tin Firebase:'), h('br'),
            '1. Vào ', h('b', {}, 'console.firebase.google.com'), ' → Tạo project mới (miễn phí)', h('br'),

            '3. Copy ', h('b', {}, 'apiKey'), ' và ', h('b', {}, 'projectId'), ' từ firebaseConfig', h('br'),
            '4. Vào Firestore Database → Create database → Chọn mode "test" (cho phép read/write)', h('br'),
            '5. Dán apiKey + projectId vào đây → Kiểm tra → Lưu → Bật đồng bộ', h('br'),

            h('span', { style: { color: 'var(--green)' } }, '✅ Xung đột multi-device: tự động merge — đơn hàng không bị mất, thiết bị nào tạo trước đều được giữ lại')
          );

          return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },
            h('div', { className: 'fg fg2' },
              h('div', { className: 'form-group' },
                h('label', { className: 'form-label' }, 'Firebase API Key'),
                apiKeyInp

                  let syncWarn = '';

                      const result = applyExcelRestore(parsed, true);
                      toast('✅ Đã khôi phục: +' + result.prodNew + ' SP, +' + result.saleNew + ' đơn bán, +' + result.impNew + ' phiếu nhập, +' + result.cfNew + ' thu/chi — đã đồng bộ lên Firebase!', 'success');
                      render();
                    }
                  };
                  render();
                } catch (err) {
                  console.error(err);
                  toast('❌ Lỗi đọc file Excel: ' + (err.message || err), 'error');
                }
              };
              reader.readAsArrayBuffer(file);
            };
            fileInp.click();
          } }, '📊 Khôi phục từ file Excel'),
        ),
        h('div', { style: { fontSize: 12, color: 'var(--text2)', marginBottom: 8 } }, 'Hoặc dán JSON trực tiếp:'),
        (() => {
          const ta = h('textarea', { className: 'form-input', placeholder: 'Dán dữ liệu JSON vào đây...', style: { minHeight: '100px', fontFamily: 'monospace', fontSize: 12 } });
          const btnImp = h('button', { className: 'btn btn-primary', style: { marginTop: 8 }, onClick: () => {
            const json = ta.value.trim();
            if (!json) { toast('Vui lòng dán JSON!', 'error'); return; }
            const ok = DB.importAll(json);
            if (ok) {
              reloadStateFromDB();
              markRestoredAsFresh(); // bump _updated để bản khôi phục thắng dữ liệu cloud
              ['products','imports','sales','shipping','settings','returns','paymentlogs'].forEach(k => save(k));
              toast('✅ Nhập thành công và đồng bộ lên Firebase!', 'success'); ta.value = ''; render();
            } else { toast('❌ JSON không hợp lệ!', 'error'); }
          } }, '✅ Nhập JSON');
          return h('div', {}, ta, btnImp);
        })()
      ),

      // ── Danger zone ──
      h('div', { className: 'card' },
        h('div', { className: 'card-title' }, '⚠️ Vùng nguy hiểm'),
        h('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap' } },
          h('button', { className: 'btn btn-danger btn-sm', onClick: () => {
            S.confirm = { msg: '⚠️ XOÁ TOÀN BỘ dữ liệu? KHÔNG THỂ HOÀN TÁC!', onYes: () => {
              // Đánh dấu _deleted và push lên cloud trước khi xóa local —
              // nếu chỉ gán [] thì doc trên Firestore còn nguyên, lần sync sau dữ liệu quay lại
              const _wipeNow = new Date().toISOString();
              const wipeKeys = [['products','dtn_products'],['imports','dtn_imports'],['sales','dtn_sales'],['shipping','dtn_shipping'],['returns','dtn_returns'],['paymentlogs','dtn_paymentlogs']];
              wipeKeys.forEach(([key, colName]) => {
                const withDeleted = (S[key]||[]).map(r => ({ ...r, _deleted: true, _updated: _wipeNow }));
                if (withDeleted.length > 0 && typeof CLOUD !== 'undefined' && CLOUD._pushDeletedRecord) {
                  CLOUD._pushDeletedRecord(colName, withDeleted);
                }
                S[key] = [];
                DB.set(colName, []);
              });
              toast('Đã xoá toàn bộ dữ liệu (local + cloud)', 'info'); render();
            } }; render();
          } }, '🗑 Xoá toàn bộ dữ liệu')
        )
      )
    ));
  };

  // Lắng nghe thay đổi trạng thái cloud để cập nhật UI tự động
  CLOUD.onStatus(() => { try { rebuild(); } catch(e) {} });

  rebuild();
  return wrap;
}

// ══════════════════════════════════════════════════════════════════
//  KHÔI PHỤC DỮ LIỆU SẢN PHẨM BỊ MẤT (pgRecovery)
//
//  Quét toàn bộ sales / imports / paymentlogs / returns để tìm
//  các productId / productName KHÔNG còn tồn tại trong S.products.
//  Cho phép tái tạo lại sản phẩm từ thông tin đã lưu trong giao dịch.
// ══════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════
//  SỔ KHO — CHI TIẾT NHẬP / BÁN THEO TỪNG MẶT HÀNG (pgItemLedger)
//
//  CHỈ ĐỌC: lọc S.imports / S.sales / S.returns theo productId để hiển thị.
//  KHÔNG tạo/sửa/xoá bất kỳ bản ghi nào, KHÔNG đụng đồng bộ Firebase.
// ══════════════════════════════════════════════════════════════════
function pgItemLedger() {
  const wrap = h('div', {});

  const variantSize = (prod, vid) => {
    if (!vid || !prod || !prod.variants) return '';
    const vt = prod.variants.find(v => v.id === vid);
    return vt ? (vt.size || vt.name || '') : '';
  };

  const rebuild = () => {
    wrap.innerHTML = '';
    const section = h('div', {});

    section.appendChild(h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '📒 Sổ Kho — Chi Tiết Mặt Hàng'),
        h('div', { className: 'page-sub' }, 'Xem toàn bộ phiếu nhập và đơn bán của một mặt hàng (chỉ xem — không sửa dữ liệu)')
      )
    ));

    // ── Bộ chọn mặt hàng (ô tìm kiếm + danh sách lọc) ──
    const products = (S.products || []).slice().sort((a, b) => (a.name || '').localeCompare(b.name || '', 'vi'));

    const search = document.createElement('input');
    search.className = 'form-input';
    search.type = 'text';
    search.placeholder = '🔍 Gõ tên hoặc mã SKU để lọc (không cần dấu)...';
    search.value = S._ledgerSearch || '';

    const sel = document.createElement('select');
    sel.className = 'form-input';

    const cnt = document.createElement('div');
    cnt.style.cssText = 'font-size:11px;color:var(--text3);margin-top:4px';

    // Đổ lại danh sách trong <select> theo từ khoá — CHỈ cập nhật select,
    // KHÔNG rebuild cả trang nên ô tìm kiếm giữ nguyên focus/con trỏ.
    const fillOptions = () => {
      const q = _normVi(search.value.trim());
      const filtered = q ? products.filter(p => _normVi((p.name || '') + ' ' + (p.sku || '')).indexOf(q) !== -1) : products;
      sel.innerHTML = '';
      const opt0 = document.createElement('option'); opt0.value = ''; opt0.textContent = '— Chọn mặt hàng —'; sel.appendChild(opt0);
      filtered.forEach(p => {
        const o = document.createElement('option'); o.value = p.id;
        o.textContent = p.name + (p.sku ? ' [' + p.sku + ']' : '');
        if (p.id === S._ledgerProductId) o.selected = true;
        sel.appendChild(o);
      });
      cnt.textContent = q ? (filtered.length + ' / ' + products.length + ' mặt hàng khớp') : (products.length + ' mặt hàng');
    };
    fillOptions();
    search.oninput = () => { S._ledgerSearch = search.value; fillOptions(); };
    sel.onchange = () => { S._ledgerProductId = sel.value; rebuild(); };

    section.appendChild(h('div', { className: 'form-group', style: { marginBottom: 16, maxWidth: 520 } },
      h('label', { className: 'form-label' }, 'Tìm & chọn mặt hàng'),
      search, h('div', { style: { height: 8 } }), sel, cnt));

    const prod = products.find(p => p.id === S._ledgerProductId);
    if (!prod) {
      section.appendChild(h('div', { className: 'card', style: { textAlign: 'center', padding: 40, color: 'var(--text2)' } },
        'Chọn một mặt hàng ở trên để xem sổ nhập – bán.'));
      wrap.appendChild(section);
      return;
    }

    // ── Lấy dữ liệu (CHỈ ĐỌC) ──
    const imps = (S.imports || []).filter(i => i.productId === prod.id).slice().sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
    const sals = (S.sales   || []).filter(s => s.productId === prod.id).slice().sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
    const rets = (S.returns || []).filter(r => r.productId === prod.id);

    const sum = (arr, f) => arr.reduce((a, r) => a + (parseFloat(r[f]) || 0), 0);
    const totImpQty   = sum(imps, 'qty');
    const totImpMoney = sum(imps, 'total');
    const totSaleQty  = sum(sals, 'qty');
    const totSaleMoney = sum(sals, 'total');
    const totRetQty   = rets.reduce((a, r) => a + (parseFloat(r.returnQty) || 0), 0);
    const conLai      = totImpQty - totSaleQty + totRetQty;
    const grossProfit = totSaleMoney - totSaleQty * (parseFloat(prod.buyPrice) || 0);
    const unit = prod.unit || '';

    // ── Thẻ tóm tắt ──
    const statCard = (label, val, color) => h('div', { className: 'stat' },
      h('div', { className: 'stat-label' }, label),
      h('div', { className: 'stat-val', style: { fontSize: 17, color: color || 'var(--text)' } }, val)
    );
    section.appendChild(h('div', { className: 'stats-grid', style: { gridTemplateColumns: 'repeat(4,1fr)', marginBottom: 14 } },
      statCard('📥 Tổng nhập', fmtQty(totImpQty) + ' ' + unit, 'var(--accent)'),
      statCard('🧾 Tổng bán', fmtQty(totSaleQty) + ' ' + unit, 'var(--blue)'),
      statCard('📦 Tồn còn lại', fmtQty(conLai) + ' ' + unit, conLai < 0 ? 'var(--red)' : 'var(--green)'),
      statCard('📈 LN gộp (ước tính)', fmt(grossProfit) + 'đ', grossProfit >= 0 ? 'var(--green)' : 'var(--red)')
    ));
    section.appendChild(h('div', { className: 'stats-grid', style: { gridTemplateColumns: 'repeat(3,1fr)', marginBottom: 20 } },
      statCard('Tiền nhập', fmt(totImpMoney) + 'đ'),
      statCard('Tiền bán', fmt(totSaleMoney) + 'đ'),
      statCard('Tồn theo kho', fmtQty(parseFloat(prod.stock) || 0) + ' ' + unit)
    ));

    // ── Bảng NHẬP ──
    section.appendChild(h('div', { className: 'card', style: { padding: 0, marginBottom: 20, overflowX: 'auto' } },
      h('div', { style: { padding: '14px 18px', fontWeight: 700, fontSize: 14, borderBottom: '1px solid var(--border)' } }, '📥 Phiếu nhập (' + imps.length + ')'),
      h('table', {},
        h('thead', {}, h('tr', {}, th('Ngày'), th('Nhà cung cấp'), th('Quy cách'), th('SL', true), th('Đơn giá', true), th('Thành tiền', true), th('Đã trả', true), th('Còn nợ', true))),
        h('tbody', {},
          ...imps.map(i => {
            const debt = Math.max(0, (i.total || 0) - (i.paid || 0));
            return h('tr', {},
              h('td', {}, fmtD(i.date)),
              h('td', {}, i.supplier || '—'),
              h('td', {}, variantSize(prod, i.variantId) || '—'),
              h('td', { style: { textAlign: 'right' } }, fmtQty(parseFloat(i.qty) || 0)),
              h('td', { style: { textAlign: 'right' } }, fmt(i.unitPrice || 0)),
              h('td', { style: { textAlign: 'right', fontWeight: 700 } }, fmt(i.total || 0)),
              h('td', { style: { textAlign: 'right', color: 'var(--green)' } }, fmt(i.paid || 0)),
              h('td', { style: { textAlign: 'right', color: debt > 0 ? 'var(--red)' : 'var(--text3)' } }, debt > 0 ? fmt(debt) : '—')
            );
          }),
          imps.length === 0 && h('tr', {}, h('td', { colspan: 8, style: { textAlign: 'center', padding: 24, color: 'var(--text3)' } }, 'Chưa có phiếu nhập'))
        )
      )
    ));

    // ── Bảng BÁN ──
    section.appendChild(h('div', { className: 'card', style: { padding: 0, overflowX: 'auto' } },
      h('div', { style: { padding: '14px 18px', fontWeight: 700, fontSize: 14, borderBottom: '1px solid var(--border)' } }, '🧾 Đơn bán (' + sals.length + ')'),
      h('table', {},
        h('thead', {}, h('tr', {}, th('Ngày'), th('Khách hàng'), th('Quy cách'), th('SL', true), th('Đơn giá', true), th('Thành tiền', true), th('Trạng thái'))),
        h('tbody', {},
          ...sals.map(s => {
            const paid = s.status === 'done' || (s.paid || 0) >= (s.total || 0);
            return h('tr', {},
              h('td', {}, fmtD(s.date)),
              h('td', {}, s.customer || '—'),
              h('td', {}, variantSize(prod, s.variantId) || s.variantSize || '—'),
              h('td', { style: { textAlign: 'right' } }, fmtQty(parseFloat(s.qty) || 0)),
              h('td', { style: { textAlign: 'right' } }, fmt(s.unitPrice || 0)),
              h('td', { style: { textAlign: 'right', fontWeight: 700 } }, fmt(s.total || 0)),
              h('td', {}, paid ? h('span', { style: { color: 'var(--green)' } }, '✅ Đã thu') : h('span', { style: { color: 'var(--red)' } }, '⏳ Còn nợ'))
            );
          }),
          sals.length === 0 && h('tr', {}, h('td', { colspan: 7, style: { textAlign: 'center', padding: 24, color: 'var(--text3)' } }, 'Chưa có đơn bán'))
        )
      )
    ));

    wrap.appendChild(section);
  };
  rebuild();
  return wrap;
}

function pgRecovery() {
  const wrap = h('div', {});

  // ── Phân tích toàn bộ giao dịch để tìm sản phẩm mất ──────────
  function analyzeOrphans() {
    const activeIds = new Set((S.products || []).map(p => p.id));
    const orphanMap = {}; // productId → { productId, productName, sources: [] }

    function addOrphan(productId, productName, source, record) {
      if (!productId) return;
      if (activeIds.has(productId)) return; // còn trong kho → bỏ qua
      if (!orphanMap[productId]) {
        orphanMap[productId] = {
          productId,
          productName: productName || '(không rõ tên)',
          sources: [],
          // Thu thập thông tin để tái tạo
          unit: record.unit || '',
          unitPrice: 0,    // giá nhập tốt nhất
          sellPrice: 0,    // giá bán tốt nhất
          totalQty: 0,     // tổng số lượng đã giao dịch
          totalRevenue: 0, // tổng doanh thu
          totalDebt: 0,    // tổng còn nợ liên quan
        };
      }
      const o = orphanMap[productId];
      // Cập nhật tên nếu chưa có hoặc đang là fallback
      if (productName && o.productName === '(không rõ tên)') o.productName = productName;
      if (record.unit && !o.unit) o.unit = record.unit;
      o.sources.push({ type: source, record });
    }

          o.totalRevenue += s.total || 0;
          const debt = Math.max(0, (s.total || 0) - (s.paid || 0));
          o.totalDebt += debt;
        }
      }
    });

        if (o) {

          // đã được add qua sales loop, không cần add lại
        }
      }
    });

    return Object.values(orphanMap).sort((a, b) => b.totalRevenue - a.totalRevenue);

              toast('✅ Đã khôi phục "' + nm + '"! Kiểm tra Kho Hàng và cập nhật thêm thông tin.', 'success');
              S.modal = null;
              rebuild();
              render();
            } }, '✅ Khôi phục')
          ]
        };
        render();
      };

      const btnArea = document.createElement('div');
      btnArea.style.cssText = 'display:flex;flex-direction:column;gap:8px;flex-shrink:0';
      btnArea.appendChild(btnRecover);

      // Nút xem giao dịch liên quan
      const btnView = document.createElement('button');
      btnView.className = 'btn btn-ghost btn-sm';
      btnView.innerHTML = '📋 ' + o.sources.length + ' giao dịch';
      btnView.onclick = () => {
        const lines = [];
        salesRecs.slice(0,10).forEach(s => lines.push(
          '🧾 Bán ' + fmtD(s.date) + ' — ' + escHtml(s.customer||'?') + ' · ' + fmtQty(s.qty) + ' ' + (s.unit||'') + ' · ' + fmt(s.total) + 'đ' + (s.status==='debt'?' ⚠️NỢ':'')
        ));
        importRecs.slice(0,5).forEach(i => lines.push(
          '📥 Nhập ' + fmtD(i.date) + ' — ' + escHtml(i.supplier||'?') + ' · ' + fmtQty(i.qty) + ' ' + (i.unit||'') + ' · ' + fmt(i.total) + 'đ'
        ));
        returnRecs.slice(0,5).forEach(r => lines.push(
          '🔄 Trả ' + fmtD(r.date) + ' — ' + escHtml(r.customer||'?')
        ));
        S.modal = {
          title: '📋 Giao dịch liên quan: ' + o.productName,
          content: h('div', {},
            ...lines.map(l => h('div', { style: { padding: '7px 0', borderBottom: '1px solid var(--border)', fontSize: 12, color: 'var(--text2)' } }, l))
          ),
          footer: [h('button', { className: 'btn btn-primary', onClick: () => { S.modal = null; render(); } }, 'Đóng')]
        };
        render();
      };
      btnArea.appendChild(btnView);
      rowHdr.appendChild(btnArea);
      row.appendChild(rowHdr);
      card.appendChild(row);
    });

    section.appendChild(card);
    wrap.appendChild(section);
  };

  rebuild();
  return wrap;
}

// ── RETURNS (TRẢ HÀNG) ────────────────────────────────────────
function pgReturns() {
  const wrap = h('div', {});
  let search = '';
  const rebuild = () => {
    const returns = S.returns || [];
    const { sales, products } = S;
    const filtered = returns.filter(r => {
      const q = search.toLowerCase();
      return r.customer.toLowerCase().includes(q) || r.productName.toLowerCase().includes(q) || (r.saleId || '').toLowerCase().includes(q);
    }).sort((a, b) => b.date.localeCompare(a.date));

    const totalReturnQty   = returns.reduce((a, r) => a + r.returnQty, 0);
    const totalRefundValue = returns.reduce((a, r) => a + r.refundValue, 0);

    wrap.innerHTML = '';
    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, '↩️ Trả Hàng'),
          h('div', { className: 'page-sub' }, `${returns.length} phiếu · Tổng hoàn kho: ${totalReturnQty} · Giá trị hoàn: ${fmtS(totalRefundValue)}đ`)
        ),
        h('button', { className: 'btn btn-primary', onClick: () => openReturn(rebuild) }, '+ Tạo phiếu trả hàng')
      ),

      // Alert info
      h('div', { className: 'alert alert-warn', style: { marginBottom: 14 } },
        '↩️ Khi khách trả hàng: hàng được hoàn lại vào kho, doanh thu đơn gốc được điều chỉnh, tiền hoàn lại cho khách được ghi nhận.'
      ),

      inp('text', '🔍 Tìm khách hàng, sản phẩm...', search, v => { search = v; rebuild(); }, { style: { marginBottom: 14 } }),

      h('div', { className: 'table-wrap' },
        h('table', {},
          h('thead', {}, h('tr', {},
            th('Ngày'),
            th('Khách hàng'),
            th('Sản phẩm'),
            th('SL trả'),
            th('Đơn giá'),
            th('Giá trị hoàn'),
            th('Lý do'),
            th('Đơn gốc'),
            th('')
          )),
          h('tbody', {},
            ...filtered.map(r => {
              const origSale = sales.find(s => s.id === r.saleId);
              return h('tr', {},
                h('td', { style: { color: 'var(--text2)', fontSize: 12 } }, fmtD(r.date)),
                h('td', { style: { fontWeight: 600 } }, r.customer),
                h('td', { style: { color: 'var(--text2)' } }, r.productName),
                h('td', { style: { color: 'var(--amber)', fontWeight: 700 } }, '−' + fmtQty(r.returnQty) + ' ' + r.unit),
                h('td', {}, fmt(r.unitPrice) + 'đ'),
                h('td', {},
                  h('div', { style: { color: 'var(--green)', fontWeight: 700 } }, fmt(r.refundValue) + 'đ'),
                  (r.vatRate || 0) > 0 && h('div', { style: { fontSize: 10, color: 'var(--blue)', marginTop: 2 } }, '(gồm VAT ' + r.vatRate + '%: +' + fmt(r.refundVat || 0) + 'đ)')
                ),
                h('td', { style: { color: 'var(--text2)', fontSize: 12 } }, r.reason || '—'),
                h('td', {},
                  origSale
                    ? h('span', { className: 'badge badge-blue', style: { cursor: 'pointer', fontSize: 10 } }, fmtD(origSale.date) + ' · ' + fmt(origSale.total) + 'đ')
                    : h('span', { style: { color: 'var(--text3)', fontSize: 12 } }, '—')
                ),
                h('td', {},
                  h('button', {
                    className: 'btn btn-ghost btn-xs',
                    onClick: () => {
                      S.confirm = {
                        msg: `Xoá phiếu trả hàng của "${r.customer}" (${fmtQty(r.returnQty)} ${r.unit} ${r.productName})?\n\n⚠️ Hàng sẽ bị lấy lại ra khỏi kho và doanh thu đơn gốc sẽ được khôi phục.`,
                        onYes: () => {
                          // Hoàn tác: trừ lại hàng khỏi kho (giữ r.id trong _stockTx làm tombstone)
                          S.products = S.products.map(p => p.id === r.productId
                            ? { ...p, stock: (parseFloat(p.stock)||0) - (parseFloat(r.returnQty)||0), _updated: new Date().toISOString() }
                            : p);
                          // Hoàn tác: cộng lại doanh thu đơn gốc nếu có
                          if (r.saleId) {
                            S.sales = S.sales.map(s => {
                              if (s.id !== r.saleId) return s;
                              const newSubTotal = s.subTotal + r.returnQty * r.unitPrice;
                              const newVatAmt   = Math.round(newSubTotal * s.vatRate / 100);
                              const newTotal    = newSubTotal + newVatAmt;
                              const newQty      = s.qty + r.returnQty;
                              const newStatus   = s.paid >= newTotal ? 'done' : 'debt';
                              return { ...s, qty: newQty, subTotal: newSubTotal, vatAmt: newVatAmt, total: newTotal, status: newStatus, _updated: new Date().toISOString() };
                            });
                          }
                          // softDelete TRƯỚC save: return._deleted lên Firebase trước
                          softDelete('returns', r.id, () => {});
                          save('products'); save('sales');
                          toast('Đã xoá phiếu trả hàng, kho và đơn gốc được khôi phục', 'info');
                          rebuild();
                        }
                      };
                      render();
                    }
                  }, '🗑')
                )
              );
            }),
            filtered.length === 0 && h('tr', {}, h('td', { colspan: 9, style: { textAlign: 'center', padding: 32, color: 'var(--text3)' } }, 'Không có phiếu trả hàng'))
          )
        )
      ),

      // Thống kê
