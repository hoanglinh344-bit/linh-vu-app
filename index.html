                    ? h('span', {style:{color:'var(--amber)',fontWeight:600}}, fmt(s.shipFee)+'đ' + (s.shipUnit ? '/'+s.shipUnit:''))
                    : h('span', {style:{color:'var(--text3)'}}, '—')
                ),
                h('td', {},
                  (s.shipFee||0) > 0
                    ? ((s.shipVatRate||0) > 0
                        ? h('span',{className:'badge badge-blue'}, s.shipVatRate+'%')
                        : h('span',{className:'badge',style:{background:'rgba(92,88,80,.15)',color:'var(--text3)',border:'1px solid rgba(92,88,80,.3)'}}, 'KT'))
                    : h('span',{style:{color:'var(--text3)'}}, '—')
                ),
                h('td', { style:{fontWeight:700} }, fmt(s.total)+'đ'),
                isAdmin && (() => {
                  // Tính số m² của đơn hàng
                  const prod = S.products.find(p => p.id === s.productId);
                  const unit = s.unit || (prod?.unit || '');
                  const qty = s.qty || 0;
                  if (unit === 'm²' || unit === 'm2') {
                    return h('td', { style:{color:'var(--blue)',fontWeight:600,fontSize:12} }, qty.toFixed(2) + ' m²');
                  }
                  // Nếu có variantId, tính từ kích thước viên
                  if (s.variantId && prod && prod.variants) {
                    const vt = prod.variants.find(v => v.id === s.variantId);
                    if (vt && vt.tileW > 0 && vt.tileH > 0) {
                      const m2perPiece = (vt.tileW * vt.tileH) / 10000;
                      const totalM2 = qty * m2perPiece;
                      return h('td', { style:{color:'var(--blue)',fontWeight:600,fontSize:12} },
                        h('div', {}, totalM2.toFixed(2) + ' m²'),
                        h('div', { style:{fontSize:10,color:'var(--text3)'} }, qty + ' viên · ' + vt.tileW+'×'+vt.tileH+(vt.tileThickness?'×'+vt.tileThickness:'')+' cm')
                      );
                    }
                  }
                  // Nếu đơn vị là viên và sản phẩm có 1 variant
                  if ((unit === 'viên' || unit === 'tấm') && prod && prod.variants && prod.variants.length === 1) {
                    const vt = prod.variants[0];
                    if (vt.tileW > 0 && vt.tileH > 0) {
                      const m2perPiece = (vt.tileW * vt.tileH) / 10000;
                      return h('td', { style:{color:'var(--blue)',fontWeight:600,fontSize:12} }, (qty * m2perPiece).toFixed(2) + ' m²');
                    }
                  }
                  return h('td', { style:{color:'var(--text3)',fontSize:11} }, '—');
                })(),
                h('td', { style:{color:'var(--green)'} }, fmt(s.paid)+'đ'),
                h('td', {className:'amount-neg'}, s.status==='debt' ? fmt(s.total-s.paid)+'đ' : '—'),
                isAdmin && (() => {
                  // Tính % LN: (giá bán - giá vốn) / giá vốn
                  const imp = [...S.imports].filter(i => i.productId === s.productId && i.date <= s.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
                  const buyP = imp ? (imp.unitPrice||0) : (S.products.find(p=>p.id===s.productId)?.buyPrice||0);
                  const sellP = s.unitPrice||0;
                  if (!buyP || !sellP) return h('td', {style:{color:'var(--text3)'}}, '—');
                  const pctVal = Math.round((sellP - buyP) / buyP * 100);
                  const profitPerUnit = sellP - buyP;
                  const totalProfit = profitPerUnit * (s.qty || 1);
                  const col = pctVal >= 0 ? 'var(--green)' : 'var(--red)';
                  return h('td', {},
                    h('span', {className:'badge', style:{background: pctVal>=0?'rgba(76,175,125,.15)':'rgba(224,92,92,.15)', color:col, border:'1px solid '+(pctVal>=0?'rgba(76,175,125,.3)':'rgba(224,92,92,.3)'), fontWeight:700}}, (pctVal>=0?'+':'')+pctVal+'%'),
                    h('div', {style:{fontSize:10,color:col,marginTop:3,fontWeight:600}}, (totalProfit>=0?'+':'')+fmt(Math.round(totalProfit))+'đ')
                  );
                })(),
                h('td', {}, h('span', {className:'badge badge-'+(s.status==='done'?'green':'red')}, s.status==='done'?'Xong':'Nợ')),
                h('td', {}, h('div', {style:{display:'flex',gap:4}},
                  h('button', {
                    className:'btn btn-xs', style:{background:'var(--blue)',color:'#fff',border:'none'},
                    onClick: () => openSaleEdit(s, rebuild)
                  }, '✏️ Sửa'),
                  s.status==='debt' && h('button', {
                    className:'btn btn-xs', style:{background:'var(--green)',color:'#fff',border:'none'},
                    onClick: () => { S.sales=S.sales.map(x=>x.id===s.id?{...x,paid:x.total,status:'done',_updated:new Date().toISOString()}:x); save('sales'); toast('Đã thu hết nợ','success'); rebuild(); }
                  }, '✓ Thu'),
                  s.qty>0 && h('button', {
                    className:'btn btn-xs', style:{background:'var(--amber)',color:'#fff',border:'none'},
                    onClick: () => openReturnFromSale(s, rebuild)
                  }, '↩️ Trả'),
                  h('button', {
                    className:'btn btn-ghost btn-xs',
                    onClick: () => {
                      // Kiểm tra phiếu trả hàng liên kết với đơn này
                      const linkedReturns = (S.returns || []).filter(r => r.saleId === s.id);
                      const linkedLogs    = (S.paymentlogs || []).filter(l => l.refId === s.id && l.type === 'customer');
                      let confirmMsg = 'Xoá đơn hàng của "' + s.customer + '"?';
                      if (linkedReturns.length > 0) {
                        confirmMsg += '\n\n⚠️ Đơn này có ' + linkedReturns.length + ' phiếu trả hàng liên kết → sẽ bị xoá theo để tránh sai tồn kho.';
                        confirmMsg += '\n(Hàng trả đã được cộng kho khi tạo phiếu → sẽ trừ lại khi xoá phiếu trả)';
                      }
                      if (linkedLogs.length > 0) {
                        confirmMsg += '\n\n📋 ' + linkedLogs.length + ' lịch sử thanh toán của đơn cũng sẽ bị xoá.';
                      }
                      S.confirm = {
                        msg: confirmMsg,
                        onYes: () => {
                          // FIX race condition: soft-delete đơn bán LÊN CLOUD TRƯỚC
                          // để khi cloud listener nhận lại snapshot dtn_sales, sale này
                          // đã có _deleted=true → applyLedgerToStock bỏ qua → không trừ kho thêm.
                          // Sau đó mới save product (với stock đã hoàn + _stockTx vẫn GIỮ s.id).
                          softDelete('sales', s.id, () => {});

                          // 1. Hoàn kho: hoàn SL còn lại trong đơn + SL phiếu trả liên kết (để bù trừ bước 2)
                          // Bước 2 sẽ trừ lại phần đã cộng khi tạo phiếu trả → net = hoàn đúng qty gốc bán
                          const totalReturnQty = linkedReturns.reduce((a, r) => a + (r.returnQty || 0), 0);
                          const qtyToRestore = s.qty + totalReturnQty; // qty gốc = qty còn lại + phần đã trả
                          if (qtyToRestore > 0) {
                            S.products = S.products.map(p => {
                              if (p.id !== s.productId) return p;
                              const newStock = (parseFloat(p.stock)||0) + qtyToRestore;
                              const newVariants = (p.variants||[]).map(vt => {
                                if (!s.variantId || vt.id !== s.variantId) return vt;
                                const ppm2=(vt.tileW>0&&vt.tileH>0)?10000/(vt.tileW*vt.tileH):0;
                                const newM2=(vt.stockM2||0)+qtyToRestore;
                                return {...vt, stockM2:newM2, stockPieces:ppm2>0?Math.round(newM2*ppm2):(vt.stockPieces||0)+Math.round(qtyToRestore*(ppm2||0))};
                              });
                              // FIX: GIỮ s.id trong _stockTx (không xoá ra) — đây là tombstone
                              // ngăn applyLedgerToStock trừ lại nếu thiết bị khác hoặc cloud
                              // listener nhận sale này trước khi nhận product đã hoàn kho.
                              // _stockTx chứa id đã-xử-lý, sale đã deleted nên không bao giờ
                              // bị applyLedger áp lại (filter !_deleted) → an toàn giữ lại.
                              return {...p, stock:newStock, variants:newVariants, _updated: new Date().toISOString()};
                            });
                          }

                          // 2. Xử lý phiếu trả hàng liên kết: trừ lại kho (hoàn kho đã cộng khi trả) rồi xoá phiếu
                          if (linkedReturns.length > 0) {
                            linkedReturns.forEach(r => {
                              S.products = S.products.map(p => {
                                if (p.id !== r.productId) return p;
                                const newStock = (parseFloat(p.stock)||0) - (parseFloat(r.returnQty)||0);
                                // FIX: GIỮ r.id trong _stockTx — tombstone ngăn double-apply
                                return {...p, stock: newStock, _updated: new Date().toISOString()};
                              });
                            });
                            // Soft-delete phiếu trả liên kết
                            const _now = new Date().toISOString();
                            S.returns = (S.returns || []).map(r => r.saleId !== s.id ? r : { ...r, _deleted: true, _updated: _now });
                            save('returns');
                            setTimeout(() => { S.returns = (S.returns||[]).filter(r=>!r._deleted); DB.set('dtn_returns', S.returns); }, 600);
                          }

                          // 3. Soft-delete paymentlogs của đơn này
                          if (linkedLogs.length > 0) {
                            const _now2 = new Date().toISOString();
                            S.paymentlogs = (S.paymentlogs || []).map(l => (l.refId === s.id && l.type === 'customer') ? { ...l, _deleted: true, _updated: _now2 } : l);
                            save('paymentlogs');
                            setTimeout(() => { S.paymentlogs = (S.paymentlogs||[]).filter(l=>!l._deleted); DB.set('dtn_paymentlogs', S.paymentlogs); }, 600);
                          }

                          // 4. Save product (softDelete đã chạy ở bước đầu)
                          save('products');

                          const msg = linkedReturns.length > 0
                            ? `Đã xoá đơn + ${linkedReturns.length} phiếu trả hàng liên kết`
                            : 'Đã xoá đơn hàng';
                          toast(msg, 'info');
                          rebuild();
                        }
                      };
                      render();
                    }
                  }, '🗑')
                ))
      );
    }

              h('table', { style: { width:'100%', borderCollapse:'collapse', fontSize:13, minWidth:700 } },
                h('thead', {}, h('tr', {},
                  th('Ngày'), th('Khách hàng'), th('Sản phẩm'), th('Tạm tính'), th('VAT HH'), th('Phí VC'), th('VAT VC'), th('Tổng'), isAdmin && th('Số m²'), th('Đã thu'), th('Còn nợ'), isAdmin && th('% LN'), th('TT'), th('')
                )),
                h('tbody', {}, ...grp.items.map(s => renderSRow(s)))
              )
            )
          );
        })
      );
    }

    const _curSaleViewMode = _saleViewMode.get();

    wrap.innerHTML = '';
    const saleViewToggle = h('div', { style: { display:'flex', gap:6 } },
      h('button', { className:'btn btn-sm' + (_curSaleViewMode === 'day' ? ' btn-primary' : ''), onClick: () => { _saleViewMode.set('day'); rebuild(); } }, '📅 Theo ngày'),
      h('button', { className:'btn btn-sm' + (_curSaleViewMode === 'list' ? ' btn-primary' : ''), onClick: () => { _saleViewMode.set('list'); curPage = 0; rebuild(); } }, '☰ Danh sách')
    );

    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, 'Bán Hàng'),
          h('div', { className: 'page-sub' },
            mySales.length + ' đơn · DT: ' + fmt(totalRev) + 'đ · Nợ: ' + fmt(totalDebt) + 'đ' +
            (totalShip > 0 ? ' · VC giao: ' + fmt(totalShip) + 'đ' : ''))
        ),
        h('div', { style: { display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' } },
          saleViewToggle,
          h('button', { className: 'btn btn-primary', onClick: () => openSale(rebuild) }, '+ Tạo đơn hàng')
        )
      ),
      !isAdmin && h('div', { style: { background:'rgba(91,143,232,.1)', border:'1px solid rgba(91,143,232,.3)', borderRadius:'var(--r2)', padding:'9px 14px', marginBottom:14, fontSize:12, color:'var(--blue)' } },
        '👷 Bạn đang xem đơn hàng của tài khoản: <b>' + (currentUser?.displayName || currentUser?.username || '') + '</b> · Chỉ hiển thị đơn do bạn tạo'
      ),
      catalogueSection
    ));
    // FIX: thêm persistent search bar (không bị xóa bởi wrap.innerHTML = '')
    wrap.appendChild(_salesSearchRow);
    const _listContainer = document.createElement('div');
    wrap.appendChild(_listContainer);
    _listContainer.appendChild(_curSaleViewMode === 'day' ? renderSaleDayView() : renderSaleListView());
  };
  rebuild();
  return wrap;
}

// ══════════════════════════════════════════════════════════════════
//  SỬA ĐƠN BÁN — một dòng đơn (openSaleEdit)
//
//  CHỈ sửa các trường KHÔNG ảnh hưởng tồn kho: giá bán, VAT, phí vận
//  chuyển, thông tin khách, ngày, ghi chú, đã thanh toán. Số lượng /
//  sản phẩm / quy cách GIỮ NGUYÊN (hiển thị chỉ-đọc) — muốn đổi thì Xoá
//  rồi tạo lại. KHÔNG đụng S.products / tồn kho. Tính lại tổng + trạng
//  thái đúng công thức openSale. Đã thanh toán bị khoá nếu đơn đã có
//  lịch sử thu nợ (paymentlogs) để không lệch số liệu thu.
// ══════════════════════════════════════════════════════════════════
function openSaleEdit(s, rebuild) {
  const SALE_SHIP_UNITS = ['chuyến','tấn','cái','thùng','kg','m²','tấm'];
  const cur = (S.sales || []).find(x => x.id === s.id);
  if (!cur) { toast('Không tìm thấy đơn (có thể đã bị xoá).', 'error'); return; }
  const hasLogs = (S.paymentlogs || []).some(l => l.refId === cur.id && l.type === 'customer');
  const qty = parseFloat(cur.qty) || 0;

  const mk = (type, val, ph) => { const e = document.createElement('input'); e.className = 'form-input'; e.type = type; if (ph) e.placeholder = ph; if (type === 'number') e.step = 'any'; e.value = (val == null ? '' : val); return e; };
  const fDate  = mk('date', cur.date || today());
  const fCust  = mk('text', cur.customer || '', 'Tên khách');
  const fPhone = mk('tel',  cur.phone || '', 'SĐT');
  const fAddr  = mk('text', cur.address || '', 'Địa chỉ');
  const fNote  = mk('text', cur.note || '', 'Ghi chú');
  const fPrice = mk('number', cur.unitPrice || 0);
  const fVat   = mk('number', cur.vatRate || 0);
  const fShipPrice = mk('number', cur.shipUnitPrice || 0, 'Đơn giá VC (chưa VAT)');
  const fShipQty   = mk('number', cur.shipQty || '', 'SL');
  const fShipVat   = mk('number', cur.shipVatRate || 0, 'VAT VC %');
  const fPaid  = mk('number', cur.paid || 0); if (hasLogs) fPaid.disabled = true;

  const fShipUnit = document.createElement('select'); fShipUnit.className = 'form-input';
  SALE_SHIP_UNITS.forEach(u => { const o = document.createElement('option'); o.value = u; o.textContent = u; if (u === (cur.shipUnit || 'chuyến')) o.selected = true; fShipUnit.appendChild(o); });

  const fShipForCust = document.createElement('input'); fShipForCust.type = 'checkbox'; fShipForCust.checked = !!cur.shipForCustomer;

  const preview = document.createElement('div');
  preview.style.cssText = 'background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;font-size:13px;line-height:1.7';

  const compute = () => {
    const price = parseFloat(fPrice.value) || 0;
    const vat = parseFloat(fVat.value) || 0;
    const sub = qty * price;
    const vatAmt = Math.round(sub * vat / 100);
    const goods = sub + vatAmt;
    const shipUnit = fShipUnit.value;
    const sQty = shipUnit === 'chuyến' ? 1 : (parseFloat(fShipQty.value) || 0);
    const sNet = Math.round((parseFloat(fShipPrice.value) || 0) * sQty);
    const svRate = parseFloat(fShipVat.value) || 0;
    const sVat = svRate > 0 ? Math.round(sNet * svRate / 100) : 0;
    const shipFee = sNet + sVat;
    const forCust = fShipForCust.checked;
    const total = goods + (forCust ? shipFee : 0);
    const paid = hasLogs ? (parseFloat(cur.paid) || 0) : (parseFloat(fPaid.value) || 0);
    const debt = Math.max(0, total - paid);
    return { sub, vatAmt, goods, shipFee, forCust, total, paid, debt, sQty, status: (paid >= total && total > 0) ? 'done' : 'debt' };
  };
  const renderPreview = () => {
    const c = compute();
    preview.innerHTML =
      '📋 Doanh thu (chưa VAT): <b>' + fmt(c.sub) + 'đ</b><br>' +
      (c.vatAmt > 0 ? '🏛️ VAT hàng hoá: +' + fmt(c.vatAmt) + 'đ<br>' : '') +
      '🚚 Phí VC (gồm VAT): <b>' + fmt(c.shipFee) + 'đ</b> ' + (c.forCust ? '<span style="color:var(--accent)">(tính cho khách)</span>' : '<span style="color:var(--text3)">(cửa hàng chịu)</span>') + '<br>' +
      '💰 Tổng tiền: <b style="color:var(--accent)">' + fmt(c.total) + 'đ</b><br>' +
      '✅ Đã thanh toán: ' + fmt(c.paid) + 'đ' + (c.debt > 0 ? ' · <span style="color:var(--red)">⚠️ Còn nợ ' + fmt(c.debt) + 'đ</span>' : ' · <span style="color:var(--green)">Đã đủ</span>');
  };
  [fPrice, fVat, fShipPrice, fShipQty, fShipVat, fPaid].forEach(e => e.addEventListener('input', renderPreview));
  fShipUnit.addEventListener('change', renderPreview);
  fShipForCust.addEventListener('change', renderPreview);
  renderPreview();

  const fg = (label, el) => h('div', { className: 'form-group' }, h('label', { className: 'form-label' }, label), el);

  S.modal = {
    title: '✏️ Sửa đơn: ' + (cur.productName || ''),
    content: h('div', {},
      h('div', { style: { background: 'rgba(91,143,232,.08)', border: '1px solid rgba(91,143,232,.25)', borderRadius: 'var(--r2)', padding: '10px 14px', fontSize: 12, color: 'var(--blue)', marginBottom: 14 } },
        '🔒 Số lượng (' + fmtQty(qty) + ' ' + (cur.unit || '') + '), sản phẩm và quy cách KHÔNG sửa ở đây (giữ đúng tồn kho). Muốn đổi → Xoá đơn rồi tạo lại.'),
      h('div', { className: 'fg fg2' },
        fg('Ngày', fDate),
        fg('Khách hàng', fCust),
        fg('SĐT', fPhone),
        fg('Địa chỉ', fAddr),
        fg('Đơn giá bán', fPrice),
        fg('VAT hàng hoá (%)', fVat),
        fg('Phí VC — đơn giá (chưa VAT)', fShipPrice),
        fg('Phí VC — đơn vị', fShipUnit),
        fg('Phí VC — số lượng', fShipQty),
        fg('Phí VC — VAT (%)', fShipVat),
        fg('Đã thanh toán' + (hasLogs ? ' (đã khoá — đơn có lịch sử thu nợ)' : ''), fPaid),
        h('div', { className: 'form-group' }, h('label', { className: 'form-label' }, 'Tính VC cho khách'),
          h('label', { style: { display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 13, padding: '8px 0' } }, fShipForCust, h('span', {}, 'Tick = in lên hoá đơn & cộng vào tiền khách trả')))
      ),
      fg('Ghi chú', fNote),
      h('div', { style: { marginTop: 6 } }, preview)
    ),
    footer: [
      h('button', { className: 'btn', onClick: () => { S.modal = null; render(); } }, 'Huỷ'),
      h('button', { className: 'btn btn-primary', onClick: () => {
        const price = parseFloat(fPrice.value) || 0;
        if (price < 0) { toast('Đơn giá không hợp lệ', 'error'); return; }
        const c = compute();
        const now = new Date().toISOString();
        S.sales = (S.sales || []).map(x => x.id !== cur.id ? x : {
          ...x,
          date: fDate.value || x.date,
          customer: fCust.value.trim(),
          phone: fPhone.value.trim(),
          address: fAddr.value.trim(),
          note: fNote.value.trim(),
          unitPrice: price,
          vatRate: parseFloat(fVat.value) || 0,
          subTotal: c.sub,
          vatAmt: c.vatAmt,
          total: c.total,
          paid: c.paid,
          status: c.status,
          shipUnitPrice: parseFloat(fShipPrice.value) || 0,
          shipUnit: fShipUnit.value,
          shipQty: c.sQty,
          shipVatRate: parseFloat(fShipVat.value) || 0,
          shipFee: c.shipFee,
          shipForCustomer: fShipForCust.checked,
          _updated: now
        });
        save('sales');
        toast('✅ Đã cập nhật đơn bán (tồn kho không đổi).', 'success');
        S.modal = null;
        rebuild(); render();
      } }, '✅ Lưu')
    ]
  };
  render();
}

function openSale(rebuild, preselectedProduct) {
  const { products, settings } = S;
  const defaultVat = 0; // Mặc định không VAT — tick checkbox để bật VAT
  const SALE_SHIP_UNITS = ['chuyến','tấn','cái','thùng','kg','m²','tấm'];

  // ── Shared fields ─────────────────────────────────────────────
  const inpDate  = mkInput('date','',today(),v=>{});
  const inpCust  = mkAutocomplete('👤 Tên khách hàng', '',
    q => {
      const all = [...new Set((S.sales || []).map(s => s.customer).filter(Boolean))].sort();
      return q ? all.filter(c => c.toLowerCase().includes(q.toLowerCase())) : all;
    },
    () => {});
  const inpPhone = mkInput('tel','0909...','',v=>{});
  const inpAddr  = mkInput('text','Địa chỉ giao hàng...','',v=>{});
  const inpNote  = mkInput('text','Ghi chú...','',v=>{});
  const inpPaid  = mkInput('number','VD: 0','',v=>updateSum());

  // ── Nhân viên phụ trách (chỉ admin mới chọn được) ────────────
  const _saleCurrentUser = AUTH.currentUser();
  const _saleIsAdminForm = _saleCurrentUser && _saleCurrentUser.role === 'admin';
  let selStaffId = _saleCurrentUser?.username || null;
  let selStaffName = _saleCurrentUser?.displayName || _saleCurrentUser?.username || null;
  let staffFieldEl = null;
  if (_saleIsAdminForm) {
    const staffAccts = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
    const staffOpts = [
      { value: '__admin__', label: '👑 Admin ('+_saleCurrentUser.username+')' },
      ...staffAccts.filter(s=>s.active).map(s=>({ value: s.username, label: '👤 '+( s.displayName||s.username) }))
    ];
    staffFieldEl = mkSelect(staffOpts, '__admin__', v => {
      if (v === '__admin__') { selStaffId = _saleCurrentUser.username; selStaffName = _saleCurrentUser.displayName || _saleCurrentUser.username; }
      else { const found = staffAccts.find(s=>s.username===v); selStaffId = v; selStaffName = found?.displayName || v; }
    });
  }

  // ── Phí vận chuyển ───────────────────────────────────────────
  const inpShipFee  = mkInput('number','Đơn giá VC (chưa VAT)','',v=>updateSum());
  const inpShipQty  = mkInput('number','Số lượng','',v=>updateSum());
  const selShipUnit = mkSelect(SALE_SHIP_UNITS.map(u=>({value:u,label:u})), 'chuyến', v=>{ updateShipQtyVisible(); updateSum(); });
  const vatShipRow  = mkVatRow(0, () => updateSum());

  // ── Tick: Tính vận chuyển cho khách ─────────────────────────
  // Mặc định = false → VC khấu hao vào lợi nhuận cửa hàng, KHÔNG in lên hoá đơn
  // Tick = true      → VC tính cho khách, in lên hoá đơn, KHÔNG trừ LN cửa hàng
  let shipForCustomer = false;
  const shipTickWrap = document.createElement('div');
  shipTickWrap.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border2);margin-bottom:6px;cursor:pointer;user-select:none;-webkit-user-select:none';
  function rebuildShipTick() {
    shipTickWrap.innerHTML = '';
    // Checkbox giả
    const box = document.createElement('div');
    box.style.cssText = `width:20px;height:20px;border-radius:5px;border:2px solid ${shipForCustomer?'var(--accent)':'var(--border2)'};background:${shipForCustomer?'var(--accent)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s`;
    if (shipForCustomer) { box.innerHTML = '<span style="color:#0f1117;font-size:13px;font-weight:900">✓</span>'; }
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:12px;font-weight:600;flex:1';
    lbl.innerHTML = shipForCustomer
      ? '<span style="color:var(--accent)">🚚 Tính VC cho khách</span> <span style="font-size:11px;font-weight:400;color:var(--text2)">→ In lên hoá đơn · Không trừ LN cửa hàng</span>'
      : '<span style="color:var(--text2)">🏠 VC cửa hàng tự chịu</span> <span style="font-size:11px;font-weight:400;color:var(--text3)">→ Khấu hao vào LN · Không in lên hoá đơn khách</span>';
    shipTickWrap.appendChild(box);
    shipTickWrap.appendChild(lbl);
  }
  rebuildShipTick();
  shipTickWrap.addEventListener('click', () => { shipForCustomer = !shipForCustomer; rebuildShipTick(); updateSum(); });

  function updateShipQtyVisible() {
    const showQty = selShipUnit.value !== 'chuyến';
    _sqWrap.style.display = showQty ? '' : 'none';
    if (!showQty) inpShipQty.value = '';
  }
  const shipFeeWrap = document.createElement('div');
  shipFeeWrap.style.cssText='display:flex;flex-direction:column;gap:6px';
  // Row tick
  shipFeeWrap.appendChild(shipTickWrap);
  // Row nhập phí
  const shipInputRow = document.createElement('div');
  shipInputRow.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  shipInputRow.appendChild(inpShipFee);
  const _sl2=document.createElement('span'); _sl2.style.cssText='font-size:12px;color:var(--text2);white-space:nowrap'; _sl2.textContent='/';
  shipInputRow.appendChild(_sl2); shipInputRow.appendChild(selShipUnit);
  const _sqWrap=document.createElement('div'); _sqWrap.style.cssText='display:flex;align-items:center;gap:6px';
  const _sqLbl2=document.createElement('span'); _sqLbl2.style.cssText='font-size:12px;color:var(--text2);white-space:nowrap'; _sqLbl2.textContent='×';
  _sqWrap.appendChild(_sqLbl2); _sqWrap.appendChild(inpShipQty);
  shipInputRow.appendChild(_sqWrap);
  shipFeeWrap.appendChild(shipInputRow);
  updateShipQtyVisible();

  // ── Danh sách mặt hàng ───────────────────────────────────────
  let saleItems = [{ id: uid(), productId: preselectedProduct ? preselectedProduct.id : '', variantId:'', qty:'', price: preselectedProduct ? (preselectedProduct.sellPrice||'') : '', vatRate: defaultVat }];
  const itemsContainer = document.createElement('div');
  itemsContainer.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-bottom:4px';

  // ── Summary box ───────────────────────────────────────────────
  const sumEl = document.createElement('div');
  sumEl.className='sum-box fg-full'; sumEl.style.display='none';

  function updateSum() {
    const shipUnit = selShipUnit.value;
    const shipQtyVal = shipUnit === 'chuyến' ? 1 : (parseFloat(inpShipQty.value)||0);
    const shipUnitPrice = parseFloat(inpShipFee.value)||0;
    const shipVat = vatShipRow._getVal();
    const shipNetAmt = Math.round(shipUnitPrice * shipQtyVal);
    const shipVatAmt = shipVat > 0 ? Math.round(shipNetAmt * shipVat / 100) : 0;
    const shipFeeTotal = shipNetAmt + shipVatAmt;
    const paid = parseFloat(inpPaid.value)||0;

    let totalSub=0, totalVatAmt=0, totalGoods=0;
    saleItems.forEach(it => {
      const qty = parseFloat(it.qty)||0, price = parseFloat(it.price)||0, vat = parseFloat(it.vatRate)||0;
      const sub = qty*price;
      const va = Math.round(sub*vat/100);
      totalSub += sub; totalVatAmt += va; totalGoods += sub+va;
    });
    const total = totalGoods + shipFeeTotal;
    const remaining = Math.max(0, total - paid);

    if (totalSub > 0 || shipNetAmt > 0) {
      sumEl.style.display='';
      let html='';
      if (saleItems.length > 1) {
        html+='<div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">📋 Tổng '+saleItems.length+' mặt hàng</div>';
        saleItems.forEach((it,idx) => {
          const prod = products.find(p=>p.id===it.productId);
          const qty=parseFloat(it.qty)||0, price=parseFloat(it.price)||0, vat=parseFloat(it.vatRate)||0;
          if (qty>0&&price>0) {
            const sub=qty*price, va=Math.round(sub*vat/100);
            html+='<div class="sum-row" style="font-size:12px"><span style="color:var(--text)">'+(prod?prod.name:'Mặt hàng '+(idx+1))+':</span><span>'+fmt(sub+va)+'đ'+(vat>0?' <span style="color:var(--blue);font-size:10px">(VAT '+vat+'%)</span>':'')+'</span></div>';
          }
        });
        html+='<div style="border-top:1px solid var(--border);margin:6px 0"></div>';
      }
      html+='<div class="sum-row"><span>📋 Doanh thu thuần (chưa VAT):</span><span style="color:var(--blue);font-weight:700">'+fmt(totalSub)+'đ</span></div>';
      if(totalVatAmt>0) html+='<div class="sum-row"><span>🏛️ Tổng VAT đầu ra:</span><span style="color:var(--amber)">+'+fmt(totalVatAmt)+'đ</span></div>';
      if(shipNetAmt>0){
        html+='<div class="sum-row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">';
        if(shipForCustomer){
          html+='<span>🚚 VC tính cho khách:</span><span style="color:var(--accent);font-weight:600">'+fmt(shipNetAmt)+'đ</span></div>';
          if(shipVat>0) html+='<div class="sum-row"><span>🏛️ VAT vận chuyển ('+shipVat+'%):</span><span style="color:var(--blue)">+'+fmt(shipVatAmt)+'đ</span></div>';
          html+='<div class="sum-row" style="font-size:11px;padding:4px 8px;background:rgba(201,168,76,.07);border-radius:5px;margin-top:4px"><span style="color:var(--accent)">✅ VC sẽ in lên hoá đơn khách · Không tính vào LN cửa hàng</span><span></span></div>';
        } else {
          html+='<span>🏠 VC cửa hàng tự chịu:</span><span style="color:var(--text2);font-weight:600">'+fmt(shipNetAmt)+'đ</span></div>';
          if(shipVat>0) html+='<div class="sum-row"><span>🏛️ VAT vận chuyển ('+shipVat+'%):</span><span style="color:var(--blue)">+'+fmt(shipVatAmt)+'đ</span></div>';
          html+='<div class="sum-row" style="font-size:11px;padding:4px 8px;background:rgba(91,143,232,.07);border-radius:5px;margin-top:4px"><span style="color:var(--text3)">🏠 VC khấu hao vào LN cửa hàng · Không in lên hoá đơn khách</span><span></span></div>';
        }
      }
      // Tổng khách trả: nếu VC cho khách thì cộng vào, ngược lại không cộng
      const totalForCustomer = shipForCustomer ? total : totalGoods;
      const remainingForCustomer = Math.max(0, totalForCustomer - paid);
      html+='<div class="sum-total"><span>💰 Tổng khách trả:</span><span>'+fmt(totalForCustomer)+'đ</span></div>';
      if(paid>0) html+='<div class="sum-paid"><span>✅ Đã thanh toán:</span><span>'+fmt(paid)+'đ</span></div>';
      if(remainingForCustomer>0) html+='<div class="sum-debt"><span>⚠️ Còn nợ:</span><span>'+fmt(remainingForCustomer)+'đ</span></div>';
      sumEl.innerHTML=html;
    } else { sumEl.style.display='none'; }
  }

  // ── Tạo 1 dòng mặt hàng ──────────────────────────────────────
  function makeSaleItemRow(it, idx) {
    const rowEl = document.createElement('div');
    rowEl.style.cssText='background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:14px;position:relative';

    const rowHeader = document.createElement('div');
    rowHeader.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
    const rowTitle = document.createElement('div');
    rowTitle.style.cssText='font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px';
    rowTitle.textContent='🧾 Mặt hàng '+(idx+1);
    rowHeader.appendChild(rowTitle);
    if (saleItems.length > 1) {
      const delBtn = document.createElement('button');
      delBtn.type='button'; delBtn.className='btn btn-danger btn-xs'; delBtn.textContent='✕ Xoá';
      delBtn.onclick = () => { saleItems = saleItems.filter(x=>x.id!==it.id); rebuildItems(); updateSum(); };
      rowHeader.appendChild(delBtn);
    }
    rowEl.appendChild(rowHeader);

    // Sản phẩm + Số lượng
    const grid1 = document.createElement('div');
    grid1.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';

    // Chọn sản phẩm
    const prodGrp = document.createElement('div'); prodGrp.className='form-group';
    const prodLbl = document.createElement('label'); prodLbl.className='form-label'; prodLbl.textContent='Sản phẩm *';
    const selProd = mkSelect(
      [{value:'',label:'— Chọn sản phẩm —'}, ...products.map(p=>({value:p.id,label:(p.sku ? '['+p.sku+'] ' : '')+p.name+' (còn '+fmtQty(p.stock)+' '+p.unit+')'}))],
      it.productId, v => { it.productId=v; const p=products.find(x=>x.id===v); if(p){it.price=p.sellPrice;priceInp.value=p.sellPrice;} it.variantId=''; renderVtSel(p); updateMinHint(); updateSum(); }
    );
    prodGrp.appendChild(prodLbl); prodGrp.appendChild(selProd);
    grid1.appendChild(prodGrp);

    // Số lượng
    const qtyGrp = document.createElement('div'); qtyGrp.className='form-group';
    const qtyLbl = document.createElement('label'); qtyLbl.className='form-label'; qtyLbl.textContent='Số lượng *';
    const qtyInp = mkInput('number','VD: 31.2',it.qty, v=>{it.qty=v; updateSum();});
    qtyGrp.appendChild(qtyLbl); qtyGrp.appendChild(qtyInp);
    grid1.appendChild(qtyGrp);
    rowEl.appendChild(grid1);

    // Đơn giá + VAT
    const grid2 = document.createElement('div');
    grid2.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';

    const priceGrp = document.createElement('div'); priceGrp.className='form-group';
    const priceLbl = document.createElement('label'); priceLbl.className='form-label'; priceLbl.textContent='Đơn giá bán (VNĐ, chưa VAT) *';
    const priceInp = mkInput('number','VD: 2.000.000',it.price, v=>{it.price=v; updateMinHint(); updateSum();});
    priceGrp.appendChild(priceLbl); priceGrp.appendChild(priceInp);

    // Cảnh báo giá bán tối thiểu — chỉ admin mới thấy
    const minHintEl = document.createElement('div'); minHintEl.style.display='none';
    const _saleUser = AUTH.currentUser();
    const _saleIsAdmin = _saleUser && _saleUser.role === 'admin';
    function updateMinHint() {
      if (!_saleIsAdmin) { minHintEl.style.display='none'; return; } // Ẩn với nhân viên
      const pId = selProd.value; if(!pId){minHintEl.style.display='none';return;}
      const prod = products.find(p=>p.id===pId); if(!prod||!prod.buyPrice){minHintEl.style.display='none';return;}
      const buyPrice = parseFloat(prod.buyPrice)||0;
      const relImps = S.imports.filter(im=>im.productId===pId&&(im.shipFee||0)>0&&(im.qty||0)>0);
      let totShip=0,totQty=0; relImps.forEach(im=>{totShip+=(parseFloat(im.shipFee)||0);totQty+=(parseFloat(im.qty)||0);});
      const shipPerUnit = totQty>0 ? totShip/totQty : 0;
      const minSell = Math.ceil(buyPrice+shipPerUnit);
      const curPrice = parseFloat(priceInp.value)||0;
      const isLoss = curPrice>0 && curPrice<minSell;
      minHintEl.style.display='';
      if(isLoss){
        minHintEl.style.cssText='margin-top:6px;padding:8px 12px;background:rgba(224,92,92,.13);border:1px solid rgba(224,92,92,.4);border-radius:6px;font-size:12px;color:var(--red);line-height:1.7';
        minHintEl.innerHTML='⛔ <b>CẢNH BÁO BÁN LỖ!</b> Giá nhập: '+fmt(buyPrice)+'đ'+( shipPerUnit>0?' + VC: '+fmt(Math.round(shipPerUnit))+'đ':'')+' → Min: <b style="color:var(--amber)">'+fmt(minSell)+'đ</b>';
      } else {
        minHintEl.style.cssText='margin-top:6px;padding:7px 12px;background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.25);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.6';
        minHintEl.innerHTML='💡 Giá nhập: '+fmt(buyPrice)+'đ → Min: <b style="color:var(--accent)">'+fmt(minSell)+'đ</b>'+(curPrice>0?' · Lãi: <b style="color:var(--green)">+'+fmt(curPrice-minSell)+'đ</b>':'');
      }
    }
    priceGrp.appendChild(minHintEl);
    grid2.appendChild(priceGrp);

    const vatGrp = document.createElement('div'); vatGrp.className='form-group';
    const vatLbl = document.createElement('label'); vatLbl.className='form-label'; vatLbl.textContent='VAT hàng hoá (0–20%)';
    const vatRow = mkVatRow(it.vatRate||defaultVat, v=>{it.vatRate=v; updateSum();});
    vatGrp.appendChild(vatLbl); vatGrp.appendChild(vatRow);
    grid2.appendChild(vatGrp);
    rowEl.appendChild(grid2);

    // Variant selector
    const vtEl = document.createElement('div'); vtEl.style.display='none'; vtEl.style.marginBottom='10px';
    function renderVtSel(p) {
      vtEl.innerHTML=''; it.variantId='';
      if(!p||!p.variants||p.variants.length===0){vtEl.style.display='none';return;}
      vtEl.style.display='';
      const vlbl=document.createElement('label'); vlbl.className='form-label';
      vlbl.innerHTML='📐 Chọn quy cách <span style="color:var(--amber);font-size:10px">(quan trọng — trừ đúng tồn kho)</span>';
      const vsel=document.createElement('select'); vsel.className='form-input'; vsel.style.borderColor='var(--amber)';
      const defOpt=document.createElement('option'); defOpt.value=''; defOpt.textContent='— Chọn quy cách —'; vsel.appendChild(defOpt);
      p.variants.forEach(vt=>{
        const opt=document.createElement('option'); opt.value=vt.id;
        const ppm2=(vt.tileW>0&&vt.tileH>0)?(10000/(vt.tileW*vt.tileH)).toFixed(1):'?';
        const m2=vt.stockM2||0;
        const icon=m2<=0?'⛔':m2<=5?'⚠️':'✅';
        opt.textContent=icon+' '+vt.tileW+'×'+vt.tileH+(vt.tileThickness?'×'+vt.tileThickness:'')+' cm — '+fmt(vt.sellPrice||p.sellPrice||0)+'đ/m² — Tồn: '+m2.toFixed(1)+'m²/'+(vt.stockPieces||0)+' viên';
        vsel.appendChild(opt);
      });
      // Grid tồn kho trực quan
      const vtGrid=document.createElement('div');
      vtGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px';
      p.variants.forEach(vt=>{
        const m2=vt.stockM2||0;
        const col=m2<=0?'var(--red)':m2<=5?'var(--amber)':'var(--green)';
        const bdr=m2<=0?'rgba(224,92,92,.4)':m2<=5?'rgba(232,165,58,.4)':'rgba(76,175,125,.4)';
        const box=document.createElement('div');
        box.style.cssText=`background:var(--bg4);border:1.5px solid ${bdr};border-radius:8px;padding:8px;text-align:center;cursor:pointer;transition:all .15s`;
        box.innerHTML=`<div style="font-weight:700;color:var(--accent);font-size:12px">${escHtml(vt.tileW)}×${escHtml(vt.tileH)}${vt.tileThickness?'×'+escHtml(vt.tileThickness):''} cm</div><div style="color:${col};font-weight:700;font-size:16px;margin:2px 0">${m2.toFixed(1)} m²</div><div style="color:var(--text3);font-size:10px">${vt.stockPieces||0} viên</div>`;
        box.onclick=()=>{vsel.value=vt.id;vsel.dispatchEvent(new Event('change'));};
        vtGrid.appendChild(box);
      });
      vsel.addEventListener('change',()=>{
        it.variantId=vsel.value;
        const sv=p.variants.find(vt=>vt.id===vsel.value);
        if(sv&&sv.sellPrice){priceInp.value=sv.sellPrice;it.price=sv.sellPrice;}
        else{priceInp.value=p.sellPrice;it.price=p.sellPrice;}
        vsel.style.borderColor=vsel.value?'var(--green)':'var(--amber)';
        updateMinHint(); updateSum();
      });
      vtEl.appendChild(vlbl); vtEl.appendChild(vsel); vtEl.appendChild(vtGrid);
    }
    if(it.productId){const initP=products.find(x=>x.id===it.productId); if(initP) renderVtSel(initP);}
    rowEl.appendChild(vtEl);
    return rowEl;
  }

  function rebuildItems() {
    itemsContainer.innerHTML='';
    saleItems.forEach((it,idx)=>itemsContainer.appendChild(makeSaleItemRow(it,idx)));
    updateSum();
  }
  rebuildItems();

  const addItemBtn = document.createElement('button');
  addItemBtn.type='button'; addItemBtn.className='btn';
  addItemBtn.style.cssText='width:100%;background:rgba(201,168,76,.1);border:1px dashed rgba(201,168,76,.5);color:var(--accent);font-weight:700;margin-bottom:4px';
  addItemBtn.innerHTML='➕ Thêm mặt hàng';
  addItemBtn.onclick=()=>{
    saleItems.push({id:uid(),productId:'',variantId:'',qty:'',price:'',vatRate:defaultVat});
    rebuildItems(); updateSum();
  };

  const itemsWrap = document.createElement('div');
  itemsWrap.className='form-group fg-full';
  const itemsHdr = document.createElement('div');
  itemsHdr.style.cssText='font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px';
  itemsHdr.innerHTML='📋 Danh sách mặt hàng <span style="font-size:10px;font-weight:400;color:var(--text3)">(có thể thêm nhiều sản phẩm cùng lúc)</span>';
  itemsWrap.appendChild(itemsHdr);

  // ── Ô tìm kiếm sản phẩm nhanh ─────────────────────────────────
  const quickSearchWrap = document.createElement('div');
  quickSearchWrap.style.cssText = 'position:relative;margin-bottom:10px';
  const quickSearchInp = document.createElement('input');
  quickSearchInp.type = 'text';
  quickSearchInp.className = 'form-input';
  quickSearchInp.placeholder = '⚡ Tìm nhanh sản phẩm để thêm vào đơn... (gõ tên, SKU)';
  quickSearchInp.autocomplete = 'off';
  quickSearchInp.style.cssText = 'width:100%;background:rgba(201,168,76,.07);border-color:rgba(201,168,76,.35)';
  const quickDrop = document.createElement('div');
  quickDrop.style.cssText = 'position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg3);border:1px solid var(--accent);border-radius:var(--r2);z-index:9999;max-height:260px;overflow-y:auto;display:none;box-shadow:0 8px 28px rgba(0,0,0,0.55)';
  function quickBuildDrop(q) {
    quickDrop.innerHTML = '';
    if (!q) { quickDrop.style.display = 'none'; return; }
    const matches = products.filter(p =>
      p.name.toLowerCase().includes(q.toLowerCase()) ||
      (p.sku && p.sku.toLowerCase().includes(q.toLowerCase()))
    ).slice(0, 12);
    if (!matches.length) { quickDrop.style.display = 'none'; return; }
    matches.forEach(p => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s';
      row.onmouseenter = () => { row.style.background = 'var(--accent-dim)'; };
      row.onmouseleave = () => { row.style.background = ''; };
      const stock = parseFloat(p.stock) || 0;
      const stockCls = stock > 0 ? (stock < 10 ? 'low' : 'ok') : 'out';
      const stockColor = stock > 0 ? (stock < 10 ? 'var(--amber)' : 'var(--green)') : 'var(--red)';
      row.innerHTML =
        (p.image ? `<img src="${escHtml(p.image)}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;flex-shrink:0;border:1px solid var(--border2)">` : `<div style="width:36px;height:36px;background:var(--bg4);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">💎</div>`) +
        `<div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(p.name)}${p.sku ? ` <span style="font-size:10px;color:var(--text3)">[${escHtml(p.sku)}]</span>` : ''}</div>
          <div style="font-size:11px;color:var(--accent);margin-top:2px">${fmt(p.sellPrice)}đ/${escHtml(p.unit||'')} · <span style="color:${stockColor}">Tồn: ${fmtQty(stock)} ${escHtml(p.unit||'')}</span></div>
        </div>
        <div style="font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap">+ Thêm</div>`;
      row.onmousedown = e => {
        e.preventDefault();
        // Tìm dòng hàng cuối còn trống hoặc thêm dòng mới
        const emptyIdx = saleItems.findIndex(it => !it.productId);
        if (emptyIdx >= 0) {
          saleItems[emptyIdx].productId = p.id;
          saleItems[emptyIdx].price = p.sellPrice || '';
        } else {
          saleItems.push({ id: uid(), productId: p.id, variantId: '', qty: '', price: p.sellPrice || '', vatRate: defaultVat });
        }
        rebuildItems(); updateSum();
        quickSearchInp.value = '';
        quickDrop.style.display = 'none';
        quickSearchInp.focus();
      };
      quickDrop.appendChild(row);
    });
    quickDrop.style.display = 'block';
  }
  quickSearchInp.addEventListener('input', e => quickBuildDrop(e.target.value));
  quickSearchInp.addEventListener('focus', e => { if (e.target.value) quickBuildDrop(e.target.value); });
  quickSearchInp.addEventListener('blur', () => { setTimeout(() => { quickDrop.style.display = 'none'; }, 180); });
  quickSearchInp.addEventListener('keydown', e => { if (e.key === 'Escape') { quickDrop.style.display = 'none'; quickSearchInp.value = ''; } });
  quickSearchWrap.appendChild(quickSearchInp);
  quickSearchWrap.appendChild(quickDrop);
  itemsWrap.appendChild(quickSearchWrap);
  if (preselectedProduct) {
    const banner = document.createElement('div');
    banner.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.35);border-radius:var(--r2);margin-bottom:8px;font-size:12px;color:var(--accent)';
    banner.innerHTML = (preselectedProduct.image
      ? `<img src="${escHtml(preselectedProduct.image)}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid rgba(201,168,76,.4);flex-shrink:0">`
      : '<span style="font-size:22px">💎</span>') +
      `<div><b style="font-size:13px">${escHtml(preselectedProduct.name)}</b><br><span style="color:var(--text2)">Giá bán: <b style="color:var(--accent)">${fmt(preselectedProduct.sellPrice)}đ/${escHtml(preselectedProduct.unit)}</b> · Tồn: <b style="color:var(--green)">${fmtQty(preselectedProduct.stock)} ${escHtml(preselectedProduct.unit)}</b></span></div>`;
    itemsWrap.appendChild(banner);
  }

  itemsWrap.appendChild(itemsContainer);
  itemsWrap.appendChild(addItemBtn);

  S.modal = {
    title: preselectedProduct ? '🧾 Bán hàng: ' + preselectedProduct.name : '🧾 Tạo đơn bán hàng',
    large: true,
    content: h('div', {className:'fg fg2'},
      fg('Ngày',              null, inpDate),
      fg('Khách hàng *',      null, inpCust),
      fg('Số điện thoại',     null, inpPhone),
      fg('Địa chỉ giao hàng',null, inpAddr),
      _saleIsAdminForm && staffFieldEl ? fg('👤 Nhân viên phụ trách', null, staffFieldEl) : null,
      itemsWrap,
      h('div', {className:'form-group fg-full', style:{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:4}},
        h('div', {style:{fontSize:11,color:'var(--green)',fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:.8}}, '🚚 Phí vận chuyển giao hàng (tuỳ chọn)')
      ),
      fg('Phí vận chuyển (đơn giá CHƯA VAT)', true, shipFeeWrap),
      fg('VAT vận chuyển (0–20%)', true, vatShipRow),
      fg('Đã thanh toán',     null, inpPaid),
      fg('Ghi chú',           true, inpNote),
      sumEl
    ),
    footer: [
      h('button', {className:'btn', onClick:()=>{S.modal=null;render();}}, 'Huỷ'),
      h('button', {className:'btn btn-primary', onClick:()=>{
        const customer = inpCust.value.trim();
        if (!customer) { toast('Vui lòng nhập tên khách hàng!','error'); return; }

        // Validate tất cả dòng hàng
        for (let idx=0; idx<saleItems.length; idx++) {
          const it = saleItems[idx];
          if (!it.productId) { toast('Mặt hàng '+(idx+1)+': chưa chọn sản phẩm!','error'); return; }
          const prod = products.find(p=>p.id===it.productId);
          if (prod && prod.variants && prod.variants.length>0 && !it.variantId) {
            toast('Mặt hàng '+(idx+1)+' ('+prod.name+'): vui lòng chọn quy cách!','error'); return;
          }
          const qty = parseFloat(it.qty)||0;
          if (qty<=0) { toast('Mặt hàng '+(idx+1)+': số lượng phải lớn hơn 0!','error'); return; }
          const price = parseFloat(it.price)||0;
          if (price<=0) { toast('Mặt hàng '+(idx+1)+': chưa nhập đơn giá!','error'); return; }
          // Kiểm tra tồn kho — chỉ cảnh báo, KHÔNG chặn (cho phép bán âm kho)
          if (it.variantId && prod && prod.variants) {
            const sv = prod.variants.find(vt=>vt.id===it.variantId);
            if (sv && (sv.stockM2||0) < qty) {
              // Cho phép tiếp tục — sẽ tạo cảnh báo nhập hàng sau khi lưu
            }
          } else if (!it.variantId && prod && (prod.stock||0) < qty) {
            // Cho phép tiếp tục — sẽ tạo cảnh báo nhập hàng sau khi lưu
          }
        }

        const shipUnit = selShipUnit.value;
        const shipQtyVal = shipUnit==='chuyến' ? 1 : (parseFloat(inpShipQty.value)||0);
        const shipUnitPriceVal = parseFloat(inpShipFee.value)||0;
        const shipVatRate = vatShipRow._getVal();
        const shipNetAmt = Math.round(shipUnitPriceVal * shipQtyVal);
        const shipVatAmtVal = shipVatRate>0 ? Math.round(shipNetAmt*shipVatRate/100) : 0;
        const shipFee = shipNetAmt + shipVatAmtVal;

        // Tính tổng tiền hàng để chia phí VC theo tỉ lệ
        const itemCalcs2 = saleItems.map(it => {
          const qty=parseFloat(it.qty)||0, price=parseFloat(it.price)||0, vat=parseFloat(it.vatRate)||0;
          const sub=qty*price, vatAmt=Math.round(sub*vat/100), goodsTotal=sub+vatAmt;
          return {qty,price,vat,sub,vatAmt,goodsTotal};
        });
        const totalGoodsGross2 = itemCalcs2.reduce((a,c)=>a+c.goodsTotal,0);
        // Nếu VC tính cho khách → cộng vào tổng khách trả; ngược lại chỉ tính tiền hàng
        const grandTotal = shipForCustomer ? totalGoodsGross2 + shipFee : totalGoodsGross2;
        const totalPaid2 = Math.min(parseFloat(inpPaid.value)||0, grandTotal);
        const dateSaved = inpDate.value;

        // Tạo bản ghi cho từng dòng (chia phí VC theo tỉ lệ nếu tính cho khách)
        const newRecs2 = [];
        const _orderGroupId = 'ord' + uid(); // ID đơn hàng — gộp nhiều SP cùng đơn
        saleItems.forEach((it,idx) => {
          const calc = itemCalcs2[idx];
          const prod = products.find(p=>p.id===it.productId);
          let itemShipFee=0;
          // Chỉ phân bổ VC vào bản ghi nếu tính cho khách (hiện trên hoá đơn)
          // Nếu cửa hàng tự chịu: shipFee vẫn lưu để báo cáo LN nhưng đánh dấu storeShip=true
          if(shipFee>0){
            const isLastSale=idx===saleItems.length-1;
            if(totalGoodsGross2>0){
              itemShipFee=isLastSale
                ? shipFee - newRecs2.reduce((a,r)=>a+(r.shipFee||0),0)
                : Math.round(shipFee*calc.goodsTotal/totalGoodsGross2);
            } else {
              itemShipFee=isLastSale
                ? shipFee - newRecs2.reduce((a,r)=>a+(r.shipFee||0),0)
                : Math.round(shipFee/saleItems.length);
            }
          }
          // itemTotal: nếu VC tính cho khách → cộng VC, ngược lại chỉ tiền hàng
          const itemTotal = shipForCustomer ? calc.goodsTotal + itemShipFee : calc.goodsTotal;
          let itemPaid=0;
          if(totalPaid2>0 && grandTotal>0){
            itemPaid = idx===saleItems.length-1
              ? totalPaid2 - newRecs2.reduce((a,r)=>a+(r.paid||0),0)
              : Math.round(totalPaid2*itemTotal/grandTotal);
            itemPaid = Math.max(0,Math.min(itemPaid,itemTotal));
          }
          let vtSize=null;
          if(it.variantId && prod && prod.variants){
            const sv=prod.variants.find(vt=>vt.id===it.variantId);
            if(sv) vtSize=sv.tileW+'×'+sv.tileH+(sv.tileThickness?'×'+sv.tileThickness:'')+' cm';
          }
          const rec = {
            id:'s'+uid(), orderId: _orderGroupId, date:dateSaved, customer, phone:inpPhone.value.trim(),
            address:inpAddr.value.trim(), productId:it.productId, productName:prod?.name||'',
            qty:calc.qty, unit:prod?.unit||'', unitPrice:calc.price, vatRate:calc.vat,
            subTotal:calc.sub, vatAmt:calc.vatAmt, total:itemTotal, paid:itemPaid,
            shipFee:itemShipFee, shipUnit, shipVatRate, shipQty:shipQtyVal, shipUnitPrice:shipUnitPriceVal,
            shipForCustomer: shipForCustomer, // flag: true=tính cho khách, false=cửa hàng tự chịu
            variantId:it.variantId||null, variantSize:vtSize,
            status:itemPaid>=itemTotal&&itemTotal>0?'done':'debt', note:inpNote.value.trim(),
            staffId: selStaffId || AUTH.currentUser()?.username || null,
            staffName: selStaffName || AUTH.currentUser()?.displayName || null,
            createdAt: new Date().toISOString(),
            _updated: new Date().toISOString()
          };
          newRecs2.push(rec);
        });

        // Trừ tồn kho — gom theo productId để tránh bug nhiều dòng cùng SP
        const stockDeduct = {};
        saleItems.forEach((it,idx) => {
          const calc = itemCalcs2[idx];
          if(!stockDeduct[it.productId]) stockDeduct[it.productId]={stockMinus:0, variantDeltas:{}, txIds:[]};
          stockDeduct[it.productId].stockMinus += calc.qty;
          stockDeduct[it.productId].txIds.push(newRecs2[idx].id);
          if(it.variantId){
            if(!stockDeduct[it.productId].variantDeltas[it.variantId]) stockDeduct[it.productId].variantDeltas[it.variantId]=0;
            stockDeduct[it.productId].variantDeltas[it.variantId] += calc.qty;
          }
        });
        S.products = S.products.map(p => {
          const d = stockDeduct[p.id]; if(!d) return p;
          const newStock = (p.stock||0) - d.stockMinus; // cho phép âm kho
          const newVariants = (p.variants||[]).map(vt => {
            const vtMinus = d.variantDeltas[vt.id]; if(!vtMinus) return vt;
            const ppm2=(vt.tileW>0&&vt.tileH>0)?10000/(vt.tileW*vt.tileH):0;
            const newM2=(vt.stockM2||0)-vtMinus; // cho phép âm kho
            return {...vt, stockM2:newM2, stockPieces:ppm2>0?Math.round(newM2*ppm2):(vt.stockPieces||0)-Math.round(vtMinus*(ppm2||0))};
          });
          // _stockTx: đánh dấu các đơn bán này ĐÃ phản ánh vào stock — hoà giải
          // đa thiết bị (applyLedgerToStock) sẽ không trừ trùng lần sau
          return {...p, stock:newStock, variants:newVariants, _updated: new Date().toISOString(),
            _stockTx: CLOUD.unionStockTx(p._stockTx, d.txIds)};
        });

        S.sales=[...newRecs2, ...S.sales];
        save('sales'); save('products');

        // ── Kiểm tra sau khi trừ kho: tạo cảnh báo nhập hàng nếu âm ──
        const stockAlerts = [];
        saleItems.forEach((it, idx) => {
          const calc = itemCalcs2[idx];
          const prod = S.products.find(p => p.id === it.productId);
          if (!prod) return;
          const curStock = parseFloat(prod.stock) || 0;
          if (curStock < 0) {
            // Thu thập chi tiết quy cách bị âm
            const negativeVariants = (prod.variants || [])
              .filter(vt => (vt.stockM2 || 0) < 0 || (vt.stockPieces || 0) < 0)
              .map(vt => ({
                size: vt.tileW + '×' + vt.tileH + (vt.tileThickness?'×'+vt.tileThickness:'') + ' cm',
                stockM2: vt.stockM2 || 0,
                stockPieces: vt.stockPieces || 0,
                needM2: (vt.stockM2 || 0) < 0 ? Math.abs(vt.stockM2) : 0,
                needPieces: (vt.stockPieces || 0) < 0 ? Math.abs(vt.stockPieces) : 0
              }));
            stockAlerts.push({
              id: 'alert_' + prod.id + '_' + Date.now(),
              productId: prod.id,
              productName: prod.name,
              unit: prod.unit,
              shortfall: Math.abs(curStock),
              createdAt: new Date().toISOString(),
              saleId: newRecs2[idx]?.id || null,
              customer: customer,
              soldQty: calc.qty,
              negativeVariants: negativeVariants
            });
          }
        });

        if (stockAlerts.length > 0) {
          // Lưu alerts vào state (gộp, tránh trùng)
          const existAlerts = S.stockAlerts || [];
          stockAlerts.forEach(a => {
            const existIdx = existAlerts.findIndex(e => e.productId === a.productId);
            if (existIdx >= 0) {
              // Cập nhật nếu đã có alert cho sản phẩm này
              existAlerts[existIdx] = { ...existAlerts[existIdx], shortfall: Math.abs(parseFloat(S.products.find(p=>p.id===a.productId)?.stock)||0), updatedAt: a.createdAt };
            } else {
              existAlerts.push(a);
            }
          });
          S.stockAlerts = existAlerts;
          try { localStorage.setItem('dtn_stockAlerts', JSON.stringify(S.stockAlerts)); } catch(e) {}

          const alertNames = stockAlerts.map(a => a.productName).join(', ');
          toast(`⚠️ Đơn lưu thành công! Kho âm: ${alertNames} — Cần nhập thêm hàng! Xem cảnh báo ở Kho Hàng.`, 'error');
        } else {
          toast('✅ Đã tạo '+newRecs2.length+' đơn hàng · Tổng: '+fmt(grandTotal)+'đ'+(shipFee>0?' · VC: '+fmt(shipFee)+'đ':''),'success');
        }

        S.modal=null;
        rebuild(); render();
      }}, '💾 Lưu đơn hàng')
    ]
  };
  _raf = false; render(); // Force render ngay — bỏ qua debounce để modal hiện tức thì
}

//  custList: [{ name, phone, orders:[saleRecord] }]
//  Chi tiết từng mặt hàng: ngày mua, tên SP, SL, đơn giá, thành tiền,

// ═══════════════════════════════════════════════════════════════
// Lọc các đơn còn nợ của 1 khách (remaining > 0)
function _debtOrdersOf(cust) {
  return (cust.orders || [])
    .filter(s => (s.total || 0) - (s.paid || 0) > 0.5)
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

// Chuẩn bị dữ liệu xuất: chỉ giữ khách còn công nợ
function _buildDebtExportData(custList) {
  return custList
    .map(c => ({ name: c.name, phone: c.phone || '', items: _debtOrdersOf(c) }))
    .filter(c => c.items.length > 0)
    .sort((a, b) => a.name.localeCompare(b.name, 'vi'));
}

function exportCustDebtExcel(custList, label) {
  if (typeof XLSX === 'undefined') { toast('Thư viện Excel chưa sẵn sàng', 'error'); return; }
  const data = _buildDebtExportData(custList);
  if (data.length === 0) { toast('Không có công nợ để xuất', 'info'); return; }
  const shop = (S.settings && S.settings.shopName) || 'Đá Tự Nhiên';
  const dateStr = today();
  const GOLD = 'C9A84C', RED = '5c1a1a';

  const hStyle = { font:{bold:true,color:{rgb:'FFFFFF'},name:'Arial',sz:10}, fill:{fgColor:{rgb:RED},patternType:'solid'}, alignment:{horizontal:'center',vertical:'center',wrapText:true}, border:{top:{style:'thin',color:{rgb:'CCC'}},bottom:{style:'thin',color:{rgb:'CCC'}},left:{style:'thin',color:{rgb:'CCC'}},right:{style:'thin',color:{rgb:'CCC'}}} };
  const dStyle = align => ({ font:{name:'Arial',sz:10}, alignment:{horizontal:align||'left',vertical:'center'}, border:{top:{style:'hair',color:{rgb:'EEE'}},bottom:{style:'hair',color:{rgb:'EEE'}},left:{style:'hair',color:{rgb:'EEE'}},right:{style:'hair',color:{rgb:'EEE'}}} });
  const subStyle = align => ({ font:{bold:true,name:'Arial',sz:10}, fill:{fgColor:{rgb:'F3E9D2'},patternType:'solid'}, alignment:{horizontal:align||'left',vertical:'center'} });

  const headers = ['Khách hàng','SĐT','Ngày mua','Tên sản phẩm','Số lượng','Đơn giá (đ)','Thành tiền (đ)','Đã thanh toán (đ)','Còn nợ (đ)','Địa chỉ công trình'];
  const aoa = [
    [shop + ' — BẢNG CÔNG NỢ KHÁCH HÀNG' + (label ? ' (' + label + ')' : '')],
    ['Ngày xuất: ' + fmtD(dateStr)],
    [],
    headers
  ];
  // Theo dõi style từng dòng: 'data' | 'sub'
  const rowKinds = [];
  let grandTotal = 0, grandPaid = 0, grandRemain = 0;

  data.forEach(c => {
    let cTotal = 0, cPaid = 0, cRemain = 0;
    c.items.forEach(s => {
      const remain = (s.total || 0) - (s.paid || 0);
      cTotal += (s.total || 0); cPaid += (s.paid || 0); cRemain += remain;
      aoa.push([
        c.name, c.phone, fmtD(s.date),
        s.productName || '',
        (s.qty > 0 ? s.qty + (s.unit ? ' ' + s.unit : '') : ''),
        numFmt(s.unitPrice || 0),
        numFmt(s.total || 0),
        numFmt(s.paid || 0),
        numFmt(remain),
        s.address || ''
      ]);
      rowKinds.push('data');
    });
    aoa.push(['', '', '', 'Cộng — ' + c.name, '', '', numFmt(cTotal), numFmt(cPaid), numFmt(cRemain), '']);
    rowKinds.push('sub');
    grandTotal += cTotal; grandPaid += cPaid; grandRemain += cRemain;
  });
  aoa.push([]);
  aoa.push(['TỔNG CỘNG', '', '', '', '', '', numFmt(grandTotal), numFmt(grandPaid), numFmt(grandRemain), '']);
  const grandRowIdx = aoa.length - 1;

  const ws = XLSX.utils.aoa_to_sheet([]);
  XLSX.utils.sheet_add_aoa(ws, aoa);
  ws['A1'] = { v: aoa[0][0], t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: GOLD } } } };
  ws['A2'] = { v: aoa[1][0], t: 's', s: { font: { italic: true, sz: 10, name: 'Arial', color: { rgb: '888888' } } } };
  // Header (dòng index 3)
  headers.forEach((_, ci) => { const a = XLSX.utils.encode_cell({ r: 3, c: ci }); if (ws[a]) ws[a].s = hStyle; });
  // Dòng dữ liệu / subtotal
  rowKinds.forEach((kind, i) => {
    const r = 4 + i;
    headers.forEach((_, ci) => {
      const a = XLSX.utils.encode_cell({ r, c: ci });
      if (!ws[a]) return;
      const right = ci >= 5 && ci <= 8;
      ws[a].s = kind === 'sub' ? subStyle(right ? 'right' : 'left') : dStyle(right ? 'right' : 'left');
    });
  });
  // Dòng tổng cộng
  headers.forEach((_, ci) => {
    const a = XLSX.utils.encode_cell({ r: grandRowIdx, c: ci });
    if (ws[a]) ws[a].s = { font: { bold: true, sz: 11, name: 'Arial', color: { rgb: ci >= 6 ? '000000' : 'FFFFFF' } }, fill: { fgColor: { rgb: ci >= 6 ? 'F3D9A0' : RED }, patternType: 'solid' }, alignment: { horizontal: ci >= 6 ? 'right' : 'left' } };
  });
  ws['!cols'] = [{wch:22},{wch:13},{wch:12},{wch:30},{wch:12},{wch:14},{wch:15},{wch:16},{wch:15},{wch:30}];
  ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:grandRowIdx,c:9} });
  ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:9} }, { s:{r:1,c:0}, e:{r:1,c:9} }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Công nợ KH');
  const fname = shop.replace(/\s/g, '') + '_CongNo' + (label ? '_' + label.replace(/[^\w]/g, '') : '') + '_' + dateStr.replace(/-/g, '') + '.xlsx';
  XLSX.writeFile(wb, fname);
  toast('✅ Đã xuất Excel: ' + fname, 'success');
}

  let selectedSupp = null; // NCC đang xem lịch sử

    const custDebts = mySalesDebt.filter(s => s.status === 'debt').map(s => ({ ...s, remaining: s.total - s.paid }));
    const suppDebts = isAdminDebt ? imports.filter(i => i.status === 'debt').map(i => ({ ...i, remaining: i.total - i.paid })) : [];
    const totalC = custDebts.reduce((a, x) => a + x.remaining, 0);
    const totalS = suppDebts.reduce((a, x) => a + x.remaining, 0);

    // Gom nhóm tất cả khách hàng từ lịch sử bán hàng (theo phạm vi nhân viên)
    const custMap = {};
    mySalesDebt.forEach(s => {
      const key = s.customer.trim();
      if (!custMap[key]) custMap[key] = { name: key, phone: s.phone || '', orders: [] };

      if (s.phone && !custMap[key].phone) custMap[key].phone = s.phone;

      onClick: () => { tab = id; rebuild(); }

    let tabContent;

    if (tab === 'customer') {
      tabContent = h('div', {},
        totalC > 0 && h('div', { className: 'alert alert-err' }, `⚠️ Còn ${custDebts.length} đơn chưa TT · Tổng phải thu: ${fmt(totalC)}đ`),

          h('span', { style: { fontSize: 12, color: 'var(--text3)' } }, 'Xuất toàn bộ công nợ:'),

          ? h('div', { style: { textAlign: 'center', padding: 48, color: 'var(--green)', fontSize: 15 } }, '✅ Không có công nợ khách hàng')

                        const amtIn = parseFloat(inpAmt2.value) || 0;

                        const title = document.createElement('div');
                        title.style.cssText = 'font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px';

                        let remain = amtIn;
                        debtOrders.forEach(s => {

                          const owe = s.total - s.paid;

                            )

                            h('button', { className: 'btn btn-xs btn-ghost',
                              onClick: () => { inpAmt2.value = Math.round(custDebt / 2); renderPreview(); }
                            }, '½ Thu nửa')
                          ),
                          previewEl
                        ),
                        footer: [
                          h('button', { className: 'btn', onClick: () => { S.modal = null; render(); } }, 'Huỷ'),
                          h('button', { className: 'btn btn-primary', style: { background: 'var(--green)', borderColor: 'var(--green)' }, onClick: () => {
                            const amtIn = parseFloat(inpAmt2.value) || 0;
                            if (amtIn <= 0) { toast('Vui lòng nhập số tiền thu!', 'error'); return; }
                            if (amtIn > custDebt + 0.01) { toast('Số tiền vượt quá tổng nợ ' + fmt(custDebt) + 'đ!', 'error'); return; }
                            const dateIn = inpDate2.value;
                            const timeIn = inpTime2.value;
                            const noteIn = inpNote2.value.trim();

                            // Phân bổ vào các đơn (cũ nhất trước)

                            const newLogs = [];

                              if (remaining2 <= 0) return sale;
                              const matchDebt = debtOrders.find(d => d.id === sale.id);
                              if (!matchDebt) return sale;
                              const owe = sale.total - sale.paid;
                              if (owe <= 0) return sale;
                              const pay = Math.min(owe, remaining2);
                              remaining2 -= pay;
                              const newPaid = sale.paid + pay;
                              const done = newPaid >= sale.total;
                              newLogs.push({
                                id: 'pl' + uid(),
                                type: 'customer',
                                refId: sale.id,
                                customer: cust.name,
                                date: dateIn,
                                time: timeIn,
                                amount: pay,
                                note: noteIn || 'Thu nợ tổng',
                                createdAt: new Date().toISOString(),
                                _updated: new Date().toISOString()
                              });
                              return { ...sale, paid: newPaid, status: done ? 'done' : 'debt', _updated: new Date().toISOString() };
                            });

                            S.sales = updatedSales;
                            S.paymentlogs = [...newLogs, ...(S.paymentlogs || [])];
                            save('sales'); save('paymentlogs');
                            S.modal = null;
                            toast(`✅ Đã thu ${fmt(amtIn)}đ · Cập nhật ${newLogs.length} đơn hàng`, 'success');

                            render();
                          } }, '💰 Xác nhận thu nợ tổng')
                        ]
                      };
                      render();
                    }
                  }, '💰 Thu nợ tổng')
                )
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginTop: 16 } },

            h('div', { className: 'table-wrap' },

                      if (lg.length === 0) return h('span', { style: { color: 'var(--text3)', fontSize: 11 } }, '—');
                      return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 3 } },

    wrap.innerHTML = '';
    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, 'Công Nợ & Khách Hàng'),
          h('div', { className: 'page-sub' }, isAdminDebt
            ? `Phải thu KH: ${fmt(totalC)}đ · Phải trả NCC: ${fmt(totalS)}đ · ${allCusts.length} khách`

        ])

      tabContent

  rebuild();
  return wrap;
}

// ── INVOICE ───────────────────────────────────────────────────
function pgInvoice() {
  const wrap = h('div', {});
  let selectedGroup = null, search = '';

  // Gộp các sale records thành nhóm đơn hàng để hiển thị + in gộp
  function buildOrderGroups(sales) {
    const groupMap = {};
    sales.forEach(s => {
      const key = s.orderId || s.id;
      if (!groupMap[key]) {
        groupMap[key] = {
          groupId: key,
          orderId: s.orderId || null,
          date: s.date,
          customer: s.customer,
          phone: s.phone || '',
          address: s.address || '',
          note: s.note || '',
          staffId: s.staffId,
          staffName: s.staffName,
          items: [],
          totalGrand: 0,
          totalPaid: 0,
          hasVat: false,
          vatRate: 0,
          shipForCustomer: s.shipForCustomer,
          status: 'done'
        };
      }
      groupMap[key].items.push(s);
      groupMap[key].totalGrand += s.total || 0;
      groupMap[key].totalPaid  += s.paid  || 0;
      if ((s.vatRate||0) > 0) { groupMap[key].hasVat = true; groupMap[key].vatRate = s.vatRate; }
      if (s.status !== 'done') groupMap[key].status = 'debt';
    });
    return Object.values(groupMap).sort((a, b) => b.date.localeCompare(a.date));
  }

  const rebuild = () => {
    const { sales, settings } = S;
    const currentUser = AUTH.currentUser();
    const isAdminInv = currentUser && currentUser.role === 'admin';
    const mySalesInv = isAdminInv ? sales : sales.filter(s => s.staffId === currentUser.username);
    const q = search.toLowerCase();
    const filteredSales = mySalesInv.filter(s =>
      (s.customer||'').toLowerCase().includes(q) ||
      (s.productName||'').toLowerCase().includes(q) ||
      (s.orderId||'').toLowerCase().includes(q)
    );
    const groups = buildOrderGroups(filteredSales);
    if (selectedGroup && !groups.find(g => g.groupId === selectedGroup.groupId)) selectedGroup = null;

    // ── Preview: render nhóm đơn hàng đã chọn ──
    let preview;
    if (selectedGroup) {
      const grp = selectedGroup;
      const remaining = grp.totalGrand - grp.totalPaid;
      const totalSubAll  = grp.items.reduce((a, s) => a + (s.subTotal||0), 0);
      const totalVatAll  = grp.items.reduce((a, s) => a + (s.vatAmt||0), 0);
      const totalShipAll = grp.shipForCustomer ? grp.items.reduce((a, s) => a + (s.shipForCustomer ? (s.shipFee||0) : 0), 0) : 0;
      // ID hoá đơn: nếu 1 SP dùng id riêng; nhiều SP dùng orderId
      const invNo = grp.items.length === 1 ? grp.items[0].id.toUpperCase() : (grp.orderId||grp.groupId).toUpperCase();

      const invEl = h('div', { style: { background: '#fff', color: '#111', borderRadius: 'var(--r)', padding: '24px', fontSize: 13, lineHeight: 1.8 } },
        h('div', { style: { display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:12, marginBottom:20, paddingBottom:16, borderBottom:'2.5px solid #d4b84a' } },
          h('div', {},

function pgXuatKho() {

  function buildOrderGroups(sales) {
    const groupMap = {};
    sales.forEach(s => {
      const key = s.orderId || s.id;
      if (!groupMap[key]) {
        groupMap[key] = {
          groupId: key, orderId: s.orderId || null, date: s.date,
          customer: s.customer, phone: s.phone || '', address: s.address || '',
          note: s.note || '', staffName: s.staffName, items: [], status: 'done'
        };
      }
      groupMap[key].items.push(s);
      if (s.status !== 'done') groupMap[key].status = 'debt';
    });
    return Object.values(groupMap).sort((a, b) => b.date.localeCompare(a.date));
  }

  // Lấy ảnh sản phẩm (ưu tiên ảnh trong kho theo productId)
  function prodImage(item) {
    const p = (S.products || []).find(p => p.id === item.productId);
    return (p && p.image) || item.image || '';
  }

  function noteInput(itemId) {

    ta.value = notes[itemId] || '';
    // Chỉ lưu vào state, KHÔNG rebuild → giữ con trỏ
    ta.addEventListener('input', e => { notes[itemId] = e.target.value; });
    return ta;
  }

    }).join('');
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">

${autoprint ? '<scr' + 'ipt>window.onload=function(){window.print()};<\/scr' + 'ipt>' : ''}

            ...groups.map(grp => h('div', {

              ),

                  ? grp.items.length + ' sản phẩm · ' + fmtD(grp.date)
                  : (grp.items[0]?.productName || '') + ' · ' + fmtD(grp.date)
              )
            )),
