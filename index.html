  // Tạo workbook
  const wb = XLSX.utils.book_new();

  // ─── 1. SHEET: KHO HÀNG ───────────────────────────────────────
  if (sheetChoice === 'all' || sheetChoice === 'inventory') {
    const invHeaders = ['Tên sản phẩm','Mã SKU','Loại đá','Xuất xứ','Đơn vị','Giá nhập (đ)','Giá bán (đ)','Tồn kho','Giá trị kho (đ)','Mô tả'];
    const invRows = products.map(p => [
      p.name || '',
      p.sku || '',
      p.type || '',
      p.origin || '',
      p.unit || '',
      numFmt(p.buyPrice),
      numFmt(p.sellPrice),
      parseFloat(p.stock) || 0,
      numFmt((parseFloat(p.stock)||0) * (p.buyPrice||0)),
      p.description || ''
    ]);

    // Thêm dòng tổng
    const totalKhoVal = products.reduce((a,p) => a + (parseFloat(p.stock)||0)*(p.buyPrice||0), 0);
    invRows.push(['TỔNG CỘNG','','','','','','',
      products.reduce((a,p) => a + (parseFloat(p.stock)||0), 0),
      numFmt(totalKhoVal),
      ''
    ]);

    const ws = XLSX.utils.aoa_to_sheet([]);
    // Tiêu đề file
    XLSX.utils.sheet_add_aoa(ws, [
      [shop + ' — BÁO CÁO KHO HÀNG'],
      ['Ngày xuất: ' + fmtD(dateStr)],
      [],
      invHeaders,
      ...invRows
    ]);

    // Style tiêu đề chính
    ws['A1'] = { v: shop + ' — BÁO CÁO KHO HÀNG', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: GOLD } } } };
    ws['A2'] = { v: 'Ngày xuất: ' + fmtD(dateStr), t: 's', s: { font: { italic: true, sz: 10, name: 'Arial', color: { rgb: '888888' } } } };

    // Style header row (row 4 = index 3)
    invHeaders.forEach((_, ci) => {
      const cellAddr = XLSX.utils.encode_cell({ r: 3, c: ci });
      if (ws[cellAddr]) ws[cellAddr].s = hStyle(GOLD);
    });

    // Style data rows
    invRows.forEach((row, ri) => {
      row.forEach((_, ci) => {
        const cellAddr = XLSX.utils.encode_cell({ r: 4 + ri, c: ci });
        if (ws[cellAddr]) {
          const isLast = ri === invRows.length - 1;
          ws[cellAddr].s = isLast
            ? { font: { bold: true, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: 'FFF8E1' }, patternType: 'solid' }, alignment: { horizontal: ci >= 5 ? 'right' : 'left' } }
            : dStyle(ci >= 5 ? 'right' : 'left');
        }
      });
    });

    ws['!cols'] = [{ wch: 28 },{ wch: 10 },{ wch: 14 },{ wch: 14 },{ wch: 8 },{ wch: 16 },{ wch: 16 },{ wch: 10 },{ wch: 18 },{ wch: 30 }];
    ws['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:9} }, { s:{r:1,c:0}, e:{r:1,c:9} }];
    ws['!rows'] = [{ hpt: 26 }, { hpt: 16 }, { hpt: 6 }, { hpt: 22 }];
    ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:4+invRows.length-1,c:9} });
    XLSX.utils.book_append_sheet(wb, ws, '💎 Kho hàng');
  }

  // ─── 2. SHEET: ĐƠN BÁN HÀNG ─────────────────────────────────
  if (sheetChoice === 'all' || sheetChoice === 'sales') {
    const sHeaders = ['Ngày','Khách hàng','SĐT','Sản phẩm','SL','Đơn vị','Đơn giá (đ)','VAT %','Doanh thu thuần (đ)','VAT (đ)','Tổng tiền (đ)','Đã thu (đ)','Còn nợ (đ)','Trạng thái','Ghi chú'];
    const sorted = [...sales].sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const sRows = sorted.map(s => [
      fmtD(s.date),
      s.customer || '',
      s.phone || '',
      s.productName || '',
      parseFloat(s.qty) || 0,
      s.unit || '',
      numFmt(s.unitPrice),
      s.vatRate || 0,
      numFmt(s.subTotal || s.total),
      numFmt(s.vatAmt),
      numFmt(s.total),
      numFmt(s.paid),
      numFmt((s.total||0) - (s.paid||0)),
      s.status === 'done' ? 'Đã thanh toán' : 'Còn nợ',
      s.note || ''
    ]);

    // Dòng tổng
    const totRevNet = sales.reduce((a,s) => a + (s.subTotal != null ? s.subTotal : Math.max(0,(s.total||0)-(s.shipFee||0)-(s.vatAmt||0))), 0);
    const totVat    = sales.reduce((a,s) => a + (s.vatAmt||0), 0);
    const totRev    = sales.reduce((a,s) => a + (s.total||0), 0);
    const totPaid   = sales.reduce((a,s) => a + (s.paid||0), 0);
    const totDebt   = sales.reduce((a,s) => a + Math.max(0,(s.total||0)-(s.paid||0)), 0);
    sRows.push(['TỔNG CỘNG','','','',sales.reduce((a,s)=>a+(parseFloat(s.qty)||0),0),'','','',
      numFmt(totRevNet), numFmt(totVat), numFmt(totRev), numFmt(totPaid), numFmt(totDebt),'','']);

    const ws2 = XLSX.utils.aoa_to_sheet([]);
    XLSX.utils.sheet_add_aoa(ws2, [
      [shop + ' — BÁO CÁO BÁN HÀNG'],
      ['Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + sales.length + ' đơn'],
      [],
      sHeaders,
      ...sRows
    ]);

    ws2['A1'] = { v: shop + ' — BÁO CÁO BÁN HÀNG', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: '1a5c2b' } } } };
    ws2['A2'] = { v: 'Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + sales.length + ' đơn', t: 's', s: { font: { italic: true, sz: 10, name: 'Arial', color: { rgb: '888888' } } } };

    sHeaders.forEach((_, ci) => {
      const ca = XLSX.utils.encode_cell({ r: 3, c: ci });
      if (ws2[ca]) ws2[ca].s = hStyle(GREEN);
    });
    sRows.forEach((row, ri) => {
      const isLast = ri === sRows.length - 1;
      const isDebt = row[13] === 'Còn nợ';
      row.forEach((_, ci) => {
        const ca = XLSX.utils.encode_cell({ r: 4 + ri, c: ci });
        if (!ws2[ca]) return;
        if (isLast) {
          ws2[ca].s = { font: { bold: true, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: 'E8F5E9' }, patternType: 'solid' }, alignment: { horizontal: ci >= 4 ? 'right' : 'left' } };
        } else if (ci === 13 && isDebt) {
          ws2[ca].s = { font: { bold: true, name: 'Arial', sz: 10, color: { rgb: 'C0392B' } }, alignment: { horizontal: 'center' }, border: { bottom: { style: 'hair', color: { rgb: 'EEEEEE' } } } };
        } else {
          ws2[ca].s = dStyle([6,7,8,9,10,11,12].includes(ci) ? 'right' : ci === 13 ? 'center' : 'left');
        }
      });
    });

    ws2['!cols'] = [{wch:12},{wch:20},{wch:13},{wch:25},{wch:7},{wch:8},{wch:16},{wch:7},{wch:18},{wch:13},{wch:16},{wch:14},{wch:13},{wch:16},{wch:20}];
    ws2['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:14} }, { s:{r:1,c:0}, e:{r:1,c:14} }];
    ws2['!rows'] = [{ hpt: 26 }, { hpt: 16 }, { hpt: 6 }, { hpt: 22 }];
    ws2['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:4+sRows.length-1,c:14} });
    XLSX.utils.book_append_sheet(wb, ws2, '🧾 Bán hàng');
  }

  // ─── 3. SHEET: NHẬP HÀNG ────────────────────────────────────
  if (sheetChoice === 'all' || sheetChoice === 'imports') {
    const iHeaders = ['Ngày nhập','Nhà cung cấp','Sản phẩm','SL','Đơn vị','Đơn giá (đ)','VAT %','Tổng tiền (đ)','Đã trả (đ)','Còn nợ NCC (đ)','Phí VC (đ)','Trạng thái','Ghi chú'];
    const sortedI = [...imports].sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const iRows = sortedI.map(i => [
      fmtD(i.date),
      i.supplier || '',
      i.productName || '',
      parseFloat(i.qty) || 0,
      i.unit || '',
      numFmt(i.unitPrice),
      i.vatRate || 0,
      numFmt(i.total),
      numFmt(i.paid),
      numFmt((i.total||0)-(i.paid||0)),
      numFmt(i.shipFee),
      i.status === 'paid' ? 'Đã thanh toán' : 'Còn nợ',
      i.note || ''
    ]);

    const totI    = imports.reduce((a,i) => a + (i.total||0), 0);
    const totIP   = imports.reduce((a,i) => a + (i.paid||0), 0);
    const totID   = imports.reduce((a,i) => a + Math.max(0,(i.total||0)-(i.paid||0)), 0);
    const totISF  = imports.reduce((a,i) => a + (i.shipFee||0), 0);
    iRows.push(['TỔNG CỘNG','','',imports.reduce((a,i)=>a+(parseFloat(i.qty)||0),0),'','','',
      numFmt(totI), numFmt(totIP), numFmt(totID), numFmt(totISF),'','']);

    const ws3 = XLSX.utils.aoa_to_sheet([]);
    XLSX.utils.sheet_add_aoa(ws3, [
      [shop + ' — BÁO CÁO NHẬP HÀNG'],
      ['Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + imports.length + ' phiếu nhập'],
      [],
      iHeaders,
      ...iRows
    ]);
    ws3['A1'] = { v: shop + ' — BÁO CÁO NHẬP HÀNG', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: '1a3a5c' } } } };
    ws3['A2'] = { v: 'Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + imports.length + ' phiếu nhập', t: 's', s: { font: { italic: true, sz: 10, name: 'Arial', color: { rgb: '888888' } } } };

    iHeaders.forEach((_, ci) => {
      const ca = XLSX.utils.encode_cell({ r: 3, c: ci });
      if (ws3[ca]) ws3[ca].s = hStyle(BLUE);
    });
    iRows.forEach((row, ri) => {
      const isLast = ri === iRows.length - 1;
      row.forEach((_, ci) => {
        const ca = XLSX.utils.encode_cell({ r: 4 + ri, c: ci });
        if (!ws3[ca]) return;
        ws3[ca].s = isLast
          ? { font: { bold: true, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: 'E3F2FD' }, patternType: 'solid' }, alignment: { horizontal: ci >= 3 ? 'right' : 'left' } }
          : dStyle([3,5,6,7,8,9,10].includes(ci) ? 'right' : ci === 11 ? 'center' : 'left');
      });
    });

    ws3['!cols'] = [{wch:12},{wch:22},{wch:25},{wch:7},{wch:8},{wch:16},{wch:7},{wch:16},{wch:14},{wch:16},{wch:12},{wch:16},{wch:20}];
    ws3['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:12} }, { s:{r:1,c:0}, e:{r:1,c:12} }];
    ws3['!rows'] = [{ hpt: 26 }, { hpt: 16 }, { hpt: 6 }, { hpt: 22 }];
    ws3['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:4+iRows.length-1,c:12} });
    XLSX.utils.book_append_sheet(wb, ws3, '📥 Nhập hàng');
  }

  // ─── 4. SHEET: CÔNG NỢ ──────────────────────────────────────
  if (sheetChoice === 'all' || sheetChoice === 'debt') {
    // Công nợ khách hàng
    const debtSales = sales.filter(s => s.status === 'debt');
    const custHeaders = ['Ngày','Khách hàng','SĐT','Sản phẩm','Tổng tiền (đ)','Đã thu (đ)','Còn nợ (đ)','Số ngày nợ'];
    const custRows = debtSales.map(s => {
      const daysDiff = Math.floor((new Date() - new Date(s.date)) / 86400000);
      return [
        fmtD(s.date), s.customer||'', s.phone||'', s.productName||'',
        numFmt(s.total), numFmt(s.paid),
        numFmt((s.total||0)-(s.paid||0)),
        daysDiff
      ];
    });
    const totCustDebt = debtSales.reduce((a,s) => a + Math.max(0,(s.total||0)-(s.paid||0)), 0);
    custRows.push(['TỔNG NỢ KHÁCH','','','','','', numFmt(totCustDebt),'']);

    // Công nợ nhà cung cấp
    const debtImports = imports.filter(i => i.status === 'debt');
    const suppHeaders = ['Ngày','Nhà cung cấp','Sản phẩm','Tổng tiền (đ)','Đã trả (đ)','Còn nợ NCC (đ)','Số ngày nợ'];
    const suppRows = debtImports.map(i => {
      const daysDiff = Math.floor((new Date() - new Date(i.date)) / 86400000);
      return [
        fmtD(i.date), i.supplier||'', i.productName||'',
        numFmt(i.total), numFmt(i.paid),
        numFmt((i.total||0)-(i.paid||0)),
        daysDiff
      ];
    });
    const totSuppDebt = debtImports.reduce((a,i) => a + Math.max(0,(i.total||0)-(i.paid||0)), 0);
    suppRows.push(['TỔNG NỢ NCC','','','','', numFmt(totSuppDebt),'']);

    const ws4 = XLSX.utils.aoa_to_sheet([]);
    const gapRow = 4 + custRows.length + 2; // gap giữa 2 bảng
    XLSX.utils.sheet_add_aoa(ws4, [
      [shop + ' — BÁO CÁO CÔNG NỢ'],
      ['Ngày xuất: ' + fmtD(dateStr)],
      [],
      ['🔴 CÔNG NỢ KHÁCH HÀNG — ' + debtSales.length + ' đơn chưa thu — Tổng: ' + fmt(totCustDebt) + 'đ'],
      custHeaders,
      ...custRows,
      [],
      ['🟠 CÔNG NỢ NHÀ CUNG CẤP — ' + debtImports.length + ' phiếu chưa trả — Tổng: ' + fmt(totSuppDebt) + 'đ'],
      suppHeaders,
      ...suppRows
    ]);

    ws4['A1'] = { v: shop + ' — BÁO CÁO CÔNG NỢ', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: 'C0392B' } } } };
    ws4['A4'] = { v: '🔴 CÔNG NỢ KHÁCH HÀNG — ' + debtSales.length + ' đơn chưa thu — Tổng: ' + fmt(totCustDebt) + 'đ', t: 's',
      s: { font: { bold: true, sz: 11, name: 'Arial', color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: 'C0392B' }, patternType: 'solid' } } };
    custHeaders.forEach((_, ci) => {
      const ca = XLSX.utils.encode_cell({ r: 4, c: ci });
      if (ws4[ca]) ws4[ca].s = hStyle(RED);
    });
    custRows.forEach((row, ri) => {
      const isLast = ri === custRows.length - 1;
      row.forEach((_, ci) => {
        const ca = XLSX.utils.encode_cell({ r: 5 + ri, c: ci });
        if (!ws4[ca]) return;
        ws4[ca].s = isLast
          ? { font: { bold: true, name: 'Arial', sz: 10, color: { rgb: 'C0392B' } }, fill: { fgColor: { rgb: 'FDECEA' }, patternType: 'solid' } }
          : dStyle([4,5,6,7].includes(ci) ? 'right' : 'left');
      });
    });

    const suppLabelRow = 4 + custRows.length + 2;
    if (ws4['A' + (suppLabelRow + 1)]) {
      ws4['A' + (suppLabelRow + 1)].s = { font: { bold: true, sz: 11, name: 'Arial', color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: 'E07010' }, patternType: 'solid' } };
    }

    ws4['!cols'] = [{wch:12},{wch:22},{wch:13},{wch:25},{wch:16},{wch:14},{wch:16},{wch:10}];
    ws4['!merges'] = [
      { s:{r:0,c:0}, e:{r:0,c:7} },
      { s:{r:1,c:0}, e:{r:1,c:7} },
      { s:{r:3,c:0}, e:{r:3,c:7} },
      { s:{r:suppLabelRow,c:0}, e:{r:suppLabelRow,c:6} }
    ];
    ws4['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:suppLabelRow+1+suppRows.length,c:7} });
    XLSX.utils.book_append_sheet(wb, ws4, '💳 Công nợ');
  }

  // ─── 5. SHEET: TRẢ HÀNG ─────────────────────────────────────
  if (sheetChoice === 'all' && returns && returns.length > 0) {
    const rHeaders = ['Ngày trả','Khách hàng','SĐT','Sản phẩm','SL trả','Đơn vị','Đơn giá (đ)','Giá trị hoàn (đ)','Lý do'];
    const rRows = [...returns].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r => [
      fmtD(r.date), r.customer||'', r.phone||'', r.productName||'',
      parseFloat(r.returnQty)||0, r.unit||'',
      numFmt(r.unitPrice), numFmt(r.refundValue), r.reason||''
    ]);
    const totRef = returns.reduce((a,r) => a + (r.refundValue||0), 0);
    rRows.push(['TỔNG CỘNG','','','',returns.reduce((a,r)=>a+(parseFloat(r.returnQty)||0),0),'','',numFmt(totRef),'']);

    const ws5 = XLSX.utils.aoa_to_sheet([]);
    XLSX.utils.sheet_add_aoa(ws5, [
      [shop + ' — PHIẾU TRẢ HÀNG'],
      ['Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + returns.length + ' phiếu trả'],
      [], rHeaders, ...rRows
    ]);
    ws5['A1'] = { v: shop + ' — PHIẾU TRẢ HÀNG', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: '6a0dad' } } } };
    rHeaders.forEach((_, ci) => {
      const ca = XLSX.utils.encode_cell({ r: 3, c: ci });
      if (ws5[ca]) ws5[ca].s = hStyle(PURPLE);
    });
    rRows.forEach((row, ri) => {
      row.forEach((_, ci) => {
        const ca = XLSX.utils.encode_cell({ r: 4 + ri, c: ci });
        if (!ws5[ca]) return;
        ws5[ca].s = ri === rRows.length-1
          ? { font: { bold: true, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: 'F3E5F5' }, patternType: 'solid' } }
          : dStyle([4,6,7].includes(ci) ? 'right' : 'left');
      });
    });
    ws5['!cols'] = [{wch:12},{wch:20},{wch:12},{wch:25},{wch:10},{wch:8},{wch:14},{wch:16},{wch:30}];
    ws5['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:8} }, { s:{r:1,c:0}, e:{r:1,c:8} }];
    ws5['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:4+rRows.length-1,c:8} });
    XLSX.utils.book_append_sheet(wb, ws5, '🔄 Trả hàng');
  }

  // ─── 6. SHEET: THU CHI ──────────────────────────────────────
  if (sheetChoice === 'all' || sheetChoice === 'cashflow') {
    const cfHeaders = ['Ngày','Loại','Danh mục','Ghi chú','Số tiền (đ)'];
    const cfList = [...(cashflows || [])].sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const cfRows = cfList.map(c => [
      fmtD(c.date), c.type === 'income' ? '💵 Thu' : '💸 Chi', c.category || '', c.note || '', numFmt(c.amount)
    ]);
    const totIncome  = (cashflows || []).filter(c => c.type === 'income').reduce((a,c) => a + (c.amount||0), 0);
    const totExpense = (cashflows || []).filter(c => c.type === 'expense').reduce((a,c) => a + (c.amount||0), 0);
    const sumStartRow = 4 + cfRows.length + 1; // dòng trống ngăn cách
    cfRows.push([]); // dòng trống trước phần tổng hợp
    cfRows.push(['TỔNG THU PHÁT SINH','','','', numFmt(totIncome)]);
    cfRows.push(['TỔNG CHI PHÁT SINH','','','', numFmt(totExpense)]);
    cfRows.push(['CHÊNH LỆCH (Thu − Chi)','','','', numFmt(totIncome - totExpense)]);

    const ws6 = XLSX.utils.aoa_to_sheet([]);
    XLSX.utils.sheet_add_aoa(ws6, [
      [shop + ' — BÁO CÁO THU CHI PHÁT SINH'],
      ['Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + cfList.length + ' phiếu'],
      [],
      cfHeaders,
      ...cfRows
    ]);
    ws6['A1'] = { v: shop + ' — BÁO CÁO THU CHI PHÁT SINH', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: '17a2a2' } } } };
    ws6['A2'] = { v: 'Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + cfList.length + ' phiếu', t: 's', s: { font: { italic: true, sz: 10, name: 'Arial', color: { rgb: '888888' } } } };
    cfHeaders.forEach((_, ci) => {
      const ca = XLSX.utils.encode_cell({ r: 3, c: ci });
      if (ws6[ca]) ws6[ca].s = hStyle(TEAL);
    });
    cfRows.forEach((row, ri) => {
      row.forEach((_, ci) => {
        const ca = XLSX.utils.encode_cell({ r: 4 + ri, c: ci });
        if (!ws6[ca]) return;
        const isSummary = 4 + ri >= sumStartRow;
        ws6[ca].s = isSummary
          ? { font: { bold: true, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: 'E0F7F7' }, patternType: 'solid' }, alignment: { horizontal: ci === 4 ? 'right' : 'left' } }
          : dStyle(ci === 4 ? 'right' : 'left');
      });
    });
    ws6['!cols'] = [{wch:12},{wch:10},{wch:24},{wch:32},{wch:16}];
    ws6['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:4} }, { s:{r:1,c:0}, e:{r:1,c:4} }];
    ws6['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:4+cfRows.length-1,c:4} });
    XLSX.utils.book_append_sheet(wb, ws6, '💵 Thu Chi');
  }

  // ─── 7. SHEET: LỢI NHUẬN ─────────────────────────────────────
  // Công thức giống đúng trang "Lợi Nhuận" trong app, có tách chi tiết VAT đầu ra/đầu vào
  // để đối chiếu với hoá đơn giấy / số liệu kê khai thuế thực tế.
  // Lợi nhuận thực = Doanh thu thuần − Giá vốn hàng bán (COGS) − Phí VC cửa hàng tự chịu
  if (sheetChoice === 'all' || sheetChoice === 'profit') {
    function _expCogsDetailForSale(s) {
      const sQty = parseFloat(s.qty) || 0;
      const saleVatRate = s.vatRate || 0;
      const candidates = [...(imports || [])].filter(i => i.productId === s.productId && i.date <= s.date).sort((a,b) => b.date.localeCompare(a.date));
      const imp = s.variantId ? (candidates.find(i => i.variantId === s.variantId) || candidates[0]) : candidates[0];
      if (!imp) {
        const buyPrice = (products || []).find(p => p.id === s.productId)?.buyPrice || 0;
        return { unitPriceNet: buyPrice, impVatRate: 0, impVatAmt: 0, goodsCostCharged: buyPrice * sQty, shipCostNet: 0, shipVatAmt: 0, totalCost: buyPrice * sQty };
      }
      const unitPriceNet = imp.unitPrice || 0;
      const impVatRate   = imp.vatRate   || 0;
      const grossUpApplied = (saleVatRate === 0 && impVatRate > 0);
      const costPerUnit  = grossUpApplied ? unitPriceNet * (1 + impVatRate/100) : unitPriceNet;
      const goodsCostCharged = costPerUnit * sQty;
      const impVatAmt    = unitPriceNet * (impVatRate/100) * sQty;
      const impShipFee    = imp.shipFee    || 0;
      const impShipVatR   = imp.shipVatRate || 0;
      const impShipFeeNet = impShipVatR > 0 ? impShipFee/(1 + impShipVatR/100) : impShipFee;
      const impShipVatAmt = impShipFee - impShipFeeNet;
      const impQty = parseFloat(imp.qty) || 1;
      const shipCostNet = impQty > 0 ? (impShipFeeNet/impQty) * sQty : 0;
      const shipVatAmt  = impQty > 0 ? (impShipVatAmt/impQty) * sQty : 0;
      return { unitPriceNet, impVatRate, impVatAmt, goodsCostCharged, shipCostNet, shipVatAmt, totalCost: goodsCostCharged + shipCostNet };
    }
    function _expProfitForSale(s) {
      const cd      = _expCogsDetailForSale(s);
      const revenue = s.subTotal != null ? s.subTotal : Math.max(0, (s.total||0) - (s.shipFee||0) - (s.vatAmt||0));
      const vatOut  = s.vatAmt || 0;
      const total   = s.total != null ? s.total : (revenue + vatOut);
      const shipVatR = s.shipVatRate || 0;
      const vcStore    = (!s.shipForCustomer && s.shipFee) ? (shipVatR > 0 ? (s.shipFee/(1+shipVatR/100)) : s.shipFee) : 0;
      const vcStoreVat = (!s.shipForCustomer && s.shipFee && shipVatR > 0) ? (s.shipFee - vcStore) : 0;
      const cogs    = cd.totalCost;
      const profit  = revenue - cogs - vcStore;
      // Đơn bán VAT=0% → VAT đầu vào hàng đã gộp vào giá vốn (không được khấu trừ),
      // nên KHÔNG tính lại vào đối chiếu VAT (tránh đếm 2 lần). Chỉ đơn có VAT mới đối chiếu.
      const hasVat     = (s.vatRate || 0) > 0;
      const vatInTotal = (hasVat ? cd.impVatAmt : 0) + cd.shipVatAmt + vcStoreVat;
      const vatNetEst  = hasVat ? (vatOut - vatInTotal) : null;
      return { revenue, vatOut, total, unitPriceNet: cd.unitPriceNet, impVatRate: cd.impVatRate, impVatAmt: cd.impVatAmt, cogs, vcStore, vatNetEst, profit };
    }

    const plCalc = [...sales].sort((a,b) => (b.date||'').localeCompare(a.date||'')).map(s => ({ s, r: _expProfitForSale(s) }));
    const plHeaders = ['Ngày','Khách hàng','Sản phẩm','SL','VAT bán (%)','Tạm tính/DT thuần (đ)','VAT đầu ra (đ)','Tổng cộng - khách trả (đ)','Giá nhập/đơn vị (đ)','VAT nhập (%)','VAT đầu vào hàng (đ)','Giá vốn tính LN (đ)','VC tự chịu (đ)','VAT phải nộp riêng đơn* (đ)','Lợi nhuận (đ)','Biên LN (%)'];
    const plRows = plCalc.map(({ s, r }) => {
      const margin = r.revenue > 0 ? (r.profit/r.revenue*100) : 0;
      return [fmtD(s.date), s.customer||'', s.productName||'', parseFloat(s.qty)||0,
        s.vatRate||0, numFmt(r.revenue), numFmt(r.vatOut), numFmt(r.total),
        numFmt(r.unitPriceNet), r.impVatRate||0, numFmt(r.impVatAmt),
        numFmt(r.cogs), numFmt(r.vcStore), (r.vatNetEst==null ? '—' : numFmt(r.vatNetEst)), numFmt(r.profit), margin.toFixed(1)+'%'];
    });
    const totRevenueAll = plCalc.reduce((a,{r}) => a + r.revenue, 0);
    const totVatOutAll  = plCalc.reduce((a,{r}) => a + r.vatOut, 0);
    const totGrossAll   = plCalc.reduce((a,{r}) => a + r.total, 0);
    const totVatInAll   = plCalc.reduce((a,{r}) => a + r.impVatAmt, 0);
    const totCogsAll    = plCalc.reduce((a,{r}) => a + r.cogs, 0);
    const totVcAll      = plCalc.reduce((a,{r}) => a + r.vcStore, 0);
    const totVatNetAll  = plCalc.reduce((a,{r}) => a + (r.vatNetEst || 0), 0);
    const totProfitAll  = plCalc.reduce((a,{r}) => a + r.profit, 0);
    const marginAll      = totRevenueAll > 0 ? (totProfitAll/totRevenueAll*100) : 0;
    plRows.push(['TỔNG CỘNG','','','','', numFmt(totRevenueAll), numFmt(totVatOutAll), numFmt(totGrossAll), '', '', numFmt(totVatInAll), numFmt(totCogsAll), numFmt(totVcAll), numFmt(totVatNetAll), numFmt(totProfitAll), marginAll.toFixed(1)+'%']);

    // Ghép thêm Thu/Chi phát sinh để ra lợi nhuận thực tế cuối kỳ (toàn bộ thời gian)
    const cfIncomeAll  = (cashflows || []).filter(c => c.type === 'income').reduce((a,c) => a + (c.amount||0), 0);
    const cfExpenseAll = (cashflows || []).filter(c => c.type === 'expense').reduce((a,c) => a + (c.amount||0), 0);
    const finalProfit  = totProfitAll + cfIncomeAll - cfExpenseAll;
    const sumRows = [
      [],
      ['📊 LỢI NHUẬN THỰC TẾ CUỐI KỲ (đã gộp Thu/Chi phát sinh)'],
      ['Lợi nhuận gộp từ bán hàng (đ)', numFmt(totProfitAll)],
      ['+ Thu phát sinh khác (đ)', numFmt(cfIncomeAll)],
      ['− Chi phát sinh khác (đ)', numFmt(cfExpenseAll)],
      ['= LỢI NHUẬN THỰC TẾ (đ)', numFmt(finalProfit)],
      [],
      ['* Cột "VAT phải nộp riêng đơn" chỉ mang tính tham khảo cho từng đơn lẻ. VAT phải nộp thực tế nhà nước được tính theo KỲ KÊ KHAI (gộp toàn bộ đơn bán + phiếu nhập trong kỳ), không tính riêng theo từng đơn — xem số chính xác tại trang Tổng Quan trong ứng dụng.'],
    ];

    const ws7 = XLSX.utils.aoa_to_sheet([]);
    XLSX.utils.sheet_add_aoa(ws7, [
      [shop + ' — BÁO CÁO LỢI NHUẬN'],
      ['Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + sales.length + ' đơn bán'],
      [],
      plHeaders,
      ...plRows,
      ...sumRows
    ]);
    ws7['A1'] = { v: shop + ' — BÁO CÁO LỢI NHUẬN', t: 's', s: { font: { bold: true, sz: 14, name: 'Arial', color: { rgb: GREEN } } } };
    ws7['A2'] = { v: 'Ngày xuất: ' + fmtD(dateStr) + '  |  Tổng ' + sales.length + ' đơn bán', t: 's', s: { font: { italic: true, sz: 10, name: 'Arial', color: { rgb: '888888' } } } };
    plHeaders.forEach((_, ci) => {
      const ca = XLSX.utils.encode_cell({ r: 3, c: ci });
      if (ws7[ca]) ws7[ca].s = hStyle(GREEN);
    });
    plRows.forEach((row, ri) => {
      row.forEach((_, ci) => {
        const ca = XLSX.utils.encode_cell({ r: 4 + ri, c: ci });
        if (!ws7[ca]) return;
        const isLast = ri === plRows.length - 1;
        ws7[ca].s = isLast
          ? { font: { bold: true, name: 'Arial', sz: 10 }, fill: { fgColor: { rgb: 'E8F5E9' }, patternType: 'solid' }, alignment: { horizontal: ci >= 3 ? 'right' : 'left' } }
          : dStyle(ci >= 3 ? 'right' : 'left');
      });
    });
    // Style khối tổng kết Lợi nhuận thực tế
    const sumBaseRow = 4 + plRows.length;
    const sumLabelCellRow = sumBaseRow + 1;
    if (ws7['A' + (sumLabelCellRow + 1)]) {
      ws7['A' + (sumLabelCellRow + 1)].s = { font: { bold: true, sz: 12, name: 'Arial', color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: GREEN }, patternType: 'solid' } };
    }
    for (let ri = sumLabelCellRow + 1; ri <= sumLabelCellRow + 4; ri++) {
      const a = ws7['A' + (ri + 1)], b = ws7['B' + (ri + 1)];
      const isFinal = ri === sumLabelCellRow + 4;
      if (a) a.s = { font: { bold: isFinal, name: 'Arial', sz: isFinal ? 12 : 10, color: { rgb: isFinal ? GREEN : '333333' } } };
      if (b) b.s = { font: { bold: true, name: 'Arial', sz: isFinal ? 12 : 10, color: { rgb: isFinal ? GREEN : '333333' } }, alignment: { horizontal: 'right' } };
    }
    const footnoteRow = sumLabelCellRow + 6;
    if (ws7['A' + (footnoteRow + 1)]) {
      ws7['A' + (footnoteRow + 1)].s = { font: { italic: true, sz: 9, name: 'Arial', color: { rgb: '999999' } } };
    }
    ws7['!cols'] = [{wch:12},{wch:18},{wch:24},{wch:8},{wch:9},{wch:16},{wch:14},{wch:16},{wch:14},{wch:9},{wch:14},{wch:14},{wch:12},{wch:16},{wch:14},{wch:10}];
    ws7['!merges'] = [{ s:{r:0,c:0}, e:{r:0,c:15} }, { s:{r:1,c:0}, e:{r:1,c:15} }, { s:{r:sumLabelCellRow,c:0}, e:{r:sumLabelCellRow,c:15} }, { s:{r:footnoteRow,c:0}, e:{r:footnoteRow,c:15} }];
    ws7['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:4+plRows.length+sumRows.length-1,c:15} });
    XLSX.utils.book_append_sheet(wb, ws7, '📈 Lợi Nhuận');
  }

  // ─── Tải file xuống ──────────────────────────────────────────
  const sheetNames = { all:'ToanBo', inventory:'KhoHang', sales:'BanHang', imports:'NhapHang', debt:'CongNo', cashflow:'ThuChi', profit:'LoiNhuan' };
  const filename = shop.replace(/\s/g,'') + '_' + sheetNames[sheetChoice] + '_' + dateStr.replace(/-/g,'') + '.xlsx';
  XLSX.writeFile(wb, filename);
  toast('✅ Đã xuất Excel: ' + filename, 'success');
}

// ═══════════════════════════════════════════════════════════════
//  EXCEL IMPORT / KHÔI PHỤC — đọc lại file do exportExcel() tạo
//  (hoặc file cùng cấu trúc 3 sheet: Kho hàng / Bán hàng / Nhập hàng)
//  rồi MERGE AN TOÀN vào dữ liệu hiện có (không ghi đè dữ liệu đã có,
//  không tạo trùng đơn/phiếu), sau đó push phần mới/đổi lên Firebase.
// ═══════════════════════════════════════════════════════════════

// Chuẩn hoá tên để so khớp: bỏ dấu, bỏ hoa/thường, gọn khoảng trắng
function _normVi(s) {
  return (s == null ? '' : s.toString())
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D')
    .toLowerCase().trim().replace(/\s+/g, ' ');
}

// Chuyển ngày từ Excel (chuỗi dd/mm/yyyy, chuỗi yyyy-mm-dd, Date, hoặc số serial) → 'yyyy-mm-dd'
function _excelToISO(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v.getTime())) {
    const off = v.getTimezoneOffset();
    return new Date(v.getTime() - off * 60000).toISOString().slice(0, 10);
  }
  const s = v.toString().trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); // dd/mm/yyyy → yyyy-mm-dd
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  if (/^\d+(\.\d+)?$/.test(s)) {
    const n = parseFloat(s);
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  }
  return '';
}

// Map tên-cột-header → chỉ số cột, để đọc theo TÊN cột (không lệ thuộc thứ tự/số cột,
// vì các bản Excel cũ/mới có thể thiếu/thừa vài cột như "Mã SKU")
function _headerMap(row) {
  const map = {};
  (row || []).forEach((c, i) => {
    const k = (c == null ? '' : c.toString()).trim();
    if (k) map[k] = i;
  });
  return map;
}
function _cell(row, map, key, dflt) {
  const i = map[key];
  const v = (i !== undefined) ? row[i] : undefined;
  return (v === undefined || v === null || v === '') ? dflt : v;
}
function _findHeaderRowIdx(rows, mustHaveKey) {
  for (let i = 0; i < rows.length; i++) {
    if ((rows[i] || []).some(c => (c == null ? '' : c.toString()).trim() === mustHaveKey)) return i;
  }
  return -1;
}

// Đọc file Excel (.xlsx) → dữ liệu thô { products, sales, imports }
function parseExcelBackup(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  const sheetRows = frag => {
    const n = wb.SheetNames.find(nm => nm.includes(frag));
    return n ? XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }) : [];
  };

  const out = { products: [], sales: [], imports: [], cashflows: [] };

  // ── KHO HÀNG ──
  const invRows = sheetRows('Kho hàng');
  const invHIdx = _findHeaderRowIdx(invRows, 'Tên sản phẩm');
  if (invHIdx >= 0) {
    const map = _headerMap(invRows[invHIdx]);
    for (let i = invHIdx + 1; i < invRows.length; i++) {
      const row = invRows[i];
      const name = (_cell(row, map, 'Tên sản phẩm', '') || '').toString().trim();
      if (!name || name.startsWith('TỔNG')) continue;
      out.products.push({
        name,
        sku: (_cell(row, map, 'Mã SKU', '') || '').toString().trim(),
        type: (_cell(row, map, 'Loại đá', '') || '').toString().trim(),
        origin: (_cell(row, map, 'Xuất xứ', '') || '').toString().trim(),
        unit: (_cell(row, map, 'Đơn vị', '') || '').toString().trim(),
        buyPrice: parseFloat(_cell(row, map, 'Giá nhập (đ)', 0)) || 0,
        sellPrice: parseFloat(_cell(row, map, 'Giá bán (đ)', 0)) || 0,
        stock: parseFloat(_cell(row, map, 'Tồn kho', 0)) || 0,
        description: (_cell(row, map, 'Mô tả', '') || '').toString().trim()
      });
    }
  }

  // ── BÁN HÀNG ──
  const saleRows = sheetRows('Bán hàng');
  const saleHIdx = _findHeaderRowIdx(saleRows, 'Khách hàng');
  if (saleHIdx >= 0) {
    const map = _headerMap(saleRows[saleHIdx]);
    for (let i = saleHIdx + 1; i < saleRows.length; i++) {
      const row = saleRows[i];
      const rawDate = _cell(row, map, 'Ngày', '');
      if ((rawDate || '').toString().startsWith('TỔNG')) continue;
      const productName = (_cell(row, map, 'Sản phẩm', '') || '').toString().trim();
      const iso = _excelToISO(rawDate);
      if (!productName || !iso) continue;
      out.sales.push({
        date: iso,
        customer: (_cell(row, map, 'Khách hàng', '') || '').toString().trim(),
        phone: (_cell(row, map, 'SĐT', '') || '').toString().trim(),
        productName,
        qty: parseFloat(_cell(row, map, 'SL', 0)) || 0,
        unit: (_cell(row, map, 'Đơn vị', '') || '').toString().trim(),
        unitPrice: parseFloat(_cell(row, map, 'Đơn giá (đ)', 0)) || 0,
        vatRate: parseFloat(_cell(row, map, 'VAT %', 0)) || 0,
        subTotal: parseFloat(_cell(row, map, 'Doanh thu thuần (đ)', 0)) || 0,
        vatAmt: parseFloat(_cell(row, map, 'VAT (đ)', 0)) || 0,
        total: parseFloat(_cell(row, map, 'Tổng tiền (đ)', 0)) || 0,
        paid: parseFloat(_cell(row, map, 'Đã thu (đ)', 0)) || 0,
        statusText: (_cell(row, map, 'Trạng thái', '') || '').toString().trim(),
        note: (_cell(row, map, 'Ghi chú', '') || '').toString().trim()
      });
    }
  }

  // ── NHẬP HÀNG ──
  const impRows = sheetRows('Nhập hàng');
  const impHIdx = _findHeaderRowIdx(impRows, 'Nhà cung cấp');
  if (impHIdx >= 0) {
    const map = _headerMap(impRows[impHIdx]);
    for (let i = impHIdx + 1; i < impRows.length; i++) {
      const row = impRows[i];
      const rawDate = _cell(row, map, 'Ngày nhập', '');
      if ((rawDate || '').toString().startsWith('TỔNG')) continue;
      const productName = (_cell(row, map, 'Sản phẩm', '') || '').toString().trim();
      const iso = _excelToISO(rawDate);
      if (!productName || !iso) continue;
      out.imports.push({
        date: iso,
        supplier: (_cell(row, map, 'Nhà cung cấp', '') || '').toString().trim(),
        productName,
        qty: parseFloat(_cell(row, map, 'SL', 0)) || 0,
        unit: (_cell(row, map, 'Đơn vị', '') || '').toString().trim(),
        unitPrice: parseFloat(_cell(row, map, 'Đơn giá (đ)', 0)) || 0,
        vatRate: parseFloat(_cell(row, map, 'VAT %', 0)) || 0,
        total: parseFloat(_cell(row, map, 'Tổng tiền (đ)', 0)) || 0,
        paid: parseFloat(_cell(row, map, 'Đã trả (đ)', 0)) || 0,
        shipFee: parseFloat(_cell(row, map, 'Phí VC (đ)', 0)) || 0,
        statusText: (_cell(row, map, 'Trạng thái', '') || '').toString().trim(),
        note: (_cell(row, map, 'Ghi chú', '') || '').toString().trim()
      });
    }
  }

  // ── THU CHI ──
  const cfRowsRaw = sheetRows('Thu Chi');
  const cfHIdx = _findHeaderRowIdx(cfRowsRaw, 'Danh mục');
  if (cfHIdx >= 0) {
    const map = _headerMap(cfRowsRaw[cfHIdx]);
    for (let i = cfHIdx + 1; i < cfRowsRaw.length; i++) {
      const row = cfRowsRaw[i];
      const rawDate = _cell(row, map, 'Ngày', '');
      const dateText = (rawDate || '').toString().trim();
      if (!dateText || dateText.startsWith('TỔNG') || dateText.startsWith('CHÊNH')) continue;
      const iso = _excelToISO(rawDate);
      if (!iso) continue;
      const loaiText = (_cell(row, map, 'Loại', '') || '').toString();
      const type = loaiText.includes('Thu') ? 'income' : (loaiText.includes('Chi') ? 'expense' : '');
      if (!type) continue;
      out.cashflows.push({
        date: iso, type,
        category: (_cell(row, map, 'Danh mục', '') || '').toString().trim(),
        note: (_cell(row, map, 'Ghi chú', '') || '').toString().trim(),
        amount: parseFloat(_cell(row, map, 'Số tiền (đ)', 0)) || 0
      });
    }
  }

  return out;
}

// Áp dữ liệu đã parse vào state. commit=false → chỉ tính số liệu xem trước (không sửa S).
// commit=true → ghi thật vào S và push lên Firebase qua save().
function applyExcelRestore(parsed, commit) {
  const now = new Date().toISOString();
  const stats = { prodNew: 0, prodUpdated: 0, saleNew: 0, saleSkip: 0, impNew: 0, impSkip: 0, cfNew: 0, cfSkip: 0 };

  const products  = commit ? S.products  : JSON.parse(JSON.stringify(S.products  || []));
  const sales      = commit ? S.sales      : JSON.parse(JSON.stringify(S.sales      || []));
  const imports    = commit ? S.imports    : JSON.parse(JSON.stringify(S.imports    || []));
  const cashflows  = commit ? (S.cashflows || (S.cashflows = [])) : JSON.parse(JSON.stringify(S.cashflows || []));

  const nameIndex = new Map();
  const skuIndex  = new Map(); // FIX (nhân đôi SP): đối chiếu thêm theo SKU, không chỉ theo tên
  products.forEach(p => { nameIndex.set(_normVi(p.name), p); if (p.sku) skuIndex.set(String(p.sku).toLowerCase(), p); });

  // 1) KHO HÀNG — CHỈ điền vào trường còn trống/0 của sản phẩm đã có
  //    (không bao giờ ghi đè giá trị đang khác 0/khác rỗng) — an toàn cho khôi phục.
  //    Sản phẩm không tìm thấy theo tên → coi là sản phẩm đã bị mất, tạo lại mới.
  parsed.products.forEach(ep => {
    const key = _normVi(ep.name);
    // Đối chiếu theo tên HOẶC mã SKU — tránh tạo trùng khi tên lệch nhẹ nhưng SKU giống
    const existing = nameIndex.get(key) || (ep.sku ? skuIndex.get(String(ep.sku).toLowerCase()) : null);
    if (existing) {
      let changed = false;
      const fill = (field, val) => { if (val && !existing[field]) { existing[field] = val; changed = true; } };
      fill('type', ep.type); fill('origin', ep.origin); fill('unit', ep.unit);
      fill('buyPrice', ep.buyPrice); fill('sellPrice', ep.sellPrice);
      fill('description', ep.description); fill('sku', ep.sku);
      if (!existing.stock && ep.stock) { existing.stock = ep.stock; changed = true; }
      if (changed) { existing._updated = now; stats.prodUpdated++; }
    } else {
      const np = {
        id: 'p' + uid(), name: ep.name,
        sku: ep.sku || generateSKU(ep.name, products),
        type: ep.type || '', origin: ep.origin || '', unit: ep.unit || 'm²',
        buyPrice: ep.buyPrice || 0, sellPrice: ep.sellPrice || 0, stock: ep.stock || 0,
        description: ep.description || '', variants: [],
        createdAt: now, _updated: now, _stockTx: [], _recoveredFromExcel: true
      };
      products.push(np); nameIndex.set(key, np); if (np.sku) skuIndex.set(String(np.sku).toLowerCase(), np); stats.prodNew++;
    }
  });

  // Tìm/sinh productId cho 1 dòng bán/nhập (một số SP trong đơn bán/phiếu nhập
  // có thể không còn nằm trong sheet Kho hàng do đã bị xoá/gộp trước đó)
  function resolveProduct(name, unit, priceGuess) {
    const key = _normVi(name);
    let p = nameIndex.get(key);
    if (!p) {
      p = {
        id: 'p' + uid(), name, sku: generateSKU(name, products),
        type: '', origin: '', unit: unit || 'm²', buyPrice: 0, sellPrice: priceGuess || 0,
        stock: 0, description: '', variants: [], createdAt: now, _updated: now, _stockTx: [],
        _recoveredFromExcel: true
      };
      products.push(p); nameIndex.set(key, p); if (p.sku) skuIndex.set(String(p.sku).toLowerCase(), p); stats.prodNew++;
    }
    return p;
  }

  // 2) BÁN HÀNG — bỏ qua nếu trùng (ngày + khách + sản phẩm + SL + đơn giá)
  const saleKeyOf = s => [s.date, _normVi(s.customer), _normVi(s.productName),
    Math.round((parseFloat(s.qty) || 0) * 100), Math.round(parseFloat(s.unitPrice) || 0)].join('|');
  const existingSaleKeys = new Set(sales.map(saleKeyOf));
  const newSales = [];
  parsed.sales.forEach(es => {
    const k = saleKeyOf(es);
    if (existingSaleKeys.has(k)) { stats.saleSkip++; return; }
    const prod = resolveProduct(es.productName, es.unit, es.unitPrice);
    newSales.push({
      id: 's' + uid(), orderId: 'recov' + uid(), date: es.date,
      customer: es.customer, phone: es.phone, address: '',
      productId: prod.id, productName: prod.name,
      qty: es.qty, unit: es.unit || prod.unit, unitPrice: es.unitPrice, vatRate: es.vatRate,
      subTotal: es.subTotal, vatAmt: es.vatAmt, total: es.total, paid: es.paid,
      shipFee: 0, shipForCustomer: false, variantId: null, variantSize: null,
      status: es.statusText === 'Đã thanh toán' ? 'done' : 'debt',
      note: (es.note ? es.note + ' — ' : '') + 'Khôi phục từ Excel',
      createdAt: now, _updated: now, _recoveredFromExcel: true
    });
    existingSaleKeys.add(k); stats.saleNew++;
  });

  // 3) NHẬP HÀNG — tương tự, bỏ qua nếu trùng (ngày + NCC + sản phẩm + SL + đơn giá)
  const impKeyOf = s => [s.date, _normVi(s.supplier), _normVi(s.productName),
    Math.round((parseFloat(s.qty) || 0) * 100), Math.round(parseFloat(s.unitPrice) || 0)].join('|');
  const existingImpKeys = new Set(imports.map(impKeyOf));
  const newImports = [];
  parsed.imports.forEach(ei => {
    const k = impKeyOf(ei);
    if (existingImpKeys.has(k)) { stats.impSkip++; return; }
    const prod = resolveProduct(ei.productName, ei.unit, null);
    newImports.push({
      id: 'i' + uid(), date: ei.date, supplier: ei.supplier,
      productId: prod.id, productName: prod.name,
      qty: ei.qty, unit: ei.unit || prod.unit, unitPrice: ei.unitPrice, vatRate: ei.vatRate,
      total: ei.total, paid: ei.paid, variantId: null,
      shipFee: ei.shipFee || 0, shipUnit: '', shipVatRate: 0, shipQty: '', shipUnitPrice: '',
      status: ei.statusText === 'Đã thanh toán' ? 'paid' : 'debt',
      note: (ei.note ? ei.note + ' — ' : '') + 'Khôi phục từ Excel',
      createdAt: now, _updated: now, _recoveredFromExcel: true
    });
    existingImpKeys.add(k); stats.impNew++;
  });

  // 4) THU CHI — bỏ qua nếu trùng (ngày + loại + danh mục + ghi chú + số tiền)
  const cfKeyOf = c => [c.date, c.type, _normVi(c.category), _normVi(c.note), Math.round(parseFloat(c.amount) || 0)].join('|');
  const existingCfKeys = new Set(cashflows.map(cfKeyOf));
  const newCashflows = [];
  (parsed.cashflows || []).forEach(ec => {
    const k = cfKeyOf(ec);
    if (existingCfKeys.has(k)) { stats.cfSkip++; return; }
    newCashflows.push({
      id: uid(), date: ec.date, type: ec.type, category: ec.category, amount: ec.amount,
      note: (ec.note ? ec.note + ' — ' : '') + 'Khôi phục từ Excel',
      createdAt: now, _updated: now, _recoveredFromExcel: true
    });
    existingCfKeys.add(k); stats.cfNew++;
  });

  if (commit) {
    S.products = products;
    S.sales = [...newSales, ...sales];
    S.imports = [...newImports, ...imports];
    S.cashflows = [...newCashflows, ...cashflows];
    save('products'); save('sales'); save('imports'); save('cashflows');
  }

  return stats;
}

//  DOM HELPERS
// ═══════════════════════════════════════════════════════════════
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'className') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value' && (tag === 'input' || tag === 'textarea')) el.value = v ?? '';
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'disabled') { if (v) el.disabled = true; }
      else if (k === 'selected') { if (v) el.setAttribute('selected', ''); }
      else el.setAttribute(k, v);
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return el;
}

function inp(type, placeholder, value, onInput, extra = {}) {
  if (type === 'number') extra = { step: 'any', inputmode: 'decimal', ...extra };
  const el = h('input', { type, placeholder, value: value ?? '', className: 'form-input', ...extra });
  // IME composition guard: fix go tieng Viet (Unikey) bi vo chu khi rebuild()
  let _ime = false;
  el.addEventListener('compositionstart', () => { _ime = true; });
  el.addEventListener('compositionend', e => {
    _ime = false;
    onInput(e.target.value);
    if (!el.isConnected) {
      requestAnimationFrame(() => {
        const nw = [...document.querySelectorAll('input.form-input')].find(x => x.placeholder === placeholder && x.isConnected);
        if (nw) { nw.focus(); try { nw.setSelectionRange(nw.value.length, nw.value.length); } catch(_) {} }
      });
    }
  });
  el.addEventListener('input', e => {
    if (_ime) return; // dang composition (IME/bo go tieng Viet) - cho compositionend
    let caret = null;
    try { caret = e.target.selectionStart; } catch(_) {}
    onInput(e.target.value);
    if (!el.isConnected) {
      requestAnimationFrame(() => {
        const nw = [...document.querySelectorAll('input.form-input')].find(x => x.placeholder === placeholder && x.isConnected);
        if (nw) {
          nw.focus();
          if (caret != null) {
            try {
              const safePos = Math.min(caret, (nw.value || '').length);
              nw.setSelectionRange(safePos, safePos);
            } catch(_) {}
          }
        }
      });
    }
  });
  return el;
}

// Helpers không re-render — dùng cho modal để tránh mất focus
function mkInput(type, placeholder, value, onInput) {
  const el = document.createElement('input');
  Object.assign(el, { placeholder: placeholder, value: value ?? '', className: 'form-input', type });
  if (type === 'number') { el.step = 'any'; el.setAttribute('inputmode','decimal'); }
  el.addEventListener('input', e => onInput(e.target.value));
  // v7.5.0: validate số âm cho input number — cảnh báo nhưng không chặn (cho phép điều chỉnh)
  if (type === 'number') {
    el.addEventListener('blur', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v < 0) {
        e.target.style.borderColor = 'var(--red)';
        e.target.title = '⚠️ Giá trị âm — vui lòng kiểm tra lại';
      } else {
        e.target.style.borderColor = '';
        e.target.title = '';
      }
    });
    el.addEventListener('focus', e => { e.target.style.borderColor = ''; });
  }
  return el;
}
// ── mkAutocomplete: input với dropdown gợi ý (NCC / khách hàng) ──
function mkAutocomplete(placeholder, initValue, getSuggestions, onChange) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative;width:100%';

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'form-input';
  inp.placeholder = placeholder;
  inp.value = initValue || '';
  inp.autocomplete = 'off';

  const dropdown = document.createElement('div');
  dropdown.style.cssText = 'position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg3);border:1px solid var(--accent);border-radius:var(--r2);z-index:9999;max-height:220px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.5)';

  let activeIdx = -1;

  function showDropdown(items) {
    dropdown.innerHTML = '';
    activeIdx = -1;
    if (!items.length) { dropdown.style.display = 'none'; return; }
    items.forEach((text, i) => {
      const item = document.createElement('div');
      item.style.cssText = 'padding:10px 14px;font-size:13px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border);transition:background .12s';
      item.textContent = text;
      item.onmouseenter = () => { setActive(i); };
      item.onmouseleave = () => { item.style.background = ''; };
      item.onmousedown = e => {
        e.preventDefault();
        inp.value = text;
        onChange && onChange(text);
        dropdown.style.display = 'none';
      };
      dropdown.appendChild(item);
    });
    dropdown.style.display = 'block';
  }

  function setActive(i) {
    const kids = dropdown.querySelectorAll('div');
    kids.forEach((k, idx) => { k.style.background = idx === i ? 'var(--accent-dim)' : ''; });
    activeIdx = i;
  }

  function rebuild(q) {
    const sugs = getSuggestions(q);
    showDropdown(sugs);
  }

  inp.addEventListener('input', e => { onChange && onChange(e.target.value); rebuild(e.target.value); });
  inp.addEventListener('focus', () => { rebuild(inp.value); });
  inp.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  inp.addEventListener('keydown', e => {
    const kids = dropdown.querySelectorAll('div');
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(activeIdx + 1, kids.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(activeIdx - 1, 0)); }
    else if (e.key === 'Enter' && activeIdx >= 0 && kids[activeIdx]) {
      e.preventDefault();
      inp.value = kids[activeIdx].textContent;
      onChange && onChange(inp.value);
      dropdown.style.display = 'none';
    } else if (e.key === 'Escape') { dropdown.style.display = 'none'; }
  });

  wrap.appendChild(inp);
  wrap.appendChild(dropdown);
  // Expose .value for reading
  Object.defineProperty(wrap, 'value', { get: () => inp.value, set: v => { inp.value = v; } });
  wrap._inp = inp;
  return wrap;
}

function mkSelect(options, current, onChange) {
  const el = document.createElement('select');
  el.className = 'form-input';
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.value; opt.textContent = o.label;
    if (String(o.value) === String(current)) opt.selected = true;
    el.appendChild(opt);
  });
  el.addEventListener('change', e => onChange(e.target.value));
  return el;
}
function mkTextarea(placeholder, value, onInput) {
  const el = document.createElement('textarea');
  el.className = 'form-input'; el.placeholder = placeholder; el.value = value ?? '';
  el.addEventListener('input', e => onInput(e.target.value));
  return el;
}

function sel(options, current, onChange, extra = {}) {
  return h('select', { className: 'form-input', onChange: e => onChange(e.target.value), ...extra },
    ...options.map(o => h('option', { value: o.value, selected: String(current) === String(o.value) || undefined }, o.label))
  );
}

function fg(label, span, ...els) {
  return h('div', { className: 'form-group' + (span ? ' fg-full' : '') },
    h('label', { className: 'form-label' }, label),
    ...els.filter(Boolean)
  );
}

function th(t, right) { return h('th', right ? { style: { textAlign: 'right' } } : {}, t); }

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function toast(msg, type = 'info', duration = 3000) {
  if (S._toastTimer) clearTimeout(S._toastTimer);
  S.toast = { msg, type };
  render();
  S._toastTimer = setTimeout(() => { S.toast = null; render(); }, duration);
}

function go(page) { S.page = page; S.sidebarOpen = false; render(); }

function render() {
  if (_raf) return;
  _raf = true;
  requestAnimationFrame(() => {
    _raf = false;
    const root = document.getElementById('app');
    if (!root) return;
    const next = buildApp();
    root.innerHTML = '';
    root.appendChild(next);
  });
}

      ),
      h('div', { style: { display: 'flex', gap: 8, flexShrink: 0 } },
        isDanger && h('button', {
          className: 'btn btn-sm',
          style: { background: 'rgba(255,255,255,.15)', color: '#fff', border: '1px solid rgba(255,255,255,.3)', fontSize: 11 },
          onClick: () => {
            S.confirm = {
              msg: `🗂️ Tự động chuyển đơn hàng, phiếu nhập và thanh toán cũ hơn 12 tháng sang bộ nhớ archive để giải phóng dung lượng?\n\nDữ liệu cũ vẫn được giữ nguyên, không bị xoá.`,
              onYes: () => {
                const result = DB.archiveOldData();
                S.sales       = DB.get('dtn_sales',       S.sales);
                S.imports     = DB.get('dtn_imports',      S.imports);
                S.paymentlogs = DB.get('dtn_paymentlogs',  S.paymentlogs);
                toast(`✅ Đã archive ${result.archivedSales} đơn hàng + ${result.archivedImports} phiếu nhập cũ. Dung lượng hiện tại: ${DB.storageSize()} KB`, 'success');
                render();
              }
            };
            render();
          }
        }, '🗂️ Archive dữ liệu cũ'),
        h('button', {
          className: 'btn btn-sm',
          style: { background: 'rgba(255,255,255,.15)', color: '#fff', border: '1px solid rgba(255,255,255,.3)', fontSize: 11 },
          onClick: () => {
            const data = DB.exportAll();
            const a = document.createElement('a');
            a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
            a.download = 'DaTuNhien_backup_' + localDateStr(new Date()) + '.json';
            a.click();
            toast('✅ Đã xuất backup JSON! Lưu vào nơi an toàn.', 'success');
          }
        }, '💾 Xuất backup ngay')
      )
    ));
  }

  if (t) {
    const col = { success: 'var(--green)', error: 'var(--red)', info: 'var(--blue)' }[t.type] || 'var(--blue)';
    els.push(h('div', { className: 'toast', style: { borderLeft: `3px solid ${col}` } },
      h('span', { style: { fontSize: 18 } }, t.type === 'success' ? '✅' : t.type === 'error' ? '❌' : 'ℹ️'),
      t.msg
    ));
  }
  if (modal) els.push(buildModal(modal));
  if (confirm) els.push(buildConfirm(confirm));

  return h('div', { className: 'app' }, ...els);
}

function buildModal({ title, content, footer, large }) {
  return h('div', { className: 'modal-bg', onClick: e => { if (e.target === e.currentTarget) { S.modal = null; render(); } } },
    h('div', { className: 'modal' + (large ? ' modal-lg' : '') },
      h('div', { className: 'modal-header' },
        h('span', { className: 'modal-title' }, title),
        h('button', { className: 'btn btn-ghost btn-sm', onClick: () => { S.modal = null; render(); } }, '✕')
      ),
      content,
      footer && h('div', { className: 'modal-footer' }, ...footer)
    )
  );
}

function buildConfirm({ msg, onYes, isLogout }) {
  const close = () => { S.confirm = null; render(); };
  const confirmLabel = isLogout ? 'Đăng xuất' : 'Xác nhận xoá';
  return h('div', { className: 'modal-bg', onClick: close },
    h('div', { className: 'modal', style: { maxWidth: '360px' }, onClick: e => e.stopPropagation() },
      h('div', { style: { padding: '6px 0 20px', fontSize: 14, lineHeight: 1.7 } }, msg),
      h('div', { style: { display: 'flex', gap: 8, justifyContent: 'flex-end' } },
        h('button', { className: 'btn', onClick: close }, 'Huỷ'),
        h('button', { className: 'btn btn-danger', onClick: () => { if (isLogout) { onYes(); } else { onYes(); close(); } } }, confirmLabel)
      )
    )
  );
}
