          h('div', { className: 'page-sub' }, 'Xem và in hoá đơn có VAT')
        )
      ),
      h('div', { style: { display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'flex-start' } },
        h('div', { style: { minWidth: '260px', flex: '0 0 280px' } },
          inp('text', '🔍 Tìm đơn hàng...', search, v => { search = v; rebuild(); }, { style: { marginBottom: 10 } }),
          h('div', { style: { display: 'flex', flexDirection: 'column', gap: 6, maxHeight: '520px', overflowY: 'auto' } },
            ...filtered.map(s => h('div', {
              style: { padding: '12px 14px', background: selected?.id === s.id ? 'var(--bg4)' : 'var(--bg2)', border: `1px solid ${selected?.id === s.id ? 'var(--accent)' : 'var(--border)'}`, borderRadius: 'var(--r2)', cursor: 'pointer', transition: 'all .15s' },
              onClick: () => { selected = s; rebuild(); }
            },
              h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                h('span', { style: { fontWeight: 600 } }, s.customer),
                h('span', { className: 'badge badge-' + (s.status === 'done' ? 'green' : 'red') }, s.status === 'done' ? 'Xong' : 'Nợ')
              ),
              h('div', { style: { fontSize: 11, color: 'var(--text2)', marginTop: 4 } }, s.productName + ' · ' + fmtD(s.date)),
              h('div', { style: { marginTop: 4, display: 'flex', gap: 8, alignItems: 'center' } },
                h('span', { style: { fontSize: 12, fontWeight: 700, color: 'var(--accent)' } }, fmt(s.total) + 'đ'),
                s.vatRate > 0 && h('span', { className: 'badge badge-blue', style: { fontSize: 10 } }, 'VAT ' + s.vatRate + '%')
              )
            )),
            filtered.length === 0 && h('div', { className: 'empty' }, 'Không có đơn hàng')
          )
        ),
        h('div', { style: { flex: 1, minWidth: '280px' } }, preview)
      )
    ));
  };
  rebuild();
  return wrap;
}

// ── QUOTATION ─────────────────────────────────────────────────
function pgQuotation() {
  // ── State (closure) ──────────────────────────────────────────
  let items = [newItem()];
  let customerName = '';
  let customerPhone = '';
  let customerNote = '';
  let showResult = false;

  function newItem() {
    return {
      id: uid(),
      name: '',
      unit: 'm²',
      qty: 1,
      // Buy
      buyPrice: 0, buyVat: 0,
      // Sell
      sellPrice: 0, sellVat: 0,
      // Ship — tính theo trọng lượng
      shipWeight: 0,          // trọng lượng (kg hoặc tấn)
      shipWeightUnit: 'kg',   // 'kg' | 'tấn'
      shipRatePerUnit: 0,     // đơn giá vận chuyển / kg hoặc / tấn
      shipFeeExtra: 0,        // phí cố định thêm (nếu có)
      shipVat: 0,
      imageData: ''           // base64 ảnh sản phẩm cho báo giá
    };
  }

  // ── Số format: 1.200.000 ───────────────────────────────────
  function parseNum(str) {
    // Loại tất cả dấu chấm/phẩy phân cách ngàn, giữ lại dấu thập phân cuối
    if (!str && str !== 0) return 0;
    const s = String(str).replace(/\./g, '').replace(/,/g, '.');
    return parseFloat(s) || 0;
  }

  function fmtInput(n) {
    // Format số để hiển thị trong ô input dạng 1.200.000
    if (!n) return '';
    return new Intl.NumberFormat('vi-VN').format(Math.round(n));
  }

  // ── Input tiền tệ tự format ───────────────────────────────
  function moneyInput(rawVal, onChange, placeholder) {
    const el = document.createElement('input');
    el.type = 'text';
    el.inputMode = 'numeric';
    el.placeholder = placeholder || '0';
    el.className = 'form-input';
    el.style.textAlign = 'right';
    el.style.fontWeight = '600';
    el.style.letterSpacing = '.3px';
    el.value = rawVal > 0 ? fmtInput(rawVal) : '';

    el.addEventListener('focus', () => {
      // Khi focus: bỏ dấu chấm để dễ sửa
      if (el.value) el.value = el.value.replace(/\./g, '').replace(/,/g, '.');
    });
    el.addEventListener('input', () => {
      // Chỉ cho phép số
      el.value = el.value.replace(/[^0-9]/g, '');
      onChange(parseFloat(el.value) || 0);
    });
    el.addEventListener('blur', () => {
      const n = parseFloat(el.value) || 0;
      el.value = n > 0 ? fmtInput(n) : '';
      onChange(n);
      rebuild();
    });
    return el;
  }

  // ── Số lượng / trọng lượng input (cho phép thập phân) ────
  function numInput(rawVal, onChange, placeholder) {
    const el = document.createElement('input');
    el.type = 'text';
    el.inputMode = 'decimal';
    el.placeholder = placeholder || '0';
    el.className = 'form-input';
    el.style.textAlign = 'right';
    el.value = rawVal > 0 ? String(rawVal) : '';

    el.addEventListener('input', () => {
      el.value = el.value.replace(/[^0-9.,]/g, '').replace(',', '.');
      onChange(parseFloat(el.value) || 0);
    });
    el.addEventListener('blur', () => {
      const n = parseFloat(el.value) || 0;
      el.value = n > 0 ? String(n) : '';
      onChange(n);
      rebuild();
    });
    return el;
  }

  // ── Tính ship fee từ trọng lượng ─────────────────────────
  function calcShipFee(it) {
    const w = parseFloat(it.shipWeight) || 0;
    const r = parseFloat(it.shipRatePerUnit) || 0;
    const extra = parseFloat(it.shipFeeExtra) || 0;
    // Nếu đơn vị là tấn, chuyển sang kg trước khi tính nếu rate theo tấn
    return w * r + extra;
  }

  function calcItem(it) {
    const qty      = parseFloat(it.qty) || 0;
    const buyBase  = (parseFloat(it.buyPrice) || 0) * qty;
    const buyVatA  = Math.round(buyBase  * (parseFloat(it.buyVat)  || 0) / 100);
    const shipBase = calcShipFee(it);
    const shipVatA = Math.round(shipBase * (parseFloat(it.shipVat) || 0) / 100);
    const sellBase = (parseFloat(it.sellPrice) || 0) * qty;
    const sellVatA = Math.round(sellBase * (parseFloat(it.sellVat) || 0) / 100);
    const revenueTotal = sellBase + sellVatA;
    const costTotal    = buyBase + buyVatA + shipBase + shipVatA;
    // VAT phải nộp nhà nước = đầu ra − đầu vào (nhập + ship)
    const vatPayable   = sellVatA - buyVatA - shipVatA;
    // LN trước thuế: thuần (chưa VAT bên nào)
    const profitBefore = sellBase - buyBase - shipBase;
    // LN sau thuế: trừ thêm phần VAT chênh lệch phải nộp
    const profitAfter  = profitBefore - vatPayable;
    const marginPct    = sellBase > 0 ? Math.round(profitBefore / sellBase * 100) : 0;
    return { qty, buyBase, buyVatA, shipBase, shipVatA, sellBase, sellVatA, revenueTotal, costTotal, vatPayable, profitBefore, profitAfter, marginPct };
  }

  function calcTotal() {
    const calcs = items.map(calcItem);
    return {
      calcs,
      totalCost:     calcs.reduce((a,c) => a + c.costTotal,    0),
      totalRevenue:  calcs.reduce((a,c) => a + c.revenueTotal, 0),
      totalBuyBase:  calcs.reduce((a,c) => a + c.buyBase,  0),
      totalBuyVat:   calcs.reduce((a,c) => a + c.buyVatA,  0),
      totalShipBase: calcs.reduce((a,c) => a + c.shipBase, 0),
      totalShipVat:  calcs.reduce((a,c) => a + c.shipVatA, 0),
      totalSellBase: calcs.reduce((a,c) => a + c.sellBase, 0),
      totalSellVat:  calcs.reduce((a,c) => a + c.sellVatA, 0),
      totalVatPayable: calcs.reduce((a,c) => a + c.vatPayable, 0),
      totalProfitB:  calcs.reduce((a,c) => a + c.profitBefore, 0),
      totalProfitA:  calcs.reduce((a,c) => a + c.profitAfter,  0),
    };
  }

  // ── VAT slider ────────────────────────────────────────────
  function makeVatSlider(itRef, vatKey, color) {
    const slid = document.createElement('input');
    slid.type = 'range'; slid.min = 0; slid.max = 20; slid.step = 1;
    slid.value = itRef[vatKey] || 0;
    slid.className = 'vat-slider';
    const badge = h('span', { className: 'vat-badge', style: { color } }, (itRef[vatKey] || 0) + '%');
    slid.addEventListener('input', e => {
      itRef[vatKey] = parseFloat(e.target.value);
      badge.textContent = e.target.value + '%';
    });
    slid.addEventListener('change', () => rebuild());
    return h('div', { className: 'form-group' },
      h('label', { className: 'form-label' }, 'VAT (0–20%)'),
      h('div', { className: 'vat-row' }, slid, badge)
    );
  }

  // ── Render ────────────────────────────────────────────────
  const wrap = h('div', {});

  function rebuild() {
    const { calcs, totalCost, totalRevenue, totalBuyBase, totalBuyVat, totalShipBase, totalShipVat, totalSellBase, totalSellVat, totalVatPayable, totalProfitB, totalProfitA } = calcTotal();
    wrap.innerHTML = '';

    // Header
    wrap.appendChild(h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '💰 Báo Giá'),
        h('div', { className: 'page-sub' }, 'Tính giá & lợi nhuận — không lưu vào dữ liệu')
      ),
      h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
        h('button', { className: 'btn', onClick: () => { items.push(newItem()); rebuild(); } }, '➕ Thêm sản phẩm'),
        h('button', { className: 'btn btn-primary', onClick: () => {
          showResult = true; rebuild();
          setTimeout(() => { const el = document.getElementById('qResult'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 100);
        } }, '📋 Xem kết quả'),
        // ── Nút Báo Giá Khách ──────────────────────────────────────
        h('button', { className: 'btn', style: { background: 'var(--blue)', color: '#fff', border: 'none' }, onClick: () => {

          const quoteItems = items.map((it, i) => {
            const c = cc[i];
            return { name: it.name || `Sản phẩm ${i+1}`, qty: c.qty, unit: it.unit, sellPrice: it.sellPrice, sellVat: it.sellVat, sellBase: c.sellBase, sellVatA: c.sellVatA, revenueTotal: c.revenueTotal, imageData: it.imageData || '' };
          }).filter(it => it.sellBase > 0 || it.sellPrice > 0);
          if (quoteItems.length === 0) { toast('Vui lòng nhập giá bán cho ít nhất một sản phẩm!', 'error'); return; }

          function buildCustomerQuoteHTML(autoprint) {

            const totalSellBase = quoteItems.reduce((a,it) => a + it.sellBase, 0);

            const rows = quoteItems.map((it, idx) => {

            summaryHTML += `<div style="display:flex;justify-content:space-between;padding:10px 0 4px;font-size:17px;font-weight:800;color:#8b6914">

            const noteLines = customerNote ? customerNote.split('\n').filter(l => l.trim()) : [];

// ── BIÊN BẢN GIAO NHẬN ───────────────────────────────────────
function pgBienBan() {
  // ── State ─────────────────────────────────────────────────
  let bb = {
    date:      today(),
    // Bên giao
    giao_ten:    S.settings.shopName  || '',
    giao_dc:     S.settings.address   || '',
    giao_mst:    S.settings.taxId     || '',
    giao_gd:     '',  giao_gd_cv: 'Giám Đốc',
    giao_bh:     '',  giao_bh_cv: 'Bán hàng',
    giao_tk:     '',  giao_tk_cv: 'Thủ kho',
    giao_ql:     '',  giao_ql_cv: 'Quản lý',
    // Bên nhận
    nhan_ten: '', nhan_dc: '', nhan_nd: '',
    // Vận chuyển
    vc_dc: '', vc_lx: '',
    // Nội dung
    hang_mo: 'Giao nhận đá Granite trắng Suối Lau như sau:',
    vat: 8,
    ghichu: 'Hai bên đã thống nhất chất lượng, số lượng hàng hóa. Mọi thất thoát hư hỏng bên vận chuyển hoàn toàn chịu trách nhiệm sau khi rời khỏi nhà máy.',
  };

  let rows = [newBBRow()];
  function newBBRow() {
    return { id: uid(), ten: '', cao: '', dai: '', rong: '', sl: '', dientich: '', dongia: 0 };
  }
  function calcRow(r) {
    const cao = parseFloat(r.cao) || 0;
    const dai = parseFloat(r.dai) || 0;
    const rong = parseFloat(r.rong) || 0;
    const sl  = parseFloat(r.sl)  || 0;
    const dt  = r.dientich !== '' ? (parseFloat(r.dientich) || 0) : (dai * rong * sl);
    const dg  = parseFloat(r.dongia) || 0;
    const tt  = Math.round(dt * dg);
    return { cao, dai, rong, sl, dt, dg, tt };
  }
  function calcTotals() {
    const calcs = rows.map(calcRow);
    const totalSL = calcs.reduce((a,c) => a + c.sl, 0);
    const totalDT = calcs.reduce((a,c) => a + c.dt, 0);
    const totalTT = calcs.reduce((a,c) => a + c.tt, 0);
    const vatAmt  = Math.round(totalTT * (parseFloat(bb.vat) || 0) / 100);
    const tongCong = totalTT + vatAmt;
    return { calcs, totalSL, totalDT, totalTT, vatAmt, tongCong };
  }
  function fmtNum(n) { return n > 0 ? new Intl.NumberFormat('vi-VN').format(Math.round(n)) : ''; }
  function bbInp(type, placeholder, val, onChange, extraStyle) {
    const el = document.createElement('input');
    el.type = type || 'text';
    el.className = 'form-input';
    el.placeholder = placeholder || '';
    el.value = val !== undefined ? String(val) : '';
    if (extraStyle) Object.assign(el.style, extraStyle);
    el.addEventListener('input', e => onChange(e.target.value));
    return el;
  }

  // ── PDF Builder ───────────────────────────────────────────
  function buildBienBanHTML(autoprint) {
    const { calcs, totalSL, totalDT, totalTT, vatAmt, tongCong } = calcTotals();
    const vatPct = parseFloat(bb.vat) || 0;
    const rowsHTML = rows.map((r,i) => {
      const c = calcs[i];
      return `<tr>
        <td style="text-align:center">${i+1}</td>
        <td>${r.ten||''}</td>
        <td style="text-align:center">${c.cao||''}</td>
        <td style="text-align:center">${c.dai||''}</td>
        <td style="text-align:center">${c.rong||''}</td>
        <td style="text-align:center">${c.sl>0?fmtNum(c.sl):''}</td>
        <td style="text-align:center">${c.dt>0?c.dt.toFixed(2):''}</td>
        <td style="text-align:right">${c.dg>0?fmtNum(c.dg):''}</td>
        <td style="text-align:right">${c.tt>0?fmtNum(c.tt):''}</td>
        <td></td>
      </tr>`;
    }).join('');
    const vatRow = vatPct > 0 ? `<tr><td colspan="8" style="text-align:center;font-weight:600">VAT ${vatPct}%</td><td style="text-align:right;font-weight:600">${fmtNum(vatAmt)}</td><td></td></tr>` : '';
    const d = bb.date ? bb.date.split('-') : ['....','..','..'];
    const dayStr = `ngày ${d[2]||'..'} tháng ${d[1]||'..'} năm ${d[0]||'....'}`;
    const rep = (s) => s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Biên Bản Giao Nhận</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Times New Roman',Times,serif; font-size:13px; color:#000; background:#fff; }
.page { max-width:790px; margin:0 auto; padding:18px 28px; }
h2 { text-align:center; font-size:16px; font-weight:700; letter-spacing:1.5px; margin:10px 0 16px; text-decoration:underline; }
p { margin-bottom:2px; line-height:1.9; }
.sec { margin-bottom:6px; line-height:1.9; }
.hang-mo { font-style:italic; margin:12px 0 4px; }
table { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:6px; }
th,td { border:1px solid #555; padding:5px 6px; vertical-align:middle; }
thead th { background:#fff; font-weight:700; text-align:center; font-size:11px; }
.note { font-size:12px; margin:8px 0 16px; line-height:1.7; }
.date-right { text-align:right; font-style:italic; font-size:12px; margin-bottom:8px; }
.sigs { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; margin-top:10px; }
.sigs2 { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:18px; }
.sig { text-align:center; }
.sig-t { font-weight:700; font-size:12px; }
.sig-n { font-size:11px; font-style:italic; color:#555; margin:2px 0 48px; }
.sig-name { border-top:1px solid #888; padding-top:4px; font-size:12px; font-weight:600; min-height:20px; }
@media print { @page{size:A4;margin:8mm 10mm;} body{print-color-adjust:exact;-webkit-print-color-adjust:exact;} }
</style></head><body><div class="page">
<h2>Biên Bản Giao Nhận</h2>

<p class="sec">Chúng tôi gồm:</p>
<div class="sec">
  <p>* Bên giao: <b>${rep(bb.giao_ten)||'..............................'}</b></p>
  <p>Địa chỉ: ${rep(bb.giao_dc)||'..............................'}</p>
  <p>MST: ${rep(bb.giao_mst)||'..............................'}</p>
  <p>Đại diện:</p>
  ${bb.giao_gd ? `<p>Ông/Bà: ${rep(bb.giao_gd)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: ${rep(bb.giao_gd_cv)}</p>` : ''}
  ${bb.giao_bh ? `<p>Ông/Bà: ${rep(bb.giao_bh)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: ${rep(bb.giao_bh_cv)}</p>` : ''}
  ${bb.giao_tk ? `<p>Ông/Bà: ${rep(bb.giao_tk)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: ${rep(bb.giao_tk_cv)}</p>` : ''}
  ${bb.giao_ql ? `<p>Ông/Bà: ${rep(bb.giao_ql)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: ${rep(bb.giao_ql_cv)}</p>` : ''}
</div>
<div class="sec">
  <p>* Bên nhận :<b>${bb.nhan_ten?' '+rep(bb.nhan_ten):'..............................'}</b></p>
  <p>Địa chỉ : ${rep(bb.nhan_dc)||'..............................'}</p>
  <p>Đại diện người nhận hàng: ${bb.nhan_nd?'Ông/Bà '+rep(bb.nhan_nd):'..............................'}</p>

<div class="sec">

  <p>Đại Diện Tài Xế : ${rep(bb.vc_lx)||''} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Chức vụ: Lái xe :</p>
</div>
<p class="hang-mo">${rep(bb.hang_mo)||''}</p>
<table>
  <thead>
    <tr>
      <th rowspan="2" style="width:28px">Stt</th>
      <th rowspan="2">Tên hàng</th>
      <th colspan="3">Quy cách (mét)</th>
      <th rowspan="2" style="width:48px">SL<br>(tấm)</th>
      <th rowspan="2" style="width:65px">Diện tích<br>(m²)</th>
      <th rowspan="2" style="width:90px">Đơn giá</th>
      <th rowspan="2" style="width:100px">Thành tiền</th>
      <th rowspan="2" style="width:50px">Ghi chú</th>
    </tr>
    <tr>
      <th style="font-size:10px;width:38px">Cao</th>
      <th style="font-size:10px;width:38px">Dài</th>
      <th style="font-size:10px;width:44px">Rộng</th>
    </tr>
  </thead>
  <tbody>
    ${rowsHTML}
    <tr style="font-weight:700;background:#f0f0f0">
      <td colspan="2" style="text-align:center">Tổng (1)</td>
      <td></td><td></td><td></td>
      <td style="text-align:center">${fmtNum(totalSL)}</td>
      <td style="text-align:center">${totalDT.toFixed(2)}</td>
      <td></td>
      <td style="text-align:right">${fmtNum(totalTT)}</td>
      <td></td>
    </tr>
    ${vatRow}
    <tr style="font-weight:700;background:#e8e0cc">
      <td colspan="8" style="text-align:center">Tổng Cộng</td>
      <td style="text-align:right">${fmtNum(tongCong)}</td>
      <td></td>
    </tr>
  </tbody>
</table>
<p class="note">${rep(bb.ghichu)||''}</p>
<p class="date-right">${dayStr.charAt(0).toUpperCase()+dayStr.slice(1)}</p>
<div class="sigs" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px">
  <div class="sig" style="text-align:center">
    <div class="sig-t" style="font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px">ĐẠI DIỆN BÊN GIAO</div>
    <div class="sig-n" style="font-size:11px;font-style:italic;color:#555;margin-bottom:0">(Ký, ghi rõ họ tên)</div>
    <div style="height:80px"></div>
  </div>
  <div class="sig" style="text-align:center">
    <div class="sig-t" style="font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px">ĐẠI DIỆN BÊN NHẬN</div>
    <div class="sig-n" style="font-size:11px;font-style:italic;color:#555;margin-bottom:0">(Ký, ghi rõ họ tên)</div>
    <div style="height:80px"></div>
  </div>
</div>
</div>
${autoprint?'<scr'+'ipt>window.onload=function(){window.print()};<\/scr'+'ipt>':''}
</body></html>`;
  }

  // ── Render UI ─────────────────────────────────────────────
  const wrap = h('div', {});

  function rebuild() {
    const { calcs, totalSL, totalDT, totalTT, vatAmt, tongCong } = calcTotals();
    wrap.innerHTML = '';

    // Header buttons
    wrap.appendChild(h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '📋 Biên Bản Giao Nhận'),
        h('div', { className: 'page-sub' }, 'Soạn biên bản giao hàng đá — xuất PDF / In theo mẫu')
      ),
      h('div', { style: { display:'flex', gap:8, flexWrap:'wrap' } },
        h('button', { className:'btn', style:{background:'var(--blue)',color:'#fff',border:'none'}, onClick:() => {
          openPdfMobile(buildBienBanHTML(false), 'Biên bản giao nhận');
        } }, '📄 Xuất PDF'),
        h('button', { className:'btn btn-primary', onClick:() => {
          openPdfMobile(buildBienBanHTML(true), 'Biên bản giao nhận');
        } }, '🖨️ In biên bản'),
        h('button', { className:'btn', onClick:() => {
          bb = {
            date:today(), giao_ten:S.settings.shopName||'', giao_dc:S.settings.address||'', giao_mst:S.settings.taxId||'',
            giao_gd:'', giao_gd_cv:'Giám Đốc', giao_bh:'', giao_bh_cv:'Bán hàng',
            giao_tk:'', giao_tk_cv:'Thủ kho', giao_ql:'', giao_ql_cv:'Quản lý',
            nhan_ten:'', nhan_dc:'', nhan_nd:'', vc_dc:'', vc_lx:'',
            hang_mo:'Giao nhận đá Granite trắng Suối Lau như sau:', vat:8,
            ghichu:'Hai bên đã thống nhất chất lượng, số lượng hàng hóa. Mọi thất thoát hư hỏng bên vận chuyển hoàn toàn chịu trách nhiệm sau khi rời khỏi nhà máy.',
          };
          rows = [newBBRow()]; rebuild();
        } }, '🔄 Làm mới')
      )
    ));

    // ── Card 1: Ngày & Bên Giao ───────────────────────────
    wrap.appendChild(h('div', { className:'card' },
      h('div', { className:'card-title' }, '📅 Thông tin chung & Bên Giao'),
      h('div', { className:'fg fg2', style:{marginBottom:14} },
        h('div', { className:'form-group' },
          h('label', { className:'form-label' }, 'Ngày lập biên bản'),
          bbInp('date','',bb.date, v=>{bb.date=v;})
        ),
        h('div', { className:'form-group' },
          h('label', { className:'form-label' }, 'Mô tả hàng giao nhận'),
          bbInp('text','Giao nhận đá...', bb.hang_mo, v=>{bb.hang_mo=v;})
        )
      ),
      h('div', { className:'fg fg3', style:{marginBottom:14} },
        h('div', { className:'form-group' },
          h('label', { className:'form-label' }, '🏢 Tên công ty bên giao'),
          bbInp('text','CÔNG TY TNHH ...', bb.giao_ten, v=>{bb.giao_ten=v;})
        ),
        h('div', { className:'form-group' },
          h('label', { className:'form-label' }, 'Địa chỉ bên giao'),
          bbInp('text','Địa chỉ...', bb.giao_dc, v=>{bb.giao_dc=v;})
        ),
        h('div', { className:'form-group' },
          h('label', { className:'form-label' }, 'Mã số thuế (MST)'),
          bbInp('text','4200000000', bb.giao_mst, v=>{bb.giao_mst=v;})
        )
      ),
      h('div', { style:{fontSize:12,color:'var(--text2)',marginBottom:8,fontWeight:600} }, 'Đại diện bên giao:'),
      h('div', { className:'fg fg2', style:{marginBottom:8} },
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Tên Giám đốc / Đại diện'), bbInp('text','Họ tên...',bb.giao_gd,v=>{bb.giao_gd=v;})),
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Chức vụ'), bbInp('text','Giám Đốc',bb.giao_gd_cv,v=>{bb.giao_gd_cv=v;}))
      ),
      h('div', { className:'fg fg2', style:{marginBottom:8} },
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Nhân viên Bán hàng'), bbInp('text','Họ tên...',bb.giao_bh,v=>{bb.giao_bh=v;})),
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Chức vụ'), bbInp('text','Bán hàng',bb.giao_bh_cv,v=>{bb.giao_bh_cv=v;}))
      ),
      h('div', { className:'fg fg2', style:{marginBottom:8} },
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Thủ kho'), bbInp('text','Họ tên...',bb.giao_tk,v=>{bb.giao_tk=v;})),
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Chức vụ'), bbInp('text','Thủ kho',bb.giao_tk_cv,v=>{bb.giao_tk_cv=v;}))
      ),
      h('div', { className:'fg fg2' },
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Quản lý'), bbInp('text','Họ tên...',bb.giao_ql,v=>{bb.giao_ql=v;})),
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Chức vụ'), bbInp('text','Quản lý',bb.giao_ql_cv,v=>{bb.giao_ql_cv=v;}))
      )
    ));

    // ── Card 2: Bên Nhận & Vận Chuyển ────────────────────
    wrap.appendChild(h('div', { className:'card' },
      h('div', { className:'card-title' }, '📦 Bên Nhận & Vận Chuyển'),
      h('div', { className:'fg fg3', style:{marginBottom:14} },
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'🏢 Tên công ty bên nhận'), bbInp('text','CÔNG TY TNHH ...',bb.nhan_ten,v=>{bb.nhan_ten=v;})),
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Địa chỉ bên nhận'), bbInp('text','Địa chỉ...',bb.nhan_dc,v=>{bb.nhan_dc=v;})),
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Người đại diện nhận hàng'), bbInp('text','Họ tên...',bb.nhan_nd,v=>{bb.nhan_nd=v;}))
      ),
      h('div', { className:'fg fg2' },
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'🚚 Địa chỉ đơn vị vận chuyển'), bbInp('text','Địa chỉ (nếu có)...',bb.vc_dc,v=>{bb.vc_dc=v;})),
        h('div',{className:'form-group'}, h('label',{className:'form-label'},'Tên lái xe'), bbInp('text','Họ tên lái xe...',bb.vc_lx,v=>{bb.vc_lx=v;}))
      )
    ));

    // ── Card 3: Bảng hàng hóa ─────────────────────────────
    wrap.appendChild(h('div', { className:'card' },
      h('div', { style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14} },
        h('div', { className:'card-title', style:{marginBottom:0} }, '📊 Danh sách hàng hóa'),
        h('button', { className:'btn btn-sm', onClick:()=>{rows.push(newBBRow());rebuild();} }, '➕ Thêm dòng')
      ),
      h('div', { style:{overflowX:'auto'} }, (() => {
        const tbl = document.createElement('table');
        tbl.style.cssText = 'width:100%;border-collapse:collapse;font-size:13px;min-width:700px';
        tbl.innerHTML = `<thead><tr style="background:var(--bg3)">
          <th style="padding:8px 6px;text-align:left;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)">Tên hàng / Mã</th>
          <th style="padding:8px 4px;text-align:center;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);width:58px">Cao(m)</th>
          <th style="padding:8px 4px;text-align:center;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);width:58px">Dài(m)</th>
          <th style="padding:8px 4px;text-align:center;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);width:60px">Rộng(m)</th>
          <th style="padding:8px 4px;text-align:center;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);width:68px">SL(tấm)</th>
          <th style="padding:8px 4px;text-align:center;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);width:90px">DT(m²)</th>
          <th style="padding:8px 4px;text-align:right;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);width:118px">Đơn giá(đ)</th>
          <th style="padding:8px 4px;text-align:right;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border);width:128px">Thành tiền</th>
          <th style="padding:8px;border-bottom:1px solid var(--border);width:36px"></th>
        </tr></thead>`;
        const tbody = document.createElement('tbody');

        rows.forEach((r, idx) => {
          const c = calcs[idx];
          const tr = document.createElement('tr');
          tr.style.borderBottom = '1px solid var(--border)';

          function mkTd(val, onChange, type, align, ph) {
            const td = document.createElement('td'); td.style.padding='4px 4px';
            const el = document.createElement('input');
            el.type = type||'text'; el.value = val!==undefined&&val!==0?String(val):''; el.placeholder=ph||'';
            el.style.cssText=`background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:6px 6px;color:var(--text);font-size:13px;width:100%;text-align:${align||'left'};font-family:inherit`;
            el.addEventListener('change', e=>{onChange(e.target.value); rebuild();});
            td.appendChild(el); return td;
          }

          tr.appendChild(mkTd(r.ten, v=>{r.ten=v;}, 'text','left','VD: QCK 3P 300×600'));
          tr.appendChild(mkTd(r.cao||'', v=>{r.cao=v;}, 'number','center','0.03'));
          tr.appendChild(mkTd(r.dai||'', v=>{r.dai=v;}, 'number','center','0.3'));
          tr.appendChild(mkTd(r.rong||'', v=>{r.rong=v;}, 'number','center','0.6'));
          tr.appendChild(mkTd(r.sl||'', v=>{r.sl=v;}, 'number','center','100'));

          // DT — tự tính hoặc nhập tay
          const tdDT=document.createElement('td'); tdDT.style.padding='4px 4px';
          const elDT=document.createElement('input');
          elDT.type='number';
          elDT.value=r.dientich!==''?r.dientich:(c.dt>0?c.dt.toFixed(2):'');
          elDT.placeholder='tự tính';
          elDT.title='Tự động từ Dài×Rộng×SL. Nhập tay để ghi đè.';
          elDT.style.cssText='background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:6px 6px;color:var(--accent);font-size:13px;width:100%;text-align:center;font-family:inherit';
          elDT.addEventListener('change',e=>{r.dientich=e.target.value;rebuild();});
          tdDT.appendChild(elDT); tr.appendChild(tdDT);

          // Đơn giá
          const tdDG=document.createElement('td'); tdDG.style.padding='4px 4px';
          const elDG=document.createElement('input');
          elDG.type='text';
          elDG.value=r.dongia>0?new Intl.NumberFormat('vi-VN').format(r.dongia):'';
          elDG.placeholder='VD: 227.000';
          elDG.style.cssText='background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:6px 6px;color:var(--text);font-size:13px;width:100%;text-align:right;font-family:inherit';
          elDG.addEventListener('change',e=>{r.dongia=parseFloat(e.target.value.replace(/\./g,'').replace(/,/g,''))||0;rebuild();});
          tdDG.appendChild(elDG); tr.appendChild(tdDG);

          // Thành tiền
          const tdTT=document.createElement('td');
          tdTT.style.cssText='padding:8px 6px;text-align:right;color:var(--green);font-weight:700;font-size:13px';
          tdTT.textContent=c.tt>0?fmtNum(c.tt)+'đ':'';
          tr.appendChild(tdTT);

          // Xóa
          const tdX=document.createElement('td'); tdX.style.cssText='padding:4px;text-align:center';
          if (rows.length>1) {
            const bx=h('button',{className:'btn btn-danger btn-xs',onClick:()=>{rows.splice(idx,1);rebuild();}}, '✕');
            tdX.appendChild(bx);
          }
          tr.appendChild(tdX);
          tbody.appendChild(tr);
        });

        // Footer rows
        const mkSumRow = (label, val, color) => {
          const tr=document.createElement('tr');
          tr.style.cssText=`background:var(--bg3);font-weight:700`;
          tr.innerHTML=`<td colspan="4" style="padding:9px 8px;font-size:13px;color:var(--text2)">${label}</td>
            <td style="padding:9px 4px;text-align:center;color:${color||'var(--accent)'}">${totalSL>0?fmtNum(totalSL):''}</td>
            <td style="padding:9px 4px;text-align:center;color:${color||'var(--accent)'}">${totalDT>0?totalDT.toFixed(2):''}</td>
            <td></td>
            <td style="padding:9px 4px;text-align:right;color:${color||'var(--green)'};font-size:14px">${val}</td>
            <td></td>`;
          return tr;
        };
        tbody.appendChild(mkSumRow('Tổng cộng', totalTT>0?fmtNum(totalTT)+'đ':'—'));

        if (parseFloat(bb.vat)>0) {
          const trV=document.createElement('tr');
          trV.style.background='rgba(232,165,58,.08)';
          trV.innerHTML=`<td colspan="7" style="padding:8px 8px;color:var(--amber)">VAT ${bb.vat}%</td>
            <td style="padding:8px 4px;text-align:right;color:var(--amber);font-weight:600">${fmtNum(vatAmt)}đ</td><td></td>`;
          tbody.appendChild(trV);
        }

        const trTC=document.createElement('tr');
        trTC.style.cssText='background:rgba(201,168,76,.12);font-weight:700';
        trTC.innerHTML=`<td colspan="7" style="padding:10px 8px;font-size:14px;color:var(--accent)">TỔNG CỘNG ${parseFloat(bb.vat)>0?'(gồm VAT '+bb.vat+'%)':''}</td>
          <td style="padding:10px 4px;text-align:right;color:var(--accent);font-size:16px">${fmtNum(tongCong)}đ</td><td></td>`;
        tbody.appendChild(trTC);

        tbl.appendChild(tbody);
        return tbl;
      })())
    ));

    // ── Card 4: VAT & Ghi chú ─────────────────────────────
    wrap.appendChild(h('div', { className:'card' },
      h('div', { className:'card-title' }, '⚙️ VAT & Ghi chú cuối biên bản'),
      h('div', { className:'fg fg2', style:{marginBottom:14} },
        h('div',{className:'form-group'},
          h('label',{className:'form-label'},'VAT (%) — nhập 0 nếu không có'),
          bbInp('number','8', String(bb.vat), v=>{bb.vat=v;rebuild();},{maxWidth:'120px'})
        ),
        h('div',{})
      ),
      h('div',{className:'form-group'},
        h('label',{className:'form-label'},'📝 Ghi chú cuối biên bản'),
        (()=>{
          const ta=document.createElement('textarea');
          ta.className='form-input'; ta.style.minHeight='80px'; ta.style.resize='vertical';
          ta.value=bb.ghichu;
          ta.addEventListener('input',e=>{bb.ghichu=e.target.value;});
          return ta;
        })()
      )
    ));
  }

  rebuild();
  return wrap;
}

// ── HỢP ĐỒNG MUA BÁN ─────────────────────────────────────────
function pgHopDong() {

  // ── State hợp đồng ────────────────────────────────────────
  let hd = {
    soHD:    '',
    ngay:    today(),
    // Bên A (bên bán) — nhập tay
    a_ten:   S.settings.shopName    || '',
    a_dc:    S.settings.address     || '',
    a_tk:    S.settings.bankAccount || '',
    a_dt:    S.settings.phone       || '',
    a_mst:   S.settings.taxId       || '',
    a_dd:    S.settings.director    || '',
    a_cv:    'Giám đốc công ty',
    // Bên B
    b_ten:   '', b_dc: '', b_dt: '', b_tk: '', b_mst: '', b_dd: '', b_cv: 'Giám đốc công ty',
    // Điều 1 - hàng hóa
    items:   [newHDItem()],
    vat:     10,          // % VAT
    // Điều 2 - giao nhận
    quyCach: '',
    diaDiemGiao: '',
    // Điều 3 - thanh toán
    pctTamUng:  30,       // % tạm ứng (mặc định 30%)
    thoiHanConLai: '30 ngày',
    // Điều 5
    hieulucDen: '',
  };

  function newHDItem() {
    return { id: uid(), noidung: '', dvt: '', sl: '', dongia: 0 };
  }

  // ── Số thành chữ tiếng Việt ──────────────────────────────
  function soThanhChu(n) {
    if (!n || isNaN(n)) return '';
    n = Math.round(parseFloat(n));
    if (n === 0) return 'Không Đồng';
    const donvi  = ['', 'Một', 'Hai', 'Ba', 'Bốn', 'Năm', 'Sáu', 'Bảy', 'Tám', 'Chín'];
    const hang   = ['', 'Nghìn', 'Triệu', 'Tỷ'];

    function docNhom(so) {
      const tram = Math.floor(so / 100);
      const chuc = Math.floor((so % 100) / 10);
      const dv   = so % 10;
      let str = '';
      if (tram > 0) str += donvi[tram] + ' Trăm ';
      if (chuc === 0 && dv > 0 && tram > 0) str += 'Lẻ ';
      else if (chuc === 1) str += 'Mười ';
      else if (chuc > 1) str += donvi[chuc] + ' Mươi ';
      if (dv === 1 && chuc > 1) str += 'Mốt ';
      else if (dv === 5 && chuc > 0) str += 'Lăm ';
      else if (dv > 0) str += donvi[dv] + ' ';
      return str.trim();
    }

    let result = '';
    // Xử lý tỷ
    const ty  = Math.floor(n / 1000000000);
    const trieu = Math.floor((n % 1000000000) / 1000000);
    const nghin = Math.floor((n % 1000000) / 1000);
    const dv    = n % 1000;

    if (ty > 0)    result += docNhom(ty)    + ' Tỷ ';
    if (trieu > 0) result += docNhom(trieu) + ' Triệu ';
    if (nghin > 0) result += docNhom(nghin) + ' Nghìn ';
    if (dv > 0)    result += docNhom(dv);
    return result.trim() + ' Đồng';
  }

  // ── Tính toán ────────────────────────────────────────────
  function calcHD() {
    const calcs = hd.items.map(it => {
      const sl  = parseFloat(it.sl) || 0;
      const dg  = parseFloat(it.dongia) || 0;
      const tt  = Math.round(sl * dg);
      return { sl, dg, tt };
    });
    const tongHang  = calcs.reduce((a, c) => a + c.tt, 0);
    const vatAmt    = Math.round(tongHang * (parseFloat(hd.vat) || 0) / 100);
    const tongTT    = tongHang + vatAmt;
    const tamUng    = Math.round(tongTT * (parseFloat(hd.pctTamUng) || 0) / 100);
    const conLai    = tongTT - tamUng;
    return { calcs, tongHang, vatAmt, tongTT, tamUng, conLai };
  }

  function fmtVND(n) { return n > 0 ? new Intl.NumberFormat('vi-VN').format(Math.round(n)) : '0'; }
  function hdInp(type, ph, val, onChange, extraStyle) {
    const el = document.createElement('input');
    el.type = type || 'text'; el.className = 'form-input';
    el.placeholder = ph || ''; el.value = val !== undefined ? String(val) : '';
    if (extraStyle) Object.assign(el.style, extraStyle);
    el.addEventListener('input', e => onChange(e.target.value));
    return el;
  }

  // ── Build PDF HTML ────────────────────────────────────────
  function buildHopDongHTML(autoprint) {
    const { calcs, tongHang, vatAmt, tongTT, tamUng, conLai } = calcHD();
    const vatPct = parseFloat(hd.vat) || 0;
    const d = hd.ngay ? hd.ngay.split('-') : ['....','..','..'];
    const dayStr = `ngày ${d[2]||'&nbsp;&nbsp;'} tháng ${d[1]||'&nbsp;&nbsp;'} năm ${d[0]||'....'}`;
    const rep = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    const itemRows = hd.items.map((it, i) => {
      const c = calcs[i];
      return `<tr>
        <td style="text-align:center">${i+1}</td>
        <td>${rep(it.noidung)||'…'}</td>
        <td style="text-align:center">${rep(it.dvt)||'…'}</td>
        <td style="text-align:center">${c.sl>0?fmtVND(c.sl):'…'}</td>
        <td style="text-align:right">${c.dg>0?fmtVND(c.dg):'…'}</td>
        <td style="text-align:right">${c.tt>0?fmtVND(c.tt):'…'}</td>
      </tr>`;
    }).join('');

    const hieulucDen = hd.hieulucDen ? hd.hieulucDen.split('-').reverse().join('/') : '……………………';
    const soHD = hd.soHD ? `<b>Số: ${rep(hd.soHD)}</b>` : '';

    return `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>Hợp Đồng Mua Bán${hd.soHD?' - Số '+hd.soHD:''}</title>
<style>

.docLap { font-size:13pt; }
.gachDuoi { border-bottom:1px solid #000; width:70%; margin:3px auto 0; }
.tenHD { text-align:center; font-size:17pt; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin:16px 0 2px; }
.vv { text-align:center; font-style:italic; font-size:12pt; margin-bottom:16px; }

@media print { @page{size:A4;margin:0;} body{print-color-adjust:exact;-webkit-print-color-adjust:exact;} .page{padding:15mm 20mm 15mm 25mm;} }
</style></head><body><div class="page">

<div class="header-top" style="position:relative">

</div>

<div class="tenHD">Hợp Đồng Mua Bán</div>

</table>

<div class="benTitle">Bên mua (Bên B) :</div>

<p style="margin:10px 0 14px">Sau khi thỏa thuận, Hai Bên thống nhất ký hợp đồng mua bán với điều khoản sau:</p>

<h3>Điều 1: Hàng hóa – Giá cả – Số lượng – Chất lượng</h3>
<div class="dieu">
<p>1.1. Bên A đồng ý bán, Bên B đồng ý mua hàng hóa với nội dung như sau:</p>
<table class="hang">
  <thead><tr>
    <th style="width:32px">STT</th>
    <th>Nội dung</th>
    <th style="width:55px">ĐVT</th>
    <th style="width:80px">Số lượng</th>
    <th style="width:110px">Đơn giá</th>
    <th style="width:120px">Thành tiền</th>
  </tr></thead>
  <tbody>
    ${itemRows}
    <tr class="sum"><td colspan="5" style="text-align:center">Tổng Cộng tiền hàng</td><td class="r">${tongHang>0?fmtVND(tongHang):'…'}</td></tr>
    ${vatPct>0?`<tr class="sum"><td colspan="5" style="text-align:center">Tiền Thuế GTGT ${vatPct}%</td><td class="r">${fmtVND(vatAmt)}</td></tr>`:''}
    <tr class="sum"><td colspan="5" style="text-align:center">Tổng cộng tiền thanh toán</td><td class="r" style="font-size:14px;color:#8b3a00">${tongTT>0?fmtVND(tongTT):'…'}</td></tr>
  </tbody>
</table>
${tongTT>0?`<p class="bangchu">(Bằng chữ: <i>${soThanhChu(tongTT)}</i>)</p>`:`<p class="bangchu">(Bằng chữ: …………………………………………………………)</p>`}
<p style="padding-left:20px;margin-bottom:4px">- Chất lượng: Theo tiêu chuẩn của nhà sản xuất.</p>
<p>1.2. Đơn giá và giá trị hợp đồng:</p>
<p>- Đơn giá và giá trị hợp đồng được tính theo đồng Việt Nam (VNĐ).</p>
<p>- Đơn giá có thể thay đổi theo từng thời điểm giao hàng, thông báo giá của bên bán có sự chấp thuận của bên mua.</p>
</div>

<h3>Điều 2: Điều khoản giao nhận</h3>
<div class="dieu">
<p>2.1. Ngay sau khi ký kết hợp đồng, hai bên thống nhất kế hoạch giao nhận hàng để bên A chuẩn bị hàng và bên B bố trí mặt bằng tiếp nhận hàng hóa. Hàng hóa bên A giao phải đảm bảo đúng qui cách <b>${hd.quyCach?rep(hd.quyCach):'……………………'}</b> và chất lượng theo tiêu chuẩn của nhà sản xuất.</p>
<p>2.2. Trên cơ sở kế hoạch giao nhận hàng, Bên A sẽ xác nhận và thông báo lịch giao hàng. Trong trường hợp có bất kỳ sự thay đổi nào, Hai bên sẽ thảo luận và thống nhất lịch giao hàng khác.</p>
<p>2.3. Phương thức giao nhận:</p>
<p>- Địa điểm giao hàng tại Công trình: <b>${hd.diaDiemGiao?rep(hd.diaDiemGiao):'………………………………………………'}</b></p>
<p>- Thời gian giao hàng: Thỏa thuận theo từng đơn hàng cụ thể.</p>
<p>- Chi phí vận chuyển: Bên A chịu trách nhiệm vận chuyển hàng đến chân công trình cho bên B và chi phí vận chuyển hàng thuộc về bên A.</p>
<p>- Chi phí bốc xếp hàng từ xe vận chuyển của bên A xuống chân công trình thuộc trách nhiệm của bên B.</p>
<p>2.4. Số lượng hàng giao thực tế sẽ căn cứ theo biên bản giao nhận có xác nhận của hai bên.</p>
</div>

<h3>Điều 3: Điều khoản thanh toán</h3>
<div class="dieu">
<p>3.1. Bên B thanh toán cho Bên A bằng tiền Việt Nam đồng theo hình thức chuyển khoản.</p>
<p>3.2. Bên B tạm ứng cho bên A trước <b>${hd.pctTamUng}%</b> số tiền tổng giá trị hợp đồng${tongTT>0?`: <b>${fmtVND(tamUng)} đồng</b>`:':'} ${tamUng>0?`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Bằng chữ: <i>${soThanhChu(tamUng)}</i>)`:''}</p>
<p>3.3. Số tiền còn lại của hợp đồng${tongTT>0?`: <b>${fmtVND(conLai)} đồng</b> ${conLai>0?`<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(Bằng chữ: <i>${soThanhChu(conLai)}</i>)`:''}`:':'} sẽ thanh toán trong vòng <b>${rep(hd.thoiHanConLai)||'…………'}</b> (sau khoảng thời gian trên sẽ tính theo lãi suất ngân hàng hiện tại).</p>
</div>

<h3>Điều 4: Điều khoản chung</h3>
<div class="dieu">
<p>4.1. Trong quá trình thực hiện hợp đồng nếu Hai Bên có những thỏa thuận khác thì tiến hành lập phụ lục hợp đồng. Phụ lục hợp đồng là một bộ phận không thể tách rời của hợp đồng chính.</p>
<p>4.3. Khi phát sinh các vấn đề ngoài dự kiến, hai Bên phải thông báo cho nhau tiến độ thực hiện hợp đồng, cùng nhau giải quyết và lập biên bản. Các biên bản được lập giữa hai Bên được coi là một bộ phận không thể tách rời với hợp đồng.</p>
<p>4.4. Trong trường hợp Hai Bên không tự giải quyết được thì vụ việc sẽ do Tòa án có thẩm quyền giải quyết. Phán quyết của Tòa án có giá trị bắt buộc tuân thủ cho cả hai Bên. Mọi chi phí phát sinh trong quá trình giải quyết vụ kiện sẽ do Bên thua kiện chịu.</p>
</div>

<h3>Điều 5: Hiệu lực của hợp đồng</h3>
<div class="dieu">
<p>5.1. Hợp đồng này có hiệu lực kể từ ngày ký đến hết ngày <b>${hieulucDen}</b>. Khi hết hiệu lực của hợp đồng, Hai Bên thanh toán xong không có gì vướng mắc thì hợp đồng xem như đã được thanh lý.</p>
<p>5.2. Hợp đồng này được lập thành 02 (hai) bản, Mỗi Bên giữ 01 (một) bản có giá trị như nhau.</p>
</div>

    <div class="sig-n">(Ký, đóng dấu, ghi rõ họ tên)</div>
    <div class="sig-name"></div>
  </div>
</div>

</div>${autoprint?'<scr'+'ipt>window.onload=function(){window.print()};<\/scr'+'ipt>':''}

  }

  // ── Render UI ─────────────────────────────────────────────
  const wrap = h('div', {});

  function rebuild() {
    const { calcs, tongHang, vatAmt, tongTT, tamUng, conLai } = calcHD();
    const vatPct = parseFloat(hd.vat) || 0;
    wrap.innerHTML = '';

    // ── Header ────────────────────────────────────────────
    wrap.appendChild(h('div', { className: 'page-header' },
      h('div', {},
        h('div', { className: 'page-title' }, '📝 Hợp Đồng Mua Bán'),
        h('div', { className: 'page-sub' }, 'Soạn hợp đồng theo mẫu — số tiền tự chuyển thành chữ tiếng Việt')
      ),
      h('div', { style: { display:'flex', gap:8, flexWrap:'wrap' } },
        h('button', { className:'btn', style:{background:'var(--blue)',color:'#fff',border:'none'}, onClick:()=>{
          openPdfMobile(buildHopDongHTML(false), 'Hợp đồng mua bán');
        } }, '📄 Xuất PDF'),
        h('button', { className:'btn btn-primary', onClick:()=>{
          openPdfMobile(buildHopDongHTML(true), 'Hợp đồng mua bán');
        } }, '🖨️ In hợp đồng'),
        h('button', { className:'btn', onClick:()=>{
          hd={
            soHD:'', ngay:today(),
            a_ten:S.settings.shopName||'', a_dc:S.settings.address||'', a_tk:S.settings.bankAccount||'',
            a_dt:S.settings.phone||'', a_mst:S.settings.taxId||'', a_dd:S.settings.director||'', a_cv:'Giám đốc công ty',
            b_ten:'',b_dc:'',b_dt:'',b_tk:'',b_mst:'',b_dd:'',b_cv:'Giám đốc công ty',
            items:[newHDItem()], vat:10,
            quyCach:'', diaDiemGiao:'',
            pctTamUng:30, thoiHanConLai:'30 ngày', hieulucDen:'',
          };
          rebuild();
        } }, '🔄 Làm mới')
      )
    ));

    // ── Card 1: Thông tin hợp đồng & Bên B ───────────────
    wrap.appendChild(h('div', { className:'card' },

        h('div', { style: { borderTop: '1px solid var(--border)', paddingTop: 12, marginTop: 4 } },

            } };
            render();
          } }, '🗑 Xoá toàn bộ dữ liệu')
        )

}


// ── SYNC — Cloud + 3-2-1 Backup  (v7.4.0) ─────────────────────
function pgSync() {
  const wrap = h('div', {});

  const fmtTs = ts => {
    if (!ts) return 'Chưa có';
    try {
      const d = new Date(ts);
      return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch(e) { return ts; }
  };

  const cloudBadge = (status) => {
    if (!status.enabled) return h('span', { style: { fontSize: 12, color: 'var(--text3)' } }, '☁️ Chưa cấu hình');
    if (!status.online)  return h('span', { style: { fontSize: 12, color: 'var(--amber)', fontWeight: 700 } }, '📵 Offline — đang chờ');
    if (status.syncStatus === 'syncing') return h('span', { style: { fontSize: 12, color: 'var(--blue)', fontWeight: 700 } }, '⏳ Đang đồng bộ...');
    if (status.syncStatus === 'error')   return h('span', { style: { fontSize: 12, color: 'var(--red)', fontWeight: 700 } }, '❌ Lỗi kết nối');
    if (status.syncStatus === 'ok')      return h('span', { style: { fontSize: 12, color: 'var(--green)', fontWeight: 700 } }, '✅ Đã đồng bộ ' + fmtTs(status.lastSync));
    return h('span', { style: { fontSize: 12, color: 'var(--text2)' } }, '☁️ Sẵn sàng');
  };

  const rebuild = () => {
    const lastSaved  = DB.lastSaved();
    const backupTime = DB.getAutoBackupTime();
    const size       = DB.storageSize();
    const isLS       = DB.isLocal();
    const cloudCfg   = CLOUD.getCfg();
    const cloudSt    = CLOUD.getStatus();
    const rotTime    = CLOUD.getRotatingBackupTime();
    const remind     = CLOUD.shouldRemindDownload();

    wrap.innerHTML = '';
    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, '🔄 Đồng Bộ & Sao Lưu 3-2-1'),
          h('div', { className: 'page-sub' }, 'Local-first · Firebase Firestore · Backup xoay vòng · Xuất Excel')
        )
      ),

      // ── NHẮC NHỞ DOWNLOAD nếu quá 7 ngày ──
      remind && h('div', { style: { background: 'rgba(232,165,58,.12)', border: '1px solid rgba(232,165,58,.4)', borderRadius: 'var(--r2)', padding: '12px 16px', marginBottom: 16, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' } },
        h('div', {},
          h('div', { style: { fontWeight: 700, color: 'var(--amber)', fontSize: 13 } }, '⚠️ Đã hơn 7 ngày chưa tải file backup về máy!'),
          h('div', { style: { fontSize: 12, color: 'var(--text2)', marginTop: 3 } }, 'Nguyên tắc 3-2-1: cần 1 bản lưu offline ngoài cloud.')
        ),
        h('button', { className: 'btn btn-sm', style: { background: 'var(--amber)', color: '#0f1117', border: 'none', fontWeight: 700 }, onClick: () => {
          const data = DB.exportAll();
          const a = document.createElement('a');
          a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);

    const returns = S.returns || [];
    const { sales, products } = S;
    const filtered = returns.filter(r => {
      const q = search.toLowerCase();

    }).sort((a, b) => b.date.localeCompare(a.date));

    const totalReturnQty   = returns.reduce((a, r) => a + r.returnQty, 0);
