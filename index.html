          <div style="min-width:110px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;text-align:right">Giá bán</div>
          ${_catIsAdmin ? `<div style="min-width:80px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;text-align:right">Giá nhập</div>
          <div style="min-width:50px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;text-align:right">Lãi</div>` : ''}
          <div style="min-width:90px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;text-align:center">Tồn kho</div>
          <div style="width:66px;flex-shrink:0"></div>
        `;
        tableWrap.appendChild(colHdr);

        function makeRow(p) {
          const stk = parseFloat(p.stock) || 0;
          const hasStock = stk > 0;
          const row = document.createElement('div');
          row.className = 'pl-row' + (hasStock ? '' : ' out-of-stock');

          // Thumbnail
          const thumb = document.createElement('div');
          if (p.image) {
            const img = document.createElement('img'); img.className = 'pl-thumb'; img.src = p.image; img.alt = p.name;
            img.onerror = () => { img.remove(); thumb.className='pl-thumb-ph'; thumb.textContent = (({Granite:'🪨',Marble:'🏛️',Onyx:'💎',Basalt:'⬛',Quartzite:'🌊',Travertine:'🟫',Slate:'🔷'})[p.type]||'🪨'); };
            thumb.appendChild(img);
          } else {
            thumb.className = 'pl-thumb-ph';
            thumb.textContent = (({Granite:'🪨',Marble:'🏛️',Onyx:'💎',Basalt:'⬛',Quartzite:'🌊',Travertine:'🟫',Slate:'🔷'})[p.type]||'🪨');
          }
          row.appendChild(thumb);

          // Tên + thông tin
          const nameWrap = document.createElement('div'); nameWrap.className = 'pl-name';
          const nameText = document.createElement('div'); nameText.className = 'pl-name-text'; nameText.textContent = p.name;
          const nameSub  = document.createElement('div'); nameSub.className = 'pl-name-sub';
          nameSub.textContent = [p.type, p.origin].filter(Boolean).join(' · ');
          nameWrap.appendChild(nameText); nameWrap.appendChild(nameSub);
          row.appendChild(nameWrap);

          // Giá bán
          const sellDiv = document.createElement('div'); sellDiv.className = 'pl-sell';
          if (p.sellPrice > 0) {
            sellDiv.innerHTML = fmt(p.sellPrice) + '<span class="pl-sell-unit">đ/' + (p.unit||'m²') + '</span>';
          } else {
            sellDiv.innerHTML = '<span style="color:var(--text3);font-size:12px">Liên hệ</span>';
          }
          row.appendChild(sellDiv);

          // Giá nhập — chỉ admin mới thấy
          if (_catIsAdmin) {
            const buyDiv = document.createElement('div'); buyDiv.className = 'pl-buy';
            buyDiv.textContent = p.buyPrice > 0 ? fmt(p.buyPrice) + 'đ' : '—';
            row.appendChild(buyDiv);

            // Lãi % — chỉ admin mới thấy
            const marginDiv = document.createElement('div'); marginDiv.className = 'pl-margin';
            if (p.buyPrice > 0 && p.sellPrice > 0) {
              const mg = Math.round((p.sellPrice - p.buyPrice) / p.buyPrice * 100);
              marginDiv.style.color = mg >= 0 ? 'var(--green)' : 'var(--red)';
              marginDiv.textContent = (mg >= 0 ? '+' : '') + mg + '%';
            } else {
              marginDiv.textContent = '—'; marginDiv.style.color = 'var(--text3)';
            }
            row.appendChild(marginDiv);
          }

          // Tồn kho pill
          const sp = document.createElement('span'); sp.className = 'pl-stock-pill';
          if (stk < 0) {
            sp.className = 'pl-stock-pill cat-stock out';
            sp.textContent = '📉 ' + fmtQty(stk) + ' ' + (p.unit||'m²');
          } else if (hasStock) {
            sp.className = 'pl-stock-pill ' + (stk > 10 ? 'cat-stock ok' : 'cat-stock low');
            sp.textContent = fmtQty(stk) + ' ' + (p.unit||'m²');
          } else {
            sp.className = 'pl-stock-pill cat-stock out';
            sp.textContent = 'Hết hàng';
          }
          const spWrap = document.createElement('div'); spWrap.style.cssText = 'min-width:90px;text-align:center';
          spWrap.appendChild(sp);
          row.appendChild(spWrap);

          // Nút bán — luôn cho phép tạo đơn dù hết/âm kho
          const sellBtn = document.createElement('button');
          sellBtn.className = 'pl-sell-btn';
          sellBtn.textContent = hasStock ? '+ Tạo đơn' : (stk < 0 ? '⚠️ Tạo đơn' : '+ Tạo đơn');
          if (!hasStock) sellBtn.style.background = 'rgba(232,165,58,.25)';
          if (!hasStock) sellBtn.style.color = 'var(--amber)';
          if (!hasStock) sellBtn.style.border = '1px solid rgba(232,165,58,.4)';
          sellBtn.addEventListener('click', () => openSaleWithProduct(p, rebuild));
          row.appendChild(sellBtn);

          return row;
        }

        // Phần sẵn hàng
        if (inStock2.length > 0) {
          const div1 = document.createElement('div'); div1.className = 'pl-divider';
          div1.innerHTML = '✅ Đang có hàng (' + inStock2.length + ')';
          tableWrap.appendChild(div1);
          inStock2.forEach(p => tableWrap.appendChild(makeRow(p)));
        }

        // Phần hết hàng
        if (outStock2.length > 0) {
          const div2 = document.createElement('div'); div2.className = 'pl-divider';
          div2.style.marginTop = '4px';
          div2.innerHTML = '⛔ Hết hàng (' + outStock2.length + ')';
          tableWrap.appendChild(div2);
          outStock2.forEach(p => tableWrap.appendChild(makeRow(p)));
        }

        if (filtered2.length === 0) {
          const emptyRow = document.createElement('div');
          emptyRow.style.cssText = 'text-align:center;padding:32px;color:var(--text3);font-size:13px';
          emptyRow.textContent = '🔍 Không tìm thấy sản phẩm nào';
          tableWrap.appendChild(emptyRow);
        }

        sec2.appendChild(tableWrap);
      }

      buildPriceList();

      // Wrapper chứa cả 2 section
      const wrapper = document.createElement('div');
      wrapper.appendChild(sec);
      wrapper.appendChild(sec2);
      return wrapper;
    })();

    wrap.innerHTML = '';
    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, 'Bán Hàng'),
          h('div', { className: 'page-sub' },
            mySales.length + ' đơn · DT: ' + fmt(totalRev) + 'đ · Nợ: ' + fmt(totalDebt) + 'đ' +
            (totalShip > 0 ? ' · VC giao: ' + fmt(totalShip) + 'đ' : ''))
        ),
        h('button', { className: 'btn btn-primary', onClick: () => openSale(rebuild) }, '+ Tạo đơn hàng')
      ),
      !isAdmin && h('div', { style: { background:'rgba(91,143,232,.1)', border:'1px solid rgba(91,143,232,.3)', borderRadius:'var(--r2)', padding:'9px 14px', marginBottom:14, fontSize:12, color:'var(--blue)' } },
        '👷 Bạn đang xem đơn hàng của tài khoản: <b>' + (currentUser?.displayName || currentUser?.username || '') + '</b> · Chỉ hiển thị đơn do bạn tạo'
      ),
      catalogueSection,
      h('div', { style: { display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' } },
        inp('text', '🔍 Tìm khách hàng, sản phẩm...', search, v => { search = v; curPage = 0; rebuild(); }, { style: { flex: '1 1 180px' } }),
        sel([{ value:'all',label:'Tất cả' },{ value:'done',label:'✅ Đã xong' },{ value:'debt',label:'⚠️ Còn nợ' }], fStatus, v => { fStatus = v; curPage = 0; rebuild(); }, { style: { width:'130px' } })
      ),
      h('div', { className: 'table-wrap' },
        h('table', {},
          h('thead', {}, h('tr', {},
            th('Ngày'), th('Khách hàng'), th('Sản phẩm'), th('Tạm tính'), th('VAT HH'), th('Phí VC'), th('VAT VC'), th('Tổng'), isAdmin && th('Số m²'), th('Đã thu'), th('Còn nợ'), isAdmin && th('% LN'), th('TT'), th('')
          )),
          h('tbody', {},
            ...paginated.map(s => {
              const shipFeeNet = (s.shipVatRate||0) > 0 ? (s.shipFee||0)/(1+s.shipVatRate/100) : (s.shipFee||0);
              return h('tr', {},
                h('td', { style:{color:'var(--text2)',fontSize:12} }, fmtD(s.date)),
                h('td', {},
                  h('div', { style:{fontWeight:600} }, s.customer),
                  h('div', { style:{fontSize:11,color:'var(--text3)'} }, s.phone||'')
                ),
                h('td', {},
                  h('div', { style:{fontWeight:500} }, s.productName),
                  s.variantSize && h('div', { style:{fontSize:10,color:'var(--accent)',marginTop:2} }, '📐 ' + s.variantSize)
                ),
                h('td', {}, fmt(s.subTotal||0) + 'đ'),
                h('td', {},
                  s.vatRate > 0
                    ? h('span', {className:'badge badge-blue'}, s.vatRate+'%')
                    : h('span', {style:{color:'var(--text3)'}}, '0%')
                ),
                h('td', {},
                  (s.shipFee||0) > 0
                    ? h('span', {style:{color:'var(--amber)',fontWeight:600}}, fmt(s.shipFee)+'đ' + (s.shipUnit ? '/'+s.shipUnit:''))
                    : h('span', {style:{color:'var(--text3)'}}, '—')
                ),
                h('td', {},
                  (s.shipFee||0) > 0
                    ? ((s.shipVatRate||0) > 0
                        ? h('span',{className:'badge badge-blue'}, s.shipVatRate+'%')
                        : h('span',{className:'badge',style:{background:'rgba(92,88,80,.15)',color:'var(--text3)',border:'1px solid rgba(92,88,80,.3)'}}, 'KT'))
                    : h('span',{style:{color:'var(--text3)'}}, '—')
                ),
                h('td', { style:{fontWeight:700} }, fmt(s.total)+'đ'),
                isAdmin && (() => {
                  // Tính số m² của đơn hàng
                  const prod = S.products.find(p => p.id === s.productId);
                  const unit = s.unit || (prod?.unit || '');
                  const qty = s.qty || 0;
                  if (unit === 'm²' || unit === 'm2') {
                    return h('td', { style:{color:'var(--blue)',fontWeight:600,fontSize:12} }, qty.toFixed(2) + ' m²');
                  }
                  // Nếu có variantId, tính từ kích thước viên
                  if (s.variantId && prod && prod.variants) {
                    const vt = prod.variants.find(v => v.id === s.variantId);
                    if (vt && vt.tileW > 0 && vt.tileH > 0) {
                      const m2perPiece = (vt.tileW * vt.tileH) / 10000;
                      const totalM2 = qty * m2perPiece;
                      return h('td', { style:{color:'var(--blue)',fontWeight:600,fontSize:12} },
                        h('div', {}, totalM2.toFixed(2) + ' m²'),
                        h('div', { style:{fontSize:10,color:'var(--text3)'} }, qty + ' viên · ' + vt.tileW+'×'+vt.tileH+'cm')
                      );
                    }
                  }
                  // Nếu đơn vị là viên và sản phẩm có 1 variant
                  if ((unit === 'viên' || unit === 'tấm') && prod && prod.variants && prod.variants.length === 1) {
                    const vt = prod.variants[0];
                    if (vt.tileW > 0 && vt.tileH > 0) {
                      const m2perPiece = (vt.tileW * vt.tileH) / 10000;
                      return h('td', { style:{color:'var(--blue)',fontWeight:600,fontSize:12} }, (qty * m2perPiece).toFixed(2) + ' m²');
                    }
                  }
                  return h('td', { style:{color:'var(--text3)',fontSize:11} }, '—');
                })(),
                h('td', { style:{color:'var(--green)'} }, fmt(s.paid)+'đ'),
                h('td', {className:'amount-neg'}, s.status==='debt' ? fmt(s.total-s.paid)+'đ' : '—'),
                isAdmin && (() => {
                  // Tính % LN: (giá bán - giá vốn) / giá vốn
                  const imp = [...S.imports].filter(i => i.productId === s.productId && i.date <= s.date).sort((a,b)=>b.date.localeCompare(a.date))[0];
                  const buyP = imp ? (imp.unitPrice||0) : (S.products.find(p=>p.id===s.productId)?.buyPrice||0);
                  const sellP = s.unitPrice||0;
                  if (!buyP || !sellP) return h('td', {style:{color:'var(--text3)'}}, '—');
                  const pctVal = Math.round((sellP - buyP) / buyP * 100);
                  const profitPerUnit = sellP - buyP;
                  const totalProfit = profitPerUnit * (s.qty || 1);
                  const col = pctVal >= 0 ? 'var(--green)' : 'var(--red)';
                  return h('td', {},
                    h('span', {className:'badge', style:{background: pctVal>=0?'rgba(76,175,125,.15)':'rgba(224,92,92,.15)', color:col, border:'1px solid '+(pctVal>=0?'rgba(76,175,125,.3)':'rgba(224,92,92,.3)'), fontWeight:700}}, (pctVal>=0?'+':'')+pctVal+'%'),
                    h('div', {style:{fontSize:10,color:col,marginTop:3,fontWeight:600}}, (totalProfit>=0?'+':'')+fmt(Math.round(totalProfit))+'đ')
                  );
                })(),
                h('td', {}, h('span', {className:'badge badge-'+(s.status==='done'?'green':'red')}, s.status==='done'?'Xong':'Nợ')),
                h('td', {}, h('div', {style:{display:'flex',gap:4}},
                  s.status==='debt' && h('button', {
                    className:'btn btn-xs', style:{background:'var(--green)',color:'#fff',border:'none'},
                    onClick: () => { S.sales=S.sales.map(x=>x.id===s.id?{...x,paid:x.total,status:'done'}:x); save('sales'); toast('Đã thu hết nợ','success'); rebuild(); }
                  }, '✓ Thu'),
                  s.qty>0 && h('button', {
                    className:'btn btn-xs', style:{background:'var(--amber)',color:'#fff',border:'none'},
                    onClick: () => openReturnFromSale(s, rebuild)
                  }, '↩️ Trả'),
                  h('button', {
                    className:'btn btn-ghost btn-xs',
                    onClick: () => {
                      // Kiểm tra phiếu trả hàng liên kết với đơn này
                      const linkedReturns = (S.returns || []).filter(r => r.saleId === s.id);
                      const linkedLogs    = (S.paymentlogs || []).filter(l => l.refId === s.id && l.type === 'customer');
                      let confirmMsg = 'Xoá đơn hàng của "' + s.customer + '"?';
                      if (linkedReturns.length > 0) {
                        confirmMsg += '\n\n⚠️ Đơn này có ' + linkedReturns.length + ' phiếu trả hàng liên kết → sẽ bị xoá theo để tránh sai tồn kho.';
                        confirmMsg += '\n(Hàng trả đã được cộng kho khi tạo phiếu → sẽ trừ lại khi xoá phiếu trả)';
                      }
                      if (linkedLogs.length > 0) {
                        confirmMsg += '\n\n📋 ' + linkedLogs.length + ' lịch sử thanh toán của đơn cũng sẽ bị xoá.';
                      }
                      S.confirm = {
                        msg: confirmMsg,
                        onYes: () => {
                          // 1. Hoàn kho: chỉ hoàn SL còn lại trong đơn (qty hiện tại sau khi trả hàng đã trừ)
                          if (s.qty > 0) {
                            S.products = S.products.map(p => {
                              if (p.id !== s.productId) return p;
                              const newStock = p.stock + s.qty;
                              const newVariants = (p.variants||[]).map(vt => {
                                if (!s.variantId || vt.id !== s.variantId) return vt;
                                const ppm2=(vt.tileW>0&&vt.tileH>0)?10000/(vt.tileW*vt.tileH):0;
                                const newM2=(vt.stockM2||0)+s.qty;
                                return {...vt, stockM2:newM2, stockPieces:ppm2>0?Math.round(newM2*ppm2):(vt.stockPieces||0)+Math.round(s.qty*(ppm2||0))};
                              });
                              return {...p, stock:newStock, variants:newVariants};
                            });
                          }

                          // 2. Xử lý phiếu trả hàng liên kết: trừ lại kho (hoàn kho đã cộng khi trả) rồi xoá phiếu
                          if (linkedReturns.length > 0) {
                            linkedReturns.forEach(r => {
                              S.products = S.products.map(p => {
                                if (p.id !== r.productId) return p;
                                const newStock = Math.max(0, p.stock - r.returnQty);
                                return {...p, stock: newStock};
                              });
                            });
                            // Soft-delete phiếu trả liên kết
                            const _now = new Date().toISOString();
                            S.returns = (S.returns || []).map(r => r.saleId !== s.id ? r : { ...r, _deleted: true, _updated: _now });
                            save('returns');
                            setTimeout(() => { S.returns = (S.returns||[]).filter(r=>!r._deleted); DB.set('dtn_returns', S.returns); }, 600);
                          }

                          // 3. Soft-delete paymentlogs của đơn này
                          if (linkedLogs.length > 0) {
                            const _now2 = new Date().toISOString();
                            S.paymentlogs = (S.paymentlogs || []).map(l => (l.refId === s.id && l.type === 'customer') ? { ...l, _deleted: true, _updated: _now2 } : l);
                            save('paymentlogs');
                            setTimeout(() => { S.paymentlogs = (S.paymentlogs||[]).filter(l=>!l._deleted); DB.set('dtn_paymentlogs', S.paymentlogs); }, 600);
                          }

                          // 4. Soft-delete đơn bán
                          save('products');
                          softDelete('sales', s.id, () => {});

                          const msg = linkedReturns.length > 0
                            ? `Đã xoá đơn + ${linkedReturns.length} phiếu trả hàng liên kết`
                            : 'Đã xoá đơn hàng';
                          toast(msg, 'info');
                          rebuild();
                        }
                      };
                      render();
                    }
                  }, '🗑')
                ))
              );
            }),
            filtered.length===0 && h('tr',{},h('td',{colspan:13,style:{textAlign:'center',padding:32,color:'var(--text3)'}},'Không có đơn hàng'))
          )
        )
      ),
      // ── Pagination bar ─────────────────────────────────────────
      totalPages > 1 && h('div', { style:{display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginTop:14,flexWrap:'wrap'} },
        h('button',{className:'btn btn-sm'+(curPage===0?' btn-ghost':''),style:{minWidth:36},onClick:()=>{curPage=0;rebuild();}},h('span',{},'«')),
        h('button',{className:'btn btn-sm',disabled:curPage===0,style:{minWidth:36},onClick:()=>{if(curPage>0){curPage--;rebuild();}}},h('span',{},'‹')),
        h('span',{style:{fontSize:12,color:'var(--text2)',padding:'0 8px'}},
          'Trang '+(curPage+1)+'/'+totalPages+' ('+filtered.length+' đơn)'
        ),
        h('button',{className:'btn btn-sm',disabled:curPage>=totalPages-1,style:{minWidth:36},onClick:()=>{if(curPage<totalPages-1){curPage++;rebuild();}}},h('span',{},'›')),
        h('button',{className:'btn btn-sm'+(curPage===totalPages-1?' btn-ghost':''),style:{minWidth:36},onClick:()=>{curPage=totalPages-1;rebuild();}},h('span',{},'»'))
      )
    ));
  };
  rebuild();
  return wrap;
}

// ── Mở form bán hàng với sản phẩm đã chọn sẵn từ catalogue ──
function openSaleWithProduct(product, rebuild) {
  openSale(rebuild, product);
}

function openSale(rebuild, preselectedProduct) {
  const { products, settings } = S;
  const defaultVat = 0; // Mặc định không VAT — tick checkbox để bật VAT
  const SALE_SHIP_UNITS = ['chuyến','tấn','cái','thùng','kg','m²','tấm'];

  // ── Shared fields ─────────────────────────────────────────────
  const inpDate  = mkInput('date','',today(),v=>{});
  const inpCust  = mkInput('text','Tên khách hàng','',v=>{});
  const inpPhone = mkInput('tel','0909...','',v=>{});
  const inpAddr  = mkInput('text','Địa chỉ giao hàng...','',v=>{});
  const inpNote  = mkInput('text','Ghi chú...','',v=>{});
  const inpPaid  = mkInput('number','VD: 0','',v=>updateSum());

  // ── Nhân viên phụ trách (chỉ admin mới chọn được) ────────────
  const _saleCurrentUser = AUTH.currentUser();
  const _saleIsAdminForm = _saleCurrentUser && _saleCurrentUser.role === 'admin';
  let selStaffId = _saleCurrentUser?.username || null;
  let selStaffName = _saleCurrentUser?.displayName || _saleCurrentUser?.username || null;
  let staffFieldEl = null;
  if (_saleIsAdminForm) {
    const staffAccts = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
    const staffOpts = [
      { value: '__admin__', label: '👑 Admin ('+_saleCurrentUser.username+')' },
      ...staffAccts.filter(s=>s.active).map(s=>({ value: s.username, label: '👤 '+( s.displayName||s.username) }))
    ];
    staffFieldEl = mkSelect(staffOpts, '__admin__', v => {
      if (v === '__admin__') { selStaffId = _saleCurrentUser.username; selStaffName = _saleCurrentUser.displayName || _saleCurrentUser.username; }
      else { const found = staffAccts.find(s=>s.username===v); selStaffId = v; selStaffName = found?.displayName || v; }
    });
  }

  // ── Phí vận chuyển ───────────────────────────────────────────
  const inpShipFee  = mkInput('number','Đơn giá VC (chưa VAT)','',v=>updateSum());
  const inpShipQty  = mkInput('number','Số lượng','',v=>updateSum());
  const selShipUnit = mkSelect(SALE_SHIP_UNITS.map(u=>({value:u,label:u})), 'chuyến', v=>{ updateShipQtyVisible(); updateSum(); });
  const vatShipRow  = mkVatRow(0, () => updateSum());

  // ── Tick: Tính vận chuyển cho khách ─────────────────────────
  // Mặc định = false → VC khấu hao vào lợi nhuận cửa hàng, KHÔNG in lên hoá đơn
  // Tick = true      → VC tính cho khách, in lên hoá đơn, KHÔNG trừ LN cửa hàng
  let shipForCustomer = false;
  const shipTickWrap = document.createElement('div');
  shipTickWrap.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:var(--r2);border:1px solid var(--border2);margin-bottom:6px;cursor:pointer;user-select:none;-webkit-user-select:none';
  function rebuildShipTick() {
    shipTickWrap.innerHTML = '';
    // Checkbox giả
    const box = document.createElement('div');
    box.style.cssText = `width:20px;height:20px;border-radius:5px;border:2px solid ${shipForCustomer?'var(--accent)':'var(--border2)'};background:${shipForCustomer?'var(--accent)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s`;
    if (shipForCustomer) { box.innerHTML = '<span style="color:#0f1117;font-size:13px;font-weight:900">✓</span>'; }
    const lbl = document.createElement('div');

  // ── Danh sách mặt hàng ───────────────────────────────────────
  let saleItems = [{ id: uid(), productId: preselectedProduct ? preselectedProduct.id : '', variantId:'', qty:'', price: preselectedProduct ? (preselectedProduct.sellPrice||'') : '', vatRate: defaultVat }];
  const itemsContainer = document.createElement('div');

  // ── Summary box ───────────────────────────────────────────────
  const sumEl = document.createElement('div');
  sumEl.className='sum-box fg-full'; sumEl.style.display='none';

  function updateSum() {
    const shipUnit = selShipUnit.value;
    const shipQtyVal = shipUnit === 'chuyến' ? 1 : (parseFloat(inpShipQty.value)||0);
    const shipUnitPrice = parseFloat(inpShipFee.value)||0;
    const shipVat = vatShipRow._getVal();
    const shipNetAmt = Math.round(shipUnitPrice * shipQtyVal);
    const shipVatAmt = shipVat > 0 ? Math.round(shipNetAmt * shipVat / 100) : 0;
    const shipFeeTotal = shipNetAmt + shipVatAmt;
    const paid = parseFloat(inpPaid.value)||0;

    let totalSub=0, totalVatAmt=0, totalGoods=0;
    saleItems.forEach(it => {
      const qty = parseFloat(it.qty)||0, price = parseFloat(it.price)||0, vat = parseFloat(it.vatRate)||0;
      const sub = qty*price;
      const va = Math.round(sub*vat/100);
      totalSub += sub; totalVatAmt += va; totalGoods += sub+va;
    });
    const total = totalGoods + shipFeeTotal;
    const remaining = Math.max(0, total - paid);

    if (totalSub > 0 || shipNetAmt > 0) {
      sumEl.style.display='';
      let html='';
      if (saleItems.length > 1) {
        html+='<div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">📋 Tổng '+saleItems.length+' mặt hàng</div>';
        saleItems.forEach((it,idx) => {
          const prod = products.find(p=>p.id===it.productId);
          const qty=parseFloat(it.qty)||0, price=parseFloat(it.price)||0, vat=parseFloat(it.vatRate)||0;
          if (qty>0&&price>0) {
            const sub=qty*price, va=Math.round(sub*vat/100);
            html+='<div class="sum-row" style="font-size:12px"><span style="color:var(--text)">'+(prod?prod.name:'Mặt hàng '+(idx+1))+':</span><span>'+fmt(sub+va)+'đ'+(vat>0?' <span style="color:var(--blue);font-size:10px">(VAT '+vat+'%)</span>':'')+'</span></div>';
          }
        });
        html+='<div style="border-top:1px solid var(--border);margin:6px 0"></div>';
      }
      html+='<div class="sum-row"><span>📋 Doanh thu thuần (chưa VAT):</span><span style="color:var(--blue);font-weight:700">'+fmt(totalSub)+'đ</span></div>';
      if(totalVatAmt>0) html+='<div class="sum-row"><span>🏛️ Tổng VAT đầu ra:</span><span style="color:var(--amber)">+'+fmt(totalVatAmt)+'đ</span></div>';
      if(shipNetAmt>0){
        html+='<div class="sum-row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">';
        if(shipForCustomer){
          html+='<span>🚚 VC tính cho khách:</span><span style="color:var(--accent);font-weight:600">'+fmt(shipNetAmt)+'đ</span></div>';
          if(shipVat>0) html+='<div class="sum-row"><span>🏛️ VAT vận chuyển ('+shipVat+'%):</span><span style="color:var(--blue)">+'+fmt(shipVatAmt)+'đ</span></div>';
          html+='<div class="sum-row" style="font-size:11px;padding:4px 8px;background:rgba(201,168,76,.07);border-radius:5px;margin-top:4px"><span style="color:var(--accent)">✅ VC sẽ in lên hoá đơn khách · Không tính vào LN cửa hàng</span><span></span></div>';
        } else {
          html+='<span>🏠 VC cửa hàng tự chịu:</span><span style="color:var(--text2);font-weight:600">'+fmt(shipNetAmt)+'đ</span></div>';
          if(shipVat>0) html+='<div class="sum-row"><span>🏛️ VAT vận chuyển ('+shipVat+'%):</span><span style="color:var(--blue)">+'+fmt(shipVatAmt)+'đ</span></div>';
          html+='<div class="sum-row" style="font-size:11px;padding:4px 8px;background:rgba(91,143,232,.07);border-radius:5px;margin-top:4px"><span style="color:var(--text3)">🏠 VC khấu hao vào LN cửa hàng · Không in lên hoá đơn khách</span><span></span></div>';
        }
      }
      // Tổng khách trả: nếu VC cho khách thì cộng vào, ngược lại không cộng
      const totalForCustomer = shipForCustomer ? total : totalGoods;
      const remainingForCustomer = Math.max(0, totalForCustomer - paid);
      html+='<div class="sum-total"><span>💰 Tổng khách trả:</span><span>'+fmt(totalForCustomer)+'đ</span></div>';
      if(paid>0) html+='<div class="sum-paid"><span>✅ Đã thanh toán:</span><span>'+fmt(paid)+'đ</span></div>';
      if(remainingForCustomer>0) html+='<div class="sum-debt"><span>⚠️ Còn nợ:</span><span>'+fmt(remainingForCustomer)+'đ</span></div>';
      sumEl.innerHTML=html;
    } else { sumEl.style.display='none'; }
  }

  // ── Tạo 1 dòng mặt hàng ──────────────────────────────────────
  function makeSaleItemRow(it, idx) {
    const rowEl = document.createElement('div');

    rowTitle.textContent='🧾 Mặt hàng '+(idx+1);
    rowHeader.appendChild(rowTitle);
    if (saleItems.length > 1) {
      const delBtn = document.createElement('button');
      delBtn.type='button'; delBtn.className='btn btn-danger btn-xs'; delBtn.textContent='✕ Xoá';

    }

    const grid1 = document.createElement('div');
    grid1.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';

    // Chọn sản phẩm
    const prodGrp = document.createElement('div'); prodGrp.className='form-group';
    const prodLbl = document.createElement('label'); prodLbl.className='form-label'; prodLbl.textContent='Sản phẩm *';
    const selProd = mkSelect(
      [{value:'',label:'— Chọn sản phẩm —'}, ...products.map(p=>({value:p.id,label:p.name+' (còn '+fmtQty(p.stock)+' '+p.unit+')'}))],
      it.productId, v => { it.productId=v; const p=products.find(x=>x.id===v); if(p){it.price=p.sellPrice;priceInp.value=p.sellPrice;} it.variantId=''; renderVtSel(p); updateMinHint(); updateSum(); }
    );
    prodGrp.appendChild(prodLbl); prodGrp.appendChild(selProd);
    grid1.appendChild(prodGrp);

    // Số lượng
    const qtyGrp = document.createElement('div'); qtyGrp.className='form-group';
    const qtyLbl = document.createElement('label'); qtyLbl.className='form-label'; qtyLbl.textContent='Số lượng *';
    const qtyInp = mkInput('number','VD: 31.2',it.qty, v=>{it.qty=v; updateSum();});
    qtyGrp.appendChild(qtyLbl); qtyGrp.appendChild(qtyInp);
    grid1.appendChild(qtyGrp);
    rowEl.appendChild(grid1);

    // Đơn giá + VAT
    const grid2 = document.createElement('div');
    grid2.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';

    const priceGrp = document.createElement('div'); priceGrp.className='form-group';
    const priceLbl = document.createElement('label'); priceLbl.className='form-label'; priceLbl.textContent='Đơn giá bán (VNĐ, chưa VAT) *';
    const priceInp = mkInput('number','VD: 2.000.000',it.price, v=>{it.price=v; updateMinHint(); updateSum();});
    priceGrp.appendChild(priceLbl); priceGrp.appendChild(priceInp);

    // Cảnh báo giá bán tối thiểu — chỉ admin mới thấy
    const minHintEl = document.createElement('div'); minHintEl.style.display='none';
    const _saleUser = AUTH.currentUser();
    const _saleIsAdmin = _saleUser && _saleUser.role === 'admin';
    function updateMinHint() {
      if (!_saleIsAdmin) { minHintEl.style.display='none'; return; } // Ẩn với nhân viên
      const pId = selProd.value; if(!pId){minHintEl.style.display='none';return;}
      const prod = products.find(p=>p.id===pId); if(!prod||!prod.buyPrice){minHintEl.style.display='none';return;}
      const buyPrice = parseFloat(prod.buyPrice)||0;
      const relImps = S.imports.filter(im=>im.productId===pId&&(im.shipFee||0)>0&&(im.qty||0)>0);
      let totShip=0,totQty=0; relImps.forEach(im=>{totShip+=(parseFloat(im.shipFee)||0);totQty+=(parseFloat(im.qty)||0);});
      const shipPerUnit = totQty>0 ? totShip/totQty : 0;
      const minSell = Math.ceil(buyPrice+shipPerUnit);
      const curPrice = parseFloat(priceInp.value)||0;
      const isLoss = curPrice>0 && curPrice<minSell;
      minHintEl.style.display='';
      if(isLoss){
        minHintEl.style.cssText='margin-top:6px;padding:8px 12px;background:rgba(224,92,92,.13);border:1px solid rgba(224,92,92,.4);border-radius:6px;font-size:12px;color:var(--red);line-height:1.7';
        minHintEl.innerHTML='⛔ <b>CẢNH BÁO BÁN LỖ!</b> Giá nhập: '+fmt(buyPrice)+'đ'+( shipPerUnit>0?' + VC: '+fmt(Math.round(shipPerUnit))+'đ':'')+' → Min: <b style="color:var(--amber)">'+fmt(minSell)+'đ</b>';
      } else {
        minHintEl.style.cssText='margin-top:6px;padding:7px 12px;background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.25);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.6';
        minHintEl.innerHTML='💡 Giá nhập: '+fmt(buyPrice)+'đ → Min: <b style="color:var(--accent)">'+fmt(minSell)+'đ</b>'+(curPrice>0?' · Lãi: <b style="color:var(--green)">+'+fmt(curPrice-minSell)+'đ</b>':'');
      }
    }
    priceGrp.appendChild(minHintEl);
    grid2.appendChild(priceGrp);

    const vatGrp = document.createElement('div'); vatGrp.className='form-group';
    const vatLbl = document.createElement('label'); vatLbl.className='form-label'; vatLbl.textContent='VAT hàng hoá (0–20%)';
    const vatRow = mkVatRow(it.vatRate||defaultVat, v=>{it.vatRate=v; updateSum();});
    vatGrp.appendChild(vatLbl); vatGrp.appendChild(vatRow);
    grid2.appendChild(vatGrp);
    rowEl.appendChild(grid2);

    // Variant selector
    const vtEl = document.createElement('div'); vtEl.style.display='none'; vtEl.style.marginBottom='10px';
    function renderVtSel(p) {
      vtEl.innerHTML=''; it.variantId='';
      if(!p||!p.variants||p.variants.length===0){vtEl.style.display='none';return;}
      vtEl.style.display='';
      const vlbl=document.createElement('label'); vlbl.className='form-label';
      vlbl.innerHTML='📐 Chọn quy cách <span style="color:var(--amber);font-size:10px">(quan trọng — trừ đúng tồn kho)</span>';
      const vsel=document.createElement('select'); vsel.className='form-input'; vsel.style.borderColor='var(--amber)';
      const defOpt=document.createElement('option'); defOpt.value=''; defOpt.textContent='— Chọn quy cách —'; vsel.appendChild(defOpt);
      p.variants.forEach(vt=>{
        const opt=document.createElement('option'); opt.value=vt.id;
        const ppm2=(vt.tileW>0&&vt.tileH>0)?(10000/(vt.tileW*vt.tileH)).toFixed(1):'?';
        const m2=vt.stockM2||0;
        const icon=m2<=0?'⛔':m2<=5?'⚠️':'✅';
        opt.textContent=icon+' '+vt.tileW+'×'+vt.tileH+'cm — '+fmt(vt.sellPrice||p.sellPrice||0)+'đ/m² — Tồn: '+m2.toFixed(1)+'m²/'+(vt.stockPieces||0)+' viên';
        vsel.appendChild(opt);
      });
      // Grid tồn kho trực quan
      const vtGrid=document.createElement('div');
      vtGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:8px';
      p.variants.forEach(vt=>{
        const m2=vt.stockM2||0;
        const col=m2<=0?'var(--red)':m2<=5?'var(--amber)':'var(--green)';
        const bdr=m2<=0?'rgba(224,92,92,.4)':m2<=5?'rgba(232,165,58,.4)':'rgba(76,175,125,.4)';
        const box=document.createElement('div');
        box.style.cssText=`background:var(--bg4);border:1.5px solid ${bdr};border-radius:8px;padding:8px;text-align:center;cursor:pointer;transition:all .15s`;
        box.innerHTML=`<div style="font-weight:700;color:var(--accent);font-size:12px">${vt.tileW}×${vt.tileH} cm</div><div style="color:${col};font-weight:700;font-size:16px;margin:2px 0">${m2.toFixed(1)} m²</div><div style="color:var(--text3);font-size:10px">${vt.stockPieces||0} viên</div>`;
        box.onclick=()=>{vsel.value=vt.id;vsel.dispatchEvent(new Event('change'));};
        vtGrid.appendChild(box);
      });
      vsel.addEventListener('change',()=>{
        it.variantId=vsel.value;
        const sv=p.variants.find(vt=>vt.id===vsel.value);
        if(sv&&sv.sellPrice){priceInp.value=sv.sellPrice;it.price=sv.sellPrice;}
        else{priceInp.value=p.sellPrice;it.price=p.sellPrice;}
        vsel.style.borderColor=vsel.value?'var(--green)':'var(--amber)';
        updateMinHint(); updateSum();
      });
      vtEl.appendChild(vlbl); vtEl.appendChild(vsel); vtEl.appendChild(vtGrid);
    }
    if(it.productId){const initP=products.find(x=>x.id===it.productId); if(initP) renderVtSel(initP);}
    rowEl.appendChild(vtEl);
    return rowEl;
  }

    saleItems.forEach((it,idx)=>itemsContainer.appendChild(makeSaleItemRow(it,idx)));

      fg('Địa chỉ giao hàng',null, inpAddr),
      _saleIsAdminForm && staffFieldEl ? fg('👤 Nhân viên phụ trách', null, staffFieldEl) : null,
      itemsWrap,
      h('div', {className:'form-group fg-full', style:{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:4}},
        h('div', {style:{fontSize:11,color:'var(--green)',fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:.8}}, '🚚 Phí vận chuyển giao hàng (tuỳ chọn)')

    ),

          if (it.variantId && prod && prod.variants) {

            if (sv && (sv.stockM2||0) < qty) {

            }

        const shipUnit = selShipUnit.value;
        const shipQtyVal = shipUnit==='chuyến' ? 1 : (parseFloat(inpShipQty.value)||0);
        const shipUnitPriceVal = parseFloat(inpShipFee.value)||0;
        const shipVatRate = vatShipRow._getVal();
        const shipNetAmt = Math.round(shipUnitPriceVal * shipQtyVal);

        const itemCalcs2 = saleItems.map(it => {
          const qty=parseFloat(it.qty)||0, price=parseFloat(it.price)||0, vat=parseFloat(it.vatRate)||0;
          const sub=qty*price, vatAmt=Math.round(sub*vat/100), goodsTotal=sub+vatAmt;
          return {qty,price,vat,sub,vatAmt,goodsTotal};
        });
        const totalGoodsGross2 = itemCalcs2.reduce((a,c)=>a+c.goodsTotal,0);
        // Nếu VC tính cho khách → cộng vào tổng khách trả; ngược lại chỉ tính tiền hàng
        const grandTotal = shipForCustomer ? totalGoodsGross2 + shipFee : totalGoodsGross2;
        const totalPaid2 = Math.min(parseFloat(inpPaid.value)||0, grandTotal);
        const dateSaved = inpDate.value;

        // Tạo bản ghi cho từng dòng (chia phí VC theo tỉ lệ nếu tính cho khách)
        const newRecs2 = [];
        saleItems.forEach((it,idx) => {
          const calc = itemCalcs2[idx];
          const prod = products.find(p=>p.id===it.productId);
          let itemShipFee=0;
          // Chỉ phân bổ VC vào bản ghi nếu tính cho khách (hiện trên hoá đơn)
          // Nếu cửa hàng tự chịu: shipFee vẫn lưu để báo cáo LN nhưng đánh dấu storeShip=true
          if(shipFee>0){
            const isLastSale=idx===saleItems.length-1;
            if(totalGoodsGross2>0){
              itemShipFee=isLastSale
                ? shipFee - newRecs2.reduce((a,r)=>a+(r.shipFee||0),0)
                : Math.round(shipFee*calc.goodsTotal/totalGoodsGross2);
            } else {
              itemShipFee=isLastSale
                ? shipFee - newRecs2.reduce((a,r)=>a+(r.shipFee||0),0)
                : Math.round(shipFee/saleItems.length);
            }
          }
          // itemTotal: nếu VC tính cho khách → cộng VC, ngược lại chỉ tiền hàng
          const itemTotal = shipForCustomer ? calc.goodsTotal + itemShipFee : calc.goodsTotal;
          let itemPaid=0;
          if(totalPaid2>0 && grandTotal>0){
            itemPaid = idx===saleItems.length-1
              ? totalPaid2 - newRecs2.reduce((a,r)=>a+(r.paid||0),0)
              : Math.round(totalPaid2*itemTotal/grandTotal);
            itemPaid = Math.max(0,Math.min(itemPaid,itemTotal));
          }
          let vtSize=null;
          if(it.variantId && prod && prod.variants){
            const sv=prod.variants.find(vt=>vt.id===it.variantId);
            if(sv) vtSize=sv.tileW+'×'+sv.tileH+'cm';
          }
          const rec = {
            id:'s'+uid(), date:dateSaved, customer, phone:inpPhone.value.trim(),
            address:inpAddr.value.trim(), productId:it.productId, productName:prod?.name||'',
            qty:calc.qty, unit:prod?.unit||'', unitPrice:calc.price, vatRate:calc.vat,
            subTotal:calc.sub, vatAmt:calc.vatAmt, total:itemTotal, paid:itemPaid,
            shipFee:itemShipFee, shipUnit, shipVatRate, shipQty:shipQtyVal, shipUnitPrice:shipUnitPriceVal,
            shipForCustomer: shipForCustomer, // flag: true=tính cho khách, false=cửa hàng tự chịu
            variantId:it.variantId||null, variantSize:vtSize,
            status:itemPaid>=itemTotal&&itemTotal>0?'done':'debt', note:inpNote.value.trim(),
            staffId: selStaffId || AUTH.currentUser()?.username || null,
            staffName: selStaffName || AUTH.currentUser()?.displayName || null
          };
          newRecs2.push(rec);
        });

        // Trừ tồn kho — gom theo productId để tránh bug nhiều dòng cùng SP
        const stockDeduct = {};
        saleItems.forEach((it,idx) => {
          const calc = itemCalcs2[idx];
          if(!stockDeduct[it.productId]) stockDeduct[it.productId]={stockMinus:0, variantDeltas:{}};
          stockDeduct[it.productId].stockMinus += calc.qty;
          if(it.variantId){
            if(!stockDeduct[it.productId].variantDeltas[it.variantId]) stockDeduct[it.productId].variantDeltas[it.variantId]=0;
            stockDeduct[it.productId].variantDeltas[it.variantId] += calc.qty;
          }
        });
        S.products = S.products.map(p => {
          const d = stockDeduct[p.id]; if(!d) return p;
          const newStock = (p.stock||0) - d.stockMinus; // cho phép âm kho
          const newVariants = (p.variants||[]).map(vt => {
            const vtMinus = d.variantDeltas[vt.id]; if(!vtMinus) return vt;
            const ppm2=(vt.tileW>0&&vt.tileH>0)?10000/(vt.tileW*vt.tileH):0;
            const newM2=(vt.stockM2||0)-vtMinus; // cho phép âm kho
            return {...vt, stockM2:newM2, stockPieces:ppm2>0?Math.round(newM2*ppm2):(vt.stockPieces||0)-Math.round(vtMinus*(ppm2||0))};
          });
          return {...p, stock:newStock, variants:newVariants};
        });

        S.sales=[...newRecs2, ...S.sales];
        save('sales'); save('products');

        // ── Kiểm tra sau khi trừ kho: tạo cảnh báo nhập hàng nếu âm ──
        const stockAlerts = [];
        saleItems.forEach((it, idx) => {
          const calc = itemCalcs2[idx];
          const prod = S.products.find(p => p.id === it.productId);
          if (!prod) return;
          const curStock = parseFloat(prod.stock) || 0;
          if (curStock < 0) {
            // Thu thập chi tiết quy cách bị âm
            const negativeVariants = (prod.variants || [])
              .filter(vt => (vt.stockM2 || 0) < 0 || (vt.stockPieces || 0) < 0)
              .map(vt => ({
                size: vt.tileW + '×' + vt.tileH + 'cm',
                stockM2: vt.stockM2 || 0,
                stockPieces: vt.stockPieces || 0,
                needM2: (vt.stockM2 || 0) < 0 ? Math.abs(vt.stockM2) : 0,
                needPieces: (vt.stockPieces || 0) < 0 ? Math.abs(vt.stockPieces) : 0
              }));
            stockAlerts.push({
              id: 'alert_' + prod.id + '_' + Date.now(),
              productId: prod.id,
              productName: prod.name,
              unit: prod.unit,
              shortfall: Math.abs(curStock),
              createdAt: new Date().toISOString(),
              saleId: newRecs2[idx]?.id || null,
              customer: customer,
              soldQty: calc.qty,
              negativeVariants: negativeVariants
            });
          }
        });

        if (stockAlerts.length > 0) {
          // Lưu alerts vào state (gộp, tránh trùng)
          const existAlerts = S.stockAlerts || [];
          stockAlerts.forEach(a => {
            const existIdx = existAlerts.findIndex(e => e.productId === a.productId);
            if (existIdx >= 0) {
              // Cập nhật nếu đã có alert cho sản phẩm này
              existAlerts[existIdx] = { ...existAlerts[existIdx], shortfall: Math.abs(parseFloat(S.products.find(p=>p.id===a.productId)?.stock)||0), updatedAt: a.createdAt };
            } else {
              existAlerts.push(a);
            }
          });
          S.stockAlerts = existAlerts;
          try { localStorage.setItem('dtn_stockAlerts', JSON.stringify(S.stockAlerts)); } catch(e) {}

          const alertNames = stockAlerts.map(a => a.productName).join(', ');
          toast(`⚠️ Đơn lưu thành công! Kho âm: ${alertNames} — Cần nhập thêm hàng! Xem cảnh báo ở Kho Hàng.`, 'error');
        } else {
          toast('✅ Đã tạo '+newRecs2.length+' đơn hàng · Tổng: '+fmt(grandTotal)+'đ'+(shipFee>0?' · VC: '+fmt(shipFee)+'đ':''),'success');
        }

        S.modal=null;
        rebuild(); render();
      }}, '💾 Lưu đơn hàng')
    ]
  };
  render();
}

                      const logs = (S.paymentlogs || []).filter(l => l.refId === i.id && l.type === 'supplier');

                      const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
                      const inpAmt  = mkInput('number','Số tiền trả (VNĐ)','', () => {});
                      inpAmt.style.fontSize = '16px'; inpAmt.style.fontWeight = '700';
                      inpAmt.setAttribute('inputmode','numeric');
                      const inpDate = mkInput('date','', today(), () => {});
                      const inpTime = mkInput('time','', timeStr, () => {});
                      const inpNote = mkInput('text','VD: chuyển khoản Vietcombank, tiền mặt...','', () => {});

                      const logsEl = document.createElement('div');
                      logsEl.style.cssText = 'margin-top:12px';
                      function renderLogs() {
                        logsEl.innerHTML = '';
                        if (logs.length === 0) {
                          logsEl.appendChild(h('div', { style: { fontSize: 12, color: 'var(--text3)', padding: '8px 0', fontStyle: 'italic' } }, 'Chưa có lịch sử trả tiền'));
                          return;
                        }
                        logsEl.appendChild(h('div', { style: { fontSize: 11, fontWeight: 700, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 } }, '📋 Lịch sử các đợt trả NCC'));
                        logs.forEach((lg, idx) => {
                          const rowEl = h('div', {
                            style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 10px',
                              background: idx % 2 === 0 ? 'var(--bg3)' : 'var(--bg4)',
                              borderRadius: 6, marginBottom: 4, gap: 8, flexWrap: 'wrap' }
                          },
                            h('div', { style: { flex: 1 } },
                              h('div', { style: { fontWeight: 700, color: 'var(--amber)', fontSize: 13 } }, '−' + fmt(lg.amount) + 'đ'),
                              h('div', { style: { fontSize: 11, color: 'var(--text2)', marginTop: 2 } },
                                '📅 ' + fmtD(lg.date) + (lg.time ? ' · 🕐 ' + lg.time : '') +
                                (lg.note ? ' · ' + lg.note : '')
                              )
                            ),
                            h('button', {
                              className: 'btn btn-xs btn-danger', style: { fontSize: 10, padding: '2px 7px' },
                              onClick: () => {
                                if (!confirm(`Xoá khoản trả ${fmt(lg.amount)}đ?`)) return;
                                S.imports = S.imports.map(x => {
                                  if (x.id !== i.id) return x;
                                  const newPaid = Math.max(0, x.paid - lg.amount);
                                  return { ...x, paid: newPaid, status: newPaid >= x.total ? 'paid' : 'debt' };
                                });
                                save('imports');
                                softDelete('paymentlogs', lg.id, () => {});
                                logs.splice(idx, 1);
                                renderLogs();
                                toast(`🗑 Đã xoá khoản trả ${fmt(lg.amount)}đ`, 'info');
                                rebuild();
                              }
                            }, '🗑')
                          );
                          logsEl.appendChild(rowEl);
                        });
                        const totalLogged = logs.reduce((a, l) => a + l.amount, 0);
                        logsEl.appendChild(h('div', { style: { textAlign: 'right', fontSize: 12, color: 'var(--amber)', fontWeight: 700, marginTop: 6, paddingTop: 6, borderTop: '1px solid var(--border)' } },
                          'Tổng đã trả NCC: ' + fmt(totalLogged) + 'đ'
                        ));
                      }
                      renderLogs();

                      S.modal = {
                        title: `🏭 Trả tiền NCC — ${i.supplier}`,
                        large: true,
                        content: h('div', {},
                          h('div', { style: { marginBottom: 14, padding: '12px 14px', background: 'var(--bg3)', borderRadius: 'var(--r2)', fontSize: 13 } },
                            h('div', { style: { fontWeight: 700 } }, i.productName),
                            h('div', { style: { color: 'var(--text2)', marginTop: 4 } }, `Tổng đơn: ${fmt(i.total)}đ · Đã trả: ${fmt(i.paid)}đ`),
                            h('div', { style: { color: 'var(--amber)', fontWeight: 700, marginTop: 4, fontSize: 15 } }, `📦 Còn nợ NCC: ${fmt(remaining)}đ`)
                          ),
                          h('div', { className: 'fg fg2', style: { gap: 10 } },
                            fg('Ngày trả', null, inpDate),
                            fg('Giờ trả', null, inpTime),
                            fg('Số tiền trả (VNĐ) *', null, inpAmt),
                            fg('Ghi chú / Hình thức TT', null, inpNote)
                          ),
                          h('div', { style: { display: 'flex', gap: 8, marginTop: 10 } },
                            h('button', { className: 'btn btn-xs', style: { background: 'var(--amber)', color: '#fff', border: 'none' },
                              onClick: () => { inpAmt.value = remaining; }
                            }, '✓ Trả hết ' + fmt(remaining) + 'đ'),
                            h('button', { className: 'btn btn-xs btn-ghost',
                              onClick: () => { inpAmt.value = Math.round(remaining / 2); }
                            }, '½ Trả nửa')
                          ),
                          logsEl
                        ),
                        footer: [
                          h('button', { className: 'btn', onClick: () => { S.modal = null; render(); } }, 'Đóng'),
                          h('button', { className: 'btn btn-primary', onClick: () => {
                            const amt = parseFloat(inpAmt.value) || 0;
                            const curRemaining = i.total - (S.imports.find(x=>x.id===i.id)?.paid || i.paid);
                            if (amt <= 0) { toast('Vui lòng nhập số tiền trả!', 'error'); return; }
                            if (amt > curRemaining + 0.01) { toast('Số tiền vượt quá số còn nợ ' + fmt(curRemaining) + 'đ!', 'error'); return; }
                            const log = {
                              id: 'pl' + uid(),
                              type: 'supplier',
                              refId: i.id,
                              supplier: i.supplier,
                              date: inpDate.value,
                              time: inpTime.value,
                              amount: amt,
                              note: inpNote.value.trim(),
                              createdAt: new Date().toISOString()
                            };
                            const newPaid = (S.imports.find(x=>x.id===i.id)?.paid || i.paid) + amt;
                            const done = newPaid >= i.total;
                            S.imports = S.imports.map(x => x.id === i.id ? { ...x, paid: newPaid, status: done ? 'paid' : 'debt' } : x);
                            S.paymentlogs = [log, ...(S.paymentlogs || [])];
                            logs.unshift(log);
                            save('imports'); save('paymentlogs');
                            inpAmt.value = ''; inpNote.value = '';
                            renderLogs();
                            toast(done ? `✅ Đã trả hết nợ NCC ${i.supplier}` : `✅ Đã trả ${fmt(amt)}đ · Còn nợ ${fmt(i.total - newPaid)}đ`, 'success');
                            if (done) { S.modal = null; }
                            rebuild();
                            render();
                          } }, '💸 Ghi nhận trả')
                        ]
                      };
                      render();
                    }
                  }, '💸 Trả'),
                  h('button', { className: 'btn btn-xs btn-ghost',
                    onClick: () => {
                      const logs = (S.paymentlogs || []).filter(l => l.refId === i.id && l.type === 'supplier');
                      if (logs.length === 0) { toast('Chưa có lịch sử trả tiền', 'info'); return; }
                      const logsContent = h('div', {},
                        h('div', { style: { marginBottom: 12, padding: '10px 14px', background: 'var(--bg3)', borderRadius: 'var(--r2)', fontSize: 13 } },
                          h('div', { style: { fontWeight: 700 } }, i.supplier + ' — ' + i.productName),
                          h('div', { style: { color: 'var(--text2)', marginTop: 4 } }, `Tổng đơn: ${fmt(i.total)}đ · Đã trả: ${fmt(i.paid)}đ · Còn: ${fmt(i.total - i.paid)}đ`)
                        ),
                        h('div', { style: { fontSize: 11, fontWeight: 700, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8 } }, `📋 ${logs.length} đợt trả tiền`),
                        ...logs.map((lg, idx) => h('div', {
                          style: { display: 'flex', justifyContent: 'space-between', padding: '9px 12px',
                            background: idx % 2 === 0 ? 'var(--bg3)' : 'var(--bg4)',
                            borderRadius: 6, marginBottom: 4, gap: 8 }
                        },
                          h('div', {},
                            h('div', { style: { fontWeight: 700, color: 'var(--amber)', fontSize: 14 } }, '−' + fmt(lg.amount) + 'đ'),
                            h('div', { style: { fontSize: 11, color: 'var(--text2)', marginTop: 3 } },
                              '📅 ' + fmtD(lg.date) + (lg.time ? ' · 🕐 ' + lg.time : '') + (lg.note ? ' · 📝 ' + lg.note : '')
                            )
                          )
                        )),
                        h('div', { style: { textAlign: 'right', fontWeight: 700, color: 'var(--amber)', marginTop: 10, paddingTop: 8, borderTop: '1px solid var(--border)', fontSize: 13 } },
                          'Tổng đã trả: ' + fmt(logs.reduce((a,l)=>a+l.amount,0)) + 'đ'
                        )
                      );
                      S.modal = { title: `📋 Lịch sử trả — ${i.supplier}`, large: true, content: logsContent, footer: [ h('button', { className: 'btn btn-primary', onClick: () => { S.modal = null; render(); } }, 'Đóng') ] };
                      render();
                    }
                  }, '📋')
                )
              )
            )))
          ))
      );

    } else if (tab === 'supphistory') {
      // ── Tab lịch sử nhà cung cấp ──
      const suppMap = {};
      imports.forEach(imp => {
        const key = imp.supplier.trim();
        if (!suppMap[key]) suppMap[key] = { name: key, orders: [] };
        suppMap[key].orders.push(imp);
      });
      const allSupps = Object.values(suppMap).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
      const filteredSupps = allSupps.filter(s => s.name.toLowerCase().includes(suppSearch.toLowerCase()));
      const selSupp = selectedSupp ? suppMap[selectedSupp] : null;
      const suppOrders = selSupp ? [...selSupp.orders].sort((a, b) => b.date.localeCompare(a.date)) : [];
      const suppTotal = suppOrders.reduce((a, i) => a + i.total, 0);
      const suppPaid  = suppOrders.reduce((a, i) => a + i.paid, 0);
      const suppDebtTotal = suppTotal - suppPaid;

      const suppLeftPanel = h('div', { style: { width: '240px', flexShrink: 0 } },
        inp('text', '🔍 Tìm nhà cung cấp...', suppSearch, v => { suppSearch = v; rebuild(); }, { style: { marginBottom: 10 } }),
        h('div', { style: { fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1, fontWeight: 700, marginBottom: 8, paddingLeft: 4 } },
          filteredSupps.length + ' nhà cung cấp'
        ),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 5, maxHeight: '520px', overflowY: 'auto', paddingRight: 4 } },
          ...filteredSupps.map(s => {
            const sDebt  = s.orders.reduce((a, i) => a + (i.total - i.paid), 0);
            const sTotal = s.orders.reduce((a, i) => a + i.total, 0);
            const isActive = selectedSupp === s.name;
            return h('div', {
              style: { padding: '10px 12px', background: isActive ? 'var(--bg4)' : 'var(--bg2)',
                border: `1.5px solid ${isActive ? 'var(--accent)' : 'var(--border)'}`,
                borderRadius: 'var(--r2)', cursor: 'pointer', transition: 'all .15s' },
              onClick: () => { selectedSupp = s.name; rebuild(); }
            },
              h('div', { style: { fontWeight: 700, fontSize: 13, color: isActive ? 'var(--accent)' : 'var(--text)' } }, s.name),
              h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 3 } },
                s.orders.length + ' lần nhập · ' + fmt(sTotal) + 'đ'
              ),
              sDebt > 0 && h('div', { style: { fontSize: 11, color: 'var(--amber)', fontWeight: 700, marginTop: 3 } }, '⚠️ Còn nợ: ' + fmt(sDebt) + 'đ')
            );
          }),
          filteredSupps.length === 0 && h('div', { style: { color: 'var(--text3)', fontSize: 13, padding: '20px 0', textAlign: 'center' } }, 'Không tìm thấy nhà cung cấp')
        )
      );

      const suppRightPanel = selSupp
        ? h('div', { style: { flex: 1, minWidth: 0 } },
            h('div', { className: 'card', style: { marginBottom: 14 } },
              h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 10 } },
                h('div', {},
                  h('div', { style: { fontSize: 20, fontWeight: 700 } }, selSupp.name),
                  h('div', { style: { fontSize: 13, color: 'var(--text2)', marginTop: 4 } }, '🏭 Nhà cung cấp')
                ),
                suppDebtTotal > 0
                  ? h('div', { className: 'badge badge-amber', style: { fontSize: 12, padding: '5px 12px' } }, '⚠️ Còn nợ: ' + fmt(suppDebtTotal) + 'đ')
                  : h('div', { className: 'badge badge-green', style: { fontSize: 12, padding: '5px 12px' } }, '✅ Đã thanh toán hết')
              ),
              h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginTop: 16 } },
                miniStat('Tổng nhập', fmt(suppTotal) + 'đ', 'var(--accent)'),
                miniStat('Đã thanh toán', fmt(suppPaid) + 'đ', 'var(--green)'),
                miniStat('Còn nợ NCC', fmt(suppDebtTotal) + 'đ', suppDebtTotal > 0 ? 'var(--amber)' : 'var(--green)')
              )
            ),
            h('div', { className: 'card-title' }, `📅 Lịch sử ${suppOrders.length} lần nhập hàng`),
            h('div', { className: 'table-wrap' },
              h('table', {},
                h('thead', {}, h('tr', {}, th('Ngày'), th('Sản phẩm'), th('SL'), th('Đơn giá'), th('Tổng'), th('Đã trả'), th('Trạng thái'), th('Chi tiết trả'))),
                h('tbody', {}, ...suppOrders.map(i =>
                  h('tr', {},
                    h('td', { style: { whiteSpace: 'nowrap', color: 'var(--text2)', fontSize: 12 } }, fmtD(i.date)),
                    h('td', {},
                      h('div', { style: { fontWeight: 600 } }, i.productName),
                      i.note && h('div', { style: { fontSize: 11, color: 'var(--text3)' } }, i.note)
                    ),
                    h('td', {}, i.qty > 0 ? fmtQty(i.qty) + ' ' + i.unit : '—'),
                    h('td', {}, i.unitPrice > 0 ? fmt(i.unitPrice) + 'đ' : '—'),
                    h('td', { style: { fontWeight: 700, color: 'var(--accent)' } }, fmt(i.total) + 'đ'),
                    h('td', { style: { color: 'var(--green)' } }, fmt(i.paid) + 'đ'),
                    h('td', {}, h('span', { className: 'badge badge-' + (i.status === 'paid' ? 'green' : 'amber') },
                      i.status === 'paid' ? '✅ Đã TT' : '⚠️ Nợ ' + fmt(i.total - i.paid) + 'đ'
                    )),
                    h('td', {}, (() => {
                      const lg = (S.paymentlogs || []).filter(l => l.refId === i.id && l.type === 'supplier');
                      if (lg.length === 0) return h('span', { style: { color: 'var(--text3)', fontSize: 11 } }, '—');
                      return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 3 } },
                        ...lg.map(l => h('div', {
                          style: { fontSize: 11, background: 'rgba(232,165,58,.1)', borderRadius: 4, padding: '2px 7px',
                            color: 'var(--amber)', whiteSpace: 'nowrap' }
                        }, '−' + fmt(l.amount) + 'đ · ' + fmtD(l.date) + (l.time ? ' ' + l.time : '') + (l.note ? ' · ' + l.note : '')))
                      );
                    })())
                  )
                )),
                suppOrders.length === 0 && h('tr', {}, h('td', { colspan: 7, style: { textAlign: 'center', padding: 32, color: 'var(--text3)' } }, 'Không có lịch sử nhập hàng'))
              )
            )
          )
        : h('div', { className: 'empty', style: { paddingTop: 60 } },
            h('div', { className: 'empty-icon' }, '🏭'),
            h('div', {}, 'Chọn một nhà cung cấp để xem lịch sử nhập hàng')
          );

      tabContent = h('div', { style: { display: 'flex', gap: 16, alignItems: 'flex-start', flexWrap: 'wrap' } }, suppLeftPanel, suppRightPanel);

    } else {
      // ── Tab lịch sử khách hàng ──
      const cust = selectedCust ? custMap[selectedCust] : null;
      const orders = cust ? [...cust.orders].sort((a, b) => b.date.localeCompare(a.date)) : [];
      const custTotal = orders.reduce((a, s) => a + s.total, 0);
      const custPaid  = orders.reduce((a, s) => a + s.paid, 0);
      const custDebt  = custTotal - custPaid;

      const leftPanel = h('div', { style: { width: '240px', flexShrink: 0 } },
        inp('text', '🔍 Tìm khách hàng...', histSearch, v => { histSearch = v; rebuild(); }, { style: { marginBottom: 10 } }),
        h('div', { style: { fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1, fontWeight: 700, marginBottom: 8, paddingLeft: 4 } },
          `${filteredCusts.length} khách hàng`
        ),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 5, maxHeight: '520px', overflowY: 'auto', paddingRight: 4 } },
          ...filteredCusts.map(c => {
            const cDebt  = c.orders.reduce((a, s) => a + (s.total - s.paid), 0);
            const cTotal = c.orders.reduce((a, s) => a + s.total, 0);
            const isActive = selectedCust === c.name;
            return h('div', {
              style: { padding: '10px 12px', background: isActive ? 'var(--bg4)' : 'var(--bg2)',
                border: `1.5px solid ${isActive ? 'var(--accent)' : 'var(--border)'}`,
                borderRadius: 'var(--r2)', cursor: 'pointer', transition: 'all .15s' },
              onClick: () => { selectedCust = c.name; rebuild(); }
            },
              h('div', { style: { fontWeight: 700, fontSize: 13, color: isActive ? 'var(--accent)' : 'var(--text)' } }, c.name),
              h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 3 } },
                c.phone ? '📞 ' + c.phone + ' · ' : '',
                c.orders.length + ' đơn · ' + fmt(cTotal) + 'đ'
              ),
              cDebt > 0 && h('div', { style: { fontSize: 11, color: 'var(--red)', fontWeight: 700, marginTop: 3 } }, '⚠️ Nợ: ' + fmt(cDebt) + 'đ')
            );
          }),
          filteredCusts.length === 0 && h('div', { style: { color: 'var(--text3)', fontSize: 13, padding: '20px 0', textAlign: 'center' } }, 'Không tìm thấy khách hàng')
        )
      );

      const rightPanel = cust
        ? h('div', { style: { flex: 1, minWidth: 0 } },
            // Header khách hàng
            h('div', { className: 'card', style: { marginBottom: 14 } },
              h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 10 } },
                h('div', {},
                  h('div', { style: { fontSize: 20, fontWeight: 700 } }, cust.name),
                  cust.phone && h('div', { style: { fontSize: 13, color: 'var(--text2)', marginTop: 4 } }, '📞 ' + cust.phone)
                ),
                h('div', { style: { display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' } },
                  custDebt > 0
                    ? h('div', { className: 'badge badge-red', style: { fontSize: 12, padding: '5px 12px' } }, '⚠️ Còn nợ: ' + fmt(custDebt) + 'đ')
                    : h('div', { className: 'badge badge-green', style: { fontSize: 12, padding: '5px 12px' } }, '✅ Không có nợ'),
                  custDebt > 0 && h('button', {
                    className: 'btn btn-primary btn-sm',
                    style: { background: 'var(--green)', borderColor: 'var(--green)', color: '#fff', fontWeight: 700 },
                    onClick: () => {
                      // Thu nợ tổng — tự động khấu trừ vào các đơn còn nợ theo thứ tự cũ nhất trước
                      const debtOrders = [...orders].filter(s => s.status === 'debt').sort((a, b) => a.date.localeCompare(b.date));
                      const now2 = new Date();
                      const timeStr2 = now2.getHours().toString().padStart(2,'0') + ':' + now2.getMinutes().toString().padStart(2,'0');
                      const inpAmt2  = mkInput('number', 'Số tiền thu (VNĐ)', String(custDebt), () => {});
                      inpAmt2.style.fontSize = '18px'; inpAmt2.style.fontWeight = '700';
                      inpAmt2.setAttribute('inputmode','numeric');
                      const inpDate2 = mkInput('date', '', today(), () => {});
                      const inpTime2 = mkInput('time', '', timeStr2, () => {});
                      const inpNote2 = mkInput('text', 'VD: chuyển khoản, tiền mặt...', '', () => {});

                      // Preview phân bổ
                      const previewEl = document.createElement('div');
                      previewEl.style.cssText = 'margin-top:12px';

                      function renderPreview() {
                        const amtIn = parseFloat(inpAmt2.value) || 0;
                        previewEl.innerHTML = '';
                        if (amtIn <= 0) return;
                        const title = document.createElement('div');
                        title.style.cssText = 'font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px';
                        title.textContent = '📋 Phân bổ tự động (cũ nhất trước)';
                        previewEl.appendChild(title);
                        let remain = amtIn;
                        debtOrders.forEach(s => {
                          if (remain <= 0) return;
                          const owe = s.total - s.paid;
                          const pay = Math.min(owe, remain);
                          remain -= pay;
                          const rowEl = document.createElement('div');
                          rowEl.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg3);border-radius:6px;margin-bottom:4px;font-size:12px';
                          rowEl.innerHTML = `<div><span style="color:var(--text2)">📅 ${fmtD(s.date)} · ${s.productName}</span><br><span style="color:var(--red);font-size:11px">Nợ: ${fmt(owe)}đ</span></div><div style="font-weight:700;color:var(--green)">Thu: ${fmt(pay)}đ${pay >= owe ? ' ✅' : ''}</div>`;
                          previewEl.appendChild(rowEl);
                        });
                        if (remain > 0) {
                          const warn = document.createElement('div');
                          warn.style.cssText = 'font-size:11px;color:var(--amber);margin-top:4px';
                          warn.textContent = `⚠️ Dư ${fmt(remain)}đ (vượt quá tổng nợ ${fmt(custDebt)}đ)`;
                          previewEl.appendChild(warn);
                        }
                      }
                      inpAmt2.addEventListener('input', renderPreview);
                      renderPreview();

                      S.modal = {
                        title: `💰 Thu nợ tổng — ${cust.name}`,
                        large: true,
                        content: h('div', {},
                          h('div', { style: { marginBottom: 14, padding: '12px 14px', background: 'var(--bg3)', borderRadius: 'var(--r2)', fontSize: 13 } },
                            h('div', { style: { fontWeight: 700, fontSize: 15, color: 'var(--text)' } }, cust.name),
                            cust.phone && h('div', { style: { color: 'var(--text2)', marginTop: 3 } }, '📞 ' + cust.phone),
                            h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginTop: 10 } },
                              h('div', { style: { textAlign: 'center' } },
                                h('div', { style: { fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 3 } }, 'Tổng mua'),
                                h('div', { style: { fontWeight: 700, color: 'var(--accent)' } }, fmt(custTotal) + 'đ')
                              ),
                              h('div', { style: { textAlign: 'center' } },

                                h('div', { style: { fontWeight: 700, color: 'var(--green)' } }, fmt(custPaid) + 'đ')
                              ),
                              h('div', { style: { textAlign: 'center' } },
                                h('div', { style: { fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 3 } }, 'Còn nợ'),
                                h('div', { style: { fontWeight: 700, color: 'var(--red)', fontSize: 15 } }, fmt(custDebt) + 'đ')
                              )
                            ),
                            h('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 8 } },
                              `${debtOrders.length} đơn chưa thanh toán · Phân bổ tự động theo thứ tự ngày cũ nhất`
                            )
                          ),
                          h('div', { className: 'fg fg2', style: { gap: 10 } },
                            fg('Ngày thu', null, inpDate2),
                            fg('Giờ thu', null, inpTime2),
                            fg('Số tiền thu (VNĐ) *', true, inpAmt2),
                            fg('Ghi chú / Hình thức TT', true, inpNote2)
                          ),
                          h('div', { style: { display: 'flex', gap: 8, marginTop: 8 } },
                            h('button', { className: 'btn btn-xs', style: { background: 'var(--green)', color: '#fff', border: 'none' },
                              onClick: () => { inpAmt2.value = custDebt; renderPreview(); }
                            }, '✓ Thu hết ' + fmt(custDebt) + 'đ'),
                            h('button', { className: 'btn btn-xs btn-ghost',
                              onClick: () => { inpAmt2.value = Math.round(custDebt / 2); renderPreview(); }
                            }, '½ Thu nửa')
                          ),
                          previewEl
                        ),
                        footer: [
                          h('button', { className: 'btn', onClick: () => { S.modal = null; render(); } }, 'Huỷ'),
                          h('button', { className: 'btn btn-primary', style: { background: 'var(--green)', borderColor: 'var(--green)' }, onClick: () => {
                            const amtIn = parseFloat(inpAmt2.value) || 0;
                            if (amtIn <= 0) { toast('Vui lòng nhập số tiền thu!', 'error'); return; }
                            if (amtIn > custDebt + 0.01) { toast('Số tiền vượt quá tổng nợ ' + fmt(custDebt) + 'đ!', 'error'); return; }
                            const dateIn = inpDate2.value;
                            const timeIn = inpTime2.value;
                            const noteIn = inpNote2.value.trim();

                            // Phân bổ vào các đơn (cũ nhất trước)
                            let remaining2 = amtIn;
                            const newLogs = [];
                            const updatedSales = S.sales.map(sale => {
                              if (remaining2 <= 0) return sale;
                              const matchDebt = debtOrders.find(d => d.id === sale.id);
                              if (!matchDebt) return sale;
                              const owe = sale.total - sale.paid;
                              if (owe <= 0) return sale;
                              const pay = Math.min(owe, remaining2);
                              remaining2 -= pay;
                              const newPaid = sale.paid + pay;
                              const done = newPaid >= sale.total;
                              newLogs.push({
                                id: 'pl' + uid(),
                                type: 'customer',
                                refId: sale.id,
                                customer: cust.name,
                                date: dateIn,
                                time: timeIn,
                                amount: pay,
                                note: noteIn || 'Thu nợ tổng',
                                createdAt: new Date().toISOString()
                              });
                              return { ...sale, paid: newPaid, status: done ? 'done' : 'debt' };
                            });

                            S.sales = updatedSales;
                            S.paymentlogs = [...newLogs, ...(S.paymentlogs || [])];
                            save('sales'); save('paymentlogs');
                            S.modal = null;
                            toast(`✅ Đã thu ${fmt(amtIn)}đ · Cập nhật ${newLogs.length} đơn hàng`, 'success');
                            rebuild();
                            render();
                          } }, '💰 Xác nhận thu nợ tổng')
                        ]
                      };
                      render();
                    }

              )
            ),
            // Timeline đơn hàng
            h('div', { className: 'card-title' }, `📅 Lịch sử ${orders.length} đơn hàng`),
            h('div', { className: 'table-wrap' },
              h('table', {},
                h('thead', {}, h('tr', {}, th('Ngày'), th('Sản phẩm'), th('SL'), th('Đơn giá'), th('VAT'), th('Tổng'), th('Đã thu'), th('Trạng thái'), th('Chi tiết thu'))),
                h('tbody', {}, ...orders.map(s =>
                  h('tr', {},
                    h('td', { style: { whiteSpace: 'nowrap', color: 'var(--text2)', fontSize: 12 } }, fmtD(s.date)),
                    h('td', {},
                      h('div', { style: { fontWeight: 600 } }, s.productName),
                      s.note && h('div', { style: { fontSize: 11, color: 'var(--text3)' } }, s.note)
                    ),
                    h('td', {}, s.qty > 0 ? s.qty + ' ' + s.unit : '—'),
                    h('td', {}, s.unitPrice > 0 ? fmt(s.unitPrice) + 'đ' : '—'),
                    h('td', {}, s.vatRate > 0 ? h('span', { className: 'badge badge-blue', style: { fontSize: 10 } }, s.vatRate + '%') : h('span', { style: { color: 'var(--text3)' } }, '0%')),
                    h('td', { style: { fontWeight: 700, color: 'var(--accent)' } }, fmt(s.total) + 'đ'),
                    h('td', { style: { color: 'var(--green)' } }, fmt(s.paid) + 'đ'),
                    h('td', {}, h('span', { className: 'badge badge-' + (s.status === 'done' ? 'green' : 'red') },
                      s.status === 'done' ? '✅ Xong' : '⚠️ Nợ ' + fmt(s.total - s.paid) + 'đ'
                    )),
                    h('td', {}, (() => {
                      const lg = (S.paymentlogs || []).filter(l => l.refId === s.id && l.type === 'customer');
                      if (lg.length === 0) return h('span', { style: { color: 'var(--text3)', fontSize: 11 } }, '—');
                      return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 3 } },
                        ...lg.map(l => h('div', {
                          style: { fontSize: 11, background: 'rgba(76,175,125,.1)', borderRadius: 4, padding: '2px 7px',
                            color: 'var(--green)', whiteSpace: 'nowrap' }
                        }, '+' + fmt(l.amount) + 'đ · ' + fmtD(l.date) + (l.time ? ' ' + l.time : '') + (l.note ? ' · ' + l.note : '')))
                      );
                    })())
                  )
                )),
                orders.length === 0 && h('tr', {}, h('td', { colspan: 8, style: { textAlign: 'center', padding: 32, color: 'var(--text3)' } }, 'Không có đơn hàng'))
              )
            )
          )
        : h('div', { className: 'empty', style: { paddingTop: 60 } },
            h('div', { className: 'empty-icon' }, '👤'),
            h('div', {}, 'Chọn một khách hàng để xem lịch sử')
          );

      tabContent = h('div', { style: { display: 'flex', gap: 16, alignItems: 'flex-start', flexWrap: 'wrap' } }, leftPanel, rightPanel);
    }

    wrap.innerHTML = '';
    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, 'Công Nợ & Khách Hàng'),
          h('div', { className: 'page-sub' }, isAdminDebt
            ? `Phải thu KH: ${fmt(totalC)}đ · Phải trả NCC: ${fmt(totalS)}đ · ${allCusts.length} khách`
            : `Phải thu từ khách của bạn: ${fmt(totalC)}đ · ${allCusts.length} khách`)
        )
      ),
      h('div', { style: { display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap' } },
        tabBtn('customer', `⬇️ Khách nợ (${custDebts.length})`),
        ...(isAdminDebt ? [
          tabBtn('supplier', `⬆️ Nợ NCC (${suppDebts.length})`),
          tabBtn('history',  `👥 Lịch sử KH (${allCusts.length})`),
          tabBtn('supphistory', `🏭 Lịch sử NCC`)
        ] : [
          tabBtn('history',  `👥 Lịch sử KH (${allCusts.length})`)
        ])
      ),
      tabContent
    ));
  };
  rebuild();
  return wrap;
}

      preview = h('div', { className: 'empty', style: { paddingTop: 60 } },
        h('div', { className: 'empty-icon' }, '📄'),
        h('div', {}, 'Chọn một đơn hàng để xem hoá đơn')
      );
    }

    wrap.innerHTML = '';
    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
