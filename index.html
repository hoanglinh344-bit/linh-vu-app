    const attLeft = AUTH.getRemainingAttempts();

    const staffHint = '';

    const lockWarn = lockSt.locked
      ? `<div style="background:rgba(224,92,92,.15);border:1px solid rgba(224,92,92,.4);border-radius:var(--r2);padding:12px 14px;color:var(--red);font-size:13px;font-weight:700;margin-bottom:16px;text-align:center">
          🔒 Tài khoản bị khoá tạm thời<br><span style="font-size:12px;font-weight:400">Thử lại sau <b id="lockCountdown">${lockSt.remaining}</b> giây</span>
        </div>`
      : (attLeft <= 2 && attLeft > 0
          ? `<div style="background:rgba(232,165,58,.1);border:1px solid rgba(232,165,58,.3);border-radius:var(--r2);padding:8px 14px;color:var(--amber);font-size:12px;margin-bottom:12px">⚠️ Còn <b>${attLeft}</b> lần thử trước khi bị khoá 5 phút</div>`
          : '');

    let resetHtml = '';
    if (showReset) {
      if (resetStep === 1) {
        resetHtml = `<div style="margin-top:14px;padding:14px;background:rgba(91,143,232,0.08);border:1px solid rgba(91,143,232,0.3);border-radius:var(--r2)">
          <div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:8px">🔑 Đặt lại mật khẩu Admin</div>
          <div style="font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:10px">Nhấn "Tạo mã" để hiển thị mã xác nhận 6 số. Ghi lại ngay — hết hạn sau 10 phút.</div>
          <div id="pinDisplay" style="font-size:28px;font-weight:700;letter-spacing:8px;color:var(--accent);text-align:center;padding:12px;background:var(--bg4);border-radius:var(--r2);border:2px dashed var(--accent);margin-bottom:10px">——————</div>
          <div style="display:flex;gap:8px">
            <button id="genPinBtn" class="btn btn-primary btn-sm" style="flex:1;justify-content:center">🎲 Tạo mã xác nhận</button>
            <button id="nextStepBtn" class="btn btn-sm" style="flex:1;justify-content:center;display:none">Tiếp tục →</button>
          </div>
        </div>`;
      } else {
        resetHtml = `<div style="margin-top:14px;padding:14px;background:rgba(91,143,232,0.08);border:1px solid rgba(91,143,232,0.3);border-radius:var(--r2)">
          <div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px">🔑 Nhập mã & mật khẩu mới</div>
          <div style="margin-bottom:10px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px">Mã xác nhận 6 số</label>
            <input id="pinInput" type="text" maxlength="6" placeholder="_ _ _ _ _ _" class="form-input" style="font-size:20px;letter-spacing:8px;text-align:center;font-weight:700" inputmode="numeric" />
          </div>
          <div style="margin-bottom:10px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px">Mật khẩu mới (≥6 ký tự)</label>
            <input id="newPw1" type="password" class="form-input" />
          </div>
          <div style="margin-bottom:12px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px">Xác nhận mật khẩu mới</label>
            <input id="newPw2" type="password" class="form-input" />
          </div>
          <div style="display:flex;gap:8px">
            <button id="confirmResetBtn" class="btn btn-primary btn-sm" style="flex:1;justify-content:center">✅ Đặt lại mật khẩu</button>
            <button id="cancelResetBtn" class="btn btn-sm">Huỷ</button>
          </div>
        </div>`;
      }
    }

    root.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px">
      <div style="width:100%;max-width:420px">
        <div style="text-align:center;margin-bottom:32px">
          <div style="width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 4px 16px rgba(201,168,76,0.3)">💎</div>
          <div style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--text)">Đá Tự Nhiên Linh Vũ</div>
          <div style="font-size:13px;color:var(--text2);margin-top:4px">Hệ thống quản lý v8.0.1</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:28px">
          ${lockWarn}
          ${errMsg ? `<div style="background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);border-radius:var(--r2);padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:16px">❌ ${errMsg}</div>` : ''}
          ${successMsg ? `<div style="background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);border-radius:var(--r2);padding:10px 14px;color:#4caf7d;font-size:13px;margin-bottom:16px">✅ ${successMsg}</div>` : ''}
          <div style="margin-bottom:16px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:6px">Tên đăng nhập</label>
            <input id="loginUser" type="text" placeholder="" class="form-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="font-size:15px" ${lockSt.locked ? 'disabled' : ''} />
          </div>
          <div style="margin-bottom:20px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:6px">Mật khẩu</label>
            <input id="loginPass" type="password" placeholder="Mật khẩu" class="form-input" autocomplete="new-password" style="font-size:15px" ${lockSt.locked ? 'disabled' : ''} />
          </div>
          ${staffHint}
          <button id="loginBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:16px" ${lockSt.locked ? 'disabled' : ''}>🔐 Đăng nhập</button>
          <div style="margin-top:12px;text-align:center">
            <button id="resetBtn" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:4px 8px">🔑 Quên mật khẩu</button>
          </div>
          ${resetHtml}
        </div>
      </div>
    </div>`;

    const userEl  = root.querySelector('#loginUser');
    const passEl  = root.querySelector('#loginPass');
    const btn     = root.querySelector('#loginBtn');
    const resetBtn = root.querySelector('#resetBtn');

    async function doLogin() {
      const u = (userEl?.value || '').trim();
      const p = passEl?.value || '';
      if (!u || !p) { errMsg = 'Vui lòng nhập đầy đủ thông tin!'; successMsg = ''; render(); return; }

      // ── Kiểm tra brute-force trước ─────────────────────────
      const lockCheck = AUTH.getLockStatus();
      if (lockCheck.locked) { errMsg = `Tài khoản bị khoá ${lockCheck.remaining} giây nữa.`; successMsg = ''; render(); return; }

      // ── Pull thông tin đăng nhập mới nhất từ cloud TRƯỚC khi validate ──
      // Để đảm bảo mật khẩu / tên đăng nhập đã thay đổi trên thiết bị khác được áp dụng
      try {
        const cloudCfg = CLOUD.getCfg();
        if (cloudCfg.enabled && typeof firebase !== 'undefined' && firebase.apps.length) {
          if (btn) { btn.disabled = true; btn.textContent = '🔄 Đang đồng bộ...'; }
          const db = firebase.firestore();
          const shopId = cloudCfg.shopId || 'shop1';
          const col = name => db.collection('shops').doc(shopId).collection(name);
          const [adminSnap, staffSnap] = await Promise.all([
            col('dtn_admin_cred').doc('admin_cred').get().catch(() => null),
            col('dtn_staff_accounts').get().catch(() => null),
          ]);
          // Apply admin_cred từ cloud (luôn dùng cloud nếu có — vì đây là lúc chưa đăng nhập)
          if (adminSnap && adminSnap.exists) {
            const { id, _updated, ...credData } = adminSnap.data();
            try { localStorage.setItem('dtn_admin_cred', JSON.stringify({ ...credData, _updated: _updated || '' })); } catch(e) {}
          }
          // Apply staff accounts từ cloud
          if (staffSnap && !staffSnap.empty) {
            const cloudStaff = staffSnap.docs.map(d => { const v = d.data(); return v; });
            try {
              const existing = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
              const map = {};
              existing.forEach(s => { if (s && s.id) map[s.id] = s; });
              cloudStaff.forEach(s => {
                if (!s || !s.id) return;
                const localTs = (map[s.id] && (map[s.id]._updated || map[s.id].createdAt)) || '';
                const cloudTs = s._updated || s.createdAt || '';
                if (!map[s.id] || cloudTs >= localTs) map[s.id] = s;
              });
              localStorage.setItem('dtn_staff_accounts', JSON.stringify(Object.values(map)));
            } catch(e) {}
          }
          if (btn) { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
        }
      } catch(e) {
        if (btn) { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
        // Không chặn login nếu pull lỗi — dùng local credential
      }

      const result = AUTH.login(u, p);
      if (result && result.error) { errMsg = result.error; successMsg = ''; render(); return; }
      if (result && !result.error) { bootApp(); return; }
      const left = AUTH.getRemainingAttempts();
      errMsg = left > 0 ? `Sai thông tin đăng nhập! (Còn ${left} lần thử)` : 'Sai thông tin đăng nhập!';
      successMsg = ''; render();
    }
    if (btn) btn.addEventListener('click', doLogin);
    if (passEl) passEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    if (userEl) userEl.addEventListener('keydown', e => { if (e.key === 'Enter' && passEl) passEl.focus(); });
    if (resetBtn) resetBtn.addEventListener('click', () => { showReset = !showReset; resetStep = 1; errMsg = ''; render(); });

    if (showReset && resetStep === 1) {
      const genBtn = root.querySelector('#genPinBtn');
      const pinDisplay = root.querySelector('#pinDisplay');
      const nextStepBtn = root.querySelector('#nextStepBtn');
      if (genBtn) {
        genBtn.addEventListener('click', () => {
          const pin = AUTH.generateResetPin();
          if (pinDisplay) pinDisplay.textContent = pin;
          if (nextStepBtn) nextStepBtn.style.display = '';
        });
      }
      if (nextStepBtn) nextStepBtn.addEventListener('click', () => { resetStep = 2; render(); });
    }
    if (showReset && resetStep === 2) {
      const confirmBtn = root.querySelector('#confirmResetBtn');
      const cancelBtn  = root.querySelector('#cancelResetBtn');
      if (confirmBtn) {
        confirmBtn.addEventListener('click', () => {
          const pin = (root.querySelector('#pinInput')?.value || '').trim();
          const pw1 = root.querySelector('#newPw1')?.value || '';
          const pw2 = root.querySelector('#newPw2')?.value || '';
          if (!pin) { errMsg = 'Vui lòng nhập mã xác nhận!'; render(); return; }
          if (pw1.length < 6) { errMsg = 'Mật khẩu mới phải có ít nhất 6 ký tự!'; render(); return; }
          if (pw1 !== pw2) { errMsg = 'Mật khẩu xác nhận không khớp!'; render(); return; }
          const ok = AUTH.resetPasswordWithPin(pin, pw1);
          if (!ok) { errMsg = 'Mã xác nhận không đúng hoặc đã hết hạn!'; render(); return; }
          showReset = false; resetStep = 1; errMsg = '';
          successMsg = '✅ Đặt lại mật khẩu thành công! Vui lòng đăng nhập lại.';
          render();
        });
      }
      if (cancelBtn) cancelBtn.addEventListener('click', () => { showReset = false; resetStep = 1; render(); });
    }

    // Không pre-fill username — để ô trống, tránh lộ tên đăng nhập
    if (userEl && !userEl.value) userEl.value = '';
    if (!lockSt.locked && userEl && !lockSt.locked) { setTimeout(() => userEl.focus(), 30); }
    setTimeout(() => { if (passEl && !lockSt.locked && userEl && userEl.value) passEl.focus(); }, 50);

    if (lockSt.locked) {
      const countdown = root.querySelector('#lockCountdown');
      if (countdown) {
        const iv = setInterval(() => {
          const now = AUTH.getLockStatus();
          if (!now.locked) { clearInterval(iv); render(); return; }
          countdown.textContent = now.remaining;
        }, 1000);
      }
    }
  }
  render();
}

// Helper: uỷ quyền hoàn toàn cho AUTH.verifyPassword để không duplicate logic hash
function verifyAdminPwForDisplay(inputPw, cred) {
  if (!cred || !inputPw) return false;
  return AUTH.verifyPasswordPublic(inputPw, cred);
}

// ── Mobile-safe PDF opener ─────────────────────────────────────────
// Trên mobile, window.open thường bị block. Dùng blob URL để mở PDF
// và hiển thị nút "Chia sẻ" / "Tải về" thân thiện với điện thoại.
function openPdfMobile(htmlContent, filename) {
  try {
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isMobile) {
      // Hiển thị modal in-app thay vì popup mới
      const overlay = document.createElement('div');
      overlay.id = 'pdf-mobile-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0f1117;display:flex;flex-direction:column;overflow:hidden;';

      const topbar = document.createElement('div');
      topbar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#161b27;border-bottom:1px solid #2a3245;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top,0px))';

      const title = document.createElement('span');
      title.style.cssText = 'font-size:14px;font-weight:700;color:#e8e6df';
      title.textContent = filename || 'Xem tài liệu';

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:8px;align-items:center';

      // Nút chia sẻ (Web Share API — hoạt động trên iOS/Android)
      if (navigator.share || navigator.canShare) {
        const btnShare = document.createElement('button');
        btnShare.style.cssText = 'padding:7px 14px;border-radius:7px;border:none;background:#c9a84c;color:#0f1117;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit';
        btnShare.textContent = '📤 Chia sẻ';
        btnShare.onclick = async () => {
          try {
            // Tạo blob PDF nếu browser hỗ trợ, fallback sang share URL
            const shareBlob = new Blob([htmlContent], { type: 'text/html' });
            const shareFile = new File([shareBlob], (filename||'document')+'.html', { type: 'text/html' });
            if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
              await navigator.share({ files: [shareFile], title: filename || 'Tài liệu' });
            } else {
              await navigator.share({ title: filename || 'Tài liệu', url: url });
            }
          } catch(e) { if (e.name !== 'AbortError') alert('Không thể chia sẻ: ' + e.message); }
        };
        btnRow.appendChild(btnShare);
      }

      // Nút in (hoạt động tốt trên mobile Chrome/Safari)
      const btnPrint = document.createElement('button');
      btnPrint.style.cssText = 'padding:7px 14px;border-radius:7px;border:1px solid #3a4560;background:#1e2535;color:#e8e6df;font-size:13px;cursor:pointer;font-family:inherit';
      btnPrint.textContent = '🖨️ In';
      btnPrint.onclick = () => {
        const iframe = overlay.querySelector('iframe');
        if (iframe) {
          try {
            iframe.contentWindow.print();
          } catch(e) {
            // Fallback: KHÔNG dùng url (có thể đã bị revoke) — write trực tiếp htmlContent
            try {
              const w = window.open('', '_blank', 'width=900,height=800');
              if (w) { w.document.write(htmlContent); w.document.close(); w.print(); }
            } catch(e2) { console.warn('[PDF] print fallback error:', e2); }
          }
        }
      };

      // Nút đóng — QUAN TRỌNG: phải giải phóng URL và cho phép tương tác lại app
      const btnClose = document.createElement('button');
      btnClose.style.cssText = 'padding:7px 12px;border-radius:7px;border:1px solid #3a4560;background:transparent;color:#9a9590;font-size:18px;cursor:pointer;line-height:1';
      btnClose.textContent = '✕';
      let _urlRevoked = false;
      const _revokeUrl = () => { if (!_urlRevoked) { _urlRevoked = true; URL.revokeObjectURL(url); } };
      btnClose.onclick = () => {
        document.body.removeChild(overlay);
        _revokeUrl();
        document.body.style.overflow = ''; // khôi phục scroll
      };

      btnRow.appendChild(btnPrint);
      btnRow.appendChild(btnClose);
      topbar.appendChild(title);
      topbar.appendChild(btnRow);

      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.style.cssText = 'flex:1;width:100%;border:none;background:#fff;';
      // KHÔNG revoke URL trong onload — giữ URL sống cho tới khi đóng overlay
      // (iOS Safari cần URL còn hiệu lực để print() và chia sẻ hoạt động đúng)
      iframe.onload = () => { /* revoke khi đóng overlay */ };

      overlay.appendChild(topbar);
      overlay.appendChild(iframe);
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden'; // chặn scroll nền

    } else {
      // Desktop: mở tab mới bình thường
      const w = window.open(url, '_blank');
      if (!w) {
        // Fallback: popup bị chặn, thử write trực tiếp
        const w2 = window.open('', '_blank', 'width=900,height=800');
        if (w2) { w2.document.write(htmlContent); w2.document.close(); }
        else { alert('Trình duyệt chặn popup. Vui lòng cho phép popup cho trang này.'); }
      }
    }
  } catch(e) {
    // Ultimate fallback
    console.error('[PDF] openPdfMobile error:', e);
    const w = window.open('', '_blank', 'width=900,height=800');
    if (w) { w.document.write(htmlContent); w.document.close(); }
  }
}

// ── Theo dõi heartbeat interval + visibilitychange handler toàn cục ──
// bootApp() chạy lại mỗi lần đăng nhập (đăng xuất rồi đăng nhập lại trong
// cùng tab) — nếu không dọn cái cũ, interval/listener sẽ CHỒNG CHẤT, gây
// flush/restart listener Firestore trùng lặp nhiều lần mỗi khi đổi tab.
let _hbIv = null;
let _visibilityHandler = null;
let _hiddenAt = 0; // thời điểm tab/app bị ẩn — dùng để quyết định có cần restart listener không
let _pagehideBound = false; // chỉ gắn listener 'pagehide' (flush queue khi đóng app) một lần
const LISTENER_RESTART_THRESHOLD_MS = 3 * 60 * 1000; // chỉ restart nếu ẩn lâu hơn 3 phút

// ═══════════════════════════════════════════════════════════════
//  MIGRATE SKU — tự động gắn mã SKU cho sản phẩm cũ chưa có mã
//
//  Chạy 1 lần duy nhất khi boot: quét S.products, tìm sản phẩm
//  không có trường sku (hoặc sku rỗng), generate SKU mới đảm bảo
//  không trùng nhau, rồi lưu & push lên Firestore.
//
//  An toàn với multi-device: mỗi thiết bị chỉ patch sản phẩm CỦA NÓ
//  (theo _updated) — Firestore merge giữ bản mới nhất nên không conflict.
// ═══════════════════════════════════════════════════════════════
function migrateLegacySKU() {
  const missing = S.products.filter(p => !p.sku || p.sku.trim() === '');
  if (missing.length === 0) return; // tất cả đã có SKU → không làm gì

  console.log('[SKU] Migrate', missing.length, 'sản phẩm chưa có mã SKU...');

  // Tập SKU đã tồn tại (các SP đã có sẵn)
  const usedSkus = new Set(
    S.products.filter(p => p.sku && p.sku.trim()).map(p => p.sku.toLowerCase())
  );

  // Hàm generate + đánh dấu vào usedSkus ngay để batch không trùng nhau
  function assignSKU(product) {
    const ascii = (() => {
      const viMap = {
        'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a','ă':'a','ắ':'a','ặ':'a','ằ':'a','ẳ':'a','ẵ':'a','ấ':'a','ầ':'a','ẩ':'a','ẫ':'a','ậ':'a',
        'è':'e','é':'e','ê':'e','ẹ':'e','ề':'e','ế':'e','ệ':'e','ể':'e','ễ':'e','ẻ':'e','ẽ':'e',
        'ì':'i','í':'i','ị':'i','ỉ':'i','ĩ':'i',
        'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o','ő':'o','ọ':'o','ồ':'o','ố':'o','ộ':'o','ổ':'o','ỗ':'o','ơ':'o','ờ':'o','ớ':'o','ợ':'o','ở':'o','ỡ':'o',
        'ù':'u','ú':'u','û':'u','ü':'u','ủ':'u','ũ':'u','ụ':'u','ư':'u','ừ':'u','ứ':'u','ự':'u','ử':'u','ữ':'u',
        'ỳ':'y','ý':'y','ỵ':'y','ỷ':'y','ỹ':'y','đ':'d',
        'À':'A','Á':'A','Â':'A','Ã':'A','Ă':'A','Ắ':'A','Ặ':'A','Ằ':'A','Ẳ':'A','Ẵ':'A','Ấ':'A','Ầ':'A','Ẩ':'A','Ẫ':'A','Ậ':'A',
        'È':'E','É':'E','Ê':'E','Ẹ':'E','Ề':'E','Ế':'E','Ệ':'E','Ể':'E','Ễ':'E','Ẻ':'E','Ẽ':'E',
        'Ì':'I','Í':'I','Ị':'I','Ỉ':'I','Ĩ':'I',
        'Ò':'O','Ó':'O','Ô':'O','Õ':'O','Ö':'O','Ọ':'O','Ồ':'O','Ố':'O','Ộ':'O','Ổ':'O','Ỗ':'O','Ơ':'O','Ờ':'O','Ớ':'O','Ợ':'O','Ở':'O','Ỡ':'O',
        'Ù':'U','Ú':'U','Û':'U','Ü':'U','Ủ':'U','Ũ':'U','Ụ':'U','Ư':'U','Ừ':'U','Ứ':'U','Ự':'U','Ử':'U','Ữ':'U',
        'Ỳ':'Y','Ý':'Y','Ỵ':'Y','Ỷ':'Y','Ỹ':'Y','Đ':'D',
      };
      return (product.name || 'sp').split('').map(c => viMap[c] || c).join('').toLowerCase();
    })();
    const words = ascii.split(/[\s\-_\/\\\.]+/).filter(w => w.length > 0);
    let baseLetters = words.map(w => { const m = w.match(/^[a-z0-9]+/); return m ? m[0][0] : ''; }).filter(Boolean).join('');
    if (baseLetters.length < 2) {
      baseLetters = (words[0] || 'sp').replace(/[^a-z0-9]/g, '').slice(0, 3);
    }
    const base = baseLetters.slice(0, 6);
    let sku = base;
    if (usedSkus.has(sku)) {
      for (let i = 1; i <= 9999; i++) {
        sku = base + i;
        if (!usedSkus.has(sku)) break;
      }
    }
    usedSkus.add(sku); // đánh dấu ngay để sản phẩm tiếp theo không trùng
    return sku;
  }

  let count = 0;
  const patched = [];
  S.products = S.products.map(p => {
    if (p.sku && p.sku.trim()) return p; // đã có SKU → giữ nguyên
    const sku = assignSKU(p);
    count++;
    // FIX: giữ nguyên _updated gốc của SP — không bump lên "now" vì sẽ làm
    // bản migrate thắng conflict với thay đổi thực sự của thiết bị khác.
    // Mỗi thiết bị tự chạy migrateLegacySKU khi boot nên không cần thiết bị A
    // push SKU cho thiết bị B — B tự gắn SKU riêng (cùng tên → cùng SKU).
    const updated = { ...p, sku };
    patched.push(updated);
    return updated;
  });

  // Push trực tiếp chỉ những SP vừa patch — không qua save() để không làm
  // dirty-tracking _lastPushed hiểu nhầm và push lại toàn bộ mảng.
  if (patched.length > 0) {
    try { DB.set('dtn_products', S.products); } catch(e) {}
    try {
      CLOUD.push('dtn_products', patched);
      // Seed _lastPushed sau khi nó được khai báo (hàm này gọi trước dòng khai báo)
      if (typeof _seedLastPushed === 'function') _seedLastPushed('products', patched);
    } catch(e) {}
  }
  console.log('[SKU] Đã gắn SKU cho', count, 'sản phẩm và push lên cloud.');
  // Toast nhẹ — chỉ hiện nếu có migrate thực sự
  setTimeout(() => {
    try { toast('🏷️ Đã tự động gắn mã SKU cho ' + count + ' sản phẩm cũ', 'success'); } catch(e) {}
  }, 1500);
}

// ── Cảnh báo dữ liệu chưa đồng bộ khi mở app ────────────────────────
// CHỈ ĐỌC trạng thái, KHÔNG đụng dữ liệu → không thể gây mất mát. Chạy sau
// một khoảng chờ (để queue tự đẩy khi online); chỉ cảnh báo nếu dữ liệu THẬT
// SỰ còn kẹt (offline hoặc lỗi mạng). Mục đích: nhắc người dùng đừng đổi
// máy/đổi file khi còn bản ghi chưa lên cloud — đúng nguyên nhân mất dữ liệu.
function warnIfStuckUnsynced() {
  try {
    if (typeof CLOUD === 'undefined' || !CLOUD.getCfg().enabled) return;
    if (typeof CLOUD.getPendingCount !== 'function') return;
    const pend = CLOUD.getPendingCount();
    if (!pend || pend.records <= 0) return; // đã đẩy hết → im lặng, không báo nhầm
    const st = CLOUD.getStatus();
    const why = !navigator.onLine        ? 'thiết bị đang OFFLINE'
              : st.syncStatus === 'error' ? 'đồng bộ đang LỖI'
              :                             'mạng chậm, chưa đẩy xong';
    toast('⚠️ Còn ' + pend.records + ' thay đổi CHƯA lên cloud (' + why +
      '). ĐỪNG đổi máy hay đổi file lúc này — hãy bật mạng và chờ biểu tượng đồng bộ báo OK. Nếu không, các thay đổi này có thể bị mất.',
      'error', 15000);
    console.warn('[SYNC] Còn bản ghi chưa đồng bộ khi mở app:', pend, st);
  } catch(e) {}
}

// ── Migration 1 lần: chuyển ảnh base64 đang nằm trong localStorage sang
//    IndexedDB. AN TOÀN (R6): chỉ strip localStorage SAU KHI đã ghi IDB
//    thành công VÀ verify đọc lại được — nếu chưa chắc thì để nguyên, thử
//    lại lần boot sau (không bao giờ mất ảnh giữa chừng).
async function _migrateImagesToIDB() {
  try {
    if (typeof IMG === 'undefined' || !IMG.available()) return; // không có IDB → giữ LS như cũ
    await IMG.ready();
    if (localStorage.getItem('dtn_img_migrated') === '1') return;
    const prods = DB.get('dtn_products', []); // bản LS hiện tại (format cũ, còn ảnh base64)
    if (Array.isArray(prods) && prods.length) {
      const imgMap = {};
      prods.forEach(p => { if (p && p.id && typeof p.image === 'string' && p.image.indexOf('data:') === 0) imgMap[p.id] = p.image; });
      const ids = Object.keys(imgMap);
      if (ids.length) {
        const ok = await IMG.setMany(imgMap);
        if (!ok) return; // ghi IDB thất bại → KHÔNG strip, giữ ảnh trong LS, thử lại sau
        const check = await IMG.getAll();
        if (!ids.every(id => check[id])) return; // verify chưa chắc → không strip
        DB.set('dtn_products', prods); // DB.set tự strip ảnh khỏi LS (IDB đã có)
        console.info('[IMG] Đã migrate', ids.length, 'ảnh sản phẩm sang IndexedDB');
      }
    }
    localStorage.setItem('dtn_img_migrated', '1');
  } catch(e) { console.warn('[IMG] migration error:', e); }
}

async function bootApp() {
  _raf = false;
  const root = document.getElementById('app');
  if (root) root.innerHTML = '';

  // Firebase-first: reset S về rỗng trước mỗi lần boot (tránh state thừa từ session cũ)
  S.products = []; S.imports = []; S.sales = []; S.shipping = [];
  S.returns = []; S.paymentlogs = []; S.cashflows = [];
  S.settings = { ...SEED.settings };

  // ── Pull Firebase → ghi thẳng vào S → cache xuống local ──
  window._S = S; // cần cho applyCloudData (realtime listener dùng sau này)
  // Mở IndexedDB + migrate ảnh từ localStorage sang IDB TRƯỚC khi bootSync
  // đọc baseline (để pull đọc đúng cache đã chuẩn hoá).
  await _migrateImagesToIDB();
  const cloudCfg = CLOUD.getCfg();
  if (root) root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg,#0f1117)">
    <div style="text-align:center;color:#9a9590">
      <div style="font-size:32px;margin-bottom:12px">🔄</div>
      <div style="font-size:14px">${cloudCfg.enabled ? 'Đang tải dữ liệu từ Firebase...' : 'Đang tải dữ liệu...'}</div>
      <div style="font-size:12px;margin-top:6px;color:#5c5850">Vui lòng chờ</div>
    </div>
  </div>`;
  await Promise.all([
    CLOUD.bootSync(S),
    (typeof AICHAT !== 'undefined' && AICHAT.syncCfgFromCloud)
      ? AICHAT.syncCfgFromCloud().catch(() => {})
      : Promise.resolve(),
  ]);
  if (root) root.innerHTML = '';

  // ── Migrate SKU cho sản phẩm cũ chưa có mã ──────────────────
  // Chạy sau bootSync để có đủ data cloud trước khi generate
  migrateLegacySKU();

  render();
  // Khởi động listener ngay sau render — không delay 1500ms nữa
  // Delay cũ gây window mù: data từ thiết bị khác push trong 1500ms sau bootSync bị miss
  if (cloudCfg.enabled) {
    // Dọn heartbeat/listener của lần đăng nhập trước
    if (_hbIv) clearInterval(_hbIv);
    if (_visibilityHandler) document.removeEventListener('visibilitychange', _visibilityHandler);
    CLOUD.startListeners();
  }
  setTimeout(() => {
    if (typeof AICHAT !== 'undefined') AICHAT.init();
    if (cloudCfg.enabled) {
      // Heartbeat: flush queue offline mỗi 60s
      if (_hbIv) clearInterval(_hbIv);
      _hbIv = setInterval(() => {
        if (!document.hidden && AUTH.currentUser() && navigator.onLine) {
          try { CLOUD.flushPending(); } catch(e) {}
        }
      }, 60000);
      // Foreground: chỉ restart listener khi cần, không phải mỗi lần đổi tab
      if (_visibilityHandler) document.removeEventListener('visibilitychange', _visibilityHandler);
      _visibilityHandler = () => {
        if (document.hidden) {
          _hiddenAt = Date.now();
          // FIX (mất SP khi thoát app ngay sau khi tạo): cố đẩy nốt hàng đợi
          // NGAY khi app bị ẩn/đóng, để bản ghi vừa tạo kịp lên cloud trước khi
          // hệ điều hành "ngủ"/huỷ tiến trình. Không chờ tới heartbeat 60s.
          if (AUTH.currentUser() && cloudCfg.enabled && navigator.onLine) {
            try { CLOUD.flushPending(); } catch(e) {}
          }
          return;
        }
        if (AUTH.currentUser() && cloudCfg.enabled) {
          const hiddenMs = _hiddenAt ? (Date.now() - _hiddenAt) : 0;
          const listenerDead = !CLOUD.getStatus().realtime;
          // Chỉ huỷ-tạo-lại listener khi ẩn đủ lâu (phòng kết nối bị treo khi
          // máy ngủ/app chạy ngầm lâu) hoặc listener đã chết hẳn — tránh việc
          // restart vô tội vạ mỗi lần chuyển tab/app qua lại trong vài giây,
          // vì mỗi lần restart trước đây tốn đúng 1 lượt đọc lại toàn bộ
          // collection. Listener mới (nếu có restart) vẫn dùng cursor nên dù
          // restart cũng không đọc lại từ đầu — đây là lớp phòng vệ thêm.
          if (hiddenMs > LISTENER_RESTART_THRESHOLD_MS || listenerDead) {
            CLOUD.stopListeners();
            CLOUD.startListeners();
          }
          setTimeout(() => { try { CLOUD.flushPending(); } catch(e) {} }, 100);
        }
      };
      document.addEventListener('visibilitychange', _visibilityHandler);
      // FIX (mất SP khi đóng app): 'pagehide' bắn khi app thực sự bị đóng/điều
      // hướng (đặc biệt trên iOS/Android home-screen webapp) — cố đẩy nốt queue
      // lần cuối. Chỉ gắn 1 lần cho cả vòng đời trang.
      if (!_pagehideBound) {
        _pagehideBound = true;
        window.addEventListener('pagehide', () => {
          if (AUTH.currentUser() && cloudCfg.enabled && navigator.onLine) {
            try { CLOUD.flushPending(); } catch(e) {}
          }
        });
      }
    }
  }, 100);

  // Sau 12s (để queue kịp tự đẩy nếu online): nếu vẫn còn bản ghi chưa lên
  // cloud → cảnh báo, tránh người dùng đổi máy/đổi file khi chưa đồng bộ xong.
  setTimeout(warnIfStuckUnsynced, 12000);

  startAutoLogoutTimer();
}

const AUTO_LOGOUT_MS = 30 * 60 * 1000; // 30 phút
let _autoLogoutTimer = null;
let _autoLogoutWarningTimer = null;

function resetAutoLogoutTimer() {
  clearTimeout(_autoLogoutTimer);
  clearTimeout(_autoLogoutWarningTimer);
  if (!AUTH.currentUser()) return; // không set timer nếu chưa đăng nhập

  // Cảnh báo trước 2 phút
  _autoLogoutWarningTimer = setTimeout(() => {
    if (!AUTH.currentUser()) return;
    toast('⏰ Phiên làm việc sẽ hết hạn sau 2 phút do không hoạt động', 'info');
  }, AUTO_LOGOUT_MS - 2 * 60 * 1000);

  // Tự động lưu + đăng xuất
  _autoLogoutTimer = setTimeout(() => {
    if (!AUTH.currentUser()) return;
    // Lưu toàn bộ dữ liệu trước khi thoát
    try {
      ['products','imports','sales','shipping','settings','returns','paymentlogs','cashflows'].forEach(k => save(k));
    } catch(e) {}
    AUTH.logout();
    _raf = false;
    S.confirm = null;
    S.modal = null;
    clearTimeout(_autoLogoutTimer);
    clearTimeout(_autoLogoutWarningTimer);
    showLoginScreen();
    // Hiển thị thông báo trên màn hình login
    setTimeout(() => {
      const root = document.getElementById('app');
      if (root) {
        const notice = document.createElement('div');
        notice.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(232,165,58,.15);border:1px solid rgba(232,165,58,.4);color:#e8a53a;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;text-align:center;max-width:320px;';
        notice.textContent = '⏱ Phiên làm việc đã hết hạn sau 30 phút. Dữ liệu đã được lưu tự động.';
        document.body.appendChild(notice);
        setTimeout(() => { if (notice.parentNode) notice.parentNode.removeChild(notice); }, 5000);
      }
    }, 300);
  }, AUTO_LOGOUT_MS);
}

let _autoLogoutListenersBound = false;
function startAutoLogoutTimer() {
  // Reset timer khi có tương tác — chỉ gắn listener MỘT LẦN cho cả vòng đời
  // trang. Hàm này được gọi lại mỗi lần đăng nhập, nếu không guard thì mỗi
  // lần đăng xuất/đăng nhập lại sẽ cộng thêm 5 listener trùng lặp trên document.
  if (!_autoLogoutListenersBound) {
    _autoLogoutListenersBound = true;
    ['click','keydown','touchstart','mousemove','scroll'].forEach(evt => {
      document.addEventListener(evt, resetAutoLogoutTimer, { passive: true });
    });
  }
  resetAutoLogoutTimer(); // bắt đầu đếm ngay
}

// ═══════════════════════════════════════════════════════════════
//  STORAGE — localStorage + LZ-String compression + quota guard
// ═══════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
//  IMG — kho ẢNH sản phẩm trong IndexedDB (tách khỏi localStorage)
//
//  Vì sao: ảnh base64 (~500KB/ảnh) nhồi vào localStorage 5MB gây TRÀN
//  quota → DB.set thất bại ÂM THẦM → ảnh không được cache → out app vào
//  lại MẤT ảnh trên máy (điện thoại vẫn có vì kéo từ cloud). IndexedDB có
//  hạn mức hàng trăm MB → chứa ảnh thoải mái. localStorage giờ CHỈ giữ
//  phần text nhẹ của sản phẩm (đã strip ảnh base64).
//
//  Thiết kế: 1 store 'images', key = product.id, value = dataURL (string).
//  Firestore VẪN lưu base64 inline trong product doc (KHÔNG đổi) → điện
//  thoại/máy khác không bị ảnh hưởng; IndexedDB chỉ là CACHE bền cục bộ.
//  Nếu IndexedDB không khả dụng → available()=false, DB.set quay về hành
//  vi cũ (giữ ảnh trong localStorage) để không vỡ app.
// ═══════════════════════════════════════════════════════════
const IMG = (() => {
  const DB_NAME = 'dtn_images';
  const STORE   = 'images';
  let _idb = null;
  let _ready = null;
  let imgOk = (typeof indexedDB !== 'undefined' && indexedDB !== null);

  function open() {
    if (_ready) return _ready;
    _ready = new Promise((resolve) => {
      if (!imgOk) { resolve(null); return; }
      try {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => { try { req.result.createObjectStore(STORE); } catch(e) {} };
        req.onsuccess = () => { _idb = req.result; resolve(_idb); };
        req.onerror   = () => { imgOk = false; resolve(null); };
        req.onblocked = () => { resolve(null); };
      } catch(e) { imgOk = false; resolve(null); }
    });
    return _ready;
  }

  return {
    available() { return imgOk; },
    ready: open,

    // Đọc TẤT CẢ ảnh → { id: dataURL }. Không bao giờ throw.
    async getAll() {
      const db = await open();
      if (!db) return {};
      return new Promise((resolve) => {
        const out = {};
        try {
          const req = _idb.transaction(STORE, 'readonly').objectStore(STORE).openCursor();
          req.onsuccess = (e) => {
            const cur = e.target.result;
            if (cur) { out[cur.key] = cur.value; cur.continue(); }
            else resolve(out);
          };
          req.onerror = () => resolve(out);
        } catch(e) { resolve(out); }
      });
    },

    // Ghi nhiều ảnh: map = { id: dataURL }. Trả về Promise<bool> thành công.
    async setMany(map) {
      const db = await open();
      if (!db) return false;
      const ids = Object.keys(map || {});
      if (ids.length === 0) return true;
      return new Promise((resolve) => {
        try {
          const t = _idb.transaction(STORE, 'readwrite');
          const store = t.objectStore(STORE);
          ids.forEach(id => { try { store.put(map[id], id); } catch(e) {} });
          t.oncomplete = () => resolve(true);
          t.onerror    = () => resolve(false);
          t.onabort    = () => resolve(false);
        } catch(e) { resolve(false); }
      });
    },

    // Xoá ảnh theo id (hoặc mảng id). Trả về Promise.
    async del(ids) {
      const db = await open();
      if (!db) return;
      const arr = Array.isArray(ids) ? ids : [ids];
      if (arr.length === 0) return;
      return new Promise((resolve) => {
        try {
          const t = _idb.transaction(STORE, 'readwrite');
          const store = t.objectStore(STORE);
          arr.forEach(id => { try { store.delete(id); } catch(e) {} });
          t.oncomplete = () => resolve();
          t.onerror    = () => resolve();
        } catch(e) { resolve(); }
      });
    },
  };
})();

const DB = (() => {
  const mem = {};
  // Theo dõi ảnh đã ghi vào IndexedDB (id → dataURL) để CHỈ ghi ảnh thay đổi,
  // tránh ghi lại toàn bộ ảnh mỗi lần save('products') (mỗi lần bán/nhập kho).
  const _imgWritten = {};
  let lsOk = false;
  const APP_VERSION = '3.10.1';
  const KEYS = ['dtn_products','dtn_imports','dtn_sales','dtn_shipping','dtn_settings','dtn_returns','dtn_paymentlogs','dtn_cashflows'];
  // Prefix để nhận biết dữ liệu đã nén
  const LZ_PREFIX = '\x00LZ:';

  try { localStorage.setItem('__chk','1'); localStorage.removeItem('__chk'); lsOk = true; } catch(e) {}

  // ── Compression helpers ──────────────────────────────────────
  function lzAvailable() { return typeof LZString !== 'undefined'; }

  function encode(v) {
    const json = JSON.stringify(v);
    if (!lzAvailable()) return json;
    try { return LZ_PREFIX + LZString.compress(json); } catch(e) { return json; }
  }

  function decode(raw) {
    if (!raw) return null;
    if (raw.startsWith(LZ_PREFIX)) {
      if (!lzAvailable()) {
        // LZString chưa load xong (hiếm) — trả null để fallback
        console.warn('[DB] LZString chưa sẵn sàng, bỏ qua dữ liệu nén');
        return null;
      }
      try { return JSON.parse(LZString.decompress(raw.slice(LZ_PREFIX.length))); } catch(e) { return null; }
    }
    // Dữ liệu cũ chưa nén — parse thẳng
    try { return JSON.parse(raw); } catch(e) { return null; }
  }

  // ── Tính dung lượng thực tế đang dùng (bytes) ───────────────
  function calcSizeBytes() {
    let size = 0;
    try {
      KEYS.forEach(k => { const v = localStorage.getItem(k); if(v) size += v.length * 2; }); // UTF-16 → ×2
    } catch(e) {}
    return size;
  }

  // ── Ghi localStorage, return true/false ─────────────────────
  function lsSet(k, encoded) {
    try {
      localStorage.setItem(k, encoded);
      localStorage.setItem('dtn_lastSaved', new Date().toISOString());
      return true;
    } catch(e) {
      // Lần 1 thất bại: dọn backup cũ rồi thử lại
      try {
        localStorage.removeItem('dtn_backup_auto');
        localStorage.removeItem('dtn_backup_time');
        localStorage.setItem(k, encoded);
        localStorage.setItem('dtn_lastSaved', new Date().toISOString());
        return true;
      } catch(e2) {
        return false; // Thực sự đầy
      }
    }
  }

  return {
    get(k, def) {
      try {
        if (lsOk) {
          const raw = localStorage.getItem(k);
          if (raw !== null) {
            const parsed = decode(raw);
            return parsed !== null ? parsed : def;
          }
          return k in mem ? mem[k] : def;
        }
        return k in mem ? mem[k] : def;
      } catch(e) { return k in mem ? mem[k] : def; }
    },

    // Trả về true = lưu OK, false = lưu thất bại (quota đầy)
    set(k, v) {
      mem[k] = v; // Luôn giữ in-memory BẢN ĐẦY ĐỦ (còn ảnh) — export/backup dùng
      if (!lsOk) return true; // in-memory only, chấp nhận
      // ── Tách ảnh sản phẩm sang IndexedDB ──────────────────────
      // localStorage chỉ giữ phần text nhẹ → KHÔNG bao giờ tràn vì ảnh base64.
      // Chỉ strip ảnh dạng data: (base64); ảnh dạng URL http (Storage) nhẹ, giữ.
      // Ảnh vẫn còn ở mem (RAM) + S.products (RAM) + cloud → không mất.
      if (k === 'dtn_products' && IMG.available() && Array.isArray(v)) {
        const imgMap = {};   // ảnh cần GHI (mới/đổi so với lần ghi trước)
        const delIds = [];   // ảnh cần XOÁ (sản phẩm còn đó nhưng đã gỡ ảnh)
        const stripped = v.map(p => {
          if (p && p.id && typeof p.image === 'string' && p.image.indexOf('data:') === 0) {
            if (_imgWritten[p.id] !== p.image) imgMap[p.id] = p.image; // chỉ ghi nếu đổi
            return { ...p, image: '' }; // bản ghi LS không chứa base64
          }
          // Sản phẩm còn trong mảng nhưng KHÔNG còn ảnh base64 → nếu trước có thì xoá khỏi IDB
          if (p && p.id && _imgWritten[p.id] !== undefined) delIds.push(p.id);
          return p;
        });
        if (Object.keys(imgMap).length) {
          // fire-and-forget (cloud là nguồn dự phòng nếu IDB lỗi); chỉ đánh dấu đã-ghi khi thành công
          IMG.setMany(imgMap).then(ok => { if (ok) Object.keys(imgMap).forEach(id => { _imgWritten[id] = imgMap[id]; }); });
        }
        if (delIds.length) { IMG.del(delIds); delIds.forEach(id => { delete _imgWritten[id]; }); }
        return lsSet(k, encode(stripped));
      }
      const encoded = encode(v);
      const ok = lsSet(k, encoded);
      return ok;
    },

    // Như get() nhưng ưu tiên bản RAM ĐẦY ĐỦ (mem) nếu có — dùng cho luồng
    // restore/import: localStorage đã strip ảnh, nhưng mem giữ products còn ảnh.
    getFull(k, def) {
      if (mem[k] != null) return mem[k];
      return this.get(k, def);
    },

    isLocal() { return lsOk; },

    lastSaved() {
      try { return localStorage.getItem('dtn_lastSaved') || null; } catch(e) { return null; }
    },

    // Trả về KB (số thực) dựa trên byte thực của localStorage
    storageSize() {
      try {
        return (calcSizeBytes() / 1024).toFixed(1);
      } catch(e) { return '?'; }
    },

    // Trả về 'ok' | 'warning' | 'danger'
    storageWarning() {
      try {
        const kb = parseFloat(this.storageSize());
        if (isNaN(kb)) return 'ok';
        if (kb > 4500) return 'danger';   // > ~4.5MB
        if (kb > 3500) return 'warning';  // > ~3.5MB
        return 'ok';
      } catch(e) { return 'ok'; }
    },

    exportAll() {
      const obj = { _version: APP_VERSION, _exported: new Date().toISOString(), _device: navigator.userAgent.includes('iPhone') ? 'iPhone' : navigator.userAgent.includes('Mac') ? 'Mac' : 'Other' };
      // dtn_products: lấy từ mem (BẢN ĐẦY ĐỦ còn ảnh) vì localStorage đã strip ảnh
      KEYS.forEach(k => { const v = (k === 'dtn_products' && mem[k] != null) ? mem[k] : this.get(k, null); if (v) obj[k] = v; });
      return JSON.stringify(obj, null, 2);
    },
    exportCompact() {
      const obj = { _v: APP_VERSION, _t: Date.now() };
      // dtn_products: lấy từ mem (BẢN ĐẦY ĐỦ còn ảnh) vì localStorage đã strip ảnh
      KEYS.forEach(k => { const v = (k === 'dtn_products' && mem[k] != null) ? mem[k] : this.get(k, null); if (v) obj[k] = v; });
      return JSON.stringify(obj);
    },
    importAll(json) {
      try {
        const obj = JSON.parse(json);
        // AN TOÀN DỮ LIỆU: mảng RỖNG [] vẫn là truthy trong JS — nếu chỉ
        // check "if (obj[k])" thì 1 file backup có dtn_products:[] (backup
        // cũ từ thời chưa nhập SP, hoặc file JSON bị cắt/hỏng một phần) sẽ
        // XOÁ SẠCH dữ liệu hiện tại mà không có cảnh báo gì. Chỉ import nếu
        // key tồn tại VÀ (không phải mảng, hoặc là mảng có ít nhất 1 phần tử).
        // Muốn xoá thật một collection → dùng nút "Xoá toàn bộ dữ liệu" rõ
        // ràng, không nên xảy ra "ngầm" qua việc phục hồi backup.
        const skippedEmpty = [];
        KEYS.forEach(k => {
          const v = obj[k];
          if (v === undefined || v === null) return;
          if (Array.isArray(v) && v.length === 0) { skippedEmpty.push(k); return; }
          this.set(k, v);
        });
        if (skippedEmpty.length > 0) {
          console.warn('[DB.importAll] Bỏ qua các mục RỖNG trong file backup để tránh xoá nhầm dữ liệu hiện tại:', skippedEmpty.join(', '));
          try {
            if (typeof toast === 'function') {
              toast('⚠️ File backup có ' + skippedEmpty.length + ' mục RỖNG (' + skippedEmpty.join(', ') +
                ') — đã BỎ QUA các mục này để không xoá nhầm dữ liệu hiện tại. Các mục còn lại đã được khôi phục.', 'error');
            }
          } catch(e) {}
        }
        return true;
      } catch(e) { return false; }
    },
    autoBackup() {
      try {
        if (!lsOk) return;
        const data = this.exportCompact();
        // Backup không nén để đọc lại được dù LZString lỗi
        localStorage.setItem('dtn_backup_auto', data);
        localStorage.setItem('dtn_backup_time', new Date().toISOString());
      } catch(e) {}
    },
    getAutoBackup() {
      try { return localStorage.getItem('dtn_backup_auto') || null; } catch(e) { return null; }
    },
    getAutoBackupTime() {
      try { return localStorage.getItem('dtn_backup_time') || null; } catch(e) { return null; }
    },

    // ── Auto-archive: tách data cũ > 12 tháng sang key archive ─
    // Gọi khi storageWarning() === 'danger'
    // Trả về { archivedSales, archivedImports } — số bản ghi đã archive
    archiveOldData() {
      try {
        if (!lsOk) return { archivedSales: 0, archivedImports: 0 };
        const cutoff = new Date();
        cutoff.setMonth(cutoff.getMonth() - 12);
        const cutoffStr = localDateStr(cutoff); // 'YYYY-MM-DD' theo giờ local VN

        // Sales
        const sales = this.get('dtn_sales', []);
        const salesActive = sales.filter(x => (x.date || '') >= cutoffStr);
        const salesOld    = sales.filter(x => (x.date || '') <  cutoffStr);
        if (salesOld.length > 0) {
          // Merge với archive hiện tại
          const existArchive = this.get('dtn_sales_archive', []);
          const merged = [...existArchive, ...salesOld];
          lsSet('dtn_sales_archive', encode(merged));
          mem['dtn_sales'] = salesActive;
          lsSet('dtn_sales', encode(salesActive));
        }

        // Imports
        const imports = this.get('dtn_imports', []);
        const importsActive = imports.filter(x => (x.date || '') >= cutoffStr);
        const importsOld    = imports.filter(x => (x.date || '') <  cutoffStr);
        if (importsOld.length > 0) {
          const existArchive = this.get('dtn_imports_archive', []);
          const merged = [...existArchive, ...importsOld];
          lsSet('dtn_imports_archive', encode(merged));
          mem['dtn_imports'] = importsActive;
          lsSet('dtn_imports', encode(importsActive));
        }

        // Paymentlogs cũ
        const logs = this.get('dtn_paymentlogs', []);
        const logsActive = logs.filter(x => (x.date || '') >= cutoffStr);
        const logsOld    = logs.filter(x => (x.date || '') <  cutoffStr);
        if (logsOld.length > 0) {
          mem['dtn_paymentlogs'] = logsActive;
          lsSet('dtn_paymentlogs', encode(logsActive));
        }

        return { archivedSales: salesOld.length, archivedImports: importsOld.length };
      } catch(e) {
        console.error('[DB.archiveOldData]', e);
        return { archivedSales: 0, archivedImports: 0 };
      }
    }
  };
})();

// ── Auto-generate SKU từ tên sản phẩm ────────────────────────────
// Ví dụ: "Đá Cubic 10x10 1P" → "cb1", "Granite Đen Impala" → "gdi"
// Đảm bảo không trùng với SKU đã tồn tại trong S.products
function generateSKU(name, existingProducts, excludeId) {
  if (!name) return '';
  // Bảng chuyển ký tự tiếng Việt → ASCII
  const viMap = {
    'à':'a','á':'a','â':'a','ã':'a','ä':'a','å':'a','ă':'a','ắ':'a','ặ':'a','ằ':'a','ẳ':'a','ẵ':'a','ấ':'a','ầ':'a','ẩ':'a','ẫ':'a','ậ':'a',
    'è':'e','é':'e','ê':'e','ẹ':'e','ề':'e','ế':'e','ệ':'e','ể':'e','ễ':'e','ẻ':'e','ẽ':'e',
    'ì':'i','í':'i','ị':'i','ỉ':'i','ĩ':'i',
    'ò':'o','ó':'o','ô':'o','õ':'o','ö':'o','ő':'o','ọ':'o','ồ':'o','ố':'o','ộ':'o','ổ':'o','ỗ':'o','ơ':'o','ờ':'o','ớ':'o','ợ':'o','ở':'o','ỡ':'o',
    'ù':'u','ú':'u','û':'u','ü':'u','ủ':'u','ũ':'u','ụ':'u','ư':'u','ừ':'u','ứ':'u','ự':'u','ử':'u','ữ':'u',
    'ỳ':'y','ý':'y','ỵ':'y','ỷ':'y','ỹ':'y',
    'đ':'d',
    'À':'A','Á':'A','Â':'A','Ã':'A','Ă':'A','Ắ':'A','Ặ':'A','Ằ':'A','Ẳ':'A','Ẵ':'A','Ấ':'A','Ầ':'A','Ẩ':'A','Ẫ':'A','Ậ':'A',
    'È':'E','É':'E','Ê':'E','Ẹ':'E','Ề':'E','Ế':'E','Ệ':'E','Ể':'E','Ễ':'E','Ẻ':'E','Ẽ':'E',
    'Ì':'I','Í':'I','Ị':'I','Ỉ':'I','Ĩ':'I',
    'Ò':'O','Ó':'O','Ô':'O','Õ':'O','Ö':'O','Ọ':'O','Ồ':'O','Ố':'O','Ộ':'O','Ổ':'O','Ỗ':'O','Ơ':'O','Ờ':'O','Ớ':'O','Ợ':'O','Ở':'O','Ỡ':'O',
    'Ù':'U','Ú':'U','Û':'U','Ü':'U','Ủ':'U','Ũ':'U','Ụ':'U','Ư':'U','Ừ':'U','Ứ':'U','Ự':'U','Ử':'U','Ữ':'U',
    'Ỳ':'Y','Ý':'Y','Ỵ':'Y','Ỷ':'Y','Ỹ':'Y','Đ':'D',
  };
  function toAscii(str) {
    return str.split('').map(c => viMap[c] || c).join('');
  }

  // Lấy các chữ cái đầu của từng từ (bỏ số, ký tự đặc biệt)
  const ascii = toAscii(name).toLowerCase();
  const words = ascii.split(/[\s\-_\/\\\.]+/).filter(w => w.length > 0);

  // Lấy chữ đầu của mỗi từ (chỉ lấy a-z0-9)
  let baseLetters = words.map(w => {
    const m = w.match(/^[a-z0-9]+/);
    return m ? m[0][0] : '';
  }).filter(Boolean).join('');

  // Nếu quá ngắn (< 2 ký tự) dùng 3 ký tự đầu của từ đầu tiên
  if (baseLetters.length < 2) {
    const firstWord = words[0] || 'sp';
    baseLetters = (firstWord.match(/[a-z0-9]/g) || []).slice(0, 3).join('');
  }

  // Tối đa 6 ký tự cho base
  const base = baseLetters.slice(0, 6);

  // Lấy tất cả SKU hiện tại (ngoại trừ sản phẩm đang sửa)
  const usedSkus = new Set(
    (existingProducts || [])
      .filter(p => p.id !== excludeId && p.sku)
      .map(p => (p.sku || '').toLowerCase())
  );

  // Nếu base chưa dùng → dùng luôn
  if (!usedSkus.has(base)) return base;

  // Thêm số đuôi tăng dần: base1, base2, ...
  for (let i = 1; i <= 999; i++) {
    const candidate = base + i;
    if (!usedSkus.has(candidate)) return candidate;
  }
  // Fallback dùng uid ngẫu nhiên
  return base + uid().slice(0, 3);
}
const fmtD = s => {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
};
const pct = (buy, sell) => buy > 0 ? Math.round((sell - buy) / buy * 100) : 0;
const calcSale = (qty, price, vat) => {
  const sub = (parseFloat(qty) || 0) * (parseFloat(price) || 0);
  const vatAmt = Math.round(sub * (parseFloat(vat) || 0) / 100);
  return { sub, vatAmt, total: sub + vatAmt };
};

// seedStockTxOnce đã bỏ: Firebase-first — S khởi tạo rỗng, không có local data để seed.
// _stockTx được seed trong bootSync sau khi pull Firebase về.

// ── Theo dõi _updated đã push lần trước cho mỗi id, để chỉ push
//    bản ghi THỰC SỰ thay đổi — tránh ghi đè lại toàn bộ mảng lên
//    Firestore mỗi lần save() (tốn write quota + băng thông không cần thiết)
const _lastPushed = {};
// Đánh dấu các bản ghi vừa nhận từ cloud (qua bootSync/listener) là "đã đồng bộ"
// — nếu không, lần save() local tiếp theo sẽ tưởng chúng "thay đổi" (vì _lastPushed
// chưa biết) và đẩy ngược lên Firestore dữ liệu vốn đã lấy TỪ Firestore — ghi thừa.
function _seedLastPushed(key, arr) {
  const seen = _lastPushed[key] || (_lastPushed[key] = {});
  (arr || []).forEach(r => { if (r && r.id) seen[r.id] = r._updated; });
}
function save(key) {
  const map = {products:'dtn_products',imports:'dtn_imports',sales:'dtn_sales',shipping:'dtn_shipping',settings:'dtn_settings',returns:'dtn_returns',paymentlogs:'dtn_paymentlogs',cashflows:'dtn_cashflows'};
  const colName = map[key];

  // ── Firebase-first: chỉ push các bản ghi thực sự thay đổi ─────
  // localStorage chỉ là cache tạm — nguồn dữ liệu chính là Firebase
  if (typeof CLOUD !== 'undefined' && colName && CLOUD.getCfg().enabled) {
    if (key === 'settings') {
      CLOUD.push(colName, [{ id: 'settings', ...S[key] }]);
    } else {
      const arr = S[key] || [];
      const seen = _lastPushed[key] || (_lastPushed[key] = {});
      const changed = arr.filter(r => r && r.id && seen[r.id] !== r._updated);
      if (changed.length > 0) {
        CLOUD.push(colName, changed);
        changed.forEach(r => { seen[r.id] = r._updated; });
      }
      // Dọn id đã bị xoá khỏi mảng khỏi bộ nhớ theo dõi (softDelete tự push riêng)
      if (arr.length !== Object.keys(seen).length) {
        const aliveIds = new Set(arr.map(r => r.id));
        Object.keys(seen).forEach(id => { if (!aliveIds.has(id)) delete seen[id]; });
      }
    }
  }

  // ── Cache vào localStorage (để hoạt động offline & boot nhanh) ──
  if (colName) {
    DB.set(colName, S[key]); // lỗi quota → bỏ qua (Firebase là nguồn chính)
    S._saveError = false;
  }

  // ── Archive nếu localStorage gần đầy (chạy nền, không block) ──
  clearTimeout(save._timer);
  save._timer = setTimeout(() => {
    const warn = DB.storageWarning();
    if (warn === 'danger') {
      const result = DB.archiveOldData();
      if (result.archivedSales > 0 || result.archivedImports > 0) {
        toast(`🗂️ Đã archive ${result.archivedSales} đơn hàng và ${result.archivedImports} phiếu nhập cũ để giải phóng cache.`, 'info');
        S.sales   = DB.get('dtn_sales',   S.sales);
        S.imports = DB.get('dtn_imports',  S.imports);
        S.paymentlogs = DB.get('dtn_paymentlogs', S.paymentlogs);
        render();
      }
    }
  }, 3000);
}

// ── Soft-delete: push _deleted record lên cloud, lọc local NGAY
// FIX: lưu tombstone {id, _deleted, _updated} vào sessionStorage để
// mergeAppendOnly biết localTs khi record đã bị filter khỏi mảng,
// tránh record "sống lại" từ onSnapshot của thiết bị khác.
// FIX: tombstone dùng localStorage thay vì sessionStorage
// sessionStorage bị xoá khi đóng tab → sản phẩm đã xoá có thể "sống lại" từ onSnapshot
// localStorage persistent → tombstone giữ nguyên qua các lần đóng/mở tab
const _softDeleteTombstones = (() => {
  try { return JSON.parse(localStorage.getItem('dtn_tombstones') || '{}'); } catch(e) { return {}; }
})();
function _saveTombstones() {
  try {
    // Chỉ giữ tombstone của 90 ngày gần nhất để tránh localStorage phình to
    const cutoff = new Date(Date.now() - 90 * 86400000).toISOString();
    const pruned = {};
    Object.entries(_softDeleteTombstones).forEach(([id, ts]) => { if (ts >= cutoff) pruned[id] = ts; });
    Object.assign(_softDeleteTombstones, pruned);
    Object.keys(_softDeleteTombstones).forEach(k => { if (!pruned[k]) delete _softDeleteTombstones[k]; });
    localStorage.setItem('dtn_tombstones', JSON.stringify(_softDeleteTombstones));
  } catch(e) {}
}
function softDelete(arrayKey, id, extraFn) {
  const now = new Date().toISOString();
  if (!S[arrayKey]) return;
  // Tạo bản _deleted của riêng record bị xoá để push lên cloud
  const deletedRecord = S[arrayKey].find(r => r.id === id);
  // FIX: lưu tombstone trước khi filter — mergeAppendOnly dùng để so sánh timestamp
  if (deletedRecord) {
    _softDeleteTombstones[id] = now;
    _saveTombstones();
  }
  // Lọc sạch local NGAY LẬP TỨC để UI phản ánh đúng
  S[arrayKey] = S[arrayKey].filter(r => r.id !== id);
  const dbMap = {products:'dtn_products',imports:'dtn_imports',sales:'dtn_sales',shipping:'dtn_shipping',returns:'dtn_returns',paymentlogs:'dtn_paymentlogs',cashflows:'dtn_cashflows'};
  if (dbMap[arrayKey]) DB.set(dbMap[arrayKey], S[arrayKey]);
  // Sản phẩm bị xoá → dọn ảnh khỏi IndexedDB (tránh ảnh mồ côi)
  if (arrayKey === 'products') { try { if (typeof IMG !== 'undefined') IMG.del(id); } catch(e) {} }
  if (typeof extraFn === 'function') extraFn();
  // Push CHỈ record bị xoá lên cloud (không push lại toàn bộ mảng — tốn write quota)
  if (deletedRecord) {
    const withDeleted = [{ ...deletedRecord, _deleted: true, _updated: now }];
    // ── FIX (record đã xoá "sống lại"): đẩy tombstone QUA HÀNG ĐỢI thay vì
    // _pushDeletedRecord (đẩy thẳng, không qua queue). Lý do:
    //  1. Offline-safe: _pushDeletedRecord gọi pushCollection trực tiếp — nếu
    //     đang offline/lỗi mạng thì lệnh xoá MẤT LUÔN (không retry), trong khi
    //     bản "còn sống" vừa tạo vẫn nằm trong hàng đợi → khi online lại, bản
    //     sống được đẩy lên → record xoá HỒI SINH trên cloud + mọi thiết bị.
    //  2. enqueue gộp theo id (bản mới thắng) → tombstone GHI ĐÈ bản sống đang
    //     chờ đẩy cùng id trong hàng đợi → không còn mâu thuẫn sống/xoá.
    // CLOUD.push → enqueue → flush ngay nếu online, hoặc giữ lại retry nếu offline.
    if (typeof CLOUD !== 'undefined') {
      CLOUD.push(dbMap[arrayKey], withDeleted);
    }
  }
}
