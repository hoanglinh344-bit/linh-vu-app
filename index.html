      if (!d) return p;
      const newStock = (parseFloat(p.stock) || 0) + d.stockDelta;
      const newVariants = (p.variants || []).map(vt => {
        const vAdd = d.variantDeltas[vt.id];
        if (!vAdd) return vt;
        const ppm2 = (vt.tileW > 0 && vt.tileH > 0) ? 10000 / (vt.tileW * vt.tileH) : 0;
        const newM2 = (vt.stockM2 || 0) + vAdd;
        return { ...vt, stockM2: newM2, stockPieces: ppm2 > 0 ? Math.round(newM2 * ppm2) : (vt.stockPieces || 0) + Math.round(vAdd * (ppm2 || 0)) };
      });
      const updated = { ...p, stock: newStock, variants: newVariants, _stockTx: unionStockTx(p._stockTx, d.txIds) };
      reconciled.push(updated);
      return updated;
    });
    try { if (typeof DB !== 'undefined') DB.set('dtn_products', S.products); } catch(e) {}
    // Firebase-first: KHÔNG push lên cloud từ applyLedgerToStock
    // applyLedger chỉ còn dùng để seed _stockTx trong bootSync — không tính stock delta
    // Stock trên Firebase đã đúng (do thiết bị tạo giao dịch push) → không cần push lại
  }
  function applyCloudData(colName, cloudDocs, skipRender) {
    if (!window._S) return;
    const S = window._S;
    let changed = false;
    const colMap = {
      dtn_sales:           'sales',
      dtn_imports:         'imports',
      dtn_returns:         'returns',
      dtn_paymentlogs:     'paymentlogs',
      dtn_products:        'products',
      dtn_shipping:        'shipping',
      dtn_settings:        'settings',
      dtn_staff_accounts:  'staff_accounts',
      dtn_admin_cred:      'admin_cred',
      dtn_cashflows:       'cashflows',
    };
    const stateKey = colMap[colName];
    if (!stateKey) return;

    if (stateKey === 'admin_cred') {
      // Thông tin đăng nhập admin — merge vào localStorage (AUTH quản lý)
      // Chỉ apply nếu cloud mới hơn local (so sánh _updated)
      if (cloudDocs.length > 0) {
        try {
          const cloudCred = cloudDocs.find(d => d.id === 'admin_cred');
          if (cloudCred) {
            const localRaw = localStorage.getItem('dtn_admin_cred');
            const localCred = localRaw ? JSON.parse(localRaw) : null;
            const cloudTs = cloudCred._updated || '';
            const localTs = (localCred && localCred._updated) || '';
            // Áp dụng cloud nếu cloud mới hơn hoặc local chưa có _updated
            if (!localTs || cloudTs > localTs) {
              const { id, _updated, ...credData } = cloudCred;
              // Lưu thêm _updated để so sánh lần sau
              localStorage.setItem('dtn_admin_cred', JSON.stringify({ ...credData, _updated: cloudTs }));
              changed = true;
            }
          }
        } catch(e) {}
      }
    } else if (stateKey === 'staff_accounts') {
      // Tài khoản nhân viên — merge vào localStorage trực tiếp (AUTH quản lý)
      if (cloudDocs.length > 0) {
        try {
          const existing = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
          const map = {};
          existing.forEach(s => { if (s && s.id) map[s.id] = s; });
          cloudDocs.forEach(s => {
            if (!s || !s.id) return;
            const localTs = (map[s.id] && (map[s.id]._updated || map[s.id].createdAt)) || '';
            const cloudTs = s._updated || s.createdAt || '';
            if (!map[s.id] || cloudTs > localTs) map[s.id] = s;
          });
          const merged = Object.values(map);
          localStorage.setItem('dtn_staff_accounts', JSON.stringify(merged));
          changed = true;
        } catch(e) {}
      }
    } else if (stateKey === 'settings') {
      // Firebase-first: settings từ cloud luôn thắng (realtime listener)
      // Khi user sửa settings → save() push lên cloud ngay lập tức
      // → listener nhận về chính bản vừa push → S.settings = cloud version
      // Không còn conflict vì S luôn được khởi tạo từ Firebase trong bootSync
      if (cloudDocs.length > 0) {
        const cloudDoc = cloudDocs[0];
        const merged = { ...cloudDoc };
        delete merged.id;
        delete merged._updated; // FIX: không để rác _updated của cloud lọt vào S.settings
        const before = JSON.stringify(S.settings);
        S.settings = merged;
        if (JSON.stringify(S.settings) !== before) changed = true;
      }
    } else if (stateKey === 'products') {
      const before = JSON.stringify(S.products);
      // Listener giờ chỉ gửi phần THAY ĐỔI (where _updated > cursor) để đỡ tốn
      // đọc Firestore mỗi lần listener khởi động lại — nên GHÉP vào S.products
      // hiện có (mergeProducts đã hỗ trợ sẵn tham số "local" cho đúng việc này),
      // không dùng base rỗng nữa vì cloudDocs không còn là toàn bộ collection.
      const { products: mergedProducts, reroutes, dupNames } = mergeProducts(S.products, cloudDocs);
      S.products = mergedProducts;
      if (JSON.stringify(S.products) !== before) changed = true;
      _seedLastPushed(stateKey, S.products);
      // FIX (#4): cảnh báo SP trùng tên thay vì tự gộp. Throttle 60s tránh spam.
      if (dupNames && dupNames.length > 0) _warnDupNames(dupNames);
      // ── Migrate SKU cho sản phẩm cũ vừa sync về từ cloud ──────
      // Chạy bất đồng bộ nhẹ để không block onSnapshot handler
      if (typeof migrateLegacySKU === 'function') {
        setTimeout(() => { try { migrateLegacySKU(); } catch(e) {} }, 200);
      }
      // ── Xử lý 2 SP cùng tên bị gộp: chuyển phiếu nhập/bán/trả của bản bị
      // loại sang bản còn lại + xoá tombstone bản bị loại trên cloud — nếu
      // không làm bước này, phiếu cũ sẽ "treo" vào 1 productId không còn tồn
      // tại (mất theo dõi tồn kho) và bản bị loại có thể quay lại ở lần sync sau.
      if (reroutes.length > 0) {
        // Thông báo người dùng biết SP nào bị gộp — tránh nhầm lẫn "SP biến mất"
        setTimeout(() => {
          try {
            const names = [...new Set(reroutes.map(r => r.winnerName))].slice(0, 3).join(', ');
            const more  = reroutes.length > 3 ? ` và ${reroutes.length - 3} sản phẩm khác` : '';
            if (typeof toast === 'function')
              toast(`⚠️ Gộp ${reroutes.length} sản phẩm trùng tên: ${names}${more}. Tồn kho đã được cộng dồn.`, 'warn');
            console.warn('[MERGE] Sản phẩm trùng tên đã gộp:', reroutes);
          } catch(e) {}
        }, 800);
        const _mergeNow = new Date().toISOString();
        const lossIds = new Set(reroutes.map(r => r.loserId));
        const nameById = {}; reroutes.forEach(r => { nameById[r.loserId] = r.winnerName; nameById[r.winnerId] = r.winnerName; });
        const winnerIdOf = {}; reroutes.forEach(r => { winnerIdOf[r.loserId] = r.winnerId; });
        ['imports','sales','returns'].forEach(k => {
          const reroutedRecs = [];
          S[k] = (S[k] || []).map(r => {
            if (!lossIds.has(r.productId)) return r;
            const updated = { ...r, productId: winnerIdOf[r.productId], productName: nameById[r.productId] || r.productName, _updated: _mergeNow };
            reroutedRecs.push(updated);
            return updated;
          });
          if (reroutedRecs.length > 0) {
            try { DB.set('dtn_' + k, S[k]); } catch(e) {}
            // Chỉ đẩy CÁC BẢN GHI vừa reroute lên cloud — không đẩy cả mảng (tốn write quota)
            CLOUD.push('dtn_' + k, reroutedRecs);
            _seedLastPushed(k, reroutedRecs); // tránh save() sau này đẩy lại lần nữa
          }
        });
        // Đẩy tombstone _deleted cho các bản bị loại lên cloud, để chúng không
        // "sống lại" ở lần đồng bộ kế tiếp (mergeProducts sẽ gộp lại lần nữa)
        const deletedLosers = reroutes.map(r => ({ id: r.loserId, _deleted: true, _updated: _mergeNow }));
        if (typeof CLOUD !== 'undefined' && CLOUD._pushDeletedRecord) CLOUD._pushDeletedRecord('dtn_products', deletedLosers);
      }
    } else {
      // Listener giờ chỉ gửi phần THAY ĐỔI (where _updated > cursor) để đỡ tốn
      // đọc Firestore mỗi lần listener khởi động lại — nên GHÉP theo id vào
      // S[stateKey] hiện có bằng mergeAppendOnly (hàm có sẵn trong file, xử lý
      // đúng tombstone/timestamp, trước đây chưa được gọi tới), không replace
      // toàn bộ nữa vì cloudDocs không còn là toàn bộ collection.
      // KHÔNG gọi applyLedgerToStock vì:
      // - products.stock đã đúng từ Firebase (được set bởi thiết bị tạo giao dịch)
      // - applyLedger chỉ cần khi local stock cũ chưa phản ánh giao dịch offline
      // - Trong Firebase-first, mọi stock change đều đi qua Firebase trước → không cần
      const before = JSON.stringify(S[stateKey]);
      S[stateKey] = mergeAppendOnly(S[stateKey], cloudDocs);
      if (JSON.stringify(S[stateKey]) !== before) changed = true;
      _seedLastPushed(stateKey, S[stateKey]);
    }

    if (changed) {
      // Cập nhật localStorage
      const dbMap = {
        sales:'dtn_sales', imports:'dtn_imports', returns:'dtn_returns',
        paymentlogs:'dtn_paymentlogs', products:'dtn_products',
        shipping:'dtn_shipping', settings:'dtn_settings', cashflows:'dtn_cashflows'
      };
      if (dbMap[stateKey]) {
        try {
          const val = stateKey === 'settings' ? S.settings : S[stateKey];
          if (typeof DB !== 'undefined') DB.set(dbMap[stateKey], val);
        } catch(e) {}
      }
      if (!skipRender) {
        // Re-render nhẹ nhàng, không làm mất focus
        try {
          if (typeof render === 'function') render();
          // Toast thông báo có dữ liệu mới
          if (typeof toast === 'function') {
            const labels = { sales:'đơn hàng', imports:'phiếu nhập', returns:'hoàn trả',
                             paymentlogs:'thanh toán', products:'sản phẩm',
                             shipping:'vận chuyển', settings:'cài đặt', cashflows:'thu/chi' };
            toast(`🔄 Đồng bộ: ${labels[stateKey]||stateKey} vừa được cập nhật từ thiết bị khác`, 'info');
          }
        } catch(e) {}
      }
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  REALTIME LISTENERS
  // ═══════════════════════════════════════════════════════════
  function startListeners() {
    if (!_db || !_cfg.enabled) return;
    // Dừng listener cũ nếu có
    stopListeners();

    const collections = ['dtn_sales','dtn_imports','dtn_returns','dtn_paymentlogs','dtn_products','dtn_shipping','dtn_settings','dtn_staff_accounts','dtn_admin_cred','dtn_cashflows'];
    collections.forEach(colName => {
      try {
        // Dùng cursor để listener chỉ "nghe" từ mốc _updated đã biết, thay vì
        // đọc lại TOÀN BỘ collection mỗi lần khởi động — việc này đặc biệt hay
        // xảy ra khi tab/app được focus lại nhiều lần/ngày (mỗi lần huỷ-tạo-lại
        // listener vốn tốn đúng bằng 1 lần đọc full collection).
        const cursor = _getCursor(colName);
        const cursorTs = cursor ? _tsToFirestoreTimestamp(cursor) : null;
        let ref = col(colName);
        if (cursorTs) ref = ref.where('_updated', '>', cursorTs);
        const unsub = ref.onSnapshot({ includeMetadataChanges: false }, (snap) => {
          if (!_bootDone) return;
          // Chỉ xử lý thay đổi từ server (không phải local pending writes)
          const serverChanges = snap.docChanges().filter(ch => !ch.doc.metadata.hasPendingWrites);
          if (serverChanges.length === 0) return;
          // normalizeDoc: Firestore Timestamp → ISO string
          const docs = snap.docs.map(d => normalizeDoc(d.data()));
          applyCloudData(colName, docs, false);
          // Đẩy cursor lên theo _updated mới nhất vừa thấy — lần listener sau
          // (nếu bị huỷ-tạo-lại) sẽ tiếp tục từ đây, không đọc lại từ đầu.
          let maxTs = _getCursor(colName) || '';
          docs.forEach(d => { if (d && d._updated && d._updated > maxTs) maxTs = d._updated; });
          if (maxTs) _setCursor(colName, maxTs);
          _lastSync = ts(); notifyStatus();
        }, (err) => {
          console.warn('[CLOUD] listener error:', colName, err.message);
        });
        _listeners.push(unsub);
      } catch(e) { console.warn('[CLOUD] startListeners error:', colName, e); }
    });
  }

  function stopListeners() {
    _listeners.forEach(fn => { try { fn(); } catch(e) {} });
    _listeners = [];
  }

  // ── Helper: chuyển Firestore Timestamp → ISO string ──────────
  function normalizeTs(val) {
    if (!val) return '';
    if (typeof val === 'string') return val;
    // Firestore Timestamp object
    if (val && typeof val.toDate === 'function') return val.toDate().toISOString();
    return '';
  }

  // ── Helper: chuẩn hoá _updated trong doc trả về từ Firestore ─
  function normalizeDoc(data) {
    if (!data) return data;
    const d = { ...data };
    // Normalize mọi Firestore Timestamp field → ISO string
    if (d._updated) d._updated = normalizeTs(d._updated);
    if (d.createdAt) d.createdAt = normalizeTs(d.createdAt);
    if (d._backedUpAt) d._backedUpAt = normalizeTs(d._backedUpAt);
    return d;
  }

  // ═══════════════════════════════════════════════════════════
  //  AN TOÀN DỮ LIỆU — chặn ghi đè cache khi pull-full về RỖNG bất thường
  //
  //  Đây là lớp bảo vệ chính cho lỗi đã gặp: "tồn kho local giảm mạnh trong
  //  khi Firestore vẫn đầy đủ". Nguyên nhân gốc: pullColIncremental() lúc
  //  pull TOÀN BỘ (forceFull / cache rỗng / 7 ngày) có thể trả về collection
  //  rỗng (0 doc) một cách "thành công" (không throw) nếu gặp lỗi quyền truy
  //  cập theo từng document, token Auth chưa kịp refresh ngay sau đăng nhập,
  //  hoặc một số lỗi mạng/SDK không chuẩn. Trước đây code TIN ngay kết quả
  //  này và ghi đè localStorage → mất cache cũ, dù Firestore thật vẫn còn đủ.
  //
  //  Quy tắc: nếu cache cũ (baseline) đang có ≥1 bản ghi mà lần pull-full
  //  này lại trả về 0 bản ghi → coi là BẤT THƯỜNG, không tin, KHÔNG ghi đè.
  //  Trả lại baseline cũ, không cập nhật cursor (để lần sau tự thử pull-full
  //  lại), và bật cờ cảnh báo cho người dùng biết qua trang Cài đặt.
  // ═══════════════════════════════════════════════════════════
  function _guardAgainstEmptyWipe(name, baseline, changed) {
    if (changed.length === 0 && baseline.length > 0) {
      _suspiciousPull = { name, baselineLen: baseline.length, ts: ts() };
      console.warn('[CLOUD][AN TOÀN] Pull-full "' + name + '" trả về RỖNG dù cache đang có ' +
        baseline.length + ' bản ghi → ĐÃ HỦY ghi đè, giữ nguyên cache cũ. Có thể do mất mạng/quyền truy cập tạm thời.');
      try {
        if (typeof toast === 'function') {
          toast('⚠️ Đồng bộ "' + name + '" trả về rỗng bất thường (cache đang có ' + baseline.length +
            ' mục) — đã HỦY ghi đè để bảo vệ dữ liệu. Kiểm tra mạng rồi vào Cài đặt bấm "Kéo từ cloud về" để thử lại.', 'error');
        }
      } catch(e) {}
      return true; // bị chặn
    }
    return false;
  }

  // ═══════════════════════════════════════════════════════════
  //  PULL TĂNG DẦN — chỉ đọc document thay đổi từ lần sync trước
  //
  //  Thay vì col(name).get() đọc TOÀN BỘ collection mỗi lần (tốn reads),
  //  hàm này dùng cursor (_updated mới nhất đã thấy) để chỉ đọc phần
  //  THAY ĐỔI, rồi ghép vào cache local đã có (DB.get) theo id.
  //  Cloud luôn thắng cho các id trùng — không đổi kết quả cuối cùng so
  //  với pull full, chỉ đổi số lượng document phải đọc từ Firestore.
  //
  //  forceFull=true (hoặc baseline rỗng) → bỏ qua cursor, đọc full như cũ.
  // ═══════════════════════════════════════════════════════════
  async function pullColIncremental(name, forceFull) {
    const baselineRaw = (typeof DB !== 'undefined') ? DB.get(name, []) : [];
    // QUAN TRỌNG: một số collection (dtn_settings, dtn_admin_cred) lưu cache
    // local dưới dạng OBJECT đơn (không phải array) — nếu coi đó là baseline
    // array sẽ crash ở baseline.forEach. Coi baseline không-phải-array = rỗng
    // → tự động fallback full pull, không bao giờ crash bootSync.
    const baseline = Array.isArray(baselineRaw) ? baselineRaw : [];
    // ── Rehydrate ảnh sản phẩm từ IndexedDB ──────────────────────
    // localStorage (baseline) đã strip ảnh base64. Nạp lại ảnh từ IDB cho các
    // bản ghi KHÔNG đổi. Doc cloud thay đổi vẫn GHI ĐÈ baseline theo id phía
    // dưới → ảnh mới / xoá ảnh từ cloud đều thắng đúng (không hồi sinh ảnh cũ).
    if (name === 'dtn_products' && typeof IMG !== 'undefined' && IMG.available() && baseline.length) {
      try {
        const _imgs = await IMG.getAll();
        baseline.forEach(p => { if (p && p.id && !p.image && _imgs[p.id]) p.image = _imgs[p.id]; });
      } catch(e) {}
    }
    const useFull = !!forceFull || baseline.length === 0;
    const cursor = useFull ? '' : _getCursor(name);

    let query = col(name);
    if (cursor) {
      const cursorTs = _tsToFirestoreTimestamp(cursor);
      if (cursorTs) query = query.where('_updated', '>', cursorTs);
    }
    const snap = await query.get();
    const changed = snap.docs.map(d => normalizeDoc(d.data()));

    if (!cursor) {
      // Pull full (lần đầu / force / cache rỗng) → kết quả chính là toàn bộ
      // AN TOÀN: kiểm tra bất thường TRƯỚC khi tin kết quả này là sự thật.
      if (_guardAgainstEmptyWipe(name, baseline, changed)) {
        return baseline; // giữ nguyên cache cũ, không set cursor (thử lại sau)
      }
      let maxTs = '';
      changed.forEach(r => { if (r && r._updated && r._updated > maxTs) maxTs = r._updated; });
      _setCursor(name, maxTs || new Date().toISOString());
      // Pull full thành công có dữ liệu (hoặc baseline cũng đang rỗng — hợp lệ)
      // → gỡ cờ cảnh báo cũ của ĐÚNG collection này nếu có.
      if (_suspiciousPull && _suspiciousPull.name === name) _suspiciousPull = null;
      // ── FIX (mất sản phẩm vừa tạo): KHÔNG trả về cloud-only ──────────────
      // Trước đây pull-full trả thẳng `changed` (CHỈ dữ liệu cloud). Vì bootApp
      // reset S về rỗng rồi ghi đè localStorage bằng kết quả này, MỌI bản ghi
      // LOCAL chưa kịp đẩy lên cloud (vừa tạo SP + nhập kho rồi thoát app ngay,
      // hoặc đang offline/mạng chậm) sẽ bị XOÁ SẠCH. Đây chính là lỗi "tạo SP,
      // nhập kho, out app vào lại mất SP".
      // Sửa: ghép cloud ĐÈ LÊN baseline theo id (cloud thắng record trùng — kể
      // cả tombstone _deleted nên KHÔNG hồi sinh record đã xoá), nhưng GIỮ các
      // record local-only chưa có trên cloud để lần flush sau đẩy lên. Giống
      // hành vi merge-vào-local của bản cũ (v7.9.8) đã chạy ổn định.
      const fmap = {};
      baseline.forEach(r => { if (r && r.id) fmap[r.id] = r; });
      changed.forEach(r => { if (r && r.id) fmap[r.id] = r; });
      return Object.values(fmap);
    }

    // Có cursor → ghép phần thay đổi vào baseline theo id (cloud luôn thắng)
    const map = {};
    baseline.forEach(r => { if (r && r.id) map[r.id] = r; });
    changed.forEach(r => { if (r && r.id) map[r.id] = r; });

    let maxTs = cursor;
    changed.forEach(r => { if (r && r._updated && r._updated > maxTs) maxTs = r._updated; });
    _setCursor(name, maxTs);

    return Object.values(map);
  }


  // ═══════════════════════════════════════════════════════════
  //  PUSH (ghi lên Firestore)
  // ═══════════════════════════════════════════════════════════
  // ── Dọn dữ liệu trước khi ghi Firestore ─────────────────────
  // Firestore SDK mặc định TỪ CHỐI (throw lỗi ngay) bất kỳ field nào có
  // giá trị undefined — và vì 1 batch.set() lỗi sẽ làm RỚT CẢ LÔ (tới 400
  // record/lần, xem pushCollection), 1 sản phẩm/đơn cũ thiếu 1 field thôi
  // có thể khiến hàng trăm record khác hoàn toàn hợp lệ cũng không ghi được.
  // Hàm này dọn sạch undefined (đệ quy object/array lồng nhau) trước khi gửi.
  function _sanitizeForFirestore(val) {
    if (val === null || typeof val !== 'object') return val;
    if (Array.isArray(val)) return val.map(_sanitizeForFirestore);
    if (val instanceof Date) return val;
    const out = {};
    for (const k of Object.keys(val)) {
      const v = val[k];
      if (v === undefined) continue; // bỏ hẳn field undefined (không set null thay vào)
      out[k] = _sanitizeForFirestore(v);
    }
    return out;
  }

  // ── Ước lượng kích thước byte THẬT của 1 document trước khi ghi Firestore ──
  // JSON.stringify(...).length đếm theo UTF-16 code unit — KHÔNG đúng với
  // tiếng Việt có dấu (mỗi ký tự dấu chiếm 2-3 byte khi mã hoá UTF-8, là cách
  // Firestore tính giới hạn 1MB/document thật sự). Dùng TextEncoder để ra
  // đúng số byte, tránh đánh giá sai (tưởng còn dư khổ nhưng thực ra đã vượt).
  function _estimateDocBytes(obj) {
    try { return new TextEncoder().encode(JSON.stringify(obj)).length; }
    catch(e) { try { return JSON.stringify(obj).length; } catch(e2) { return 0; } }
  }

  async function pushCollection(colName, data) {
    if (!_db) return false;
    try {
      const rows = Array.isArray(data) ? data : [data];
      const ref  = col(colName);

      if (rows.length === 0) return true;

      // Gom các record bị bỏ qua vì quá khổ (>1MB) dù đã gỡ ảnh — báo cho
      // người dùng biết SAU khi chạy xong, KHÔNG âm thầm bỏ qua.
      const _oversizedSkips = [];

      // serverTimestamp() — Firestore ghi timestamp theo đồng hồ server,
      // không phụ thuộc đồng hồ thiết bị → conflict resolution chính xác
      const SERVER_TS = firebase.firestore.FieldValue.serverTimestamp();

      // Firestore batch tối đa 500 ops, chia nhỏ 400 để dự phòng
      const chunks = [];
      for (let i = 0; i < rows.length; i += 400) chunks.push(rows.slice(i, i+400));

      for (const chunk of chunks) {
        const batch = _db.batch();
        chunk.forEach(r => {
          if (!r || !r.id) return;
          // Dọn undefined TRƯỚC, rồi mới gắn _updated (sentinel serverTimestamp()
          // không phải plain object thường, không cần/không nên đi qua sanitize).
          let clean = _sanitizeForFirestore(r);
          // SAFETY NET: dữ liệu cũ (ảnh sản phẩm lưu trước khi có nén ảnh) có thể
          // đã vượt giới hạn 1MB/document của Firestore → nếu cứ đẩy nguyên vẹn,
          // document đó sẽ THẤT BẠI VĨNH VIỄN, kẹt mọi field khác (giá, tồn kho...)
          // không lên được cloud. Phát hiện field 'image' quá nặng → tạm gỡ field
          // đó ra khỏi lần ghi này (các field còn lại vẫn lên cloud bình thường),
          // người dùng chỉ cần chọn lại ảnh (đã được tự nén) để cập nhật sau.
          if (clean.image && typeof clean.image === 'string' && clean.image.length > 900000) {
            // FIX (mất ảnh sản phẩm): code cũ gán image:'' rồi merge:true ghi
            // thẳng lên Firestore → đây là GHI ĐÈ, không phải "bỏ qua field".
            // merge:true vẫn ghi đè bất kỳ field có mặt trong payload (dù là
            // rỗng) — nên ảnh ĐÚNG đang có sẵn trên cloud bị xoá thành ''.
            // Sau đó "Firebase-first" (cloud luôn thắng) khiến lần pull kế
            // tiếp kéo cái '' đó về, đè luôn ảnh local còn tốt → mất ảnh vĩnh
            // viễn trên mọi thiết bị, dù toast vẫn báo "Sync thành công".
            // Sửa đúng: XOÁ HẲN key image khỏi payload (không gửi field này
            // lên) → merge:true sẽ không động tới field image đã có trên
            // cloud, giữ nguyên ảnh cũ. Chỉ ảnh hưởng tới sản phẩm hoàn toàn
            // mới (chưa từng sync) có ảnh gốc quá khổ — case này hiếm vì ảnh
            // mới chọn đã được tự nén dưới ngưỡng từ trước.
            console.warn('[CLOUD] Ảnh sản phẩm quá khổ (>900KB sau base64), bỏ field image khỏi lần ghi này (KHÔNG xoá ảnh đã có trên cloud):', r.id);
            clean = { ...clean };
            delete clean.image;
          }
          // SAFETY NET TỔNG QUÁT: dù đã gỡ ảnh, document vẫn có thể vượt 1MB
          // vì field khác phình to theo thời gian (mô tả dài, nhiều biến thể,
          // lịch sử _stockTx tích lũy nhiều năm...). KHÔNG tự đoán xoá field
          // nào khác (tránh lặp lại đúng lỗi mất ảnh ở trên nhưng với field
          // khác) — chỉ BỎ HẲN record này khỏi lần ghi (giữ nguyên trên cloud
          // & local, không sửa không xoá gì), gom lại để báo rõ ID cho người
          // dùng tự xử lý tay, thay vì kẹt cả batch hoặc âm thầm mất dữ liệu.
          const _bytes = _estimateDocBytes(clean);
          if (_bytes > 950000) {
            console.warn('[CLOUD] Document vượt 1MB dù đã gỡ ảnh — BỎ QUA record này (không ghi, không sửa dữ liệu):', colName, r.id, _bytes + ' bytes');
            _oversizedSkips.push({ id: r.id, bytes: _bytes });
            return; // không set record này vào batch
          }
          // Firebase-first: luôn dùng serverTimestamp() — đồng hồ thiết bị có thể lệch
          // gây record cũ ghi đè record mới. serverTimestamp() = đồng hồ Firestore server.
          // merge:true → chỉ cập nhật field thay đổi, không xoá field khác.
          batch.set(ref.doc(String(r.id)), { ...clean, _updated: SERVER_TS }, { merge: true });
        });
        await batch.commit();
      }
      if (_oversizedSkips.length > 0) {
        const idsStr = _oversizedSkips.map(s => s.id + ' (' + Math.round(s.bytes/1024) + 'KB)').join(', ');
        console.warn('[CLOUD] ' + _oversizedSkips.length + ' record trong "' + colName + '" KHÔNG đồng bộ được vì >1MB:', idsStr);
        try {
          if (typeof toast === 'function') {
            toast('⚠️ ' + _oversizedSkips.length + ' bản ghi (' + colName + ') quá 1MB, KHÔNG đồng bộ được: ' + idsStr + '. Dữ liệu local vẫn an toàn, cần rút gọn dữ liệu để đồng bộ.', 'error');
          }
        } catch(e) {}
      }
      return true;
    } catch(e) {
      console.warn('[CLOUD] pushCollection error:', colName, e.message||e);
      return false;
    }
  }

  // ── Firebase Storage: upload/xoá file ảnh sản phẩm ─────────
  // Lưu ảnh dưới dạng file riêng trên Storage (không nhúng base64 vào
  // Firestore) → document gọn nhẹ, không lo giới hạn 1MB/document, ảnh
  // load nhanh hơn vì có CDN của Firebase Storage.
  async function uploadImageToStorage(path, blob) {
    if (!_storage || !blob) return null;
    try {
      const ref = _storage.ref(path);
      await ref.put(blob, { contentType: blob.type || 'image/jpeg' });
      return await ref.getDownloadURL();
    } catch(e) {
      console.warn('[CLOUD] uploadImageToStorage error:', path, e.message||e);
      return null;
    }
  }
  async function deleteImageFromStorage(path) {
    if (!_storage || !path) return;
    try { await _storage.ref(path).delete(); }
    catch(e) { /* file đã không còn / lỗi mạng — bỏ qua, không chặn UI vì không quan trọng */ }
  }

  // ── Sync toàn bộ state lên Firestore ───────────────────────
  async function syncAll(S) {
    if (!_db || !_online) return false;
    _syncStatus = 'syncing'; notifyStatus();
    try {
      // Đọc staff accounts từ localStorage (AUTH quản lý trực tiếp, không trong S)
      const _staffForSync = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
      const _adminCredForSync = (() => { try { const v = localStorage.getItem('dtn_admin_cred'); return v ? [{ id: 'admin_cred', ...JSON.parse(v) }] : []; } catch(e) { return []; } })();
      await Promise.all([
        pushCollection('dtn_products',       S.products    || []),
        pushCollection('dtn_imports',        S.imports     || []),
        pushCollection('dtn_sales',          S.sales       || []),
        pushCollection('dtn_returns',        S.returns     || []),
        pushCollection('dtn_paymentlogs',    S.paymentlogs || []),
        pushCollection('dtn_shipping',       S.shipping    || []),
        pushCollection('dtn_settings',       [{ id:'settings', ...S.settings }]),
        pushCollection('dtn_staff_accounts', _staffForSync),
        pushCollection('dtn_admin_cred',     _adminCredForSync),
      ]);
      _syncStatus = 'ok'; _lastSync = ts(); notifyStatus();
      return true;
    } catch(e) {
      console.warn('[CLOUD] syncAll error:', e);
      _syncStatus = 'error'; notifyStatus();
      return false;
    }
  }

  // ── Queue / flush — chỉ push collection thay đổi, không syncAll ──
  let _retryDelay = 5000;   // backoff bắt đầu 5s, tăng dần đến 60s
  let _retryTimer = null;

  function enqueue(colName, data) {
    // FIX (mất dữ liệu offline): GỘP delta theo id thay vì THAY THẾ entry cũ.
    // Trước đây entry cũ cùng colName bị lọc bỏ → nếu offline sửa SP A rồi sửa
    // SP B, lần enqueue thứ 2 vứt mất bản ghi A đang chờ. Kết hợp _lastPushed
    // (đánh dấu đã đẩy ngay khi xếp hàng) → A không bao giờ được phát hiện lại
    // → mất vĩnh viễn sau bootSync. Giờ gộp: giữ union theo id, bản mới thắng.
    const incoming = Array.isArray(data) ? data : [data];
    const prev = _syncQueue.find(q => q.colName === colName);
    let mergedData = incoming;
    if (prev && Array.isArray(prev.data)) {
      const byId = {};
      prev.data.forEach(r => { if (r && r.id != null) byId[r.id] = r; });
      incoming.forEach(r => { if (r && r.id != null) byId[r.id] = r; });
      mergedData = Object.values(byId);
    }
    _syncQueue = _syncQueue.filter(q => q.colName !== colName);
    _syncQueue.push({ colName, data: mergedData, ts: Date.now() });
    _saveQueue(_syncQueue); // persist để sống qua refresh
    if (_online) flushQueue();
  }

  // Map colName → stateKey để hydrate data từ S khi queue restore sau refresh
  const _COL_TO_STATE = {
    'dtn_products':     'products',
    'dtn_imports':      'imports',
    'dtn_sales':        'sales',
    'dtn_shipping':     'shipping',
    'dtn_returns':      'returns',
    'dtn_paymentlogs':  'paymentlogs',
    'dtn_cashflows':    'cashflows',   // FIX: thiếu → offline cashflow bị mất sau refresh
    'dtn_settings':     'settings',
    'dtn_staff_accounts': null, // đọc từ localStorage riêng
  };

  function hydrateQueueItem(item) {
    // Nếu item đã có data (enqueue trong session hiện tại) → dùng ngay
    if (item.data) return item;
    // Item từ sessionStorage (sau refresh) → hydrate từ state hiện tại
    const S = window._S;
    const stateKey = _COL_TO_STATE[item.colName];
    if (stateKey === null) {
      // staff_accounts: đọc từ localStorage
      try {
        const v = localStorage.getItem('dtn_staff_accounts');
        return { ...item, data: v ? JSON.parse(v) : [] };
      } catch(e) { return { ...item, data: [] }; }
    }
    if (stateKey === 'settings' && S) {
      return { ...item, data: [{ id: 'settings', ...S.settings }] };
    }
    if (S && S[stateKey]) return { ...item, data: S[stateKey] };
    return null; // không hydrate được → bỏ qua
  }

  // ── Lấy các bản ghi đang CHỜ đẩy lên cloud của 1 collection ──────────
  // Dùng làm "lưới an toàn" cuối cùng trong bootSync: nếu cache localStorage
  // (dtn_products...) bị mất nhưng hàng đợi đẩy (dtn_sync_queue) vẫn còn, các
  // bản ghi local chưa đồng bộ vẫn được khôi phục thay vì biến mất.
  function _queuedDocs(colName) {
    try {
      const out = [];
      _syncQueue.filter(q => q.colName === colName).forEach(item => {
        const hy = hydrateQueueItem(item);
        if (hy && Array.isArray(hy.data)) hy.data.forEach(r => { if (r && r.id && !r._deleted) out.push(r); });
      });
      return out;
    } catch(e) { return []; }
  }

  async function flushQueue() {
    if (_flushing || !_online || !_db || _syncQueue.length === 0) return;
    _flushing = true;
    _syncStatus = 'syncing'; notifyStatus();

    // Hydrate items thiếu data (từ sessionStorage sau refresh)
    const items = _syncQueue
      .map(item => hydrateQueueItem(item))
      .filter(Boolean); // bỏ những item không hydrate được

    if (items.length === 0) {
      _syncQueue = []; _clearQueue();
      _flushing = false; _syncStatus = 'idle'; notifyStatus();
      return;
    }

    try {
      // AN TOÀN: pushCollection() tự bắt lỗi và trả về true/false, KHÔNG
      // throw — nên Promise.all ở đây luôn "resolve" dù 1 hay nhiều
      // collection ghi thất bại thật trên Firestore. Trước đây code coi
      // Promise.all chạy xong = mọi thứ đã thành công, xoá khỏi hàng đợi
      // luôn dù chưa hề lên cloud — đây là nguyên nhân khiến 1 số thay đổi
      // (vd: "Tính lại tồn kho") biến mất sau khi thoát/mở lại app. Phải
      // đọc đúng kết quả true/false của TỪNG collection.
      const results = await Promise.all(items.map(async item => ({
        colName: item.colName, ts: item.ts,
        ok: await pushCollection(item.colName, item.data),
      })));

      const failedCols    = new Set(results.filter(r => !r.ok).map(r => r.colName));
      const succeededCols = new Set(results.filter(r =>  r.ok).map(r => r.colName));

      // Chỉ xoá khỏi hàng đợi những collection ĐÃ XÁC NHẬN ghi thành công.
      // Collection thất bại được GIỮ LẠI để tự thử lại (không âm thầm mất).
      _syncQueue = _syncQueue.filter(q => {
        if (failedCols.has(q.colName)) return true;       // thất bại: giữ lại
        if (!succeededCols.has(q.colName)) return true;   // không thuộc lần flush này: giữ
        const pushed = results.find(r => r.colName === q.colName);
        return pushed && q.ts > pushed.ts;                // item mới hơn trong session: giữ
      });
      _saveQueue(_syncQueue);
      if (_syncQueue.length === 0) _clearQueue();

      if (failedCols.size > 0) {
        // Có collection ghi thất bại thật — KHÔNG báo "đã xong", báo lỗi rõ
        // và lên lịch thử lại (exponential backoff), không reset backoff.
        _syncStatus = 'error'; notifyStatus();
        try {
          if (typeof toast === 'function') {
            toast('❌ Đồng bộ lên Firebase thất bại: ' + [...failedCols].join(', ') +
              '. Dữ liệu trên máy vẫn an toàn, hệ thống sẽ tự thử lại.', 'error');
          }
        } catch(e) {}
        clearTimeout(_retryTimer);
        _retryTimer = setTimeout(() => {
          _flushing = false;
          _retryDelay = Math.min(_retryDelay * 2, 60000);
          flushQueue();
        }, _retryDelay);
        return;
      }

      _retryDelay = 5000; // reset backoff — mọi thứ đã xác nhận lên cloud
      _syncStatus = 'ok'; _lastSync = ts(); notifyStatus();
    } catch(e) {
      console.warn('[CLOUD] flushQueue error:', e);
      // ❌ Lỗi: giữ queue, retry với exponential backoff
      _syncStatus = 'error'; notifyStatus();
      clearTimeout(_retryTimer);
      _retryTimer = setTimeout(() => {
        _flushing = false;
        _retryDelay = Math.min(_retryDelay * 2, 60000);
        flushQueue();
      }, _retryDelay);
      return;
    } finally {
      _flushing = false;
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  BOOT SYNC — pull cloud và merge vào local khi khởi động
  // ═══════════════════════════════════════════════════════════
  async function bootSync(S_state, forceFullArg) {
    // Firebase-first: nếu không có Firebase → fallback local (offline mode)
    if (!_db || !_online || !_cfg.enabled) {
      // Offline hoặc chưa cấu hình: nạp từ localStorage làm fallback
      if (typeof DB !== 'undefined') {
        const _S = window._S || S_state;
        _S.products    = DB.get('dtn_products',    []);
        _S.imports     = DB.get('dtn_imports',     []);
        _S.sales       = DB.get('dtn_sales',       []);
        _S.shipping    = DB.get('dtn_shipping',    []);
        _S.settings    = DB.get('dtn_settings',    _S.settings || {});
        _S.returns     = DB.get('dtn_returns',     []);
        _S.paymentlogs = DB.get('dtn_paymentlogs', []);
        _S.cashflows   = DB.get('dtn_cashflows',   []);
        // Rehydrate ảnh sản phẩm từ IndexedDB (localStorage đã strip base64)
        try {
          if (typeof IMG !== 'undefined' && IMG.available() && _S.products && _S.products.length) {
            const _imgs = await IMG.getAll();
            _S.products.forEach(p => { if (p && p.id && !p.image && _imgs[p.id]) p.image = _imgs[p.id]; });
          }
        } catch(e) {}
      }
      _bootDone = true;
      return false;
    }
    _syncStatus = 'syncing'; notifyStatus();
    try {
      // An toàn dữ liệu: cứ mỗi 7 ngày bắt buộc 1 lần full-pull thật (bỏ qua
      // cursor) để tự "rửa" lại toàn bộ, phòng lệch dữ liệu tích tụ vì bất kỳ
      // lý do gì (quota localStorage, lỗi cache...). Các lần còn lại trong
      // tuần dùng incremental (chỉ đọc phần _updated mới hơn cursor) để đỡ
      // tốn lượt đọc Firestore mỗi lần mở app.
      // forceFullArg=true (ví dụ nút "Kéo từ cloud về" khi nghi ngờ dữ liệu
      // lệch) → BẮT BUỘC pull thật 100%, không tin vào cursor/cache hiện có
      // (vì chính cursor/cache đó có thể là thứ đang bị nghi ngờ có vấn đề).
      const forceFull = !!forceFullArg || _shouldForceFullResync();
      const [products, imports, sales, returns, paymentlogs, shipping, settingsArr, staffArr, adminCredArr, cashflowsArr] = await Promise.all([
        pullColIncremental('dtn_products', forceFull),    pullColIncremental('dtn_imports', forceFull),     pullColIncremental('dtn_sales', forceFull),
        pullColIncremental('dtn_returns', forceFull),     pullColIncremental('dtn_paymentlogs', forceFull), pullColIncremental('dtn_shipping', forceFull),
        pullColIncremental('dtn_settings', forceFull),    pullColIncremental('dtn_staff_accounts', forceFull), pullColIncremental('dtn_admin_cred', forceFull),
        pullColIncremental('dtn_cashflows', forceFull),
      ]);
      if (forceFull) _markFullResyncDone();

      // ── Firebase-first: GHI ĐÈ trực tiếp vào S từ cloud ──────────────────
      // products/imports/sales/... ở trên đã là dữ liệu "cloud thật" đầy đủ
      // (pullColIncremental tự ghép cache cũ + phần vừa đổi) — không phải
      // local chưa xác nhận, nên ghi đè trực tiếp vẫn đúng như cũ.
      // _deleted records bị lọc ra luôn — chỉ giữ data còn sống.
      const _S = window._S || S_state;

      // ── Lưới an toàn: ghép các bản ghi còn KẸT trong hàng đợi đẩy ───────
      // (chưa xác nhận lên cloud) vào kết quả pull. Bảo vệ trường hợp cache
      // localStorage bị mất nhưng hàng đợi vẫn còn — record local-only không
      // bị rơi mất khi reset S lúc boot. _queuedDocs đã lọc bỏ _deleted.
      const _qProducts = _queuedDocs('dtn_products');
      if (_qProducts.length) {
        const seen = new Set(products.map(r => r && r.id).filter(Boolean));
        _qProducts.forEach(r => { if (!seen.has(r.id)) { products.push(r); seen.add(r.id); } });
      }

      // Products: filter _deleted. KHÔNG còn tự gộp trùng tên (xem FIX #4).
      if (products.length) {
        const { products: mergedProds, reroutes, dupNames } = mergeProducts([], products); // base rỗng → products đã đại diện full cloud rồi
        _S.products = mergedProds;
        // FIX (#4): cảnh báo SP trùng tên thay vì tự gộp (báo sau khi UI sẵn sàng).
        if (dupNames && dupNames.length > 0) setTimeout(() => _warnDupNames(dupNames), 1500);
        // reroutes luôn rỗng từ FIX #4 → khối dưới nằm im, giữ lại để tương thích.
        if (reroutes.length > 0) {
          const _mergeNow = new Date().toISOString();
          const winnerIdOf = {}; reroutes.forEach(r => { winnerIdOf[r.loserId] = r.winnerId; });
          // FIX: thêm key winnerId để tra được tên sau khi đã đổi productId sang winnerId
          const nameById   = {}; reroutes.forEach(r => { nameById[r.loserId] = r.winnerName; nameById[r.winnerId] = r.winnerName; });
          ['imports','sales','returns'].forEach(k => {
            const arr = k === 'imports' ? imports : k === 'sales' ? sales : returns;
            arr.forEach(r => { if (winnerIdOf[r.productId]) { r.productId = winnerIdOf[r.productId]; r.productName = nameById[r.productId] || r.productName; r._updated = _mergeNow; } });
          });
          const deletedLosers = reroutes.map(r => ({ id: r.loserId, _deleted: true, _updated: _mergeNow }));
          pushCollection('dtn_products', deletedLosers).catch(() => {});
        }
      }

      // Transactions: filter _deleted → ghi thẳng vào S.
      // _mergeQueued: ghép thêm bản ghi còn kẹt trong hàng đợi đẩy (vd: phiếu
      // nhập kho vừa tạo chưa kịp lên cloud) để không bị mất khi reset S.
      const _mergeQueued = (arr, colName) => {
        const q = _queuedDocs(colName);
        if (!q.length) return arr;
        const seen = new Set(arr.map(r => r && r.id).filter(Boolean));
        q.forEach(r => { if (!seen.has(r.id)) { arr.push(r); seen.add(r.id); } });
        return arr;
      };
      _S.imports     = _mergeQueued(imports.filter(r => r && !r._deleted),     'dtn_imports');
      _S.sales       = _mergeQueued(sales.filter(r => r && !r._deleted),       'dtn_sales');
      _S.returns     = _mergeQueued(returns.filter(r => r && !r._deleted),     'dtn_returns');
      _S.paymentlogs = _mergeQueued(paymentlogs.filter(r => r && !r._deleted), 'dtn_paymentlogs');
      _S.shipping    = _mergeQueued(shipping.filter(r => r && !r._deleted),    'dtn_shipping');
      _S.cashflows   = _mergeQueued(cashflowsArr.filter(r => r && !r._deleted), 'dtn_cashflows');

      // Settings
      if (settingsArr.length > 0) {
        const s = { ..._S.settings, ...settingsArr[0] };
        delete s.id; delete s._updated;
        _S.settings = s;
      }

      // Auth: staff accounts + admin cred (vẫn qua localStorage — AUTH quản lý)
      if (staffArr.length > 0) {
        try {
          const map = {};
          staffArr.forEach(s => { if (s && s.id && !s._deleted) map[s.id] = s; });
          localStorage.setItem('dtn_staff_accounts', JSON.stringify(Object.values(map)));
        } catch(e) {}
      }
      if (adminCredArr.length > 0) {
        try {
          const cloudCred = adminCredArr.find(d => d.id === 'admin_cred');
          if (cloudCred) {
            const localRaw = localStorage.getItem('dtn_admin_cred');
            const localCred = localRaw ? JSON.parse(localRaw) : null;
            const cloudTs = cloudCred._updated || '';
            const localTs = (localCred && localCred._updated) || '';
            if (!localTs || cloudTs > localTs) {
              const { id, _updated, ...credData } = cloudCred;
              localStorage.setItem('dtn_admin_cred', JSON.stringify({ ...credData, _updated: cloudTs }));
            }
          }
        } catch(e) {}
      }

      // ── Seed _stockTx từ transactions vừa pull về ─────────────
      // Đảm bảo product.stock và _stockTx khớp với cloud transactions.
      // Nếu cloud product có _stockTx đầy đủ → không tính lại.
      // Nếu thiếu (cloud cũ, chưa có _stockTx) → seed từ transactions.
      _S.products = (_S.products || []).map(p => {
        const ids = [];
        (_S.sales    || []).forEach(s => { if (s.productId === p.id && s.id) ids.push(s.id); });
        (_S.imports  || []).forEach(i => { if (i.productId === p.id && i.id) ids.push(i.id); });
        (_S.returns  || []).forEach(r => { if (r.productId === p.id && r.id) ids.push(r.id); });
        const fullTx = unionStockTx(p._stockTx, ids);
        if (fullTx.length === (p._stockTx || []).length) return p;
        return { ...p, _stockTx: fullTx };
      });

      // ── Cache xuống localStorage để dùng offline ──────────────
      try {
        if (typeof DB !== 'undefined') {
          DB.set('dtn_products',    _S.products);
          DB.set('dtn_imports',     _S.imports);
          DB.set('dtn_sales',       _S.sales);
          DB.set('dtn_returns',     _S.returns);
          DB.set('dtn_paymentlogs', _S.paymentlogs);
          DB.set('dtn_shipping',    _S.shipping);
          DB.set('dtn_cashflows',   _S.cashflows);
          DB.set('dtn_settings',    _S.settings);
        }
      } catch(e) {}

      // Seed _lastPushed để save() không đẩy ngược lại cloud những gì vừa pull
      _seedLastPushed('products',    _S.products);
      _seedLastPushed('imports',     _S.imports);
      _seedLastPushed('sales',       _S.sales);
      _seedLastPushed('returns',     _S.returns);
      _seedLastPushed('paymentlogs', _S.paymentlogs);
      _seedLastPushed('shipping',    _S.shipping);
      _seedLastPushed('cashflows',   _S.cashflows);

      _syncStatus = 'ok'; _lastSync = ts();
      _bootDone = true;
      notifyStatus();
      return true;
    } catch(e) {
      console.warn('[CLOUD] bootSync error:', e);
      // Lỗi Firebase → fallback local để app không trắng trang
      if (typeof DB !== 'undefined') {
        const _S = window._S || S_state;
        _S.products    = DB.get('dtn_products',    []);
        _S.imports     = DB.get('dtn_imports',     []);
        _S.sales       = DB.get('dtn_sales',       []);
        _S.shipping    = DB.get('dtn_shipping',    []);
        _S.settings    = DB.get('dtn_settings',    _S.settings || {});
        _S.returns     = DB.get('dtn_returns',     []);
        _S.paymentlogs = DB.get('dtn_paymentlogs', []);
        _S.cashflows   = DB.get('dtn_cashflows',   []);
        // Rehydrate ảnh sản phẩm từ IndexedDB (localStorage đã strip base64)
        try {
          if (typeof IMG !== 'undefined' && IMG.available() && _S.products && _S.products.length) {
            const _imgs = await IMG.getAll();
            _S.products.forEach(p => { if (p && p.id && !p.image && _imgs[p.id]) p.image = _imgs[p.id]; });
          }
        } catch(e) {}
      }
      _syncStatus = 'error';
      _bootDone = true;
      notifyStatus();
      return false;
    }
  }

  // ── Pull thủ công (nút "Kéo từ cloud") ─────────────────────
  async function pullAll() {
    if (!_db) return null;
    _syncStatus = 'syncing'; notifyStatus();
    try {
      const pullCol = async (name) => {
        const snap = await col(name).get();
        // Giữ _updated — nếu xóa, lần push sau record nhận timestamp server mới
        // khiến dữ liệu cũ ghi đè dữ liệu mới trên thiết bị khác
        return snap.docs.map(d => normalizeDoc(d.data()));
      };
      // FIX: thêm cashflows vào pullAll — trước đây thiếu, gây mất dữ liệu Thu/Chi
      const [products, imports, sales, returns, paymentlogs, shipping, settingsArr, staffArr, adminCredArr, cashflowsArr] = await Promise.all([
        pullCol('dtn_products'), pullCol('dtn_imports'), pullCol('dtn_sales'),
        pullCol('dtn_returns'),  pullCol('dtn_paymentlogs'), pullCol('dtn_shipping'),
        pullCol('dtn_settings'), pullCol('dtn_staff_accounts'), pullCol('dtn_admin_cred'),
        pullCol('dtn_cashflows')
      ]);
      const settings = settingsArr.length > 0
        ? (() => { const s = {...settingsArr[0]}; delete s.id; delete s._updated; return s; })()
        : null;
      _syncStatus = 'ok'; _lastSync = ts(); notifyStatus();
      return { products, imports, sales, returns, paymentlogs, shipping, settings, staff_accounts: staffArr, admin_cred: adminCredArr, cashflows: cashflowsArr };
    } catch(e) {
      console.warn('[CLOUD] pullAll error:', e);
      _syncStatus = 'error'; notifyStatus();
      return null;
    }
  }

  // ── Test kết nối ────────────────────────────────────────────
  async function testConnection(apiKey, projectId, shopId) {
    try {
      if (typeof firebase === 'undefined') return { ok:false, msg:'Firebase SDK chưa tải được.' };
      let testApp;
      try {
        testApp = firebase.initializeApp({ apiKey, projectId, authDomain: projectId+'.firebaseapp.com' }, '__test__');
      } catch(e) { testApp = firebase.app('__test__'); }
      const testDb = firebase.firestore(testApp);
      await testDb.collection('shops').doc(shopId||'shop1').collection('dtn_settings').limit(1).get();
      return { ok:true, msg:'Kết nối Firebase thành công! 🔥' };
    } catch(e) {
      const msg = e.message || '';
      if (msg.includes('permission') || msg.includes('PERMISSION_DENIED'))
        return { ok:false, msg:'Lỗi quyền truy cập — kiểm tra Firestore Rules.' };
      if (msg.includes('not-found') || msg.includes('NOT_FOUND'))
        return { ok:true, msg:'Kết nối OK (collection trống, sẽ tự tạo khi sync).' };
      return { ok:false, msg: msg || 'Lỗi không xác định' };
    }
  }

  // ── 3-2-1 Backup ────────────────────────────────────────────
  // Slot localStorage: backup nhanh (cùng thiết bị)
  // Slot Firestore:    backup an toàn (cloud, tồn tại dù xóa cache)
  const DAILY_KEY  = 'dtn_backup_daily';
  const DAILY_TIME = 'dtn_backup_daily_time';
  const REMIND_KEY = 'dtn_backup_remind';
  const CLOUD_BACKUP_TIME = 'dtn_cloud_backup_time';
  const CLOUD_BACKUP_INTERVAL = 6 * 60 * 60 * 1000; // 6 giờ

  function runDailyBackup(exportFn) {
    try {
      const now = Date.now();
      const last = parseInt(localStorage.getItem(DAILY_TIME)||'0');
      if (now - last < 30*60*1000) return; // chạy tối đa 30 phút/lần

      // 1. Xoay vòng localStorage (slot 1→2→3)
      const data = exportFn();
      const slot2 = localStorage.getItem(DAILY_KEY+'_2');
      const slot1 = localStorage.getItem(DAILY_KEY+'_1');
      if (slot2) { try { localStorage.setItem(DAILY_KEY+'_3', slot2); } catch(e) {} }
      if (slot1) { try { localStorage.setItem(DAILY_KEY+'_2', slot1); } catch(e) {} }
      localStorage.setItem(DAILY_KEY+'_1', data);
      localStorage.setItem(DAILY_TIME, String(now));

      // 2. Backup lên Firestore (6 giờ/lần) — thoát khỏi giới hạn localStorage
      const lastCloud = parseInt(localStorage.getItem(CLOUD_BACKUP_TIME)||'0');
      if (_db && _cfg?.enabled && _online && now - lastCloud > CLOUD_BACKUP_INTERVAL) {
        try {
          const backupDoc = {
            id: 'snapshot',
            data,                              // chuỗi JSON nén
            _backedUpAt: firebase.firestore.FieldValue.serverTimestamp(),
            _size: data.length,
            _device: navigator.userAgent.slice(0, 80)
          };
          col('dtn_backup').doc('snapshot')
            .set(backupDoc, { merge: false })  // overwrite — chỉ giữ bản mới nhất
            .then(() => {
              localStorage.setItem(CLOUD_BACKUP_TIME, String(now));
              console.info('[CLOUD] Backup snapshot pushed to Firestore');
            })
            .catch(e => console.warn('[CLOUD] cloud backup error:', e.message));
        } catch(e) {}
      }
    } catch(e) { console.warn('[CLOUD] dailyBackup error:', e); }
  }

  // Pull snapshot backup từ Firestore về
  async function pullCloudBackup() {
    if (!_db) return null;
    try {
      const doc = await col('dtn_backup').doc('snapshot').get();
      if (!doc.exists) return null;
      const d = doc.data();
      return { data: d.data, backedUpAt: normalizeTs(d._backedUpAt), size: d._size };
    } catch(e) { console.warn('[CLOUD] pullCloudBackup error:', e); return null; }
  }
  function shouldRemindDownload() {
    try { return Date.now() - parseInt(localStorage.getItem(REMIND_KEY)||'0') > 7*24*60*60*1000; } catch(e) { return false; }
  }
  function markDownloaded() {
    try { localStorage.setItem(REMIND_KEY, String(Date.now())); } catch(e) {}
  }
  function getRotatingBackup(slot) {
    try { return localStorage.getItem(DAILY_KEY+'_'+slot)||null; } catch(e) { return null; }
  }
  function getRotatingBackupTime() {
    try { const v=localStorage.getItem(DAILY_TIME); return v?new Date(parseInt(v)).toISOString():null; } catch(e) { return null; }
  }

  // ── Init ────────────────────────────────────────────────────
  loadCfg();
  initClient();

  return {
    init: initClient,
    getCfg: () => ({ ..._cfg }),
    saveCfg(cfg) { saveCfg(cfg); stopListeners(); initClient(); },
    getStatus,
    // CHỈ ĐỌC: đếm số bản ghi đang chờ đẩy lên cloud (chưa xác nhận thành công).
    // Dùng để cảnh báo người dùng trước khi đổi máy/đổi file — không đụng dữ liệu.
    getPendingCount() {
      let records = 0;
      _syncQueue.forEach(item => {
        records += Array.isArray(item.data) ? item.data.length : (item.data ? 1 : 0);
      });
      return { items: _syncQueue.length, records };
    },
    onStatus(fn) { _statusListeners.push(fn); },
    // colName: 'dtn_products' | 'dtn_sales' | ...  data: array hoặc single doc
    push(colName, data) {
      if (!_cfg?.enabled) return;
      enqueue(colName, Array.isArray(data) ? data : [data]);
    },
    // Push và CHỜ kết quả thật (true/false) — dùng cho các thao tác mà người
    // dùng cần biết CHẮC đã lên Firestore hay chưa trước khi báo "thành
    // công" (ví dụ nút "Tính lại tồn kho"), khác với push() ở trên chỉ xếp
    // hàng đợi nền và trả về ngay, không chờ xác nhận.
    async pushAwait(colName, data) {
      if (!_cfg?.enabled || !_db) return false;
      return await pushCollection(colName, Array.isArray(data) ? data : [data]);
    },
    // Push array có chứa _deleted records để đồng bộ xóa sang thiết bị khác
    _pushDeletedRecord(colName, arrayWithDeleted) {
      if (!_db || !_cfg?.enabled) return;
      pushCollection(colName, arrayWithDeleted).catch(e => console.warn('[CLOUD] pushDeleted error:', e));
    },
    syncAll: (S) => syncAll(S),
    // Flush queue tồn đọng (dùng cho heartbeat / visibilitychange)
    flushPending: () => flushQueue(),
    pullAll,
    bootSync,       // ← dùng trong bootApp()
    startListeners, // ← gọi sau bootSync hoàn thành
    stopListeners,
    testConnection,
    runDailyBackup,
    pullCloudBackup,
    shouldRemindDownload,
    markDownloaded,
    getRotatingBackup,
    getRotatingBackupTime,
    // Dùng ở các nơi tạo sales/imports/returns để đánh dấu _stockTx
    // (xem applyLedgerToStock) — tránh hoà giải tồn kho đếm trùng giao dịch
    unionStockTx,
    // ── Firebase Storage cho ảnh sản phẩm ──────────────────────
    uploadImageToStorage,
    deleteImageFromStorage,
    isOnline: () => _online,
    hasStorage: () => !!_storage,
    // Cho phép người dùng ẩn banner cảnh báo "đã chặn ghi đè bất thường"
    // sau khi đã đọc và xử lý (xem trang Cài đặt)
    _clearSuspiciousPull() { _suspiciousPull = null; notifyStatus(); },
  };
})();
// ═══════════════════════════════════════════════════════════════
//  AUTH — Hệ thống đăng nhập Admin / Nhân viên  (v7.5.0)
//  Cải tiến bảo mật:
//    1. Hash mật khẩu bằng SHA-256 (Web Crypto API)
//    2. Brute-force protection: lockout 5 phút sau 5 lần sai
//    3. Reset mật khẩu yêu cầu mã xác nhận 6 số (không tự động reset)
//    4. Tự động migrate mật khẩu plaintext sang hash khi login
// ═══════════════════════════════════════════════════════════════
const AUTH = (() => {
  const ADMIN_KEY   = 'dtn_admin_cred';
  const STAFF_KEY   = 'dtn_staff_accounts';
  const SESSION_KEY = 'dtn_session';
  const BF_KEY      = 'dtn_bf_lock'; // brute-force state

  let _sessionCache = null;

  // ── Salt theo từng user — tránh rainbow table chung ─────────
  // username được lowercase+trim để đồng nhất giữa các thiết bị
  function makeSalt(username) {
    return 'dtn_2025_' + (username || 'admin').trim().toLowerCase();
  }

  // ── SHA-256 hash async (dùng khi có thể await) ───────────────
  async function hashPw(password, username) {
    const salt = makeSalt(username);
    try {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(password + salt));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    } catch(e) {
      // Fallback khi Web Crypto không khả dụng (HTTP context không có HTTPS)
      return hashPwSync(password, username);
    }
  }

  // ── Sync hash (djb2 + per-user salt) — dùng khi không thể await
  // Ghi chú: djb2 không phải thuật toán mật mã — brute-force lock (5 lần/5 phút)
  // là lớp bảo vệ chính. Nâng lên bcrypt cần backend riêng.
  function hashPwSync(password, username) {
    let h = 5381;
    const s = password + makeSalt(username);
    for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h |= 0; }
    return 'sync_' + Math.abs(h).toString(36);
  }

  // ── Brute-force protection ────────────────────────────────────
  const BF_MAX_ATTEMPTS = 5;
  const BF_LOCKOUT_MS   = 5 * 60 * 1000; // 5 phút

  function getBfState() {
    try { const v = localStorage.getItem(BF_KEY); return v ? JSON.parse(v) : { attempts: 0, lockedUntil: 0 }; } catch(e) { return { attempts: 0, lockedUntil: 0 }; }
  }
  function saveBfState(s) {
    try { localStorage.setItem(BF_KEY, JSON.stringify(s)); } catch(e) {}
  }
  function recordFailedAttempt() {
    const bf = getBfState();
    bf.attempts = (bf.attempts || 0) + 1;
    if (bf.attempts >= BF_MAX_ATTEMPTS) {
      bf.lockedUntil = Date.now() + BF_LOCKOUT_MS;
      bf.attempts = 0;
    }
    saveBfState(bf);
  }
  function clearFailedAttempts() {
    saveBfState({ attempts: 0, lockedUntil: 0 });
  }
  function getLockStatus() {
    const bf = getBfState();
    if (bf.lockedUntil && Date.now() < bf.lockedUntil) {
      const remaining = Math.ceil((bf.lockedUntil - Date.now()) / 1000);
      return { locked: true, remaining, attempts: 0 };
    }
    return { locked: false, remaining: 0, attempts: bf.attempts || 0 };
  }

  // ── Credential storage ────────────────────────────────────────
  function getAdminCred() {
    try { const v = localStorage.getItem(ADMIN_KEY); return v ? JSON.parse(v) : null; } catch(e) { return null; }
  }
  function saveAdminCred(username, passwordHash, isHashed) {
    try { localStorage.setItem(ADMIN_KEY, JSON.stringify({ username, password: passwordHash, hashed: isHashed !== false })); } catch(e) {}
  }
  function getStaffAccounts() {
    try { const v = localStorage.getItem(STAFF_KEY); return v ? JSON.parse(v) : []; } catch(e) { return []; }
  }
  function saveStaffAccounts(list) {
    try { localStorage.setItem(STAFF_KEY, JSON.stringify(list)); } catch(e) {}
  }

  // ── Session ───────────────────────────────────────────────────
  function getSession() {
    if (_sessionCache) return _sessionCache;
    try { const v = localStorage.getItem(SESSION_KEY); if (v) { _sessionCache = JSON.parse(v); return _sessionCache; } return null; } catch(e) { return null; }
  }
  function setSession(user) {
    _sessionCache = user;
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch(e) {}
  }
  function clearSession() {
    _sessionCache = null;
    try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
  }

  // ── Verify password — username dùng để tạo per-user salt ──────
  function verifyPassword(inputPw, stored) {
    if (!stored) return false;
    if (stored.hashed) {
      // Thử salt mới (per-user) trước, fallback sang salt cũ để migrate
      const hNew = hashPwSync(inputPw, stored.username);
      if (stored.password === hNew) return true;
      // Fallback: hash với salt cũ cố định (tương thích dữ liệu cũ)
      const hOld = hashPwSync_legacy(inputPw);
      return stored.password === hOld;
    }
    // Legacy plaintext
    return stored.password === inputPw;
  }

  // Hash với salt cố định cũ — chỉ dùng để migrate, không tạo hash mới
  function hashPwSync_legacy(password) {
    let h = 5381;
    const s = password + 'dtn_salt_2025';
    for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h |= 0; }
    return 'sync_' + Math.abs(h).toString(36);
  }

  // ── Migrate plaintext / salt-cũ → per-user salt khi login ────
  function migrateIfNeeded(inputPw, storedObj, saveFunc) {
    const correctHash = hashPwSync(inputPw, storedObj.username);
    if (!storedObj.hashed || storedObj.password !== correctHash) {
      // Rehash với salt mới ngay sau khi đăng nhập thành công
      saveFunc(correctHash, true);
    }
  }

  // ── Khởi tạo admin mặc định ───────────────────────────────────
  (function initAdminCred() {
    try {
      const raw = localStorage.getItem(ADMIN_KEY);
      if (!raw) {
        const hashed = hashPwSync('admin123', 'admin');
        saveAdminCred('admin', hashed, true);
        return;
      }
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed.username !== 'string' || !parsed.username.trim() || !parsed.password) {
        const hashed = hashPwSync('admin123', 'admin');
        saveAdminCred('admin', hashed, true);
      }
    } catch(e) {
      try {
        const hashed = hashPwSync('admin123', 'admin');
        localStorage.setItem(ADMIN_KEY, JSON.stringify({ username: 'admin', password: hashed, hashed: true }));
      } catch(e2) {}
    }
  })();

  // ── Reset PIN (6 số, tạo mới mỗi lần gọi) ───────────────────
  let _resetPin = null;
  let _resetPinExpiry = 0;
  function generateResetPin() {
    _resetPin = String(Math.floor(100000 + Math.random() * 900000));
    _resetPinExpiry = Date.now() + 10 * 60 * 1000; // 10 phút
    return _resetPin;
  }
  function verifyResetPin(pin) {
    if (!_resetPin || Date.now() > _resetPinExpiry) return false;
    const ok = _resetPin === pin.trim();
    if (ok) { _resetPin = null; _resetPinExpiry = 0; } // dùng 1 lần
    return ok;
  }

  return {
    // ── Đăng nhập ──────────────────────────────────────────────
    login(username, password) {
      const lock = getLockStatus();
      if (lock.locked) return { error: `Tài khoản bị khoá ${lock.remaining} giây nữa do đăng nhập sai nhiều lần.` };

      const admin = getAdminCred();
      if (admin && admin.username === username && verifyPassword(password, admin)) {
        migrateIfNeeded(password, admin, (h, isH) => saveAdminCred(admin.username, h, isH));
        clearFailedAttempts();
        const user = { username, role: 'admin', displayName: 'Quản trị viên' };
        setSession(user);
        return user;
      }
      const staffList = getStaffAccounts();
      const staff = staffList.find(s => s.username === username && s.active && verifyPassword(password, s));
      if (staff) {
        // Migrate sang per-user salt khi login
        migrateIfNeeded(password, staff, (h, isH) => {
          const list = getStaffAccounts();
          const idx = list.findIndex(x => x.id === staff.id);
          if (idx >= 0) { list[idx].password = h; list[idx].hashed = isH; saveStaffAccounts(list); }
        });
        clearFailedAttempts();
        const user = { username: staff.username, role: 'staff', displayName: staff.displayName || staff.username };
        setSession(user);
        return user;
      }
      recordFailedAttempt();
      const bfNow = getLockStatus();
      if (bfNow.locked) return { error: `Đăng nhập sai ${BF_MAX_ATTEMPTS} lần liên tiếp. Tài khoản bị khoá 5 phút.` };
      const attemptsLeft = BF_MAX_ATTEMPTS - bfNow.attempts;
      return null; // login fail — caller hiển thị lỗi chung, attemptsLeft dùng nếu muốn
    },
    verifyPasswordPublic: verifyPassword,
    getLockStatus,
    getRemainingAttempts() { const s = getLockStatus(); return s.locked ? 0 : BF_MAX_ATTEMPTS - s.attempts; },

    logout() {
      clearSession();
      clearTimeout(_autoLogoutTimer);
      clearTimeout(_autoLogoutWarningTimer);
      // Dừng realtime listeners và xóa sync queue pending khi đăng xuất
      if (window.CLOUD) { try { window.CLOUD.stopListeners(); } catch(e) {} }
      try { sessionStorage.removeItem('dtn_sync_queue'); } catch(e) {}
      // Dọn heartbeat interval + visibilitychange listener của session vừa đăng xuất
      // (nếu không, đăng nhập lại sẽ tạo bản mới trong khi bản cũ vẫn còn sống)
      try {
        if (typeof _hbIv !== 'undefined' && _hbIv) { clearInterval(_hbIv); _hbIv = null; }
        if (typeof _visibilityHandler !== 'undefined' && _visibilityHandler) {
          document.removeEventListener('visibilitychange', _visibilityHandler);
          _visibilityHandler = null;
        }
      } catch(e) {}
    },
    currentUser() { return getSession(); },
    isAdmin() { const u = getSession(); return u && u.role === 'admin'; },
    getAdminCred,

    // ── Đổi mật khẩu admin ────────────────────────────────────
    changeAdminPassword(oldPass, newPass) {
      const admin = getAdminCred();
      if (!admin) return false;
      if (!verifyPassword(oldPass, admin)) return false;
      if (!newPass || newPass.length < 6) return false;
      const hashed = hashPwSync(newPass, admin.username);
      const updated = new Date().toISOString();
      try { localStorage.setItem(ADMIN_KEY, JSON.stringify({ ...admin, password: hashed, hashed: true, _updated: updated })); } catch(e) {}
      // Sync lên cloud
      try {
        if (typeof CLOUD !== 'undefined' && CLOUD.getCfg().enabled && typeof firebase !== 'undefined' && firebase.apps.length) {
          const db = firebase.firestore();
          const shopId = CLOUD.getCfg().shopId || 'shop1';
          db.collection('shops').doc(shopId).collection('dtn_admin_cred').doc('admin_cred')
            .set({ id:'admin_cred', username: admin.username, password: hashed, hashed: true, _updated: updated }, { merge: true })
            .catch(e => console.warn('[AUTH] cloud push admin_cred error:', e));
        }
      } catch(e) {}
      return true;
    },
    changeAdminUsername(newUsername, password) {
      const admin = getAdminCred();
      if (!admin) return false;
      if (!verifyPassword(password, admin)) return false;
      if (!newUsername || !newUsername.trim()) return false;

      const trimmed = newUsername.trim();
      const updated = new Date().toISOString();

      // QUAN TRỌNG: username thay đổi → salt thay đổi → phải rehash password
      // với salt mới (makeSalt(trimmed)) để lần đăng nhập tiếp theo không bị vỡ
      const newHash = hashPwSync(password, trimmed);
      const newCred = { ...admin, username: trimmed, password: newHash, hashed: true, _updated: updated };

      try { localStorage.setItem(ADMIN_KEY, JSON.stringify(newCred)); } catch(e) {}
      const sess = getSession();
      if (sess && sess.role === 'admin') { sess.username = trimmed; setSession(sess); }

      // Sync lên cloud với hash mới
      try {
        if (typeof CLOUD !== 'undefined' && CLOUD.getCfg().enabled && typeof firebase !== 'undefined' && firebase.apps.length) {
          const db = firebase.firestore();
          const shopId = CLOUD.getCfg().shopId || 'shop1';
          db.collection('shops').doc(shopId).collection('dtn_admin_cred').doc('admin_cred')
            .set({ id:'admin_cred', username: trimmed, password: newHash, hashed: true, _updated: updated }, { merge: true })
            .catch(e => console.warn('[AUTH] cloud push admin_cred error:', e));
        }
      } catch(e) {}
      return true;
    },

    // ── Reset PIN flow ─────────────────────────────────────────
    generateResetPin,
    verifyResetPin,
    resetPasswordWithPin(pin, newPass) {
      if (!verifyResetPin(pin)) return false;
      if (!newPass || newPass.length < 6) return false;
      const admin = getAdminCred();
      if (!admin) return false;
      const hashed = hashPwSync(newPass, admin.username);
      saveAdminCred(admin.username, hashed, true);
      try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
      _sessionCache = null;
      return true;
    },

    // ── Staff management ───────────────────────────────────────
    getStaffAccounts,
    addStaff(username, password, displayName) {
      const list = getStaffAccounts();
      if (list.find(s => s.username === username)) return false;
      const admin = getAdminCred();
      if (admin && admin.username === username) return false;
      const hashed = hashPwSync(password, username);
      list.push({ id: 'st' + Date.now(), username, password: hashed, hashed: true, displayName: displayName || username, active: true, createdAt: new Date().toISOString() });
      saveStaffAccounts(list);
      try { if (typeof CLOUD !== 'undefined') CLOUD.push('dtn_staff_accounts', list); } catch(e) {}
      return true;
    },
    updateStaff(id, fields) {
      const list = getStaffAccounts();
      const idx = list.findIndex(s => s.id === id);
      if (idx < 0) return false;
      // Nếu update password → hash trước
      if (fields.password) { fields.password = hashPwSync(fields.password, list[idx].username); fields.hashed = true; }
      list[idx] = { ...list[idx], ...fields, _updated: new Date().toISOString() };
      saveStaffAccounts(list);
      try { if (typeof CLOUD !== 'undefined') CLOUD.push('dtn_staff_accounts', list); } catch(e) {}
      return true;
    },
    deleteStaff(id) {
      const now = new Date().toISOString();
      const all = getStaffAccounts();
      // Soft-delete: đánh dấu _deleted thay vì filter ngay, để cloud nhận lệnh xóa
      const withDeleted = all.map(s => s.id === id ? { ...s, _deleted: true, _updated: now } : s);
      const active = withDeleted.filter(s => !s._deleted);
      saveStaffAccounts(active);
      try { if (typeof CLOUD !== 'undefined') CLOUD.push('dtn_staff_accounts', withDeleted); } catch(e) {}
    },
    changeStaffPassword(id, oldPass, newPass) {
      const list = getStaffAccounts();
      const s = list.find(x => x.id === id);
      if (!s) return false;
      if (!verifyPassword(oldPass, s)) return false;
      s.password = hashPwSync(newPass, s.username);
      s.hashed = true;
      saveStaffAccounts(list);
      return true;
    }
  };
})();

  let successMsg = '';
  let showReset = false;
  let resetStep = 1;

  function getAdminUsername() {

  }

  function render() {
