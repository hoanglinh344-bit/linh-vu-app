  // ── Ảnh sản phẩm ──────────────────────────────────────────
  // _origImagePath: path ảnh ĐANG được lưu chính thức khi mở form này — nếu
  // người dùng bấm "Huỷ", path này KHÔNG bao giờ bị xoá trên Storage (chỉ xoá
  // khi bấm "Lưu" thành công thật và ảnh đã thay đổi).
  // _uploadedPathsThisSession: các ảnh MỚI upload trong lần sửa này nhưng
  // cuối cùng không được giữ lại (bị thay tiếp hoặc Huỷ) — cần dọn rác.
  const _origImagePath = f.imagePath || '';
  let _uploadedPathsThisSession = [];

  const imgPreviewEl = document.createElement('div');
  imgPreviewEl.style.cssText = 'margin-top:8px;display:' + (f.image ? 'block' : 'none');
  if (f.image) {
    const imgEl = document.createElement('img');
    imgEl.src = f.image; imgEl.style.cssText = 'max-width:100%;max-height:120px;border-radius:6px;border:1px solid var(--border2);object-fit:cover';
    imgPreviewEl.appendChild(imgEl);
  }

  function _renderImgPreview() {
    imgPreviewEl.style.display = f.image ? 'block' : 'none';
    imgPreviewEl.innerHTML = '';
    if (!f.image) return;
    const imgEl = document.createElement('img');
    imgEl.src = f.image; imgEl.style.cssText = 'max-width:100%;max-height:120px;border-radius:6px;border:1px solid var(--border2);object-fit:cover';
    imgPreviewEl.appendChild(imgEl);
    const rmBtn = document.createElement('button');
    rmBtn.textContent = '✕ Xoá ảnh'; rmBtn.className = 'btn btn-xs btn-ghost';
    rmBtn.style.marginTop = '6px'; rmBtn.style.display = 'block';
    rmBtn.onclick = function(){
      const oldPath = f.imagePath;
      f.image = ''; f.imagePath = '';
      imgFileInput.value = '';
      _renderImgPreview();
      // Chỉ xoá ngay trên Storage nếu đây là ảnh MỚI upload trong session này
      // (chưa lưu nên không ai khác đang tham chiếu). Ảnh GỐC đã lưu thì để
      // nguyên — sẽ chỉ bị xoá thật khi bấm "Lưu" thành công bên dưới.
      if (oldPath && oldPath !== _origImagePath && CLOUD.isOnline()) {
        CLOUD.deleteImageFromStorage(oldPath);
        _uploadedPathsThisSession = _uploadedPathsThisSession.filter(p => p !== oldPath);
      }
    };
    imgPreviewEl.appendChild(rmBtn);
  }

  const imgFileInput = document.createElement('input');
  imgFileInput.type = 'file'; imgFileInput.accept = 'image/*'; imgFileInput.style.display = 'none';
  imgFileInput.addEventListener('change', function(){
    const file = this.files[0];
    if (!file) return;
    // Kích thước thực lưu sẽ được nén nhỏ lại bên dưới, không phụ thuộc nhiều vào size file gốc.
    if (file.size > 12 * 1024 * 1024) { alert('Ảnh quá lớn! Vui lòng chọn ảnh dưới 12MB.'); return; }

    // ⚠️ STORAGE_FEATURE_ENABLED = false: project hiện đang ở gói Spark (miễn phí),
    // chưa có bucket Storage thật nào tồn tại. Để false để LUÔN dùng cách nén
    // base64 lưu thẳng vào Firestore (100% miễn phí, đã test ổn định). Nếu
    // sau này nâng cấp Blaze + tạo Storage bucket xong xuôi, đổi thành true
    // (và CLOUD.uploadImageToStorage/_compressImageToBlob đã có sẵn, không cần viết lại).
    const STORAGE_FEATURE_ENABLED = false;
    const useStorage = STORAGE_FEATURE_ENABLED && CLOUD.isOnline() && CLOUD.hasStorage();
    imgPickBtn.disabled = true;
    imgPickBtn.innerHTML = useStorage ? '⏳ Đang tải ảnh lên...' : '⏳ Đang xử lý ảnh...';

    const finishUI = () => { imgPickBtn.disabled = false; imgPickBtn.innerHTML = '📷 ' + (f.image ? 'Đổi ảnh' : 'Chọn ảnh sản phẩm'); };

    if (useStorage) {
      // ── Đường chính: nén thành Blob → upload Firebase Storage → lưu URL ──
      _compressImageToBlob(file, function(blob){
        if (!blob) { finishUI(); alert('Không đọc được ảnh này, vui lòng thử ảnh khác.'); return; }
        const path = 'product_images/' + f.id + '/' + Date.now() + '.jpg';
        CLOUD.uploadImageToStorage(path, blob).then(function(url){
          finishUI();
          if (!url) {
            alert('Tải ảnh lên Firebase Storage thất bại (kiểm tra mạng/Storage Rules). Ảnh chưa được lưu, vui lòng thử lại.');
            return;
          }
          const oldPath = f.imagePath;
          f.image = url;
          f.imagePath = path;
          _uploadedPathsThisSession.push(path);
          imgFileInput.value = '';
          _renderImgPreview();
          // Nếu ảnh vừa bị thay là ảnh MỚI của chính session này (không phải
          // ảnh gốc đã lưu) → dọn ngay, tránh tích rác khi đổi ảnh nhiều lần.
          if (oldPath && oldPath !== _origImagePath) {
            CLOUD.deleteImageFromStorage(oldPath);
            _uploadedPathsThisSession = _uploadedPathsThisSession.filter(p => p !== oldPath);
          }
        });
      });
    } else {
      // ── Đường hiện tại (Storage đang tắt / project ở gói Spark miễn phí):
      // nén ảnh thành base64 nhỏ, lưu thẳng vào Firestore — không cần
      // Firebase Storage, không tốn phí. Nếu sau này nâng cấp Blaze + bật
      // STORAGE_FEATURE_ENABLED = true, ảnh mới chọn sẽ tự chuyển qua Storage.
      _compressImageForFirestore(file, function(dataUrl){
        finishUI();
        if (!dataUrl) { alert('Không đọc được ảnh này, vui lòng thử ảnh khác.'); return; }
        f.image = dataUrl;
        f.imagePath = ''; // không dùng Storage nên không có path
        imgFileInput.value = '';
        _renderImgPreview();
      });
    }
  });

  const imgPickBtn = document.createElement('button');
  imgPickBtn.type = 'button'; imgPickBtn.className = 'btn btn-sm';
  imgPickBtn.style.cssText = 'margin-top:6px;';
  imgPickBtn.innerHTML = '📷 ' + (f.image ? 'Đổi ảnh' : 'Chọn ảnh sản phẩm');
  imgPickBtn.onclick = function(){ imgFileInput.click(); };

  // Gắn nút xoá ảnh ban đầu (nếu đang có ảnh) qua cùng hàm render dùng chung

    } else {
      skuStatusEl.innerHTML = '<span style="color:var(--green)">✓ Mã <b>' + escHtml(val) + '</b> hợp lệ</span>';
    }
  }
  updateSkuStatus();
  inpSku.addEventListener('input', function() {
    f.sku = this.value.trim().toLowerCase().replace(/\s+/g,'');
    this.value = f.sku; // force lowercase
    updateSkuStatus();
  });

  // Nút "Tạo lại SKU" dựa theo tên
  const genSkuBtn = document.createElement('button');
  genSkuBtn.type = 'button';
  genSkuBtn.className = 'btn btn-ghost btn-xs';
  genSkuBtn.style.cssText = 'margin-top:6px;font-size:11px';
  genSkuBtn.innerHTML = '🔄 Tạo lại từ tên';
  genSkuBtn.onclick = function() {
    const newSku = generateSKU(inpName.value.trim() || f.name, S.products, prod ? prod.id : null);
    inpSku.value = newSku;
    f.sku = newSku;
    updateSkuStatus();
  };

  // Auto-generate SKU khi tên thay đổi (chỉ khi tạo mới VÀ chưa sửa thủ công)
  let skuAutoMode = !prod; // true = auto (sản phẩm mới chưa sửa tay)
  inpSku.addEventListener('focus', () => { skuAutoMode = false; }); // user chủ động sửa → tắt auto
  inpName.addEventListener('input', function() {

      inpSku.value = newSku;
      f.sku = newSku;

  const skuWrap = document.createElement('div');
  skuWrap.className = 'form-group';
  const skuLabel = document.createElement('label');
  skuLabel.className = 'form-label';
  skuLabel.innerHTML = '🏷️ Mã SKU sản phẩm <span style="color:var(--red)">*</span> <span style="font-size:10px;color:var(--text3);font-weight:400">(tự động tạo, có thể sửa)</span>';
  skuWrap.appendChild(skuLabel);
  skuWrap.appendChild(inpSku);
  skuWrap.appendChild(skuStatusEl);
  skuWrap.appendChild(genSkuBtn);

  // ── Mã QR ─────────────────────────────────────────────────
  const inpQrCode = mkInput('text', 'Nhập mã QR / barcode sản phẩm...', f.qrCode || '', v => { f.qrCode = v; });

  // QR preview box
  const qrPreviewEl = document.createElement('div');
  qrPreviewEl.style.cssText = 'margin-top:8px;padding:10px;background:var(--bg4);border-radius:6px;border:1px solid var(--border);font-size:12px;color:var(--text2);display:' + (f.qrCode ? 'block' : 'none');
  if (f.qrCode) {
    qrPreviewEl.innerHTML = '📱 Mã: <b style="color:var(--accent)">' + escHtml(f.qrCode) + '</b> — có thể quét QR để chọn sản phẩm tại mục Bán hàng';
  }
  inpQrCode.addEventListener('input', function(){
    if (inpQrCode.value.trim()) {
      qrPreviewEl.style.display = 'block';
      qrPreviewEl.innerHTML = '📱 Mã: <b style="color:var(--accent)">' + escHtml(inpQrCode.value.trim()) + '</b> — có thể quét QR để chọn sản phẩm tại mục Bán hàng';

  const qrWrap = document.createElement('div');
  qrWrap.className = 'form-group';
  const qrLabel = document.createElement('label'); qrLabel.className = 'form-label'; qrLabel.textContent = '📱 Mã QR / Barcode (để quét tại Bán hàng)';
  qrWrap.appendChild(qrLabel);
  qrWrap.appendChild(inpQrCode);
  qrWrap.appendChild(qrPreviewEl);

  // Preview lợi nhuận — cập nhật text trực tiếp không re-render (v3.7.0)
  const previewEl = document.createElement('div');
  previewEl.style.cssText = 'grid-column:1/-1;background:var(--bg3);border-radius:var(--r2);padding:10px 14px;font-size:13px;display:none';
  function updatePreview() {
    const bp = parseFloat(inpBuy.value)||0, sp = parseFloat(inpSell.value)||0, unit = selUnit.value;
    if (bp > 0 && sp > 0) {
      const lnAmt = sp - bp;
      const lnPct = ((lnAmt)/bp*100).toFixed(1);
      // Ghi chú: giá nhập và giá bán trong kho là giá gốc (chưa quyết định VAT)
      // VAT được xác định khi tạo phiếu nhập/bán → LN thực tế tính tại Dashboard
      previewEl.innerHTML = 'Chênh lệch giá: <span class="profit-pct">+' + lnPct + '%</span> = <span style="color:var(--green)">' + fmt(lnAmt) + 'đ / ' + unit + '</span>' +
        ' <span style="font-size:10px;color:var(--text3)">(chưa tính VAT · xem LN thực tại Tổng Quan)</span>';
      previewEl.style.display = '';
    } else { previewEl.style.display = 'none'; }
  }
  updatePreview();

  updateVariantVisibility();

  S.modal = {
    title: prod ? 'Cập nhật sản phẩm' : 'Thêm sản phẩm mới',
    content: h('div', { className: 'fg fg2' },
      fg('Tên sản phẩm *', true, inpName),
      skuWrap,
      fg('Loại đá *',      null, selType),
      fg('Xuất xứ',        null, inpOrigin),
      fg('Đơn vị tính',    null, selUnit),
      fg('Tồn kho ban đầu (m² hoặc tổng)',null, inpStock),
      fg('Giá nhập mặc định (VNĐ)', null, inpBuy),
      h('div', { className: 'form-group fg-full', style: { marginTop: -8 } },
        h('div', { style: { fontSize: 11, color: 'var(--accent)', padding: '6px 10px', background: 'rgba(201,168,76,.07)', borderRadius: 'var(--r2)', border: '1px solid rgba(201,168,76,.2)' } },
          '💡 Giá nhập có thể để 0 — sẽ tự cập nhật theo giá nhập mới nhất khi tạo phiếu nhập hàng. Giá trị tồn = Tồn kho × Giá nhập mới nhất.'
        )
      ),
      fg('Giá bán mặc định (VNĐ) *',  null, inpSell),
      fg('Mô tả',          true, taDesc),
      qrWrap,
      imgWrap,
      previewEl,
      dimSectionWrap,
      variantsSectionWrap
    ),
    footer: [
      h('button', { className: 'btn', onClick: () => {
        // Dọn các ảnh MỚI đã upload trong lần sửa này nhưng không được lưu
        // (vd: chọn ảnh rồi đổi ý bấm Huỷ) — tránh tích rác trên Storage.
        // Ảnh GỐC (_origImagePath) không nằm trong danh sách này nên luôn an toàn.
        _uploadedPathsThisSession.forEach(p => CLOUD.deleteImageFromStorage(p));
        S.modal = null; render();
      } }, 'Huỷ'),
      h('button', { className: 'btn btn-primary', onClick: () => {
        const nm = inpName.value.trim();
        const bp = inpBuy.value, sp = inpSell.value;
        if (!nm || !sp) { toast('Vui lòng điền tên sản phẩm và giá bán!', 'error'); return; }
        // Validate SKU
        const skuVal = (inpSku.value || '').trim().toLowerCase();
        if (!skuVal) { toast('⚠️ Vui lòng nhập mã SKU sản phẩm!', 'error'); inpSku.focus(); return; }
        const skuDup = (S.products || []).find(p => p.sku && p.sku.toLowerCase() === skuVal && p.id !== (prod ? prod.id : '__new__'));
        if (skuDup) { toast('⚠️ Mã SKU "' + skuVal + '" đã tồn tại! Vui lòng dùng mã khác.', 'error'); inpSku.focus(); return; }
        // Validate variants
        for (const vt of f.variants) {
          if (!vt.tileW || !vt.tileH || vt.tileW <= 0 || vt.tileH <= 0) {
            toast('⚠️ Vui lòng nhập kích thước (rộng × dài) cho tất cả quy cách!', 'error'); return;
          }
        }
        const p = { name: nm, sku: skuVal, type: selType.value, origin: inpOrigin.value.trim(),
          unit: selUnit.value, stock: parseFloat(inpStock.value)||0,
          buyPrice: parseFloat(bp)||0, sellPrice: parseFloat(sp)||0,
          description: taDesc.value.trim(),
          image: f.image || '',
          imagePath: f.imagePath || '', // path file ảnh trên Firebase Storage (rỗng nếu ảnh base64 cũ / không có ảnh)
          qrCode: inpQrCode.value.trim(),
          thickness: f.thickness || 0,
          length: f.length || 0,
          width: f.width || 0,
          multiVariant: f.multiVariant,
          variants: f.multiVariant ? f.variants : [] };
        const nowIso = new Date().toISOString();
        if (prod) { S.products = S.products.map(x => x.id === prod.id ? { ...x, ...p, _updated: nowIso } : x); toast('Đã cập nhật sản phẩm', 'success'); }
        else { S.products = [...S.products, { ...p, id: f.id, createdAt: nowIso, _updated: nowIso, _stockTx: [] }]; toast('Đã thêm sản phẩm mới', 'success'); }
        // Lưu thành công thật → giờ mới xoá ảnh GỐC cũ trên Storage nếu ảnh đã đổi/bị xoá
        // (trước lúc này ảnh gốc luôn được giữ nguyên, phòng trường hợp người dùng bấm Huỷ)
        if (_origImagePath && _origImagePath !== p.imagePath) {
          CLOUD.deleteImageFromStorage(_origImagePath);
        }
        // Ảnh bị gỡ khỏi sản phẩm → xoá khỏi IndexedDB để rehydrate không hồi sinh ảnh cũ
        try { if (typeof IMG !== 'undefined' && !p.image) IMG.del(prod ? prod.id : f.id); } catch(e) {}
        save('products'); S.modal = null; rebuild(); render();
      } }, '💾 Lưu')
    ]
  };
  _raf = false; render();
}

// ── IMPORTS ───────────────────────────────────────────────────
function openImportWithProduct(prod, rebuild) {
  // Mở form nhập hàng với sản phẩm đã được chọn sẵn
  const fakeItem = { id: 'tmp', productId: prod.id, variantId: '', qty: '', price: prod.buyPrice || '', vatRate: 0, _vtSelId: '' };
  const existing = null;
  openImport(existing, rebuild, prod);
}

function pgImports() {
  const wrap = h('div', {});
  let search = '';
  let viewMode = 'day';
  const expandedDays = new Set();

  const rebuild = () => {
    const { imports } = S;
    const filtered = imports.filter(i =>
      (i.supplier||'').toLowerCase().includes(search.toLowerCase()) ||
      (i.productName||'').toLowerCase().includes(search.toLowerCase())
    ).sort((a, b) => b.date.localeCompare(a.date));

    const totalDebt = imports.filter(i => i.status === 'debt').reduce((a, i) => a + (i.total - i.paid), 0);
    const importsWithVat = imports.filter(i => (i.vatRate || 0) > 0);
    const totalShipCost = imports.reduce((a, i) => a + (i.shipFee || 0), 0);

    // ── Nhóm theo ngày ──
    function buildDayGroups(rows) {
      const map = {};
      rows.forEach(i => {
        const d = i.date || '0000-00-00';
        if (!map[d]) map[d] = { date: d, items: [], total: 0, paid: 0 };
        map[d].items.push(i);
        map[d].total += i.total || 0;
        map[d].paid  += i.paid  || 0;
      });
      return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
    }

    // ── Render 1 dòng import ──
    function renderIRow(i) {
      return h('tr', {},
        h('td', { style: { color: 'var(--text2)', fontSize: 12 } }, fmtD(i.date)),
        h('td', { style: { fontWeight: 600 } }, i.supplier),
        h('td', {},
          h('div', {}, i.productName),
          i.variantId && (() => {
            const prod = S.products.find(p => p.id === i.productId);
            const vt = prod && prod.variants && prod.variants.find(v => v.id === i.variantId);
            return vt ? h('div', { style:{fontSize:10,color:'var(--accent)',marginTop:2} }, '📐 ' + vt.tileW+'×'+vt.tileH+(vt.tileThickness?'×'+vt.tileThickness:'')+' cm') : null;
          })()
        ),
        h('td', {}, fmtQty(i.qty) + ' ' + i.unit),
        h('td', {}, fmt(i.unitPrice) + 'đ'),
        h('td', {},
          (i.vatRate||0) > 0
            ? h('span', { className: 'badge badge-blue' }, i.vatRate + '%')
            : h('span', { className: 'badge', style: { background:'rgba(92,88,80,.15)',color:'var(--text3)',border:'1px solid rgba(92,88,80,.3)' } }, 'KT')
        ),
        h('td', {},
          (i.shipFee || 0) > 0
            ? h('span', { style: { color:'var(--amber)',fontWeight:600 } }, fmt(i.shipFee) + 'đ' + (i.shipUnit ? ' / ' + i.shipUnit : ''))
            : h('span', { style: { color:'var(--text3)' } }, '—')
        ),
        h('td', {},
          (i.shipFee || 0) > 0
            ? ((i.shipVatRate || 0) > 0
                ? h('span', { className: 'badge badge-blue' }, i.shipVatRate + '%')
                : h('span', { className: 'badge', style: { background:'rgba(92,88,80,.15)',color:'var(--text3)',border:'1px solid rgba(92,88,80,.3)' } }, 'KT'))
            : h('span', { style: { color:'var(--text3)' } }, '—')
        ),
        h('td', { style: { fontWeight: 600 } }, fmt(i.total) + 'đ'),
        h('td', { style: { color: 'var(--green)' } }, fmt(i.paid) + 'đ'),
        h('td', { className: 'amount-neg' }, i.status === 'debt' ? fmt(i.total - i.paid) + 'đ' : '—'),
        h('td', {}, h('span', { className: 'badge badge-' + (i.status === 'paid' ? 'green' : 'amber') }, i.status === 'paid' ? 'Đã TT' : 'Còn nợ')),
        h('td', {}, h('div', { style: { display: 'flex', gap: 4 } },
          h('button', {
            className: 'btn btn-xs', style: { background:'var(--blue)',color:'#fff',border:'none' },
            onClick: () => openImport({ ...i }, rebuild)
          }, '✏️'),
          i.status === 'debt' && h('button', {
            className: 'btn btn-xs', style: { background:'var(--green)',color:'#fff',border:'none' },
            onClick: () => { S.imports = S.imports.map(x => x.id === i.id ? { ...x, paid: x.total, status: 'paid', _updated: new Date().toISOString() } : x); save('imports'); toast('Đã thanh toán NCC', 'success'); rebuild(); }
          }, '✓ TT'),
          h('button', {
            className: 'btn btn-ghost btn-xs',
            onClick: () => {
              S.confirm = { msg: 'Xoá phiếu nhập "' + i.productName + '" từ ' + i.supplier + '? Tồn kho sẽ được trừ lại.', onYes: () => {
                if (i.qty > 0) {
                  S.products = S.products.map(p => {
                    if (p.id !== i.productId) return p;
                    const newStock = (parseFloat(p.stock)||0) - i.qty;
                    const newVariants = (p.variants || []).map(vt => {
                      if (!i.variantId || vt.id !== i.variantId) return vt;
                      const ppm2 = (vt.tileW > 0 && vt.tileH > 0) ? 10000 / (vt.tileW * vt.tileH) : 0;
                      const newM2 = (vt.stockM2 || 0) - i.qty;
                      return { ...vt, stockM2: newM2, stockPieces: ppm2 > 0 ? Math.round(newM2 * ppm2) : (vt.stockPieces || 0) - Math.round(i.qty * (ppm2 || 0)) };
                    });
                    // GIỮ i.id trong _stockTx — tombstone để không double-apply nếu cần
                    return { ...p, stock: newStock, variants: newVariants, _updated: new Date().toISOString() };
                  });
                }
                // softDelete TRƯỚC save(products): đảm bảo import._deleted lên Firebase
                // trước khi product (stock mới) lên → listener không bị nhầm lẫn thứ tự
                softDelete('imports', i.id, () => {});
                save('products');
                toast('Đã xoá phiếu nhập · Kho đã trừ lại ' + fmtQty(i.qty) + ' ' + i.unit, 'info'); rebuild();
              } };
              render();
            }
          }, '🗑')
        ))
      );
    }

    // ── View: Danh sách (table) ──
    function renderListView() {
      return h('div', { className: 'table-wrap' },
        h('table', {},
          h('thead', {}, h('tr', {},
            th('Ngày'), th('Nhà cung cấp'), th('Sản phẩm'), th('SL'), th('Đơn giá'), th('VAT HH'), th('Phí VC'), th('VAT VC'), th('Tổng'), th('Đã TT'), th('Còn nợ'), th('TT'), th('')
          )),
          h('tbody', {},
            ...filtered.map(i => renderIRow(i)),
            filtered.length === 0 && h('tr', {}, h('td', { colspan: 13, style: { textAlign:'center',padding:32,color:'var(--text3)' } }, 'Không có phiếu nhập'))
          )
        )
      );
    }

    // ── View: Theo ngày (accordion) ──
    function renderDayView() {
      const groups = buildDayGroups(filtered);
      if (groups.length === 0) return h('div', { className: 'empty' },
        h('div', { className: 'empty-icon' }, '📦'), h('div', {}, 'Không có phiếu nhập'));

      return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
        ...groups.map(grp => {
          const dayKey = 'imp_' + grp.date;
          const isOpen = expandedDays.has(dayKey);
          const debt = grp.total - grp.paid;
          return h('div', { style: { background: 'var(--bg2)', border: '1px solid var(--border)', borderRadius: 'var(--r)', overflow: 'hidden' } },
            h('div', {
              style: { display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 16px', cursor:'pointer', userSelect:'none', background: isOpen ? 'var(--bg3)' : '' },
              onClick: () => { if (isOpen) expandedDays.delete(dayKey); else expandedDays.add(dayKey); rebuild(); }
            },
              h('div', { style: { display:'flex', alignItems:'center', gap:12 } },
                h('span', { style: { fontSize:16, color:'var(--accent)', lineHeight:1, transition:'transform .2s', display:'inline-block', transform: isOpen ? 'rotate(90deg)' : 'rotate(0deg)' } }, '▶'),
                h('div', {},
                  h('div', { style: { fontWeight:700, fontSize:14, color:'var(--text)' } }, fmtD(grp.date)),
                  h('div', { style: { fontSize:11, color:'var(--text2)', marginTop:2 } }, grp.items.length + ' phiếu nhập')
                )
              ),
              h('div', { style: { display:'flex', gap:14, alignItems:'center', flexWrap:'wrap' } },
                h('div', { style: { textAlign:'right' } },
                  h('div', { style: { fontSize:10, color:'var(--text3)', textTransform:'uppercase', letterSpacing:'.5px' } }, 'Tổng'),
                  h('div', { style: { fontWeight:700, color:'var(--text)', fontSize:13 } }, fmt(grp.total) + 'đ')
                ),
                h('div', { style: { textAlign:'right' } },
                  h('div', { style: { fontSize:10, color:'var(--text3)', textTransform:'uppercase', letterSpacing:'.5px' } }, 'Đã TT'),
                  h('div', { style: { fontWeight:700, color:'var(--green)', fontSize:13 } }, fmt(grp.paid) + 'đ')
                ),
                debt > 0 && h('div', { style: { textAlign:'right' } },
                  h('div', { style: { fontSize:10, color:'var(--text3)', textTransform:'uppercase', letterSpacing:'.5px' } }, 'Còn nợ'),
                  h('div', { style: { fontWeight:700, color:'var(--red)', fontSize:13 } }, fmt(debt) + 'đ')
                ),
                h('span', { style: { fontSize:18, color:'var(--text3)' } }, isOpen ? '−' : '+')
              )
            ),
            isOpen && h('div', { style: { borderTop:'1px solid var(--border)', overflowX:'auto' } },
              h('table', { style: { width:'100%', borderCollapse:'collapse', fontSize:13, minWidth:700 } },
                h('thead', {}, h('tr', {},
                  th('Ngày'), th('Nhà cung cấp'), th('Sản phẩm'), th('SL'), th('Đơn giá'), th('VAT HH'), th('Phí VC'), th('VAT VC'), th('Tổng'), th('Đã TT'), th('Còn nợ'), th('TT'), th('')
                )),
                h('tbody', {}, ...grp.items.map(i => renderIRow(i)))
              )
            )
          );
        })
      );
    }

    // ── Main render ──
    wrap.innerHTML = '';
    const viewToggle = h('div', { style: { display:'flex', gap:6 } },
      h('button', { className:'btn btn-sm' + (viewMode === 'day' ? ' btn-primary' : ''), onClick: () => { viewMode = 'day'; rebuild(); } }, '📅 Theo ngày'),
      h('button', { className:'btn btn-sm' + (viewMode === 'list' ? ' btn-primary' : ''), onClick: () => { viewMode = 'list'; rebuild(); } }, '☰ Danh sách')
    );

    const contentEl = viewMode === 'day' ? renderDayView() : renderListView();

    // ── Lưới sản phẩm để tạo phiếu nhập nhanh ───────────────────
    const allProdsForImport = S.products.filter(p => !p._deleted);
    const quickImportSection = (() => {
      if (allProdsForImport.length === 0) return null;
      const sec = document.createElement('div');
      sec.className = 'card';
      sec.style.marginBottom = '14px';

      sec.innerHTML = `
        <div style="font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px">📦 Nhập Hàng Nhanh Theo Sản Phẩm</div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:14px">Nhấn vào sản phẩm để tạo phiếu nhập — tên sản phẩm đã được điền sẵn</div>
      `;

      const grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px';

      allProdsForImport.forEach(p => {
        const card = document.createElement('div');
        card.style.cssText = 'background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:6px';
        card.onmouseover = () => { card.style.borderColor = 'var(--accent)'; card.style.background = 'var(--bg4)'; };
        card.onmouseout  = () => { card.style.borderColor = 'var(--border2)'; card.style.background = 'var(--bg3)'; };

        const nm = document.createElement('div');
        nm.style.cssText = 'font-size:13px;font-weight:700;color:var(--text);line-height:1.3';
        nm.textContent = p.name;

        const meta = document.createElement('div');
        meta.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap';

        const stockBadge = document.createElement('span');
        const stk = parseFloat(p.stock) || 0;
        stockBadge.style.cssText = 'font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;' +
          (stk > 10 ? 'background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.3)'
                    : stk > 0 ? 'background:rgba(232,165,58,.15);color:var(--amber);border:1px solid rgba(232,165,58,.3)'
                               : 'background:rgba(224,92,92,.15);color:var(--red);border:1px solid rgba(224,92,92,.3)');
        stockBadge.textContent = 'Tồn: ' + fmtQty(stk) + ' ' + p.unit;

        const typeTag = document.createElement('span');
        typeTag.style.cssText = 'font-size:10px;color:var(--text3);background:var(--bg4);border-radius:99px;padding:2px 7px;border:1px solid var(--border)';
        typeTag.textContent = p.type || '';

        meta.appendChild(stockBadge);
        if (p.type) meta.appendChild(typeTag);

        const btnRow = document.createElement('div');
        btnRow.style.cssText = 'margin-top:4px';
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary btn-xs';
        btn.style.cssText = 'width:100%;justify-content:center;font-size:11px';
        btn.textContent = '📥 Tạo phiếu nhập';
        btn.onclick = (e2) => { e2.stopPropagation(); openImport(null, rebuild, p); };
        btnRow.appendChild(btn);

        card.appendChild(nm);
        card.appendChild(meta);
        card.appendChild(btnRow);
        card.addEventListener('click', () => openImport(null, rebuild, p));
        grid.appendChild(card);
      });

      sec.appendChild(grid);
      return sec;
    })();

    wrap.appendChild(h('div', {},
      h('div', { className: 'page-header' },
        h('div', {},
          h('div', { className: 'page-title' }, 'Nhập Hàng'),
          h('div', { className: 'page-sub' },
            imports.length + ' phiếu · Nợ NCC: ' + fmt(totalDebt) + 'đ' +
            (totalShipCost > 0 ? ' · VC nhập: ' + fmt(totalShipCost) + 'đ' : '') +
            (importsWithVat.length > 0 ? ' · ' + importsWithVat.length + ' phiếu có VAT' : ''))
        ),
        h('div', { style: { display:'flex', gap:8, flexWrap:'wrap', alignItems:'center' } },
          viewToggle,
          h('button', { className: 'btn btn-primary', onClick: () => openImport(null, rebuild) }, '+ Tạo phiếu nhập')
        )
      ),
      importsWithVat.length > 0 && h('div', { style: { background:'rgba(91,143,232,.08)',border:'1px solid rgba(91,143,232,.3)',borderRadius:'var(--r2)',padding:'10px 14px',marginBottom:14,fontSize:12,color:'var(--blue)' } },
        '💡 Có ' + importsWithVat.length + ' phiếu nhập có VAT — hệ thống tự động tách VAT ra khỏi giá vốn khi tính lợi nhuận. "KT" = không có VAT.'
      ),
      quickImportSection,
      inp('text', '🔍 Tìm nhà cung cấp, sản phẩm...', search, v => { search = v; rebuild(); }, { style: { marginBottom: 14 } }),
      contentEl
    ));
  };
  rebuild();
  return wrap;
}

// ── Helper tạo VAT slider row — mặc định không có VAT, checkbox để bật ──
function mkVatRow(initVal, onChange) {
  const hasVatInit = (parseFloat(initVal) || 0) > 0;
  const wrapper = document.createElement('div');

  // Checkbox toggle
  const chkRow = document.createElement('div');
  chkRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px';
  const chk = document.createElement('input');
  chk.type = 'checkbox'; chk.id = 'vatchk_' + Math.random().toString(36).slice(2,7);
  chk.checked = hasVatInit;
  chk.style.cssText = 'width:16px;height:16px;cursor:pointer;accent-color:var(--accent)';
  const chkLbl = document.createElement('label');
  chkLbl.htmlFor = chk.id;
  chkLbl.style.cssText = 'font-size:12px;color:var(--text2);cursor:pointer;user-select:none';
  chkLbl.textContent = 'Đơn hàng có VAT';
  chkRow.appendChild(chk); chkRow.appendChild(chkLbl);
  wrapper.appendChild(chkRow);

  const vatControls = document.createElement('div');
  vatControls.style.display = hasVatInit ? '' : 'none';

  const numEl = document.createElement('input');
  numEl.type = 'number'; numEl.min = '0'; numEl.max = '20'; numEl.step = '0.5';
  numEl.setAttribute('inputmode','decimal');
  numEl.value = hasVatInit ? (parseFloat(initVal)||0) : 0; numEl.className = 'form-input';
  numEl.style.cssText = 'width:80px;flex-shrink:0';
  const slider = document.createElement('input');
  slider.type = 'range'; slider.min = '0'; slider.max = '20'; slider.step = '0.5';
  slider.value = hasVatInit ? (parseFloat(initVal)||0) : 0; slider.className = 'vat-slider';
  const badge = document.createElement('div');
  badge.className = 'vat-badge'; badge.textContent = (hasVatInit ? (parseFloat(initVal)||0) : 0) + '%';
  slider.addEventListener('input', e => { numEl.value = e.target.value; badge.textContent = e.target.value + '%'; onChange(parseFloat(e.target.value)||0); });
  numEl.addEventListener('input', e => { const v = Math.min(20, Math.max(0, parseFloat(e.target.value)||0)); slider.value = v; badge.textContent = v + '%'; onChange(v); });

  chk.addEventListener('change', () => {
    vatControls.style.display = chk.checked ? '' : 'none';
    if (!chk.checked) { numEl.value = 0; slider.value = 0; badge.textContent = '0%'; onChange(0); }
  });

  const row = document.createElement('div');
  row.className = 'vat-row';
  row.appendChild(numEl); row.appendChild(slider); row.appendChild(badge);
  row._setVal = (v) => { numEl.value = v; slider.value = v; badge.textContent = v + '%'; };
  row._getVal = () => chk.checked ? (parseFloat(numEl.value)||0) : 0;
  vatControls.appendChild(row);
  wrapper.appendChild(vatControls);
  wrapper._getVal = () => chk.checked ? (parseFloat(numEl.value)||0) : 0;
  wrapper._setVal = (v) => {
    const fv = parseFloat(v)||0;
    chk.checked = fv > 0;
    vatControls.style.display = fv > 0 ? '' : 'none';
    numEl.value = fv; slider.value = fv; badge.textContent = fv + '%';
  };
  return wrapper;
}

// ── Widget tìm kiếm sản phẩm nhanh cho phiếu nhập ────────────────
function makeProdSearchWidget(products, initProductId, onSelect) {
  const wrap = document.createElement('div');
  wrap.className = 'prod-search-wrap';

  // Input tìm kiếm
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'prod-search-inp';
  inp.placeholder = '🔍 Gõ tên sản phẩm để tìm nhanh...';
  inp.autocomplete = 'off';
  inp.setAttribute('autocorrect', 'off');
  inp.setAttribute('autocapitalize', 'off');
  inp.setAttribute('spellcheck', 'false');

  // Dropdown kết quả
  const drop = document.createElement('div');
  drop.className = 'prod-search-drop';

  // Badge hiển thị sản phẩm đã chọn
  const badge = document.createElement('div');
  badge.className = 'prod-selected-badge';
  badge.style.display = 'none';

  wrap.appendChild(inp);
  wrap.appendChild(drop);
  wrap.appendChild(badge);

  let selectedId = initProductId || '';
  let activeIdx = -1;
  let dropItems = [];

  function showBadge(prod) {
    if (!prod) { badge.style.display = 'none'; return; }
    badge.innerHTML = '';
    const txt = document.createElement('span');
    txt.textContent = '✅ ' + prod.name + (prod.sku ? ' [' + prod.sku + ']' : '') + ' — Tồn: ' + (parseFloat(prod.stock)||0) + ' ' + prod.unit;
    const clrBtn = document.createElement('button');
    clrBtn.type = 'button';
    clrBtn.title = 'Xoá chọn';
    clrBtn.textContent = '✕';
    clrBtn.onclick = (e) => {
      e.stopPropagation();
      selectedId = '';
      inp.value = '';
      badge.style.display = 'none';
      inp.style.display = '';
      onSelect('');
      inp.focus();
    };
    badge.appendChild(txt);
    badge.appendChild(clrBtn);
    badge.style.display = 'flex';
    inp.style.display = 'none';
  }

  // Init nếu đã có sản phẩm chọn sẵn
  if (selectedId) {
    const initProd = products.find(p => p.id === selectedId);
    if (initProd) showBadge(initProd);
  }

  function renderDrop(query) {
    drop.innerHTML = '';
    activeIdx = -1;
    const q = query.trim().toLowerCase();
    if (!q) { drop.classList.remove('show'); return; }
    const matches = products.filter(p => {
      const haystack = (p.name + ' ' + (p.sku || '') + ' ' + (p.type || '')).toLowerCase();
      return haystack.includes(q);
    }).slice(0, 20);
    dropItems = matches;
    if (matches.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'prod-search-item-empty';
      empty.textContent = 'Không tìm thấy sản phẩm "' + query + '"';
      drop.appendChild(empty);
    } else {
      matches.forEach((p, i) => {
        const item = document.createElement('div');
        item.className = 'prod-search-item';
        item.dataset.idx = i;
        const nameEl = document.createElement('div');
        nameEl.className = 'prod-search-item-name';
        nameEl.textContent = (p.sku ? '[' + p.sku + '] ' : '') + p.name;
        const metaEl = document.createElement('div');
        metaEl.className = 'prod-search-item-meta';
        const stockStr = (typeof p.stock === 'number' ? (Number.isInteger(p.stock) ? p.stock : +p.stock.toFixed(2)) : (parseFloat(p.stock)||0));
        metaEl.textContent = 'Tồn: ' + stockStr + ' ' + p.unit
          + (p.buyPrice ? ' · Giá nhập: ' + fmt(p.buyPrice) + 'đ' : '')
          + (p.type ? ' · ' + p.type : '');
        item.appendChild(nameEl);
        item.appendChild(metaEl);
        item.addEventListener('mousedown', e => { e.preventDefault(); selectProduct(p); });
        drop.appendChild(item);
      });
    }
    drop.classList.add('show');
  }

  function selectProduct(p) {
    selectedId = p.id;
    inp.value = '';
    drop.classList.remove('show');
    showBadge(p);
    onSelect(p.id);
  }

  inp.addEventListener('input', () => renderDrop(inp.value));
  inp.addEventListener('focus', () => { if (inp.value) renderDrop(inp.value); });
  inp.addEventListener('blur', () => setTimeout(() => drop.classList.remove('show'), 150));
  inp.addEventListener('keydown', e => {
    const items = drop.querySelectorAll('.prod-search-item');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIdx >= 0 && dropItems[activeIdx]) selectProduct(dropItems[activeIdx]);
    } else if (e.key === 'Escape') {
      drop.classList.remove('show');
    }
  });

  // Expose method để lấy giá trị hiện tại
  wrap._getProductId = () => selectedId;
  return wrap;
}

function openImport(existing, rebuild, prefillProduct) {
  const { products } = S;
  const isEdit = !!existing;
  const e = existing || {};

  // ── Shared fields (áp dụng cho toàn phiếu) ───────────────────
  const inpDate     = mkInput('date', '', e.date || today(), v => {});
  // Autocomplete nhà cung cấp — lấy danh sách NCC đã nhập trước
  const inpSupplier = mkAutocomplete('🏭 Tên nhà cung cấp...', e.supplier || '',
    q => {
      const all = [...new Set((S.imports || []).map(i => i.supplier).filter(Boolean))].sort();
      return q ? all.filter(s => s.toLowerCase().includes(q.toLowerCase())) : all;
    },
    () => {});

  // ── Phí vận chuyển nhập hàng (chung toàn phiếu) ──────────────
  const SHIP_UNITS = ['chuyến','tấn','cái','thùng','kg','m²','tấm'];

  // Khi edit: kiểm tra xem phiếu này có thuộc 1 chuyến hàng nhiều mặt hàng không
  // Cách nhận biết: có phiếu khác cùng ngày + cùng NCC + cùng shipUnitPrice trong imports
  // Hoặc: shipFee < shipUnitPrice (khi đơn vị là 'chuyến' và VC đã bị chia nhỏ)
  const isPartOfBatch = isEdit && e.shipUnitPrice != null && e.shipFee != null && (
    // Trường hợp 1: phí đã chia (shipFee nhỏ hơn đơn giá gốc khi đơn vị là chuyến)
    (e.shipUnit === 'chuyến' && e.shipFee < e.shipUnitPrice) ||
    // Trường hợp 2: có phiếu anh em khác cùng ngày + NCC + shipUnitPrice
    S.imports.some(im =>
      im.id !== e.id &&
      im.date === e.date &&
      im.supplier === e.supplier &&
      im.shipUnitPrice === e.shipUnitPrice &&
      im.shipUnitPrice > 0
    )
  );

  // Trong edit mode:
  //   - Nếu là phiếu đơn lẻ (không chia batch): dùng shipUnitPrice (hoặc shipFee nếu ko có shipUnitPrice)
  //   - Nếu là phiếu thuộc batch (VC đã chia): hiển thị shipFee (phần VC của riêng phiếu này)
  //     đồng thời hiển thị thêm thông tin shipUnitPrice gốc để tham khảo
  let editShipFeeInitVal;
  if (isEdit) {
    if (isPartOfBatch) {
      // Hiển thị đúng phần VC của riêng phiếu này (đã chia theo tỉ lệ)
      editShipFeeInitVal = e.shipFee || '';
    } else {
      // Phiếu đơn lẻ: dùng shipUnitPrice nếu có, fallback về shipFee
      editShipFeeInitVal = e.shipUnitPrice != null ? e.shipUnitPrice : (e.shipFee || '');
    }
  } else {
    editShipFeeInitVal = '';
  }

  const inpShipFee  = mkInput('number', isEdit && isPartOfBatch ? 'Phí VC của phiếu này (đã chia)' : 'Đơn giá VC (chưa VAT)', editShipFeeInitVal, v => updateSum());
  const inpShipQty  = mkInput('number', 'Số lượng', e.shipQty != null ? e.shipQty : '', v => updateSum());
  const selShipUnit = mkSelect(SHIP_UNITS.map(u => ({ value: u, label: u })), e.shipUnit || 'chuyến', v => { updateShipQtyVisible(); updateSum(); });
  const vatShipRow  = mkVatRow(e.shipVatRate || 0, () => updateSum());

  function updateShipQtyVisible() {
    const unit = selShipUnit.value;
    // Trong edit mode batch: ẩn đơn vị và số lượng (vì nhập thẳng số tiền VC)
    if (isEdit && isPartOfBatch) {
      inpShipQty.parentElement && (inpShipQty.parentElement.style.display = 'none');
      selShipUnit.parentElement && (selShipUnit.parentElement.style.display = 'none');
      return;
    }
    const showQty = unit !== 'chuyến';
    inpShipQty.parentElement && (inpShipQty.parentElement.style.display = showQty ? '' : 'none');
    if (!showQty) inpShipQty.value = '';
  }
  const shipFeeWrap = document.createElement('div');
  shipFeeWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;width:100%';

  // Dòng nhập chính
  const shipFeeRow = document.createElement('div');
  shipFeeRow.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  shipFeeRow.appendChild(inpShipFee);
  const _sull = document.createElement('span'); _sull.style.cssText = 'font-size:12px;color:var(--text2);white-space:nowrap'; _sull.textContent = '/';
  const _sqw = document.createElement('div'); _sqw.style.cssText = 'display:flex;align-items:center;gap:6px';
  const _sml = document.createElement('span'); _sml.style.cssText = 'font-size:12px;color:var(--text2);white-space:nowrap'; _sml.textContent = '×';
  _sqw.appendChild(_sml); _sqw.appendChild(inpShipQty);

  if (!(isEdit && isPartOfBatch)) {
    shipFeeRow.appendChild(_sull); shipFeeRow.appendChild(selShipUnit);
    shipFeeRow.appendChild(_sqw);
  }
  shipFeeWrap.appendChild(shipFeeRow);

  // Nếu là phiếu thuộc batch: hiển thị thông tin đơn giá VC gốc của cả chuyến
  if (isEdit && isPartOfBatch) {
    const batchInfoEl = document.createElement('div');
    batchInfoEl.style.cssText = 'font-size:11px;color:var(--amber);background:rgba(232,165,58,0.08);border:1px solid rgba(232,165,58,0.2);border-radius:6px;padding:7px 10px;line-height:1.6';
    const origShipFeeTotal = e.shipUnit === 'chuyến'
      ? (e.shipUnitPrice || 0)
      : Math.round((e.shipUnitPrice || 0) * (e.shipQty || 1));
    const vatRate = e.shipVatRate || 0;
    const origWithVat = vatRate > 0 ? Math.round(origShipFeeTotal * (1 + vatRate/100)) : origShipFeeTotal;
    batchInfoEl.innerHTML =
      '📦 <strong>Phiếu này thuộc 1 chuyến hàng nhiều mặt hàng</strong><br>' +
      '• Đơn giá VC gốc cả chuyến: <strong>' + numFmt(e.shipUnitPrice || 0) + 'đ/' + (e.shipUnit || 'chuyến') + '</strong>' +
      (e.shipUnit !== 'chuyến' && e.shipQty ? ' × ' + e.shipQty + ' = <strong>' + numFmt(origShipFeeTotal) + 'đ</strong>' : '') +
      (vatRate > 0 ? ' (+VAT ' + vatRate + '%→ <strong>' + numFmt(origWithVat) + 'đ</strong>)' : '') + '<br>' +
      '• Phí VC đã chia cho phiếu này: <strong style="color:var(--accent)">' + numFmt(e.shipFee || 0) + 'đ</strong><br>' +
      '<span style="color:var(--text2)">Bạn có thể điều chỉnh lại phí VC cho phiếu này ở ô trên.</span>';
    shipFeeWrap.appendChild(batchInfoEl);
  }

  updateShipQtyVisible();

  // Thanh toán chung
  const inpPaid = mkInput('number', 'VD: 0', e.paid || '', v => updateSum());
  const inpNote = mkInput('text', 'Ghi chú...', e.note || '', v => {});

  // ── Danh sách mặt hàng (multi-item) ──────────────────────────
  // Khi edit: chỉ 1 dòng duy nhất (tương thích ngược)
  // Khi tạo mới: hỗ trợ nhiều dòng
  let importItems = isEdit
    ? [{ id: uid(), productId: e.productId || '', variantId: e.variantId || '', qty: e.qty || '', price: e.unitPrice || '', vatRate: e.vatRate || 0, _vtSelId: e.variantId || '' }]
    : prefillProduct
      ? [{ id: uid(), productId: prefillProduct.id, variantId: '', qty: '', price: prefillProduct.buyPrice || '', vatRate: 0, _vtSelId: '' }]
      : [{ id: uid(), productId: '', variantId: '', qty: '', price: '', vatRate: 0, _vtSelId: '' }];

  const itemsContainer = document.createElement('div');
  itemsContainer.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-bottom:4px';

  // Summary box chung
  const sumEl = document.createElement('div');
  sumEl.className = 'sum-box fg-full';
  sumEl.style.display = 'none';

  function updateSum() {
    const shipUnit     = selShipUnit.value;
    const shipQtyVal   = shipUnit === 'chuyến' ? 1 : (parseFloat(inpShipQty.value) || 0);
    const shipUnitP    = parseFloat(inpShipFee.value) || 0;
    const shipVat      = vatShipRow._getVal();

    // Khi edit phiếu batch: ô nhập = trực tiếp shipFee, không nhân với qty
    let shipNet, shipVatAmt, shipFeeTotal;
    if (isEdit && isPartOfBatch) {
      shipFeeTotal = shipUnitP; // nhập thẳng = tổng VC phiếu này (đã chia)
      shipNet      = shipVat > 0 ? Math.round(shipFeeTotal / (1 + shipVat / 100)) : shipFeeTotal;
      shipVatAmt   = shipFeeTotal - shipNet;
    } else {
      shipNet      = Math.round(shipUnitP * shipQtyVal);
      shipVatAmt   = shipVat > 0 ? Math.round(shipNet * shipVat / 100) : 0;
      shipFeeTotal = shipNet + shipVatAmt;
    }

    let totalGoodsNet = 0, totalGoodsVat = 0, totalGoodsGross = 0;
    importItems.forEach(it => {
      const q = parseFloat(it.qty) || 0;
      const p = parseFloat(it.price) || 0;
      const v = parseFloat(it.vatRate) || 0;
      const gn = q * p;
      const gv = v > 0 ? Math.round(gn * v / 100) : 0;
      totalGoodsNet   += gn;
      totalGoodsVat   += gv;
      totalGoodsGross += gn + gv;
    });

    const grandTotal = totalGoodsGross + shipFeeTotal;
    const paid       = parseFloat(inpPaid.value) || 0;
    const remaining  = Math.max(0, grandTotal - paid);

    if (totalGoodsNet > 0 || shipNet > 0) {
      sumEl.style.display = '';
      let html = '';
      if (importItems.length > 1) {
        html += '<div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">📋 Tổng ' + importItems.length + ' mặt hàng</div>';
        importItems.forEach((it, idx) => {
          const prod = products.find(p => p.id === it.productId);
          const q = parseFloat(it.qty) || 0, p2 = parseFloat(it.price) || 0, v = parseFloat(it.vatRate) || 0;
          if (q > 0 && p2 > 0) {
            const gn = q * p2, gv = v > 0 ? Math.round(gn * v / 100) : 0;
            html += '<div class="sum-row" style="font-size:12px"><span style="color:var(--text)">' + (prod ? prod.name : 'Mặt hàng ' + (idx+1)) + ':</span><span>' + fmt(gn + gv) + 'đ' + (v > 0 ? ' <span style="color:var(--blue);font-size:10px">(VAT ' + v + '%)</span>' : '') + '</span></div>';
          }
        });
        html += '<div style="border-top:1px solid var(--border);margin:6px 0"></div>';
      }
      html += '<div class="sum-row"><span>📦 Tổng tiền hàng (chưa VAT):</span><span style="font-weight:600">' + fmt(totalGoodsNet) + 'đ</span></div>';
      if (totalGoodsVat > 0) {
        html += '<div class="sum-row"><span>🏛️ Tổng VAT hàng hoá:</span><span style="color:var(--blue)">+' + fmt(totalGoodsVat) + 'đ</span></div>';
        html += '<div class="sum-row" style="font-size:11px;color:var(--text3)"><span>→ Tiền hàng có VAT:</span><span style="color:var(--accent);font-weight:700">' + fmt(totalGoodsGross) + 'đ</span></div>';
      }
      // Cảnh báo khi đơn vị VC không phải "chuyến" nhưng chưa nhập số lượng
      if (shipUnitP > 0 && shipUnit !== 'chuyến' && shipQtyVal === 0 && !(isEdit && isPartOfBatch)) {
        html += '<div class="sum-row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);color:var(--red);font-size:12px;font-weight:700">⚠️ Phí VC = 0! Đơn vị "' + shipUnit + '" nhưng chưa nhập số lượng → VC chưa được tính!</div>';
      }
      if (shipNet > 0) {
        const shipDesc = (isEdit && isPartOfBatch)
          ? 'Phí VC của phiếu này (đã chia từ chuyến hàng)'
          : (shipUnit === 'chuyến' ? fmt(shipUnitP) + 'đ/chuyến' : fmt(shipUnitP) + 'đ/' + shipUnit + ' × ' + shipQtyVal + ' ' + shipUnit + ' = ' + fmt(shipNet) + 'đ');
        html += '<div class="sum-row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"><span>🚚 Phí vận chuyển (chưa VAT):</span><span style="color:var(--amber);font-weight:600">' + fmt(shipNet) + 'đ</span></div>';
        html += '<div class="sum-row" style="font-size:11px;color:var(--text3)"><span>&nbsp;&nbsp;(' + shipDesc + ')</span><span></span></div>';
        if (shipVat > 0) {
          html += '<div class="sum-row"><span>🏛️ VAT vận chuyển (' + shipVat + '%):</span><span style="color:var(--blue)">+' + fmt(shipVatAmt) + 'đ</span></div>';
          html += '<div class="sum-row" style="font-size:11px;color:var(--text3)"><span>&nbsp;&nbsp;→ Tổng VC có VAT:</span><span style="color:var(--accent);font-weight:700">' + fmt(shipFeeTotal) + 'đ</span></div>';
        }
        // Hiển thị preview phân bổ VC cho từng mặt hàng khi nhập nhiều dòng
        if (importItems.length > 1 && shipFeeTotal > 0) {
          html += '<div style="font-size:11px;color:var(--text2);margin-top:4px;padding:6px 8px;background:rgba(201,168,76,0.07);border-radius:5px">';
          html += '<span style="font-weight:700;color:var(--amber)">📊 Phân bổ VC theo tỉ lệ tiền hàng:</span><br>';
          let accShip = 0;
          importItems.forEach((it2, idx2) => {
            const prod2 = products.find(p => p.id === it2.productId);
            const q2 = parseFloat(it2.qty) || 0, p2v = parseFloat(it2.price) || 0, vr2 = parseFloat(it2.vatRate) || 0;
            const gn2 = q2 * p2v, gv2 = vr2 > 0 ? Math.round(gn2 * vr2 / 100) : 0;
            const gross2 = gn2 + gv2;
            const isLast2 = idx2 === importItems.length - 1;
            let itShip;
            if (totalGoodsGross > 0) {
              itShip = isLast2 ? shipFeeTotal - accShip : Math.round(shipFeeTotal * gross2 / totalGoodsGross);
            } else {
              itShip = isLast2 ? shipFeeTotal - accShip : Math.round(shipFeeTotal / importItems.length);
            }
            accShip += itShip;
            const name2 = prod2 ? prod2.name : ('Mặt hàng ' + (idx2+1));
            html += '&nbsp;&nbsp;' + name2 + ': <b style="color:var(--accent)">' + fmt(itShip) + 'đ</b><br>';
          });
          html += '</div>';
        }
      }
      html += '<div class="sum-total"><span>💰 Tổng phải trả NCC:</span><span>' + fmt(grandTotal) + 'đ</span></div>';
      const totalVatIn = totalGoodsVat + shipVatAmt;
      if (totalVatIn > 0) {
        html += '<div class="sum-row" style="font-size:11px;color:var(--text3);margin-top:3px"><span>📋 Tổng VAT đầu vào (khấu trừ được):</span><span style="color:var(--blue)">' + fmt(totalVatIn) + 'đ</span></div>';
        html += '<div class="sum-row" style="font-size:11px;color:var(--text3)"><span>📋 Giá vốn thuần (tính LN):</span><span style="color:var(--green)">' + fmt(totalGoodsNet) + 'đ</span></div>';
      }
      if (paid > 0) html += '<div class="sum-paid"><span>✅ Đã thanh toán:</span><span>' + fmt(paid) + 'đ</span></div>';
      if (paid > grandTotal && grandTotal > 0) {
        const overAmt = paid - grandTotal;
        html += '<div style="margin-top:8px;padding:10px 12px;background:rgba(224,92,92,0.15);border:1.5px solid var(--red);border-radius:var(--r2);display:flex;align-items:flex-start;gap:8px">'
              + '<span style="font-size:18px;line-height:1.2">⚠️</span>'
              + '<div><div style="font-weight:700;color:var(--red);font-size:13px">Số tiền thanh toán vượt quá giá trị đơn hàng!</div>'
              + '<div style="font-size:12px;color:var(--text2);margin-top:3px">Đã nhập: <b style="color:var(--red)">' + fmt(paid) + 'đ</b> — Tổng đơn: <b style="color:var(--accent)">' + fmt(grandTotal) + 'đ</b></div>'
              + '<div style="font-size:12px;color:var(--text2);margin-top:2px">Vượt quá: <b style="color:var(--red)">+' + fmt(overAmt) + 'đ</b> — Vui lòng kiểm tra lại số tiền đã thanh toán.</div>'
              + '</div></div>';
      } else if (remaining > 0) {
        html += '<div class="sum-debt"><span>⚠️ Còn nợ NCC:</span><span>' + fmt(remaining) + 'đ</span></div>';
      }
      sumEl.innerHTML = html;
    } else { sumEl.style.display = 'none'; }
  }

  // ── Tạo một dòng mặt hàng ─────────────────────────────────────
  function makeItemRow(it, idx) {
    const rowEl = document.createElement('div');
    rowEl.style.cssText = 'background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:14px;position:relative';

    // Header dòng
    const rowHeader = document.createElement('div');
    rowHeader.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:10px';
    const rowTitle = document.createElement('div');
    rowTitle.style.cssText = 'font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px';
    rowTitle.textContent = '📦 Mặt hàng ' + (idx + 1);
    rowHeader.appendChild(rowTitle);
    if (!isEdit && importItems.length > 1) {
      const delBtn = document.createElement('button');
      delBtn.type = 'button'; delBtn.className = 'btn btn-danger btn-xs';
      delBtn.textContent = '✕ Xoá';
      delBtn.onclick = () => { importItems = importItems.filter(x => x.id !== it.id); rebuildItems(); updateSum(); };
      rowHeader.appendChild(delBtn);
    }
    rowEl.appendChild(rowHeader);

    // Grid 2 cột: Sản phẩm + Số lượng
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';

    // Chọn sản phẩm — có ô tìm kiếm nhanh phía trên
    const prodGroup = document.createElement('div');
    prodGroup.className = 'form-group';
    const prodLabel = document.createElement('label'); prodLabel.className = 'form-label'; prodLabel.textContent = 'Sản phẩm *';

    // Widget tìm kiếm nhanh
    const searchWidget = makeProdSearchWidget(products, it.productId, v => {
      it.productId = v;
      // Sync sang select bên dưới
      selProd.value = v;
      const p = products.find(x => x.id === v);
      if (p) { it.price = p.buyPrice; priceInp.value = p.buyPrice; }
      renderVariantSel(p || null);
      updateSum();
    });

    const selProdLabel = document.createElement('div');
    selProdLabel.style.cssText = 'font-size:11px;color:var(--text3);margin-top:6px;margin-bottom:3px';
    selProdLabel.textContent = 'Hoặc chọn từ danh sách:';

    const selProd = mkSelect(
      [{ value: '', label: '— Chọn sản phẩm —' }, ...products.map(p => ({ value: p.id, label: (p.sku ? '[' + p.sku + '] ' : '') + p.name + ' (tồn: ' + fmtQty(p.stock) + ' ' + p.unit + ')' }))],
      it.productId,
      v => {
        it.productId = v;
        const p = products.find(x => x.id === v);
        if (p) { it.price = p.buyPrice; priceInp.value = p.buyPrice; }
        renderVariantSel(p);
        // Sync lại search widget badge
        if (v) {
          const pp = products.find(x => x.id === v);
          if (pp) { searchWidget._getProductId; }
        }
        updateSum();
      }
    );
    prodGroup.appendChild(prodLabel);
    prodGroup.appendChild(searchWidget);
    prodGroup.appendChild(selProdLabel);
    prodGroup.appendChild(selProd);
    grid.appendChild(prodGroup);

    // Số lượng
    const qtyGroup = document.createElement('div');
    qtyGroup.className = 'form-group';
    const qtyLabel = document.createElement('label'); qtyLabel.className = 'form-label'; qtyLabel.textContent = 'Số lượng *';
    const qtyInp = mkInput('number', 'VD: 31.2', it.qty, v => { it.qty = v; updateSum(); });
    qtyGroup.appendChild(qtyLabel); qtyGroup.appendChild(qtyInp);
    grid.appendChild(qtyGroup);
    rowEl.appendChild(grid);

    // Grid 2 cột: Đơn giá + VAT
    const grid2 = document.createElement('div');
    grid2.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px';

    const priceGroup = document.createElement('div');
    priceGroup.className = 'form-group';
    const priceLabel = document.createElement('label'); priceLabel.className = 'form-label'; priceLabel.textContent = 'Đơn giá nhập (VNĐ, chưa VAT) *';
    const priceInp = mkInput('number', 'VD: 1.200.000', it.price, v => { it.price = v; updateSum(); });
    priceGroup.appendChild(priceLabel); priceGroup.appendChild(priceInp);
    grid2.appendChild(priceGroup);

    const vatGroup = document.createElement('div');
    vatGroup.className = 'form-group';
    const vatLabel = document.createElement('label'); vatLabel.className = 'form-label'; vatLabel.textContent = 'VAT hàng hoá (0–20%)';
    const vatRow = mkVatRow(it.vatRate || 0, v => { it.vatRate = v; updateSum(); });
    vatGroup.appendChild(vatLabel); vatGroup.appendChild(vatRow);
    grid2.appendChild(vatGroup);
    rowEl.appendChild(grid2);

    // Variant selector
    const variantEl = document.createElement('div');
    variantEl.style.display = 'none';
    variantEl.style.marginBottom = '10px';

    function renderVariantSel(p) {
      variantEl.innerHTML = '';
      if (!p || !p.variants || p.variants.length === 0) { variantEl.style.display = 'none'; return; }
      variantEl.style.display = '';
      const vlbl = document.createElement('label'); vlbl.className = 'form-label'; vlbl.textContent = '📐 Quy cách kích thước';
      const vsel = document.createElement('select'); vsel.className = 'form-input';
      const defOpt = document.createElement('option'); defOpt.value = '';
      defOpt.textContent = '— Không phân quy cách (' + fmt(p.buyPrice||0) + 'đ/m²) —';
      vsel.appendChild(defOpt);
      p.variants.forEach(vt => {
        const opt = document.createElement('option');
        opt.value = vt.id;
        const ppm2 = (vt.tileW > 0 && vt.tileH > 0) ? (10000/(vt.tileW*vt.tileH)).toFixed(1) : '?';
        const stockStr = (vt.stockM2||0) > 0 ? ' · Tồn: '+(vt.stockM2||0).toFixed(1)+'m²/'+(vt.stockPieces||0)+' viên' : ' · (chưa có)';
        opt.textContent = '📐 '+vt.tileW+'×'+vt.tileH+(vt.tileThickness?'×'+vt.tileThickness:'')+' cm — '+fmt(vt.buyPrice||p.buyPrice||0)+'đ/m² · '+ppm2+' viên/m²'+stockStr;
        if (vt.id === it._vtSelId) opt.selected = true;
        vsel.appendChild(opt);
      });
      vsel.addEventListener('change', () => {
        it._vtSelId = vsel.value;
        it.variantId = vsel.value;
        const selVt = p.variants.find(vt => vt.id === vsel.value);
        if (selVt && selVt.buyPrice) { it.price = selVt.buyPrice; priceInp.value = selVt.buyPrice; }
        else { it.price = p.buyPrice || ''; priceInp.value = p.buyPrice || ''; }
        updateSum();
      });
      const vtInfo = document.createElement('div');
      vtInfo.style.cssText = 'margin-top:5px;font-size:11px;color:var(--blue);background:rgba(91,143,232,.07);border:1px solid rgba(91,143,232,.2);border-radius:6px;padding:5px 9px';
      vtInfo.innerHTML = p.variants.map(vt => `<span style="margin-right:10px">📐${escHtml(vt.tileW)}×${escHtml(vt.tileH)}${vt.tileThickness?'×'+escHtml(vt.tileThickness):''}cm: <b style="color:var(--green)">${(vt.stockM2||0).toFixed(1)}m²</b>/${vt.stockPieces||0}v</span>`).join('');
      variantEl.appendChild(vlbl); variantEl.appendChild(vsel); variantEl.appendChild(vtInfo);
      if (it._vtSelId) {
        const sv = p.variants.find(vt => vt.id === it._vtSelId);
        if (sv && sv.buyPrice) { it.price = sv.buyPrice; priceInp.value = sv.buyPrice; }
      }
    }
    // Init variant sel
    if (it.productId) {
      const initP = products.find(x => x.id === it.productId);
      if (initP) renderVariantSel(initP);
    }
    rowEl.appendChild(variantEl);
    return rowEl;
  }

  function rebuildItems() {
    itemsContainer.innerHTML = '';
    importItems.forEach((it, idx) => itemsContainer.appendChild(makeItemRow(it, idx)));
    updateSum();
  }
  rebuildItems();

  // Nút thêm mặt hàng (chỉ hiện khi tạo mới)
  const addItemBtn = document.createElement('button');
  addItemBtn.type = 'button'; addItemBtn.className = 'btn';
  addItemBtn.style.cssText = 'width:100%;background:rgba(201,168,76,.1);border:1px dashed rgba(201,168,76,.5);color:var(--accent);font-weight:700;margin-bottom:4px';
  addItemBtn.innerHTML = '➕ Thêm mặt hàng';
  addItemBtn.onclick = () => {
    importItems.push({ id: uid(), productId: '', variantId: '', qty: '', price: '', vatRate: 0, _vtSelId: '' });
    rebuildItems();
    updateSum();
  };

  // Wrap toàn bộ items + nút thêm
  const itemsWrap = document.createElement('div');
  itemsWrap.className = 'form-group fg-full';
  const itemsHdr = document.createElement('div');
  itemsHdr.style.cssText = 'font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px';
  itemsHdr.innerHTML = '📋 Danh sách mặt hàng <span style="font-size:10px;font-weight:400;color:var(--text3)">(có thể thêm nhiều loại từ cùng một NCC)</span>';
  itemsWrap.appendChild(itemsHdr);
  itemsWrap.appendChild(itemsContainer);
  if (!isEdit) itemsWrap.appendChild(addItemBtn);

  updateSum();

  S.modal = {
    title: isEdit ? '✏️ Chỉnh sửa phiếu nhập' : prefillProduct ? '📥 Nhập hàng: ' + prefillProduct.name : '📥 Tạo phiếu nhập hàng',
    large: true,
    content: h('div', { className: 'fg fg2' },
      fg('Ngày', null, inpDate),
      fg('Nhà cung cấp *', null, inpSupplier),
      itemsWrap,
      h('div', { className: 'form-group fg-full', style: { borderTop:'1px solid var(--border)',paddingTop:12,marginTop:4 } },
        h('div', { style: { fontSize:11,color:'var(--amber)',fontWeight:700,marginBottom:8,textTransform:'uppercase',letterSpacing:.8 } },
          isEdit && isPartOfBatch
            ? '🚚 Phí vận chuyển của phiếu này (trích từ chuyến hàng)'
            : '🚚 Phí vận chuyển nhập hàng (chung cho toàn phiếu)')
      ),
      fg(isEdit && isPartOfBatch ? 'Phí VC của phiếu này (đã chia theo tỉ lệ)' : 'Phí vận chuyển (đơn giá CHƯA VAT)', true, shipFeeWrap),
      fg('VAT vận chuyển (0–20%)', true, vatShipRow),
      fg('Đã thanh toán (toàn phiếu)', null, inpPaid),
      fg('Ghi chú', true, inpNote),
      sumEl
    ),
    footer: [
      h('button', { className: 'btn', onClick: () => { S.modal = null; render(); } }, 'Huỷ'),
      h('button', { className: 'btn btn-primary', onClick: () => {
        const supplier = inpSupplier.value.trim();
        if (!supplier) { toast('Vui lòng nhập tên nhà cung cấp!', 'error'); return; }

        // Validate tất cả dòng hàng
        for (let idx = 0; idx < importItems.length; idx++) {
          const it = importItems[idx];
          if (!it.productId) { toast('Mặt hàng ' + (idx+1) + ': chưa chọn sản phẩm!', 'error'); return; }
          if (!(parseFloat(it.qty) > 0)) { toast('Mặt hàng ' + (idx+1) + ': số lượng phải lớn hơn 0!', 'error'); return; }
          if (!(parseFloat(it.price) > 0)) { toast('Mặt hàng ' + (idx+1) + ': chưa nhập đơn giá!', 'error'); return; }
        }

        // Tính phí VC chung
        const shipUnit    = selShipUnit.value;
        const shipQtyVal  = shipUnit === 'chuyến' ? 1 : (parseFloat(inpShipQty.value) || 0);
        const shipUnitP   = parseFloat(inpShipFee.value) || 0;
        const shipVatRate = vatShipRow._getVal();

        // Validate: đã nhập đơn giá VC nhưng chưa nhập số lượng (với đơn vị không phải chuyến)
        if (!(isEdit && isPartOfBatch) && shipUnitP > 0 && shipUnit !== 'chuyến' && shipQtyVal <= 0) {
          toast('⚠️ Vui lòng nhập số lượng vận chuyển (đơn vị: ' + shipUnit + ')!', 'error');
          return;
        }

        // Khi edit phiếu thuộc batch: ô nhập là trực tiếp shipFee (đã chia), không tính lại
        let shipFeeTotal, shipNet, shipVatAmt;
        if (isEdit && isPartOfBatch) {
          // Người dùng nhập thẳng số tiền VC của phiếu này (đã bao gồm VAT hoặc không)
          // Giữ VAT rate gốc để tham khảo, nhưng shipFee = đúng giá trị nhập vào
          shipFeeTotal = shipUnitP; // giá trị nhập trực tiếp = phí VC của phiếu này
          shipNet      = shipVatRate > 0 ? Math.round(shipFeeTotal / (1 + shipVatRate / 100)) : shipFeeTotal;
          shipVatAmt   = shipFeeTotal - shipNet;
        } else {
          shipNet      = Math.round(shipUnitP * shipQtyVal);
          shipVatAmt   = shipVatRate > 0 ? Math.round(shipNet * shipVatRate / 100) : 0;
          shipFeeTotal = shipNet + shipVatAmt;
        }

        // Tính tổng tiền hàng để chia phí VC theo tỉ lệ
        let totalGoodsGross = 0;
        const itemCalcs = importItems.map(it => {
          const qty     = parseFloat(it.qty) || 0;
          const price   = parseFloat(it.price) || 0;
          const vatRate = parseFloat(it.vatRate) || 0;
          const goodsNet   = qty * price;
          const goodsVatAmt = vatRate > 0 ? Math.round(goodsNet * vatRate / 100) : 0;
          const goodsGross = goodsNet + goodsVatAmt;
          totalGoodsGross += goodsGross;
          return { qty, price, vatRate, goodsNet, goodsVatAmt, goodsGross };
        });

        const dateSaved = inpDate.value;
        const noteStr   = inpNote.value.trim();
        const totalPaid = Math.min(parseFloat(inpPaid.value) || 0, totalGoodsGross + shipFeeTotal);

        if (isEdit) {
          // Edit mode: chỉ 1 dòng, logic như cũ
          const it = importItems[0];
          const calc = itemCalcs[0];
          const prod = products.find(p => p.id === it.productId);
          const oldQty = existing.qty || 0;
          const newQty = calc.qty;
          const oldVtId = existing.variantId || '';
          const newVtId = it._vtSelId || '';
          const total = calc.goodsGross + shipFeeTotal;
          const paid  = Math.min(totalPaid, total);

          const oldProdId = existing.productId || '';
          const newProdId = it.productId || '';
          const prodChanged = oldProdId && newProdId && oldProdId !== newProdId;

          S.products = S.products.map(p => {
            // Nếu đổi sang sản phẩm khác: revert stock sản phẩm cũ
            if (prodChanged && p.id === oldProdId) {
              let revertStock = (parseFloat(p.stock)||0) - oldQty;
              let revertVariants = (p.variants || []).map(vt => {
                if (!oldVtId || vt.id !== oldVtId) return vt;
                const ppm2 = (vt.tileW > 0 && vt.tileH > 0) ? 10000/(vt.tileW*vt.tileH) : 0;
                const newM2 = (vt.stockM2||0) - oldQty;
                return { ...vt, stockM2: newM2, stockPieces: ppm2 > 0 ? Math.round(newM2 * ppm2) : (vt.stockPieces||0) - Math.round(oldQty * (ppm2||0)) };
              });
              // FIX: loại existing.id khỏi _stockTx của SP cũ (đã revert stock)
              const oldTx = (p._stockTx || []).filter(txId => txId !== existing.id);
              return { ...p, stock: revertStock, variants: revertVariants,
                _updated: new Date().toISOString(), _stockTx: oldTx };
            }
            if (p.id !== newProdId) return p;
            // Sản phẩm mới (hoặc không đổi): tính delta
            let newStock = prodChanged
              ? (parseFloat(p.stock)||0) + newQty                    // Sản phẩm mới: chỉ cộng thêm
              : (parseFloat(p.stock)||0) - oldQty + newQty;          // Cùng sản phẩm: +delta
            let newVariants = (p.variants || []).map(vt => {
              const ppm2 = (vt.tileW > 0 && vt.tileH > 0) ? 10000/(vt.tileW*vt.tileH) : 0;
              if (!prodChanged) {
                // Cùng sản phẩm: tính delta variant
                if (oldVtId && newVtId && vt.id === oldVtId && oldVtId === newVtId) {
                  const netDelta = newQty - oldQty;
                  const newM2 = (vt.stockM2||0) + netDelta;
                  return { ...vt, stockM2: newM2, stockPieces: ppm2 > 0 ? Math.round(newM2 * ppm2) : (vt.stockPieces||0) + Math.round(netDelta * (ppm2||0)) };
                }
                let sv = { ...vt };
                if (oldVtId && vt.id === oldVtId) {
                  sv.stockM2 = (sv.stockM2||0) - oldQty;
                  sv.stockPieces = ppm2 > 0 ? Math.round(sv.stockM2 * ppm2) : (sv.stockPieces||0) - Math.round(oldQty * (ppm2||0));
                }
                if (newVtId && vt.id === newVtId) {
                  sv.stockM2 = (sv.stockM2||0) + newQty;
                  sv.stockPieces = ppm2 > 0 ? Math.round(sv.stockM2 * ppm2) : (sv.stockPieces||0) + Math.round(newQty * (ppm2||0));
                }
                return sv;
              } else {
                // Sản phẩm mới: chỉ cộng variant mới
                if (newVtId && vt.id === newVtId) {
                  const newM2 = (vt.stockM2||0) + newQty;
                  return { ...vt, stockM2: newM2, stockPieces: ppm2 > 0 ? Math.round(newM2 * ppm2) : (vt.stockPieces||0) + Math.round(newQty * (ppm2||0)) };
                }
                return vt;
              }
            });
            // FIX: cập nhật _stockTx để applyLedgerToStock không đếm trùng
            // khi thiết bị khác sync về thấy import.id này chưa có trong _stockTx
            return { ...p, stock: newStock, buyPrice: calc.price, variants: newVariants,
              _updated: new Date().toISOString(),
              _stockTx: CLOUD.unionStockTx(p._stockTx, [existing.id]) };
          });
          const _editNow = new Date().toISOString();
          S.imports = S.imports.map(x => x.id === existing.id ? {
            ...x, date: dateSaved, supplier, productId: it.productId,
            productName: prod?.name || '', qty: calc.qty, unit: prod?.unit || '',
            unitPrice: calc.price, vatRate: calc.vatRate, total, paid,
            variantId: newVtId || null,
            // Khi là phiếu thuộc batch: giữ nguyên shipUnitPrice gốc (đơn giá cả chuyến), chỉ cập nhật shipFee (phần của phiếu này)
            shipFee: shipFeeTotal,
            shipUnit: isPartOfBatch ? (existing.shipUnit || shipUnit) : shipUnit,
            shipVatRate,
            shipQty: isPartOfBatch ? (existing.shipQty || shipQtyVal) : shipQtyVal,
            shipUnitPrice: isPartOfBatch ? (existing.shipUnitPrice || shipUnitP) : shipUnitP,
            status: paid >= total ? 'paid' : 'debt', note: noteStr,
            _updated: _editNow
          } : x);
          save('imports'); save('products');
          toast('✅ Đã cập nhật phiếu nhập', 'success');

        } else {
          // Tạo mới: lưu từng dòng hàng thành từng phiếu nhập riêng (chung NCC + ngày + VC chia đều theo tỉ lệ)
          // Phí VC chia theo tỉ lệ tiền hàng của từng dòng
          const newRecs = [];
          importItems.forEach((it, idx) => {
            const calc = itemCalcs[idx];
            const prod = products.find(p => p.id === it.productId);
            // Chia phí VC theo tỉ lệ tiền hàng; nếu tất cả tiền hàng = 0 thì chia đều
            let itemShipFee = 0;
            if (shipFeeTotal > 0) {
              const isLast = idx === importItems.length - 1;
              if (totalGoodsGross > 0) {
                // Chia theo tỉ lệ tiền hàng (gross)
                itemShipFee = isLast
                  ? shipFeeTotal - newRecs.reduce((a, r) => a + r.shipFee, 0) // dòng cuối: lấy phần còn lại để không bị sai số làm mất VC
                  : Math.round(shipFeeTotal * calc.goodsGross / totalGoodsGross);
              } else {
                // Fallback: chia đều khi không có tiền hàng (trường hợp hiếm)
                itemShipFee = isLast
                  ? shipFeeTotal - newRecs.reduce((a, r) => a + r.shipFee, 0)
                  : Math.round(shipFeeTotal / importItems.length);
              }
            }
            const itemTotal = calc.goodsGross + itemShipFee;
            // Chia paid theo tỉ lệ
            let itemPaid = 0;
            if (totalPaid > 0 && totalGoodsGross + shipFeeTotal > 0) {
              itemPaid = idx === importItems.length - 1
                ? totalPaid - newRecs.reduce((a, r) => a + r.paid, 0)
                : Math.round(totalPaid * itemTotal / (totalGoodsGross + shipFeeTotal));
              itemPaid = Math.max(0, Math.min(itemPaid, itemTotal));
            }
            const vtId = it._vtSelId || '';
            const rec = {
              id: 'i' + uid(), date: dateSaved, supplier,
              productId: it.productId, productName: prod?.name || '',
              qty: calc.qty, unit: prod?.unit || '',
              unitPrice: calc.price, vatRate: calc.vatRate,
              total: itemTotal, paid: itemPaid,
              variantId: vtId || null,
              shipFee: itemShipFee, shipUnit, shipVatRate, shipQty: shipQtyVal, shipUnitPrice: shipUnitP,
              status: itemPaid >= itemTotal ? 'paid' : 'debt',
              note: noteStr,
              createdAt: new Date().toISOString(),
              _updated: new Date().toISOString()
            };
            newRecs.push(rec);
          });

          // Cập nhật tồn kho — gom tất cả thay đổi theo productId rồi apply 1 lần
          // để tránh bug khi nhập nhiều dòng cùng 1 sản phẩm
          const stockDelta = {}; // productId -> { stockAdd, variantDeltas: { vtId -> qtyAdd }, lastPrice }
          newRecs.forEach((rec, idx) => {
            const it = importItems[idx];
            const calc = itemCalcs[idx];
            const vtId = it._vtSelId || '';
            if (!stockDelta[it.productId]) stockDelta[it.productId] = { stockAdd: 0, variantDeltas: {}, lastPrice: calc.price, txIds: [] };
            stockDelta[it.productId].stockAdd += calc.qty;
            stockDelta[it.productId].lastPrice = calc.price;
            stockDelta[it.productId].txIds.push(rec.id);
            if (vtId) {
              if (!stockDelta[it.productId].variantDeltas[vtId]) stockDelta[it.productId].variantDeltas[vtId] = 0;
              stockDelta[it.productId].variantDeltas[vtId] += calc.qty;
            }
          });
          S.products = S.products.map(p => {
            const delta = stockDelta[p.id];
            if (!delta) return p;
            const newStock = (parseFloat(p.stock) || 0) + delta.stockAdd;
            const newVariants = (p.variants || []).map(vt => {
              const vtAdd = delta.variantDeltas[vt.id];
              if (!vtAdd) return vt;
              const ppm2 = (vt.tileW > 0 && vt.tileH > 0) ? 10000/(vt.tileW*vt.tileH) : 0;
              const newM2 = (vt.stockM2||0) + vtAdd;
              return { ...vt, stockM2: newM2, stockPieces: ppm2 > 0 ? Math.round(newM2 * ppm2) : (vt.stockPieces||0) };
            });
            // _stockTx: đánh dấu các phiếu nhập này ĐÃ phản ánh vào stock — để
            // hoà giải đa thiết bị (applyLedgerToStock) không cộng trùng lần sau
            return { ...p, stock: newStock, buyPrice: delta.lastPrice, variants: newVariants, _updated: new Date().toISOString(),
              _stockTx: CLOUD.unionStockTx(p._stockTx, delta.txIds) };
          });

          S.imports = [...newRecs, ...S.imports];
          save('imports'); save('products');
          const totalGrandTotal = totalGoodsGross + shipFeeTotal;
          toast('✅ Đã tạo ' + newRecs.length + ' phiếu nhập · Tổng: ' + fmt(totalGrandTotal) + 'đ' + (shipFeeTotal > 0 ? ' · VC: ' + fmt(shipFeeTotal) + 'đ' : ''), 'success');
        }

        S.modal = null; rebuild(); render();
      } }, isEdit ? '💾 Lưu chỉnh sửa' : '💾 Lưu phiếu nhập')
    ]
  };
  _raf = false; render(); // Force render ngay — modal hiện tức thì
}

          } else if (hasStock) {
            sp.className = 'pl-stock-pill ' + (stk > 10 ? 'cat-stock ok' : 'cat-stock low');
            sp.textContent = fmtQty(stk) + ' ' + (p.unit||'m²');
          } else {

          if (!hasStock) sellBtn.style.background = 'rgba(232,165,58,.25)';
          if (!hasStock) sellBtn.style.color = 'var(--amber)';
          if (!hasStock) sellBtn.style.border = '1px solid rgba(232,165,58,.4)';
          sellBtn.addEventListener('click', () => openSaleWithProduct(p, rebuild));
          row.appendChild(sellBtn);

          return row;
        }

        // Phần sẵn hàng
        if (inStock2.length > 0) {
          const div1 = document.createElement('div'); div1.className = 'pl-divider';
          div1.innerHTML = '✅ Đang có hàng (' + inStock2.length + ')';
          tableWrap.appendChild(div1);
          inStock2.forEach(p => tableWrap.appendChild(makeRow(p)));
        }

        // Phần hết hàng
        if (outStock2.length > 0) {
          const div2 = document.createElement('div'); div2.className = 'pl-divider';
          div2.style.marginTop = '4px';
          div2.innerHTML = '⛔ Hết hàng (' + outStock2.length + ')';
          tableWrap.appendChild(div2);
          outStock2.forEach(p => tableWrap.appendChild(makeRow(p)));
        }

        if (filtered2.length === 0) {
          const emptyRow = document.createElement('div');
          emptyRow.style.cssText = 'text-align:center;padding:32px;color:var(--text3);font-size:13px';
          emptyRow.textContent = '🔍 Không tìm thấy sản phẩm nào';
          tableWrap.appendChild(emptyRow);
        }

        sec2.appendChild(tableWrap);
      }

      buildPriceList();

      // Wrapper chứa cả 2 section
      const wrapper = document.createElement('div');
      wrapper.appendChild(sec);
      wrapper.appendChild(sec2);
      return wrapper;
    })();

    // ── Nhóm theo ngày ──
    function buildSaleDayGroups(rows) {
      const map = {};
      rows.forEach(s => {
        const d = s.date || '0000-00-00';
        if (!map[d]) map[d] = { date: d, items: [], total: 0, paid: 0 };
        map[d].items.push(s);
        map[d].total += s.total || 0;
        map[d].paid  += s.paid  || 0;
      });
      return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
    }

    // ── 1 dòng đơn bán ──
    function renderSRow(s) {
      const shipFeeNet = (s.shipVatRate||0) > 0 ? (s.shipFee||0)/(1+s.shipVatRate/100) : (s.shipFee||0);
return h('tr', {},

                ),

                ),
