  wrap.appendChild(h('div', {style:{marginTop:14,padding:'10px 14px',background:'var(--bg3)',borderRadius:'var(--r2)',border:'1px solid var(--border)',fontSize:11,color:'var(--text3)',lineHeight:1.8}},
    '💡 <b style="color:var(--text2)">Công thức:</b> Lợi nhuận thực = Doanh thu thuần − Giá vốn hàng bán (COGS) − Phí VC cửa hàng tự chịu | COGS = Giá nhập × SL + phân bổ VC nhập | VC tự chịu: phí vận chuyển giao hàng do cửa hàng tự trả (không tính vào hoá đơn khách)'
  ));

  return wrap;
}

// ═══════════════════════════════════════════════════════════════
//  TRANG VẬN CHUYỂN — Theo dõi chi tiết, chỉ xem
//  Tổng hợp từ: imports (VC vào) + sales (VC ra)
// ═══════════════════════════════════════════════════════════════
function pgShipTrack() {
  const wrap = h('div', {});
  if (!pgShipTrack._period) pgShipTrack._period = 'month';
  if (!pgShipTrack._selDate) pgShipTrack._selDate = localDateStr(new Date());
  if (!pgShipTrack._dir) pgShipTrack._dir = 'all'; // 'all'|'in'|'out'

  const period  = pgShipTrack._period;
  const selDate = new Date(pgShipTrack._selDate);
  const dir     = pgShipTrack._dir;

  const { sales, imports } = S;

  function matchPeriod(dateStr){
    if(!dateStr)return false;
    const d=new Date(dateStr);
    if(period==='day')   return dateStr.slice(0,10)===pgShipTrack._selDate.slice(0,10);
    if(period==='month') return d.getFullYear()===selDate.getFullYear()&&d.getMonth()===selDate.getMonth();
    if(period==='year')  return d.getFullYear()===selDate.getFullYear();
    return true;
  }

  // ── Build danh sách chuyến vận chuyển ─────────────────────────
  // VC VÀO: từ phiếu nhập có shipFee > 0
  const shipIn = (imports||[]).filter(i=>matchPeriod(i.date)&&(i.shipFee||0)>0).map(i=>({
    id: i.id, date: i.date, type:'in',
    party: i.supplier||'—',
    product: i.productName||'—',
    qty: i.qty, unit: i.unit||'',
    fee: i.shipFee||0,
    vatRate: i.shipVatRate||0,
    feeNet: (i.shipVatRate||0)>0 ? Math.round((i.shipFee||0)/(1+(i.shipVatRate||0)/100)) : (i.shipFee||0),
    note: i.note||'',
    status: i.status||'done',
  }));

  // VC RA: từ phiếu bán có shipFee > 0
  const shipOut = (sales||[]).filter(s=>matchPeriod(s.date)&&(s.shipFee||0)>0).map(s=>({
    id: s.id, date: s.date, type:'out',
    party: s.customer||'—',
    product: s.productName||'—',
    qty: s.qty, unit: s.unit||'',
    fee: s.shipFee||0,
    vatRate: s.shipVatRate||0,
    feeNet: (s.shipVatRate||0)>0 ? Math.round((s.shipFee||0)/(1+(s.shipVatRate||0)/100)) : (s.shipFee||0),
    forCust: !!s.shipForCustomer,
    note: s.note||'',
    status: s.status||'done',
  }));

  let rows = [...shipIn, ...shipOut].sort((a,b)=>b.date.localeCompare(a.date));
  if(dir==='in')  rows=rows.filter(r=>r.type==='in');
  if(dir==='out') rows=rows.filter(r=>r.type==='out');

  const totIn    = shipIn.reduce((a,r)=>a+r.fee,0);
  const totOut   = shipOut.reduce((a,r)=>a+r.fee,0);
  const totInNet  = shipIn.reduce((a,r)=>a+r.feeNet,0);
  const totOutStoreNet = shipOut.filter(r=>!r.forCust).reduce((a,r)=>a+r.feeNet,0);
  const totOutCustNet  = shipOut.filter(r=>r.forCust).reduce((a,r)=>a+r.feeNet,0);

  // Period nav
  function navPeriod(d2){
    const d=new Date(pgShipTrack._selDate);
    if(period==='day')   d.setDate(d.getDate()+d2);
    if(period==='month') d.setMonth(d.getMonth()+d2);
    if(period==='year')  d.setFullYear(d.getFullYear()+d2);
    pgShipTrack._selDate=localDateStr(d);render();
  }
  function periodLabel(){
    if(period==='day')   return 'Ngày '+selDate.toLocaleDateString('vi-VN');
    if(period==='month') return 'Tháng '+(selDate.getMonth()+1)+'/'+selDate.getFullYear();
    if(period==='year')  return 'Năm '+selDate.getFullYear();
    return '';
  }

  // Header
  wrap.appendChild(h('div', {className:'page-header'},
    h('div', {},
      h('div', {className:'page-title'}, '🚛 Vận Chuyển'),
      h('div', {className:'page-sub'}, 'Theo dõi vận chuyển hàng đến và hàng đi · Chỉ xem')
    ),
    h('div', {style:{display:'flex',alignItems:'center',gap:6,background:'rgba(76,175,125,.1)',border:'1px solid rgba(76,175,125,.25)',borderRadius:'var(--r2)',padding:'6px 14px',fontSize:12,color:'var(--green)',fontWeight:700}}, '🔒 Chỉ xem')
  ));

  // Period bar
  wrap.appendChild(h('div', {style:{display:'flex',alignItems:'center',gap:8,marginBottom:18,flexWrap:'wrap'}},
    h('div', {style:{display:'flex',gap:4}},
      ...['day','month','year'].map(p=>h('button',{
        className:'btn btn-sm'+(period===p?' btn-primary':''),
        onClick:()=>{pgShipTrack._period=p;render();}
      },p==='day'?'📅 Ngày':p==='month'?'📆 Tháng':'🗓️ Năm'))
    ),
    h('div', {style:{display:'flex',alignItems:'center',gap:6,background:'var(--bg3)',borderRadius:'var(--r2)',padding:'4px 10px',border:'1px solid var(--border2)'}},
      h('button',{className:'btn btn-ghost btn-sm',style:{padding:'2px 8px'},onClick:()=>navPeriod(-1)},'◀'),
      h('span',{style:{fontWeight:700,fontSize:13,color:'var(--accent)',minWidth:140,textAlign:'center'}},periodLabel()),
      h('button',{className:'btn btn-ghost btn-sm',style:{padding:'2px 8px'},onClick:()=>navPeriod(1)},'▶'),
      h('button',{className:'btn btn-ghost btn-sm',style:{fontSize:11,color:'var(--text3)'},onClick:()=>{pgShipTrack._selDate=localDateStr(new Date());render();}},'Hôm nay')
    )
  ));

  // KPI
  const kpiDiv=document.createElement('div'); kpiDiv.className='ship-kpi';
  [
    {label:'VC Hàng Đến',val:fmt(totIn)+'đ',sub:shipIn.length+' chuyến nhập',color:'var(--green)',icon:'📥'},
    {label:'VC Hàng Đi',val:fmt(totOut)+'đ',sub:shipOut.length+' chuyến bán',color:'var(--blue)',icon:'📤'},
    {label:'VC CH Tự Chịu',val:fmt(totOutStoreNet)+'đ',sub:'Trừ vào lợi nhuận',color:'var(--amber)',icon:'🏠'},
    {label:'VC Tính Cho Khách',val:fmt(totOutCustNet)+'đ',sub:'Khách trả VC',color:'var(--text)',icon:'👤'},
  ].forEach(k=>{
    const c=document.createElement('div'); c.className='profit-kpi-card';
    c.innerHTML=`<div class="profit-kpi-label">${k.icon} ${k.label}</div><div class="profit-kpi-val" style="color:${k.color}">${k.val}</div><div class="profit-kpi-sub">${k.sub}</div>`;
    kpiDiv.appendChild(c);
  });
  wrap.appendChild(kpiDiv);

  // Filter tabs
  wrap.appendChild(h('div', {style:{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}},
    h('span',{style:{fontSize:12,color:'var(--text2)',fontWeight:600,alignSelf:'center'}},'Lọc:'),
    ...([['all','🚛 Tất cả'],['in','📥 Hàng đến'],['out','📤 Hàng đi']]).map(([v,l])=>h('button',{
      className:'btn btn-sm'+(dir===v?' btn-primary':''),
      onClick:()=>{pgShipTrack._dir=v;render();}
    },l))
  ));

  // Table
  const tblWrap=document.createElement('div'); tblWrap.className='ship-tbl-wrap'; tblWrap.style.overflowX='auto';
  const tbl=document.createElement('table'); tbl.className='ship-tbl';
  tbl.innerHTML=`<thead><tr>
    <th>Loại</th>
    <th>Ngày</th>
    <th>Đối Tác</th>
    <th>Sản Phẩm</th>
    <th>Số Lượng</th>
    <th>Phí VC (gộp VAT)</th>
    <th>Phí VC (thuần)</th>
    <th>Ghi Chú</th>
  </tr></thead>`;
  const tbody=document.createElement('tbody');

  if(!rows.length){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td colspan="8" style="text-align:center;padding:48px;color:var(--text3)">Không có dữ liệu vận chuyển trong kỳ này</td>`;
    tbody.appendChild(tr);
  } else {
    rows.forEach(r=>{
      const tr=document.createElement('tr');
      const badge=r.type==='in'
        ? `<span class="ship-badge-in">📥 Hàng Đến</span>`
        : (r.forCust
          ? `<span class="ship-badge-out">📤 Giao KH</span>`
          : `<span class="ship-badge-out" style="color:var(--amber);border-color:rgba(232,165,58,.3);background:rgba(232,165,58,.12)">📤 CH Tự Chịu</span>`);
      tr.innerHTML=`
        <td>${badge}</td>
        <td style="white-space:nowrap;color:var(--text2);font-size:12px">${fmtD(r.date)}</td>
        <td style="font-weight:600;font-size:12px">${escHtml(r.party)}</td>
        <td style="font-size:11px;color:var(--text2)">${escHtml(r.product)}</td>
        <td style="font-size:12px;text-align:right">${fmtQty(r.qty)} ${escHtml(r.unit)}</td>
        <td style="text-align:right;font-weight:600">${fmt(r.fee)}đ${r.vatRate?` <span style="font-size:10px;color:var(--blue)">(VAT ${r.vatRate}%)</span>`:''}</td>
        <td style="text-align:right;color:var(--text2)">${fmt(r.feeNet)}đ</td>
        <td style="font-size:11px;color:var(--text3);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(r.note||'—')}</td>`;
      tbody.appendChild(tr);
    });
    // Totals row
    const tftr=document.createElement('tr');
    tftr.style.cssText='background:var(--bg3);font-weight:700;border-top:2px solid var(--accent)';
    const filteredFee=rows.reduce((a,r)=>a+r.fee,0);
    const filteredNet=rows.reduce((a,r)=>a+r.feeNet,0);
    tftr.innerHTML=`
      <td colspan="5" style="font-size:12px;color:var(--accent)">📊 TỔNG (${rows.length} chuyến)</td>
      <td style="text-align:right;font-size:12px">${fmt(filteredFee)}đ</td>
      <td style="text-align:right;font-size:12px;color:var(--text2)">${fmt(filteredNet)}đ</td>
      <td></td>`;
    tbody.appendChild(tftr);
  }
  tbl.appendChild(tbody);
  tblWrap.appendChild(tbl);
  wrap.appendChild(tblWrap);

  wrap.appendChild(h('div', {style:{marginTop:14,padding:'10px 14px',background:'var(--bg3)',borderRadius:'var(--r2)',border:'1px solid var(--border)',fontSize:11,color:'var(--text3)',lineHeight:1.8}},
    '💡 <b style="color:var(--text2)">Hàng Đến:</b> VC nhập hàng từ nhà cung cấp | <b style="color:var(--text2)">Hàng Đi (Giao KH):</b> Khách trả phí, in lên hoá đơn | <b style="color:var(--text2)">Hàng Đi (CH Tự Chịu):</b> Cửa hàng chịu phí, trừ vào lợi nhuận | Dữ liệu lấy từ phiếu Nhập hàng & Bán hàng'
  ));

  return wrap;
}

// ═══════════════════════════════════════════════════════════════
//  AI CHATBOX — Báo giá thông minh + Xuất PDF
//  v1.0 — tích hợp Claude API (Anthropic)
//  Floating button góc phải, context = S.products
// ═══════════════════════════════════════════════════════════════
const AICHAT = (() => {
  // ── Config ─────────────────────────────────────────────────
  const CFG_KEY = 'dtn_aichat_cfg';

  // Danh sách provider + model mặc định
  const PROVIDERS = {
    claude: {
      label: 'Claude (Anthropic)',
      icon: '🟠',
      models: [
        { id: 'claude-sonnet-4-5', label: 'Claude Sonnet 4.5 (Khuyến nghị)' },
        { id: 'claude-haiku-4-5-20251001', label: 'Claude Haiku 4.5 (Nhanh/rẻ)' },
        { id: 'claude-opus-4-5-20251101', label: 'Claude Opus 4.5 (Mạnh nhất)' },
      ],
      keyPlaceholder: 'sk-ant-api03-...',
      keyPrefix: 'sk-ant',
      keyHint: 'Lấy tại <b>console.anthropic.com</b> → API Keys'
    },
    openai: {
      label: 'ChatGPT (OpenAI)',
      icon: '🟢',
      models: [
        { id: 'gpt-4o', label: 'GPT-4o (Khuyến nghị)' },
        { id: 'gpt-4o-mini', label: 'GPT-4o Mini (Nhanh/rẻ)' },
        { id: 'gpt-4-turbo', label: 'GPT-4 Turbo' },
        { id: 'o3-mini', label: 'o3-mini (Lý luận)' },
      ],
      keyPlaceholder: 'sk-...',
      keyPrefix: 'sk-',
      keyHint: 'Lấy tại <b>platform.openai.com</b> → API Keys'
    },
    gemini: {
      label: 'Gemini (Google)',
      icon: '🔵',
      models: [
        { id: 'gemini-2.5-flash', label: 'Gemini 2.5 Flash (Khuyến nghị)' },
        { id: 'gemini-2.5-pro', label: 'Gemini 2.5 Pro (Mạnh nhất)' },
        { id: 'gemini-2.0-flash', label: 'Gemini 2.0 Flash (Nhanh)' },
      ],
      keyPlaceholder: 'AIzaSy...',
      keyPrefix: 'AIza',
      keyHint: 'Lấy tại <b>aistudio.google.com</b> → Get API key'
    }
  };

  const DEF_CFG = { provider: 'gemini', model: 'gemini-2.5-flash', keys: {}, enabled: false };

  function parseCfg(v) {
    try {
      const c = JSON.parse(v);
      if (c.apiKey && !c.keys) {
        return { ...DEF_CFG, provider: 'claude', model: 'claude-sonnet-4-5', keys: { claude: c.apiKey }, enabled: c.enabled || false };
      }
      return { ...DEF_CFG, ...c };
    } catch(e) { return { ...DEF_CFG }; }
  }

  function loadCfg() {
    try {
      const v = localStorage.getItem(CFG_KEY);
      return v ? parseCfg(v) : { ...DEF_CFG };
    } catch(e) { return { ...DEF_CFG }; }
  }

  function saveCfg(cfg) {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e) {}
    // ── Sync lên Firestore nếu cloud đang bật ──
    _pushCfgToCloud(cfg);
  }

  // ── Push AI config lên Firestore (per-shop) ─────────────────
  function _pushCfgToCloud(cfg) {
    try {
      const cloudCfg = CLOUD.getCfg();
      if (!cloudCfg.enabled) return;
      if (typeof firebase === 'undefined' || !firebase.apps.length) return;
      const db = firebase.firestore();
      const shopId = cloudCfg.shopId || 'shop1';
      db.collection('shops').doc(shopId).collection('aichat_cfg').doc('config')
        .set({ ...cfg, _updated: new Date().toISOString() })
        .catch(e => console.warn('[AICHAT] cloud push error:', e));
    } catch(e) {}
  }

  // ── Pull AI config từ Firestore về localStorage ──────────────
  async function _pullCfgFromCloud() {
    try {
      const cloudCfg = CLOUD.getCfg();
      if (!cloudCfg.enabled) return null;
      if (typeof firebase === 'undefined') return null;
      // Chờ Firebase apps init nếu chưa sẵn sàng (retry tối đa 3s)
      let retries = 0;
      while (!firebase.apps.length && retries < 6) {
        await new Promise(r => setTimeout(r, 500));
        retries++;
      }
      if (!firebase.apps.length) return null;
      const db = firebase.firestore();
      const shopId = cloudCfg.shopId || 'shop1';
      const snap = await db.collection('shops').doc(shopId).collection('aichat_cfg').doc('config').get();
      if (!snap.exists) return null;
      const data = snap.data();
      const { _updated, ...cfg } = data;
      // Merge: cloud thắng nếu có key; local giữ nếu cloud không có
      const local = loadCfg();
      const merged = { ...DEF_CFG, ...local, ...cfg };
      // Merge keys riêng để không mất key local chưa push
      merged.keys = { ...(local.keys || {}), ...(cfg.keys || {}) };
      try { localStorage.setItem(CFG_KEY, JSON.stringify(merged)); } catch(e) {}
      return merged;
    } catch(e) { console.warn('[AICHAT] cloud pull error:', e); return null; }
  }

  // ── State chatbox ───────────────────────────────────────────
  let _open = false;
  let _messages = [];
  let _loading = false;
  let _cfg = loadCfg();
  let _container = null;

  // ── Build system prompt với dữ liệu sản phẩm THỜI GIAN THỰC ──
  function buildSystemPrompt() {
    // Luôn đọc thẳng từ S (state toàn cục, được cập nhật realtime bởi Firestore listener)
    const products = (S.products || []).filter(p => !p._deleted);
    const settings = S.settings || {};
    const shopName = settings.shopName || 'Đá Tự Nhiên Linh Vũ';
    const phone = settings.phone || '';
    const address = settings.address || '';

    const productList = products.map(p => {
      // KHÔNG đưa tồn kho vào prompt — tránh AI báo hàng còn/hết với khách
      let line = `- ID:${p.id} | SKU:${p.sku||'—'} | Tên: ${p.name} | Loại: ${p.type||''} | Xuất xứ: ${p.origin||''} | Đơn vị: ${p.unit||''} | Giá bán: ${p.sellPrice||0}đ`;
      if (p.description) line += ` | Mô tả: ${p.description}`;
      if (p.variants && p.variants.length > 0) {
        line += ` | Quy cách: ` + p.variants.map(v => `${v.tileW||'?'}x${v.tileH||'?'}${v.tileThickness?'x'+v.tileThickness:''}cm`).join(', ');
      }
      return line;
    }).join('\n');

    const _now = new Date();
    const _pad = n => String(n).padStart(2,'0');
    const todayLocal = `${_now.getFullYear()}-${_pad(_now.getMonth()+1)}-${_pad(_now.getDate())}`;

    return `Bạn là trợ lý bán hàng thông minh của cửa hàng "${shopName}".
Địa chỉ: ${address} | Hotline: ${phone}
Ngày hiện tại: ${todayLocal}

DANH SÁCH SẢN PHẨM (cập nhật thời gian thực từ hệ thống):
${productList || '(Chưa có sản phẩm nào)'}

NHIỆM VỤ:
1. Trả lời câu hỏi về sản phẩm, giá cả một cách tự nhiên, thân thiện.
2. Khi người dùng yêu cầu tạo báo giá hoặc gửi báo giá (ví dụ: "báo giá đá granite 50m²", "gửi báo giá đá marble cho khách Nguyễn Văn A số 100m²", "tạo báo giá cho anh Tuấn 0901234567 đá travertine 30m²"), hãy:
   - QUY TẮC CHỌN SẢN PHẨM (bắt buộc tuân thủ nghiêm ngặt):
     a) Chỉ chọn sản phẩm khi tên trong DANH SÁCH SẢN PHẨM khớp với TẤT CẢ từ khoá mô tả người dùng nêu, đặc biệt là MÀU SẮC (vàng, nâu, xám, xanh, đen, trắng...) và quy cách/kích thước.
     b) Ví dụ: người dùng hỏi "đá rối vàng nâu đất" mà danh sách chỉ có "Đá Rối Màu Xám" và "Đá Rối Vàng Ánh Kim" → KHÔNG được chọn sản phẩm nào (màu "xám" ≠ "vàng nâu đất", "ánh kim" ≠ "nâu đất") → áp dụng mục 3 bên dưới.
     c) TUYỆT ĐỐI KHÔNG đoán hoặc lấy sản phẩm "gần giống" khi màu sắc/tên không khớp — báo giá sai sản phẩm gây thiệt hại thực tế cho cửa hàng.
     d) productId và productName PHẢI sao chép NGUYÊN VĂN từ danh sách ở trên, không được tự bịa hoặc sửa tên.
   - Nếu người dùng đề cập tên khách hàng → điền vào customerName
   - Nếu người dùng đề cập số điện thoại khách → điền vào customerPhone

  // ── Gọi AI API — hỗ trợ Claude / OpenAI / Gemini ──────────
  async function callAI(userMessage) {
    const cfg = loadCfg();
    const provider = cfg.provider || 'claude';
    const apiKey = (cfg.keys || {})[provider] || '';
    if (!apiKey) throw new Error(`Chưa nhập API key cho ${PROVIDERS[provider]?.label}. Vào ⚙️ Cài đặt AI.`);

    const systemPrompt = buildSystemPrompt();
    const history = _messages
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .map(m => ({ role: m.role, content: m.text }));

    // ── Claude ──
    if (provider === 'claude') {
      const model = cfg.model || 'claude-sonnet-4-5';
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model,
          max_tokens: 2000,
          system: systemPrompt,
          messages: [...history, { role: 'user', content: userMessage }]
        })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `Lỗi Claude API: ${resp.status}`);
      }
      const data = await resp.json();
      return data.content[0]?.text || '';
    }

    // ── OpenAI / ChatGPT ──
    if (provider === 'openai') {
      const model = cfg.model || 'gpt-4o';
      const messages = [
        { role: 'system', content: systemPrompt },
        ...history,
        { role: 'user', content: userMessage }
      ];
      const resp = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({ model, max_tokens: 2000, messages })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `Lỗi OpenAI API: ${resp.status}`);
      }
      const data = await resp.json();
      return data.choices[0]?.message?.content || '';
    }

    // ── Gemini ──
    if (provider === 'gemini') {
      const model = cfg.model || 'gemini-2.5-flash';
      // Ghép system prompt vào message đầu tiên
      const contents = [];
      if (history.length > 0) {
        history.forEach(m => contents.push({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
      }
      contents.push({ role: 'user', parts: [{ text: userMessage }] });
      const resp = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents,
            generationConfig: { maxOutputTokens: 2000 }
          })
        }
      );
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `Lỗi Gemini API: ${resp.status}`);
      }
      const data = await resp.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

    throw new Error('Provider không được hỗ trợ: ' + provider);
  }

  // ── Parse quotation từ response ─────────────────────────────
  function parseQuotation(text) {
    const match = text.match(/<QUOTATION>([\s\S]*?)<\/QUOTATION>/);
    if (!match) return null;
    try {
      const q = JSON.parse(match[1].trim());
      // Đối chiếu từng dòng với kho hàng thật: ưu tiên khớp ID, sau đó khớp tên
      // (không phân biệt hoa thường) — tránh AI gắn nhầm tên/ảnh sản phẩm khác
      if (q.items) {
        const activeProducts = (S.products || []).filter(p => !p._deleted);
        const norm = s => (s || '').toString().toLowerCase().replace(/\s+/g, ' ').trim();
        q.items = q.items.map(item => {
          const prod = activeProducts.find(p => p.id === item.productId)
                    || activeProducts.find(p => norm(p.name) === norm(item.productName));
          if (prod) {
            // Đồng bộ lại ID + tên theo dữ liệu thật để báo giá luôn đúng sản phẩm
            return { ...item, productId: prod.id, productName: prod.name, unit: item.unit || prod.unit || '', image: prod.image || '', description: prod.description || '' };
          }
          // Không tìm thấy trong kho → đánh dấu để hiển thị cảnh báo
          return { ...item, image: '', description: '', _unverified: true };
        });
      }
      return q;
    } catch(e) { return null; }
  }

  // ── Xoá thẻ QUOTATION khỏi text hiển thị ──────────────────
  function cleanText(text) {
    return text.replace(/<QUOTATION>[\s\S]*?<\/QUOTATION>/g, '').trim();
  }

  // ── Format số VND ────────────────────────────────────────────
  function fmtVND(n) { return new Intl.NumberFormat('vi-VN').format(Math.round(n)||0); }

  // ── Tải file PDF thực về máy (Blob download) ────────────────
  function downloadQuotationPDF(q) {
    try {
      const html = buildQuotationPDF(q);
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      // Tên file: BaoGia_TenKhach_NgayThang.html
      const _now = new Date();
      const _pad = n => String(n).padStart(2,'0');
      const dateTag = `${_now.getFullYear()}${_pad(_now.getMonth()+1)}${_pad(_now.getDate())}`;
      const custTag = (q.customerName || 'KhachHang').replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_àáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđÀÁẢÃẠĂẮẰẲẴẶÂẤẦẨẪẬÈÉẺẼẸÊẾỀỂỄỆÌÍỈĨỊÒÓỎÕỌÔỐỒỔỖỘƠỚỜỞỠỢÙÚỦŨỤƯỨỪỬỮỰỲÝỶỸỴĐ]/g,'');
      const fname = `BaoGia_${custTag}_${dateTag}.html`;

      // Thử Web Share API (share file thực, hoạt động iOS/Android)
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && navigator.share && navigator.canShare) {
        const file = new File([blob], fname, { type: 'text/html' });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Báo Giá - ' + (q.customerName || 'Quý Khách') })
            .catch(e => { if (e.name !== 'AbortError') _fallbackDownload(url, fname); });
          return;
        }
      }
      _fallbackDownload(url, fname);
    } catch(e) {
      toast('❌ Không thể tải file: ' + (e.message||e), 'error');
    }
  }

  function _fallbackDownload(url, fname) {
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    // Hướng dẫn rõ ràng: file .html mở bằng trình duyệt, sau đó in/lưu PDF
    toast('📥 Đã tải file báo giá (.html) — Mở bằng trình duyệt, chọn In → Lưu PDF để có file PDF chuẩn!', 'info', 5000);
  }

  // ── Render quotation card trong bubble ───────────────────────
  function renderQuotationCard(q, container) {
    const card = document.createElement('div');
    card.className = 'aichat-quotation-card';

    // Header card — hiển thị thông tin khách nếu có
    let headerHtml = `<div class="qc-title">💰 Báo giá tự động</div>`;
    if (q.customerName || q.customerPhone) {
      headerHtml += `<div style="font-size:11px;color:#9a9590;margin-bottom:6px;padding:0 2px">`;
      if (q.customerName)  headerHtml += `👤 ${q.customerName}`;
      if (q.customerPhone) headerHtml += ` &nbsp;📞 ${q.customerPhone}`;
      if (q.customerAddress) headerHtml += `<br>📍 ${q.customerAddress}`;
      headerHtml += `</div>`;
    }
    card.innerHTML = headerHtml;

    (q.items || []).forEach(item => {
      const row = document.createElement('div');
      row.className = 'qc-item';
      const imgEl = item.image
        ? `<img class="qc-img" src="${item.image}" alt="">`
        : `<div class="qc-img-ph">💎</div>`;
      const warnHtml = item._unverified
        ? `<br><span style="font-size:10px;color:#e8a53a;font-weight:700">⚠️ Không khớp sản phẩm nào trong kho — kiểm tra lại trước khi gửi khách!</span>`
        : '';
      row.innerHTML = `${imgEl}
        <div class="qc-name">${item.productName||''}${warnHtml}<br><span style="font-size:10px;color:#9a9590;font-weight:400">${item.qty} ${item.unit||''} × ${fmtVND(item.unitPrice)}đ</span></div>
        <div class="qc-price">${fmtVND(item.total)}đ</div>`;
      card.appendChild(row);
    });

    const total = document.createElement('div');
    total.className = 'qc-total';
    total.innerHTML = `<span>TỔNG CỘNG</span><span>${fmtVND(q.grandTotal)}đ</span>`;
    card.appendChild(total);

    const actions = document.createElement('div');
    actions.className = 'qc-actions';
    actions.style.cssText = 'flex-wrap:wrap;gap:5px';

    // Nút 1: Xem / In PDF (mở overlay)
    const btnView = document.createElement('button');
    btnView.className = 'qc-btn pdf';
    btnView.innerHTML = '📄 Xem & In';
    btnView.title = 'Xem trước và in báo giá';
    btnView.onclick = () => {
      const html = buildQuotationPDF(q);
      openPdfMobile(html, 'Báo giá - ' + (q.customerName || 'Quý Khách'));
    };

    // Nút 2: Tải file PDF về máy / Chia sẻ trên mobile
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const btnDL = document.createElement('button');
    btnDL.className = 'qc-btn pdf';
    btnDL.style.background = '#4caf7d';
    btnDL.style.color = '#fff';
    btnDL.innerHTML = isMobile ? '📤 Chia sẻ file' : '📥 Tải file';
    btnDL.title = isMobile ? 'Chia sẻ file báo giá qua Zalo, Gmail...' : 'Tải file báo giá về máy';
    btnDL.onclick = () => downloadQuotationPDF(q);

    // Nút 3: Lưu vào trang Báo Giá
    const btnSave = document.createElement('button');
    btnSave.className = 'qc-btn save';
    btnSave.innerHTML = '💾 Lưu vào hệ thống';
    btnSave.onclick = () => {
      S.page = 'quotation';
      S._aiQuotationDraft = q;
      render();
      document.getElementById('aichat-panel')?.classList.remove('open');
      _open = false;
      toast('💡 Đã chuyển sang trang Báo Giá với dữ liệu từ AI', 'info');
    };

    actions.appendChild(btnView);
    actions.appendChild(btnDL);
    actions.appendChild(btnSave);
    card.appendChild(actions);
    container.appendChild(card);
  }

  // ── Add message vào chat ─────────────────────────────────────
  function addMessage(role, text, quotation) {
    const msgs = document.getElementById('aichat-msgs');
    if (!msgs) return;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;' + (role === 'user' ? 'align-items:flex-end' : 'align-items:flex-start');

    const bubble = document.createElement('div');
    bubble.className = 'aichat-bubble ' + role;
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (quotation && role === 'assistant') {
      renderQuotationCard(quotation, wrap);
    }

    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return wrap;
  }

  function addError(text) {
    const msgs = document.getElementById('aichat-msgs');
    if (!msgs) return;
    const b = document.createElement('div');
    b.className = 'aichat-bubble error';
    b.textContent = '⚠️ ' + text;
    msgs.appendChild(b);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addLoading() {
    const msgs = document.getElementById('aichat-msgs');
    if (!msgs) return null;
    const b = document.createElement('div');
    b.className = 'aichat-bubble ai loading';
    b.id = 'aichat-loading-bubble';
    b.innerHTML = '<span style="letter-spacing:2px">●●●</span>';
    // Animate dots
    let d = 0;
    const dots = ['●○○','○●○','○○●','○●○'];
    b._iv = setInterval(() => { b.innerHTML = `<span style="letter-spacing:2px">${dots[d++ % dots.length]}</span>`; }, 300);
    msgs.appendChild(b);
    msgs.scrollTop = msgs.scrollHeight;
    return b;
  }

  function removeLoading(el) {
    if (el) { clearInterval(el._iv); el.remove(); }
  }

  // ── Gửi message ─────────────────────────────────────────────
  async function sendMessage(text) {
    if (!text.trim() || _loading) return;
    _loading = true;

    const input = document.getElementById('aichat-input');
    const sendBtn = document.getElementById('aichat-send');
    const sub = document.getElementById('aichat-head-sub');
    if (input) input.value = '';
    if (sendBtn) sendBtn.disabled = true;
    if (sub) sub.textContent = 'Đang xử lý...';

    addMessage('user', text);
    _messages.push({ role: 'user', text });
    const loadEl = addLoading();

    try {
      const raw = await callAI(text);
      removeLoading(loadEl);
      const q = parseQuotation(raw);
      const clean = cleanText(raw);
      addMessage('assistant', clean || '(Không có nội dung)', q || undefined);
      _messages.push({ role: 'assistant', text: clean });

      // Badge notification nếu panel đóng
      if (!_open) {
        const badge = document.getElementById('aichat-badge');
        if (badge) { badge.style.display = 'flex'; badge.textContent = '1'; }
      }
    } catch(e) {
      removeLoading(loadEl);
      addError(e.message || 'Lỗi không xác định');
    } finally {
      _loading = false;
      if (sendBtn) sendBtn.disabled = false;
      if (sub) sub.textContent = 'Sẵn sàng hỗ trợ';
    }
  }

  // ── Init chatbox ─────────────────────────────────────────────
  async function init() {
    if (document.getElementById('aichat-root')) return;
    const dom = createChatboxDOM();
    document.body.appendChild(dom);
    _container = dom;

    // Pull AI config từ cloud (nếu cloud đang bật) — sync key về thiết bị này
    try {
      const pulled = await _pullCfgFromCloud();
      if (pulled) {
        _cfg = pulled;
        // Đảm bảo localStorage đã được cập nhật với config từ cloud
        try { localStorage.setItem(CFG_KEY, JSON.stringify(pulled)); } catch(e) {}
        // Refresh header sub-text sau khi pull key từ cloud
        try {
          const sub = document.getElementById('aichat-head-sub');
          if (sub && pulled.provider && PROVIDERS[pulled.provider]) {
            const prov = PROVIDERS[pulled.provider];
            const model = prov.models.find(m => m.id === pulled.model);
            sub.textContent = prov.icon + ' ' + (model ? model.label.split('(')[0].trim() : prov.label);
          }
          // Nếu settings panel đang mở, refresh lại input key
          const keyInput = document.getElementById('aichat-apikey-input');
          if (keyInput && pulled.keys && pulled.provider) {
            keyInput.value = (pulled.keys[pulled.provider] || '');
          }
        } catch(_e) {}
      }
    } catch(e) {}

    const fab          = document.getElementById('aichat-fab');
    const panel        = document.getElementById('aichat-panel');
    const badge        = document.getElementById('aichat-badge');
    const input        = document.getElementById('aichat-input');
    const sendBtn      = document.getElementById('aichat-send');
    const settingsPanel= document.getElementById('aichat-settings');
    const btnSettings  = document.getElementById('aichat-btn-settings');
    const btnClose     = document.getElementById('aichat-btn-close');
    const btnSaveKey   = document.getElementById('aichat-save-key');
    const btnBackChat  = document.getElementById('aichat-back-chat');
    const keyInput     = document.getElementById('aichat-apikey-input');
    const modelSel     = document.getElementById('aichat-model-select');
    const keyHint      = document.getElementById('aichat-key-hint');
    const keyLabel     = document.getElementById('aichat-key-label');
    const headSub      = document.getElementById('aichat-head-sub');

    let _activeProv = loadCfg().provider || 'claude';

    // ── Cập nhật UI settings khi đổi provider ──
    function refreshSettingsUI(prov) {
      _activeProv = prov;
      const cfg = loadCfg();
      const info = PROVIDERS[prov];

      // Active tab
      document.querySelectorAll('.ai-provider-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.prov === prov);
      });

      // Models dropdown
      modelSel.innerHTML = '';
      info.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label;
        if (m.id === cfg.model && cfg.provider === prov) opt.selected = true;
        modelSel.appendChild(opt);
      });
      // Nếu provider khác với cấu hình hiện tại, chọn model đầu tiên
      if (cfg.provider !== prov) modelSel.value = info.models[0].id;

      // Key
      keyLabel.textContent = `API Key — ${info.label}`;
      keyInput.placeholder = info.keyPlaceholder;
      keyInput.value = (cfg.keys || {})[prov] || '';
      const _cloudOn = CLOUD.getCfg().enabled;
      keyHint.innerHTML = info.keyHint + (_cloudOn ? '<br>🔄 <b>Key được sync lên cloud</b> — dùng được trên tất cả thiết bị khi đăng nhập.' : '<br>Key lưu cục bộ. Bật Cloud Sync để dùng trên mọi thiết bị.');

      // Status clear
      const status = document.getElementById('aichat-key-status');
      if (status) { status.textContent = ''; status.className = 'aichat-status'; }
    }

    // ── Cập nhật subtitle header ──
    function refreshHeader() {
      const cfg = loadCfg();
      const prov = PROVIDERS[cfg.provider];
      if (prov && headSub) {
        headSub.textContent = (prov.icon + ' ' + prov.label).replace(/🟠|🟢|🔵/,'').trim();
        const model = prov.models.find(m => m.id === cfg.model);
        headSub.textContent = prov.icon + ' ' + (model ? model.label.split('(')[0].trim() : prov.label);
      }
    }

    refreshSettingsUI(_activeProv);
    refreshHeader();

    // Provider tab clicks
    document.querySelectorAll('.ai-provider-tab').forEach(tab => {
      tab.addEventListener('click', () => refreshSettingsUI(tab.dataset.prov));
    });

    // ── Kéo thả FAB + Panel ──────────────────────────────────────
    const POS_KEY = 'aichat_pos';
    const fabSize = 52;
    function savePos(l, t) { try { localStorage.setItem(POS_KEY, JSON.stringify({l,t})); } catch(e) {} }
    function loadPos() { try { const v=localStorage.getItem(POS_KEY); return v?JSON.parse(v):null; } catch(e){return null;} }
    function clampPos(left, top, w, h) {
      const vw=window.innerWidth, vh=window.innerHeight;
      return { left: Math.max(8, Math.min(left, vw-w-8)), top: Math.max(8, Math.min(top, vh-h-8)) };
    }
    function applyFabPos(left, top) {
      fab.style.right='auto'; fab.style.bottom='auto';
      fab.style.left=left+'px'; fab.style.top=top+'px';
    }
    function positionPanel(fabLeft, fabTop) {
      const pw=panel.offsetWidth||380, ph=panel.offsetHeight||480;
      let pt=fabTop-ph-8;
      if(pt<8) pt=fabTop+60;
      let pl=fabLeft+26-pw/2;
      const c=clampPos(pl,pt,pw,ph);
      panel.style.right='auto'; panel.style.bottom='auto';
      panel.style.left=c.left+'px'; panel.style.top=c.top+'px';
    }

    // Phục hồi vị trí FAB đã lưu
    const savedPos = loadPos();
    if (savedPos) {
      const c = clampPos(savedPos.l, savedPos.t, fabSize, fabSize);
      applyFabPos(c.left, c.top);
    } else {
      applyFabPos(window.innerWidth-fabSize-18, window.innerHeight-fabSize-90);
    }

    // Drag engine (touch + mouse)
    function makeDraggable(handle, getEl, onEnd) {
      let _drag=false, _sx=0, _sy=0, _ol=0, _ot=0, _moved=false;
      function xy(e){ return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }
      function start(e){
        // Cho phép drag nếu target CHÍNH là handle (ví dụ FAB là button),
        // nhưng block nếu click vào button/input bên TRONG handle (vd: nút đóng trong panel header)
        if(e.target !== handle && e.target.closest('button,input,textarea,select')) return;
        _drag=true; _moved=false;
        const {x,y}=xy(e);
        _sx=x; _sy=y;
        const r=getEl().getBoundingClientRect();
        _ol=r.left; _ot=r.top;
        getEl().classList.add('dragging');
        e.preventDefault();
      }
      function move(e){
        if(!_drag) return;
        const {x,y}=xy(e);
        const dx=x-_sx, dy=y-_sy;
        if(Math.abs(dx)>8||Math.abs(dy)>8) _moved=true;
        if(!_moved) return;
        const el=getEl();
        const c=clampPos(_ol+dx, _ot+dy, el.offsetWidth, el.offsetHeight);
        el.style.right='auto'; el.style.bottom='auto';
        el.style.left=c.left+'px'; el.style.top=c.top+'px';
        e.preventDefault();
      }
      function end(){
        if(!_drag) return;
        _drag=false;
        const el=getEl();
        el.classList.remove('dragging');
        const r=el.getBoundingClientRect();
        if(onEnd) onEnd(r.left, r.top, _moved);
      }
      handle.addEventListener('touchstart', start, {passive:false});
      document.addEventListener('touchmove', move, {passive:false});
      document.addEventListener('touchend', end);
      handle.addEventListener('mousedown', start);
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', end);
    }

    // Open/close chatbox (chỉ khi không drag)
    makeDraggable(fab, ()=>fab, (l,t,moved)=>{
      savePos(l,t);
      if(!moved) {
        _open=!_open;
        panel.classList.toggle('open', _open);
        if(_open){
          if(badge) badge.style.display='none';
          positionPanel(l,t);
          if(!_messages.length){
            const pCount=(S.products||[]).length;
            const cfg=loadCfg();
            const pInfo=PROVIDERS[cfg.provider]||PROVIDERS.claude;
            addMessage('assistant',`Xin chào! 👋 Tôi là trợ lý AI của cửa hàng.\nĐang dùng: ${pInfo.icon} ${pInfo.label}\n\nDữ liệu ${pCount} sản phẩm vừa được cập nhật. Bạn có thể:\n• Hỏi về sản phẩm, giá cả, quy cách\n• "Báo giá đá granite 50m²" → tạo báo giá ngay\n• "Gửi báo giá đá marble 30m² cho anh Tuấn 0901234567" → tạo PDF có tên khách, tải về/chia sẻ\n\n📋 Tồn kho vui lòng liên hệ hotline trực tiếp.`);
          }
          setTimeout(()=>input?.focus(),100);
        }
      } else if(_open) {
        positionPanel(l,t); // cập nhật vị trí panel theo FAB mới
      }
    });

    // Kéo panel qua header
    const panelHead = document.getElementById('aichat-head');
    makeDraggable(panelHead, ()=>panel, null);

    // Resize: căn lại
    window.addEventListener('resize', ()=>{
      const r=fab.getBoundingClientRect();
      const c=clampPos(r.left, r.top, fabSize, fabSize);
      applyFabPos(c.left, c.top);
      if(_open) positionPanel(c.left, c.top);
    });

    btnClose.addEventListener('click', () => {
      _open = false;
      panel.classList.remove('open');
    });

    btnSettings.addEventListener('click', () => {
      refreshSettingsUI(_activeProv);
      settingsPanel.classList.add('open');
    });
    btnBackChat.addEventListener('click', () => {
      settingsPanel.classList.remove('open');
    });

    btnSaveKey.addEventListener('click', () => {
      const key = (keyInput?.value || '').trim();
      const status = document.getElementById('aichat-key-status');
      const prov = _activeProv;
      const info = PROVIDERS[prov];

      // Kiểm tra key prefix
      if (!key) {
        if (status) { status.textContent = '❌ Vui lòng nhập API key!'; status.className = 'aichat-status err'; }
        return;
      }

      const cfg = loadCfg();
      const newKeys = { ...(cfg.keys || {}), [prov]: key };
      const selectedModel = modelSel?.value || info.models[0].id;

      saveCfg({ ...cfg, provider: prov, model: selectedModel, keys: newKeys, enabled: true });
      refreshHeader();
      if (status) { status.textContent = `✅ Đã lưu key cho ${info.label}!`; status.className = 'aichat-status ok'; }
      setTimeout(() => settingsPanel.classList.remove('open'), 1200);
    });

    // Quick buttons
    document.querySelectorAll('.aichat-quick-btn').forEach(btn => {
      btn.addEventListener('click', () => sendMessage(btn.dataset.q));
    });

    // Send
    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 90) + 'px';
    });
  }

  function destroy() {
    const root = document.getElementById('aichat-root');
    if (root && root.parentNode) root.parentNode.removeChild(root);
    _container = null;
    _open = false;
    _messages = [];
  }

  return {
    init,
    destroy,
    syncCfgFromCloud: _pullCfgFromCloud,
    open: () => { _open = true; document.getElementById('aichat-panel')?.classList.add('open'); }
  };
})();

// ── Khởi động chatbox sau khi app render xong ────────────────
// ── Entry point duy nhất: dùng bootApp() cho cả 2 path đăng nhập.
// initMainApp() đã được xóa — nó tạo 1 bộ listener/heartbeat thứ 2
// không được theo dõi bởi _hbIv/_visibilityHandler, gây chồng chất
// listener mỗi lần đăng xuất → đăng nhập lại → dữ liệu nhân đôi.
const _startUser = AUTH.currentUser();
if (!_startUser) { showLoginScreen(); } else { bootApp(); }
</script>
