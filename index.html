<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Đá Tự Nhiên Linh Vũ">
<title>Đá Tự Nhiên Linh Vũ — Quản Lý v7.8.2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#252d3d;
  --accent:#c9a84c;--accent2:#e8c97a;--accent-dim:rgba(201,168,76,0.13);
  --text:#e8e6df;--text2:#9a9590;--text3:#5c5850;
  --border:#2a3245;--border2:#3a4560;
  --green:#4caf7d;--red:#e05c5c;--amber:#e8a53a;--blue:#5b8fe8;
  --r:12px;--r2:7px;--shadow:0 4px 24px rgba(0,0,0,0.5);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,'Be Vietnam Pro',BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:230px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1);padding-top:var(--safe-top)}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.main-inner{padding:28px;max-width:1200px;margin:0 auto}
/* ── Sidebar ── */
.logo-area{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.logo-gem{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px;box-shadow:0 2px 8px rgba(201,168,76,0.3)}
.logo-name{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:var(--text);font-weight:700;letter-spacing:.3px}
.logo-sub{font-size:11px;color:var(--text2);margin-top:3px}
.nav-scroll{flex:1;overflow-y:auto;padding:6px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:1px 8px;border-radius:var(--r2);cursor:pointer;font-size:13px;color:var(--text2);transition:all .16s;border:none;background:none;width:calc(100% - 16px);text-align:left;font-family:inherit;-webkit-user-select:none}
.nav-item:active{opacity:.7}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.nav-footer{padding:12px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text3);padding-bottom:calc(12px + var(--safe-bottom))}
/* ── Topbar mobile ── */
.topbar{display:none;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + var(--safe-top));background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.topbar-logo{display:flex;align-items:center;gap:9px;font-family:Georgia,serif;font-size:15px;font-weight:700}
.topbar-gem{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.burger{background:none;border:none;cursor:pointer;padding:7px;border-radius:var(--r2);color:var(--text);font-size:24px;line-height:1;display:flex;align-items:center}
/* ── Overlay ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:299;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.overlay.show{display:block}
/* ── Bottom nav ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:200;padding:6px 0;padding-bottom:calc(6px + var(--safe-bottom))}
.bottom-nav-row{display:flex;justify-content:space-around}
.bn-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;border:none;background:none;color:var(--text3);cursor:pointer;font-family:inherit;min-width:56px;-webkit-user-select:none}
.bn-btn.active{color:var(--accent)}
.bn-icon{font-size:22px;line-height:1}
.bn-label{font-size:9px;font-weight:600;letter-spacing:.2px}
/* ── Page header ── */
.page-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:Georgia,serif;font-size:24px;font-weight:700;letter-spacing:.2px}
.page-sub{font-size:13px;color:var(--text2);margin-top:3px}
/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--r2);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:500;-webkit-user-select:none;white-space:nowrap}
.btn:active{opacity:.75;transform:scale(.97)}
.btn-primary{background:var(--accent);color:#0f1117;border-color:var(--accent);font-weight:700}
.btn-primary:active{background:var(--accent2)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-xs{padding:4px 9px;font-size:11px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn-ghost:active{background:var(--bg3)}
/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card-title{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px}
/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;font-weight:600}
.stat-val{font-size:21px;font-weight:700;font-family:Georgia,serif;line-height:1.2}
.stat-change{font-size:11px;margin-top:7px;color:var(--text2)}
/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
th{text-align:left;padding:10px 14px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.9px;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-green{background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.3)}
.badge-red{background:rgba(224,92,92,.15);color:var(--red);border:1px solid rgba(224,92,92,.3)}
.badge-amber{background:rgba(232,165,58,.15);color:var(--amber);border:1px solid rgba(232,165,58,.3)}
.badge-blue{background:rgba(91,143,232,.15);color:var(--blue);border:1px solid rgba(91,143,232,.3)}
.badge-gold{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(201,168,76,.3)}
/* ── Forms ── */
.fg{display:grid;gap:14px}
.fg2{grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fg-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.2px}
.form-input{background:var(--bg3);border:1.5px solid var(--border2);border-radius:var(--r2);padding:10px 13px;color:var(--text);font-size:14px;font-family:inherit;transition:border-color .15s;width:100%;-webkit-appearance:none;appearance:none}
.form-input:focus{outline:none;border-color:var(--accent);background:var(--bg4)}
.form-input::placeholder{color:var(--text3)}
/* Ẩn nút spinner trên input number - tất cả trình duyệt */
input[type=number].form-input::-webkit-outer-spin-button,
input[type=number].form-input::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number].form-input{-moz-appearance:textfield;appearance:textfield}
select.form-input{cursor:pointer}
select.form-input option{background:var(--bg3);color:var(--text)}
textarea.form-input{resize:vertical;min-height:72px}
/* VAT slider */
.vat-row{display:flex;align-items:center;gap:12px}
.vat-slider{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:var(--border2);outline:none;cursor:pointer}
.vat-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 6px rgba(201,168,76,.5)}
.vat-badge{min-width:46px;text-align:center;font-weight:700;font-size:14px;color:var(--accent);background:var(--bg3);padding:4px 8px;border-radius:var(--r2);border:1px solid var(--border2)}
/* Summary box */
.sum-box{background:var(--bg3);border-radius:var(--r2);padding:14px 16px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.sum-row{display:flex;justify-content:space-between;color:var(--text2)}
.sum-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700;color:var(--accent);border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.sum-debt{display:flex;justify-content:space-between;color:var(--red);font-weight:600}
.sum-paid{display:flex;justify-content:space-between;color:var(--green)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
.modal-lg{max-width:720px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-family:Georgia,serif;font-size:18px;font-weight:700}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
/* Misc */
.empty{text-align:center;padding:52px 20px;color:var(--text3)}
.empty-icon{font-size:42px;margin-bottom:12px}
.profit-pct{font-size:12px;color:var(--green);font-weight:700}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chip{display:inline-block;background:var(--bg4);border:1px solid var(--border);border-radius:var(--r2);padding:2px 9px;font-size:11px;color:var(--text2)}
.amount-pos{color:var(--green);font-weight:700}
.amount-neg{color:var(--red);font-weight:700}
.tag-gold{display:inline-flex;align-items:center;gap:4px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(201,168,76,.3);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:700;letter-spacing:.3px}
.alert{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r2);font-size:13px;margin-bottom:14px}
.alert-warn{background:rgba(232,165,58,.1);border:1px solid rgba(232,165,58,.3);color:var(--amber)}
.alert-err{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);color:var(--red)}
/* Toast */
.toast{position:fixed;bottom:calc(80px + var(--safe-bottom));right:16px;z-index:9999;background:var(--bg2);border-radius:var(--r);padding:13px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;font-size:13px;max-width:320px;border:1px solid var(--border2);animation:slideUp .3s ease;pointer-events:none}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Data bar */
.data-bar{display:flex;align-items:center;gap:8px;background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.2);border-radius:var(--r2);padding:8px 14px;font-size:11px;color:var(--green);margin-bottom:14px}
.storage-warn-bar{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;font-size:12px;font-weight:700;animation:slideDown .3s ease}
.storage-warn-bar.warn{background:#7a4a00;color:#ffd580;border-bottom:2px solid var(--amber)}
.storage-warn-bar.danger{background:#5c1a1a;color:#ffb3b3;border-bottom:2px solid var(--red)}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
/* ── Responsive tablet ── */
@media(max-width:960px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr}
  .fg3{grid-template-columns:1fr 1fr}
}
/* ── Responsive mobile ── */
@media(max-width:640px){
  .topbar{display:flex}
  .bottom-nav{display:block}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:300;width:270px;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .app{display:block;height:auto;min-height:100vh}
  .main{display:block;overflow:visible}
  .main-inner{padding:14px 12px calc(80px + var(--safe-bottom))}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{padding:13px}.stat-val{font-size:17px}
  .page-title{font-size:20px}
  .fg2,.fg3{grid-template-columns:1fr}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:var(--r) var(--r) 0 0;max-height:94vh;padding:18px;padding-bottom:calc(18px + var(--safe-bottom))}
  .modal-lg{max-width:100%}
  .two-col{grid-template-columns:1fr}
  table{font-size:12px}
  th,td{padding:8px 10px}
  .card{padding:14px}
  .btn{font-size:12px}
  .toast{bottom:calc(70px + var(--safe-bottom));left:12px;right:12px;max-width:none}
  .page-header{margin-bottom:16px}
}
@media(prefers-color-scheme:light){
  /* Giữ dark mode vì phù hợp với đá tự nhiên */
}
/* Print */
@media print{
  .sidebar,.topbar,.bottom-nav,.btn,.modal-bg,.overlay,.toast{display:none!important}
  .app,.main{display:block;height:auto;overflow:visible}
  .main-inner{padding:0}
  body{background:#fff;color:#111}
}
@media(max-width:860px){.q3col{grid-template-columns:1fr!important}}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
let _raf = false; // render debounce flag — khai báo sớm để bootApp & logout dùng được

// ═══════════════════════════════════════════════════════════════
//  CLOUD — Firebase Firestore sync + Conflict Resolution (v7.8.2)
//
//  Chiến lược xử lý xung đột multi-device:
//  ─ Sales / Imports / Returns / Paymentlogs: APPEND-ONLY
//    → Mỗi record là 1 Firestore doc (id = record.id)
//    → Thiết bị nào tạo doc mới đều được giữ lại, không ghi đè nhau
//  ─ Products: MERGE per-field by _updated timestamp
//    → Doc nào có _updated mới hơn trên cloud thì giữ cloud version
//  ─ Settings: LAST-WRITE-WINS toàn bộ doc
//
//  Realtime listener (onSnapshot):
//    → Khi thiết bị B thay đổi, thiết bị A nhận được ngay lập tức
//    → Merge vào S + localStorage + re-render tự động
//
//  Boot flow:
//    1. Load localStorage (instant, offline)
//    2. Pull cloud → merge vào S (bắt kịp thiết bị khác)
//    3. Bắt đầu listener realtime
//    4. Mỗi save() → push ngầm lên cloud
// ═══════════════════════════════════════════════════════════════
const CLOUD = (() => {
  const CFG_KEY = 'dtn_cloud_cfg';
  let _app = null;
  let _db  = null;
  let _cfg = null;
  let _online = navigator.onLine;
  let _syncStatus = 'idle';
  let _lastSync = null;
  let _statusListeners = [];
  let _listeners = [];   // unsubscribe functions cho onSnapshot
  let _syncQueue = [];
  let _flushing = false;
  let _bootDone = false; // đã hoàn thành boot sync chưa

  // ── Load / save config ──────────────────────────────────────
  const DEFAULT_CFG = {
    apiKey:     'AIzaSyBcBGZL9-S2TJv0vZMBJYQGNc9kDLU5484',
    authDomain: 'datunhienlinhvu-42a05.firebaseapp.com',
    projectId:  'datunhienlinhvu-42a05',
    shopId:     'shop1',
    enabled:    true
  };
  function loadCfg() {
    try {
      const v = localStorage.getItem(CFG_KEY);
      _cfg = v ? JSON.parse(v) : { ...DEFAULT_CFG };
      if (!_cfg.apiKey) _cfg = { ...DEFAULT_CFG };
    } catch(e) { _cfg = { ...DEFAULT_CFG }; }
  }
  function saveCfg(cfg) {
    _cfg = cfg;
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e) {}
  }

  // ── Khởi tạo Firebase / Firestore ──────────────────────────
  function initClient() {
    loadCfg();
    if (!_cfg.enabled || !_cfg.apiKey || !_cfg.projectId) return false;
    try {
      if (typeof firebase === 'undefined') return false;
      if (!firebase.apps.length) {
        _app = firebase.initializeApp({
          apiKey:     _cfg.apiKey,
          authDomain: _cfg.authDomain || _cfg.projectId + '.firebaseapp.com',
          projectId:  _cfg.projectId,
        });
      } else {
        _app = firebase.apps[0];
      }
      _db = firebase.firestore();
      _db.enablePersistence({ synchronizeTabs: true }).catch(err => {
        // Lỗi thường gặp: multiple tabs hoặc Safari private mode — app vẫn hoạt động bình thường
        if (err.code !== 'failed-precondition' && err.code !== 'unimplemented') {
          console.warn('[CLOUD] persistence error:', err.code);
        }
      });
      return true;
    } catch(e) { console.warn('[CLOUD] Firebase init error:', e); return false; }
  }

  // ── Online/offline ──────────────────────────────────────────
  window.addEventListener('online',  () => { _online = true;  flushQueue(); notifyStatus(); });
  window.addEventListener('offline', () => { _online = false; notifyStatus(); });

  function notifyStatus() {
    _statusListeners.forEach(fn => { try { fn(getStatus()); } catch(e) {} });
  }
  function getStatus() {
    return { enabled: _cfg?.enabled||false, online:_online, syncStatus:_syncStatus,
             lastSync:_lastSync, queueLen:_syncQueue.length, realtime: _listeners.length > 0 };
  }

  // ── Đường dẫn collection ────────────────────────────────────
  function col(name) {
    return _db.collection('shops').doc(_cfg.shopId||'shop1').collection(name);
  }

  // ── Timestamp helper ─────────────────────────────────────────
  const ts = () => new Date().toISOString();

  // ═══════════════════════════════════════════════════════════
  //  MERGE LOGIC — xử lý xung đột
  // ═══════════════════════════════════════════════════════════

  // Collections append-only: giữ union của local + cloud theo id
  // Nếu cùng id mà _updated khác → lấy cái mới hơn
  function mergeAppendOnly(local, cloudDocs) {
    const map = {};
    // Đưa local vào map trước
    (local || []).forEach(r => { if (r && r.id) map[r.id] = r; });
    // Merge cloud: nếu doc mới hơn hoặc chưa có local → lấy cloud
    cloudDocs.forEach(r => {
      if (!r || !r.id) return;
      const existing = map[r.id];
      if (!existing) {
        map[r.id] = r; // doc mới từ thiết bị khác → thêm vào
      } else {
        // So sánh timestamp — lấy bản mới hơn; _deleted luôn thắng
        const localTs  = existing._updated || existing.date || '';
        const cloudTs  = r._updated || r.date || '';
        if (r._deleted) { map[r.id] = r; } // xóa thắng mọi bản
        else if (cloudTs > localTs) map[r.id] = r;
        // nếu local mới hơn: giữ local (sẽ push lên cloud sau)
      }
    });
    return Object.values(map).filter(r => !r._deleted);
  }
  // Sau đó deduplicate theo tên — tránh tình trạng 2 thiết bị tạo cùng SP offline
  function mergeProducts(local, cloudDocs) {
    const map = {};
    (local || []).forEach(p => { if (p && p.id) map[p.id] = { ...p }; });
    cloudDocs.forEach(p => {
      if (!p || !p.id) return;
      if (!map[p.id]) {
        map[p.id] = p; // sản phẩm mới từ thiết bị khác
      } else {
        const localTs = map[p.id]._updated || '';
        const cloudTs = p._updated || '';
        // Nếu cloud có _deleted:true → luôn ưu tiên (xóa thắng)
        if (p._deleted) { map[p.id] = p; }
        else if (cloudTs > localTs) map[p.id] = p;
        // local mới hơn → giữ nguyên, sẽ push lên cloud
      }
    });
    // ── Deduplicate theo tên (normalize: lowercase + trim) ──────
    // Nếu 2 sản phẩm cùng tên → giữ bản có _updated mới hơn, loại bản kia
    // (không merge stock vì stock đã được cập nhật theo phiếu nhập/bán)
    const byName = {};
    Object.values(map).forEach(p => {
      const key = (p.name || '').trim().toLowerCase();
      if (!key) return;
      if (!byName[key]) {
        byName[key] = p;
      } else {
        // Giữ bản mới hơn theo _updated; nếu bằng nhau giữ bản có id nhỏ hơn (ổn định)
        const existTs = byName[key]._updated || byName[key].createdAt || '';
        const newTs   = p._updated || p.createdAt || '';
        // _deleted luôn thắng — không được giữ stock của bản đã xóa
        if (p._deleted && !byName[key]._deleted) {
          byName[key] = p; // bản xóa thắng bản còn tồn tại
        } else if (!p._deleted && byName[key]._deleted) {
          // bản _deleted hiện tại thắng, giữ nguyên
        } else if (newTs > existTs) {
          // Bản mới hơn thắng — chỉ kế thừa stock khi cả 2 chưa bị xóa và bản mới = 0
          const winnerStock = (!p._deleted && (p.stock || 0) === 0)
            ? (byName[key].stock || 0) : (p.stock || 0);
          byName[key] = { ...p, stock: winnerStock };
        } else {
          // Bản cũ thắng
          const winnerStock = (!byName[key]._deleted && (byName[key].stock || 0) === 0)
            ? (p.stock || 0) : (byName[key].stock || 0);
          byName[key] = { ...byName[key], stock: winnerStock };
        }
      }
    });
    return Object.values(byName).filter(p => !p._deleted);
  }
  function applyCloudData(colName, cloudDocs, skipRender) {
    if (!window._S) return;
    const S = window._S;
    let changed = false;
    const colMap = {
      dtn_sales:           'sales',
      dtn_imports:         'imports',
      dtn_returns:         'returns',
      dtn_paymentlogs:     'paymentlogs',
      dtn_products:        'products',
      dtn_settings:        'settings',
      dtn_staff_accounts:  'staff_accounts',
      dtn_admin_cred:      'admin_cred',
    };
    const stateKey = colMap[colName];
    if (!stateKey) return;

    if (stateKey === 'admin_cred') {
      // Thông tin đăng nhập admin — merge vào localStorage (AUTH quản lý)
      // Chỉ apply nếu cloud mới hơn local (so sánh _updated)
      if (cloudDocs.length > 0) {
        try {
          const cloudCred = cloudDocs.find(d => d.id === 'admin_cred');
          if (cloudCred) {
            const localRaw = localStorage.getItem('dtn_admin_cred');
            const localCred = localRaw ? JSON.parse(localRaw) : null;
            const cloudTs = cloudCred._updated || '';
            const localTs = (localCred && localCred._updated) || '';
            // Áp dụng cloud nếu cloud mới hơn hoặc local chưa có _updated
            if (!localTs || cloudTs > localTs) {
              const { id, _updated, ...credData } = cloudCred;
              // Lưu thêm _updated để so sánh lần sau
              localStorage.setItem('dtn_admin_cred', JSON.stringify({ ...credData, _updated: cloudTs }));
              changed = true;
            }
          }
        } catch(e) {}
      }
    } else if (stateKey === 'staff_accounts') {
      // Tài khoản nhân viên — merge vào localStorage trực tiếp (AUTH quản lý)
      if (cloudDocs.length > 0) {
        try {
          const existing = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
          const map = {};
          existing.forEach(s => { if (s && s.id) map[s.id] = s; });
          cloudDocs.forEach(s => {
            if (!s || !s.id) return;
            const localTs = (map[s.id] && (map[s.id]._updated || map[s.id].createdAt)) || '';
            const cloudTs = s._updated || s.createdAt || '';
            if (!map[s.id] || cloudTs > localTs) map[s.id] = s;
          });
          const merged = Object.values(map);
          localStorage.setItem('dtn_staff_accounts', JSON.stringify(merged));
          changed = true;
        } catch(e) {}
      }
    } else if (stateKey === 'settings') {
      if (cloudDocs.length > 0) {
        const merged = { ...S.settings, ...cloudDocs[0] };
        delete merged.id; delete merged._updated;
        const before = JSON.stringify(S.settings);
        S.settings = merged;
        if (JSON.stringify(S.settings) !== before) changed = true;
      }
    } else if (stateKey === 'products') {
      const before = JSON.stringify(S.products);
      S.products = mergeProducts(S.products, cloudDocs);
      if (JSON.stringify(S.products) !== before) changed = true;
    } else {
      const before = JSON.stringify(S[stateKey]);
      S[stateKey] = mergeAppendOnly(S[stateKey], cloudDocs);
      if (JSON.stringify(S[stateKey]) !== before) changed = true;
    }

    if (changed) {
      // Cập nhật localStorage
      const dbMap = {
        sales:'dtn_sales', imports:'dtn_imports', returns:'dtn_returns',
        paymentlogs:'dtn_paymentlogs', products:'dtn_products', settings:'dtn_settings'
      };
      if (dbMap[stateKey]) {
        try {
          const val = stateKey === 'settings' ? S.settings : S[stateKey];
          if (typeof DB !== 'undefined') DB.set(dbMap[stateKey], val);
        } catch(e) {}
      }
      if (!skipRender) {
        // Re-render nhẹ nhàng, không làm mất focus
        try {
          if (typeof render === 'function') render();
          // Toast thông báo có dữ liệu mới
          if (typeof toast === 'function') {
            const labels = { sales:'đơn hàng', imports:'phiếu nhập', returns:'hoàn trả',
                             paymentlogs:'thanh toán', products:'sản phẩm', settings:'cài đặt' };
            toast(`🔄 Đồng bộ: ${labels[stateKey]||stateKey} vừa được cập nhật từ thiết bị khác`, 'info');
          }
        } catch(e) {}
      }
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  REALTIME LISTENERS
  // ═══════════════════════════════════════════════════════════
  function startListeners() {
    if (!_db || !_cfg.enabled) return;
    // Dừng listener cũ nếu có
    stopListeners();

    const collections = ['dtn_sales','dtn_imports','dtn_returns','dtn_paymentlogs','dtn_products','dtn_settings','dtn_staff_accounts','dtn_admin_cred'];
    collections.forEach(colName => {
      try {
        const ref = col(colName);
        const unsub = ref.onSnapshot({ includeMetadataChanges: false }, (snap) => {
          if (!_bootDone) return;
          // Chỉ xử lý thay đổi từ server (không phải local pending writes)
          const serverChanges = snap.docChanges().filter(ch => !ch.doc.metadata.hasPendingWrites);
          if (serverChanges.length === 0) return;
          const docs = snap.docs.map(d => d.data());
          applyCloudData(colName, docs, false);
          _lastSync = ts(); notifyStatus();
        }, (err) => {
          console.warn('[CLOUD] listener error:', colName, err.message);
        });
        _listeners.push(unsub);
      } catch(e) { console.warn('[CLOUD] startListeners error:', colName, e); }
    });
  }

  function stopListeners() {
    _listeners.forEach(fn => { try { fn(); } catch(e) {} });
    _listeners = [];
  }

  // ═══════════════════════════════════════════════════════════
  //  PUSH (ghi lên Firestore)
  // ═══════════════════════════════════════════════════════════
  async function pushCollection(colName, data) {
    if (!_db) return false;
    try {
      const rows = Array.isArray(data) ? data : [data];
      const ref   = col(colName);
      const now   = ts();

      if (rows.length === 0) return true; // không xoá — append-only

      // Firestore batch tối đa 500 ops, chia nhỏ nếu cần
      const chunks = [];
      for (let i = 0; i < rows.length; i += 400) chunks.push(rows.slice(i, i+400));

      for (const chunk of chunks) {
        const batch = _db.batch();
        chunk.forEach(r => {
          if (!r || !r.id) return;
          // merge:true → chỉ cập nhật field thay đổi, không xoá field khác
          batch.set(ref.doc(String(r.id)), { ...r, _updated: now }, { merge: true });
        });
        await batch.commit();
      }
      return true;
    } catch(e) {
      console.warn('[CLOUD] pushCollection error:', colName, e.message||e);
      return false;
    }
  }

  // ── Sync toàn bộ state lên Firestore ───────────────────────
  async function syncAll(S) {
    if (!_db || !_online) return false;
    _syncStatus = 'syncing'; notifyStatus();
    try {
      // Đọc staff accounts từ localStorage (AUTH quản lý trực tiếp, không trong S)
      const _staffForSync = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
      const _adminCredForSync = (() => { try { const v = localStorage.getItem('dtn_admin_cred'); return v ? [{ id: 'admin_cred', ...JSON.parse(v) }] : []; } catch(e) { return []; } })();
      await Promise.all([
        pushCollection('dtn_products',       S.products    || []),
        pushCollection('dtn_imports',        S.imports     || []),
        pushCollection('dtn_sales',          S.sales       || []),
        pushCollection('dtn_returns',        S.returns     || []),
        pushCollection('dtn_paymentlogs',    S.paymentlogs || []),
        pushCollection('dtn_settings',       [{ id:'settings', ...S.settings }]),
        pushCollection('dtn_staff_accounts', _staffForSync),
        pushCollection('dtn_admin_cred',     _adminCredForSync),
      ]);
      _syncStatus = 'ok'; _lastSync = ts(); notifyStatus();
      return true;
    } catch(e) {
      console.warn('[CLOUD] syncAll error:', e);
      _syncStatus = 'error'; notifyStatus();
      return false;
    }
  }

  // ── Queue / flush ───────────────────────────────────────────
  function enqueue(key, S) {
    _syncQueue = _syncQueue.filter(q => q.key !== key);
    _syncQueue.push({ key, ts: Date.now() });
    if (_online) flushQueue(S);
  }
  async function flushQueue(S_ref) {
    if (_flushing || !_online || !_db || _syncQueue.length === 0) return;
    _flushing = true;
    try {
      const S = S_ref || window._S;
      if (S) await syncAll(S);
      _syncQueue = [];
    } finally { _flushing = false; }
  }

  // ═══════════════════════════════════════════════════════════
  //  BOOT SYNC — pull cloud và merge vào local khi khởi động
  // ═══════════════════════════════════════════════════════════
  async function bootSync(S_state) {
    if (!_db || !_online || !_cfg.enabled) { _bootDone = true; return false; }
    _syncStatus = 'syncing'; notifyStatus();
    try {
      const pullCol = async (name) => {
        const snap = await col(name).get();
        return snap.docs.map(d => d.data());
      };
      const [products, imports, sales, returns, paymentlogs, settingsArr, staffArr, adminCredArr] = await Promise.all([
        pullCol('dtn_products'), pullCol('dtn_imports'),  pullCol('dtn_sales'),
        pullCol('dtn_returns'),  pullCol('dtn_paymentlogs'), pullCol('dtn_settings'),
        pullCol('dtn_staff_accounts'), pullCol('dtn_admin_cred'),
      ]);

      // Merge từng collection vào state hiện tại (không overwrite)
      if (products.length)    applyCloudData('dtn_products',        products,    true);
      if (imports.length)     applyCloudData('dtn_imports',         imports,     true);
      if (sales.length)       applyCloudData('dtn_sales',           sales,       true);
      if (returns.length)     applyCloudData('dtn_returns',         returns,     true);
      if (paymentlogs.length) applyCloudData('dtn_paymentlogs',     paymentlogs, true);
      if (settingsArr.length) applyCloudData('dtn_settings',        settingsArr, true);
      if (staffArr.length)    applyCloudData('dtn_staff_accounts',  staffArr,    true);
      if (adminCredArr.length) applyCloudData('dtn_admin_cred',      adminCredArr, true);

      _syncStatus = 'ok'; _lastSync = ts();
      _bootDone = true;
      notifyStatus();
      return true;
    } catch(e) {
      console.warn('[CLOUD] bootSync error:', e);
      _syncStatus = 'error';
      _bootDone = true;
      notifyStatus();
      return false;
    }
  }

  // ── Pull thủ công (nút "Kéo từ cloud") ─────────────────────
  async function pullAll() {
    if (!_db) return null;
    _syncStatus = 'syncing'; notifyStatus();
    try {
      const pullCol = async (name) => {
        const snap = await col(name).get();
        return snap.docs.map(d => { const v = d.data(); delete v._updated; return v; });
      };
      const [products, imports, sales, returns, paymentlogs, settingsArr, staffArr, adminCredArr] = await Promise.all([
        pullCol('dtn_products'), pullCol('dtn_imports'), pullCol('dtn_sales'),
        pullCol('dtn_returns'),  pullCol('dtn_paymentlogs'), pullCol('dtn_settings'),
        pullCol('dtn_staff_accounts'), pullCol('dtn_admin_cred')
      ]);
      const settings = settingsArr.length > 0
        ? (() => { const s = {...settingsArr[0]}; delete s.id; delete s._updated; return s; })()
        : null;
      _syncStatus = 'ok'; _lastSync = ts(); notifyStatus();
      return { products, imports, sales, returns, paymentlogs, settings, staff_accounts: staffArr, admin_cred: adminCredArr };
    } catch(e) {
      console.warn('[CLOUD] pullAll error:', e);
      _syncStatus = 'error'; notifyStatus();
      return null;
    }
  }

  // ── Test kết nối ────────────────────────────────────────────
  async function testConnection(apiKey, projectId, shopId) {
    try {
      if (typeof firebase === 'undefined') return { ok:false, msg:'Firebase SDK chưa tải được.' };
      let testApp;
      try {
        testApp = firebase.initializeApp({ apiKey, projectId, authDomain: projectId+'.firebaseapp.com' }, '__test__');
      } catch(e) { testApp = firebase.app('__test__'); }
      const testDb = firebase.firestore(testApp);
      await testDb.collection('shops').doc(shopId||'shop1').collection('dtn_settings').limit(1).get();
      return { ok:true, msg:'Kết nối Firebase thành công! 🔥' };
    } catch(e) {
      const msg = e.message || '';
      if (msg.includes('permission') || msg.includes('PERMISSION_DENIED'))
        return { ok:false, msg:'Lỗi quyền truy cập — kiểm tra Firestore Rules.' };
      if (msg.includes('not-found') || msg.includes('NOT_FOUND'))
        return { ok:true, msg:'Kết nối OK (collection trống, sẽ tự tạo khi sync).' };
      return { ok:false, msg: msg || 'Lỗi không xác định' };
    }
  }

  // ── 3-2-1 Backup (giữ nguyên) ──────────────────────────────
  const DAILY_KEY  = 'dtn_backup_daily';
  const DAILY_TIME = 'dtn_backup_daily_time';
  const REMIND_KEY = 'dtn_backup_remind';

  function runDailyBackup(exportFn) {
    try {
      const now = Date.now();
      const last = parseInt(localStorage.getItem(DAILY_TIME)||'0');
      if (now - last < 30*60*1000) return;
      const data = exportFn();
      const slot2 = localStorage.getItem(DAILY_KEY+'_2');
      const slot1 = localStorage.getItem(DAILY_KEY+'_1');
      if (slot2) { try { localStorage.setItem(DAILY_KEY+'_3', slot2); } catch(e) {} }
      if (slot1) { try { localStorage.setItem(DAILY_KEY+'_2', slot1); } catch(e) {} }
      localStorage.setItem(DAILY_KEY+'_1', data);
      localStorage.setItem(DAILY_TIME, String(now));
    } catch(e) { console.warn('[CLOUD] dailyBackup error:', e); }
  }
  function shouldRemindDownload() {
    try { return Date.now() - parseInt(localStorage.getItem(REMIND_KEY)||'0') > 7*24*60*60*1000; } catch(e) { return false; }
  }
  function markDownloaded() {
    try { localStorage.setItem(REMIND_KEY, String(Date.now())); } catch(e) {}
  }
  function getRotatingBackup(slot) {
    try { return localStorage.getItem(DAILY_KEY+'_'+slot)||null; } catch(e) { return null; }
  }
  function getRotatingBackupTime() {
    try { const v=localStorage.getItem(DAILY_TIME); return v?new Date(parseInt(v)).toISOString():null; } catch(e) { return null; }
  }

  // ── Init ────────────────────────────────────────────────────
  loadCfg();
  initClient();

  return {
    init: initClient,
    getCfg: () => ({ ..._cfg }),
    saveCfg(cfg) { saveCfg(cfg); stopListeners(); initClient(); },
    getStatus,
    onStatus(fn) { _statusListeners.push(fn); },
    push(key, S) {
      window._S = S;
      if (!_cfg?.enabled) return;
      enqueue(key, S);
    },
    // Push array có chứa _deleted records để đồng bộ xóa sang thiết bị khác
    _pushDeletedRecord(colName, arrayWithDeleted) {
      if (!_db || !_cfg?.enabled) return;
      pushCollection(colName, arrayWithDeleted).catch(e => console.warn('[CLOUD] pushDeleted error:', e));
    },
    syncAll: (S) => syncAll(S),
    pullAll,
    bootSync,       // ← dùng trong bootApp()
    startListeners, // ← gọi sau bootSync hoàn thành
    stopListeners,
    testConnection,
    runDailyBackup,
    shouldRemindDownload,
    markDownloaded,
    getRotatingBackup,
    getRotatingBackupTime,
  };
})();
// ═══════════════════════════════════════════════════════════════
//  AUTH — Hệ thống đăng nhập Admin / Nhân viên  (v7.5.0)
//  Cải tiến bảo mật:
//    1. Hash mật khẩu bằng SHA-256 (Web Crypto API)
//    2. Brute-force protection: lockout 5 phút sau 5 lần sai
//    3. Reset mật khẩu yêu cầu mã xác nhận 6 số (không tự động reset)
//    4. Tự động migrate mật khẩu plaintext sang hash khi login
// ═══════════════════════════════════════════════════════════════
const AUTH = (() => {
  const ADMIN_KEY   = 'dtn_admin_cred';
  const STAFF_KEY   = 'dtn_staff_accounts';
  const SESSION_KEY = 'dtn_session';
  const BF_KEY      = 'dtn_bf_lock'; // brute-force state

  let _sessionCache = null;

  // ── SHA-256 hash (async) ──────────────────────────────────────
  async function hashPw(password) {
    try {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(password + 'dtn_salt_2025'));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    } catch(e) {
      // Fallback: simple obfuscation nếu Web Crypto không khả dụng (HTTP context)
      let h = 0;
      const s = password + 'dtn_salt_2025';
      for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
      return 'fb_' + Math.abs(h).toString(16);
    }
  }

  // Sync wrapper — dùng khi không thể await (login check)
  function hashPwSync(password) {
    let h = 5381;
    const s = password + 'dtn_salt_2025';
    for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h |= 0; }
    return 'sync_' + Math.abs(h).toString(36);
  }

  // ── Brute-force protection ────────────────────────────────────
  const BF_MAX_ATTEMPTS = 5;
  const BF_LOCKOUT_MS   = 5 * 60 * 1000; // 5 phút

  function getBfState() {
    try { const v = localStorage.getItem(BF_KEY); return v ? JSON.parse(v) : { attempts: 0, lockedUntil: 0 }; } catch(e) { return { attempts: 0, lockedUntil: 0 }; }
  }
  function saveBfState(s) {
    try { localStorage.setItem(BF_KEY, JSON.stringify(s)); } catch(e) {}
  }
  function recordFailedAttempt() {
    const bf = getBfState();
    bf.attempts = (bf.attempts || 0) + 1;
    if (bf.attempts >= BF_MAX_ATTEMPTS) {
      bf.lockedUntil = Date.now() + BF_LOCKOUT_MS;
      bf.attempts = 0;
    }
    saveBfState(bf);
  }
  function clearFailedAttempts() {
    saveBfState({ attempts: 0, lockedUntil: 0 });
  }
  function getLockStatus() {
    const bf = getBfState();
    if (bf.lockedUntil && Date.now() < bf.lockedUntil) {
      const remaining = Math.ceil((bf.lockedUntil - Date.now()) / 1000);
      return { locked: true, remaining, attempts: 0 };
    }
    return { locked: false, remaining: 0, attempts: bf.attempts || 0 };
  }

  // ── Credential storage ────────────────────────────────────────
  function getAdminCred() {
    try { const v = localStorage.getItem(ADMIN_KEY); return v ? JSON.parse(v) : null; } catch(e) { return null; }
  }
  function saveAdminCred(username, passwordHash, isHashed) {
    try { localStorage.setItem(ADMIN_KEY, JSON.stringify({ username, password: passwordHash, hashed: isHashed !== false })); } catch(e) {}
  }
  function getStaffAccounts() {
    try { const v = localStorage.getItem(STAFF_KEY); return v ? JSON.parse(v) : []; } catch(e) { return []; }
  }
  function saveStaffAccounts(list) {
    try { localStorage.setItem(STAFF_KEY, JSON.stringify(list)); } catch(e) {}
  }

  // ── Session ───────────────────────────────────────────────────
  function getSession() {
    if (_sessionCache) return _sessionCache;
    try { const v = localStorage.getItem(SESSION_KEY); if (v) { _sessionCache = JSON.parse(v); return _sessionCache; } return null; } catch(e) { return null; }
  }
  function setSession(user) {
    _sessionCache = user;
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch(e) {}
  }
  function clearSession() {
    _sessionCache = null;
    try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
  }

  // ── Verify password (hỗ trợ cả hash và plaintext legacy) ─────
  function verifyPassword(inputPw, stored) {
    if (!stored) return false;
    // Nếu cred đã được hash → so sánh hash
    if (stored.hashed) {
      const h = hashPwSync(inputPw);
      return stored.password === h;
    }
    // Legacy plaintext — so sánh trực tiếp (sẽ migrate sau)
    return stored.password === inputPw;
  }

  // ── Migrate plaintext → hash nếu cần ─────────────────────────
  function migrateIfNeeded(inputPw, storedObj, saveFunc) {
    if (!storedObj.hashed && storedObj.password === inputPw) {
      // Chuyển sang hash ngay sau khi đăng nhập thành công
      const hashed = hashPwSync(inputPw);
      saveFunc(hashed, true);
    }
  }

  // ── Khởi tạo admin mặc định ───────────────────────────────────
  (function initAdminCred() {
    try {
      const raw = localStorage.getItem(ADMIN_KEY);
      if (!raw) {
        const hashed = hashPwSync('admin123');
        saveAdminCred('admin', hashed, true);
        return;
      }
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed.username !== 'string' || !parsed.username.trim() || !parsed.password) {
        const hashed = hashPwSync('admin123');
        saveAdminCred('admin', hashed, true);
      }
    } catch(e) {
      try {
        const hashed = hashPwSync('admin123');
        localStorage.setItem(ADMIN_KEY, JSON.stringify({ username: 'admin', password: hashed, hashed: true }));
      } catch(e2) {}
    }
  })();

  // ── Reset PIN (6 số, tạo mới mỗi lần gọi) ───────────────────
  let _resetPin = null;
  let _resetPinExpiry = 0;
  function generateResetPin() {
    _resetPin = String(Math.floor(100000 + Math.random() * 900000));
    _resetPinExpiry = Date.now() + 10 * 60 * 1000; // 10 phút
    return _resetPin;
  }
  function verifyResetPin(pin) {
    if (!_resetPin || Date.now() > _resetPinExpiry) return false;
    const ok = _resetPin === pin.trim();
    if (ok) { _resetPin = null; _resetPinExpiry = 0; } // dùng 1 lần
    return ok;
  }

  return {
    // ── Đăng nhập ──────────────────────────────────────────────
    login(username, password) {
      const lock = getLockStatus();
      if (lock.locked) return { error: `Tài khoản bị khoá ${lock.remaining} giây nữa do đăng nhập sai nhiều lần.` };

      const admin = getAdminCred();
      if (admin && admin.username === username && verifyPassword(password, admin)) {
        migrateIfNeeded(password, admin, (h, isH) => saveAdminCred(admin.username, h, isH));
        clearFailedAttempts();
        const user = { username, role: 'admin', displayName: 'Quản trị viên' };
        setSession(user);
        return user;
      }
      const staffList = getStaffAccounts();
      const staff = staffList.find(s => s.username === username && s.active && verifyPassword(password, s));
      if (staff) {
        // Migrate staff plaintext nếu cần
        if (!staff.hashed && staff.password === password) {
          const hashed = hashPwSync(password);
          const list = getStaffAccounts();
          const idx = list.findIndex(x => x.id === staff.id);
          if (idx >= 0) { list[idx].password = hashed; list[idx].hashed = true; saveStaffAccounts(list); }
        }
        clearFailedAttempts();
        const user = { username: staff.username, role: 'staff', displayName: staff.displayName || staff.username };
        setSession(user);
        return user;
      }
      recordFailedAttempt();
      const bfNow = getLockStatus();
      if (bfNow.locked) return { error: `Đăng nhập sai ${BF_MAX_ATTEMPTS} lần liên tiếp. Tài khoản bị khoá 5 phút.` };
      const attemptsLeft = BF_MAX_ATTEMPTS - bfNow.attempts;
      return null; // login fail — caller hiển thị lỗi chung, attemptsLeft dùng nếu muốn
    },
    getLockStatus,
    getRemainingAttempts() { const s = getLockStatus(); return s.locked ? 0 : BF_MAX_ATTEMPTS - s.attempts; },

    logout() { clearSession(); clearTimeout(_autoLogoutTimer); clearTimeout(_autoLogoutWarningTimer); },
    currentUser() { return getSession(); },
    isAdmin() { const u = getSession(); return u && u.role === 'admin'; },
    getAdminCred,

    // ── Đổi mật khẩu admin ────────────────────────────────────
    changeAdminPassword(oldPass, newPass) {
      const admin = getAdminCred();
      if (!admin) return false;
      if (!verifyPassword(oldPass, admin)) return false;
      if (!newPass || newPass.length < 6) return false;
      const hashed = hashPwSync(newPass);
      const updated = new Date().toISOString();
      try { localStorage.setItem(ADMIN_KEY, JSON.stringify({ ...admin, password: hashed, hashed: true, _updated: updated })); } catch(e) {}
      // Sync lên cloud
      try {
        if (typeof CLOUD !== 'undefined' && CLOUD.getCfg().enabled && typeof firebase !== 'undefined' && firebase.apps.length) {
          const db = firebase.firestore();
          const shopId = CLOUD.getCfg().shopId || 'shop1';
          db.collection('shops').doc(shopId).collection('dtn_admin_cred').doc('admin_cred')
            .set({ id:'admin_cred', username: admin.username, password: hashed, hashed: true, _updated: updated }, { merge: true })
            .catch(e => console.warn('[AUTH] cloud push admin_cred error:', e));
        }
      } catch(e) {}
      return true;
    },
    changeAdminUsername(newUsername, password) {
      const admin = getAdminCred();
      if (!admin) return false;
      if (!verifyPassword(password, admin)) return false;
      if (!newUsername || !newUsername.trim()) return false;
      const updated = new Date().toISOString();
      try { localStorage.setItem(ADMIN_KEY, JSON.stringify({ ...admin, username: newUsername.trim(), _updated: updated })); } catch(e) {}
      const sess = getSession();
      if (sess && sess.role === 'admin') { sess.username = newUsername.trim(); setSession(sess); }
      // Sync lên cloud
      try {
        if (typeof CLOUD !== 'undefined' && CLOUD.getCfg().enabled && typeof firebase !== 'undefined' && firebase.apps.length) {
          const db = firebase.firestore();
          const shopId = CLOUD.getCfg().shopId || 'shop1';
          db.collection('shops').doc(shopId).collection('dtn_admin_cred').doc('admin_cred')
            .set({ id:'admin_cred', username: newUsername.trim(), password: admin.password, hashed: admin.hashed !== false, _updated: updated }, { merge: true })
            .catch(e => console.warn('[AUTH] cloud push admin_cred error:', e));
        }
      } catch(e) {}
      return true;
    },

    // ── Reset PIN flow ─────────────────────────────────────────
    generateResetPin,
    verifyResetPin,
    resetPasswordWithPin(pin, newPass) {
      if (!verifyResetPin(pin)) return false;
      if (!newPass || newPass.length < 6) return false;
      const admin = getAdminCred();
      if (!admin) return false;
      const hashed = hashPwSync(newPass);
      saveAdminCred(admin.username, hashed, true);
      try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
      _sessionCache = null;
      return true;
    },

    // ── Staff management ───────────────────────────────────────
    getStaffAccounts,
    addStaff(username, password, displayName) {
      const list = getStaffAccounts();
      if (list.find(s => s.username === username)) return false;
      const admin = getAdminCred();
      if (admin && admin.username === username) return false;
      const hashed = hashPwSync(password);
      list.push({ id: 'st' + Date.now(), username, password: hashed, hashed: true, displayName: displayName || username, active: true, createdAt: new Date().toISOString() });
      saveStaffAccounts(list);
      // Đồng bộ lên cloud ngay sau khi thêm nhân viên
      try { if (typeof CLOUD !== 'undefined' && window._S) CLOUD.push('staff_accounts', window._S); } catch(e) {}
      return true;
    },
    updateStaff(id, fields) {
      const list = getStaffAccounts();
      const idx = list.findIndex(s => s.id === id);
      if (idx < 0) return false;
      // Nếu update password → hash trước
      if (fields.password) { fields.password = hashPwSync(fields.password); fields.hashed = true; }
      list[idx] = { ...list[idx], ...fields, _updated: new Date().toISOString() };
      saveStaffAccounts(list);
      // Đồng bộ lên cloud ngay sau khi cập nhật nhân viên
      try { if (typeof CLOUD !== 'undefined' && window._S) CLOUD.push('staff_accounts', window._S); } catch(e) {}
      return true;
    },
    deleteStaff(id) {
      const list = getStaffAccounts().filter(s => s.id !== id);
      saveStaffAccounts(list);
      // Đồng bộ lên cloud ngay sau khi xoá nhân viên
      try { if (typeof CLOUD !== 'undefined' && window._S) CLOUD.push('staff_accounts', window._S); } catch(e) {}
    },
    changeStaffPassword(id, oldPass, newPass) {
      const list = getStaffAccounts();
      const s = list.find(x => x.id === id);
      if (!s) return false;
      if (!verifyPassword(oldPass, s)) return false;
      s.password = hashPwSync(newPass);
      s.hashed = true;
      saveStaffAccounts(list);
      return true;
    }
  };
})();

          : '');

    let resetHtml = '';
    if (showReset) {
      if (resetStep === 1) {
        resetHtml = `<div style="margin-top:14px;padding:14px;background:rgba(91,143,232,0.08);border:1px solid rgba(91,143,232,0.3);border-radius:var(--r2)">
          <div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:8px">🔑 Đặt lại mật khẩu Admin</div>

          <div id="pinDisplay" style="font-size:28px;font-weight:700;letter-spacing:8px;color:var(--accent);text-align:center;padding:12px;background:var(--bg4);border-radius:var(--r2);border:2px dashed var(--accent);margin-bottom:10px">——————</div>
          <div style="display:flex;gap:8px">
            <button id="genPinBtn" class="btn btn-primary btn-sm" style="flex:1;justify-content:center">🎲 Tạo mã xác nhận</button>
            <button id="nextStepBtn" class="btn btn-sm" style="flex:1;justify-content:center;display:none">Tiếp tục →</button>
          </div>
        </div>`;
      } else {
        resetHtml = `<div style="margin-top:14px;padding:14px;background:rgba(91,143,232,0.08);border:1px solid rgba(91,143,232,0.3);border-radius:var(--r2)">
          <div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px">🔑 Nhập mã & mật khẩu mới</div>
          <div style="margin-bottom:10px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px">Mã xác nhận 6 số</label>
            <input id="pinInput" type="text" maxlength="6" placeholder="_ _ _ _ _ _" class="form-input" style="font-size:20px;letter-spacing:8px;text-align:center;font-weight:700" inputmode="numeric" />
          </div>
          <div style="margin-bottom:10px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px">Mật khẩu mới (≥6 ký tự)</label>
            <input id="newPw1" type="password" class="form-input" />
          </div>
          <div style="margin-bottom:12px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:5px">Xác nhận mật khẩu mới</label>
            <input id="newPw2" type="password" class="form-input" />
          </div>
          <div style="display:flex;gap:8px">
            <button id="confirmResetBtn" class="btn btn-primary btn-sm" style="flex:1;justify-content:center">✅ Đặt lại mật khẩu</button>
            <button id="cancelResetBtn" class="btn btn-sm">Huỷ</button>

      }
    }

    root.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px">
      <div style="width:100%;max-width:420px">
        <div style="text-align:center;margin-bottom:32px">
          <div style="width:64px;height:64px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;box-shadow:0 4px 16px rgba(201,168,76,0.3)">💎</div>
          <div style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--text)">Đá Tự Nhiên Linh Vũ</div>
          <div style="font-size:13px;color:var(--text2);margin-top:4px">Hệ thống quản lý v7.8.2</div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:28px">
          ${lockWarn}
          ${errMsg ? `<div style="background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);border-radius:var(--r2);padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:16px">❌ ${errMsg}</div>` : ''}
          ${successMsg ? `<div style="background:rgba(76,175,125,.1);border:1px solid rgba(76,175,125,.3);border-radius:var(--r2);padding:10px 14px;color:#4caf7d;font-size:13px;margin-bottom:16px">✅ ${successMsg}</div>` : ''}
          <div style="margin-bottom:16px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:6px">Tên đăng nhập</label>
            <input id="loginUser" type="text" placeholder="" class="form-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="font-size:15px" ${lockSt.locked ? 'disabled' : ''} />
          </div>
          <div style="margin-bottom:20px">
            <label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:6px">Mật khẩu</label>
            <input id="loginPass" type="password" placeholder="Mật khẩu" class="form-input" autocomplete="new-password" style="font-size:15px" ${lockSt.locked ? 'disabled' : ''} />
          </div>
          ${staffHint}
          <button id="loginBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:16px" ${lockSt.locked ? 'disabled' : ''}>🔐 Đăng nhập</button>
          <div style="margin-top:12px;text-align:center">
            <button id="resetBtn" style="background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:4px 8px">🔑 Quên mật khẩu</button>
          </div>
          ${resetHtml}
        </div>
      </div>
    </div>`;

    const userEl  = root.querySelector('#loginUser');
    const passEl  = root.querySelector('#loginPass');
    const btn     = root.querySelector('#loginBtn');
    const resetBtn = root.querySelector('#resetBtn');

    async function doLogin() {
      const u = (userEl?.value || '').trim();
      const p = passEl?.value || '';
      if (!u || !p) { errMsg = 'Vui lòng nhập đầy đủ thông tin!'; successMsg = ''; render(); return; }

      // ── Kiểm tra brute-force trước ─────────────────────────
      const lockCheck = AUTH.getLockStatus();
      if (lockCheck.locked) { errMsg = `Tài khoản bị khoá ${lockCheck.remaining} giây nữa.`; successMsg = ''; render(); return; }

      // ── Pull thông tin đăng nhập mới nhất từ cloud TRƯỚC khi validate ──
      // Để đảm bảo mật khẩu / tên đăng nhập đã thay đổi trên thiết bị khác được áp dụng
      try {
        const cloudCfg = CLOUD.getCfg();
        if (cloudCfg.enabled && typeof firebase !== 'undefined' && firebase.apps.length) {
          if (btn) { btn.disabled = true; btn.textContent = '🔄 Đang đồng bộ...'; }
          const db = firebase.firestore();
          const shopId = cloudCfg.shopId || 'shop1';
          const col = name => db.collection('shops').doc(shopId).collection(name);
          const [adminSnap, staffSnap] = await Promise.all([
            col('dtn_admin_cred').doc('admin_cred').get().catch(() => null),
            col('dtn_staff_accounts').get().catch(() => null),
          ]);
          // Apply admin_cred từ cloud (luôn dùng cloud nếu có — vì đây là lúc chưa đăng nhập)
          if (adminSnap && adminSnap.exists) {
            const { id, _updated, ...credData } = adminSnap.data();
            try { localStorage.setItem('dtn_admin_cred', JSON.stringify({ ...credData, _updated: _updated || '' })); } catch(e) {}
          }
          // Apply staff accounts từ cloud
          if (staffSnap && !staffSnap.empty) {
            const cloudStaff = staffSnap.docs.map(d => { const v = d.data(); return v; });
            try {
              const existing = (() => { try { const v = localStorage.getItem('dtn_staff_accounts'); return v ? JSON.parse(v) : []; } catch(e) { return []; } })();
              const map = {};
              existing.forEach(s => { if (s && s.id) map[s.id] = s; });
              cloudStaff.forEach(s => {
                if (!s || !s.id) return;
                const localTs = (map[s.id] && (map[s.id]._updated || map[s.id].createdAt)) || '';
                const cloudTs = s._updated || s.createdAt || '';
                if (!map[s.id] || cloudTs >= localTs) map[s.id] = s;
              });
              localStorage.setItem('dtn_staff_accounts', JSON.stringify(Object.values(map)));
            } catch(e) {}
          }
          if (btn) { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
        }
      } catch(e) {
        if (btn) { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
        // Không chặn login nếu pull lỗi — dùng local credential
      }

      const result = AUTH.login(u, p);
      if (result && result.error) { errMsg = result.error; successMsg = ''; render(); return; }
      if (result && !result.error) { bootApp(); return; }
      const left = AUTH.getRemainingAttempts();
      errMsg = left > 0 ? `Sai thông tin đăng nhập! (Còn ${left} lần thử)` : 'Sai thông tin đăng nhập!';
      successMsg = ''; render();
    }
    if (btn) btn.addEventListener('click', doLogin);
    if (passEl) passEl.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    if (userEl) userEl.addEventListener('keydown', e => { if (e.key === 'Enter' && passEl) passEl.focus(); });
    if (resetBtn) resetBtn.addEventListener('click', () => { showReset = !showReset; resetStep = 1; errMsg = ''; render(); });

    if (showReset && resetStep === 1) {
      const genBtn = root.querySelector('#genPinBtn');
      const pinDisplay = root.querySelector('#pinDisplay');
      const nextStepBtn = root.querySelector('#nextStepBtn');
      if (genBtn) {
        genBtn.addEventListener('click', () => {
          const pin = AUTH.generateResetPin();
          if (pinDisplay) pinDisplay.textContent = pin;
          if (nextStepBtn) nextStepBtn.style.display = '';
        });
      }
      if (nextStepBtn) nextStepBtn.addEventListener('click', () => { resetStep = 2; render(); });
    }
    if (showReset && resetStep === 2) {
      const confirmBtn = root.querySelector('#confirmResetBtn');
      const cancelBtn  = root.querySelector('#cancelResetBtn');
      if (confirmBtn) {
        confirmBtn.addEventListener('click', () => {
          const pin = (root.querySelector('#pinInput')?.value || '').trim();
          const pw1 = root.querySelector('#newPw1')?.value || '';
          const pw2 = root.querySelector('#newPw2')?.value || '';
          if (!pin) { errMsg = 'Vui lòng nhập mã xác nhận!'; render(); return; }
          if (pw1.length < 6) { errMsg = 'Mật khẩu mới phải có ít nhất 6 ký tự!'; render(); return; }
          if (pw1 !== pw2) { errMsg = 'Mật khẩu xác nhận không khớp!'; render(); return; }
          const ok = AUTH.resetPasswordWithPin(pin, pw1);
          if (!ok) { errMsg = 'Mã xác nhận không đúng hoặc đã hết hạn!'; render(); return; }
          showReset = false; resetStep = 1; errMsg = '';
          successMsg = '✅ Đặt lại mật khẩu thành công! Vui lòng đăng nhập lại.';
          render();
        });
      }
      if (cancelBtn) cancelBtn.addEventListener('click', () => { showReset = false; resetStep = 1; render(); });
    }

    // Không pre-fill username — để ô trống, tránh lộ tên đăng nhập
    if (userEl && !userEl.value) userEl.value = '';
    if (!lockSt.locked && userEl && !lockSt.locked) { setTimeout(() => userEl.focus(), 30); }
    setTimeout(() => { if (passEl && !lockSt.locked && userEl && userEl.value) passEl.focus(); }, 50);

    if (lockSt.locked) {
      const countdown = root.querySelector('#lockCountdown');
      if (countdown) {
        const iv = setInterval(() => {
          const now = AUTH.getLockStatus();
          if (!now.locked) { clearInterval(iv); render(); return; }
          countdown.textContent = now.remaining;
        }, 1000);
      }
    }
  }
  render();
}

// Helper: kiểm tra mật khẩu admin hỗ trợ cả hash lẫn legacy plaintext
function verifyAdminPwForDisplay(inputPw, cred) {
  if (!cred || !inputPw) return false;
  if (cred.hashed) {
    // Dùng cùng hashPwSync như AUTH nội bộ
    let h = 5381;
    const s = inputPw + 'dtn_salt_2025';
    for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h |= 0; }
    const hashed = 'sync_' + Math.abs(h).toString(36);
    return cred.password === hashed;
  }
  return cred.password === inputPw; // legacy plaintext
}

// ── Mobile-safe PDF opener ─────────────────────────────────────────
// Trên mobile, window.open thường bị block. Dùng blob URL để mở PDF
// và hiển thị nút "Chia sẻ" / "Tải về" thân thiện với điện thoại.
function openPdfMobile(htmlContent, filename) {
  try {
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isMobile) {
      // Hiển thị modal in-app thay vì popup mới
      const overlay = document.createElement('div');
      overlay.id = 'pdf-mobile-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0f1117;display:flex;flex-direction:column;overflow:hidden;';

      const topbar = document.createElement('div');
      topbar.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#161b27;border-bottom:1px solid #2a3245;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top,0px))';

      const title = document.createElement('span');
      title.style.cssText = 'font-size:14px;font-weight:700;color:#e8e6df';
      title.textContent = filename || 'Xem tài liệu';

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:8px;align-items:center';

      // Nút chia sẻ (Web Share API — hoạt động trên iOS/Android)
      if (navigator.share || navigator.canShare) {
        const btnShare = document.createElement('button');
        btnShare.style.cssText = 'padding:7px 14px;border-radius:7px;border:none;background:#c9a84c;color:#0f1117;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit';
        btnShare.textContent = '📤 Chia sẻ';
        btnShare.onclick = async () => {
          try {
            // Tạo blob PDF nếu browser hỗ trợ, fallback sang share URL
            const shareBlob = new Blob([htmlContent], { type: 'text/html' });
            const shareFile = new File([shareBlob], (filename||'document')+'.html', { type: 'text/html' });
            if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
              await navigator.share({ files: [shareFile], title: filename || 'Tài liệu' });
            } else {
              await navigator.share({ title: filename || 'Tài liệu', url: url });
            }
          } catch(e) { if (e.name !== 'AbortError') alert('Không thể chia sẻ: ' + e.message); }
        };
        btnRow.appendChild(btnShare);
      }

      // Nút in (hoạt động tốt trên mobile Chrome/Safari)
      const btnPrint = document.createElement('button');
      btnPrint.style.cssText = 'padding:7px 14px;border-radius:7px;border:1px solid #3a4560;background:#1e2535;color:#e8e6df;font-size:13px;cursor:pointer;font-family:inherit';
      btnPrint.textContent = '🖨️ In';
      btnPrint.onclick = () => {
        const iframe = overlay.querySelector('iframe');
        if (iframe) {
          try { iframe.contentWindow.print(); } catch(e) { window.open(url, '_blank'); }
        }
      };

      // Nút đóng — QUAN TRỌNG: phải giải phóng URL và cho phép tương tác lại app
      const btnClose = document.createElement('button');
      btnClose.style.cssText = 'padding:7px 12px;border-radius:7px;border:1px solid #3a4560;background:transparent;color:#9a9590;font-size:18px;cursor:pointer;line-height:1';
      btnClose.textContent = '✕';
      btnClose.onclick = () => {
        document.body.removeChild(overlay);
        URL.revokeObjectURL(url);
        document.body.style.overflow = ''; // khôi phục scroll
      };

      btnRow.appendChild(btnPrint);
      btnRow.appendChild(btnClose);
      topbar.appendChild(title);
      topbar.appendChild(btnRow);

      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.style.cssText = 'flex:1;width:100%;border:none;background:#fff;';
      iframe.onload = () => { URL.revokeObjectURL(url); };

      overlay.appendChild(topbar);
      overlay.appendChild(iframe);
      document.body.appendChild(overlay);
      document.body.style.overflow = 'hidden'; // chặn scroll nền

    } else {
      // Desktop: mở tab mới bình thường
      const w = window.open(url, '_blank');
      if (!w) {
        // Fallback: popup bị chặn, thử write trực tiếp
        const w2 = window.open('', '_blank', 'width=900,height=800');
        if (w2) { w2.document.write(htmlContent); w2.document.close(); }
        else { alert('Trình duyệt chặn popup. Vui lòng cho phép popup cho trang này.'); }
      }
    }
  } catch(e) {
    // Ultimate fallback
    console.error('[PDF] openPdfMobile error:', e);
    const w = window.open('', '_blank', 'width=900,height=800');
    if (w) { w.document.write(htmlContent); w.document.close(); }
  }
}

async function bootApp() {
  _raf = false;
  const root = document.getElementById('app');
  if (root) root.innerHTML = '';

  // ── Boot sync: pull cloud trước, merge vào local, rồi mới render ──
  window._S = S; // cần cho applyCloudData
  const cloudCfg = CLOUD.getCfg();
  if (cloudCfg.enabled) {
    // Hiển thị loading nhẹ
    if (root) root.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg,#0f1117)">
      <div style="text-align:center;color:#9a9590">
        <div style="font-size:32px;margin-bottom:12px">🔄</div>
        <div style="font-size:14px">Đang đồng bộ dữ liệu từ cloud...</div>
        <div style="font-size:12px;margin-top:6px;color:#5c5850">Vui lòng chờ</div>
      </div>
    </div>`;
    // Boot sync data + AI key song song
    await Promise.all([
      CLOUD.bootSync(S),
      // Pull AI config (Gemini/Claude key) từ cloud để đồng bộ về thiết bị này
      (typeof AICHAT !== 'undefined' && AICHAT.syncCfgFromCloud)
        ? AICHAT.syncCfgFromCloud().catch(() => {})
        : Promise.resolve(),
    ]);
    if (root) root.innerHTML = ''; // xoá loading
  }

  render();
  setTimeout(() => {
    if (typeof AICHAT !== 'undefined') AICHAT.init();
    // Bắt đầu realtime listener sau khi render xong
    if (cloudCfg.enabled) {
      setTimeout(() => {
        CLOUD.startListeners();
        // Heartbeat 30s — phòng khi onSnapshot mất kết nối (mobile sleep, mạng chập)
        let _hbIv = setInterval(() => {
          if (!document.hidden && AUTH.currentUser()) {
            try { CLOUD.bootSync(S).then(() => render()).catch(()=>{}); } catch(e) {}
          }
        }, 30000);
        // Khi app quay lại foreground: restart listener + pull ngay
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden && AUTH.currentUser() && cloudCfg.enabled) {
            CLOUD.stopListeners();
            CLOUD.startListeners();
            setTimeout(() => {
              try { CLOUD.bootSync(S).then(() => render()).catch(()=>{}); } catch(e) {}
            }, 300);
          }
        });
      }, 500);
    }
  }, 600);

  startAutoLogoutTimer();
}

const AUTO_LOGOUT_MS = 30 * 60 * 1000; // 30 phút
let _autoLogoutTimer = null;
let _autoLogoutWarningTimer = null;

function resetAutoLogoutTimer() {
  clearTimeout(_autoLogoutTimer);
  clearTimeout(_autoLogoutWarningTimer);
  if (!AUTH.currentUser()) return; // không set timer nếu chưa đăng nhập

  // Cảnh báo trước 2 phút
  _autoLogoutWarningTimer = setTimeout(() => {
    if (!AUTH.currentUser()) return;
    toast('⏰ Phiên làm việc sẽ hết hạn sau 2 phút do không hoạt động', 'info');
  }, AUTO_LOGOUT_MS - 2 * 60 * 1000);

  // Tự động lưu + đăng xuất
  _autoLogoutTimer = setTimeout(() => {
    if (!AUTH.currentUser()) return;
    // Lưu toàn bộ dữ liệu trước khi thoát
    try {
      ['products','imports','sales','shipping','settings','returns','paymentlogs'].forEach(k => save(k));
    } catch(e) {}
    AUTH.logout();
    _raf = false;
    S.confirm = null;
    S.modal = null;
    clearTimeout(_autoLogoutTimer);
    clearTimeout(_autoLogoutWarningTimer);
    showLoginScreen();
    // Hiển thị thông báo trên màn hình login
    setTimeout(() => {
      const root = document.getElementById('app');
      if (root) {
        const notice = document.createElement('div');
        notice.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(232,165,58,.15);border:1px solid rgba(232,165,58,.4);color:#e8a53a;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;text-align:center;max-width:320px;';
        notice.textContent = '⏱ Phiên làm việc đã hết hạn sau 30 phút. Dữ liệu đã được lưu tự động.';
        document.body.appendChild(notice);
        setTimeout(() => { if (notice.parentNode) notice.parentNode.removeChild(notice); }, 5000);
      }
    }, 300);
  }, AUTO_LOGOUT_MS);
}

function startAutoLogoutTimer() {
  // Reset timer khi có tương tác
  ['click','keydown','touchstart','mousemove','scroll'].forEach(evt => {
    document.addEventListener(evt, resetAutoLogoutTimer, { passive: true });
  });
  resetAutoLogoutTimer(); // bắt đầu đếm ngay
}

// ═══════════════════════════════════════════════════════════════
//  STORAGE — localStorage + LZ-String compression + quota guard
// ═══════════════════════════════════════════════════════════════
const DB = (() => {
  const mem = {};
  let lsOk = false;
  const APP_VERSION = '3.10.0';
  const KEYS = ['dtn_products','dtn_imports','dtn_sales','dtn_shipping','dtn_settings','dtn_returns','dtn_paymentlogs'];
  // Prefix để nhận biết dữ liệu đã nén
  const LZ_PREFIX = '\x00LZ:';

  try { localStorage.setItem('__chk','1'); localStorage.removeItem('__chk'); lsOk = true; } catch(e) {}

  // ── Compression helpers ──────────────────────────────────────
  function lzAvailable() { return typeof LZString !== 'undefined'; }

  function encode(v) {
    const json = JSON.stringify(v);
    if (!lzAvailable()) return json;
    try { return LZ_PREFIX + LZString.compress(json); } catch(e) { return json; }
  }

  function decode(raw) {
    if (!raw) return null;
    if (raw.startsWith(LZ_PREFIX)) {
      if (!lzAvailable()) {
        // LZString chưa load xong (hiếm) — trả null để fallback
        console.warn('[DB] LZString chưa sẵn sàng, bỏ qua dữ liệu nén');
        return null;
      }
      try { return JSON.parse(LZString.decompress(raw.slice(LZ_PREFIX.length))); } catch(e) { return null; }
    }
    // Dữ liệu cũ chưa nén — parse thẳng
    try { return JSON.parse(raw); } catch(e) { return null; }
  }

  // ── Tính dung lượng thực tế đang dùng (bytes) ───────────────
  function calcSizeBytes() {
    let size = 0;
    try {
      KEYS.forEach(k => { const v = localStorage.getItem(k); if(v) size += v.length * 2; }); // UTF-16 → ×2
    } catch(e) {}
    return size;
  }

  // ── Ghi localStorage, return true/false ─────────────────────
  function lsSet(k, encoded) {
    try {
      localStorage.setItem(k, encoded);
      localStorage.setItem('dtn_lastSaved', new Date().toISOString());
      return true;
    } catch(e) {
      // Lần 1 thất bại: dọn backup cũ rồi thử lại
      try {
        localStorage.removeItem('dtn_backup_auto');
        localStorage.removeItem('dtn_backup_time');
        localStorage.setItem(k, encoded);
        localStorage.setItem('dtn_lastSaved', new Date().toISOString());
        return true;
      } catch(e2) {
        return false; // Thực sự đầy
      }
    }
  }

  return {
    get(k, def) {
      try {
        if (lsOk) {
          const raw = localStorage.getItem(k);
          if (raw !== null) {
            const parsed = decode(raw);
            return parsed !== null ? parsed : def;
          }
          return k in mem ? mem[k] : def;
        }
        return k in mem ? mem[k] : def;
      } catch(e) { return k in mem ? mem[k] : def; }
    },

    // Trả về true = lưu OK, false = lưu thất bại (quota đầy)
    set(k, v) {
      mem[k] = v; // Luôn giữ in-memory
      if (!lsOk) return true; // in-memory only, chấp nhận
      const encoded = encode(v);
      const ok = lsSet(k, encoded);
      return ok;
    },

    isLocal() { return lsOk; },

    lastSaved() {
      try { return localStorage.getItem('dtn_lastSaved') || null; } catch(e) { return null; }
    },

    // Trả về KB (số thực) dựa trên byte thực của localStorage
    storageSize() {
      try {
        return (calcSizeBytes() / 1024).toFixed(1);
      } catch(e) { return '?'; }
    },

    // Trả về 'ok' | 'warning' | 'danger'
    storageWarning() {
      try {
        const kb = parseFloat(this.storageSize());
        if (isNaN(kb)) return 'ok';
        if (kb > 4500) return 'danger';   // > ~4.5MB
        if (kb > 3500) return 'warning';  // > ~3.5MB
        return 'ok';
      } catch(e) { return 'ok'; }
    },

    exportAll() {
      const obj = { _version: APP_VERSION, _exported: new Date().toISOString(), _device: navigator.userAgent.includes('iPhone') ? 'iPhone' : navigator.userAgent.includes('Mac') ? 'Mac' : 'Other' };
      KEYS.forEach(k => { const v = this.get(k, null); if (v) obj[k] = v; });
      return JSON.stringify(obj, null, 2);
    },
    exportCompact() {
      const obj = { _v: APP_VERSION, _t: Date.now() };
      KEYS.forEach(k => { const v = this.get(k, null); if (v) obj[k] = v; });
      return JSON.stringify(obj);
    },
    importAll(json) {
      try {
        const obj = JSON.parse(json);
        KEYS.forEach(k => { if (obj[k]) this.set(k, obj[k]); });
        return true;
      } catch(e) { return false; }
    },
    autoBackup() {
      try {
        if (!lsOk) return;
        const data = this.exportCompact();
        // Backup không nén để đọc lại được dù LZString lỗi
        localStorage.setItem('dtn_backup_auto', data);
        localStorage.setItem('dtn_backup_time', new Date().toISOString());
      } catch(e) {}
    },
    getAutoBackup() {
      try { return localStorage.getItem('dtn_backup_auto') || null; } catch(e) { return null; }
    },
    getAutoBackupTime() {
      try { return localStorage.getItem('dtn_backup_time') || null; } catch(e) { return null; }
    },

    // ── Auto-archive: tách data cũ > 12 tháng sang key archive ─
    // Gọi khi storageWarning() === 'danger'
    // Trả về { archivedSales, archivedImports } — số bản ghi đã archive
    archiveOldData() {
      try {
        if (!lsOk) return { archivedSales: 0, archivedImports: 0 };
        const cutoff = new Date();
        cutoff.setMonth(cutoff.getMonth() - 12);
        const cutoffStr = cutoff.toISOString().slice(0, 10); // 'YYYY-MM-DD'

        // Sales
        const sales = this.get('dtn_sales', []);
        const salesActive = sales.filter(x => (x.date || '') >= cutoffStr);
        const salesOld    = sales.filter(x => (x.date || '') <  cutoffStr);
        if (salesOld.length > 0) {
          // Merge với archive hiện tại
          const existArchive = this.get('dtn_sales_archive', []);
          const merged = [...existArchive, ...salesOld];
          lsSet('dtn_sales_archive', encode(merged));
          mem['dtn_sales'] = salesActive;
          lsSet('dtn_sales', encode(salesActive));
        }

        // Imports
        const imports = this.get('dtn_imports', []);
        const importsActive = imports.filter(x => (x.date || '') >= cutoffStr);
        const importsOld    = imports.filter(x => (x.date || '') <  cutoffStr);
        if (importsOld.length > 0) {
          const existArchive = this.get('dtn_imports_archive', []);
          const merged = [...existArchive, ...importsOld];
          lsSet('dtn_imports_archive', encode(merged));
          mem['dtn_imports'] = importsActive;
          lsSet('dtn_imports', encode(importsActive));
        }

        // Paymentlogs cũ
        const logs = this.get('dtn_paymentlogs', []);
        const logsActive = logs.filter(x => (x.date || '') >= cutoffStr);
        const logsOld    = logs.filter(x => (x.date || '') <  cutoffStr);
        if (logsOld.length > 0) {
          mem['dtn_paymentlogs'] = logsActive;
          lsSet('dtn_paymentlogs', encode(logsActive));
        }

        return { archivedSales: salesOld.length, archivedImports: importsOld.length };
      } catch(e) {
        console.error('[DB.archiveOldData]', e);
        return { archivedSales: 0, archivedImports: 0 };
      }
    }
  };
})();

//  UTILS

const fmt = n => new Intl.NumberFormat('vi-VN').format(Math.round(n) || 0);
const fmtQty = n => {
  if (n === undefined || n === null || n === '') return '0';
  const f = parseFloat(n);
  if (isNaN(f)) return '0';
  // Hiển thị tối đa 3 chữ số thập phân, bỏ số 0 thừa
  return f % 1 === 0 ? String(f) : parseFloat(f.toFixed(3)).toString();
};
const fmtS = n => {
  if (!n) return '0';
  if (n >= 1e9) return (n/1e9).toFixed(1).replace('.0','') + 'T';
  if (n >= 1e6) return (n/1e6).toFixed(1).replace('.0','') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return fmt(n);
};
const uid  = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const fmtD = s => {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  return `${d}/${m}/${y}`;
};
const pct = (buy, sell) => buy > 0 ? Math.round((sell - buy) / buy * 100) : 0;
const calcSale = (qty, price, vat) => {
  const sub = (parseFloat(qty) || 0) * (parseFloat(price) || 0);
  const vatAmt = Math.round(sub * (parseFloat(vat) || 0) / 100);
  return { sub, vatAmt, total: sub + vatAmt };
};
